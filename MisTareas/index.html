<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Tareas Diarias</title>
  <link rel="icon" href="icon1.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- Firebase Librerías -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F3EC;
      --warm-white: #FDFAF5;
      --ink: #1C1A17;
      --ink-light: #4A4640;
      --ink-muted: #9A9490;
      --amber: #D4820A;
      --amber-light: #F5C064;
      --amber-pale: #FDF0D8;
      --sage: #5A7A5C;
      --sage-pale: #E8F0E8;
      --rose: #C0584A;
      --rose-pale: #FAE8E6;
      --border: #E2DDD6;
      --shadow: rgba(28,26,23,0.08);
    }

    html { font-size: 16px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--ink);
      color: var(--cream);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--cream);
      white-space: nowrap;
    }

    .header-date {
      font-size: 0.68rem;
      font-weight: 300;
      color: var(--amber-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-hist {
      background: none;
      border: 1.5px solid rgba(245,192,100,0.4);
      color: var(--amber-light);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-hist:hover, .btn-hist.active {
      background: var(--amber-light);
      color: var(--ink);
      border-color: var(--amber-light);
    }

    /* ── MAIN ── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 12px 70px;
    }

    /* ── SECTIONS ── */
    .section {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow);
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .badge {
      background: var(--amber-pale);
      color: var(--amber);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 22px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
    }
    .badge.green { background: var(--sage-pale); color: var(--sage); }

    /* ── ADD TASK ── */
    .add-task-area { padding: 14px 12px; }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media (min-width: 480px) {
      .input-row { flex-direction: row; }
    }

    .task-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .task-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(212,130,10,0.1);
    }
    .task-input::placeholder { color: var(--ink-muted); }

    .btn-add {
      padding: 11px 20px;
      background: var(--amber);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      width: 100%;
    }
    @media (min-width: 480px) { .btn-add { width: auto; } }
    .btn-add:hover  { background: #B86E00; }
    .btn-add:active { transform: scale(0.97); }

    /* ── TASK LIST ── */
    .task-list { padding: 0 8px 8px; list-style: none; }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 4px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.15s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: var(--cream); }

    /* Drag & Drop */
    .task-item.dragging {
      opacity: 0.4;
      background: var(--amber-pale);
    }
    .task-item.drag-over {
      border-top: 2px solid var(--amber);
      background: var(--amber-pale);
    }

    /* Handle de arrastre */
    .drag-handle {
      cursor: grab;
      color: var(--ink-muted);
      font-size: 1rem;
      flex-shrink: 0;
      padding: 2px 2px 0;
      user-select: none;
      display: flex;
      align-items: center;
      min-height: 32px;
      touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; }

    /* custom checkbox */
    .task-check {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 1px;
    }
    .task-check:checked { background: var(--sage); border-color: var(--sage); }
    .task-check:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 6px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .task-check:hover:not(:checked) { border-color: var(--sage); }

    .task-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .task-label {
      font-size: 0.92rem;
      color: var(--ink-light);
      line-height: 1.45;
      word-break: break-word;
    }
    .task-item.completed .task-label {
      text-decoration: line-through;
      color: var(--ink-muted);
    }

    /* Fila de acciones */
    .task-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .task-date {
      font-size: 0.7rem;
      color: var(--ink-muted);
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .btn-move {
      background: var(--amber-pale);
      color: var(--amber);
      border: 1px solid rgba(212,130,10,0.2);
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      min-height: 30px;
    }
    .btn-move:hover { background: var(--amber-light); color: var(--ink); }

    /* Botón editar */
    .btn-edit {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 0.85rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      min-height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-edit:hover { color: var(--amber); background: var(--amber-pale); }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 0.9rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      min-height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete:hover { color: var(--rose); background: var(--rose-pale); }

    /* ── INLINE EDIT ── */
    .edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .edit-input {
      flex: 1;
      min-width: 120px;
      padding: 6px 10px;
      border: 1.5px solid var(--amber);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      box-shadow: 0 0 0 3px rgba(212,130,10,0.1);
    }
    .btn-save {
      padding: 6px 14px;
      background: var(--sage);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-save:hover { background: #4a6a4c; }
    .btn-cancel-edit {
      padding: 6px 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: var(--ink-muted);
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel-edit:hover { background: var(--cream); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 22px 16px;
      color: var(--ink-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ── FIN DEL DÍA ── */
    .end-day-area { padding: 0 12px 14px; }

    .btn-end-day {
      width: 100%;
      padding: 12px 10px;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      color: var(--ink-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.83rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      line-height: 1.45;
    }
    .btn-end-day:hover {
      border-color: var(--rose);
      color: var(--rose);
      background: var(--rose-pale);
    }

    /* ── HISTORIAL ── */
    #view-historial { display: none; }
    #view-historial.visible { display: block; }
    #view-principal { display: block; }
    #view-principal.hidden { display: none; }

    .hist-group { margin-bottom: 2px; }

    .hist-date-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 0.92rem;
      color: var(--ink);
      padding: 12px 16px 9px;
      border-bottom: 1px solid var(--border);
      background: var(--cream);
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      transition: background 0.15s;
    }
    .hist-item:last-child { border-bottom: none; }
    .hist-item:hover { background: var(--cream); }

    .hist-dot {
      width: 8px; height: 8px; min-width: 8px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
    }

    .hist-task { flex: 1; color: var(--ink-light); word-break: break-word; }
    .hist-check-icon { color: var(--sage); font-size: 0.85rem; flex-shrink: 0; }

    .btn-move-pend {
      background: var(--amber-pale);
      color: var(--amber);
      border: 1px solid rgba(212,130,10,0.2);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      min-height: 30px;
    }
    .btn-move-pend:hover { background: var(--amber-light); color: var(--ink); }

    .btn-date-edit {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 0.9rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      min-height: 30px;
      min-width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-date-edit:hover { color: var(--amber); background: var(--amber-pale); }

    .btn-return {
      background: var(--sage-pale);
      color: var(--sage);
      border: 1px solid rgba(90,122,92,0.2);
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      min-height: 30px;
      flex-shrink: 0;
    }
    .btn-return:hover { background: var(--sage); color: #fff; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: var(--cream);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- Barra de sincronización -->
<div id="sync-bar" style="background: #1C1A17; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 5px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);">
  <span id="sync-user-text" style="display:none; font-size: 10px; color: rgba(255,255,255,.35); font-family: 'DM Sans', sans-serif;"></span>
  <button id="btn-signout" style="display:none; background:none; border:none; color:rgba(255,255,255,.25); cursor:pointer; font-size:10px; text-transform:uppercase;" onclick="fbSignOut()">Cerrar sesión</button>
  <button id="btn-sync" class="btn-hist" onclick="handleSync()">
    <span id="sync-icon">☁</span> <span id="sync-label">Sincronizar tareas</span>
  </button>
</div>

<header>
  <div class="header-left">
    <h1>📋 Mis Tareas</h1>
    <span class="header-date" id="header-date"></span>
  </div>
  <button class="btn-hist" id="btn-toggle-hist" onclick="toggleHistorial()">📂 Historial</button>
</header>

<main>

  <!-- ══ VISTA PRINCIPAL ══ -->
  <div id="view-principal">

    <!-- Añadir tarea -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">✏️ Nueva Tarea</span>
      </div>
      <div class="add-task-area">
        <div class="input-row">
          <input type="text" class="task-input" id="nueva-tarea"
            placeholder="Escribe una tarea y pulsa Añadir…"
            onkeydown="if(event.key==='Enter') agregarTarea()"/>
          <button class="btn-add" onclick="agregarTarea()">Añadir</button>
        </div>
      </div>
    </div>

    <!-- Pendientes de días anteriores -->
    <div class="section" id="sec-pendientes">
      <div class="section-header">
        <span class="section-title">⏳ Pendientes anteriores</span>
        <span class="badge" id="badge-pend">0</span>
      </div>
      <ul class="task-list" id="list-pendientes"></ul>
    </div>

    <!-- Tareas del día -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">☀️ Tareas de hoy</span>
        <span class="badge green" id="badge-hoy">0</span>
      </div>
      <ul class="task-list" id="list-hoy"></ul>
      <div class="end-day-area">
        <button class="btn-end-day" onclick="finalizarDia()">
          🌙 Cerrar el día — mover tareas no realizadas a pendientes
        </button>
      </div>
    </div>

  </div><!-- /view-principal -->

  <!-- ══ VISTA HISTORIAL ══ -->
  <div id="view-historial">
    <div class="section">
      <div class="section-header">
        <span class="section-title">✅ Historial de tareas realizadas</span>
        <span class="badge green" id="badge-hist">0</span>
      </div>
      <div id="hist-content"></div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
  // Configuración de Firebase
  var firebaseConfig = {
    apiKey: "AIzaSyCxWOvUeB7P1u8URxYL_cMhj5fuXP7qfCs",
    authDomain: "castroverde-apps.firebaseapp.com",
    projectId: "castroverde-apps",
    storageBucket: "castroverde-apps.firebasestorage.app",
    messagingSenderId: "371026533141",
    appId: "1:371026533141:web:315767f60cbf8d6f47671c"
  };

  firebase.initializeApp(firebaseConfig);
  var fbAuth = firebase.auth();
  var fbDb = firebase.firestore();
  var fbProvider = new firebase.auth.GoogleAuthProvider();
  var fbUser = null;

  const KEY_HOY        = 'tareasHoy';
  const KEY_PEND       = 'tareasPendientes';
  const KEY_REALIZADAS = 'tareasRealizadas';

  function hoy() { return new Date().toISOString().split('T')[0]; }

  function formatFechaLeg(fechaISO) {
    const [y, m, d] = fechaISO.split('-');
    const meses = ['ene','feb','mar','abr','may','jun',
                   'jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
  }

  function cargar(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; }
    catch { return []; }
  }

  function guardar(key, val) { 
    localStorage.setItem(key, JSON.stringify(val));
    // Los cambios locales se suben solo cuando el usuario pulsa Sincronizar
    // (no hay auto-guardado automático para evitar conflictos de timestamp)
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function setHeaderDate() {
    const d = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('header-date').textContent =
      d.toLocaleDateString('es-ES', opts);
  }

  function escHtml(str) {
    return str
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Funciones de sincronización con la nube ──

  // Sube los datos locales a Firebase (solo se llama cuando queremos guardar)
  function subirANube(silencioso) {
    if (!fbUser) return Promise.resolve();
    const datos = {
      hoy: cargar(KEY_HOY),
      pendientes: cargar(KEY_PEND),
      realizadas: cargar(KEY_REALIZADAS),
      lastUpdate: new Date().getTime()
    };
    return fbDb.collection('usuarios').doc(fbUser.uid).set({ gestorTareas: datos }, { merge: true })
      .then(function() {
        if (!silencioso) showToast("✅ Tareas guardadas en la nube");
      })
      .catch(function(e) { console.error(e); if (!silencioso) showToast("❌ Error al guardar"); });
  }

  // Aplica los datos de la nube al localStorage y refresca la UI
  function aplicarDatosNube(d) {
    localStorage.setItem(KEY_HOY,        JSON.stringify(d.hoy        || []));
    localStorage.setItem(KEY_PEND,       JSON.stringify(d.pendientes || []));
    localStorage.setItem(KEY_REALIZADAS, JSON.stringify(d.realizadas || []));
    renderHoy();
    renderPendientes();
    if (document.getElementById('view-historial').classList.contains('visible')) renderHistorial();
  }

  // Sincronización bidireccional real:
  // 1. Descarga los datos de la nube (recibe cambios de otros dispositivos)
  // 2. Fusiona con lo local: gana siempre el más reciente por lista
  // 3. Sube el resultado fusionado
  function sincronizarBidireccional() {
    if (!fbUser) return;
    var btnSync = document.getElementById('btn-sync');
    if (btnSync) btnSync.disabled = true;
    showToast("🔄 Sincronizando…");

    fbDb.collection('usuarios').doc(fbUser.uid).get()
      .then(function(doc) {
        // Si no hay nada en la nube, subimos lo local directamente
        if (!doc.exists || !doc.data().gestorTareas) {
          return subirANube(false);
        }

        var d = doc.data().gestorTareas;
        var tsNube = d.lastUpdate || 0;

        // Comparamos por timestamp: la fuente más reciente gana
        // Para cada lista, tomamos la versión más reciente (nube vs local)
        // No podemos fusionar tarea a tarea sin IDs únicos, así que
        // elegimos la versión completa más reciente de cada lista individualmente
        // usando el timestamp global de la nube vs el de la última subida local.
        var tsLocalSubida = parseInt(localStorage.getItem('gestorUltimaSubida')) || 0;

        var hayDatosNubeRecientes = tsNube > tsLocalSubida;

        if (hayDatosNubeRecientes) {
          // La nube tiene cambios que no están en local → aplicar nube
          aplicarDatosNube(d);
          // Guardamos cuándo fue la última subida que conocemos
          localStorage.setItem('gestorUltimaSubida', tsNube);
          showToast("📲 Datos actualizados desde la nube");
        } else {
          // Local es igual o más reciente → subir
          return subirANube(false).then(function() {
            localStorage.setItem('gestorUltimaSubida', new Date().getTime());
          });
        }
      })
      .catch(function(e) {
        console.error(e);
        showToast("❌ Error al sincronizar");
      })
      .finally(function() {
        if (btnSync) btnSync.disabled = false;
      });
  }

  // Gestión del estado de usuario
  fbAuth.onAuthStateChanged(function(user) {
    fbUser = user;
    const userText = document.getElementById('sync-user-text');
    const btnSignout = document.getElementById('btn-signout');
    const syncLabel = document.getElementById('sync-label');

    if (user) {
      userText.style.display = 'inline';
      userText.textContent = user.displayName || user.email;
      btnSignout.style.display = 'inline';
      syncLabel.textContent = "Sincronizar";
      // Al iniciar sesión: sincronización bidireccional automática
      sincronizarBidireccional();
    } else {
      userText.style.display = 'none';
      btnSignout.style.display = 'none';
      syncLabel.textContent = "Sincronizar tareas";
    }
  });

  function handleSync() {
    if (!fbUser) {
      fbAuth.signInWithPopup(fbProvider)
        .then(function() { showToast("Sesión iniciada"); })
        .catch(function(e) { showToast("Error al conectar: " + e.message); });
    } else {
      sincronizarBidireccional();
    }
  }

  function fbSignOut() {
    fbAuth.signOut().then(() => {
      fbUser = null;
      showToast("Sesión cerrada");
    });
  }

  /* ══════════════════════════════════════
     RENDER TAREAS DE HOY (con drag & drop)
  ══════════════════════════════════════ */
  function renderHoy() {
    const tareas = cargar(KEY_HOY);
    const ul = document.getElementById('list-hoy');
    ul.innerHTML = '';
    document.getElementById('badge-hoy').textContent = tareas.length;

    if (!tareas.length) {
      ul.innerHTML = '<li class="empty-state">Sin tareas para hoy 🎉</li>';
      return;
    }

    tareas.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.dataset.index = i;
      li.draggable = true;

      li.innerHTML = `
        <span class="drag-handle" title="Arrastrar para reordenar">⠿</span>
        <input type="checkbox" class="task-check" id="hoy-${i}"
          onchange="completarTarea(${i})"/>
        <div class="task-body">
          <label class="task-label" for="hoy-${i}" id="label-hoy-${i}">${escHtml(t.texto)}</label>
          <div class="task-actions" id="actions-hoy-${i}">
            <button class="btn-move-pend" title="Mover a pendientes"
              onclick="moverAPendientes(${i})">⏳ A pendientes</button>
            <button class="btn-edit" title="Editar tarea"
              onclick="iniciarEdicion('hoy', ${i})">✏️</button>
            <button class="btn-delete" title="Eliminar tarea"
              onclick="eliminarHoy(${i})">✕</button>
          </div>
        </div>`;

      // Drag events
      li.addEventListener('dragstart', onDragStart);
      li.addEventListener('dragover',  onDragOver);
      li.addEventListener('dragleave', onDragLeave);
      li.addEventListener('drop',      onDrop);
      li.addEventListener('dragend',   onDragEnd);

      ul.appendChild(li);
    });
  }

  /* ── Drag & Drop helpers ── */
  let dragSrcIndex = null;

  function onDragStart(e) {
    dragSrcIndex = parseInt(this.dataset.index);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }
  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('#list-hoy .task-item').forEach(el => el.classList.remove('drag-over'));
    this.classList.add('drag-over');
  }
  function onDragLeave() {
    this.classList.remove('drag-over');
  }
  function onDrop(e) {
    e.stopPropagation();
    const targetIndex = parseInt(this.dataset.index);
    if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
    const tareas = cargar(KEY_HOY);
    const [moved] = tareas.splice(dragSrcIndex, 1);
    tareas.splice(targetIndex, 0, moved);
    guardar(KEY_HOY, tareas);
    renderHoy();
    showToast('↕️ Orden actualizado');
  }
  function onDragEnd() {
    document.querySelectorAll('#list-hoy .task-item').forEach(el => {
      el.classList.remove('dragging', 'drag-over');
    });
    dragSrcIndex = null;
  }

  /* ══════════════════════════════════════
     RENDER PENDIENTES
  ══════════════════════════════════════ */
  function renderPendientes() {
    const tareas = cargar(KEY_PEND);
    const ul = document.getElementById('list-pendientes');
    ul.innerHTML = '';
    document.getElementById('badge-pend').textContent = tareas.length;

    if (!tareas.length) {
      ul.innerHTML = '<li class="empty-state">Sin pendientes de días anteriores 👍</li>';
      return;
    }

    tareas.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div class="task-body">
          <span class="task-label" id="label-pend-${i}">${escHtml(t.texto)}</span>
          <div class="task-actions" id="actions-pend-${i}">
            <span class="task-date">📅 ${formatFechaLeg(t.fecha)}</span>
            <button class="btn-move" onclick="moverAHoy(${i})">▶ Mover a hoy</button>
            <button class="btn-edit" title="Editar tarea"
              onclick="iniciarEdicion('pend', ${i})">✏️</button>
            <button class="btn-delete" title="Eliminar"
              onclick="eliminarPendiente(${i})">✕</button>
          </div>
        </div>`;
      ul.appendChild(li);
    });
  }

  /* ══════════════════════════════════════
     RENDER HISTORIAL
  ══════════════════════════════════════ */
  function renderHistorial() {
    const tareas = cargar(KEY_REALIZADAS);
    const cont = document.getElementById('hist-content');
    document.getElementById('badge-hist').textContent = tareas.length;

    if (!tareas.length) {
      cont.innerHTML = '<div class="empty-state" style="padding:28px">No hay tareas completadas aún.</div>';
      return;
    }

    const ordenadas = [...tareas].sort((a, b) => b.fecha.localeCompare(a.fecha));

    // Construir mapa fecha -> índices originales
    const grupos = {};
    tareas.forEach((t, originalIndex) => {
      if (!grupos[t.fecha]) grupos[t.fecha] = [];
      grupos[t.fecha].push({ ...t, originalIndex });
    });

    // Ordenar fechas descendente
    const fechasOrdenadas = Object.keys(grupos).sort((a,b) => b.localeCompare(a));

    let html = '';
    fechasOrdenadas.forEach(fecha => {
      html += `<div class="hist-group">
        <div class="hist-date-heading">📅 ${formatFechaLeg(fecha)}</div>`;
      grupos[fecha].forEach(t => {
        html += `<div class="hist-item" id="hist-item-${t.originalIndex}">
          <span class="hist-dot"></span>
          <span class="hist-task" id="hist-label-${t.originalIndex}">${escHtml(t.texto)}</span>
          <button class="btn-return" title="Devolver a tareas de hoy"
            onclick="devolverAHoy(${t.originalIndex})">↩ A hoy</button>
          <button class="btn-date-edit" title="Cambiar fecha"
            onclick="editarFechaHist(${t.originalIndex}, '${t.fecha}')">📅</button>
          <button class="btn-edit" title="Editar tarea"
            onclick="iniciarEdicion('hist', ${t.originalIndex})">✏️</button>
          <span class="hist-check-icon">✓</span>
        </div>`;
      });
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  /* ══════════════════════════════════════
     EDICIÓN INLINE GENÉRICA
  ══════════════════════════════════════ */
  function iniciarEdicion(tipo, idx) {
    let labelEl, actionsEl, textoActual;

    if (tipo === 'hoy') {
      labelEl   = document.getElementById(`label-hoy-${idx}`);
      actionsEl = document.getElementById(`actions-hoy-${idx}`);
      textoActual = cargar(KEY_HOY)[idx]?.texto || '';
    } else if (tipo === 'pend') {
      labelEl   = document.getElementById(`label-pend-${idx}`);
      actionsEl = document.getElementById(`actions-pend-${idx}`);
      textoActual = cargar(KEY_PEND)[idx]?.texto || '';
    } else if (tipo === 'hist') {
      // Para historial usamos estructura diferente
      const itemEl = document.getElementById(`hist-item-${idx}`);
      labelEl = document.getElementById(`hist-label-${idx}`);
      textoActual = cargar(KEY_REALIZADAS)[idx]?.texto || '';
      // Ocultar label y botón editar/check, mostrar inline editor
      itemEl.innerHTML = `
        <span class="hist-dot"></span>
        <div class="edit-row" style="flex:1">
          <input class="edit-input" id="edit-hist-${idx}" value="${escHtml(textoActual)}"
            onkeydown="if(event.key==='Enter') guardarEdicion('hist',${idx}); if(event.key==='Escape') cancelarEdicion('hist',${idx})"/>
          <button class="btn-save" onclick="guardarEdicion('hist',${idx})">Guardar</button>
          <button class="btn-cancel-edit" onclick="cancelarEdicion('hist',${idx})">Cancelar</button>
        </div>`;
      setTimeout(() => {
        const inp = document.getElementById(`edit-hist-${idx}`);
        if (inp) { inp.focus(); inp.select(); }
      }, 50);
      return;
    }

    // Hoy y Pendientes
    labelEl.style.display = 'none';
    actionsEl.style.display = 'none';

    const editRow = document.createElement('div');
    editRow.className = 'edit-row';
    editRow.id = `edit-row-${tipo}-${idx}`;
    editRow.innerHTML = `
      <input class="edit-input" id="edit-input-${tipo}-${idx}" value="${escHtml(textoActual)}"
        onkeydown="if(event.key==='Enter') guardarEdicion('${tipo}',${idx}); if(event.key==='Escape') cancelarEdicion('${tipo}',${idx})"/>
      <button class="btn-save" onclick="guardarEdicion('${tipo}',${idx})">Guardar</button>
      <button class="btn-cancel-edit" onclick="cancelarEdicion('${tipo}',${idx})">Cancelar</button>`;

    actionsEl.parentNode.insertBefore(editRow, actionsEl);
    setTimeout(() => {
      const inp = document.getElementById(`edit-input-${tipo}-${idx}`);
      if (inp) { inp.focus(); inp.select(); }
    }, 50);
  }

  function guardarEdicion(tipo, idx) {
    let inputEl;
    if (tipo === 'hist') {
      inputEl = document.getElementById(`edit-hist-${idx}`);
    } else {
      inputEl = document.getElementById(`edit-input-${tipo}-${idx}`);
    }
    if (!inputEl) return;
    const nuevoTexto = inputEl.value.trim();
    if (!nuevoTexto) { inputEl.focus(); return; }

    if (tipo === 'hoy') {
      const tareas = cargar(KEY_HOY);
      if (tareas[idx]) { tareas[idx].texto = nuevoTexto; guardar(KEY_HOY, tareas); }
      renderHoy();
    } else if (tipo === 'pend') {
      const tareas = cargar(KEY_PEND);
      if (tareas[idx]) { tareas[idx].texto = nuevoTexto; guardar(KEY_PEND, tareas); }
      renderPendientes();
    } else if (tipo === 'hist') {
      const tareas = cargar(KEY_REALIZADAS);
      if (tareas[idx]) { tareas[idx].texto = nuevoTexto; guardar(KEY_REALIZADAS, tareas); }
      renderHistorial();
    }
    showToast('✏️ Tarea actualizada');
  }

  function cancelarEdicion(tipo, idx) {
    if (tipo === 'hoy') renderHoy();
    else if (tipo === 'pend') renderPendientes();
    else if (tipo === 'hist') renderHistorial();
  }

  /* ══════════════════════════════════════
     AGREGAR TAREA
  ══════════════════════════════════════ */
  function agregarTarea() {
    const inp = document.getElementById('nueva-tarea');
    const texto = inp.value.trim();
    if (!texto) { inp.focus(); return; }
    const tareas = cargar(KEY_HOY);
    tareas.push({ texto, fecha: hoy() });
    guardar(KEY_HOY, tareas);
    inp.value = '';
    inp.focus();
    renderHoy();
    showToast('✅ Tarea añadida');
  }

  /* ── Completar tarea ── */
  function completarTarea(i) {
    const tareas = cargar(KEY_HOY);
    const realizadas = cargar(KEY_REALIZADAS);
    realizadas.push({ texto: tareas[i].texto, fecha: hoy() });
    guardar(KEY_REALIZADAS, realizadas);
    tareas.splice(i, 1);
    guardar(KEY_HOY, tareas);
    renderHoy();
    showToast('🎉 ¡Tarea completada!');
  }

  /* ── Mover tarea de hoy a pendientes ── */
  function moverAPendientes(i) {
    const tareas = cargar(KEY_HOY);
    const tarea = tareas.splice(i, 1)[0];
    guardar(KEY_HOY, tareas);
    const pend = cargar(KEY_PEND);
    pend.push({ texto: tarea.texto, fecha: hoy() });
    guardar(KEY_PEND, pend);
    renderHoy();
    renderPendientes();
    showToast('⏳ Tarea movida a pendientes');
  }

  /* ── Editar fecha en historial ── */
  function editarFechaHist(idx, fechaActual) {
    const itemEl = document.getElementById(`hist-item-${idx}`);
    if (!itemEl) return;
    const tareas = cargar(KEY_REALIZADAS);
    const textoActual = tareas[idx]?.texto || '';
    itemEl.innerHTML = `
      <span class="hist-dot"></span>
      <span class="hist-task">${escHtml(textoActual)}</span>
      <div class="edit-row" style="flex-shrink:0; gap:6px;">
        <input type="date" class="edit-input" id="edit-fecha-hist-${idx}"
          value="${fechaActual}" style="width:150px; min-width:unset; padding:5px 8px; font-size:0.85rem;"/>
        <button class="btn-save" onclick="guardarFechaHist(${idx})">Guardar</button>
        <button class="btn-cancel-edit" onclick="renderHistorial()">Cancelar</button>
      </div>`;
    setTimeout(() => {
      const inp = document.getElementById(`edit-fecha-hist-${idx}`);
      if (inp) inp.focus();
    }, 50);
  }

  function guardarFechaHist(idx) {
    const inp = document.getElementById(`edit-fecha-hist-${idx}`);
    if (!inp) return;
    const nuevaFecha = inp.value;
    if (!nuevaFecha) { inp.focus(); return; }
    const tareas = cargar(KEY_REALIZADAS);
    if (tareas[idx]) { tareas[idx].fecha = nuevaFecha; guardar(KEY_REALIZADAS, tareas); }
    renderHistorial();
    showToast('📅 Fecha actualizada');
  }

  /* ── Eliminar tarea de hoy ── */
  function eliminarHoy(i) {
    const tareas = cargar(KEY_HOY);
    tareas.splice(i, 1);
    guardar(KEY_HOY, tareas);
    renderHoy();
    showToast('🗑 Tarea eliminada');
  }

  /* ── Mover pendiente a hoy ── */
  function moverAHoy(i) {
    const pend = cargar(KEY_PEND);
    const tarea = pend.splice(i, 1)[0];
    guardar(KEY_PEND, pend);
    const tareas = cargar(KEY_HOY);
    tareas.push({ texto: tarea.texto, fecha: hoy() });
    guardar(KEY_HOY, tareas);
    renderPendientes();
    renderHoy();
    showToast('📅 Tarea movida a hoy');
  }

  /* ── Eliminar pendiente ── */
  function eliminarPendiente(i) {
    const pend = cargar(KEY_PEND);
    pend.splice(i, 1);
    guardar(KEY_PEND, pend);
    renderPendientes();
    showToast('🗑 Tarea eliminada');
  }

  /* ── Finalizar día ── */
  function finalizarDia() {
    const tareas = cargar(KEY_HOY);
    if (!tareas.length) { showToast('✨ ¡No hay tareas pendientes!'); return; }
    const ok = confirm(
      `¿Cerrar el día?\n\n${tareas.length} tarea(s) sin completar pasarán a "Pendientes anteriores".`
    );
    if (!ok) return;
    const pend = cargar(KEY_PEND);
    tareas.forEach(t => pend.push({ texto: t.texto, fecha: hoy() }));
    guardar(KEY_PEND, pend);
    guardar(KEY_HOY, []);
    renderHoy();
    renderPendientes();
    showToast(`🌙 ${tareas.length} tarea(s) movida(s) a pendientes`);
  }

  /* ── Devolver tarea del historial a hoy ── */
  function devolverAHoy(idx) {
    const realizadas = cargar(KEY_REALIZADAS);
    if (!realizadas[idx]) return;
    const tarea = realizadas.splice(idx, 1)[0];
    guardar(KEY_REALIZADAS, realizadas);
    const tareas = cargar(KEY_HOY);
    tareas.push({ texto: tarea.texto, fecha: hoy() });
    guardar(KEY_HOY, tareas);
    // Volver a la vista principal y refrescar ambas listas
    const vp  = document.getElementById('view-principal');
    const vh  = document.getElementById('view-historial');
    const btn = document.getElementById('btn-toggle-hist');
    vh.classList.remove('visible');
    vp.classList.remove('hidden');
    btn.classList.remove('active');
    btn.textContent = '📂 Historial';
    renderHoy();
    renderPendientes();
    showToast('↩ Tarea devuelta a hoy');
  }

  /* ── Toggle historial ── */
  function toggleHistorial() {
    const vp  = document.getElementById('view-principal');
    const vh  = document.getElementById('view-historial');
    const btn = document.getElementById('btn-toggle-hist');
    const showing = vh.classList.contains('visible');
    if (showing) {
      vh.classList.remove('visible');
      vp.classList.remove('hidden');
      btn.classList.remove('active');
      btn.textContent = '📂 Historial';
    } else {
      renderHistorial();
      vp.classList.add('hidden');
      vh.classList.add('visible');
      btn.classList.add('active');
      btn.textContent = '← Volver';
    }
  }

  /* ── INIT ── */
  setHeaderDate();
  renderHoy();
  renderPendientes();
</script>
  <script src="../volver.js"></script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Tareas Diarias</title>

  <link rel="icon" href="icon1.png">  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F3EC;
      --warm-white: #FDFAF5;
      --ink: #1C1A17;
      --ink-light: #4A4640;
      --ink-muted: #9A9490;
      --amber: #D4820A;
      --amber-light: #F5C064;
      --amber-pale: #FDF0D8;
      --sage: #5A7A5C;
      --sage-pale: #E8F0E8;
      --rose: #C0584A;
      --rose-pale: #FAE8E6;
      --border: #E2DDD6;
      --shadow: rgba(28,26,23,0.08);
    }

    html { font-size: 16px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--ink);
      color: var(--cream);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--cream);
      white-space: nowrap;
    }

    .header-date {
      font-size: 0.68rem;
      font-weight: 300;
      color: var(--amber-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-hist {
      background: none;
      border: 1.5px solid rgba(245,192,100,0.4);
      color: var(--amber-light);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-hist:hover, .btn-hist.active {
      background: var(--amber-light);
      color: var(--ink);
      border-color: var(--amber-light);
    }

    /* ── MAIN ── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 12px 70px;
    }

    /* ── SECTIONS ── */
    .section {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow);
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .badge {
      background: var(--amber-pale);
      color: var(--amber);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 22px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
    }
    .badge.green { background: var(--sage-pale); color: var(--sage); }

    /* ── ADD TASK ── */
    .add-task-area { padding: 14px 12px; }

    /* columna en móvil, fila en desktop */
    .input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @media (min-width: 480px) {
      .input-row { flex-direction: row; }
    }

    .task-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;   /* ≥1rem evita zoom automático en iOS */
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .task-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(212,130,10,0.1);
    }
    .task-input::placeholder { color: var(--ink-muted); }

    .btn-add {
      padding: 11px 20px;
      background: var(--amber);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      width: 100%;
    }
    @media (min-width: 480px) { .btn-add { width: auto; } }
    .btn-add:hover  { background: #B86E00; }
    .btn-add:active { transform: scale(0.97); }

    /* ── TASK LIST ── */
    .task-list { padding: 0 8px 8px; list-style: none; }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 4px;
      border-bottom: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.15s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: var(--cream); }

    /* custom checkbox — tamaño táctil cómodo */
    .task-check {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
      margin-top: 1px;
    }
    .task-check:checked { background: var(--sage); border-color: var(--sage); }
    .task-check:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 6px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .task-check:hover:not(:checked) { border-color: var(--sage); }

    /* Columna: texto arriba, acciones abajo */
    .task-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .task-label {
      font-size: 0.92rem;
      color: var(--ink-light);
      line-height: 1.45;
      word-break: break-word;
    }
    .task-item.completed .task-label {
      text-decoration: line-through;
      color: var(--ink-muted);
    }

    /* Fila de meta y botones */
    .task-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .task-date {
      font-size: 0.7rem;
      color: var(--ink-muted);
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .btn-move {
      background: var(--amber-pale);
      color: var(--amber);
      border: 1px solid rgba(212,130,10,0.2);
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      min-height: 30px;
    }
    .btn-move:hover { background: var(--amber-light); color: var(--ink); }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 0.9rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      /* zona táctil mínima 44x44px recomendada */
      min-height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-delete:hover { color: var(--rose); background: var(--rose-pale); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 22px 16px;
      color: var(--ink-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ── FIN DEL DÍA ── */
    .end-day-area { padding: 0 12px 14px; }

    .btn-end-day {
      width: 100%;
      padding: 12px 10px;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      color: var(--ink-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.83rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      line-height: 1.45;
    }
    .btn-end-day:hover {
      border-color: var(--rose);
      color: var(--rose);
      background: var(--rose-pale);
    }

    /* ── HISTORIAL ── */
    #view-historial { display: none; }
    #view-historial.visible { display: block; }
    #view-principal { display: block; }
    #view-principal.hidden { display: none; }

    .hist-group { margin-bottom: 2px; }

    .hist-date-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 0.92rem;
      color: var(--ink);
      padding: 12px 16px 9px;
      border-bottom: 1px solid var(--border);
      background: var(--cream);
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .hist-item:last-child { border-bottom: none; }

    .hist-dot {
      width: 8px; height: 8px; min-width: 8px;
      border-radius: 50%;
      background: var(--sage);
    }

    .hist-task { flex: 1; color: var(--ink-light); word-break: break-word; }
    .hist-check-icon { color: var(--sage); font-size: 0.85rem; flex-shrink: 0; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: var(--cream);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📋 Mis Tareas</h1>
    <span class="header-date" id="header-date"></span>
  </div>
  <button class="btn-hist" id="btn-toggle-hist" onclick="toggleHistorial()">📂 Historial</button>
</header>

<main>

  <!-- ══ VISTA PRINCIPAL ══ -->
  <div id="view-principal">

    <!-- Añadir tarea -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">✏️ Nueva tarea para hoy</span>
      </div>
      <div class="add-task-area">
        <div class="input-row">
          <input type="text" class="task-input" id="nueva-tarea"
            placeholder="Escribe una tarea y pulsa Añadir…"
            onkeydown="if(event.key==='Enter') agregarTarea()"/>
          <button class="btn-add" onclick="agregarTarea()">Añadir</button>
        </div>
      </div>
    </div>

    <!-- Pendientes de días anteriores -->
    <div class="section" id="sec-pendientes">
      <div class="section-header">
        <span class="section-title">⏳ Pendientes anteriores</span>
        <span class="badge" id="badge-pend">0</span>
      </div>
      <ul class="task-list" id="list-pendientes"></ul>
    </div>

    <!-- Tareas del día -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">☀️ Tareas de hoy</span>
        <span class="badge green" id="badge-hoy">0</span>
      </div>
      <ul class="task-list" id="list-hoy"></ul>
      <div class="end-day-area">
        <button class="btn-end-day" onclick="finalizarDia()">
          🌙 Cerrar el día — mover tareas no realizadas a pendientes
        </button>
      </div>
    </div>

  </div><!-- /view-principal -->

  <!-- ══ VISTA HISTORIAL ══ -->
  <div id="view-historial">
    <div class="section">
      <div class="section-header">
        <span class="section-title">✅ Historial de tareas realizadas</span>
        <span class="badge green" id="badge-hist">0</span>
      </div>
      <div id="hist-content"></div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
  const KEY_HOY        = 'tareasHoy';
  const KEY_PEND       = 'tareasPendientes';
  const KEY_REALIZADAS = 'tareasRealizadas';

  function hoy() { return new Date().toISOString().split('T')[0]; }

  function formatFechaLeg(fechaISO) {
    const [y, m, d] = fechaISO.split('-');
    const meses = ['ene','feb','mar','abr','may','jun',
                   'jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
  }

  function cargar(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; }
    catch { return []; }
  }

  function guardar(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function setHeaderDate() {
    const d = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('header-date').textContent =
      d.toLocaleDateString('es-ES', opts);
  }

  function escHtml(str) {
    return str
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Render tareas de hoy ── */
  function renderHoy() {
    const tareas = cargar(KEY_HOY);
    const ul = document.getElementById('list-hoy');
    ul.innerHTML = '';
    document.getElementById('badge-hoy').textContent = tareas.length;

    if (!tareas.length) {
      ul.innerHTML = '<li class="empty-state">Sin tareas para hoy 🎉</li>';
      return;
    }

    tareas.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <input type="checkbox" class="task-check" id="hoy-${i}"
          onchange="completarTarea(${i})"/>
        <div class="task-body">
          <label class="task-label" for="hoy-${i}">${escHtml(t.texto)}</label>
          <div class="task-actions">
            <button class="btn-delete" title="Eliminar tarea"
              onclick="eliminarHoy(${i})">✕</button>
          </div>
        </div>`;
      ul.appendChild(li);
    });
  }

  /* ── Render pendientes ── */
  function renderPendientes() {
    const tareas = cargar(KEY_PEND);
    const ul = document.getElementById('list-pendientes');
    ul.innerHTML = '';
    document.getElementById('badge-pend').textContent = tareas.length;

    if (!tareas.length) {
      ul.innerHTML = '<li class="empty-state">Sin pendientes de días anteriores 👍</li>';
      return;
    }

    tareas.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div class="task-body">
          <span class="task-label">${escHtml(t.texto)}</span>
          <div class="task-actions">
            <span class="task-date">📅 ${formatFechaLeg(t.fecha)}</span>
            <button class="btn-move" onclick="moverAHoy(${i})">▶ Mover a hoy</button>
            <button class="btn-delete" title="Eliminar"
              onclick="eliminarPendiente(${i})">✕</button>
          </div>
        </div>`;
      ul.appendChild(li);
    });
  }

  /* ── Render historial ── */
  function renderHistorial() {
    const tareas = cargar(KEY_REALIZADAS);
    const cont = document.getElementById('hist-content');
    document.getElementById('badge-hist').textContent = tareas.length;

    if (!tareas.length) {
      cont.innerHTML = '<div class="empty-state" style="padding:28px">No hay tareas completadas aún.</div>';
      return;
    }

    const ordenadas = [...tareas].sort((a, b) => b.fecha.localeCompare(a.fecha));
    const grupos = {};
    ordenadas.forEach(t => {
      if (!grupos[t.fecha]) grupos[t.fecha] = [];
      grupos[t.fecha].push(t);
    });

    let html = '';
    Object.keys(grupos).forEach(fecha => {
      html += `<div class="hist-group">
        <div class="hist-date-heading">📅 ${formatFechaLeg(fecha)}</div>`;
      grupos[fecha].forEach(t => {
        html += `<div class="hist-item">
          <span class="hist-dot"></span>
          <span class="hist-task">${escHtml(t.texto)}</span>
          <span class="hist-check-icon">✓</span>
        </div>`;
      });
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  /* ── Agregar tarea ── */
  function agregarTarea() {
    const inp = document.getElementById('nueva-tarea');
    const texto = inp.value.trim();
    if (!texto) { inp.focus(); return; }
    const tareas = cargar(KEY_HOY);
    tareas.push({ texto, fecha: hoy() });
    guardar(KEY_HOY, tareas);
    inp.value = '';
    inp.focus();
    renderHoy();
    showToast('✅ Tarea añadida');
  }

  /* ── Completar tarea ── */
  function completarTarea(i) {
    const tareas = cargar(KEY_HOY);
    const realizadas = cargar(KEY_REALIZADAS);
    realizadas.push({ texto: tareas[i].texto, fecha: hoy() });
    guardar(KEY_REALIZADAS, realizadas);
    tareas.splice(i, 1);
    guardar(KEY_HOY, tareas);
    renderHoy();
    showToast('🎉 ¡Tarea completada!');
  }

  /* ── Eliminar tarea de hoy ── */
  function eliminarHoy(i) {
    const tareas = cargar(KEY_HOY);
    tareas.splice(i, 1);
    guardar(KEY_HOY, tareas);
    renderHoy();
    showToast('🗑 Tarea eliminada');
  }

  /* ── Mover pendiente a hoy ── */
  function moverAHoy(i) {
    const pend = cargar(KEY_PEND);
    const tarea = pend.splice(i, 1)[0];
    guardar(KEY_PEND, pend);
    const tareas = cargar(KEY_HOY);
    tareas.push({ texto: tarea.texto, fecha: hoy() });
    guardar(KEY_HOY, tareas);
    renderPendientes();
    renderHoy();
    showToast('📅 Tarea movida a hoy');
  }

  /* ── Eliminar pendiente ── */
  function eliminarPendiente(i) {
    const pend = cargar(KEY_PEND);
    pend.splice(i, 1);
    guardar(KEY_PEND, pend);
    renderPendientes();
    showToast('🗑 Tarea eliminada');
  }

  /* ── Finalizar día ── */
  function finalizarDia() {
    const tareas = cargar(KEY_HOY);
    if (!tareas.length) { showToast('✨ ¡No hay tareas pendientes!'); return; }
    const ok = confirm(
      `¿Cerrar el día?\n\n${tareas.length} tarea(s) sin completar pasarán a "Pendientes anteriores".`
    );
    if (!ok) return;
    const pend = cargar(KEY_PEND);
    tareas.forEach(t => pend.push({ texto: t.texto, fecha: hoy() }));
    guardar(KEY_PEND, pend);
    guardar(KEY_HOY, []);
    renderHoy();
    renderPendientes();
    showToast(`🌙 ${tareas.length} tarea(s) movida(s) a pendientes`);
  }

  /* ── Toggle historial ── */
  function toggleHistorial() {
    const vp  = document.getElementById('view-principal');
    const vh  = document.getElementById('view-historial');
    const btn = document.getElementById('btn-toggle-hist');
    const showing = vh.classList.contains('visible');
    if (showing) {
      vh.classList.remove('visible');
      vp.classList.remove('hidden');
      btn.classList.remove('active');
      btn.textContent = '📂 Historial';
    } else {
      renderHistorial();
      vp.classList.add('hidden');
      vh.classList.add('visible');
      btn.classList.add('active');
      btn.textContent = '← Volver';
    }
  }

  /* ── INIT ── */
  setHeaderDate();
  renderHoy();
  renderPendientes();
</script>
</body>
</html>

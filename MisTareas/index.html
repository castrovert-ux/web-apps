<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Tareas Diarias</title>
  <link rel="icon" href="icon1.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* ... (Mantengo tus estilos originales intactos) ... */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F7F3EC; --warm-white: #FDFAF5; --ink: #1C1A17;
      --ink-light: #4A4640; --ink-muted: #9A9490; --amber: #D4820A;
      --amber-light: #F5C064; --amber-pale: #FDF0D8; --sage: #5A7A5C;
    }
    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* BARRA DE SINCRONIZACIÓN ESTILO CANALES */
    #sync-bar {
      background: var(--ink);
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; padding: 8px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #sync-user-text { font-size: 11px; color: rgba(255,255,255,0.5); }
    .btn-sync-action {
      background: none; border: none; color: #fff; opacity: 0.6;
      cursor: pointer; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-sync-action:hover { opacity: 1; }

    /* Estilos de tus contenedores originales */
    .container { max-width: 500px; margin: 0 auto; width: 100%; padding: 40px 20px; flex: 1; }
    header { margin-bottom: 40px; text-align: center; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; font-weight: 400; line-height: 1.1; margin-bottom: 8px; }
    .date-display { color: var(--ink-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .input-group { background: var(--warm-white); padding: 8px; border-radius: 16px; display: flex; gap: 8px; border: 1px solid rgba(28,26,23,0.08); margin-bottom: 32px; box-shadow: 0 4px 20px rgba(28,26,23,0.03); }
    input[type="text"] { flex: 1; border: none; background: transparent; padding: 12px 16px; font-family: inherit; font-size: 1rem; color: var(--ink); outline: none; }
    button.btn-add { background: var(--ink); color: var(--warm-white); border: none; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; transition: all 0.2s ease; }
    button.btn-add:hover { transform: scale(1.02); background: var(--amber); }
    .section-title { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .todo-list { list-style: none; margin-bottom: 40px; }
    .todo-item { background: var(--warm-white); margin-bottom: 8px; padding: 16px; border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: all 0.2s ease; border: 1px solid rgba(28,26,23,0.04); }
    .todo-item:hover { border-color: var(--amber-light); }
    .todo-item.completed .text { text-decoration: line-through; color: var(--ink-muted); }
    .checkbox { width: 22px; height: 22px; border: 2px solid var(--ink-muted); border-radius: 6px; cursor: pointer; display: grid; place-items: center; transition: all 0.2s ease; }
    .todo-item.completed .checkbox { background: var(--sage); border-color: var(--sage); }
    .checkbox svg { display: none; color: white; }
    .todo-item.completed .checkbox svg { display: block; }
    .text { flex: 1; font-size: 1rem; color: var(--ink-light); line-height: 1.4; }
    .btn-delete { opacity: 0; padding: 8px; color: var(--ink-muted); cursor: pointer; border: none; background: none; transition: all 0.2s ease; }
    .todo-item:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { color: #e74c3c; }
    .nav-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .btn-hist { background: var(--warm-white); border: 1px solid rgba(28,26,23,0.1); padding: 10px 20px; border-radius: 12px; font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
    .btn-hist.active { background: var(--ink); color: white; }
    .hidden { display: none !important; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="sync-bar">
    <span id="sync-user-text" style="display:none;"></span>
    <button id="btn-signout" class="btn-sync-action" style="display:none;" onclick="fbSignOut()">Salir</button>
    <button id="btn-sync" class="btn-sync-action" onclick="handleSync()">
      <span id="sync-icon">☁</span> <span id="sync-label">Sincronizar</span>
    </button>
  </div>

  <div class="container">
    <header>
      <div class="date-display" id="current-date">Sábado, 8 de Junio</div>
      <h1>Mis Tareas</h1>
    </header>

    <div id="view-principal">
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="¿Qué hay que hacer hoy?" autocomplete="off" />
        <button class="btn-add" onclick="agregarTarea()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>

      <h2 class="section-title">Para Hoy</h2>
      <ul class="todo-list" id="list-hoy"></ul>

      <h2 class="section-title">Pendientes</h2>
      <ul class="todo-list" id="list-pendientes"></ul>
    </div>

    <div id="view-historial" class="hidden">
      <h2 class="section-title">Historial de Completadas</h2>
      <ul class="todo-list" id="list-historial"></ul>
    </div>

    <div class="nav-buttons">
      <button class="btn-hist" id="btn-toggle-hist" onclick="toggleHistorial()">📂 Historial</button>
      <button class="btn-hist" onclick="exportToExcel()">📊 Excel</button>
    </div>
  </div>

  <div id="toast" class="toast">Mensaje aquí</div>

  <script>
    /* ── CONFIGURACIÓN FIREBASE ── */
    var firebaseConfig = {
      apiKey: "AIzaSyAnqySqGTWFFjBESReTW4hZ24_ReFCHO70",
      authDomain: "castroverde-apps.firebaseapp.com",
      projectId: "castroverde-apps",
      storageBucket: "castroverde-apps.firebasestorage.app",
      messagingSenderId: "371026533141",
      appId: "1:371026533141:web:315767f60cbf8d6f47671c"
    };

    firebase.initializeApp(firebaseConfig);
    const fbAuth = firebase.auth();
    const fbDb = firebase.firestore();
    const fbProvider = new firebase.auth.GoogleAuthProvider();
    let fbUser = null;

    /* ── LÓGICA DE DATOS LOCALES ── */
    const KEY_HOY = 'tareasHoy';
    const KEY_PEND = 'tareasPendientes';
    const KEY_REALIZADAS = 'tareasRealizadas';

    function cargar(key) {
      const d = localStorage.getItem(key);
      return d ? JSON.parse(d) : [];
    }

    function guardar(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
      if (fbUser) subirANube(); // Sincroniza automáticamente al guardar
    }

    /* ── INTEGRACIÓN CLOUD ── */
    fbAuth.onAuthStateChanged(user => {
      fbUser = user;
      const userText = document.getElementById('sync-user-text');
      const btnOut = document.getElementById('btn-signout');
      const label = document.getElementById('sync-label');

      if (user) {
        userText.style.display = 'inline';
        userText.textContent = user.displayName || user.email;
        btnOut.style.display = 'inline';
        label.textContent = "Nube Activa";
        descargarDeNube(); 
      } else {
        userText.style.display = 'none';
        btnOut.style.display = 'none';
        label.textContent = "Sincronizar";
      }
    });

    async function handleSync() {
      if (!fbUser) {
        try { await fbAuth.signInWithPopup(fbProvider); } 
        catch (e) { showToast("Error al conectar"); }
      } else {
        subirANube();
      }
    }

    function fbSignOut() {
      fbAuth.signOut().then(() => showToast("Sesión cerrada"));
    }

    async function subirANube() {
      if (!fbUser) return;
      const payload = {
        hoy: cargar(KEY_HOY),
        pendientes: cargar(KEY_PEND),
        realizadas: cargar(KEY_REALIZADAS),
        ts: Date.now()
      };
      try {
        await fbDb.collection('usuarios').doc(fbUser.uid).set({ gestorTareas: payload }, { merge: true });
        console.log("Sincronizado OK");
      } catch (e) { console.error(e); }
    }

    async function descargarDeNube() {
      if (!fbUser) return;
      try {
        const doc = await fbDb.collection('usuarios').doc(fbUser.uid).get();
        if (doc.exists && doc.data().gestorTareas) {
          const d = doc.data().gestorTareas;
          localStorage.setItem(KEY_HOY, JSON.stringify(d.hoy || []));
          localStorage.setItem(KEY_PEND, JSON.stringify(d.pendientes || []));
          localStorage.setItem(KEY_REALIZADAS, JSON.stringify(d.realizadas || []));
          renderHoy(); renderPendientes();
          showToast("Datos recuperados de la nube");
        }
      } catch (e) { console.error(e); }
    }

    /* ── FUNCIONES ORIGINALES DE TAREAS ── */
    function hoy() {
      const d = new Date();
      return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function renderHoy() {
      const list = document.getElementById('list-hoy');
      const tareas = cargar(KEY_HOY);
      list.innerHTML = '';
      tareas.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'todo-item';
        li.innerHTML = `
          <div class="checkbox" onclick="completarTarea(${i})"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg></div>
          <span class="text">${t.texto}</span>
          <button class="btn-delete" onclick="eliminarTarea('${KEY_HOY}', ${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function renderPendientes() {
      const list = document.getElementById('list-pendientes');
      const tareas = cargar(KEY_PEND);
      list.innerHTML = '';
      tareas.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'todo-item';
        li.innerHTML = `
          <div class="checkbox" onclick="pasarAHoy(${i})"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></div>
          <span class="text">${t.texto}</span>
          <button class="btn-delete" onclick="eliminarTarea('${KEY_PEND}', ${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function agregarTarea() {
      const input = document.getElementById('todo-input');
      const val = input.value.trim();
      if (!val) return;
      const tareas = cargar(KEY_HOY);
      tareas.push({ texto: val, fecha: hoy() });
      guardar(KEY_HOY, tareas);
      input.value = '';
      renderHoy();
    }

    function completarTarea(idx) {
      const hoyList = cargar(KEY_HOY);
      const tarea = hoyList.splice(idx, 1)[0];
      guardar(KEY_HOY, hoyList);
      const realizadas = cargar(KEY_REALIZADAS);
      realizadas.push({ ...tarea, fin: hoy() });
      guardar(KEY_REALIZADAS, realizadas);
      renderHoy();
      showToast("¡Tarea completada!");
    }

    function pasarAHoy(idx) {
      const pend = cargar(KEY_PEND);
      const tarea = pend.splice(idx, 1)[0];
      guardar(KEY_PEND, pend);
      const h = cargar(KEY_HOY);
      h.push({ ...tarea, fecha: hoy() });
      guardar(KEY_HOY, h);
      renderHoy(); renderPendientes();
    }

    function eliminarTarea(key, idx) {
      const data = cargar(key);
      data.splice(idx, 1);
      guardar(key, data);
      key === KEY_HOY ? renderHoy() : renderPendientes();
    }

    function toggleHistorial() {
      const vp = document.getElementById('view-principal');
      const vh = document.getElementById('view-historial');
      const btn = document.getElementById('btn-toggle-hist');
      if (vh.classList.contains('hidden')) {
        renderHistorial();
        vh.classList.remove('hidden'); vp.classList.add('hidden');
        btn.textContent = "← Volver";
      } else {
        vh.classList.add('hidden'); vp.classList.remove('hidden');
        btn.textContent = "📂 Historial";
      }
    }

    function renderHistorial() {
      const list = document.getElementById('list-historial');
      const realizadas = cargar(KEY_REALIZADAS);
      list.innerHTML = '';
      realizadas.slice().reverse().forEach((t, i) => {
        const realIdx = realizadas.length - 1 - i;
        const li = document.createElement('li');
        li.className = 'todo-item completed';
        li.innerHTML = `
          <div class="checkbox"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" style="display:block"><path d="M5 13l4 4L19 7"></path></svg></div>
          <span class="text">${t.texto} <small style="display:block; opacity:0.5">${t.fin}</small></span>
        `;
        list.appendChild(li);
      });
    }

    function exportToExcel() {
      const data = cargar(KEY_REALIZADAS);
      if (data.length === 0) { showToast("No hay datos para exportar"); return; }
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Tareas");
      XLSX.writeFile(wb, `tareas_${hoy()}.xlsx`);
    }

    // Inicialización
    document.getElementById('current-date').textContent = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
    renderHoy();
    renderPendientes();
  </script>
</body>
</html>

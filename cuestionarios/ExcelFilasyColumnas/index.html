<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Manejo de Columnas y Filas en Excel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346;
    --c2: #1a5c38;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-blobs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(25px, 18px) scale(1.07); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 750px; margin: 0 auto;
    padding: 40px 20px;
  }

  .header {
    text-align: center; margin-bottom: 40px;
    animation: slideDown 0.7s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 18px; border-radius: 100px; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px;
  }
  .subtitle { color: var(--sub); font-size: 1rem; font-weight: 600; }

  .progress-wrap { margin-bottom: 30px; animation: fadeIn 0.5s ease; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px; background: rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c1), var(--c3));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: 36px; margin-bottom: 24px;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-type-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.5px; padding: 4px 12px; border-radius: 100px; margin-bottom: 18px;
    background: rgba(33,115,70,0.2); color: #4ade80;
  }

  .q-number { font-size: 0.8rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.5; }

  .options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .option-btn {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 20px;
    color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 600; text-align: left;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(33,115,70,0.15);
    border-color: var(--c1); transform: translateX(6px);
  }
  .option-letter {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
  }
  .option-btn.correct { background: rgba(33,115,70,0.2); border-color: var(--c1); }
  .option-btn.correct .option-letter { background: var(--c1); color: #fff; }
  .option-btn.wrong { background: rgba(255,107,107,0.12); border-color: var(--c4); }
  .option-btn.wrong .option-letter { background: var(--c4); color: #fff; }

  .feedback {
    display: none; margin-top: 16px; padding: 14px 18px;
    border-radius: 12px; font-weight: 700; font-size: 0.95rem;
    animation: fadeIn 0.3s ease; line-height: 1.5;
  }
  .feedback.correct-fb { display: flex; background: rgba(33,115,70,0.15); border: 1px solid rgba(33,115,70,0.4); color: var(--c5); }
  .feedback.wrong-fb   { display: flex; background: rgba(255,107,107,0.1);  border: 1px solid rgba(255,107,107,0.3); color: var(--c4); }

  .btn-next {
    display: none; margin-left: auto;
    padding: 14px 32px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--c3), #f59e0b);
    color: #0a1628; font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4); }

  .results { display: none; text-align: center; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1); }
  .results.show { display: block; }
  .score-circle {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--c1) 0%, var(--c3) var(--pct, 0%), rgba(255,255,255,0.05) var(--pct, 0%));
    display: flex; align-items: center; justify-content: center;
    margin: 24px auto; position: relative;
  }
  .score-circle::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; background: var(--bg);
  }
  .score-number { font-family: 'Fredoka One', cursive; font-size: 2.2rem; position: relative; z-index: 1; }
  
  .btn-restart {
    padding: 16px 40px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1.05rem; cursor: pointer; margin-top: 20px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge">📊 Microsoft Excel</div>
    <h1>Manejo de Columnas y Filas</h1>
    <p class="subtitle">Domina la estructura básica de tus hojas de cálculo</p>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Pregunta 1</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>

    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div style="font-size: 5rem; margin-bottom: 16px;">🏆</div>
    <div class="score-circle" id="score-circle">
      <span class="score-number" id="score-num">0/10</span>
    </div>
    <h2 id="result-msg"></h2>
    <p id="result-sub" style="color: var(--sub); margin: 10px 0 30px;"></p>
    <button class="btn-restart" onclick="location.reload()">🔄 Reintentar</button>
  </div>
</div>

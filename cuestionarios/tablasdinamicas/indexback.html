<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Tablas Dinámicas en Excel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container { position: relative; z-index: 1; max-width: 750px; margin: 0 auto; padding: 40px 20px; }

  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px;
    text-transform: uppercase; padding: 6px 18px; border-radius: 100px; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: clamp(1.8rem, 5vw, 2.8rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
  }

  .progress-wrap { margin-bottom: 30px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }

  .question-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: 36px; margin-bottom: 24px;
  }

  .q-type-badge {
    display: inline-flex; font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    padding: 4px 12px; border-radius: 100px; margin-bottom: 18px;
    background: rgba(33,115,70,0.2); color: #4ade80;
  }

  .q-number { font-size: 0.8rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-bottom: 20px; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 20px; color: var(--text);
    font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 14px; transition: 0.2s;
  }
  .option-btn:hover:not(:disabled) { background: rgba(33,115,70,0.15); border-color: var(--c1); transform: translateX(5px); }
  .option-letter {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
  }

  .option-btn.correct { background: rgba(33,115,70,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }

  .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: 700; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.correct-fb { display: block; background: rgba(33,115,70,0.2); color: var(--c5); border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .btn-next {
    display: none; width: 100%; max-width: 200px; margin: 0 0 0 auto;
    padding: 14px; border-radius: 14px; border: none; font-weight: 800;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
    font-size: 1rem;
  }

  .results { display: none; text-align: center; padding: 20px 0; }
  .results-emoji { font-size: 4rem; margin-bottom: 10px; }
  .score-circle {
    width: 130px; height: 130px; border-radius: 50%; border: 8px solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 20px auto;
    font-size: 2.2rem; font-family: 'Fredoka One'; color: var(--text);
  }
  .result-msg { font-size: 1.3rem; font-weight: 800; margin-top: 10px; }
  .result-detail { font-size: 0.95rem; color: var(--sub); margin-top: 8px; margin-bottom: 24px; }
  .btn-restart {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.85rem; letter-spacing: 1px;
    padding: 12px 28px; border-radius: 100px; border: none; cursor: pointer; margin-top: 10px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge">📊 Microsoft Excel</div>
    <h1>Tablas Dinámicas</h1>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge">🎯 Tipo test</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div class="results-emoji">🏆</div>
    <div class="score-circle" id="score-num">0/10</div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-detail" id="result-detail"></div>
    <button class="btn-restart" onclick="location.reload()">🔄 Reiniciar Quiz</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "¿Cuántas columnas tiene la tabla de datos de gastos del ejercicio?",
    options: [
      "Tres: Fecha, Categoría y Precio",
      "Cuatro: Fecha, Categoría, Subcategoría y Precio",
      "Cinco: Fecha, Categoría, Subcategoría, Precio y Total"
    ],
    correct: 1,
    expl: "La tabla tiene exactamente cuatro columnas: Fecha (día del gasto), Categoría (tipo general), Subcategoría (descripción más específica) y Precio (importe)."
  },
  {
    q: "¿Qué representa cada fila de la tabla de gastos?",
    options: [
      "Una categoría distinta de gasto",
      "Un mes completo de gastos",
      "Un gasto único e individual"
    ],
    correct: 2,
    expl: "Cada fila de la tabla representa un gasto único. Así podemos registrar todos los gastos realizados uno a uno."
  },
  {
    q: "¿Cuáles son las categorías generales de gasto que se usan en el ejercicio?",
    options: [
      "Alimentación, Transporte, Ocio, Hogar y Salud",
      "Supermercado, Gasolina, Cine, Limpieza y Medicina",
      "Comida, Viaje, Entretenimiento, Casa y Farmacia"
    ],
    correct: 0,
    expl: "Las cinco categorías del ejercicio son: Alimentación, Transporte, Ocio, Hogar y Salud. Las opciones de la segunda respuesta son subcategorías, no categorías."
  },
  {
    q: "¿Para qué sirve una tabla dinámica en Excel?",
    options: [
      "Para crear gráficos de barras automáticamente",
      "Para resumir y agrupar datos rápidamente",
      "Para ordenar alfabéticamente una lista"
    ],
    correct: 1,
    expl: "Una tabla dinámica permite resumir los datos rápidamente, agrupándolos según el criterio que elijamos, como por categoría o por subcategoría."
  },
  {
    q: "En la primera tabla dinámica del ejercicio, ¿qué campo se arrastra a las filas?",
    options: [
      "El campo Subcategoría",
      "El campo Fecha",
      "El campo Categoría"
    ],
    correct: 2,
    expl: "En la primera tabla dinámica se arrastra Categoría a las filas y Precio a los valores, para obtener el total gastado en cada categoría general."
  },
  {
    q: "Según la primera tabla dinámica del ejercicio, ¿en qué categoría se gastó más dinero?",
    options: [
      "Hogar (80 €)",
      "Alimentación (135 €)",
      "Transporte (50 €)"
    ],
    correct: 1,
    expl: "Alimentación es la categoría con mayor gasto total: 135 €. Le sigue Hogar con 80 €, Transporte con 50 €, Ocio con 45 € y Salud con 40 €."
  },
  {
    q: "¿Qué diferencia tiene la segunda tabla dinámica respecto a la primera?",
    options: [
      "Usa el campo Subcategoría en las filas en lugar de Categoría",
      "Calcula el promedio de precios en vez de la suma",
      "Solo muestra los gastos del primer día"
    ],
    correct: 0,
    expl: "La segunda tabla dinámica agrupa por Subcategoría en las filas (en lugar de Categoría), lo que da un desglose más detallado de los gastos."
  },
  {
    q: "¿Cuánto se gastó en total en Supermercado según la segunda tabla dinámica?",
    options: [
      "50 €",
      "135 €",
      "110 €"
    ],
    correct: 2,
    expl: "El gasto total en Supermercado fue de 110 €, resultado de sumar los dos registros de Supermercado: 50 € y 60 €."
  },
  {
    q: "¿Para qué sirven los gráficos de pastel que se crean en el Paso 4?",
    options: [
      "Para introducir nuevos datos en la tabla",
      "Para representar visualmente el peso de cada categoría o subcategoría en el gasto total",
      "Para calcular automáticamente los totales de la tabla dinámica"
    ],
    correct: 1,
    expl: "Los gráficos de pastel representan cada categoría o subcategoría como un 'pedazo', cuyo tamaño corresponde a la cantidad gastada. Así se visualiza de un vistazo dónde va más el dinero."
  },
  {
    q: "¿Qué datos se deben seleccionar para crear el gráfico de pastel de gastos por subcategoría?",
    options: [
      "Los datos de la tabla de gastos original (las 10 filas)",
      "Los datos de la segunda tabla dinámica, que agrupa por subcategoría",
      "Los datos de la primera tabla dinámica, que agrupa por categoría"
    ],
    correct: 1,
    expl: "Para el gráfico de pastel por subcategoría se seleccionan los datos de la segunda tabla dinámica (la que agrupa por Subcategoría), no los datos originales ni los de la primera tabla."
  }
];

let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];

  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('q-feedback').style.display = 'none';

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';

  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span> <span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  const pct = (currentIdx / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${questions.length}`;
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;
  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('q-feedback');

  btns.forEach(b => b.disabled = true);

  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>🎉 ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = "feedback correct-fb";
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota:</strong><br>${qData.expl}`;
    fb.className = "feedback wrong-fb";
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < questions.length) {
    loadQuestion();
  } else {
    document.getElementById('quiz-area').classList.add('hidden');
    const results = document.getElementById('results');
    results.style.display = 'block';
    document.getElementById('score-num').textContent = `${score}/10`;
    document.getElementById('prog-fill').style.width = '100%';

    let msg = '', detail = '';
    if (score === 10) {
      msg = "¡Perfecto! ¡Sin ningún error! 🌟";
      detail = "Dominas las tablas dinámicas. ¡Enhorabuena!";
    } else if (score >= 7) {
      msg = "¡Muy bien hecho! 👏";
      detail = "Tienes un buen manejo del tema. Repasa los fallos y lo tendrás todo controlado.";
    } else if (score >= 5) {
      msg = "¡Vas por buen camino! 💪";
      detail = "Tienes la base, pero conviene repasar algunas partes del temario.";
    } else {
      msg = "Anímate, ¡puedes mejorar! 📖";
      detail = "Te recomendamos repasar el material de tablas dinámicas antes de volver a intentarlo.";
    }
    document.getElementById('result-msg').textContent = msg;
    document.getElementById('result-detail').textContent = detail;
  }
}

window.onload = loadQuestion;
</script>
</body>
</html>

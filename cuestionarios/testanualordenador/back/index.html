<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Final · Curso de Ordenador</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #7C83FD;
    --c2: #4A51D1;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #69F0AE;
    --c6: #F48FB1;
    --bg: #07091e;
    --card: #0f1230;
    --text: #FFFFFE;
    --sub: #7a85b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.13; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 600px; height: 600px; background: var(--c2); top: -150px; left: -150px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 420px; height: 420px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 350px; height: 350px; background: var(--c6); top: 40%; left: 60%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(25px,18px) scale(1.07); } }

  .container { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 40px 20px; }

  .header { text-align: center; margin-bottom: 36px; animation: slideDown 0.7s ease; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:translateY(0); } }
  .badge { display: inline-block; background: linear-gradient(135deg, var(--c2), var(--c1)); color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 18px; border-radius: 100px; margin-bottom: 14px; }
  h1 { font-family: 'Fredoka One', cursive; font-size: clamp(2rem,6vw,3.2rem); line-height: 1.1; background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
  .subtitle { color: var(--sub); font-size: 1rem; font-weight: 600; }

  #theme-selector { animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  .theme-intro { text-align:center; margin-bottom: 28px; }
  .theme-intro p { color: var(--sub); font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .theme-card { background: var(--card); border: 2px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 20px 18px; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .theme-card:hover { border-color: var(--c1); background: rgba(124,131,253,0.07); transform: translateY(-3px); }
  .theme-card.selected { border-color: var(--c1); background: rgba(124,131,253,0.13); }
  .theme-icon { font-size: 2rem; }
  .theme-name { font-weight: 800; font-size: 1rem; color: var(--text); line-height: 1.3; }
  .theme-count { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .btn-start-all { display: block; width: 100%; padding: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
  .btn-start-all:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124,131,253,0.35); }
  .btn-start-selected { display: block; width: 100%; padding: 14px; border-radius: 16px; border: 2px solid rgba(124,131,253,0.4); color: var(--c1); background: transparent; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn-start-selected:hover { background: rgba(124,131,253,0.1); }
  .btn-start-selected:disabled { opacity: 0.35; cursor: default; }

  #quiz-area { display: none; }
  .progress-wrap { margin-bottom: 26px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); border-radius: 10px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  .section-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 14px; border-radius: 100px; margin-bottom: 10px; background: rgba(124,131,253,0.12); color: var(--c1); }

  .question-card { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 32px 28px; margin-bottom: 20px; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from { opacity:0; transform:scale(0.92) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .q-type-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; padding: 4px 12px; border-radius: 100px; margin-bottom: 16px; }
  .type-mc { background: rgba(124,131,253,0.15); color: var(--c1); }
  .type-tf { background: rgba(255,217,61,0.15); color: var(--c3); }

  .q-number { font-size: 0.78rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 1.15rem; font-weight: 700; line-height: 1.55; }

  .options { display: flex; flex-direction: column; gap: 11px; margin-top: 22px; }
  .option-btn { background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 13px 18px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 13px; }
  .option-btn:hover:not(:disabled) { background: rgba(124,131,253,0.1); border-color: var(--c1); transform: translateX(5px); }
  .option-letter { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s; }
  .option-btn.correct { background: rgba(105,240,174,0.1); border-color: var(--c5); }
  .option-btn.correct .option-letter { background: var(--c5); color: #07091e; }
  .option-btn.wrong { background: rgba(255,107,107,0.1); border-color: var(--c4); }
  .option-btn.wrong .option-letter { background: var(--c4); color: #fff; }
  .option-btn:disabled { cursor: default; }

  .feedback { display: none; margin-top: 16px; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; animation: fadeIn 0.3s ease; line-height: 1.5; }
  .feedback.correct-fb { display: flex; background: rgba(105,240,174,0.1); border: 1px solid rgba(105,240,174,0.3); color: var(--c5); }
  .feedback.wrong-fb   { display: flex; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--c4); }

  .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 4px; }
  .btn-next { padding: 14px 32px; border-radius: 14px; border: none; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; background: linear-gradient(135deg, var(--c3), #f59e0b); color: #07091e; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4); }

  #results { display: none; text-align: center; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1); }
  #results.show { display: block; }
  .trophy { font-size: 5rem; margin-bottom: 16px; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-12px) rotate(5deg); } }
  .score-circle { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--c1) 0%, var(--c3) var(--pct,100%), rgba(255,255,255,0.05) var(--pct,100%)); display: flex; align-items: center; justify-content: center; margin: 20px auto; position: relative; }
  .score-circle::before { content:''; position:absolute; inset:10px; border-radius:50%; background:var(--bg); }
  .score-number { font-family: 'Fredoka One', cursive; font-size: 2.2rem; position: relative; z-index: 1; }
  .result-msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--sub); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }

  .result-breakdown { text-align: left; background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
  .result-breakdown h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--sub); margin-bottom: 16px; }
  .breakdown-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; }
  .breakdown-row:last-child { border-bottom: none; }
  .bd-name { font-size: 0.95rem; font-weight: 700; color: var(--text); flex: 1; }
  .bd-score { font-size: 0.9rem; font-weight: 800; color: var(--c1); white-space: nowrap; }
  .bd-bar-wrap { width: 80px; height: 6px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .bd-bar { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); border-radius: 4px; }

  .btns-result { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn-restart { padding: 15px 32px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn-restart:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(124,131,253,0.4); }
  .btn-menu { padding: 15px 32px; border-radius: 16px; border: 2px solid rgba(124,131,253,0.35); background: transparent; color: var(--c1); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn-menu:hover { background: rgba(124,131,253,0.1); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="container">

  <div class="header">
    <div class="badge">🖥️ Curso de Ordenador</div>
    <h1>Test Final del Curso</h1>
    <p class="subtitle">Comprueba todo lo que has aprendido este año · 50 preguntas</p>
  </div>

  <div id="theme-selector">
    <div class="theme-intro">
      <p>Elige un bloque temático o haz el test completo</p>
    </div>
    <div class="theme-grid" id="theme-grid"></div>
    <button class="btn-start-all" onclick="startQuiz('all')">🚀 Hacer el test completo (50 preguntas)</button>
    <button class="btn-start-selected" id="btn-sel" onclick="startSelected()" disabled>✅ Hacer solo los temas seleccionados</button>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="question-card" id="q-card">
      <div class="section-tag" id="q-section-tag"></div>
      <div class="q-type-badge" id="q-type-badge"></div>
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-body"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>
    <div class="btn-row">
      <button class="btn-next hidden" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <div id="results">
    <div class="trophy" id="trophy">🏆</div>
    <div class="score-circle" id="score-circle">
      <span class="score-number" id="score-num">0/50</span>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-breakdown" id="breakdown"></div>
    <div class="btns-result">
      <button class="btn-restart" onclick="restartQuiz()">🔄 Repetir este test</button>
      <button class="btn-menu" onclick="goMenu()">📋 Elegir otro tema</button>
    </div>
  </div>

</div>

<script>
const allSections = [
  {
    id: 'raton-teclado',
    name: 'Ratón y teclado',
    icon: '🖱️',
    questions: [
      { type:'mc', text:'¿Qué hace el clic izquierdo del ratón sobre un icono?', options:['Abre el menú contextual con opciones','Borra el archivo','Selecciona o abre el elemento sobre el que se pulsa','Mueve el archivo a otra carpeta'], correct:2, explanation:'El clic izquierdo es el clic principal: selecciona elementos y, con doble clic, los abre.' },
      { type:'mc', text:'¿Para qué sirve el clic derecho del ratón?', options:['Para cerrar el ordenador','Para abrir un menú con opciones sobre el elemento elegido','Para escribir en el teclado','Para aumentar el volumen'], correct:1, explanation:'El clic derecho abre el menú contextual: copiar, pegar, renombrar, propiedades... depende de lo que hayas pulsado.' },
      { type:'tf', text:'La rueda central del ratón sirve para desplazarse hacia arriba y hacia abajo por una página o documento.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! La ruedecilla del ratón (scroll) permite subir y bajar por páginas web, documentos y listas sin usar la barra lateral.' },
      { type:'mc', text:'¿Para qué sirve la tecla "Supr" o "Delete" del teclado?', options:['Para guardar un archivo','Para abrir el menú inicio','Para borrar el carácter que hay a la derecha del cursor o eliminar archivos seleccionados','Para hacer mayúsculas'], correct:2, explanation:'La tecla Supr borra lo que está delante del cursor de texto o elimina los archivos seleccionados enviándolos a la Papelera.' },
      { type:'mc', text:'¿Qué combinación de teclas se usa para deshacer la última acción?', options:['Ctrl + C','Ctrl + V','Ctrl + Z','Ctrl + S'], correct:2, explanation:'Ctrl + Z es el atajo de "deshacer". Si cometes un error, pulsando Ctrl + Z vuelves al estado anterior.' },
    ]
  },
  {
    id: 'windows',
    name: 'Windows y escritorio',
    icon: '🪟',
    questions: [
      { type:'mc', text:'¿Qué es el escritorio de Windows?', options:['Una papelera de reciclaje','La pantalla principal que aparece al encender el ordenador, donde están los iconos y la barra de tareas','Un programa para editar fotos','Una carpeta especial del sistema'], correct:1, explanation:'El escritorio es la pantalla de inicio de Windows: el punto de partida desde el que abres programas y carpetas.' },
      { type:'mc', text:'¿Para qué sirve la barra de tareas de Windows?', options:['Solo para ver la hora','Para mostrar las ventanas abiertas, acceder al menú Inicio y ver notificaciones','Para guardar documentos','Para conectarse a internet'], correct:1, explanation:'La barra de tareas, en la parte inferior, muestra los programas abiertos, el menú Inicio, el reloj y el área de notificaciones.' },
      { type:'tf', text:'Para crear un acceso directo en el escritorio se puede usar el clic derecho sobre el programa o archivo.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Exacto! Con clic derecho → "Enviar a" → "Escritorio (crear acceso directo)" puedes tener el programa a mano en el escritorio.' },
      { type:'mc', text:'¿Qué ocurre al pulsar los botones de minimizar, maximizar y cerrar de una ventana?', options:['Minimizar cierra el programa, maximizar lo guarda, cerrar lo borra','Minimizar oculta la ventana en la barra de tareas, maximizar la pone a pantalla completa, cerrar la cierra','Los tres hacen lo mismo','Solo funciona el botón de cerrar'], correct:1, explanation:'Los tres botones de la esquina superior derecha controlan el tamaño de la ventana. El rojo (X) cierra el programa.' },
      { type:'mc', text:'¿Para qué sirve el Explorador de Archivos de Windows?', options:['Para navegar por internet','Para ver el correo electrónico','Para gestionar y organizar carpetas y archivos del ordenador','Para editar documentos de texto'], correct:2, explanation:'El Explorador de Archivos es como un armario virtual: te permite ver, mover, copiar, renombrar y eliminar tus archivos.' },
    ]
  },
  {
    id: 'archivos',
    name: 'Archivos, USB y carpetas',
    icon: '📁',
    questions: [
      { type:'mc', text:'¿Qué es una memoria USB?', options:['Un tipo de cable de red','Un dispositivo portátil que permite guardar y transportar archivos entre ordenadores','Un programa del sistema operativo','Un tipo de teclado inalámbrico'], correct:1, explanation:'La memoria USB (pendrive) es un pequeño dispositivo que se conecta al puerto USB para guardar y transportar archivos fácilmente.' },
      { type:'tf', text:'Para extraer la memoria USB de forma segura hay que usar la opción "Quitar hardware de forma segura" antes de desconectarla.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! Extraer la USB sin este paso puede corromper los archivos guardados en ella. Siempre mejor hacerlo bien.' },
      { type:'mc', text:'¿Qué es un archivo ZIP?', options:['Un tipo de memoria USB especial','Un formato de vídeo de alta definición','Un archivo comprimido que agrupa varios archivos en uno solo ocupando menos espacio','Un programa de correo electrónico'], correct:2, explanation:'Los archivos ZIP comprimen uno o varios archivos en un solo paquete más pequeño, muy útil para enviarlos por correo.' },
      { type:'mc', text:'¿Qué significa "copiar y pegar" un archivo?', options:['Mover el archivo de una carpeta a otra, borrándolo del origen','Crear una copia del archivo en otro lugar, dejando el original donde estaba','Borrar el archivo definitivamente','Cambiar el nombre del archivo'], correct:1, explanation:'Copiar (Ctrl+C) y Pegar (Ctrl+V) deja el original en su sitio y crea un duplicado donde tú elijas.' },
      { type:'mc', text:'¿Cuál es la diferencia entre "Copiar" y "Cortar" un archivo?', options:['No hay diferencia, hacen lo mismo','Copiar duplica el archivo; cortar lo mueve quitándolo del sitio original','Cortar borra el archivo para siempre','Copiar mueve el archivo y cortar lo duplica'], correct:1, explanation:'Copiar (Ctrl+C) deja el original. Cortar (Ctrl+X) mueve el archivo: desaparece del origen al pegarlo en el destino.' },
    ]
  },
  {
    id: 'google-pc',
    name: 'Aplicaciones Google en PC',
    icon: '🌐',
    questions: [
      { type:'mc', text:'¿Qué es Google Fotos en el ordenador?', options:['Un programa de edición profesional que hay que instalar','Un servicio web para ver, organizar y hacer copias de seguridad de las fotos en la nube','Un disco duro externo de Google','Una impresora en red'], correct:1, explanation:'Google Fotos en el PC funciona desde el navegador: puedes ver todas tus fotos guardadas en la nube sin instalar nada.' },
      { type:'tf', text:'Gmail permite enviar correos con archivos adjuntos como fotos o documentos.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! El icono del clip en Gmail sirve para adjuntar archivos. También se pueden arrastrar directamente al mensaje.' },
      { type:'mc', text:'¿Para qué sirve Google Calendar en el ordenador?', options:['Para ver el tiempo meteorológico','Para gestionar el correo','Para organizar eventos, citas y recordatorios en un calendario compartible','Para editar hojas de cálculo'], correct:2, explanation:'Google Calendar te permite crear eventos, añadir recordatorios y compartir tu agenda con otras personas.' },
      { type:'mc', text:'¿Qué es Google Keep en el ordenador?', options:['Un disco virtual de almacenamiento','Un servicio de videoconferencia','Una aplicación de notas y listas accesible desde cualquier dispositivo','Un programa para crear presentaciones'], correct:2, explanation:'Google Keep es el bloc de notas de Google: crea notas de texto, listas de tareas o notas de voz que se sincronizan en todos tus dispositivos.' },
      { type:'mc', text:'¿Qué permite hacer YouTube desde el ordenador?', options:['Solo descargar vídeos','Editar documentos de texto','Ver, buscar y publicar vídeos, y suscribirse a canales favoritos','Gestionar el correo electrónico'], correct:2, explanation:'YouTube en el ordenador ofrece una pantalla más grande para disfrutar de tutoriales, música, noticias y entretenimiento.' },
    ]
  },
  {
    id: 'word',
    name: 'Introducción a Word',
    icon: '📝',
    questions: [
      { type:'mc', text:'¿Para qué sirve el programa Microsoft Word?', options:['Para hacer hojas de cálculo con números','Para crear y editar documentos de texto como cartas, recetas o informes','Para navegar por internet','Para gestionar el correo electrónico'], correct:1, explanation:'Word es el procesador de texto de Microsoft: sirve para escribir, dar formato y guardar documentos de todo tipo.' },
      { type:'mc', text:'¿Qué es la cinta de opciones (ribbon) en Word?', options:['La barra inferior con el número de página','La barra lateral de herramientas','La zona superior con pestañas y botones donde están todas las herramientas de formato y edición','El área de escritura del documento'], correct:2, explanation:'La cinta de opciones agrupa todas las herramientas en pestañas: Inicio, Insertar, Diseño, etc. Es el panel de control de Word.' },
      { type:'tf', text:'La combinación de teclas Ctrl + S guarda el documento actual en Word.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! Ctrl + S (de "Save") guarda el documento. Es recomendable guardarlo frecuentemente para no perder el trabajo.' },
      { type:'mc', text:'¿Cómo se puede cambiar el tipo y tamaño de letra en Word?', options:['Solo desde el menú Archivo','Usando los controles de fuente en la pestaña Inicio de la cinta de opciones','Hay que reinstalar Word para cambiar la letra','Solo es posible en la versión de pago'], correct:1, explanation:'En la pestaña Inicio encontrarás el selector de fuente (tipo de letra) y el de tamaño, además de negrita, cursiva y subrayado.' },
      { type:'mc', text:'¿Para qué sirve la función "Insertar tabla" en Word?', options:['Para añadir una imagen al documento','Para crear una cuadrícula de filas y columnas donde organizar información de forma ordenada','Para insertar un hipervínculo a internet','Para numerar las páginas automáticamente'], correct:1, explanation:'Las tablas en Word son perfectas para organizar horarios, listas comparativas, datos personales u otra información estructurada.' },
    ]
  },
  {

let activeQuestions = [];
let selectedThemes = new Set();
let current = 0, score = 0, answered = false;
let sectionScores = {};

const typeLabels = {
  mc: { label: '🎯 Opción múltiple', cls: 'type-mc' },
  tf: { label: '⚖️ Verdadero / Falso', cls: 'type-tf' },
};

function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  allSections.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.id = 'theme-' + sec.id;
    card.dataset.secId = sec.id;
    card.innerHTML = `<div class="theme-icon">${sec.icon}</div><div class="theme-name">${sec.name}</div><div class="theme-count">${sec.questions.length} preguntas</div>`;
    card.addEventListener('click', function() { toggleTheme(this.dataset.secId, this); });
    grid.appendChild(card);
  });
}

function toggleTheme(id, card) {
  if (selectedThemes.has(id)) {
    selectedThemes.delete(id);
    card.classList.remove('selected');
  } else {
    selectedThemes.add(id);
    card.classList.add('selected');
  }
  document.getElementById('btn-sel').disabled = selectedThemes.size === 0;
  const count = Array.from(selectedThemes).reduce((a, sid) => a + allSections.find(s => s.id === sid).questions.length, 0);
  document.getElementById('btn-sel').textContent = selectedThemes.size > 0
    ? `✅ Hacer temas seleccionados (${count} preguntas)`
    : '✅ Hacer solo los temas seleccionados';
}

function startQuiz(mode) {
  if (mode === 'all') {
    activeQuestions = [];
    allSections.forEach(sec => sec.questions.forEach(q => activeQuestions.push({...q, section: sec.name, sectionId: sec.id})));
  } else {
    activeQuestions = [];
    allSections.filter(s => selectedThemes.has(s.id)).forEach(sec => sec.questions.forEach(q => activeQuestions.push({...q, section: sec.name, sectionId: sec.id})));
  }
  sectionScores = {};
  allSections.forEach(s => { sectionScores[s.id] = { name: s.name, icon: s.icon, correct: 0, total: 0 }; });
  activeQuestions.forEach(q => { if (sectionScores[q.sectionId]) sectionScores[q.sectionId].total++; });
  current = 0; score = 0; answered = false;
  document.getElementById('theme-selector').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('results').classList.remove('show');
  renderQuestion();
}

function startSelected() { startQuiz('selected'); }

function renderQuestion() {
  answered = false;
  const q = activeQuestions[current];
  const pct = (current / activeQuestions.length) * 100;
  document.getElementById('prog-label').textContent = `Pregunta ${current + 1} de ${activeQuestions.length}`;
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('prog-fill').style.width = pct + '%';
  const sec = allSections.find(s => s.id === q.sectionId);
  document.getElementById('q-section-tag').textContent = (sec?.icon || '') + ' ' + q.section;
  const badge = document.getElementById('q-type-badge');
  badge.textContent = typeLabels[q.type].label;
  badge.className = 'q-type-badge ' + typeLabels[q.type].cls;
  document.getElementById('q-number').textContent = `Pregunta ${current + 1}`;
  document.getElementById('q-text').textContent = q.text;
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('btn-next').classList.add('hidden');
  const card = document.getElementById('q-card');
  card.style.animation = 'none'; card.offsetHeight;
  card.style.animation = 'popIn 0.5s cubic-bezier(.34,1.56,.64,1)';
  const letters = ['A', 'B', 'C', 'D'];
  document.getElementById('q-body').innerHTML = `<div class="options">${
    q.options.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
      <span class="option-letter">${q.type === 'tf' ? (i === 0 ? 'V' : 'F') : letters[i]}</span>
      <span>${opt}</span>
    </button>`).join('')
  }</div>`;
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = activeQuestions[current];
  const fb = document.getElementById('q-feedback');
  q.options.forEach((_, i) => { document.getElementById(`opt-${i}`).disabled = true; });
  const chosen = document.getElementById(`opt-${idx}`);
  const correctEl = document.getElementById(`opt-${q.correct}`);
  if (idx === q.correct) {
    chosen.classList.add('correct');
    score++;
    if (sectionScores[q.sectionId]) sectionScores[q.sectionId].correct++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ' + q.explanation;
  } else {
    chosen.classList.add('wrong');
    correctEl.classList.add('correct');
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '💡 ' + q.explanation;
  }
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
  current++;
  if (current >= activeQuestions.length) showResults();
  else renderQuestion();
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const res = document.getElementById('results');
  res.classList.add('show');
  const total = activeQuestions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('score-circle').style.setProperty('--pct', pct + '%');
  document.getElementById('score-num').textContent = `${score}/${total}`;
  const msgs = [
    { min: 0,  max: 39,  emoji: '💻', msg: '¡Sigue practicando!',       sub: 'Repasa los temas e inténtalo de nuevo. Con práctica lo conseguirás.' },
    { min: 40, max: 59,  emoji: '👍', msg: '¡Buen intento!',             sub: 'Ya conoces buena parte del temario. Repasa los bloques donde hayas fallado.' },
    { min: 60, max: 79,  emoji: '🌟', msg: '¡Muy bien hecho!',           sub: 'Buen nivel. Revisa las preguntas que te han fallado para llegar al 100 %.' },
    { min: 80, max: 95,  emoji: '🏆', msg: '¡Excelente resultado!',      sub: 'Dominas el curso de ordenador. ¡Enhorabuena!' },
    { min: 96, max: 100, emoji: '🥇', msg: '¡Perfecto! ¡Enhorabuena!',  sub: '¡Prácticamente todo correcto! Eres un experto del ordenador.' },
  ];
  const m = msgs.find(x => pct >= x.min && pct <= x.max) || msgs[msgs.length - 1];
  document.getElementById('trophy').textContent = m.emoji;
  document.getElementById('result-msg').textContent = m.msg;
  document.getElementById('result-sub').textContent = m.sub;
  const usedSections = [...new Set(activeQuestions.map(q => q.sectionId))];
  const bd = document.getElementById('breakdown');
  bd.innerHTML = '<h3>Resultados por bloque</h3>' + usedSections.map(sid => {
    const s = sectionScores[sid];
    if (!s || s.total === 0) return '';
    const p = Math.round(s.correct / s.total * 100);
    const sec = allSections.find(x => x.id === sid);
    return `<div class="breakdown-row">
      <span class="bd-name">${sec?.icon || ''} ${s.name}</span>
      <div class="bd-bar-wrap"><div class="bd-bar" style="width:${p}%"></div></div>
      <span class="bd-score">${s.correct}/${s.total}</span>
    </div>`;
  }).join('');
}

function restartQuiz() {
  sectionScores = {};
  allSections.forEach(s => { sectionScores[s.id] = { name: s.name, icon: s.icon, correct: 0, total: 0 }; });
  activeQuestions.forEach(q => { if (sectionScores[q.sectionId]) sectionScores[q.sectionId].total++; });
  current = 0; score = 0; answered = false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function goMenu() {
  selectedThemes.clear();
  document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('btn-sel').disabled = true;
  document.getElementById('btn-sel').textContent = '✅ Hacer solo los temas seleccionados';
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('theme-selector').style.display = 'block';
}

buildThemeGrid();
</script>

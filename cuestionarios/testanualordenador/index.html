<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Test Ordenador - 50 preguntas | Curso Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --c1: #25D366;
    --c2: #128C7E;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.12;
    animation: float 16s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 450px; height: 450px; background: var(--c4); bottom: -80px; right: -70px; animation-delay: -4s; }
  .blob:nth-child(3) { width: 380px; height: 380px; background: var(--c3); top: 40%; left: 70%; animation-delay: -8s; }

  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(20px, 15px) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 24px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: slideDown 0.6s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: white;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 2px;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .sub {
    color: var(--sub);
    font-weight: 600;
  }

  .action-bar {
    background: rgba(17, 29, 53, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 60px;
    padding: 12px 24px;
    margin-bottom: 35px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .score-box {
    background: linear-gradient(135deg, var(--c2), #0f6e5f);
    padding: 8px 20px;
    border-radius: 40px;
    font-weight: 800;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .score-box span {
    font-size: 1.4rem;
  }
  .btn-group {
    display: flex;
    gap: 16px;
  }
  .btn-primary, .btn-secondary {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    padding: 10px 24px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: white;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(37,211,102,0.4);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }

  .block-section {
    margin-bottom: 48px;
  }
  .block-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.7rem;
    margin-bottom: 20px;
    padding-left: 12px;
    border-left: 6px solid var(--c1);
    background: linear-gradient(90deg, rgba(37,211,102,0.1), transparent);
    border-radius: 0 20px 20px 0;
  }
  .questions-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 28px;
    padding: 1.5rem;
    transition: all 0.2s;
  }
  .q-title {
    display: flex;
    gap: 12px;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .q-num {
    background: rgba(37,211,102,0.2);
    color: var(--c1);
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 0.8rem;
  }
  .q-text {
    font-weight: 800;
    font-size: 1.1rem;
    line-height: 1.4;
    flex: 1;
  }
  .options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
  }
  .opt-item {
    flex: 1 1 calc(50% - 12px);
    min-width: 180px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .opt-item:hover:not(.disabled-highlight) {
    background: rgba(37,211,102,0.08);
    border-color: var(--c1);
  }
  .opt-item input {
    display: none;
  }
  .opt-label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .opt-letter {
    width: 34px;
    height: 34px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
  }
  .opt-text {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .opt-item.correct-highlight {
    background: rgba(37,211,102,0.2);
    border-color: var(--c1);
  }
  .opt-item.correct-highlight .opt-letter {
    background: var(--c1);
    color: #0a1628;
  }
  .opt-item.wrong-highlight {
    background: rgba(255,107,107,0.2);
    border-color: var(--c4);
  }
  .opt-item.wrong-highlight .opt-letter {
    background: var(--c4);
    color: white;
  }
  .opt-item input:checked + .opt-label {
    background: rgba(37,211,102,0.1);
    border-radius: 18px;
  }
  .opt-item input:checked + .opt-label .opt-letter {
    background: var(--c2);
    color: white;
  }

  @media (max-width: 720px) {
    .options-row {
      flex-direction: column;
    }
    .opt-item {
      flex: 1 1 auto;
    }
    .action-bar {
      flex-direction: column;
      align-items: stretch;
      border-radius: 28px;
    }
    .btn-group {
      justify-content: center;
    }
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--sub);
  }
</style>
</head>

</div>

<script>
  // ------------------------------------------------------------------

  const FINAL_QUESTIONS = [...QUESTIONS, ...ADDITIONAL];
  // Asegurar 50 (ahora 50 exactos)
  console.assert(FINAL_QUESTIONS.length === 50, "Preguntas finales: " + FINAL_QUESTIONS.length);

  // Render dinámico
  const container = document.getElementById('questionsContainer');
  const scoreSpan = document.getElementById('scoreValue');
  const checkBtn = document.getElementById('checkAllBtn');
  const resetBtn = document.getElementById('resetAllBtn');

  function groupByBlock(questions) {
    const map = new Map();
    questions.forEach((q, idx) => {
      if (!map.has(q.block)) map.set(q.block, []);
      map.get(q.block).push({ ...q, originalIndex: idx });
    });
    return map;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function renderQuiz() {
    const grouped = groupByBlock(FINAL_QUESTIONS);
    let html = '';
    let globalIdx = 0;
    for (let [blockName, blockQuestions] of grouped.entries()) {
      html += `<div class="block-section"><div class="block-title">${escapeHtml(blockName)}</div><div class="questions-grid">`;
      for (let q of blockQuestions) {
        const letters = ['A', 'B', 'C', 'D'];
        html += `
          <div class="question-card" data-qidx="${globalIdx}" data-correct="${q.correct}">
            <div class="q-title">
              <span class="q-num">Pregunta ${globalIdx+1}</span>
              <div class="q-text">${escapeHtml(q.text)}</div>
            </div>
            <div class="options-row" id="row_${globalIdx}">
        `;
        q.options.forEach((opt, optIdx) => {
          html += `
            <div class="opt-item" data-optidx="${optIdx}" data-parent="${globalIdx}">
              <input type="radio" name="q_${globalIdx}" id="q_${globalIdx}_opt${optIdx}" value="${optIdx}">
              <label for="q_${globalIdx}_opt${optIdx}" class="opt-label">
                <span class="opt-letter">${letters[optIdx]}</span>
                <span class="opt-text">${escapeHtml(opt)}</span>
              </label>
            </div>
          `;
        });
        html += `</div></div>`;
        globalIdx++;
      }
      html += `</div></div>`;
    }
    container.innerHTML = html;
  }

  function getCurrentScore() {
    let correct = 0;
    for (let i = 0; i < FINAL_QUESTIONS.length; i++) {
      const selected = document.querySelector(`input[name="q_${i}"]:checked`);
      if (selected) {
        const val = parseInt(selected.value);
        if (val === FINAL_QUESTIONS[i].correct) correct++;
      }
    }
    return correct;
  }

  function updateScoreDisplay() {
    const scr = getCurrentScore();
    scoreSpan.innerText = scr;
    return scr;
  }

  function clearHighlights() {
    for (let i = 0; i < FINAL_QUESTIONS.length; i++) {
      const card = document.querySelector(`.question-card[data-qidx="${i}"]`);
      if (card) {
        const opts = card.querySelectorAll('.opt-item');
        opts.forEach(opt => opt.classList.remove('correct-highlight', 'wrong-highlight'));
      }
    }
  }

  function correctAll() {
    clearHighlights();
    let totalCorrect = 0;
    for (let i = 0; i < FINAL_QUESTIONS.length; i++) {
      const correctIdx = FINAL_QUESTIONS[i].correct;
      const card = document.querySelector(`.question-card[data-qidx="${i}"]`);
      if (!card) continue;
      const correctOptDiv = card.querySelector(`.opt-item[data-optidx="${correctIdx}"]`);
      if (correctOptDiv) correctOptDiv.classList.add('correct-highlight');
      const selectedRadio = document.querySelector(`input[name="q_${i}"]:checked`);
      if (selectedRadio) {
        const selectedVal = parseInt(selectedRadio.value);
        if (selectedVal === correctIdx) totalCorrect++;
        else {
          const wrongDiv = card.querySelector(`.opt-item[data-optidx="${selectedVal}"]`);
          if (wrongDiv) wrongDiv.classList.add('wrong-highlight');
        }
      }
    }
    scoreSpan.innerText = totalCorrect;
  }

  function resetQuiz() {
    for (let i = 0; i < FINAL_QUESTIONS.length; i++) {
      const radios = document.querySelectorAll(`input[name="q_${i}"]`);
      radios.forEach(r => r.checked = false);
    }
    clearHighlights();
    updateScoreDisplay();
  }

  function attachEvents() {
    checkBtn.addEventListener('click', correctAll);
    resetBtn.addEventListener('click', resetQuiz);
    container.addEventListener('change', (e) => {
      if (e.target && e.target.type === 'radio') updateScoreDisplay();
    });
  }

  renderQuiz();
  attachEvents();
  updateScoreDisplay();
</script>
</body>
</html>

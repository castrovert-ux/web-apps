<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Test tecnológico - 50 preguntas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --c1: #25D366;
    --c2: #128C7E;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
    --border-glow: rgba(37,211,102,0.2);
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* fondos decorativos */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.12;
    animation: float 16s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 450px; height: 450px; background: var(--c4); bottom: -80px; right: -70px; animation-delay: -4s; }
  .blob:nth-child(3) { width: 380px; height: 380px; background: var(--c3); top: 40%; left: 70%; animation-delay: -8s; }

  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(20px, 15px) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 24px 60px;
  }

  /* header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: slideDown 0.6s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: white;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 2px;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .sub {
    color: var(--sub);
    font-weight: 600;
  }

  /* barra de control y puntuación */
  .action-bar {
    background: rgba(17, 29, 53, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 60px;
    padding: 12px 24px;
    margin-bottom: 35px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .score-box {
    background: linear-gradient(135deg, var(--c2), #0f6e5f);
    padding: 8px 20px;
    border-radius: 40px;
    font-weight: 800;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .score-box span {
    font-size: 1.4rem;
  }
  .btn-group {
    display: flex;
    gap: 16px;
  }
  .btn-primary, .btn-secondary {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    padding: 10px 24px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: white;
    box-shadow: 0 4px 12px rgba(37,211,102,0.2);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(37,211,102,0.4);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }

  /* bloque temático */
  .block-section {
    margin-bottom: 48px;
  }
  .block-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.7rem;
    margin-bottom: 20px;
    padding-left: 12px;
    border-left: 6px solid var(--c1);
    background: linear-gradient(90deg, rgba(37,211,102,0.1), transparent);
    border-radius: 0 20px 20px 0;
  }
  .questions-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* tarjeta de pregunta */
  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 28px;
    padding: 1.5rem;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .q-title {
    display: flex;
    gap: 12px;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .q-num {
    background: rgba(37,211,102,0.2);
    color: var(--c1);
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 40px;
    font-size: 0.8rem;
  }
  .q-text {
    font-weight: 800;
    font-size: 1.1rem;
    line-height: 1.4;
    flex: 1;
  }
  .options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
  }
  .opt-item {
    flex: 1 1 calc(50% - 12px);
    min-width: 180px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .opt-item:hover:not(.disabled-highlight) {
    background: rgba(37,211,102,0.08);
    border-color: var(--c1);
    transform: translateX(4px);
  }
  /* radio hidden */
  .opt-item input {
    display: none;
  }
  .opt-label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .opt-letter {
    width: 34px;
    height: 34px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    transition: 0.1s;
  }
  .opt-text {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
  }
  /* estilos de corrección */
  .opt-item.correct-highlight {
    background: rgba(37,211,102,0.2);
    border-color: var(--c1);
  }
  .opt-item.correct-highlight .opt-letter {
    background: var(--c1);
    color: #0a1628;
  }
  .opt-item.wrong-highlight {
    background: rgba(255,107,107,0.2);
    border-color: var(--c4);
  }
  .opt-item.wrong-highlight .opt-letter {
    background: var(--c4);
    color: white;
  }
  /* seleccionado normal */
  .opt-item input:checked + .opt-label {
    background: rgba(37,211,102,0.1);
    border-radius: 18px;
  }
  .opt-item input:checked + .opt-label .opt-letter {
    background: var(--c2);
    color: white;
  }

  @media (max-width: 720px) {
    .options-row {
      flex-direction: column;
    }
    .opt-item {
      flex: 1 1 auto;
    }
    .action-bar {
      flex-direction: column;
      align-items: stretch;
      border-radius: 28px;
    }
    .btn-group {
      justify-content: center;
    }
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob"></div>

    { block: "🤖 Otras utilidades e IA", text: "¿Qué significa la IA (Inteligencia Artificial) en apps como Gemini?", options: ["Sistemas que imitan el razonamiento humano", "Internet rápido", "Alta definición", "Antivirus"], correct: 0 },
    { block: "🤖 Otras utilidades e IA", text: "¿Qué permite la opción 'Compartir ubicación en tiempo real' de Google Maps?", options: ["Mostrar tu posición a contactos por un tiempo determinado", "Publicar en redes sociales", "Llamar a emergencias", "Guardar ubicaciones secretas"], correct: 0 },
    { block: "🤖 Otras utilidades e IA", text: "¿Para qué sirve el 'Escáner de documentos' desde Google Drive o Google Keep?", options: ["Digitalizar documentos usando la cámara y guardarlos como PDF", "Editar fotos antiguas", "Enviar fax", "Leer códigos QR"], correct: 0 }
  ];

  // Verificamos que sean 50
  console.assert(QUESTIONS_DATA.length === 50, "Error: se generaron " + QUESTIONS_DATA.length + " preguntas, deben ser 50");

  // Referencias al DOM
  const container = document.getElementById('questionsContainer');
  const scoreSpan = document.getElementById('scoreValue');
  const checkBtn = document.getElementById('checkAllBtn');
  const resetBtn = document.getElementById('resetAllBtn');

  // Renderizar preguntas por bloques (agrupadas)
  function groupByBlock(questions) {
    const blocksMap = new Map();
    questions.forEach((q, idx) => {
      if (!blocksMap.has(q.block)) blocksMap.set(q.block, []);
      blocksMap.get(q.block).push({ ...q, originalIndex: idx });
    });
    return blocksMap;
  }

  let allQuestionWrappers = []; // almacenará referencias a contenedores de cada pregunta

  function renderFullTest() {
    const grouped = groupByBlock(QUESTIONS_DATA);
    let html = '';
    let questionCounter = 0;
    for (let [blockName, blockQuestions] of grouped.entries()) {
      html += `<div class="block-section"><div class="block-title">${blockName}</div><div class="questions-grid" id="block-${blockName.replace(/\s/g, '')}">`;
      for (let q of blockQuestions) {
        const qid = `q_${questionCounter}`;
        const letters = ['A', 'B', 'C', 'D'];
        html += `
          <div class="question-card" data-qidx="${questionCounter}" data-correct="${q.correct}">
            <div class="q-title">
              <span class="q-num">Pregunta ${questionCounter+1}</span>
              <div class="q-text">${escapeHtml(q.text)}</div>
            </div>
            <div class="options-row" id="options-${qid}">
        `;
        q.options.forEach((opt, optIdx) => {
          html += `
            <div class="opt-item" data-optidx="${optIdx}" data-parent="${questionCounter}">
              <input type="radio" name="q_${questionCounter}" id="${qid}_opt${optIdx}" value="${optIdx}">
              <label for="${qid}_opt${optIdx}" class="opt-label">
                <span class="opt-letter">${letters[optIdx]}</span>
                <span class="opt-text">${escapeHtml(opt)}</span>
              </label>
            </div>
          `;
        });
        html += `</div></div>`;
        questionCounter++;
      }
      html += `</div></div>`;
    }
    container.innerHTML = html;
    // Guardar referencias y agregar event listeners para evitar propagación inesperada
    allQuestionWrappers = [];
    const allCards = document.querySelectorAll('.question-card');
    allCards.forEach((card, idx) => {
      allQuestionWrappers.push(card);
    });
    // Almacenar radios ya mapeados: no necesario
    updateScoreDisplay(); // mostrar 0/50
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // Contar aciertos actuales (sin highlights, solo selección actual)
  function countCurrentScore() {
    let correctCount = 0;
    for (let i = 0; i < QUESTIONS_DATA.length; i++) {
      const selectedRadio = document.querySelector(`input[name="q_${i}"]:checked`);
      if (selectedRadio) {
        const selectedVal = parseInt(selectedRadio.value);
        const correctVal = QUESTIONS_DATA[i].correct;
        if (selectedVal === correctVal) correctCount++;
      }
    }
    return correctCount;
  }

  function updateScoreDisplay() {
    const currentCorrect = countCurrentScore();
    scoreSpan.innerText = currentCorrect;
    return currentCorrect;
  }

  // Limpiar todos los estilos de corrección (verde/rojo)
  function clearAllHighlights() {
    for (let i = 0; i < QUESTIONS_DATA.length; i++) {
      const containerCard = document.querySelector(`.question-card[data-qidx="${i}"]`);
      if (containerCard) {
        const optItems = containerCard.querySelectorAll('.opt-item');
        optItems.forEach(item => {
          item.classList.remove('correct-highlight', 'wrong-highlight');
        });
      }
    }
  }

  // CORREGIR TODO: Marcar en verde opción correcta, y en rojo la seleccionada si es errónea
  function correctAll() {
    clearAllHighlights();
    let totalCorrect = 0;
    for (let i = 0; i < QUESTIONS_DATA.length; i++) {
      const qData = QUESTIONS_DATA[i];
      const correctIdx = qData.correct;
      const containerCard = document.querySelector(`.question-card[data-qidx="${i}"]`);
      if (!containerCard) continue;
      // Marcar la opción correcta siempre en verde
      const correctOptDiv = containerCard.querySelector(`.opt-item[data-optidx="${correctIdx}"]`);
      if (correctOptDiv) correctOptDiv.classList.add('correct-highlight');
      
      // Ver selección del usuario
      const selectedRadio = document.querySelector(`input[name="q_${i}"]:checked`);
      if (selectedRadio) {
        const selectedVal = parseInt(selectedRadio.value);
        if (selectedVal === correctIdx) {
          totalCorrect++;
        } else {
          // Marcar la opción seleccionada como wrong
          const wrongOptDiv = containerCard.querySelector(`.opt-item[data-optidx="${selectedVal}"]`);
          if (wrongOptDiv) wrongOptDiv.classList.add('wrong-highlight');
        }
      }
    }
    // Actualizar marcador con puntaje real
    scoreSpan.innerText = totalCorrect;
    // Opcionalmente mostrar pequeño efecto
  }

  // Reiniciar completamente: desmarcar todos, limpiar estilos, puntuación a 0
  function resetQuiz() {
    // Deseleccionar todos los radios
    for (let i = 0; i < QUESTIONS_DATA.length; i++) {
      const radios = document.querySelectorAll(`input[name="q_${i}"]`);
      radios.forEach(radio => radio.checked = false);
    }
    clearAllHighlights();
    updateScoreDisplay(); // recalcula 0
  }

  // Añadir listeners a botones, además refrescar automáticamente la puntuación cuando el usuario seleccione opciones (por si acaso)
  function attachGlobalEvents() {
    checkBtn.addEventListener('click', () => {
      correctAll();
    });
    resetBtn.addEventListener('click', () => {
      resetQuiz();
    });
    // Delegación de eventos para actualizar el contador cada vez que se selecciona una opción
    container.addEventListener('change', (e) => {
      if (e.target && e.target.type === 'radio') {
        updateScoreDisplay();
      }
    });
  }

  // Inicializar
  renderFullTest();
  attachGlobalEvents();
  updateScoreDisplay();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Final · Curso de Móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #4FC3F7;
    --c2: #0277BD;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #69F0AE;
    --c6: #CE93D8;
    --bg: #070f1e;
    --card: #0f1d32;
    --card2: #131f35;
    --text: #FFFFFE;
    --sub: #7a90b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.13; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 600px; height: 600px; background: var(--c2); top: -150px; left: -150px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 420px; height: 420px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 350px; height: 350px; background: var(--c6); top: 40%; left: 60%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(25px,18px) scale(1.07); } }

  .container { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 40px 20px; }

  /* ---- HEADER ---- */
  .header { text-align: center; margin-bottom: 36px; animation: slideDown 0.7s ease; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:translateY(0); } }
  .badge { display: inline-block; background: linear-gradient(135deg, var(--c2), var(--c1)); color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 18px; border-radius: 100px; margin-bottom: 14px; }
  h1 { font-family: 'Fredoka One', cursive; font-size: clamp(2rem,6vw,3.2rem); line-height: 1.1; background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
  .subtitle { color: var(--sub); font-size: 1rem; font-weight: 600; }

  /* ---- SELECTOR DE TEMAS ---- */
  #theme-selector { animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  .theme-intro { text-align:center; margin-bottom: 28px; }
  .theme-intro p { color: var(--sub); font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .theme-card {
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.07);
    border-radius: 20px; padding: 20px 18px;
    cursor: pointer; transition: all 0.25s ease;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  }
  .theme-card:hover { border-color: var(--c1); background: rgba(79,195,247,0.07); transform: translateY(-3px); }
  .theme-card.selected { border-color: var(--c1); background: rgba(79,195,247,0.12); }
  .theme-icon { font-size: 2rem; }
  .theme-name { font-weight: 800; font-size: 1rem; color: var(--text); line-height: 1.3; }
  .theme-count { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .btn-start-all {
    display: block; width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.1rem;
    cursor: pointer; transition: all 0.2s; margin-bottom: 12px;
  }
  .btn-start-all:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,195,247,0.35); }
  .btn-start-selected {
    display: block; width: 100%; padding: 14px; border-radius: 16px;
    border: 2px solid rgba(79,195,247,0.4); color: var(--c1);
    background: transparent; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-start-selected:hover { background: rgba(79,195,247,0.1); }
  .btn-start-selected:disabled { opacity: 0.35; cursor: default; }

  /* ---- QUIZ ---- */
  #quiz-area { display: none; }
  .progress-wrap { margin-bottom: 26px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); border-radius: 10px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  .section-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 14px; border-radius: 100px; margin-bottom: 10px; background: rgba(79,195,247,0.12); color: var(--c1); }

  .question-card { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 32px 28px; margin-bottom: 20px; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from { opacity:0; transform:scale(0.92) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .q-type-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; padding: 4px 12px; border-radius: 100px; margin-bottom: 16px; }
  .type-mc { background: rgba(79,195,247,0.15); color: var(--c1); }
  .type-tf { background: rgba(255,217,61,0.15); color: var(--c3); }

  .q-number { font-size: 0.78rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 1.15rem; font-weight: 700; line-height: 1.55; }

  .options { display: flex; flex-direction: column; gap: 11px; margin-top: 22px; }
  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 13px 18px; color: var(--text);
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600;
    text-align: left; cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; gap: 13px;
  }
  .option-btn:hover:not(:disabled) { background: rgba(79,195,247,0.1); border-color: var(--c1); transform: translateX(5px); }
  .option-letter { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; transition: all 0.2s; }
  .option-btn.correct { background: rgba(105,240,174,0.1); border-color: var(--c5); }
  .option-btn.correct .option-letter { background: var(--c5); color: #070f1e; }
  .option-btn.wrong { background: rgba(255,107,107,0.1); border-color: var(--c4); }
  .option-btn.wrong .option-letter { background: var(--c4); color: #fff; }
  .option-btn:disabled { cursor: default; }

  .feedback { display: none; margin-top: 16px; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; animation: fadeIn 0.3s ease; line-height: 1.5; }
  .feedback.correct-fb { display: flex; background: rgba(105,240,174,0.1); border: 1px solid rgba(105,240,174,0.3); color: var(--c5); }
  .feedback.wrong-fb   { display: flex; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--c4); }

  .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 4px; }
  .btn-next { padding: 14px 32px; border-radius: 14px; border: none; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; background: linear-gradient(135deg, var(--c3), #f59e0b); color: #070f1e; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4); }

  /* ---- RESULTADOS ---- */
  #results { display: none; text-align: center; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1); }
  #results.show { display: block; }
  .trophy { font-size: 5rem; margin-bottom: 16px; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-12px) rotate(5deg); } }
  .score-circle { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--c1) 0%, var(--c3) var(--pct,100%), rgba(255,255,255,0.05) var(--pct,100%)); display: flex; align-items: center; justify-content: center; margin: 20px auto; position: relative; }
  .score-circle::before { content:''; position:absolute; inset:10px; border-radius:50%; background:var(--bg); }
  .score-number { font-family: 'Fredoka One', cursive; font-size: 2.2rem; position: relative; z-index: 1; }
  .result-msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--sub); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }

  .result-breakdown { text-align: left; background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
  .result-breakdown h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--sub); margin-bottom: 16px; }
  .breakdown-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; }
  .breakdown-row:last-child { border-bottom: none; }
  .bd-name { font-size: 0.95rem; font-weight: 700; color: var(--text); flex: 1; }
  .bd-score { font-size: 0.9rem; font-weight: 800; color: var(--c1); white-space: nowrap; }
  .bd-bar-wrap { width: 80px; height: 6px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .bd-bar { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); border-radius: 4px; }

  .btns-result { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn-restart { padding: 15px 32px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn-restart:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(79,195,247,0.4); }
  .btn-menu { padding: 15px 32px; border-radius: 16px; border: 2px solid rgba(79,195,247,0.35); background: transparent; color: var(--c1); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
  .btn-menu:hover { background: rgba(79,195,247,0.1); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="container">

  <div class="header">
    <div class="badge">📱 Curso de Móvil</div>
    <h1>Test Final del Curso</h1>
    <p class="subtitle">Comprueba todo lo que has aprendido este año · 50 preguntas</p>
  </div>

  <!-- SELECTOR DE TEMAS -->
  <div id="theme-selector">
    <div class="theme-intro">
      <p>Elige un bloque temático o haz el test completo</p>
    </div>
    <div class="theme-grid" id="theme-grid"></div>
    <button class="btn-start-all" onclick="startQuiz('all')">🚀 Hacer el test completo (50 preguntas)</button>
    <button class="btn-start-selected" id="btn-sel" onclick="startSelected()" disabled>✅ Hacer solo los temas seleccionados</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="question-card" id="q-card">
      <div class="section-tag" id="q-section-tag"></div>
      <div class="q-type-badge" id="q-type-badge"></div>
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-body"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>
    <div class="btn-row">
      <button class="btn-next hidden" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <!-- RESULTADOS -->
  <div id="results">
    <div class="trophy" id="trophy">🏆</div>
    <div class="score-circle" id="score-circle">
      <span class="score-number" id="score-num">0/50</span>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-breakdown" id="breakdown"></div>
    <div class="btns-result">
      <button class="btn-restart" onclick="restartQuiz()">🔄 Repetir este test</button>
      <button class="btn-menu" onclick="goMenu()">📋 Elegir otro tema</button>
    </div>
  </div>

</div>

<script>
const allSections = [
  {
    id: 'primeros',
    name: 'Primeros pasos',
    icon: '📱',
    questions: [
      { type:'mc', text:'¿Qué indica el símbolo de la batería en la parte superior de la pantalla?', options:['La cobertura de llamadas','El nivel de carga que le queda al móvil','La conexión a internet','El volumen del teléfono'], correct:1, explanation:'El icono de batería muestra cuánta carga le queda al móvil. Cuando esté bajo, ¡toca cargarlo!' },
      { type:'mc', text:'¿Para qué sirve el botón de encendido/apagado del móvil?', options:['Para hacer fotografías','Para abrir internet','Para encender, apagar o bloquear la pantalla','Para aumentar el volumen'], correct:2, explanation:'El botón lateral sirve para encender, apagar y bloquear o desbloquear la pantalla con una pulsación corta.' },
      { type:'tf', text:'Deslizar el dedo por la pantalla sirve para desplazarse entre páginas y por el contenido.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! El gesto de deslizar (swipe) es uno de los gestos más usados: permite pasar páginas y bajar por la pantalla.' },
      { type:'mc', text:'¿Qué es una captura de pantalla?', options:['Una foto tomada con la cámara trasera','Una imagen que guarda lo que se ve en ese momento en la pantalla','Un mensaje de texto','Un vídeo grabado con el móvil'], correct:1, explanation:'La captura de pantalla (screenshot) guarda como imagen todo lo que aparece en pantalla en ese instante.' },
      { type:'mc', text:'¿Cómo se puede ampliar el tamaño del texto en un móvil Android?', options:['Desde la aplicación Cámara','Llamando al servicio técnico','Instalando una app de pago','Desde los Ajustes, en el apartado Accesibilidad o Pantalla'], correct:3, explanation:'En Ajustes → Accesibilidad (o Pantalla) puedes aumentar el tamaño de letra para verla más cómodamente.' },
      { type:'mc', text:'¿Qué es un widget en la pantalla de inicio?', options:['Un tipo de funda protectora','Una red social','Un pequeño elemento interactivo que muestra información directamente en la pantalla','Un tipo de tarjeta SIM'], correct:2, explanation:'Los widgets son pequeños bloques que muestran información útil (tiempo, calendario, notas...) sin necesidad de abrir la app.' },
      { type:'tf', text:'Para hacer una fotografía se debe abrir la aplicación Cámara y pulsar el botón redondo.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Exacto! La app Cámara tiene un botón circular grande en el centro de la pantalla para disparar la foto.' },
      { type:'mc', text:'¿Qué ocurre cuando aparece una notificación en la pantalla?', options:['El móvil se ha roto','Hay algo nuevo que atender, como un mensaje o llamada perdida','La batería está al 100 %','Hay que apagar el móvil'], correct:1, explanation:'Las notificaciones avisan de mensajes, llamadas, recordatorios u otras novedades de las aplicaciones.' },
      { type:'mc', text:'¿Para qué sirve el modo avión?', options:['Para hacer mejores fotos','Para escuchar música sin auriculares','Para desconectar todas las comunicaciones del móvil (llamadas, internet, bluetooth)','Para aumentar la velocidad del procesador'], correct:2, explanation:'El modo avión desactiva todas las transmisiones de radio: llamadas, datos, wifi y bluetooth. Útil en vuelos o para ahorrar batería.' },
      { type:'mc', text:'¿Qué es el teclado Gboard de Google?', options:['Un teclado físico para conectar al móvil','Un juego de palabras','Una app de teclado en pantalla con traducción, búsqueda por voz y corrección automática','Una app para organizar documentos'], correct:2, explanation:'Gboard es el teclado de Google para el móvil. Permite escribir por voz, buscar emojis y traducir mientras escribes.' },
    ]
  },
  {
    id: 'funciones',
    name: 'Funciones básicas y alarmas',
    icon: '⏰',
    questions: [
      { type:'mc', text:'¿En qué aplicación del móvil se configura una alarma?', options:['Calculadora','Cámara','Reloj','Play Store'], correct:2, explanation:'La aplicación Reloj tiene una sección de Alarmas donde puedes crear, editar y eliminar alarmas fácilmente.' },
      { type:'tf', text:'El modo silencio hace que el teléfono no emita sonidos de llamada ni notificaciones.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! Con el modo silencio el móvil deja de sonar, aunque puede seguir vibrando si no activas también la vibración en cero.' },
      { type:'mc', text:'¿Qué se puede hacer desde el panel de notificaciones (deslizando desde arriba)?', options:['Solo ver la hora','Solo hacer llamadas','Ver notificaciones y activar wifi, bluetooth, linterna y otras funciones rápidas','Abrir la cámara únicamente'], correct:2, explanation:'Al deslizar desde la parte superior aparece el panel de notificaciones con accesos directos a funciones del sistema.' },
      { type:'mc', text:'¿Qué es el modo "No molestar"?', options:['Una app para bloquear páginas web','Una función que apaga el móvil automáticamente','Un tipo de funda especial','Una función que silencia llamadas y notificaciones durante un tiempo'], correct:3, explanation:'El modo "No molestar" permite descansar sin interrupciones: silencia todo según el horario que tú elijas.' },
      { type:'mc', text:'¿Cómo se puede compartir ubicación con otra persona desde el móvil?', options:['Solo con móviles muy caros','No es posible desde el móvil','A través de apps como WhatsApp o Google Maps usando "Compartir ubicación"','Solo se puede llamar para decírsela'], correct:2, explanation:'Aplicaciones como WhatsApp o Google Maps permiten enviar tu posición en tiempo real o durante un tiempo determinado.' },
    ]
  },
  {
    id: 'google',
    name: 'Entorno Google',
    icon: '🌐',
    questions: [
      { type:'mc', text:'¿Para qué sirve una cuenta de Google en el móvil Android?', options:['Solo para enviar correos','Para hacer llamadas internacionales gratis','Para que el móvil funcione más rápido','Para acceder a todas las apps y servicios Google: Play Store, Drive, Fotos, etc.'], correct:3, explanation:'La cuenta de Google es el corazón del móvil Android: sin ella no se pueden descargar apps ni usar muchos servicios.' },
      { type:'mc', text:'¿Qué es Google Drive?', options:['Un programa de navegación GPS','Una red social','Una aplicación de música','Un servicio de almacenamiento en la nube para guardar archivos y fotos'], correct:3, explanation:'Google Drive guarda tus archivos en internet (la nube), de modo que puedes verlos desde cualquier dispositivo.' },
      { type:'tf', text:'La barra de búsqueda de Google permite escribir o hablar para buscar información en internet.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Correcto! Puedes escribir o pulsar el micrófono para buscar por voz. Es muy cómodo cuando escribir resulta difícil.' },
      { type:'mc', text:'¿Para qué sirve Google Maps en el móvil?', options:['Para enviar fotos a amigos','Para pagar facturas online','Para editar documentos','Para navegar con GPS, buscar lugares y obtener indicaciones de ruta'], correct:3, explanation:'Google Maps es un navegador y buscador de lugares muy completo: te dice cómo llegar a pie, en coche o en autobús.' },
      { type:'mc', text:'¿Qué significa que una app "se sincroniza" con la cuenta de Google?', options:['Que se descarga automáticamente','Que se actualiza sola','Que el móvil se conecta a otro teléfono','Que los datos se guardan en la nube y están disponibles desde otros dispositivos'], correct:3, explanation:'La sincronización guarda tu información en la nube: si cambias de móvil, todos tus datos siguen ahí.' },
    ]
  },
  {
    id: 'gmail',
    name: 'Gmail y correo',
    icon: '📧',
    questions: [
      { type:'mc', text:'¿Cómo se envía un correo electrónico desde Gmail?', options:['Pulsando el botón de llamada','Deslizando hacia la izquierda','Pulsando el botón de composición (lápiz o +) y rellenando destinatario, asunto y mensaje','Pulsando el botón de encendido'], correct:2, explanation:'El botón con forma de lápiz o "+" abre el editor de nuevo correo. Rellena a quién va, el asunto y el texto, y envía.' },
      { type:'tf', text:'La carpeta "Spam" o "Correo no deseado" contiene mensajes que el sistema detecta como posiblemente no deseados.', options:['✅ Verdadero','❌ Falso'], correct:0, explanation:'¡Exacto! Gmail filtra automáticamente los mensajes sospechosos o publicitarios a la carpeta Spam.' },
      { type:'mc', text:'¿Cómo se adjunta una foto a un correo en Gmail?', options:['No es posible adjuntar fotos','Escribiendo el nombre de la foto en el texto','Reenviando primero la foto a otro correo','Pulsando el icono de clip y seleccionando la foto desde la galería'], correct:3, explanation:'El icono del clip (adjuntar) te permite elegir una foto, documento o archivo para incluirlo en el correo.' },
      { type:'mc', text:'¿Para qué sirve la carpeta "Enviados" en Gmail?', options:['Para guardar borradores','Para ver correos recibidos','Para ver correos eliminados','Para ver los correos que hemos enviado nosotros'], correct:3, explanation:'La carpeta Enviados guarda una copia de todos los mensajes que tú has mandado, con la fecha y hora.' },
      { type:'mc', text:'¿Qué hacer si recibimos un correo sospechoso pidiendo contraseñas o datos bancarios?', options:['Responder con nuestros datos','Reenviarlo a todos los contactos','Llamar al banco desde el mismo correo','No abrirlo o marcarlo como spam: nunca facilitar datos personales por correo'], correct:3, explanation:'Los correos que piden datos bancarios o contraseñas son casi siempre fraudes (phishing). ¡Nunca respondas con tus datos!' },
    ]
  },
  {

let activeQuestions = [];
let selectedThemes = new Set();
let current = 0, score = 0, answered = false;
let sectionScores = {};

const typeLabels = {
  mc: { label: '🎯 Opción múltiple', cls: 'type-mc' },
  tf: { label: '⚖️ Verdadero / Falso', cls: 'type-tf' },
};

// Build theme selector
function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  allSections.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.id = 'theme-' + sec.id;
    card.innerHTML = `<div class="theme-icon">${sec.icon}</div><div class="theme-name">${sec.name}</div><div class="theme-count">${sec.questions.length} preguntas</div>`;
    card.onclick = () => toggleTheme(sec.id, card);
    grid.appendChild(card);
  });
}

function toggleTheme(id, card) {
  if (selectedThemes.has(id)) {
    selectedThemes.delete(id);
    card.classList.remove('selected');
  } else {
    selectedThemes.add(id);
    card.classList.add('selected');
  }
  document.getElementById('btn-sel').disabled = selectedThemes.size === 0;
  const count = Array.from(selectedThemes).reduce((a,id) => a + allSections.find(s=>s.id===id).questions.length, 0);
  document.getElementById('btn-sel').textContent = selectedThemes.size > 0
    ? `✅ Hacer temas seleccionados (${count} preguntas)`
    : '✅ Hacer solo los temas seleccionados';
}

function startQuiz(mode) {
  if (mode === 'all') {
    activeQuestions = [];
    allSections.forEach(sec => sec.questions.forEach(q => activeQuestions.push({...q, section: sec.name, sectionId: sec.id})));
  } else {
    activeQuestions = [];
    allSections.filter(s => selectedThemes.has(s.id)).forEach(sec => sec.questions.forEach(q => activeQuestions.push({...q, section: sec.name, sectionId: sec.id})));
  }
  sectionScores = {};
  allSections.forEach(s => { sectionScores[s.id] = {name: s.name, icon: s.icon, correct: 0, total: 0}; });
  activeQuestions.forEach(q => { if (sectionScores[q.sectionId]) sectionScores[q.sectionId].total++; });
  current = 0; score = 0; answered = false;
  document.getElementById('theme-selector').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('results').classList.remove('show');
  renderQuestion();
}

function startSelected() { startQuiz('selected'); }

function renderQuestion() {
  answered = false;
  const q = activeQuestions[current];
  const pct = (current / activeQuestions.length) * 100;

  document.getElementById('prog-label').textContent = `Pregunta ${current+1} de ${activeQuestions.length}`;
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('prog-fill').style.width = pct + '%';

  document.getElementById('q-section-tag').textContent = allSections.find(s=>s.id===q.sectionId)?.icon + ' ' + q.section;

  const badge = document.getElementById('q-type-badge');
  badge.textContent = typeLabels[q.type].label;
  badge.className = 'q-type-badge ' + typeLabels[q.type].cls;

  document.getElementById('q-number').textContent = `Pregunta ${current+1}`;
  document.getElementById('q-text').textContent = q.text;

  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('btn-next').classList.add('hidden');

  const card = document.getElementById('q-card');
  card.style.animation = 'none'; card.offsetHeight;
  card.style.animation = 'popIn 0.5s cubic-bezier(.34,1.56,.64,1)';

  const letters = ['A','B','C','D'];
  const body = document.getElementById('q-body');
  body.innerHTML = `<div class="options">${
    q.options.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
      <span class="option-letter">${q.type==='tf' ? (i===0?'V':'F') : letters[i]}</span>
      <span>${opt}</span>
    </button>`).join('')
  }</div>`;
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = activeQuestions[current];
  const fb = document.getElementById('q-feedback');
  q.options.forEach((_,i) => { document.getElementById(`opt-${i}`).disabled = true; });
  const chosen = document.getElementById(`opt-${idx}`);
  const correctEl = document.getElementById(`opt-${q.correct}`);
  if (idx === q.correct) {
    chosen.classList.add('correct');
    score++;
    if (sectionScores[q.sectionId]) sectionScores[q.sectionId].correct++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ' + q.explanation;
  } else {
    chosen.classList.add('wrong');
    correctEl.classList.add('correct');
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '💡 ' + q.explanation;
  }
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
  current++;
  if (current >= activeQuestions.length) showResults();
  else renderQuestion();
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const res = document.getElementById('results');
  res.classList.add('show');
  const total = activeQuestions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('score-circle').style.setProperty('--pct', pct + '%');
  document.getElementById('score-num').textContent = `${score}/${total}`;

  const msgs = [
    { min:0, max:39,  emoji:'📱', msg:'¡Sigue practicando!', sub:'Repasa los temas e inténtalo de nuevo. Con práctica lo conseguirás.' },
    { min:40, max:59, emoji:'👍', msg:'¡Buen intento!', sub:'Ya conoces buena parte del temario. Repasa los bloques donde hayas fallado.' },
    { min:60, max:79, emoji:'🌟', msg:'¡Muy bien hecho!', sub:'Buen nivel. Revisa las preguntas que te han fallado para llegar al 100 %.' },
    { min:80, max:95, emoji:'🏆', msg:'¡Excelente resultado!', sub:'Dominas el curso de móvil. ¡Enhorabuena!' },
    { min:96, max:100,emoji:'🥇', msg:'¡Perfecto! ¡Enhorabuena!', sub:'Has respondido prácticamente todo correcto. ¡Eres un experto del móvil!' },
  ];
  const m = msgs.find(x => pct >= x.min && pct <= x.max) || msgs[msgs.length-1];
  document.getElementById('trophy').textContent = m.emoji;
  document.getElementById('result-msg').textContent = m.msg;
  document.getElementById('result-sub').textContent = m.sub;

  // Breakdown por sección
  const usedSections = [...new Set(activeQuestions.map(q => q.sectionId))];
  const bd = document.getElementById('breakdown');
  bd.innerHTML = '<h3>Resultados por bloque</h3>' + usedSections.map(sid => {
    const s = sectionScores[sid];
    if (!s || s.total === 0) return '';
    const p = Math.round(s.correct / s.total * 100);
    const sec = allSections.find(x=>x.id===sid);
    return `<div class="breakdown-row">
      <span class="bd-name">${sec?.icon || ''} ${s.name}</span>
      <div class="bd-bar-wrap"><div class="bd-bar" style="width:${p}%"></div></div>
      <span class="bd-score">${s.correct}/${s.total}</span>
    </div>`;
  }).join('');
}

function restartQuiz() {
  sectionScores = {};
  allSections.forEach(s => { sectionScores[s.id] = {name: s.name, icon: s.icon, correct: 0, total: 0}; });
  activeQuestions.forEach(q => { if (sectionScores[q.sectionId]) sectionScores[q.sectionId].total++; });
  current = 0; score = 0; answered = false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function goMenu() {
  selectedThemes.clear();
  document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('btn-sel').disabled = true;
  document.getElementById('btn-sel').textContent = '✅ Hacer solo los temas seleccionados';
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('theme-selector').style.display = 'block';
}

buildThemeGrid();
</script>

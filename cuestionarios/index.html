<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionarios — Informática</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
    :root{--fondo:#0d2b55;--panel:#163567;--borde:#2e4f8a;--amarillo:#f5c518;--azul:#2e8de8;--texto:#f0f4ff;--gris:#b3caee;--verde:#2a9d5c;--rojo:#e63946;--naranja:#ff9f4a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;padding:40px 20px 60px}
    header{text-align:center;margin-bottom:50px}
    .logo{font-size:3rem;display:block;margin-bottom:10px}
    h1{font-family:'Fredoka One',cursive;font-size:clamp(2rem,6vw,3.2rem);color:var(--amarillo);text-shadow:3px 3px 0 #7a5f00;line-height:1.1}
    .subtitulo{margin-top:10px;font-size:1.12rem;color:var(--gris);font-weight:600}
    .btn-gear{position:fixed;bottom:28px;right:28px;width:46px;height:46px;background:none;border:none;cursor:pointer;opacity:.28;transition:opacity .25s,transform .6s;z-index:100;padding:0}
    .btn-gear:hover{opacity:.7;transform:rotate(45deg)}
    .btn-gear svg{width:46px;height:46px;display:block}
    .overlay{display:none;position:fixed;inset:0;background:rgba(5,15,35,.78);z-index:200;align-items:center;justify-content:center;padding:20px}
    .overlay.abierto{display:flex}
    .modal{background:var(--panel);border:2px solid var(--borde);border-radius:22px;padding:34px 30px 28px;width:100%;max-width:550px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:aparecer .3s ease;max-height:90vh;overflow-y:auto}
    @keyframes aparecer{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .modal-titulo{font-family:'Fredoka One',cursive;font-size:1.5rem;color:var(--amarillo)}
    .btn-cerrar{background:none;border:none;cursor:pointer;color:var(--gris);font-size:1.6rem;line-height:1;transition:color .2s}
    .btn-cerrar:hover{color:var(--rojo)}
    .separador{border:none;border-top:1px solid var(--borde);margin:4px 0 18px}
    .lista-items{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;max-height:260px;overflow-y:auto;padding-right:6px}
    .item-actual{display:flex;align-items:center;justify-content:space-between;background:#0f2040;border:1px solid var(--borde);border-radius:12px;padding:8px 14px;font-size:.95rem;font-weight:700;gap:12px}
    .item-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1}
    .item-info span:first-child{font-size:1.3rem}
    .item-info .item-titulo{font-weight:800;color:var(--amarillo)}
    .item-info .item-preg{background:#2a4660;padding:2px 8px;border-radius:30px;font-size:.75rem;font-weight:800}
    .item-acciones{display:flex;gap:10px}
    .btn-accion{background:none;border:none;cursor:pointer;font-size:1.2rem;transition:transform .1s,color .2s;padding:4px}
    .btn-editar{color:#5a7aaa}
    .btn-editar:hover{color:var(--naranja);transform:scale(1.05)}
    .btn-eliminar{color:#5a7aaa}
    .btn-eliminar:hover{color:var(--rojo);transform:scale(1.05)}
    .form-nuevo{display:flex;flex-direction:column;gap:14px;margin-top:16px}
    .campo label{display:block;font-size:.8rem;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .campo input{width:100%;background:#0f2040;border:2px solid var(--borde);border-radius:10px;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;color:var(--texto);outline:none}
    .campo input:focus{border-color:var(--azul)}
    .ruta-preview{background:#081828;border:1px solid var(--borde);border-radius:8px;padding:6px 12px;font-size:.8rem;color:#6a9fd8;font-family:monospace;font-weight:600;margin-top:4px}
    .fila-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn-guardar{width:100%;background:linear-gradient(135deg,var(--verde),#35c470);color:#fff;border:none;padding:14px 20px;border-radius:50px;font-family:'Fredoka One',cursive;font-size:1.15rem;cursor:pointer;box-shadow:0 6px 20px rgba(42,157,92,.4);transition:transform .15s;margin-top:10px}
    .btn-guardar:hover{transform:translateY(-3px)}
    .btn-cancel-edicion{background:linear-gradient(135deg,#4a6e8f,#2a4c6e);margin-top:6px;font-size:.95rem;padding:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;max-width:900px;margin:0 auto}
    .tarjeta{background:var(--panel);border:2px solid var(--borde);border-radius:20px;padding:30px 24px 26px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:transform .18s}
    .tarjeta:hover{transform:translateY(-6px);border-color:var(--azul)}
    .tarjeta .icono{font-size:2.8rem}
    .tarjeta .nombre{font-family:'Fredoka One',cursive;font-size:1.35rem;color:var(--amarillo)}
    .tarjeta .desc{font-size:.97rem;color:var(--gris);font-weight:600}
    .tarjeta .badge{margin-top:6px;background:var(--azul);color:#fff;font-size:.82rem;font-weight:800;padding:4px 14px;border-radius:50px}
    footer{text-align:center;margin-top:54px;color:#5a7aaa;font-size:.9rem;font-weight:600}
  </style>
</head>
<body>

<header>
  <span class="logo">🖥️</span>
  <h1>Cuestionarios de Informática</h1>
  <p class="subtitulo">Haga clic en el tema que quiera repasar</p>
</header>

<div class="grid" id="grid"></div>

<footer>Clase de Informática · Cuestionarios de repaso</footer>

<button class="btn-gear" onclick="abrirModal()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#b3caee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div class="overlay" id="overlay" onclick="cerrarSiOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-titulo" id="modalTitulo">⚙️ Administrar</span>
      <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
    </div>
    <div class="lista-items" id="listaActual"></div>
    <hr class="separador">
    <div class="form-nuevo">
      <div class="fila-dos">
        <div class="campo"><label>Icono</label><input type="text" id="nuevoIcono" value="📄"></div>
        <div class="campo"><label>Carpeta</label><input type="text" id="nuevoCarpeta" oninput="actualizarPreview()" placeholder="ej: excelgraficos"></div>
      </div>
      <div class="campo"><label>Título</label><input type="text" id="nuevoTitulo" placeholder="Nombre visible"></div>
      <div class="campo"><label>Descripción</label><input type="text" id="nuevoDesc" placeholder="Breve descripción"></div>
      <div class="fila-dos">
        <div class="campo"><label>Nº preguntas</label><input type="number" id="nuevoPreguntas" value="10"></div>
        <div class="campo"><label> </label><div class="ruta-preview" id="rutaPreview">Ruta: carpeta/index.html</div></div>
      </div>
      <button class="btn-guardar" id="btnGuardar" onclick="guardarCambios()">💾 Guardar nuevo</button>
      <button class="btn-guardar btn-cancel-edicion" id="btnCancelarEdicion" onclick="cancelarEdicion()" style="display: none;">✖️ Cancelar edición</button>
    </div>
  </div>
</div>

<script>
// --------------------------------------------------------------
// DATOS INICIALES (incluyendo Gráficos en Excel con 6 preguntas)
// --------------------------------------------------------------
let cuestionarios = [
  {icono:"📋", carpeta:"TablasWord", titulo:"Tablas en Word", desc:"Crear, editar y dar formato a tablas", preguntas:10},
  {icono:"🤼‍♀", carpeta:"GruposWhatsappMovil", titulo:"Grupos de Whatsapp", desc:"Funciones de Grupos de Whatsapp", preguntas:5},
  {icono:"📄", carpeta:"TitulosEncabezadosWord", titulo:"Títulos y Encabezados en Word", desc:"Índices y encabezados", preguntas:5},
  {icono:"💹", carpeta:"IntroduccionExcel", titulo:"Introducción a Excel", desc:"Primeros pasos en la hoja de cálculo", preguntas:10},
  {icono:"💹", carpeta:"ExcelFilasyColumnas", titulo:"Filas y Columnas en Excel", desc:"Conceptos básicos", preguntas:10},
  {icono:"🔑", carpeta:"cl@ve", titulo:"Aplicación Cl@ve", desc:"Identificación digital", preguntas:10},
  {icono:"📊", carpeta:"excelgraficos", titulo:"Gráficos en Excel", desc:"Tipos de gráficos y buenas prácticas", preguntas:6}
];

// Variables de estado para edición
let editandoIndex = null;

function renderGrid(){
    const contenedor = document.getElementById('grid');
    if(!contenedor) return;
    contenedor.innerHTML = cuestionarios.map(c => `
        <a class="tarjeta" href="${c.carpeta}/index.html">
            <span class="icono">${c.icono}</span>
            <span class="nombre">${escapeHtml(c.titulo)}</span>
            <span class="desc">${escapeHtml(c.desc)}</span>
            <span class="badge">${c.preguntas} preguntas</span>
        </a>`).join('');
}

// Helper para evitar XSS en textos
function escapeHtml(str){
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m){
        if(m === '&') return '&amp;';
        if(m === '<') return '&lt;';
        if(m === '>') return '&gt;';
        return m;
    });
}

function renderLista(){
    const listaDiv = document.getElementById('listaActual');
    if(!listaDiv) return;
    listaDiv.innerHTML = cuestionarios.map((c, idx) => `
        <div class="item-actual">
            <div class="item-info">
                <span>${c.icono}</span>
                <span class="item-titulo">${escapeHtml(c.titulo)}</span>
                <span class="item-preg">📌 ${c.preguntas}</span>
            </div>
            <div class="item-acciones">
                <button class="btn-accion btn-editar" onclick="iniciarEdicion(${idx})" title="Editar cuestionario">✏️</button>
                <button class="btn-accion btn-eliminar" onclick="eliminar(${idx})" title="Eliminar">🗑️</button>
            </div>
        </div>`).join('');
}

function abrirModal(){ 
    document.getElementById('overlay').classList.add('abierto');
    cancelarEdicion();  // resetea modo edición, limpia formulario para nuevo
    renderLista();
}

function cerrarModal(){ 
    document.getElementById('overlay').classList.remove('abierto');
    cancelarEdicion();
}

function cerrarSiOverlay(e){ 
    if(e.target.id === 'overlay') cerrarModal(); 
}

function actualizarPreview(){
    const carpeta = document.getElementById('nuevoCarpeta').value.trim();
    document.getElementById('rutaPreview').textContent = carpeta ? `Ruta: ${carpeta}/index.html` : '—';
}

// Iniciar edición: cargar datos del cuestionario en el formulario
function iniciarEdicion(index){
    editandoIndex = index;
    const item = cuestionarios[index];
    document.getElementById('nuevoIcono').value = item.icono || '📄';
    document.getElementById('nuevoCarpeta').value = item.carpeta || '';
    document.getElementById('nuevoTitulo').value = item.titulo || '';
    document.getElementById('nuevoDesc').value = item.desc || '';
    document.getElementById('nuevoPreguntas').value = item.preguntas || 10;
    actualizarPreview();
    
    // Cambiar UI del modal
    document.getElementById('modalTitulo').textContent = '✏️ Editar cuestionario';
    const btnGuardar = document.getElementById('btnGuardar');
    btnGuardar.textContent = '✅ Actualizar cuestionario';
    btnGuardar.style.background = "linear-gradient(135deg, #f5a623, #f39c12)";
    document.getElementById('btnCancelarEd

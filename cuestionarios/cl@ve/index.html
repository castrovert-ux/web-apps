<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Aplicación Cl@ve</title>
<style>
  :root {
    --c1: #0056b3; --c2: #003d7a; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; justify-content: center; padding: 20px;
  }

  .container { width: 100%; max-width: 600px; }
  .header { text-align: center; margin-bottom: 20px; }
  h1 { color: var(--c3); font-size: 1.8rem; }

  .progress-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 10px; color: var(--sub); }
  
  .card { background: var(--card); border: 1px solid #2e4f8a; border-radius: 12px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .q-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: #1c2a4a; border: 1px solid #3d5a80; border-radius: 8px; padding: 14px;
    color: white; text-align: left; cursor: pointer; font-size: 1rem;
  }
  .option-btn:hover { background: #2e4f8a; }
  .correct { background: #2a9d5c !important; }
  .wrong { background: #e63946 !important; }

  .feedback { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; background: #0d2b55; font-weight: bold; }
  .btn-next { display: none; width: 100%; margin-top: 15px; padding: 12px; border-radius: 8px; border: none; background: var(--c3); color: black; font-weight: bold; cursor: pointer; }

  .results { display: none; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <div class="header"><h1>Cuestionario Cl@ve</h1></div>

  <div id="quiz-area">
    <div class="progress-info">
      <span id="prog-txt">Pregunta 1 de 6</span>
      <span id="score-txt">⭐ 0 pts</span>
    </div>

    <div class="card">
      <div id="q-text" class="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <div class="results" id="results">
    <h2>¡Terminado!</h2>
    <div style="font-size: 2.5rem; margin: 20px 0;" id="score-final"></div>
    <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">Reiniciar</button>
  </div>
</div>

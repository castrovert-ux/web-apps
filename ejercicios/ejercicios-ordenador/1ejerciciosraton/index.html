<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ejercicios con el ratón</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #25D366; --c2: #128C7E; --c3: #FFD93D; --c4: #FF6B6B; --c6: #4DA3FF;
    --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
    --display: 'Fredoka One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
    --win: 'Segoe UI', Tahoma, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); font-size: 17px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100%; overflow-x: hidden; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c6); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(25px, 18px) scale(1.07); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(14px); } to { opacity: 1; transform: none; } }

  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 32px 18px 60px; }

  /* ---------- Cabecera ---------- */
  .header { text-align: center; margin-bottom: 22px; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 18px; border-radius: 100px; margin-bottom: 14px;
  }
  h1 {
    font-family: var(--display); font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
  }
  .subtitle { color: var(--sub); font-size: 1.05rem; font-weight: 700; }

  /* ---------- Mapa ---------- */
  .map-label { text-align: center; color: var(--sub); font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
  .map { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .map button {
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 1.05rem;
    background: rgba(255,255,255,0.06); color: var(--sub); border: 2px solid rgba(255,255,255,0.12); transition: transform 0.15s;
  }
  .map button:hover { transform: scale(1.08); }
  .map button.done { background: rgba(37,211,102,0.18); color: var(--c1); border-color: rgba(37,211,102,0.5); }
  .map button.cur { border-color: var(--c3); color: var(--text); box-shadow: 0 0 0 4px rgba(255,217,61,0.2); }

  /* ---------- Pantalla del ejercicio ---------- */
  .screen { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-top: 6px solid var(--accent, var(--c1)); border-radius: 24px; padding: 26px 28px 24px; }
  .screen.anim { animation: popIn 0.4s ease both; }
  .ex-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .ex-icon {
    width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; background: color-mix(in srgb, var(--accent, var(--c1)) 18%, transparent);
  }
  .ex-num { font-size: 0.85rem; font-weight: 800; color: var(--accent, var(--c1)); }
  .ex-title { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; }
  .ex-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .ex-check { font-size: 1.8rem; opacity: 0; transform: scale(0.4); transition: all 0.3s cubic-bezier(.34,1.56,.64,1); }
  .screen.done .ex-check { opacity: 1; transform: scale(1); }
  .mini-mouse { width: 40px; height: auto; flex-shrink: 0; }
  .mini-mouse .part { fill: #1c2f55; stroke: rgba(255,255,255,0.3); stroke-width: 3; transition: fill 0.12s; }
  .mini-mouse #m-left.on { fill: var(--c1); }
  .mini-mouse #m-right.on { fill: var(--c4); }
  .mini-mouse #m-wheel { fill: #2f4878; stroke: rgba(255,255,255,0.5); stroke-width: 3; transition: fill 0.12s; }
  .mini-mouse #m-wheel.on { fill: var(--c3); }

  .explain { font-size: 1.08rem; font-weight: 600; line-height: 1.6; color: #dfe7f7; margin-bottom: 14px; }
  .explain p + p { margin-top: 8px; }
  .explain b { color: var(--c3); }
  kbd {
    display: inline-block; font-family: inherit; font-size: 0.9em; font-weight: 800; line-height: 1.3;
    padding: 1px 8px; border-radius: 7px; background: #263e6b; color: #fff; border: 1px solid rgba(255,255,255,0.22); border-bottom-width: 3px;
  }
  .ex-tip {
    margin-top: 16px; font-size: 0.98rem; font-weight: 600; color: #d6e0f5; line-height: 1.5;
    background: rgba(255,217,61,0.08); border: 1px solid rgba(255,217,61,0.22); border-radius: 12px; padding: 10px 14px;
  }
  .ex-tip b { color: var(--c3); }

  /* ---------- Práctica ---------- */
  .practice { border-radius: 18px; padding: 16px; background: rgba(8,16,32,0.55); border: 2px dashed color-mix(in srgb, var(--accent, var(--c1)) 45%, transparent); }
  .tasks { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .tasks li {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 12px;
    font-size: 1.02rem; font-weight: 700; color: var(--sub); background: rgba(255,255,255,0.03); border: 2px solid transparent;
  }
  .tasks li b { color: inherit; font-weight: 800; }
  .tasks li.now { color: var(--text); border-color: var(--c3); background: rgba(255,217,61,0.08); }
  .tasks li.now b { color: var(--c3); }
  .tasks li.ok { color: var(--c1); }
  .tn {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.9rem; background: rgba(255,255,255,0.08);
  }
  .tasks li.now .tn { background: var(--c3); color: #0a1628; }
  .tasks li.ok .tn { background: var(--c1); color: #0a1628; }
  .stage { position: relative; user-select: none; -webkit-user-select: none; }
  .pr-msg {
    margin-top: 12px; text-align: center; font-weight: 800; font-size: 1.05rem; color: var(--sub);
    min-height: 1.4em; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .pr-msg.ok { color: var(--c1); }
  .pr-msg.warn { color: var(--c3); }
  .pr-btn {
    font-family: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; padding: 9px 18px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: var(--text); transition: all 0.2s;
  }
  .pr-btn:hover { border-color: var(--c1); background: rgba(37,211,102,0.12); }
  .pr-btn.main { background: var(--c1); color: #0a1628; border-color: var(--c1); font-size: 1.15rem; padding: 12px 24px; }
  .ghost { position: absolute; z-index: 80; pointer-events: none; opacity: 0.92; transform: rotate(-3deg); }
  .ghost .count {
    position: absolute; top: -8px; right: -8px; background: var(--c6); color: #fff; border-radius: 50%;
    width: 24px; height: 24px; font-size: 0.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .dragging-src { opacity: 0.3; }

  /* ---------- Escritorio simulado ---------- */
  .desk {
    position: relative; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
    background:
      radial-gradient(circle at 25% 30%, rgba(77,163,255,0.55), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(37,211,102,0.3), transparent 50%),
      linear-gradient(135deg, #12335f, #0b1d3a);
  }
  .desk-area { position: absolute; left: 0; right: 0; top: 0; bottom: 42px; }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42px; z-index: 500;
    background: rgba(8,16,32,0.9); border-top: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
  }
  .tb-start { width: 28px; height: 28px; border-radius: 6px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
  .tb-start i { background: var(--c6); border-radius: 1px; }
  .tb-apps { display: flex; gap: 6px; flex: 1; overflow: hidden; }
  .tb-app {
    font-family: var(--win); font-size: 0.8rem; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap;
    height: 32px; padding: 0 12px; border-radius: 6px; border: none; border-bottom: 3px solid transparent;
    background: rgba(255,255,255,0.08);
  }
  .tb-app.active { background: rgba(255,255,255,0.18); border-bottom-color: var(--c6); }
  .tb-app.min { opacity: 0.75; }
  .tb-app:hover { background: rgba(255,255,255,0.22); }
  .tb-clock { font-family: var(--win); font-size: 0.78rem; color: #c4d2ee; }
  .d-icon {
    position: absolute; width: 86px; padding: 6px 4px; border-radius: 8px; text-align: center; cursor: default;
    color: #fff; font-family: var(--win); font-weight: 600; font-size: 0.85rem; border: 1px solid transparent;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .d-icon:hover { background: rgba(255,255,255,0.1); }
  .d-icon.sel { background: rgba(77,163,255,0.38); border-color: rgba(127,190,255,0.9); }
  .d-emoji { font-size: 2.2rem; line-height: 1.15; text-shadow: none; }
  .d-label { word-break: break-word; }
  .d-icon input { width: 100%; font-family: var(--win); font-size: 0.85rem; text-align: center; color: #000; border: 1px solid var(--c6); padding: 1px 2px; }
  .d-icon.drop { background: rgba(255,217,61,0.3); border-color: var(--c3); }

  .win {
    position: absolute; background: #fff; color: #1b2433; border-radius: 8px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5); border: 1px solid #9fb0d0; display: flex; flex-direction: column;
    font-family: var(--win);
  }
  .win[hidden] { display: none; }
  .win.max { border-radius: 0; }
  .win-bar { height: 36px; flex-shrink: 0; display: flex; align-items: center; background: #eef1f6; padding-left: 12px; cursor: move; touch-action: none; }
  .win-title { flex: 1; font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-btns { display: flex; flex-shrink: 0; }
  .win-btns button { width: 42px; height: 36px; border: none; background: none; font-size: 0.95rem; cursor: pointer; color: #1b2433; font-family: var(--win); }
  .win-btns button:hover { background: #dfe4ec; }
  .win-btns .wb-close:hover { background: #e81123; color: #fff; }
  .win-body { flex: 1; overflow: auto; padding: 12px; font-size: 0.95rem; overscroll-behavior: contain; }
  .win-grip {
    position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 52%, #7d8fb3 52%, #7d8fb3 60%, transparent 60%, transparent 70%, #7d8fb3 70%, #7d8fb3 78%, transparent 78%);
  }
  .win.static { position: relative; }
  .win.static .win-bar { cursor: default; }
  .outline { position: absolute; border: 3px dashed var(--c3); border-radius: 8px; pointer-events: none; background: rgba(255,217,61,0.08); z-index: 1; }

  .explorer { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .x-item {
    width: 98px; padding: 6px 4px; text-align: center; border-radius: 6px; border: 1px solid transparent;
    font-size: 0.82rem; cursor: default; touch-action: none;
  }
  .x-item:hover { background: #eef3fb; }
  .x-item .xe { display: block; font-size: 2rem; line-height: 1.15; }
  .x-item.sel { background: #cfe3ff; border-color: #7fb2f0; }
  .x-item.drop { background: #fff3c4; border-color: #e0b400; }
  .x-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; font-size: 0.9rem; border: 1px solid transparent; touch-action: none; }
  .x-row:hover { background: #eef3fb; }
  .x-row.sel { background: #cfe3ff; border-color: #7fb2f0; }
  .x-row .xe { font-size: 1.3rem; }
  .doc { font-family: Consolas, 'Lucida Console', monospace; white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }
  .empty { color: #6b778c; text-align: center; padding-top: 30px; }

  .ctx {
    position: absolute; z-index: 900; min-width: 200px; background: #f6f7fa; color: #1b2433; border-radius: 8px; padding: 5px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #c9d1de; display: flex; flex-direction: column; font-family: var(--win);
  }
  .ctx button { font-family: inherit; font-size: 0.92rem; text-align: left; background: none; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; color: inherit; }
  .ctx button:hover { background: #dce6f8; }
  .ctx hr { border: none; border-top: 1px solid #d5dbe6; margin: 4px 6px; }

  /* ---------- Globos ---------- */
  .sky {
    position: relative; height: 330px; overflow: hidden; border-radius: 14px;
    background: linear-gradient(180deg, #1c4a85, #0f2a4f);
    display: flex; align-items: center; justify-content: center;
  }
  .balloon {
    position: absolute; width: 60px; height: 72px; border: none; cursor: pointer; padding: 0;
    border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 28%), var(--bc);
    transition: transform 0.2s, opacity 0.2s;
  }
  .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 22px; background: rgba(255,255,255,0.4); }
  .balloon.pop { transform: scale(1.7); opacity: 0; pointer-events: none; }
  .score { display: flex; justify-content: center; gap: 24px; margin-top: 10px; font-weight: 800; color: var(--sub); }
  .score b { color: var(--text); font-size: 1.2rem; }

  /* ---------- Navegador simulado ---------- */
  .browser { border-radius: 10px; overflow: hidden; background: #fff; color: #1b2433; border: 1px solid #9fb0d0; font-family: var(--win); }
  .br-bar { display: flex; align-items: center; gap: 12px; background: #eef1f6; padding: 8px 12px; font-size: 0.85rem; color: #44506a; }
  .br-url { flex: 1; background: #fff; border-radius: 100px; padding: 5px 14px; border: 1px solid #d5dbe6; }
  .br-page { height: 330px; overflow-y: auto; overscroll-behavior: contain; padding: 18px 22px; font-family: Georgia, 'Times New Roman', serif; }
  .br-page h2 { font-size: 1.5rem; margin-bottom: 8px; color: #0b1d3a; }
  .br-page h3 { font-size: 1.15rem; margin: 22px 0 6px; color: #0b1d3a; }
  .br-page p { line-height: 1.6; margin-bottom: 10px; font-size: 1rem; }
  .br-page .rule { border-top: 1px solid #d5dbe6; margin: 18px 0; }
  .recipe { background: #fff6e0; border: 1px solid #f0d58a; border-radius: 10px; padding: 14px; margin: 16px 0; }
  .recipe button { font-family: var(--win); font-weight: 700; font-size: 0.95rem; padding: 8px 16px; border-radius: 8px; border: none; background: #c0392b; color: #fff; cursor: pointer; margin-top: 6px; }
  .recipe ul { margin: 10px 0 0 20px; }
  .weather { display: flex; gap: 10px; flex-wrap: wrap; }
  .weather div { flex: 1; min-width: 90px; text-align: center; background: #eef3fb; border-radius: 10px; padding: 10px; font-family: var(--win); font-weight: 700; }
  .weather span { display: block; font-size: 2rem; }
  .question { margin-top: 14px; text-align: center; }
  .question p { font-weight: 800; margin-bottom: 10px; font-size: 1.05rem; }
  .question .opts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Clasificar ---------- */
  .sort { display: flex; gap: 14px; flex-wrap: wrap; }
  .sort .win.static { flex: 1 1 260px; }
  .sort .win-body { min-height: 230px; }
  .folders { flex: 1 1 260px; display: flex; flex-direction: column; gap: 10px; }
  .folder-t {
    flex: 1; border-radius: 14px; border: 3px dashed rgba(255,217,61,0.45); background: rgba(255,217,61,0.05);
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; transition: background 0.15s;
  }
  .folder-t.drop { background: rgba(255,217,61,0.2); }
  .folder-t .fe { font-size: 2.2rem; }
  .folder-t .fn { font-weight: 800; font-size: 1.05rem; }
  .folder-t .fc { font-size: 0.85rem; color: var(--sub); font-weight: 700; }
  .folder-t .fl { margin-left: auto; font-size: 1.3rem; letter-spacing: 2px; }

  /* ---------- Texto ---------- */
  .sel-text {
    font-size: 1.25rem; line-height: 1.8; font-weight: 600; color: var(--text);
    user-select: text; -webkit-user-select: text; cursor: text;
    background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px 20px;
  }
  .sel-text::selection { background: var(--c6); color: #fff; }

  /* ---------- Dibujo, diana y puzzle ---------- */
  .trace { width: 100%; height: auto; display: block; border-radius: 14px; touch-action: none; cursor: crosshair; background: #0f2a4f; }
  .target-area { position: relative; height: 290px; overflow: hidden; border-radius: 14px; background: rgba(255,255,255,0.04); }
  .target {
    position: absolute; border: none; border-radius: 50%; cursor: crosshair; padding: 0;
    background: radial-gradient(circle closest-side, var(--c4) 0 25%, #fff 25% 45%, var(--c4) 45% 65%, #fff 65% 82%, var(--c4) 82% 100%);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: left 0.35s, top 0.35s, width 0.35s, height 0.35s;
  }
  .puzzle { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .board { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 3px; background: rgba(255,255,255,0.12); padding: 3px; border-radius: 10px; }
  .slot { background: rgba(8,16,32,0.75); border-radius: 4px; }
  .slot.drop { background: rgba(255,217,61,0.3); }
  .tray { display: grid; grid-template-columns: repeat(3, 80px); gap: 8px; }
  .piece { width: 80px; height: 80px; border-radius: 4px; cursor: grab; touch-action: none; box-shadow: 0 3px 8px rgba(0,0,0,0.4); }
  .slot .piece { box-shadow: none; cursor: default; border-radius: 0; }
  .ref { text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--sub); }
  .ref div { width: 110px; height: 110px; border-radius: 8px; margin: 0 auto 6px; background-size: cover; }

  /* ---------- Navegación ---------- */
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .nav button { font-family: inherit; font-weight: 800; font-size: 1.15rem; cursor: pointer; padding: 14px 26px; border-radius: 16px; transition: background 0.2s; }
  .btn-prev { background: transparent; color: var(--sub); border: 2px solid rgba(255,255,255,0.15); }
  .btn-prev:hover { color: var(--text); border-color: var(--sub); }
  .btn-next { background: rgba(255,255,255,0.08); color: var(--text); border: 2px solid rgba(255,255,255,0.18); margin-left: auto; }
  .btn-next.ready { background: var(--c1); color: #0a1628; border-color: var(--c1); animation: glowBtn 1.4s ease-in-out infinite; }
  @keyframes glowBtn { 50% { box-shadow: 0 0 0 7px rgba(37,211,102,0.3); } }
  .nav button[hidden] { display: none; }
  button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  .finish { display: none; text-align: center; margin-top: 22px; background: var(--card); border: 1px solid rgba(255,217,61,0.3); border-radius: 24px; padding: 30px 24px; }
  .finish.show { display: block; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1); }
  .trophy { font-size: 4.2rem; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-12px) rotate(5deg); } }
  .finish h2 { font-family: var(--display); font-size: 1.8rem; margin: 10px 0 6px; color: var(--c3); }
  .finish p { color: var(--sub); font-weight: 600; }
  .footer-row { text-align: center; margin-top: 26px; }
  .btn-reset { padding: 12px 28px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: transparent; color: var(--sub); font-family: inherit; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
  .btn-reset:hover { color: var(--text); border-color: var(--c4); }

  @media (max-width: 640px) {
    .screen { padding: 20px 14px; }
    .ex-title { font-size: 1.25rem; }

/* ======================================================
   PROGRESO Y NAVEGACIÓN
   ====================================================== */
const KEY = 'ejercicios-raton-v2';
let prog = { done: {}, cur: 0 };
let current = null, AC = new AbortController();
const SIG = () => AC.signal;

function load() {
  try { prog = Object.assign({ done: {}, cur: 0 }, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  if (!(prog.cur >= 0 && prog.cur < exercises.length)) prog.cur = 0;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

function drawMap() {
  document.getElementById('map').innerHTML = exercises.map((ex, i) =>
    `<button class="${prog.done[i] ? 'done' : ''}${i === prog.cur ? ' cur' : ''}" onclick="go(${i})"
      aria-label="Ejercicio ${i + 1}: ${ex.title}${prog.done[i] ? ' (hecho)' : ''}" title="${ex.title}">${prog.done[i] ? '✓' : i + 1}</button>`).join('');
}
function markDone(i) {
  prog.done[i] = true; save(); drawMap();
  document.getElementById('screen').classList.add('done');
  document.getElementById('btn-next').classList.add('ready');
  document.getElementById('finish').classList.toggle('show', exercises.every((_, k) => prog.done[k]));
}
function go(i, scroll = true) {
  if (current && current.stop) current.stop();
  AC.abort(); AC = new AbortController();
  prog.cur = i; save();
  const ex = exercises[i], scr = document.getElementById('screen');
  scr.style.setProperty('--accent', ex.color);
  scr.classList.toggle('done', !!prog.done[i]);
  scr.classList.remove('anim'); void scr.offsetWidth; scr.classList.add('anim');
  document.getElementById('ex-icon').textContent = ex.icon;
  document.getElementById('ex-num').textContent = `Ejercicio ${i + 1} de ${exercises.length}`;
  document.getElementById('ex-title').textContent = ex.title;
  document.getElementById('ex-body').innerHTML = `
    <div class="explain">${ex.explain}</div>
    <div class="practice" id="practice"></div>
    ${ex.tip ? `<div class="ex-tip">💡 ${ex.tip}</div>` : ''}`;
  const el = document.getElementById('practice');
  el.innerHTML = '<ol class="tasks"></ol><div class="stage"></div><div class="pr-msg"><span></span></div>';
  current = widgets[ex.type](el, el.querySelector('.stage'), () => markDone(i)) || null;
  document.getElementById('btn-prev').hidden = i === 0;
  const nx = document.getElementById('btn-next');
  nx.hidden = i === exercises.length - 1;
  nx.classList.toggle('ready', !!prog.done[i]);
  drawMap();
  document.getElementById('finish').classList.toggle('show', exercises.every((_, k) => prog.done[k]));
  if (scroll) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function resetAll() {
  if (!confirm('¿Quieres borrar tu progreso y empezar de nuevo?')) return;
  prog = { done: {}, cur: 0 }; save(); go(0);
}

/* ======================================================
   UTILIDADES
   ====================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const inside = (node, x, y) => { const r = node.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
function setMsg(el, text, kind) {
  const m = el.querySelector('.pr-msg');
  m.className = 'pr-msg' + (kind ? ' ' + kind : '');
  m.innerHTML = `<span>${text}</span>`;
}
/* Lista de tareas que se marca sola. Cada tarea: { t: texto, ok: () => cumplida } */
function Tasks(el, items, onAll) {
  const ol = el.querySelector('.tasks');
  let cur = 0, finished = false;
  const draw = () => {
    ol.innerHTML = items.map((it, k) =>
      `<li class="${k < cur ? 'ok' : k === cur ? 'now' : ''}"><span class="tn">${k < cur ? '✓' : k + 1}</span><span>${it.t}</span></li>`).join('');
  };
  draw();
  return {
    get cur() { return cur; },
    update() {
      if (finished) return;
      let moved = false;
      while (cur < items.length && items[cur].ok()) { cur++; moved = true; }
      if (moved) draw();
      if (cur === items.length) { finished = true; onAll(); }
      return moved;
    }
  };
}
function winAll(el, done, text) {
  setMsg(el, text, 'ok');
  const b = document.createElement('button');
  b.className = 'pr-btn'; b.textContent = '🔄 Repetir';
  b.onclick = () => go(prog.cur, false);
  el.querySelector('.pr-msg').appendChild(b);
  done();
}

/* Arrastrar con una copia que sigue al ratón */
function dragGhost(item, layer, opt) {
  item.addEventListener('pointerdown', e => {
    if (e.button !== 0 || item.classList.contains('locked')) return;
    e.preventDefault();
    item.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY;
    let ghost = null;
    const move = ev => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 7) return;
        if (opt.onStart && opt.onStart() === false) { cleanup(); return; }
        ghost = item.cloneNode(true);
        ghost.classList.add('ghost'); ghost.classList.remove('sel', 'dragging-src');
        ghost.style.width = item.offsetWidth + 'px';
        if (opt.count && opt.count() > 1) ghost.insertAdjacentHTML('beforeend', `<span class="count">${opt.count()}</span>`);
        layer.appendChild(ghost);
        (opt.sources ? opt.sources() : [item]).forEach(n => n.classList.add('dragging-src'));
      }
      const L = layer.getBoundingClientRect();
      ghost.style.left = (ev.clientX - L.left - ghost.offsetWidth / 2) + 'px';
      ghost.style.top = (ev.clientY - L.top - ghost.offsetHeight / 2) + 'px';
      if (opt.onHover) opt.onHover(ev.clientX, ev.clientY);
    };
    const cleanup = () => {
      item.removeEventListener('pointermove', move);
      item.removeEventListener('pointerup', up);
      item.removeEventListener('pointercancel', up);
    };
    const up = ev => {
      cleanup();
      if (!ghost) return;
      ghost.remove();
      document.querySelectorAll('.dragging-src').forEach(n => n.classList.remove('dragging-src'));
      item._dragged = true; setTimeout(() => { item._dragged = false; }, 0);
      if (opt.onHover) opt.onHover(-1, -1);
      opt.onDrop(ev.clientX, ev.clientY);
    };
    item.addEventListener('pointermove', move);
    item.addEventListener('pointerup', up);
    item.addEventListener('pointercancel', up);
  });
}

/* ======================================================
   ESCRITORIO DE WINDOWS SIMULADO
   ====================================================== */
function Desk(stage, height = 400) {
  stage.innerHTML = `<div class="desk" style="height:${height}px">
      <div class="desk-area"></div>
      <div class="taskbar"><span class="tb-start"><i></i><i></i><i></i><i></i></span><div class="tb-apps"></div><span class="tb-clock">12:30</span></div>
    </div>`;
  const root = stage.querySelector('.desk'), area = root.querySelector('.desk-area'), apps = root.querySelector('.tb-apps');
  const D = { root, area, ev: {}, wins: {}, z: 10 };
  D.W = () => area.clientWidth;
  D.H = () => area.clientHeight;

  D.select = (node, add) => {
    if (!add) root.querySelectorAll('.d-icon.sel').forEach(n => n.classList.remove('sel'));
    if (node) node.classList.add('sel');
  };
  D.addIcon = ({ id, emoji, label, x, y }) => {
    const n = document.createElement('div');
    n.className = 'd-icon'; n.dataset.id = id;
    n.innerHTML = `<div class="d-emoji">${emoji}</div><div class="d-label">${label}</div>`;
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.addEventListener('click', e => { e.stopPropagation(); D.select(n); D.ev.iconClick && D.ev.iconClick(id, n, e); });
    n.addEventListener('dblclick', e => { e.stopPropagation(); D.ev.iconDbl && D.ev.iconDbl(id, n, e); });
    n.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); D.select(n); D.ev.iconMenu && D.ev.iconMenu(id, n, e); });
    area.appendChild(n);
    return n;
  };
  D.icon = id => area.querySelector(`.d-icon[data-id="${id}"]`);
  D.label = (id, t) => { D.icon(id).querySelector('.d-label').textContent = t; };
  area.addEventListener('click', e => { if (e.target === area) D.select(null); });
  area.addEventListener('contextmenu', e => {
    if (e.target !== area) return;
    e.preventDefault();
    D.menu(e, [{ label: 'Ver' }, { label: 'Ordenar por' }, { label: 'Actualizar' }, { sep: true }, { label: 'Nuevo' }]);
    D.ev.deskMenu && D.ev.deskMenu();
  });

  /* Menú del clic derecho */
  let menuEl = null;
  D.closeMenu = () => { if (menuEl) { menuEl.remove(); menuEl = null; } };
  D.menu = (e, items) => {
    D.closeMenu();
    menuEl = document.createElement('div');
    menuEl.className = 'ctx';
    menuEl.innerHTML = items.map((it, k) => it.sep ? '<hr>' : `<button data-k="${k}">${it.label}</button>`).join('');
    root.appendChild(menuEl);
    const r = root.getBoundingClientRect();
    const x = Math.min(e.clientX - r.left, r.width - menuEl.offsetWidth - 4);
    const y = Math.min(e.clientY - r.top, r.height - menuEl.offsetHeight - 4);
    menuEl.style.left = Math.max(4, x) + 'px';
    menuEl.style.top = Math.max(4, y) + 'px';
    menuEl.addEventListener('contextmenu', ev => ev.preventDefault());
    menuEl.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return;
      const it = items[b.dataset.k];
      D.closeMenu();
      it.act && it.act();
    });
  };
  document.addEventListener('pointerdown', e => { if (menuEl && !menuEl.contains(e.target)) D.closeMenu(); }, { signal: SIG() });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') D.closeMenu(); }, { signal: SIG() });

  /* Ventanas */
  const front = w => {
    w.el.style.zIndex = ++D.z;
    apps.querySelectorAll('.tb-app').forEach(b => b.classList.remove('active'));
    w.btn.classList.add('active');
  };
  const toggleMax = (w, fire) => {
    const el = w.el;
    if (!w.max) {
      w.geo = [el.style.left, el.style.top, el.style.width, el.style.height];
      Object.assign(el.style, { left: '0px', top: '0px', width: D.W() + 'px', height: D.H() + 'px' });
      w.max = true; el.classList.add('max'); el.querySelector('.wb-max').textContent = '❐'; fire('max');
    } else {
      [el.style.left, el.style.top, el.style.width, el.style.height] = w.geo;
      w.max = false; el.classList.remove('max'); el.querySelector('.wb-max').textContent = '▢'; fire('unmax');
    }
  };
  D.openWin = o => {
    let w = D.wins[o.id];
    if (w) { if (w.el.hidden) { w.el.hidden = false; w.btn.classList.remove('min'); } front(w); return w.el; }
    const el = document.createElement('div');
    el.className = 'win';
    el.innerHTML = `<div class="win-bar"><span class="win-title">${o.title}</span>
        <span class="win-btns"><button class="wb-min" title="Minimizar">—</button><button class="wb-max" title="Maximizar">▢</button><button class="wb-close" title="Cerrar">✕</button></span></div>
      <div class="win-body">${o.body || ''}</div>${o.resizable ? '<div class="win-grip" title="Arrastra para cambiar el tamaño"></div>' : ''}`;
    Object.assign(el.style, { left: o.x + 'px', top: o.y + 'px', width: Math.min(o.w, D.W() - 10) + 'px', height: Math.min(o.h, D.H() - 6) + 'px' });
    area.appendChild(el);
    const btn = document.createElement('button');
    btn.className = 'tb-app'; btn.textContent = o.tb || o.title;
    apps.appendChild(btn);
    w = D.wins[o.id] = { el, btn, max: false };
    front(w);
    const fire = t => D.ev.win && D.ev.win(t, o.id, w);
    el.addEventListener('pointerdown', () => front(w));
    el.querySelector('.wb-min').onclick = () => { el.hidden = true; btn.classList.add('min'); btn.classList.remove('active'); fire('min'); };
    el.querySelector('.wb-max').onclick = () => toggleMax(w, fire);
    el.querySelector('.wb-close').onclick = () => D.closeWin(o.id);
    btn.onclick = () => {
      if (el.hidden) { el.hidden = false; btn.classList.remove('min'); front(w); fire('restore'); }
      else front(w);
    };
    const bar = el.querySelector('.win-bar');
    bar.addEventListener('dblclick', e => { if (!e.target.closest('button')) toggleMax(w, fire); });
    bar.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('button') || w.max) return;
      e.preventDefault(); bar.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, l0 = el.offsetLeft, t0 = el.offsetTop;
      const mv = ev => {
        el.style.left = clamp(l0 + ev.clientX - sx, 80 - el.offsetWidth, D.W() - 80) + 'px';
        el.style.top = clamp(t0 + ev.clientY - sy, 0, D.H() - 36) + 'px';
        fire('moving');
      };
      const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); fire('move'); };
      bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
    });
    const grip = el.querySelector('.win-grip');
    if (grip) grip.addEventListener('pointerdown', e => {
      if (e.button !== 0 || w.max) return;
      e.preventDefault(); e.stopPropagation(); grip.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, w0 = el.offsetWidth, h0 = el.offsetHeight;
      const mv = ev => {
        el.style.width = clamp(w0 + ev.clientX - sx, 160, D.W() - el.offsetLeft) + 'px';
        el.style.height = clamp(h0 + ev.clientY - sy, 110, D.H() - el.offsetTop) + 'px';
        fire('resizing');
      };
      const up = () => { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up); fire('resize'); };
      grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
    });
    if (o.onOpen) o.onOpen(el);
    return el;
  };
  D.closeWin = id => {
    const w = D.wins[id]; if (!w) return;
    w.el.remove(); w.btn.remove(); delete D.wins[id];
    D.ev.win && D.ev.win('close', id, w);
  };
  D.open = () => Object.keys(D.wins).length;
  return D;
}

/* Elementos de un explorador de archivos (dentro de una ventana) */
function explorerItems(container, onDbl) {
  container.querySelectorAll('.x-item, .x-row').forEach(n => {
    n.addEventListener('click', e => {
      if (n._dragged) return;
      if (!(e.ctrlKey || e.metaKey)) container.querySelectorAll('.sel').forEach(s => s.classList.remove('sel'));
      n.classList.toggle('sel', (e.ctrlKey || e.metaKey) ? !n.classList.contains('sel') : true);
    });
    if (onDbl) n.addEventListener('dblclick', () => onDbl(n.dataset.f, n));
  });
}

/* ======================================================
   ZONAS DE PRÁCTICA
   ====================================================== */
const widgets = {

  /* 1. Globos que suben */
  balloons(el, stage, done) {
    const GOAL = 12;
    let popped = 0, escaped = 0, raf = 0, last = 0, spawnAcc = 0, list = [], running = false;
    const T = Tasks(el, [{ t: `Explota <b>${GOAL} globos</b> con un clic antes de que se escapen.`, ok: () => popped >= GOAL }],
      () => winAll(el, done, `¡Muy bien! ${GOAL} globos explotados${escaped ? ` (se escaparon ${escaped})` : ''}.`));
    stage.innerHTML = `<div class="sky"><button class="pr-btn main">▶ Empezar</button></div>
      <div class="score"><span>Explotados: <b class="sp">0</b> de ${GOAL}</span><span>Escapados: <b class="se">0</b></span></div>`;
    const sky = stage.querySelector('.sky');
    const colors = ['#FF6B6B', '#FFD93D', '#4DA3FF', '#6BCB77', '#B388FF', '#FF9F43'];
    const spawn = () => {
      const b = document.createElement('button');
      b.className = 'balloon'; b.setAttribute('aria-label', 'Globo');
      b.style.setProperty('--bc', colors[Math.floor(Math.random() * colors.length)]);
      const o = { b, y: sky.clientHeight + 10, x: 10 + Math.random() * (sky.clientWidth - 80), speed: 55 + popped * 7, sway: Math.random() * 6 };
      b.style.left = o.x + 'px'; b.style.top = o.y + 'px';
      b.addEventListener('click', () => {
        if (b.classList.contains('pop') || !running) return;
        b.classList.add('pop'); popped++;
        stage.querySelector('.sp').textContent = popped;
        setTimeout(() => b.remove(), 220);
        list = list.filter(z => z !== o);
        if (popped >= GOAL) end();
      });
      sky.appendChild(b); list.push(o);
    };
    const loop = ts => {
      if (!running) return;
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
      spawnAcc += dt * 1000;
      if (spawnAcc > Math.max(650, 1250 - popped * 45)) { spawnAcc = 0; spawn(); }
      list.forEach(o => {
        o.y -= o.speed * dt;
        o.b.style.top = o.y + 'px';
        o.b.style.left = (o.x + Math.sin(o.y / 40 + o.sway) * 10) + 'px';
      });
      list.filter(o => o.y < -95).forEach(o => { o.b.remove(); escaped++; stage.querySelector('.se').textContent = escaped; });
      list = list.filter(o => o.y >= -95);
      raf = requestAnimationFrame(loop);
    };
    const end = () => {
      running = false; cancelAnimationFrame(raf);
      list.forEach(o => o.b.remove()); list = [];
      T.update();
    };
    stage.querySelector('.pr-btn').onclick = e => {
      e.target.remove(); running = true; spawn(); raf = requestAnimationFrame(loop);
      setMsg(el, '¡Adelante!');
    };
    setMsg(el, 'Pulsa «Empezar» cuando estés preparado.');
    return { stop() { running = false; cancelAnimationFrame(raf); } };
  },

    ], () => winAll(el, done, '¡Perfecto! Has abierto y cerrado carpetas y documentos.'));
    const D = Desk(stage);
    [['fotos', '📁', 'Fotos'], ['docs', '📁', 'Documentos'], ['musica', '📁', 'Música'], ['papelera', '🗑️', 'Papelera']]
      .forEach(([id, emoji, label], k) => D.addIcon({ id, emoji, label, x: 14, y: 8 + k * 88 }));

    D.ev.iconClick = slow;

      if (id === 'docs') { docs = true; T.update(); setMsg(el, 'Muy bien. Ahora haz doble clic en «Carta a Luisa».', 'ok'); }
      else setMsg(el, 'Esa no es. Ciérrala con la ✕ y abre «Documentos».', 'warn');
    };
    D.ev.win = t => { if (t === 'close') T.update(); };
    setMsg(el, 'Empieza por la carpeta «Documentos».');
  },

  /* 3. Clic derecho */
  right(el, stage, done) {
    let renamed = false, deleted = false, emptied = false, inTrash = 0;
    const T = Tasks(el, [
      { t: 'Cambia el nombre de <b>Lista</b> por <b>Compra</b>: clic derecho sobre ella, «Cambiar nombre», escribe y pulsa <kbd>Intro</kbd>.', ok: () => renamed },
      { t: 'Elimina <b>Borrador</b>: clic derecho sobre él y «Eliminar».', ok: () => deleted },
      { t: 'Vacía la papelera: clic derecho sobre ella y «Vaciar papelera».', ok: () => emptied }
    ], () => winAll(el, done, '¡Estupendo! Ya manejas el menú del clic derecho.'));
    const D = Desk(stage);
    [['papelera', '🗑️', 'Papelera'], ['lista', '📄', 'Lista'], ['borrador', '📄', 'Borrador'], ['fotos', '📁', 'Fotos']]
      .forEach(([id, emoji, label], k) => D.addIcon({ id, emoji, label, x: 14 + (k % 2) * 100, y: 10 + Math.floor(k / 2) * 100 }));
    D.ev.iconClick = () => setMsg(el, 'Eso ha sido el botón izquierdo. Para el menú, usa el <b>derecho</b>.', 'warn');
    D.ev.deskMenu = () => setMsg(el, 'Este es el menú del escritorio. Prueba a hacer clic derecho <b>sobre un icono</b>.');

    const rename = id => {
      const lab = D.icon(id).querySelector('.d-label');
      const old = lab.textContent;
      lab.innerHTML = `<input type="text" value="${old}">`;
      const inp = lab.querySelector('input');
      inp.focus(); inp.select();
      setMsg(el, 'Escribe el nombre nuevo y pulsa <kbd>Intro</kbd>.');
      let closed = false;
      const commit = () => {
        if (closed) return; closed = true;
        const v = inp.value.trim() || old;
        lab.textContent = v;
        if (id === 'lista') {
          if (v.toLowerCase() === 'compra') { renamed = true; setMsg(el, '¡Nombre cambiado!', 'ok'); T.update(); }
          else setMsg(el, `Se ha quedado como «${v}». Tiene que llamarse <b>Compra</b>: vuelve a probar.`, 'warn');
        }
      };
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { closed = true; lab.textContent = old; }
      });
      inp.addEventListener('blur', commit);
      inp.addEventListener('pointerdown', e => e.stopPropagation());
    };
    const updTrash = () => D.label('papelera', inTrash ? `Papelera (${inTrash})` : 'Papelera');
    const remove = id => {
      if (id !== 'borrador') { setMsg(el, 'Ese no tocaba borrarlo, así que lo dejamos donde estaba. Busca «Borrador».', 'warn'); return; }
      D.icon(id).remove(); inTrash++; deleted = true; updTrash();
      setMsg(el, 'Ha ido a la papelera. Fíjate: ahora pone «Papelera (1)».', 'ok'); T.update();
    };
    D.ev.iconMenu = (id, n, e) => {
      if (id === 'papelera') {
        D.menu(e, [{ label: 'Abrir', act: () => openTrash() }, { sep: true },
          { label: 'Vaciar papelera', act: () => {
            if (!inTrash) { setMsg(el, 'La papelera ya está vacía. Primero elimina «Borrador».', 'warn'); return; }
            inTrash = 0; emptied = true; updTrash(); D.closeWin('papelera'); T.update();
          } }]);
      } else {
        D.menu(e, [{ label: 'Abrir', act: () => D.openWin({ id, title: `${id === 'fotos' ? '📁 Fotos' : '📄 ' + n.innerText.trim()}`, x: 230, y: 20, w: 300, h: 200, body: '<div class="empty">(vacío)</div>' }) },
          { sep: true }, { label: 'Cambiar nombre', act: () => rename(id) }, { label: 'Eliminar', act: () => remove(id) }]);
      }
    };
    const openTrash = () => D.openWin({ id: 'papelera', title: '🗑️ Papelera', x: 230, y: 20, w: 300, h: 200,
      body: inTrash ? '<div class="explorer"><div class="x-item"><span class="xe">📄</span>Borrador</div></div>' : '<div class="empty">La papelera está vacía.</div>' });
    setMsg(el, 'Haz clic con el botón <b>derecho</b> sobre «Lista».');
  },

  /* 5. Arrastrar: clasificar archivos */
  sort(el, stage, done) {
    const files = [['🖼️', 'Playa', 'fotos'], ['📄', 'Carta', 'docs'], ['🎵', 'Jota', 'musica'], ['🖼️', 'Boda', 'fotos'],
                   ['🎵', 'Pasodoble', 'musica'], ['📄', 'Recetas', 'docs'], ['🖼️', 'Nietos', 'fotos'], ['📄', 'Facturas', 'docs']];
    const kinds = { fotos: ['Fotos', 'fotos 🖼️'], docs: ['Documentos', 'documentos 📄'], musica: ['Música', 'música 🎵'] };
    let placed = 0;
    const T = Tasks(el, [{ t: 'Arrastra cada archivo a su carpeta: <b>fotos</b>, <b>documentos</b> y <b>música</b>.', ok: () => placed === files.length }],
      () => winAll(el, done, '¡Todo ordenado! Ya sabes arrastrar y soltar.'));
    stage.innerHTML = `<div class="sort">
        <div class="win static"><div class="win-bar"><span class="win-title">📁 Descargas</span><span class="win-btns"><button>—</button><button>▢</button><button>✕</button></span></div>
          <div class="win-body"><div class="explorer">${files.map(([e, n, k]) => `<div class="x-item" data-k="${k}"><span class="xe">${e}</span>${n}</div>`).join('')}</div></div></div>
        <div class="folders">${Object.entries(kinds).map(([k, [n]]) => `<div class="folder-t" data-k="${k}"><span class="fe">📁</span><div><div class="fn">${n}</div><div class="fc">0 archivos</div></div><span class="fl"></span></div>`).join('')}</div>
      </div>`;
    const folders = [...stage.querySelectorAll('.folder-t')];
    stage.querySelectorAll('.x-item').forEach(it => dragGhost(it, stage, {
      onHover: (x, y) => folders.forEach(f => f.classList.toggle('drop', inside(f, x, y))),
      onDrop: (x, y) => {
        const f = folders.find(f => inside(f, x, y));
        const name = it.textContent.trim();
        if (!f) { setMsg(el, 'Se soltó antes de llegar. No sueltes el botón hasta estar encima de la carpeta.', 'warn'); return; }
        if (f.dataset.k !== it.dataset.k) { setMsg(el, `«${name}» no va ahí: es de ${kinds[it.dataset.k][1]}.`, 'warn'); return; }
        it.remove(); placed++;
        const c = f.querySelector('.fc'), nn = parseInt(c.textContent) + 1;
        c.textContent = `${nn} archivo${nn > 1 ? 's' : ''}`;
        f.querySelector('.fl').textContent += it.querySelector('.xe').textContent;
        setMsg(el, placed < files.length ? `¡Bien! Quedan ${files.length - placed}.` : '', 'ok');
        T.update();
      }
    }));
    setMsg(el, 'Mantén pulsado sobre un archivo y llévalo a su carpeta.');
  },

  /* 6. Manejar ventanas */
  windows(el, stage, done) {
    let moved = false, mini = false, rest = false, maxi = false, unmax = false, closed = false;
    const T = Tasks(el, [
      { t: 'Arrastra la ventana por su <b>barra de título</b> hasta el recuadro amarillo.', ok: () => moved },
      { t: 'Escóndela con el botón <b>—</b>.', ok: () => mini },
      { t: 'Recupérala haciendo clic en su botón de la <b>barra de tareas</b>, abajo.', ok: () => rest },
      { t: 'Hazla grande con el botón <b>▢</b>.', ok: () => maxi },
      { t: 'Devuélvela a su tamaño con el mismo botón (ahora es <b>❐</b>).', ok: () => unmax },
      { t: 'Ciérrala con la <b>✕</b>.', ok: () => closed }
    ], () => winAll(el, done, '¡Fenomenal! Ya manejas las ventanas.'));
    const D = Desk(stage);
    D.addIcon({ id: 'cal', emoji: '📅', label: 'Calendario', x: 14, y: 8 });
    const W = 300, H = 190;
    const tx = Math.max(110, D.W() - W - 20), ty = Math.max(10, D.H() - H - 14);
    const outline = document.createElement('div');
    outline.className = 'outline';
    Object.assign(outline.style, { left: tx + 'px', top: ty + 'px', width: W + 'px', height: H + 'px' });
    D.area.appendChild(outline);
    const open = () => D.openWin({ id: 'cal', title: '📅 Calendario', x: 110, y: 10, w: W, h: H,
      body: '<div style="text-align:center;font-size:1.1rem"><b>Octubre</b><div style="font-size:3rem;font-weight:700;margin:8px 0">7</div>Miércoles</div>' });
    open();
    D.ev.iconDbl = () => { open(); setMsg(el, 'Ventana abierta otra vez.'); };
    D.ev.win = (t, id, w) => {
      if (t === 'move' && !moved) {
        const l = w.el.offsetLeft, tp = w.el.offsetTop;
        if (Math.abs(l - tx) < 35 && Math.abs(tp - ty) < 35) {
          w.el.style.left = tx + 'px'; w.el.style.top = ty + 'px';
          moved = true; outline.remove(); setMsg(el, '¡Encajada! Ahora escóndela con el botón —.', 'ok');
        } else setMsg(el, 'Un poco más. Tiene que quedar encima del recuadro amarillo.');
      }
      if (t === 'min' && moved) { mini = true; setMsg(el, 'Escondida. Mira abajo, en la barra de tareas: ahí sigue.', 'ok'); }
      if (t === 'restore' && mini) { rest = true; setMsg(el, '¡Aquí está otra vez!', 'ok'); }
      if (t === 'max' && rest) { maxi = true; setMsg(el, 'Ahora ocupa toda la pantalla.', 'ok'); }
      if (t === 'unmax' && maxi) { unmax = true; setMsg(el, 'Ha vuelto a su tamaño. Ya solo queda cerrarla.', 'ok'); }
      if (t === 'close') {
        if (unmax) closed = true;
        else setMsg(el, 'La has cerrado antes de tiempo. Ábrela otra vez con doble clic en «Calendario».', 'warn');
      }
      T.update();
    };
    setMsg(el, 'Sujeta la ventana por la barra gris de arriba, donde pone «Calendario».');
  },

  /* 7. Cambiar el tamaño */
  resize(el, stage, done) {
    let step = 0;
    const T = Tasks(el, [
      { t: 'Haz la ventana <b>más grande</b>, hasta el recuadro amarillo, arrastrando la esquina de abajo a la derecha.', ok: () => step >= 1 },
      { t: 'Ahora hazla <b>pequeña</b>, hasta el nuevo recuadro.', ok: () => step >= 2 }
    ], () => winAll(el, done, '¡Muy bien! Ya sabes cambiar el tamaño de las ventanas.'));
    const D = Desk(stage);
    const targets = [[Math.min(440, D.W() - 40), Math.min(270, D.H() - 40)], [210, 130]];
    const outline = document.createElement('div');
    outline.className = 'outline';
    D.area.appendChild(outline);
    let winEl = D.openWin({ id: 'notas', title: '📝 Notas', x: 20, y: 16, w: 250, h: 160, resizable: true,
      body: '<div class="doc">Comprar pan.\nLlamar a Pilar.\nRecoger las gafas.</div>' });
    const place = () => {
      if (step >= 2) { outline.remove(); return; }
      const [w, h] = targets[step];
      Object.assign(outline.style, { left: winEl.offsetLeft + 'px', top: winEl.offsetTop + 'px', width: w + 'px', height: h + 'px' });
    };
    place();
    D.ev.win = (t, id, w) => {
      if (t === 'moving' || t === 'move') place();
      if (t === 'resize' && step < 2) {
        const [tw, th] = targets[step];
        const dw = w.el.offsetWidth - tw, dh = w.el.offsetHeight - th;
        if (Math.abs(dw) < 22 && Math.abs(dh) < 22) {
          w.el.style.width = tw + 'px'; w.el.style.height = th + 'px';
          step++; place(); T.update();
          if (step < 2) setMsg(el, '¡Eso es! Ahora, más pequeña.', 'ok');
        } else {
          const tips = [];
          if (Math.abs(dw) >= 22) tips.push(dw < 0 ? 'más ancha' : 'menos ancha');
          if (Math.abs(dh) >= 22) tips.push(dh < 0 ? 'más alta' : 'menos alta');
          setMsg(el, `Casi. Tiene que quedar ${tips.join(' y ')}.`, 'warn');
        }
      }
      if (t === 'close') {
        winEl = D.openWin({ id: 'notas', title: '📝 Notas', x: 20, y: 16, w: 250, h: 160, resizable: true, body: '<div class="doc">Comprar pan.\nLlamar a Pilar.\nRecoger las gafas.</div>' });
        place(); setMsg(el, 'En este ejercicio no hace falta cerrarla. Te la volvemos a abrir.', 'warn');
      }
      if (t === 'max' || t === 'unmax') place();
    };
    setMsg(el, 'Busca la esquina de abajo a la derecha de la ventana, la de las rayitas.');
  },

  /* 8. Seleccionar texto */
  text(el, stage, done) {
    const P = 'El jueves vamos de excursión al pantano. Saldremos de la plaza a las cinco de la tarde y volveremos para la cena.';
    let a = false, b = false, c = false;
    const T = Tasks(el, [
      { t: 'Selecciona solo la palabra <b>jueves</b>, con doble clic.', ok: () => a },
      { t: 'Selecciona <b>a las cinco de la tarde</b>, arrastrando.', ok: () => b },
      { t: 'Selecciona el <b>párrafo entero</b>, con tres clics seguidos.', ok: () => c }
    ], () => winAll(el, done, '¡Perfecto! Dominas las tres formas de seleccionar.'));
    stage.innerHTML = `<p class="sel-text">${P}</p>`;
    const p = stage.querySelector('.sel-text');
    const check = () => {
      const s = window.getSelection();
      if (!s.rangeCount || !p.contains(s.anchorNode)) return;
      const txt = s.toString().replace(/\s+/g, ' ').trim().replace(/[.,]$/, '');
      if (!txt || T.cur >= 3) return;
      const step = T.cur;
      if (step === 0 && txt === 'jueves') a = true;
      else if (step === 1 && txt === 'a las cinco de la tarde') b = true;
      else if (step === 2 && txt === P.replace(/\.$/, '')) c = true;
      if (!T.update()) {
        const shown = txt.length > 40 ? txt.slice(0, 40) + '…' : txt;
        setMsg(el, `Has seleccionado «${shown}». ${step === 1 ? 'Tiene que ser exactamente «a las cinco de la tarde».' : 'Prueba otra vez.'}`, 'warn');
      } else setMsg(el, '¡Eso es!', 'ok');
    };
    p.addEventListener('mouseup', () => setTimeout(check, 30));
    p.addEventListener('touchend', () => setTimeout(check, 300));
    setMsg(el, 'Empieza con un doble clic sobre «jueves».');
  },

  /* 9. Dibujar sin salirse */
  trace(el, stage, done) {
    let lvl = 0;
    const T = Tasks(el, [
      { t: '<b>Nivel 1:</b> del círculo verde a la bandera, por el camino ancho.', ok: () => lvl >= 1 },
      { t: '<b>Nivel 2:</b> lo mismo, con un camino más estrecho.', ok: () => lvl >= 2 }
    ], () => winAll(el, done, '¡Pulso de cirujano! Has completado los dos caminos.'));
    stage.innerHTML = '<canvas class="trace" width="680" height="320"></canvas>';
    const cv = stage.querySelector('canvas'), ctx = cv.getContext('2d');
    const path = new Path2D();
    path.moveTo(60, 255);
    path.bezierCurveTo(190, 265, 150, 70, 300, 75);
    path.bezierCurveTo(450, 80, 380, 265, 530, 255);
    path.bezierCurveTo(640, 245, 640, 120, 615, 60);
    const S = { x: 60, y: 255 }, E = { x: 615, y: 60 };
    const widths = [50, 30];
    let drawing = false, pts = [];
    const width = () => widths[Math.min(lvl, 1)];
    const paint = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.setLineDash([]);
      ctx.strokeStyle = '#2a4170'; ctx.lineWidth = width() + 10; ctx.stroke(path);
      ctx.strokeStyle = '#e8eef9'; ctx.lineWidth = width(); ctx.stroke(path);
      ctx.setLineDash([8, 10]); ctx.strokeStyle = '#b7c4dc'; ctx.lineWidth = 2; ctx.stroke(path); ctx.setLineDash([]);
      ctx.fillStyle = '#25D366'; ctx.beginPath(); ctx.arc(S.x, S.y, width() / 2 + 4, 0, Math.PI * 2); ctx.fill();
      ctx.font = '40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏁', E.x + 6, E.y - 6);
      if (pts.length > 1) {
        ctx.strokeStyle = '#4DA3FF'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        pts.forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke();
      }
    };
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const onPath = q => { ctx.lineWidth = width() + 6; ctx.lineCap = 'round'; return ctx.isPointInStroke(path, q.x, q.y); };
    cv.addEventListener('pointerdown', e => {
      if (lvl >= 2 || e.button !== 0) return;
      const q = pos(e);
      if (dist(q, S) > width() / 2 + 10) { setMsg(el, 'Empieza pulsando dentro del <b>círculo verde</b>.', 'warn'); return; }
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      drawing = true; pts = [q]; setMsg(el, 'Sin soltar el botón…');
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const q = pos(e);
      if (!onPath(q)) { drawing = false; pts = []; paint(); setMsg(el, 'Te has salido del camino. Vuelve a empezar desde el círculo verde.', 'warn'); return; }
      pts.push(q);
      if (dist(q, E) < width() / 2 + 6) {
        drawing = false; lvl++; pts = []; paint(); T.update();
        if (lvl < 2) setMsg(el, '¡Conseguido! Ahora, un camino más estrecho.', 'ok');
        return;
      }
      paint();
    });
    cv.addEventListener('pointerup', () => {
      if (!drawing) return;
      drawing = false; pts = []; paint();
      setMsg(el, 'Has soltado el botón antes de llegar. Mantenlo pulsado todo el camino.', 'warn');
    });
    paint();
    setMsg(el, 'Pulsa en el círculo verde y no sueltes hasta la bandera.');
  },

  /* 10. Puntería */
  target(el, stage, done) {
    const sizes = [120, 100, 82, 66, 54];
    let hits = 0;
    const T = Tasks(el, [{ t: `Acierta <b>${sizes.length} veces</b> en el centro rojo de la diana.`, ok: () => hits >= sizes.length }],
      () => winAll(el, done, '¡Cinco dianas! Tienes muy buena puntería.'));
    stage.innerHTML = '<div class="target-area"><button class="target" aria-label="Diana"></button></div>';
    const area = stage.querySelector('.target-area'), t = stage.querySelector('.target');
    const place = () => {
      const s = sizes[Math.min(hits, sizes.length - 1)];
      t.style.width = t.style.height = s + 'px';
      t.style.left = (10 + Math.random() * Math.max(0, area.clientWidth - s - 20)) + 'px';
      t.style.top = (10 + Math.random() * Math.max(0, area.clientHeight - s - 20)) + 'px';
    };
    place();
    t.addEventListener('click', e => {
      if (hits >= sizes.length || e.detail === 0) return;
      const r = t.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) / (r.width / 2);
      if (d <= 0.25) {
        hits++; T.update();
        if (hits < sizes.length) { setMsg(el, `¡En el centro! Llevas ${hits} de ${sizes.length}.`, 'ok'); place(); }
      } else setMsg(el, d <= 0.5 ? 'Muy cerca. Un poco más al centro.' : 'Apunta al círculo rojo del medio.', 'warn');
    });
    setMsg(el, 'Apunta con calma y haz clic en el centro.');
  },

  /* 11. Puzzle */
  puzzle(el, stage, done) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4DA3FF"/><stop offset="1" stop-color="#cbe8ff"/></linearGradient></defs><rect width="300" height="300" fill="url(#s)"/><circle cx="240" cy="62" r="34" fill="#FFD93D"/><path d="M22 70 q16-18 34 0 q16-14 34 0z" fill="#fff"/><path d="M120 42 q14-14 28 0 q14-12 28 0z" fill="#fff"/><path d="M0 190 Q80 135 160 182 T300 168 V300 H0Z" fill="#6BCB77"/><path d="M0 235 Q100 205 200 238 T300 228 V300 H0Z" fill="#3fa14f"/><rect x="58" y="150" width="86" height="72" fill="#f3e2c7"/><path d="M48 156 L101 106 L154 156Z" fill="#c0392b"/><rect x="90" y="186" width="22" height="36" fill="#7a4a2a"/><rect x="66" y="166" width="17" height="17" fill="#4DA3FF"/><rect x="120" y="166" width="17" height="17" fill="#4DA3FF"/><rect x="204" y="176" width="12" height="54" fill="#7a4a2a"/><circle cx="210" cy="162" r="32" fill="#2e8b57"/><circle cx="196" cy="150" r="5" fill="#FF6B6B"/><circle cx="222" cy="170" r="5" fill="#FF6B6B"/><path d="M0 268 Q150 252 300 272 V300 H0Z" fill="#4DA3FF" opacity=".7"/></svg>`;
    const url = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    let placed = 0;
    const T = Tasks(el, [{ t: 'Coloca las <b>9 piezas</b> en su sitio.', ok: () => placed === 9 }],
      () => winAll(el, done, '¡Puzzle completo!'));
    const small = window.matchMedia('(max-width: 640px)').matches, S = small ? 64 : 80;
    const order = [...Array(9).keys()].sort(() => Math.random() - 0.5);
    stage.innerHTML = `<div class="puzzle">
        <div class="board">${[...Array(9).keys()].map(k => `<div class="slot" data-k="${k}"></div>`).join('')}</div>
        <div class="tray">${order.map(k => `<div class="piece" data-k="${k}" style="background-image:url('${url}');background-size:${S * 3}px ${S * 3}px;background-position:${-(k % 3) * S}px ${-Math.floor(k / 3) * S}px"></div>`).join('')}</div>
        <div class="ref"><div style="background-image:url('${url}')"></div>Así tiene que quedar</div>
      </div>`;
    const slots = [...stage.querySelectorAll('.slot')];
    stage.querySelectorAll('.piece').forEach(pc => dragGhost(pc, stage, {
      onHover: (x, y) => slots.forEach(s => s.classList.toggle('drop', !s.children.length && inside(s, x, y))),
      onDrop: (x, y) => {
        const s = slots.find(s => inside(s, x, y));
        if (!s) { setMsg(el, 'Suelta la pieza encima de un hueco del tablero.', 'warn'); return; }
        if (s.children.length) { setMsg(el, 'Ese hueco ya está ocupado.', 'warn'); return; }
        if (s.dataset.k !== pc.dataset.k) { setMsg(el, 'Esa pieza no va ahí. Fíjate en el dibujo pequeño.', 'warn'); return; }
        s.appendChild(pc); pc.classList.add('locked'); placed++;
        setMsg(el, placed < 9 ? `¡Encaja! Quedan ${9 - placed}.` : '', 'ok'); T.update();
      }
    }));
    setMsg(el, 'Arrastra una pieza hasta su hueco.');
  },

  /* 12. Seleccionar varios con Ctrl */
  multi(el, stage, done) {
    const items = [['n1', '🖼️', 'Navidad 1'], ['playa', '🖼️', 'Playa'], ['carta', '📄', 'Carta'], ['n2', '🖼️', 'Navidad 2'],
                   ['boda', '🖼️', 'Boda'], ['vill', '🎵', 'Villancico'], ['cumple', '🖼️', 'Cumpleaños'], ['n3', '🖼️', 'Navidad 3']];
    const NAV = ['n1', 'n2', 'n3'];
    let selOk = false, moved = false;
    const T = Tasks(el, [
      { t: 'Selecciona las <b>tres fotos de Navidad</b>: clic en la primera y <kbd>Ctrl</kbd> + clic en las otras dos.', ok: () => selOk },
      { t: 'Arrastra una de ellas a la carpeta <b>Navidad</b>: se moverán las tres juntas.', ok: () => moved }
    ], () => winAll(el, done, '¡Muy bien! Has movido varios archivos de una vez.'));
    stage.innerHTML = `<div class="win static" style="height:330px"><div class="win-bar"><span class="win-title">📁 Imágenes</span><span class="win-btns"><button>—</button><button>▢</button><button>✕</button></span></div>
      <div class="win-body"><div class="explorer">
        <div class="x-item folder" data-f="carpeta"><span class="xe">📁</span><span class="fname">Navidad</span></div>
        ${items.map(([id, e, n]) => `<div class="x-item file" data-f="${id}"><span class="xe">${e}</span>${n}</div>`).join('')}
      </div></div></div>`;
    const box = stage.querySelector('.explorer'), folder = box.querySelector('.folder');
    const selected = () => [...box.querySelectorAll('.file.sel')].map(n => n.dataset.f);
    const exact = () => { const s = selected(); return s.length === 3 && NAV.every(k => s.includes(k)); };
    box.querySelectorAll('.file').forEach(n => {
      n.addEventListener('click', e => {
        if (n._dragged) return;
        const ctrl = e.ctrlKey || e.metaKey;
        const before = selected();
        if (ctrl) n.classList.toggle('sel');
        else { box.querySelectorAll('.sel').forEach(s => s.classList.remove('sel')); n.classList.add('sel'); }
        if (!ctrl && NAV.includes(n.dataset.f) && before.some(k => NAV.includes(k) && k !== n.dataset.f))
          setMsg(el, 'Al hacer clic sin <kbd>Ctrl</kbd> se ha quitado la selección anterior. Mantén <kbd>Ctrl</kbd> pulsada mientras haces clic.', 'warn');
        else if (T.cur === 0) {
          const k = selected().filter(x => NAV.includes(x)).length, other = selected().length - k;
          setMsg(el, other ? 'Hay seleccionado algo que no es de Navidad. Haz <kbd>Ctrl</kbd> + clic sobre él para quitarlo.' : `Llevas ${k} de 3.`, other ? 'warn' : '');
        }
        selOk = selOk || exact(); T.update();
      });
      dragGhost(n, stage, {
        onStart: () => { if (!n.classList.contains('sel')) { box.querySelectorAll('.sel').forEach(s => s.classList.remove('sel')); n.classList.add('sel'); } },
        count: () => selected().length,
        sources: () => [...box.querySelectorAll('.file.sel')],
        onHover: (x, y) => folder.classList.toggle('drop', inside(folder, x, y)),
        onDrop: (x, y) => {
          if (!inside(folder, x, y)) { setMsg(el, 'Suéltalas encima de la carpeta «Navidad».', 'warn'); return; }
          if (!exact()) { setMsg(el, 'Primero selecciona las tres fotos de Navidad, y solo esas.', 'warn'); return; }
          if (T.cur === 0) { selOk = true; T.update(); }
          box.querySelectorAll('.file.sel').forEach(s => s.remove());
          folder.querySelector('.fname').textContent = 'Navidad (3)';
          moved = true; T.update();
        }
      });
    });
    setMsg(el, 'Haz clic en «Navidad 1» y luego usa <kbd>Ctrl</kbd> + clic.');
  },

  /* 13. Desafío final */
  final(el, stage, done) {
    let opened = false, found = false, moved = false, closed = false, emptied = false, inTrash = 3;
    const T = Tasks(el, [
      { t: 'Abre la carpeta <b>Descargas</b> con doble clic.', ok: () => opened },
      { t: 'Dentro, baja con la rueda hasta encontrar <b>Foto del pueblo</b>.', ok: () => found },
      { t: 'Arrástrala hasta la carpeta <b>Fotos</b> del escritorio.', ok: () => moved },
      { t: 'Cierra la ventana de Descargas.', ok: () => closed },
      { t: 'Vacía la papelera con el clic derecho.', ok: () => emptied }
    ], () => winAll(el, done, '¡Desafío superado! Ya te manejas con el ratón como un experto.'));
    const D = Desk(stage, 420);
    D.addIcon({ id: 'desc', emoji: '📁', label: 'Descargas', x: 14, y: 8 });
    D.addIcon({ id: 'fotos', emoji: '📁', label: 'Fotos', x: 14, y: 100 });
    D.addIcon({ id: 'papelera', emoji: '🗑️', label: 'Papelera (3)', x: 14, y: 192 });
    const list = ['📄 Factura de la luz', '📄 Horario del autobús', '🎵 Canción de la boda', '📄 Receta de rosquillas', '🖼️ Cartel de fiestas',
      '📄 Cita del médico', '📄 Instrucciones de la tele', '🎵 Jota de la abuela', '📄 Programa de fiestas', '📄 Carta del banco',
      '🖼️ Foto del pueblo', '📄 Recibo del agua', '📄 Lista de la compra'];
    D.ev.iconClick = () => {};
    D.ev.iconDbl = id => {
      if (id === 'desc') {
        D.openWin({ id: 'desc', title: '📁 Descargas', x: Math.min(140, D.W() - 330), y: 10, w: 330, h: 230,
          body: list.map(t => `<div class="x-row${t.includes('pueblo') ? ' photo' : ''}"><span class="xe">${t.slice(0, 2)}</span>${t.slice(3)}</div>`).join(''),
          onOpen: w => {
            const body = w.querySelector('.win-body'), ph = w.querySelector('.photo');
            explorerItems(body);
            body.addEventListener('scroll', () => {
              const r = ph.getBoundingClientRect(), b = body.getBoundingClientRect();
              if (!found && r.top >= b.top - 4 && r.bottom <= b.bottom + 4) { found = true; T.update(); setMsg(el, '¡La encontraste! Ahora arrástrala a «Fotos».', 'ok'); }
            });
            if (ph) dragGhost(ph, D.root, {
              onHover: (x, y) => D.icon('fotos').classList.toggle('drop', inside(D.icon('fotos'), x, y)),
              onDrop: (x, y) => {
                if (!inside(D.icon('fotos'), x, y)) { setMsg(el, 'Suéltala encima de la carpeta «Fotos» del escritorio.', 'warn'); return; }
                found = true; ph.remove(); moved = true; D.label('fotos', 'Fotos (1)'); T.update();
                setMsg(el, '¡Guardada en Fotos! Ahora cierra la ventana.', 'ok');
              }
            });
          } });
        opened = true; T.update();
      } else if (id === 'fotos') {
        D.openWin({ id: 'fotos', title: '📁 Fotos', x: 160, y: 40, w: 280, h: 180,
          body: moved ? '<div class="x-row"><span class="xe">🖼️</span>Foto del pueblo</div>' : '<div class="empty">Esta carpeta está vacía.</div>' });
      } else if (id === 'papelera') {
        D.openWin({ id: 'papelera', title: '🗑️ Papelera', x: 160, y: 60, w: 280, h: 180, body: inTrash ? '<div class="empty">Hay 3 archivos viejos.</div>' : '<div class="empty">La papelera está vacía.</div>' });
      }
    };
    D.ev.iconMenu = (id, n, e) => {
      if (id === 'papelera') D.menu(e, [{ label: 'Abrir', act: () => D.ev.iconDbl('papelera') }, { sep: true }, { label: 'Vaciar papelera', act: () => {
        if (!inTrash) { setMsg(el, 'Ya está vacía.'); return; }
        if (T.cur < 4) { setMsg(el, 'Muy bien, pero déjalo para el final: sigue las tareas en orden.', 'warn'); return; }
        inTrash = 0; D.label('papelera', 'Papelera'); emptied = true; T.update();
      } }]);
      else D.menu(e, [{ label: 'Abrir', act: () => D.ev.iconDbl(id) }, { sep: true }, { label: 'Cambiar nombre' }, { label: 'Eliminar' }]);
    };
    D.ev.win = (t, id) => {
      if (t === 'close' && id === 'desc') {
        if (moved) { closed = true; T.update(); setMsg(el, 'Ya solo queda vaciar la papelera.', 'ok'); }
        else { opened = false; found = false; T.update(); setMsg(el, 'La has cerrado antes de tiempo. Vuelve a abrir «Descargas».', 'warn'); }
      }
    };
    setMsg(el, 'Sigue las tareas en orden. ¡Ánimo!');
  }
};

/* El ratón pequeño de la cabecera se ilumina con el ratón real */
(function liveMouse() {
  const p = { 0: 'm-left', 1: 'm-wheel', 2: 'm-right' };
  const flash = id => { const n = document.getElementById(id); n.classList.add('on'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), 300); };
  window.addEventListener('mousedown', e => { if (p[e.button]) flash(p[e.button]); });
  window.addEventListener('wheel', () => flash('m-wheel'), { passive: true });
})();

load();
document.getElementById('btn-prev').onclick = () => go(prog.cur - 1);
document.getElementById('btn-next').onclick = () => go(prog.cur + 1);
go(prog.cur, false);
</script>
</body>

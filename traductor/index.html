<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Traducteur</title>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#f5f2ee;--surface:#fff;--accent:#2d6a4f;--al:#b7e4c7;--am:#d8f3dc;
  --t1:#1a1a2e;--t2:#555b6e;--tm:#9aa0b0;--bd:#e2ddd6;
  --sh:0 4px 24px rgba(0,0,0,.07);--r:16px;--red:#c0392b;--blue:#2c4a7c;
  --cloud:#4A90D9;--cloud-pale:#EAF2FB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 80px}

/* ── SYNC BAR (top, full width) ── */
#sync-topbar {
  width:100%;
  background:var(--t1);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  padding:7px 20px;
  flex-shrink:0;
}
.btn-sync {
  background:none;
  border:1.5px solid rgba(74,144,217,0.45);
  color:#7eb8f0;
  padding:5px 13px;
  border-radius:20px;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-size:0.78rem;
  font-weight:500;
  transition:background .2s,color .2s,border-color .2s;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:5px;
}
.btn-sync:hover{background:var(--cloud);color:#fff;border-color:var(--cloud)}
.btn-sync.synced{border-color:rgba(45,106,79,0.5);color:#7ec87f}
.btn-sync.synced:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-sync.syncing{opacity:.6;cursor:default;pointer-events:none}
.sync-spinner{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.user-info-text{font-size:.72rem;color:rgba(255,255,255,.4)}
.btn-signout{background:none;border:none;cursor:pointer;font-size:.72rem;color:rgba(255,255,255,.3);padding:2px 6px;border-radius:4px;transition:color .15s,background .15s;font-family:'DM Sans',sans-serif}
.btn-signout:hover{color:var(--red);background:rgba(192,88,74,.1)}
#sync-status-bar{
  width:100%;
  padding:7px 20px;
  font-size:.78rem;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
#sync-status-bar.visible{display:flex}
#sync-status-bar.ok{background:var(--am);color:var(--accent)}
#sync-status-bar.err{background:#fdecea;color:var(--red)}
#sync-status-bar.info{background:var(--cloud-pale);color:var(--cloud)}
.sync-close{background:none;border:none;cursor:pointer;color:inherit;opacity:.6;padding:0 4px;font-size:1rem}
.sync-close:hover{opacity:1}

/* ── REST OF ORIGINAL STYLES (unchanged) ── */
header{text-align:center;margin:28px 0 16px;padding:0 16px}
header h1{font-family:'Playfair Display',serif;font-size:2.3rem;font-weight:600;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{margin-top:6px;font-size:.88rem;color:var(--tm);font-weight:300}
.lang-selector{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--bd);border-radius:100px;padding:5px 6px 5px 14px;margin-bottom:18px;box-shadow:var(--sh);flex-wrap:wrap;justify-content:center;max-width:680px;width:100%}
.ls-label{font-size:.72rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--tm);white-space:nowrap;margin-right:2px}
.lp-btn{border:1.5px solid var(--bd);background:transparent;padding:5px 13px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--t2);transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.lp-btn:hover{border-color:var(--accent);background:var(--am)}
.lp-btn.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:500}
.lp-flag{font-size:1rem;line-height:1}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--bd);border-radius:100px;padding:4px;margin-bottom:24px;box-shadow:var(--sh)}
.tab{border:none;background:transparent;padding:9px 20px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--tm);transition:all .2s;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.panel{display:none;width:100%;max-width:680px;flex-direction:column;align-items:center;gap:16px;padding:0 16px}
.panel.on{display:flex}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:28px 32px;width:100%;border:1px solid var(--bd)}
.badge-lang{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--tm);margin-bottom:10px;transition:color .3s}
.badge-lang .dot{width:7px;height:7px;border-radius:50%;background:var(--tm);transition:background .3s;flex-shrink:0}
.badge-lang.on .dot{background:var(--accent)}
.badge-lang.on{color:var(--accent)}
.inp-wrap{position:relative}
input[type=text]{width:100%;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:1.1rem;color:var(--t1);background:transparent;line-height:1.7;caret-color:var(--accent);padding-right:28px}
input::placeholder{color:var(--tm);font-weight:300}
.clr{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tm);cursor:pointer;font-size:.85rem;display:none;line-height:1}
.clr.on{display:block}
.inp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid var(--bd);padding-top:14px}
#charCount{font-size:.78rem;color:var(--tm)}
.btn-p{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.87rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s}
.btn-p:hover:not(:disabled){background:#1f4e38}
.btn-p:disabled{opacity:.6;cursor:not-allowed}
.btn-s{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:9px 18px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-s:hover{background:var(--am)}
.btn-s.red{border-color:var(--red);color:var(--red)}
.btn-s.red:hover{background:#fdecea}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.spin.on{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.result-card{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.res-label{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.res-dir{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.res-word{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--accent);line-height:1.5}
.res-phon{font-size:.78rem;color:var(--tm);margin-top:4px}
.pos-pill{display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:var(--am);border:1px solid var(--bd);border-radius:4px;padding:.15rem .5rem;color:var(--accent);margin-top:6px}
.trans-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.trans-opt{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);cursor:pointer;transition:all .15s;user-select:none}
.trans-opt:hover{border-color:var(--accent);background:var(--am)}
.trans-opt.on{border-color:var(--accent);background:var(--am)}
.trans-opt .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.trans-opt.on .radio{border-color:var(--accent);background:var(--accent)}
.trans-opt.on .radio::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.trans-w{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent);line-height:1.3}
.trans-custom{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;border:1.5px dashed var(--bd);background:transparent;margin-top:2px;transition:border-color .15s;cursor:text}
.trans-custom.on{border-color:var(--accent);border-style:solid;background:var(--am)}
.trans-custom .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.trans-custom.on .radio{border-color:var(--accent);background:var(--accent)}
.trans-custom.on .radio::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.trans-custom input{border:none;outline:none;background:transparent;font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent);width:100%;caret-color:var(--accent)}
.trans-custom input::placeholder{font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--tm);font-style:italic;font-weight:300}
.sec-title{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--am);color:var(--accent);padding:5px 13px;border-radius:100px;font-size:.81rem}
.ex-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.ex-list li{font-size:.91rem;color:var(--t2);padding-left:14px;border-left:2px solid var(--al);line-height:1.6}
.ex-list li mark{background:none;font-weight:600;color:var(--accent)}
.divider{height:1px;background:var(--bd);margin:18px 0}
.skel{background:linear-gradient(90deg,#ede8e1 25%,#e5e0d8 50%,#ede8e1 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:1.7rem;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#resultSec{display:none;width:100%}
#resultSec.on{display:flex;flex-direction:column;gap:16px}
.vocab-top{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.vocab-top h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600}
.vcnt{font-size:.78rem;background:var(--am);color:var(--accent);padding:3px 10px;border-radius:100px;font-weight:500}
.vocab-filters{display:flex;gap:6px;flex-wrap:wrap}
.vf-btn{border:1.5px solid var(--bd);background:transparent;padding:4px 12px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.75rem;cursor:pointer;color:var(--t2);transition:all .2s}
.vf-btn:hover{border-color:var(--accent);background:var(--am)}
.vf-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);width:100%}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:.83rem}
th{background:var(--accent);color:#fff;padding:10px 13px;text-align:left;font-weight:500;font-size:.69rem;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.5;color:var(--t2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.td-a{font-weight:500;color:var(--t1)}
.td-b{font-style:italic;color:var(--accent)}
.td-sm{font-size:.78rem;max-width:180px}
.lang-tag{display:inline-block;font-size:.6rem;background:var(--am);color:var(--accent);border-radius:4px;padding:1px 6px;font-weight:600;letter-spacing:.3px;margin-left:4px;vertical-align:middle}
.del{background:none;border:none;cursor:pointer;color:var(--tm);font-size:.95rem;padding:2px 6px;border-radius:6px;transition:all .2s}
.del:hover{color:var(--red);background:#fdecea}
.tbl-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;width:100%}
.empty{text-align:center;padding:60px 24px;color:var(--tm);width:100%}
.empty .ico{font-size:2.5rem;margin-bottom:12px}
.quiz-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:32px;width:100%;border:1px solid var(--bd);text-align:center}
.mode-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{border:1.5px solid var(--bd);background:var(--bg);padding:7px 16px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--t2);transition:all .2s}
.mode-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.q-progress{font-size:.76rem;color:var(--tm);margin-bottom:8px}
.q-bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:24px;overflow:hidden}
.q-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.q-label{font-size:.69rem;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.q-word{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:var(--t1);margin-bottom:24px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.q-opt{border:1.5px solid var(--bd);background:var(--bg);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;text-align:left;color:var(--t1);transition:all .2s}
.q-opt:hover:not(:disabled){border-color:var(--accent);background:var(--am)}
.q-opt.ok{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.q-opt.bad{border-color:var(--red);background:#fdecea;color:var(--red)}
.q-opt:disabled{cursor:not-allowed}
.q-fb{min-height:22px;font-size:.9rem;font-weight:500;margin-bottom:14px}
.q-fb.ok{color:var(--accent)}
.q-fb.bad{color:var(--red)}
.res-stats{display:flex;gap:28px;justify-content:center;margin-bottom:28px}
.res-stat .val{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--accent)}
.res-stat .lbl{font-size:.71rem;color:var(--tm);text-transform:uppercase;letter-spacing:.5px}
@media(max-width:540px){
  .card,.quiz-card{padding:20px 16px}
  .q-opts{grid-template-columns:1fr}
  .q-word{font-size:1.5rem}
  header h1{font-size:1.9rem}
  th:nth-child(5),td:nth-child(5){display:none}
}
.td-edit{position:relative}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--tm);font-size:.8rem;padding:2px 5px;border-radius:5px;transition:all .2s;opacity:0}
tr:hover .edit-btn{opacity:1}
.edit-btn:hover{color:var(--accent);background:var(--am)}
.td-editable{outline:none;border-bottom:1.5px solid var(--accent);background:var(--am);border-radius:3px 3px 0 0;padding:2px 4px;min-width:60px;font-family:inherit;font-size:inherit;color:var(--accent)}
.save-edit{background:var(--accent);color:#fff;border:none;padding:3px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;margin-left:4px}
.cancel-edit{background:none;border:1px solid var(--bd);color:var(--t2);padding:3px 8px;border-radius:6px;font-size:.75rem;cursor:pointer;margin-left:2px}
footer{margin-top:24px;font-size:.73rem;color:var(--tm);text-align:center;padding:0 16px}
.dir-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dir-btn{flex:1;min-width:140px;border:1.5px solid var(--bd);background:var(--bg);border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:.83rem;cursor:pointer;color:var(--t2);transition:all .2s;display:flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap}
.dir-btn:hover{border-color:var(--accent);background:var(--am)}
.dir-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.dir-arrow{color:var(--tm);font-size:.8rem;margin:0 2px}
</style>
</head>
<body>

<!-- ══ SYNC TOP BAR ══ -->
<div id="sync-topbar">
  <span class="user-info-text" id="user-email-text" style="display:none"></span>
  <button class="btn-signout" id="btn-signout" style="display:none" onclick="signOut()">Cerrar sesión</button>
  <button class="btn-sync" id="btn-sync" onclick="handleSync()">
    <span id="sync-icon">☁️</span>
    <span id="sync-label">Sincronizar vocabulario</span>
  </button>
</div>
<div id="sync-status-bar">
  <span id="sync-status-msg"></span>
  <button class="sync-close" onclick="closeSyncBar()">✕</button>
</div>

<header>
  <h1>Our <span>Translator</span></h1>
  <p>Vocabulary · Study</p>
</header>

<!-- ══ LANGUAGE PAIR SELECTOR ══ -->
<div class="lang-selector" id="langSelector">
  <span class="ls-label">Idioma</span>
  <button class="lp-btn on" data-pair="es-en"><span class="lp-flag">🇬🇧</span> ES ↔ EN</button>
  <button class="lp-btn" data-pair="es-fr"><span class="lp-flag">🇫🇷</span> ES ↔ FR</button>
  <button class="lp-btn" data-pair="es-it"><span class="lp-flag">🇮🇹</span> ES ↔ IT</button>
  <button class="lp-btn" data-pair="es-de"><span class="lp-flag">🇩🇪</span> ES ↔ DE</button>
  <button class="lp-btn" data-pair="es-pt"><span class="lp-flag">🇵🇹</span> ES ↔ PT</button>
</div>

<div class="tabs">
  <button class="tab on" data-tab="translator">🌐 Traducir</button>
  <button class="tab" data-tab="vocab">📋 Vocabulario (<span id="vcntTab">0</span>)</button>
  <button class="tab" data-tab="quiz">🧠 Estudiar</button>
</div>

<!-- ══ TRANSLATOR ══ -->
<div class="panel on" id="panel-translator">
  <div class="card">
    <div class="dir-row" id="dirRow">
      <button class="dir-btn on" id="dirA" onclick="setDir('a')">
        <span id="dirFlagA">🇪🇸</span> <span id="dirLabelA">Español</span>
        <span class="dir-arrow">→</span>
        <span id="dirFlagB2">🇬🇧</span> <span id="dirLabelB">Inglés</span>
      </button>
      <button class="dir-btn" id="dirB" onclick="setDir('b')">
        <span id="dirFlagB">🇬🇧</span> <span id="dirLabelB2">Inglés</span>
        <span class="dir-arrow">→</span>
        <span id="dirFlagA2">🇪🇸</span> <span id="dirLabelA2">Español</span>
      </button>
    </div>
    <div class="inp-wrap">
      <input type="text" id="wordInput" maxlength="80" placeholder="Escribe una palabra o frase corta…" autocomplete="off" spellcheck="false">
      <button class="clr" id="clrBtn">✕</button>
    </div>
    <div class="inp-foot">
      <span id="charCount">0 / 80</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-s" id="saveBtnTop" style="display:none" onclick="doSave()">＋ Guardar</button>
        <button class="btn-p" id="goBtn">
          <span class="spin" id="spin"></span>
          <span id="btnLabel">Traducir →</span>
        </button>
      </div>
    </div>
    <div id="errBar" style="display:none;margin-top:10px;font-size:.82rem;color:var(--red);font-style:italic"></div>
  </div>
  <div id="resultSec"></div>
</div>

<!-- ══ VOCAB ══ -->
<div class="panel" id="panel-vocab">
  <div class="vocab-top">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>Mi vocabulario</h2>
      <span class="vcnt" id="vcntBadge">0 palabras</span>
    </div>
    <div class="vocab-filters" id="vocabFilters"></div>
  </div>
  <div id="vocabBody" style="width:100%"></div>
  <div style="width:100%;display:flex;justify-content:flex-end;margin-bottom:6px">
    <button class="btn-s" id="importBtn">⬆ Cargar Excel</button>
    <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none">
  </div>
  <div id="importMsg" style="display:none;width:100%;font-size:.82rem;padding:8px 14px;border-radius:10px;margin-bottom:6px"></div>
  <div class="tbl-actions" id="tblActions" style="display:none">
    <button class="btn-s" id="exportBtn">⬇ Descargar Excel</button>

async function doSync() {
  if (!currentUser) return;
  setSyncStatus('info', '⏳ Sincronizando vocabulario…');
  document.getElementById('btn-sync').classList.add('syncing');

  try {
    const uid = currentUser.uid;
    const docRef = db.collection('traductor').doc(uid);
    const snap = await docRef.get();

    const localVocab  = [...vocab];
    const localStats  = {...stats};
    const localSC     = quizSessionCount;

    if (snap.exists) {
      const remote = snap.data();
      const remoteVocab = remote.vocab  || [];
      const remoteStats = remote.stats  || {};
      const remoteSC    = remote.quizSessionCount || 0;

      // Merge vocab: combine by id, prefer local when same id exists
      const mergedVocab = mergeVocab(localVocab, remoteVocab);

      // Merge stats: for same id, add ok/fail counts, keep latest lastSeen
      const mergedStats = mergeStats(localStats, remoteStats);

      // quizSessionCount: use the higher value
      const mergedSC = Math.max(localSC, remoteSC);

      // Save merged to localStorage
      vocab = mergedVocab;
      stats = mergedStats;
      quizSessionCount = mergedSC;
      saveVocab();
      saveStats();
      try { localStorage.setItem('lexio_sc', mergedSC); } catch(_) {}

      // Upload merged to Firestore
      await docRef.set({
        vocab: mergedVocab,
        stats: mergedStats,
        quizSessionCount: mergedSC,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      updateVocabCount();
      setSyncStatus('ok', `✅ Sincronizado — ${mergedVocab.length} palabra${mergedVocab.length!==1?'s':''} en vocabulario`);

    } else {

      await docRef.set({

      });

}

// Combina dos arrays de vocab sin duplicar por id
// Si mismo id en ambos, gana el local (más reciente en ese dispositivo)
function mergeVocab(local, remote) {
  const map = new Map();
  // Primero remotos, luego locales (locales sobreescriben)
  for (const v of remote) map.set(v.id, v);
  for (const v of local)  map.set(v.id, v);
  return Array.from(map.values());
}

// Combina stats: suma ok/fail, usa el lastSeen mayor
function mergeStats(local, remote) {
  const result = {};
  const allKeys = new Set([...Object.keys(local), ...Object.keys(remote)]);
  for (const k of allKeys) {
    const l = local[k]  || {ok:0, fail:0, lastSeen:0};
    const r = remote[k] || {ok:0, fail:0, lastSeen:0};
    result[k] = {
      ok:       l.ok   + r.ok,
      fail:     l.fail + r.fail,
      lastSeen: Math.max(l.lastSeen, r.lastSeen)
    };
  }
  return result;
}

function detectLangInPair(text, pair) {
  const lp=LANG_PAIRS[pair],langA=lp.a,langB=lp.b,t=text.trim(),lower=t.toLowerCase();
  if(LANG_CHARS[langB]&&LANG_CHARS[langB].test(t)) return langB;
  if(LANG_CHARS[langA].test(t)) return langA;
  const tokens=lower.split(/[\s\-,;:.!?]+/).filter(Boolean);
  let sA=0,sB=0;
  for(const w of tokens){
    if(EXCL[langA].has(w)) sA+=3;
    if(EXCL[langB].has(w)) sB+=3;
    if(w.length>3){if(EXCL[langB].has(w.slice(0,-1))) sB+=1;}
  }
  if(sB>sA) return langB;
  if(sA>sB) return langA;
  if(langB==='en'){if(/^[a-zA-Z'\s-]+$/.test(t)&&!EXCL['es'].has(lower)) return langB;}
  if(langB==='it'){if(/\b\w+(zione|ità|aggio|ello|etto|ando|endo|iamo|iate|isco|isce|iscono)\b/i.test(t)) return langB;if(/\b\w+(ire|zione|ggio|tti|cci)\b/i.test(t)) return langB;}
  if(langB==='pt'){if(/\b\w+(ção|ções|nho|lho|ável|ível|agem)\b/i.test(t)) return langB;}
  if(langB==='fr'){if(/\b\w+(eur|euse|eau|aux|eux|ais|aise|ois|tion|ment)\b/i.test(t)) return langB;}
  if(langB==='de'){if(/\b\w+(ung|heit|keit|schaft|lich|chen|weise|tum|ieren)\b/i.test(t)) return langB;if(/(?:^|\s)[A-ZÄÖÜ][a-zäöüß]{2,}/.test(t)) return langB;}
  if(/^[a-zA-Z'\s-]+$/.test(t)){
    if(/\w+(?:cion|miento|ante|ente|iente|tante|rante|ado|ada|ido|ida|ando|iendo|ario|aria|orio|oria|ismo|ista|mente|oso|osa|able|ible|ura|aje|dor|dora|anza|encia|ancia|ero|era|torio|sorio)$/.test(lower)){if(!EXCL[langB]?.has(lower)) return langA;}
    const ES_GUARD=new Set(['gato','perro','mesa','silla','clase','libro','amigo','amiga','tiempo','trabajo','nombre','cosa','parte','vida','lugar','hombre','mujer','hijo','hija','padre','madre','hermano','hermana','comida','bebida','coche','tren','barco','piso','suelo','techo','puerta','ventana','zapato','ropa','camisa','verde','negro','blanco','azul','gris','hablar','comer','beber','dormir','correr','saltar','vivir','hacer','tener','grande','nuevo','viejo','largo','corto','alto','bajo','bueno','malo','poco','mucho','algo','nada','todo','nadie','alguien','cada','donde','cuando','como','porque','aunque','sino','para','pero','mas','muy','tan','ya','sin','canal','animal','general','natural','hospital','capital','final','total','normal','personal','social','local','central','nacional','original','principal','especial','color','calor','valor','dolor','honor','humor','terror','error','favor','actor','doctor','autor','rector','sector','motor']);
    if(ES_GUARD.has(lower)) return langA;
    return langB;
  }
  return langA;
}

//  TRANSLATION ENGINE (sin cambios)

async function gtrans(q, sl, tl) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${enc(q)}`;
  const r = await fetch(url); if(!r.ok) throw new Error('gtrans failed');
  const d = await r.json();
  return (d[0]||[]).map(x=>x[0]).filter(Boolean).join('').trim();
}

async function fetchTranslations(word, fromLang, toLang) {
  const results = new Map();
  const ROMANCE = new Set(['es','fr','it','pt','ro']);
  const closePair = ROMANCE.has(fromLang) && ROMANCE.has(toLang);
  function add(raw,w=1){
    if(!raw) return; const t=raw.trim(); if(!t||t.length<2||t.length>50) return;
    const isDupe=closePair?t.toLowerCase()===word.toLowerCase():norm(t)===norm(word);
    if(isDupe) return; if(/\d/.test(t)) return;
    const n=norm(t); if(!results.has(n)) results.set(n,{display:cap(t),score:0}); results.get(n).score+=w;
  }
  const gtP=gtrans(word,fromLang,toLang).then(t=>add(t,3)).catch(()=>{});
  const gtAutoP=gtrans(word,'auto',toLang).then(t=>{
    if(!t||t.trim().length<2||t.trim().length>50) return; if(/\d/.test(t)) return;
    const display=cap(t.trim()),n=norm(t);
    if(!results.has(n)) results.set(n,{display,score:0}); results.get(n).score+=3;
  }).catch(()=>{});
  let myPrimary='';
  const myP=fetch(`https://api.mymemory.translated.net/get?q=${enc(word)}&langpair=${fromLang}|${toLang}`)
    .then(r=>r.ok?r.json():null).then(d=>{
      if(!d||d.responseStatus!==200) return; myPrimary=(d.responseData?.translatedText||'').trim(); add(myPrimary,2);
      for(const m of (d.matches||[])){ if(norm(m.segment||'')!==word.toLowerCase()) continue; add(m.translation||'',1); }
    }).catch(()=>{});
  const wikiLang=(fromLang==='en'||toLang==='en')?(fromLang==='en'?'en':'en'):null;
  const wikiP=wikiLang?fetch(`https://en.wiktionary.org/w/api.php?action=parse&page=${enc(word)}&prop=wikitext&format=json&origin=*`)
    .then(r=>r.ok?r.json():null).then(d=>{
      const txt=d?.parse?.wikitext?.['*']||'',re=new RegExp(`\\{\\{t[+\\-]?\\|${toLang}\\|([^|{}\\n]+)`,'g');let m;
      while((m=re.exec(txt))!==null) add(m[1].replace(/\[\[([^|\]]+\|)?([^\]]+)\]\]/g,'$2'),2);
    }).catch(()=>{}):Promise.resolve();
  const esWikiP=(fromLang==='es'&&toLang!=='en')?
    fetch(`https://es.wiktionary.org/w/api.php?action=parse&page=${enc(word)}&prop=wikitext&format=json&origin=*`)
    .then(r=>r.ok?r.json():null).then(d=>{
      const txt=d?.parse?.wikitext?.['*']||'',re=new RegExp(`\\{\\{t[+\\-]?\\|${toLang}\\|([^|{}\\n]+)`,'g');let m;
      while((m=re.exec(txt))!==null) add(m[1].replace(/\[\[([^|\]]+\|)?([^\]]+)\]\]/g,'$2'),2);
    }).catch(()=>{}):Promise.resolve();
  await Promise.all([gtP,gtAutoP,myP,wikiP,esWikiP]);
  let sorted=[...results.values()].sort((a,b)=>b.score-a.score||a.display.length-b.display.length).map(v=>v.display);
  if(sorted.length===0){try{const f=await gtrans(word,'auto',toLang);if(f&&f.trim().length>1) sorted=[cap(f.trim())];}catch(_){}}
  if(sorted.length===0) throw new Error('No se encontró traducción.');
  return sorted;
}

async function fetchDictData(word) {
  try {
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${enc(word.toLowerCase())}`);
    if(!r.ok) return {phonetic:'',pos:'',rawEx:[]};
    const dd=await r.json(),entry=dd[0];
    const phonetic=entry.phonetic||(entry.phonetics||[]).find(p=>p.text)?.text||'';
    let pos='',rawEx=[];
    for(const m of (entry.meanings||[])){
      if(!pos) pos=m.partOfSpeech||'';
      for(const d of (m.definitions||[])){ if(d.example&&rawEx.length<4) rawEx.push(d.example); }
      if(rawEx.length>=4) break;
    }
    return {phonetic,pos,rawEx};
  } catch(_){ return {phonetic:'',pos:'',rawEx:[]}; }
}

async function fetchCollocations(word, langPair) {
  const lp=LANG_PAIRS[langPair],enWord=(lp.a==='en'||lp.b==='en')?word:null;
  if(!enWord) return [];
  try {
    const eps=[`https://api.datamuse.com/words?rel_jjb=${enc(enWord)}&max=6`,`https://api.datamuse.com/words?rel_jja=${enc(enWord)}&max=6`,`https://api.datamuse.com/words?rc=${enc(enWord)}&max=8`,`https://api.datamuse.com/words?lc=${enc(enWord)}&max=8`];
    const rs=await Promise.all(eps.map(u=>fetch(u).then(r=>r.ok?r.json():[]).catch(()=>[])));
    const phrases=[...rs[0].slice(0,4).map(w=>`${w.word} ${enWord}`),...rs[1].slice(0,4).map(w=>`${enWord} ${w.word}`),...rs[2].slice(0,4).map(w=>`${enWord} ${w.word}`),...rs[3].slice(0,4).map(w=>`${w.word} ${enWord}`)];
    const seen=new Set(),out=[];
    for(const p of phrases){const n=p.toLowerCase();if(!seen.has(n)&&n!==enWord.toLowerCase()){seen.add(n);out.push(p);}if(out.length>=10) break;}
    return out;
  } catch(_){ return []; }
}

function fetchFigurative(word, langPair) {
  const lp=LANG_PAIRS[langPair];
  if(lp.a!=='en'&&lp.b!=='en') return [];
  const w=word.toLowerCase().trim();
  const FIG={"light":[{type:"idiom",expression:"see the light",meaning:"To finally understand or have a revelation"},{type:"idiom",expression:"light at the end of the tunnel",meaning:"Hope that a difficult situation will soon end"},{type:"idiom",expression:"come to light",meaning:"To become known or be revealed"},{type:"metaphor",expression:"shed light on",meaning:"To clarify or explain something"},{type:"quote",expression:"Give light, and the darkness will disappear of itself — Erasmus",meaning:"Truth and knowledge dispel ignorance"}],"time":[{type:"idiom",expression:"time flies",meaning:"Time passes very quickly"},{type:"idiom",expression:"kill time",meaning:"To do something to pass the time while waiting"},{type:"proverb",expression:"Time is money",meaning:"Time is a valuable resource"},{type:"proverb",expression:"Time heals all wounds",meaning:"Emotional pain lessens with time"},{type:"metaphor",expression:"time is a thief",meaning:"Time takes away youth and opportunities"},{type:"quote",expression:"Lost time is never found again — Benjamin Franklin",meaning:"Once time passes, it cannot be recovered"}],"water":[{type:"idiom",expression:"water under the bridge",meaning:"Past events no longer worth worrying about"},{type:"idiom",expression:"in hot water",meaning:"In trouble"},{type:"idiom",expression:"test the waters",meaning:"To try something cautiously before committing"},{type:"proverb",expression:"Still waters run deep",meaning:"A quiet person may have deep knowledge or emotions"},{type:"metaphor",expression:"drowning in work",meaning:"Overwhelmed by too many tasks"}],"fire":[{type:"idiom",expression:"play with fire",meaning:"To do something risky"},{type:"idiom",expression:"add fuel to the fire",meaning:"To make a bad situation worse"},{type:"idiom",expression:"under fire",meaning:"Being criticised or attacked"},{type:"proverb",expression:"Where there's smoke, there's fire",meaning:"Signs of a problem usually mean the problem exists"},{type:"metaphor",expression:"fire in the belly",meaning:"Strong ambition and determination"}],"heart":[{type:"idiom",expression:"wear your heart on your sleeve",meaning:"To show your feelings openly"},{type:"idiom",expression:"have a change of heart",meaning:"To change one's opinion"},{type:"idiom",expression:"heart of gold",meaning:"A very kind and generous nature"},{type:"metaphor",expression:"heart of stone",meaning:"A person who shows no compassion"},{type:"quote",expression:"The heart has its reasons which reason does not know — Pascal",meaning:"Emotions defy rational explanation"}]};
  if(FIG[w]) return FIG[w];
  const first=w.split(' ')[0];
  if(first!==w&&FIG[first]) return FIG[first];
  return [];
}

  const raw=wordInput.value.trim(); if(!raw){wordInput.focus();return;}
  hideErr();
  const lp=getLP(),isA=inputDir==='a',fromLang=isA?lp.a:lp.b,toLang=isA?lp.b:lp.a;
  const dirLabel=`${lp.flagA} ${lp.labelA} → ${lp.flagB} ${lp.labelB}`,dirLabelRev=`${lp.flagB} ${lp.labelB} → ${lp.flagA} ${lp.labelA}`;

  resultSec.classList.add('on'); resultSec.scrollIntoView({behavior:'smooth',block:'nearest'});
  try {
    const translations=await fetchTranslations(raw,fromLang,toLang);
    const wordA=raw,wordB=translations[0]||raw;
    const enWord=lp.a==='en'?(isA?raw:wordB):lp.b==='en'?(isA?wordB:raw):null;
    const {phonetic,pos,rawEx}=enWord?await fetchDictData(enWord):{phonetic:'',pos:'',rawEx:[]};
    const [collocations,figurative]=await Promise.all([fetchCollocations(enWord||raw,activePair),Promise.resolve(fetchFigurative(enWord||raw,activePair))]);
    const examples=rawEx.slice(0,3);
    let html=`<div class="card result-card">
      <div class="res-dir">${actualDir}</div>

          <div class="res-word">${esc(wordA)}</div>
          ${phonetic&&isA&&lp.a==='en'?`<div class="res-phon">${esc(phonetic)}</div>`:''}
          ${phonetic&&!isA&&lp.b==='en'?`<div class="res-phon">${esc(phonetic)}</div>`:''}
          ${pos?`<span class="pos-pill">${esc(pos)}</span>`:''}
        </div>
        <div style="color:var(--accent);font-size:1.4rem;padding-top:4px">→</div>
        <div style="flex:1;min-width:160px">
          <div class="res-label">Traducciones <span style="font-size:.65rem;color:var(--tm);font-weight:400;text-transform:none;letter-spacing:0">(selecciona la mejor)</span></div>
          <div class="trans-list" id="transList">
            ${translations.map((t,i)=>`<div class="trans-opt${i===0?' on':''}" data-val="${esc(t)}" onclick="selectTrans(this)"><div class="radio"></div><span class="trans-w">${esc(t)}</span></div>`).join('')}
            <div class="trans-custom" id="transCustom" onclick="focusCustom()"><div class="radio"></div><input type="text" id="transCustomInput" placeholder="Otra traducción…" oninput="onCustomInput()" onfocus="selectCustom()"></div>
          </div>
        </div>
      </div>`;
    if(collocations.length){ html+=`<div class="sec-title">Collocations (EN)</div><div class="chips">${collocations.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`; }
    if(examples.length){ html+=`<div class="divider"></div><div class="sec-title">Ejemplos de uso (EN)</div><ul class="ex-list">${examples.map(ex=>{const hl=esc(ex).replace(new RegExp(`(${escRe(enWord||raw)})`,'gi'),'<mark>$1</mark>');return `<li>${hl}</li>`;}).join('')}</ul>`; }
    if(figurative.length){ const typeIcon={idiom:'💬',proverb:'📜',metaphor:'🌿',quote:'✦'},typeLabel={idiom:'Idiom',proverb:'Proverb',metaphor:'Metaphor',quote:'Quote'}; html+=`<div class="divider"></div><div class="sec-title">Figurative Language</div><div style="display:flex;flex-direction:column;gap:10px">${figurative.map(f=>`<div style="border-left:2px solid var(--blue);padding:8px 14px;background:#f0f4fa;border-radius:0 8px 8px 0"><div style="margin-bottom:4px"><span style="font-size:.7rem;background:#dce6f5;color:var(--blue);padding:2px 8px;border-radius:100px;font-weight:500">${typeIcon[f.type]||'◆'} ${typeLabel[f.type]||f.type}</span></div><div style="font-style:italic;font-size:.93rem;color:var(--t1);margin-bottom:3px">"${esc(f.expression)}"</div><div style="font-size:.78rem;color:var(--t2)">${esc(f.meaning)}</div></div>`).join('')}</div>`; }
    html+=`</div>`;
    resultSec.innerHTML=html; resultSec.classList.add('on');
    lastResult={wordA,wordB,fromLang,toLang,pair:activePair,translations,collocations,examples,figurative,phonetic,pos};

function renderVocab(){

  pairsInVocab.forEach(p=>{const lp=LANG_PAIRS[p]||LANG_PAIRS['es-en'];filtersHTML+=`<button class="vf-btn${vocabFilter===p?' on':''}" data-filter="${p}">${lp.flagA}${lp.flagB} ${p.toUpperCase()}</button>`;});
  filtersEl.innerHTML=filtersHTML;
  filtersEl.querySelectorAll('.vf-btn').forEach(b=>{b.addEventListener('click',()=>{vocabFilter=b.dataset.filter;renderVocab();});});

  if(vocab.length===0){body.innerHTML=`<div class="empty"><div class="ico">📖</div>Aún no hay palabras guardadas.<br>Traduce algo y pulsa <strong>"Guardar"</strong>.</div>`;actions.style.display='none';return;}
  if(filtered.length===0){body.innerHTML=`<div class="empty"><div class="ico">🔍</div>No hay palabras con este filtro.</div>`;actions.style.display='flex';return;}
  actions.style.display='flex';
  let html=`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Palabra A</th><th>Palabra B</th><th>Nivel</th><th>Collocations</th><th>Fecha</th><th></th></tr></thead><tbody>`;
  filtered.forEach((v,i)=>{
    const lp=LANG_PAIRS[v.pair||'es-en']||LANG_PAIRS['es-en'],sv=getStat(v.id),stot=sv.ok+sv.fail;
    const dc=stot===0?`<span style="color:var(--tm)">—</span>`:(()=>{const a=Math.round((sv.ok/stot)*100);const [ic,col]=a>=80?['✓ '+a+'%','var(--accent)']:a>=50?['◑ '+a+'%','var(--blue)']:['✗ '+a+'%','var(--red)'];return `<span style="color:${col};font-size:.76rem;font-weight:500">${ic}</span>`;})();
    html+=`<tr data-id="${v.id}"><td style="color:var(--tm);font-size:.76rem">${i+1}</td><td class="td-a td-edit"><span class="cell-val">${esc(v.wordA)}</span><span class="lang-tag">${lp.flagA}</span><button class="edit-btn" data-id="${v.id}" data-field="wordA" title="Editar">✏️</button></td><td class="td-b td-edit"><span class="cell-val">${esc(v.wordB)}</span><span class="lang-tag">${lp.flagB}</span><button class="edit-btn" data-id="${v.id}" data-field="wordB" title="Editar">✏️</button></td><td style="text-align:center">${dc}</td><td class="td-sm td-edit"><span class="cell-val">${esc((v.collocations||[]).slice(0,4).join(', '))}</span><button class="edit-btn" data-id="${v.id}" data-field="collocations" title="Editar">✏️</button></td><td style="font-size:.74rem;color:var(--tm);white-space:nowrap">${v.date}</td><td><button class="del" data-id="${v.id}">✕</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  body.innerHTML=html;
  body.querySelectorAll('.del').forEach(btn=>{btn.addEventListener('click',()=>{vocab=vocab.filter(v=>v.id!==+btn.dataset.id);saveVocab();pruneStats();renderVocab();});});
  body.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const id=+btn.dataset.id,field=btn.dataset.field,td=btn.closest('td'),entry=vocab.find(v=>v.id===id);
      if(!entry) return;
      const cur=field==='collocations'?(entry.collocations||[]).join(', '):entry[field]||'';
      td.innerHTML=`<input class="td-editable" id="editInput_${id}_${field}" value="${esc(cur)}" style="width:90%"><div style="margin-top:4px;display:flex;gap:4px"><button class="save-edit" data-id="${id}" data-field="${field}">✓ Guardar</button><button class="cancel-edit">✕</button></div>`;
      const input=td.querySelector('.td-editable'); input.focus(); input.select();
      td.querySelector('.save-edit').addEventListener('click',()=>{
        const val=input.value.trim(),entry2=vocab.find(v=>v.id===id);
        if(!entry2) return;
        if(field==='collocations'){entry2.collocations=val.split(',').map(s=>s.trim()).filter(Boolean);}else{entry2[field]=val;}
        saveVocab(); renderVocab();
      });

      input.addEventListener('keydown',e2=>{if(e2.key==='Enter') td.querySelector('.save-edit').click();if(e2.key==='Escape') renderVocab();});
    });
  });
}

    try{
      const data=new Uint8Array(ev.target.result),wb=XLSX.read(data,{type:'array'});
      const sheetName=wb.SheetNames.includes('Vocabulario')?'Vocabulario':wb.SheetNames[0];
      const ws=wb.Sheets[sheetName],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){showImportMsg('El archivo no contiene datos.','err');return;}
      const dataRows=rows[0][0]==='#'?rows.slice(1):rows;
      function parsePair(raw){const s=String(raw).toLowerCase().replace(/[^a-z-]/g,'');const match=s.match(/(es)[- ]?(en|fr|it|de|pt)/);if(match) return `es-${match[2]}`;return 'es-en';}
      let imported=0,skipped=0,updated=0;
      dataRows.forEach(row=>{
        const wordA=String(row[2]||'').trim(),wordB=String(row[3]||'').trim();if(!wordA||!wordB) return;
        const pair=parsePair(row[1]),transRaw=String(row[4]||'').trim(),translations=transRaw?transRaw.split('/').map(s=>s.trim()).filter(Boolean):[wordB];
        const collRaw=String(row[5]||'').trim(),collocations=collRaw?collRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
        const examples=[row[6],row[7],row[8]].map(s=>String(s||'').trim()).filter(Boolean);
        const date=String(row[9]||'').trim()||new Date().toLocaleDateString('es-ES');
        const existing=vocab.find(v=>(v.pair||'es-en')===pair&&norm(v.wordA)===norm(wordA));
        if(existing){
          let changed=false;
          if(norm(existing.wordB)!==norm(wordB)){existing.wordB=wordB;changed=true;}
          translations.forEach(t=>{if(!(existing.translations||[]).some(et=>norm(et)===norm(t))){existing.translations=existing.translations||[];existing.translations.push(t);changed=true;}});
          if(changed) updated++;else skipped++;
        } else {
          vocab.push({id:Date.now()+imported+Math.floor(Math.random()*1000),pair,wordA,wordB,translations,collocations,examples,figurative:[],date});imported++;
        }
      });
      saveVocab();updateVocabCount();renderVocab();
      const parts=[];if(imported) parts.push(`${imported} palabra${imported!==1?'s':''} importada${imported!==1?'s':''}`);if(updated) parts.push(`${updated} actualizada${updated!==1?'s':''}`);if(skipped) parts.push(`${skipped} ya existía${skipped!==1?'n':''}`);
      showImportMsg('✓ '+(parts.join(' · ')||'Sin cambios.'),'ok');
    } catch(err){showImportMsg('Error al leer el archivo: '+err.message,'err');}
  };
  reader.readAsArrayBuffer(file);
});

function showImportMsg(msg,type){const el=document.getElementById('importMsg');el.textContent=msg;el.style.display='block';el.style.background=type==='ok'?'var(--am)':'#fdecea';el.style.color=type==='ok'?'var(--accent)':'var(--red)';el.style.border=`1px solid ${type==='ok'?'var(--al)':'#f5c6c6'}`;setTimeout(()=>{el.style.display='none';},5000);}

function renderQuiz(){
  const body=document.getElementById('quizBody');
  const pool=vocabFilter==='all'?vocab:vocab.filter(v=>(v.pair||'es-en')===vocabFilter);
  if(pool.length<2){body.innerHTML=`<div class="empty"><div class="ico">🧠</div>Necesitas al menos 2 palabras guardadas para estudiar.</div>`;return;}
  buildQuiz(body,pool);
}

function buildQuiz(body,pool){
  quizSessionCount++;try{localStorage.setItem('lexio_sc',quizSessionCount);}catch(_){}
  quizSession=weightedSample(pool,Math.min(pool.length,10));quizIdx=0;quizScore=0;quizAnswered=false;renderQuizCard(body,pool);
}

function weightedSample(items,n){
  if(items.length<=n) return [...items].sort(()=>Math.random()-.5);
  const pool=[];items.forEach(v=>{const w=wordWeight(v),t=Math.floor(w);for(let i=0;i<t;i++) pool.push(v);if(Math.random()<(w-t)) pool.push(v);});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const seen=new Set(),result=[];for(const v of pool){if(!seen.has(v.id)){seen.add(v.id);result.push(v);}if(result.length>=n) break;}
  if(result.length<n){const rest=items.filter(v=>!seen.has(v.id)).sort(()=>Math.random()-.5);result.push(...rest.slice(0,n-result.length));}
  return result;
}

function renderQuizCard(body,pool){
  if(quizIdx>=quizSession.length){renderQuizResult(body,pool);return;}
  const correct=quizSession[quizIdx],lp=LANG_PAIRS[correct.pair||'es-en']||LANG_PAIRS['es-en'];
  const others=[...pool].filter(v=>v.id!==correct.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[correct,...others].sort(()=>Math.random()-.5);
  const pct=Math.round((quizIdx/quizSession.length)*100);
  const s=getStat(correct.id),tot=s.ok+s.fail;
  let diffBadge='';
  if(tot>0){const acc=Math.round((s.ok/tot)*100);const [ic,lb,col]=acc>=80?['✓','Controlada','var(--accent)']:acc>=50?['◑','En progreso','var(--blue)']:['✗','Difícil','var(--red)'];diffBadge=`<div style="font-size:.71rem;color:${col};margin:-10px 0 16px;font-weight:500">${ic} ${lb} &nbsp;·&nbsp; ${s.ok}✓ ${s.fail}✗ de ${tot} intento${tot>1?'s':''}</div>`;}
  const getQ=v=>quizMode==='b2a'?v.wordB:v.wordA,getA=v=>{if(quizMode==='collocations') return (v.collocations||[])[0]||v.wordB;return quizMode==='b2a'?v.wordA:v.wordB;};
  const qLang=quizMode==='b2a'?`${lp.flagB} → ${lp.flagA}`:`${lp.flagA} → ${lp.flagB}`,qLabel=quizMode==='collocations'?'¿Cuál es una collocation?':`Traduce: ${qLang}`;
  body.innerHTML=`<div class="quiz-card">
    <div class="mode-row">${[['a2b',`${lp.flagA}→${lp.flagB}`],['b2a',`${lp.flagB}→${lp.flagA}`],['collocations','Collocations']].map(([m,l])=>`<button class="mode-btn${quizMode===m?' on':''}" data-mode="${m}">${l}</button>`).join('')}</div>
    <div class="q-progress">Pregunta ${quizIdx+1} de ${quizSession.length} · Aciertos: ${quizScore}</div>
    <div class="q-bar"><div class="q-fill" style="width:${pct}%"></div></div>
    <div class="q-label">${qLabel}</div>
    <div class="q-word">${esc(getQ(correct))}</div>
    ${diffBadge}
    <div class="q-opts">${opts.map(v=>`<button class="q-opt" data-id="${v.id}">${esc(getA(v))}</button>`).join('')}</div>
    <div class="q-fb" id="qFb"></div>
    <button class="btn-p" id="qNext" style="display:none;margin:0 auto">Siguiente →</button>
  </div>`;
  body.querySelectorAll('.mode-btn').forEach(b=>{b.addEventListener('click',()=>{quizMode=b.dataset.mode;buildQuiz(body,pool);});});
  body.querySelectorAll('.q-opt').forEach(b=>{
    b.addEventListener('click',()=>{
      if(quizAnswered) return; quizAnswered=true;
      const clicked=+b.dataset.id,isOk=clicked===correct.id;
      if(isOk) quizScore++;
      const sid=String(correct.id);if(!stats[sid]) stats[sid]={ok:0,fail:0,lastSeen:0};
      isOk?stats[sid].ok++:stats[sid].fail++;stats[sid].lastSeen=quizSessionCount;saveStats();
      body.querySelectorAll('.q-opt').forEach(o=>{o.disabled=true;if(+o.dataset.id===correct.id) o.classList.add('ok');});
      if(!isOk) b.classList.add('bad');
      const fb=document.getElementById('qFb');
      const allTrans=(correct.translations||[correct.wordB]);
      const extraNote=allTrans.length>1&&quizMode!=='collocations'?`<div style="font-size:.76rem;color:var(--tm);margin-top:4px">También válido: ${allTrans.filter(t=>t!==correct.wordB).slice(0,3).map(t=>`<em>${esc(t)}</em>`).join(', ')}</div>`:'';
      fb.innerHTML=(isOk?'✓ ¡Correcto!':'✗ Era: <strong>'+esc(getA(correct))+'</strong>')+extraNote;
      fb.className='q-fb '+(isOk?'ok':'bad');
      document.getElementById('qNext').style.display='inline-flex';
    });
  });
  document.getElementById('qNext').addEventListener('click',()=>{quizIdx++;quizAnswered=false;renderQuizCard(body,pool);});
}

function renderQuizResult(body,pool){
  const pct=Math.round((quizScore/quizSession.length)*100);
  const [e,t]=pct===100?['🏆','¡Perfecto!']:pct>=70?['👏','¡Muy bien!']:pct>=40?['💪','¡Sigue practicando!']:['📚','¡A repasar!'];
  body.innerHTML=`<div class="quiz-card"><div style="font-size:2.8rem;margin-bottom:12px">${e}</div><div style="font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;margin-bottom:6px">${t}</div><div style="font-size:.82rem;color:var(--tm);margin-bottom:28px">Has terminado el repaso</div><div class="res-stats">${[['Aciertos',quizScore],['Errores',quizSession.length-quizScore],['Precisión',pct+'%']].map(([l,v])=>`<div class="res-stat"><div class="val">${v}</div><div class="lbl">${l}</div></div>`).join('')}</div><button class="btn-p" id="qRestart" style="margin:0 auto">Volver a intentar</button></div>`;
  document.getElementById('qRestart').addEventListener('click',()=>buildQuiz(body,pool));
}
</script>

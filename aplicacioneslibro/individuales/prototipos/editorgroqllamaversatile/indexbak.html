<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2a7a6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Castroverde">
  <title>Editor · Castroverde · Narrativo / Descriptivo</title>
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg:        #eef4f3;
      --surface:   #e2edeb;
      --card:      #d6e8e5;
      --border:    #a3c2be; /* Bordes un poco más oscuros para definición */
      --text:      #12201e; /* Texto principal más oscuro para contraste */
      --muted:     #4d7570; /* Muted con más contraste */
      --accent:    #2a7a6e;
      --accent2:   #2d8a5f;
      --red:       #b04a2d;
      --blue:      #2d6a9d;
      --cloud:     #357abd;
      --font-h:    'Playfair Display', Georgia, serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --font-ui:   'DM Mono', monospace;
      --radius:    4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }
    
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body); 
      font-size: 16px; /* Aumentado de 15px */
      line-height: 1.6;
      display: flex; flex-direction: column;
    }

    /* ── MEJORAS DE VISIBILIDAD EN UI ── */
    
    #sync-bar {
      flex-shrink: 0; background: #1a2e2a; /* Fondo más sólido */
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; padding: 6px 20px;
    }

    .btn-sync {
      font-weight: 500; font-size: 10px; letter-spacing: 1.2px;
    }

    header {
      padding: 14px 24px; border-bottom: 2px solid var(--border); /* Línea más marcada */
    }

    .logo { font-size: 21px; color: var(--text); }
    .logo small { font-size: 9px; letter-spacing: 2px; font-weight: 500; opacity: 0.9; }

    .profile-btn {
      font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    }

    /* ── ÁREA DE EDICIÓN MEJORADA ── */
    
    #input-text {
      font-size: 17px; /* Texto de entrada más grande */
      line-height: 1.8;
      color: var(--text);
      padding: 24px;
      font-weight: 400;
    }

    #input-text:focus {
      background: rgba(255,255,255,0.3);
    }

    .panel-title {
      font-size: 10px; font-weight: 500; color: var(--text);
    }

    /* ── RESULTADOS Y LECTURA ── */

    .improved-text {
      font-size: 17px; /* Texto mejorado más legible */
      line-height: 1.9;
      color: #0d1a18;
      max-width: 800px;
      margin: 0 auto;
    }

    .result-tab {
      font-weight: 500; font-size: 10px;
    }

    .result-tab.active {
      font-weight: 600;
      border-bottom-width: 3px;
    }

    .report-section-title {
      font-weight: 600; font-size: 10px; color: var(--accent);
    }

    .report-item {
      font-size: 14px; color: var(--text);
    }

    /* ── BOTONES Y ACCIONES ── */

    .btn {
      font-weight: 600; padding: 9px 16px; font-size: 11px;
    }

    .fragment-name-input {
      font-size: 11px; padding: 8px 12px; border-width: 1.5px;
    }

    /* Scrollbar más visible */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Modales */
    .modal-box { padding: 32px; border: 2px solid var(--border); }
    .modal-textarea { font-size: 14px; line-height: 1.6; }

  </style>

name: Actualizar cartelera Broadway

on:
  schedule:
    # Cada día a las 9:00 AM hora española (8:00 UTC en invierno, 7:00 en verano)
    - cron: '0 8 * * *'
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar scraper
        run: python otrasaplicaciones/broadway/scraper.py

      - name: Mover cartelera.json al lugar correcto
        run: mv cartelera.json otrasaplicaciones/broadway/cartelera.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add otrasaplicaciones/broadway/cartelera.json
          git diff --staged --quiet || git commit -m "🎬 Cartelera actualizada $(date '+%Y-%m-%d')"
          git push

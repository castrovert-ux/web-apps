<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones básicas del móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#25D366; --c3:#FFD93D; --c4:#FF6B6B; --c5:#6BCB77; --c6:#4DA3FF; --c7:#C38BFF; --c8:#FF9F43; --c9:#FF8FD8;
    --bg:#0a1628; --card:#111d35; --text:#FFFFFE; --sub:#8a9bbf;
    --ink:#1b2433; --muted:#6b7587; --line:#e3e7ee; --acc:#2563eb;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
  button { font-family:inherit; }
  button:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }
  svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }

  .bg-blobs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.15; animation:float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:550px; height:550px; background:var(--c1); top:-120px; left:-100px; }
  .blob:nth-child(2){ width:400px; height:400px; background:var(--c7); bottom:-100px; right:-80px; animation-delay:-5s; }
  .blob:nth-child(3){ width:320px; height:320px; background:var(--c3); top:45%; left:45%; animation-delay:-9s; }
  @keyframes float { from{transform:translate(0,0) scale(1);} to{transform:translate(25px,18px) scale(1.07);} }
  @keyframes popIn { from{opacity:0; transform:scale(.95) translateY(10px);} to{opacity:1; transform:none;} }

  /* ---------- Estructura de la página ---------- */
  .container { position:relative; z-index:1; max-width:1700px; margin:0 auto; padding:14px 22px 16px; display:flex; flex-direction:column; gap:10px; min-height:100%; }
  .top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .badge { background:linear-gradient(135deg,var(--c1),#159a49); color:#fff; font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; padding:6px 16px; border-radius:100px; }
  h1 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.5rem,2.6vw,2.4rem); line-height:1.1; background:linear-gradient(135deg,var(--c1),var(--c3),var(--c8)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .modes { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .mode { padding:10px 20px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .mode.on { background:rgba(37,211,102,.16); border-color:var(--c1); color:var(--text); }
  .mode:hover { color:var(--text); }
  .prog { display:flex; align-items:center; gap:14px; font-weight:800; color:var(--sub); }
  .prog-bar { flex:1; height:10px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--c1),var(--c3),var(--c8)); border-radius:10px; transition:width .5s; }
  .reset { padding:6px 14px; border-radius:12px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:.9rem; cursor:pointer; white-space:nowrap; }
  .reset:hover { color:var(--text); border-color:var(--c4); }

  .layout { display:flex; gap:22px; align-items:flex-start; }
  .left { flex:0 0 auto; display:flex; gap:16px; align-items:flex-start; justify-content:center; }
  .stage[hidden] { display:none; }
  .stage { display:flex; gap:16px; align-items:flex-start; }
  .panel { flex:1; min-width:320px; align-self:stretch; background:var(--card); border:1px solid rgba(255,255,255,.08); border-left:6px solid var(--ic,var(--c1)); border-radius:22px; padding:18px 20px; overflow-y:auto; transition:border-color .3s;
    scrollbar-width:auto; scrollbar-color:#4a5b80 rgba(255,255,255,.05); }
  .panel::-webkit-scrollbar { width:12px; }
  .panel::-webkit-scrollbar-thumb { background:#4a5b80; border-radius:10px; border:2px solid var(--card); }
  @media (min-width:1000px) and (min-height:560px) {
    body { overflow:hidden; }
    .container { height:100vh; }
    .layout { flex:1; min-height:0; align-items:stretch; }
  }
  @media (max-width:999px) {
    .layout { flex-direction:column; align-items:center; }
    .panel { width:100%; min-width:0; }
    .phone { --ph:min(78vh, 170vw) !important; }
  }

  /* ---------- El móvil ---------- */
  .phone { --ph:clamp(430px, calc(100vh - 175px), 900px); container-type:size; position:relative; flex-shrink:0; height:var(--ph); width:calc(var(--ph) * .47); border-radius:calc(var(--ph) * .06);
    background:linear-gradient(145deg,#1d2433,#0b0e14); padding:calc(var(--ph) * .013); box-shadow:0 0 0 2px #2b3448, 0 24px 60px rgba(0,0,0,.55); transition:width .35s, height .35s; }
  .phone.land { width:min(var(--ph), calc(100vw - 720px)); height:calc(min(var(--ph), calc(100vw - 720px)) * .47); }
  .sb { position:absolute; right:calc(var(--ph) * -.008); width:calc(var(--ph) * .011); border-radius:3px; background:#2e3850; border:0; padding:0; cursor:pointer; }
  .sb:hover { background:#4a5b80; } .sb.down { background:var(--c3); }
  .sb.vup { top:17%; height:6.5%; } .sb.vdn { top:24%; height:6.5%; } .sb.pwr { top:35%; height:7%; }
  .phone.land .sb { right:auto; top:calc(var(--ph) * -.008) !important; height:calc(var(--ph) * .011); width:auto; }
  .phone.land .sb.vup { right:17%; width:6.5%; } .phone.land .sb.vdn { right:24%; width:6.5%; } .phone.land .sb.pwr { right:35%; width:7%; }
  .ph-scr { position:absolute; inset:calc(var(--ph) * .013); border-radius:calc(var(--ph) * .048); overflow:hidden; background:#000; font-size:4.3cqmin; color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:none; }
  .phone.land .ph-scr { inset:calc(var(--ph) * .0062); }
  .ui { position:absolute; inset:0; display:flex; flex-direction:column; background:#f5f6f8; }
  .ui.wall { background:radial-gradient(ellipse at 20% 0%, #5b8def, transparent 60%), radial-gradient(ellipse at 90% 100%, #22c55e, transparent 55%), linear-gradient(170deg,#1e3a8a,#1d4ed8 45%,#0f766e); color:#fff; }
  .ui.dark { background:#000; color:#fff; }
  .sbar { position:relative; height:2.1em; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 1.3em; font-weight:800; font-size:.82em; }
  .sb-r { display:flex; align-items:center; gap:.45em; }
  .bat { display:inline-flex; align-items:center; gap:.15em; }
  .bat .bb { position:relative; width:1.9em; height:.95em; border:.13em solid currentColor; border-radius:.25em; padding:.08em; }
  .bat .bb::after { content:""; position:absolute; right:-.3em; top:.22em; width:.15em; height:.35em; background:currentColor; border-radius:0 .1em .1em 0; }
  .bat .bf { height:100%; background:currentColor; border-radius:.1em; }
  .bat .bz { position:absolute; inset:0; display:grid; place-items:center; font-size:.85em; color:#facc15; text-shadow:0 0 2px #000; }
  .app { position:relative; flex:1; min-height:0; overflow:hidden; }
  .nav { height:2.7em; flex-shrink:0; display:flex; justify-content:space-around; align-items:center; }
  .nav button { width:3.2em; height:2.2em; border:0; background:transparent; color:inherit; font-size:1.05em; border-radius:1em; cursor:pointer; opacity:.85; }
  .nav button:hover { background:rgba(127,127,127,.18); }

  /* Pantalla de inicio */
  .home { position:absolute; inset:0; display:flex; flex-direction:column; }
  .pages { flex:1; display:flex; transition:transform .3s ease; }
  .pg { flex:0 0 100%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(5,1fr); padding:.8em .5em .2em; }
  .slot { display:flex; align-items:center; justify-content:center; border-radius:1em; }
  .slot.tgt { background:rgba(255,255,255,.22); }
  .hic { display:flex; flex-direction:column; align-items:center; gap:.3em; width:100%; cursor:pointer; touch-action:none; }
  .hic.lift { opacity:.25; }
  .hic.merge .ai { box-shadow:0 0 0 .25em rgba(255,255,255,.85); transform:scale(1.12); }
  .ai { width:3.1em; height:3.1em; border-radius:.95em; display:grid; place-items:center; font-size:1.55em; box-shadow:0 .15em .4em rgba(0,0,0,.28); transition:transform .15s; }
  .ai.fold { background:rgba(255,255,255,.3); backdrop-filter:blur(6px); display:grid; grid-template-columns:1fr 1fr; gap:.08em; padding:.3em; font-size:.75em; width:4.15em; height:4.15em; }
  .ai.fold i { font-style:normal; display:grid; place-items:center; }
  .al { font-size:.72em; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); text-align:center; line-height:1.15; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 .1em; }
  .al.dark { color:var(--ink); text-shadow:none; }
  .dots { display:flex; justify-content:center; gap:.45em; padding:.4em 0; }
  .dots i { width:.5em; height:.5em; border-radius:50%; background:rgba(255,255,255,.45); }
  .dots i.on { background:#fff; }
  .dock { display:grid; grid-template-columns:repeat(4,1fr); margin:0 .7em .3em; padding:.7em .2em; border-radius:1.6em; background:rgba(255,255,255,.18); }
  .dock .al { display:none; }
  .ghost-ic { position:absolute; z-index:70; pointer-events:none; transform:translate(-50%,-60%) scale(1.15); }
  .edge { position:absolute; top:10%; bottom:20%; width:8%; z-index:60; pointer-events:none; background:linear-gradient(90deg,rgba(255,255,255,.35),transparent); display:none; }
  .edge.r { right:0; transform:scaleX(-1); }
  .edge.on { display:block; }
  .fov { position:absolute; inset:0; z-index:20; background:rgba(15,23,42,.45); backdrop-filter:blur(4px); display:grid; place-items:center; }
  .fbox { width:82%; background:rgba(255,255,255,.95); border-radius:1.6em; padding:1.1em; color:var(--ink); }
  .fname { text-align:center; font-weight:800; font-size:1.15em; padding:.45em; border-radius:.7em; margin-bottom:.7em; background:#eef1f6; cursor:text; }
  .fname.foc { box-shadow:inset 0 0 0 .14em var(--acc); }
  .fgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.8em .3em; }

  /* Pantalla de bloqueo */
  .lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .lk-time { font-size:4.4em; font-weight:300; margin-top:1.2em; letter-spacing:-.02em; font-family:system-ui, sans-serif; }
  .lk-date { font-weight:700; font-size:1.05em; }
  .lk-note { margin-top:1.5em; width:84%; background:rgba(255,255,255,.18); border-radius:1em; padding:.7em .9em; font-size:.85em; font-weight:700; text-shadow:none; }
  .lk-bottom { margin-top:auto; width:100%; display:flex; flex-direction:column; align-items:center; gap:.8em; padding-bottom:1.2em; }
  .lk-hint { text-align:center; font-weight:700; font-size:.9em; cursor:pointer; padding:.4em 1em; border-radius:1em; }
  .lk-hint .up { display:block; font-size:1.6em; line-height:.8; animation:upd 1.4s ease-in-out infinite; }
  @keyframes upd { 50% { transform:translateY(-.25em); } }
  .lk-emerg { border:0; background:rgba(255,255,255,.2); color:#fff; font-weight:800; font-size:.95em; padding:.55em 1.3em; border-radius:2em; cursor:pointer; }
  .lk-emerg:hover { background:rgba(255,255,255,.32); }
  .fp { width:4em; height:4em; border-radius:50%; display:grid; place-items:center; font-size:2.2em; background:rgba(255,255,255,.12); border:.08em solid rgba(255,255,255,.5); cursor:pointer; touch-action:none; }
  .fp.hold { background:rgba(37,211,102,.45); transform:scale(.95); }
  .pinpad { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; color:#fff; padding-top:2em; }
  .pinpad h3, .scr-title { font-weight:800; font-size:1.2em; }
  .pdots { display:flex; gap:.7em; margin:1em 0 1.4em; min-height:1em; }
  .pdots i { width:.8em; height:.8em; border-radius:50%; border:.12em solid currentColor; }
  .pdots i.f { background:currentColor; }
  .pdots.bad { animation:shake .4s; }
  @keyframes shake { 25%{transform:translateX(-.5em);} 75%{transform:translateX(.5em);} }
  .keypad { display:grid; grid-template-columns:repeat(3,4.1em); gap:.7em 1.1em; }
  .kp { width:4.1em; height:4.1em; border-radius:50%; border:0; background:rgba(127,127,127,.2); color:inherit; font-size:1.35em; font-weight:700; cursor:pointer; }
  .kp:hover { background:rgba(127,127,127,.32); }
  .kp small { display:block; font-size:.45em; font-weight:700; opacity:.7; }
  .kp.call { background:#22c55e; color:#fff; }
  .kp.blank { background:transparent; cursor:default; }
  .linkbtn { border:0; background:transparent; color:inherit; font-weight:800; font-size:.95em; padding:.6em 1em; cursor:pointer; opacity:.9; }

  /* Aplicaciones (aspecto común) */
  .ap { position:absolute; inset:0; display:flex; flex-direction:column; background:#f5f6f8; color:var(--ink); }
  .ap-h { flex-shrink:0; display:flex; align-items:center; gap:.6em; padding:.6em 1em .5em; }
  .ap-h h2 { font-size:1.45em; font-weight:800; flex:1; }
  .ap-h .ttl { font-size:1.12em; font-weight:800; flex:1; }
  .ap-h .hb { border:0; background:transparent; font-size:1.05em; font-weight:800; color:var(--acc); cursor:pointer; padding:.3em .5em; border-radius:.6em; }
  .ap-h .hb:disabled { color:#a6aebb; cursor:default; }
  .ap-h .bk { border:0; background:transparent; font-size:1.3em; cursor:pointer; color:var(--ink); padding:0 .2em; }
  .ap-b { flex:1; min-height:0; overflow-y:auto; padding:0 .8em .8em; scrollbar-width:thin; }
  .grp { background:#fff; border-radius:1em; margin-bottom:.7em; overflow:hidden; }
  .row { display:flex; align-items:center; gap:.75em; padding:.75em .9em; border-bottom:1px solid var(--line); cursor:pointer; min-height:3.1em; }
  .row:last-child { border-bottom:0; }
  .row:hover { background:#f3f6fb; }
  .row .ri { width:1.9em; height:1.9em; border-radius:.55em; display:grid; place-items:center; font-size:1.05em; flex-shrink:0; color:#fff; }
  .row .rt { flex:1; min-width:0; font-weight:700; line-height:1.2; }
  .row .rt small { display:block; color:var(--muted); font-weight:600; font-size:.78em; margin-top:.1em; }
  .row .rv { color:var(--muted); font-weight:700; font-size:.85em; }
  .row .chev { color:#a6aebb; font-size:1.2em; }
  .row.dis { opacity:.45; }
  .sw { width:2.6em; height:1.45em; border-radius:1em; background:#c4cad6; position:relative; flex-shrink:0; transition:.2s; }
  .sw::after { content:""; position:absolute; top:.17em; left:.17em; width:1.11em; height:1.11em; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .sw.on { background:var(--acc); } .sw.on::after { left:1.32em; }
  .hint-box { background:#eaf1fe; color:#1e3a8a; border-radius:1em; padding:.7em .9em; font-weight:700; font-size:.85em; line-height:1.4; margin-bottom:.7em; }
  .warn-box { background:#fff4e5; color:#8a4b00; border-radius:1em; padding:.7em .9em; font-weight:700; font-size:.85em; line-height:1.4; margin-bottom:.7em; }
  .fab { position:absolute; right:1em; bottom:1em; width:3.3em; height:3.3em; border-radius:1.1em; border:0; background:var(--acc); color:#fff; font-size:1.6em; font-weight:800; cursor:pointer; box-shadow:0 .3em .8em rgba(37,99,235,.45); line-height:1; }
  .fab.sm { font-size:1.4em; }
  .btnp { display:block; width:100%; border:0; border-radius:2em; padding:.75em; background:var(--acc); color:#fff; font-weight:800; font-size:1em; cursor:pointer; margin-top:.5em; }
  .btnp.sec { background:#e3e8f1; color:var(--ink); }
  .btnp.red { background:#ef4444; }
  .btnp:disabled { opacity:.45; cursor:default; }
  .fld { background:#fff; border:.11em solid #d3d9e3; border-radius:.8em; padding:.7em .8em; font-weight:700; min-height:2.9em; cursor:text; margin-bottom:.15em; word-break:break-all; }
  .fld.foc { border-color:var(--acc); box-shadow:0 0 0 .15em rgba(37,99,235,.18); }
  .fld .ph { color:#9aa3b2; font-weight:600; }
  .flab { font-size:.8em; font-weight:800; color:var(--muted); margin:.7em 0 .3em .3em; }
  .caret { display:inline-block; width:.08em; height:1.05em; background:var(--acc); vertical-align:-.15em; animation:blink 1s step-end infinite; margin-left:.05em; }
  @keyframes blink { 50% { opacity:0; } }
  .seg { display:flex; background:#e6eaf1; border-radius:2em; padding:.25em; margin-bottom:.7em; }
  .seg button { flex:1; border:0; background:transparent; border-radius:2em; padding:.55em .2em; font-weight:800; font-size:.85em; color:var(--muted); cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .sl { padding:.7em .9em; border-bottom:1px solid var(--line); }
  .sl:last-child { border-bottom:0; }
  .sl .slt { display:flex; justify-content:space-between; font-weight:800; }
  .sl small { display:block; color:var(--muted); font-weight:600; font-size:.78em; margin:.1em 0 .3em; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:1.6em; background:transparent; cursor:pointer; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:.45em; border-radius:1em; background:#cfd6e2; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:1.3em; height:1.3em; border-radius:50%; background:var(--acc); margin-top:-.43em; border:.15em solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-track { height:.45em; border-radius:1em; background:#cfd6e2; }
  input[type=range]::-moz-range-thumb { width:1.1em; height:1.1em; border-radius:50%; background:var(--acc); border:.15em solid #fff; }
  .empty { text-align:center; color:var(--muted); font-weight:700; padding:2em 1em; line-height:1.4; }
  .bigic { font-size:3em; text-align:center; margin:1em 0 .3em; }
  .center-msg { text-align:center; font-weight:700; line-height:1.45; padding:0 1.2em; color:var(--muted); }
  .center-msg b { color:var(--ink); }
  .av { width:2.3em; height:2.3em; border-radius:50%; display:grid; place-items:center; font-weight:800; color:#fff; flex-shrink:0; }

  /* Mensajes */
  .bub { max-width:84%; background:#fff; border-radius:1.1em 1.1em 1.1em .3em; padding:.7em .9em; font-weight:600; line-height:1.4; margin:.6em 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .bub .lk { color:var(--acc); text-decoration:underline; word-break:break-all; cursor:pointer; font-weight:700; }
  .bub small { display:block; color:var(--muted); font-size:.75em; margin-top:.3em; }
  .unread { width:.6em; height:.6em; border-radius:50%; background:var(--acc); }
  .fraud { position:absolute; inset:0; background:#b91c1c; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:1.5em; gap:.8em; }
  .fraud .bigic { margin:0; }
  .fraud p { font-weight:700; line-height:1.45; }
  .fraud .btnp { background:#fff; color:#b91c1c; }

  /* Llamada */
  .call { position:absolute; inset:0; background:linear-gradient(170deg,#0f172a,#1e3a8a); color:#fff; display:flex; flex-direction:column; align-items:center; padding:3em 1em 2em; }
  .call.em { background:linear-gradient(170deg,#450a0a,#b91c1c); }
  .call .who { font-size:1.9em; font-weight:800; margin-top:.4em; }
  .call .st { opacity:.85; font-weight:700; margin-top:.3em; }
  .call .sim { margin-top:1.5em; background:rgba(255,255,255,.15); border-radius:1em; padding:.6em 1em; font-size:.82em; font-weight:700; text-align:center; }
  .hang { margin-top:auto; width:4.3em; height:4.3em; border-radius:50%; border:0; background:#ef4444; color:#fff; font-size:1.6em; cursor:pointer; }
  .dial { font-size:2em; font-weight:700; text-align:center; min-height:1.4em; margin:.6em 0 .4em; letter-spacing:.05em; }

  /* Calculadora */
  .calc { position:absolute; inset:0; display:flex; flex-direction:column; background:#fff; }
  .c-disp { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; padding:.6em 1.1em; }
  .c-exp { font-size:1.15em; color:var(--muted); font-weight:700; min-height:1.4em; word-break:break-all; text-align:right; }
  .c-res { font-size:2.6em; font-weight:700; word-break:break-all; text-align:right; line-height:1.15; }
  .c-keys { display:grid; grid-template-columns:repeat(4,1fr); gap:.5em; padding:.6em .8em 1em; }
  .calc.land .c-keys { grid-template-columns:repeat(6,1fr); gap:.35em; padding:.4em .8em .6em; }
  .calc.land .c-disp { padding:.2em 1em; } .calc.land .c-res { font-size:2em; }
  .ck { height:3.6em; border:0; border-radius:1.2em; background:#f1f3f7; font-size:1.25em; font-weight:700; color:var(--ink); cursor:pointer; }
  .calc.land .ck { height:2.2em; font-size:1em; }
  .ck:hover { filter:brightness(.95); }
  .ck.op { color:#f97316; background:#fff2e6; }
  .ck.eq { background:#f97316; color:#fff; }
  .ck.sci { color:var(--acc); background:#eaf1fe; font-size:1em; }
  .ck.cl { color:#ef4444; }
  .ck.nada { visibility:hidden; }

  /* Reloj */
  .rtabs { flex-shrink:0; display:flex; border-top:1px solid var(--line); background:#fff; }
  .rtabs button { flex:1; border:0; background:transparent; padding:.55em 0 .5em; font-weight:800; font-size:.7em; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.15em; }
  .rtabs button span { font-size:1.6em; }
  .rtabs button.on { color:var(--acc); }
  .alrow { display:flex; align-items:center; padding:.8em 1em; background:#fff; border-radius:1em; margin-bottom:.6em; }
  .alrow .t { flex:1; font-size:1.9em; font-weight:600; }
  .alrow .t small { display:block; font-size:.42em; color:var(--muted); font-weight:700; }
  .alrow.off .t { color:#a6aebb; }
  .wheels { display:flex; justify-content:center; align-items:center; gap:.6em; margin:1.2em 0; }
  .wh { display:flex; flex-direction:column; align-items:center; gap:.3em; }
  .wh button { width:3em; height:2.2em; border:0; border-radius:.8em; background:#e6eaf1; font-size:1.2em; font-weight:800; cursor:pointer; color:var(--ink); }
  .wh .v { font-size:3em; font-weight:700; width:1.6em; text-align:center; background:#fff; border-radius:.3em; }
  .wsep { font-size:2.6em; font-weight:700; }
  .bigt { text-align:center; font-size:3.2em; font-weight:600; margin:1.2em 0 .5em; font-variant-numeric:tabular-nums; }
  .btns2 { display:flex; gap:.6em; padding:0 1em; }
  .btns2 .btnp { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:.5em; justify-content:center; margin:.6em 0 1em; }
  .chip { border:0; background:#e6eaf1; border-radius:2em; padding:.5em 1em; font-weight:800; cursor:pointer; color:var(--ink); font-size:.9em; }
  .chip.on { background:var(--acc); color:#fff; }

  /* Cámara */
  .cam { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; color:#fff; }
  .cam-top { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:.5em 1.1em; }
  .cam-top button { border:0; background:transparent; color:#fff; font-size:1.3em; cursor:pointer; padding:.2em .4em; border-radius:.6em; }
  .cam-top .fl.on { color:#facc15; }
  .vf { position:relative; flex:1; min-height:0; overflow:hidden; cursor:crosshair; }
  .scene { position:absolute; inset:0; background:linear-gradient(#7cc4ff,#cfe8ff 55%, #7ac76a 55%, #3f9a45); transition:filter .4s; }
  .scene .sun { position:absolute; top:12%; right:16%; width:3.4em; height:3.4em; border-radius:50%; background:#ffd84d; box-shadow:0 0 2em #ffe58a; }
  .scene .e { position:absolute; line-height:1; }
  .vf.dirty .scene { filter:blur(.28em) saturate(.8); }
  .smudge { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 35% 40%, rgba(255,255,255,.35), transparent 30%), radial-gradient(circle at 65% 60%, rgba(220,220,200,.3), transparent 35%); }
  .focus-sq { position:absolute; width:4.5em; height:4.5em; border:.13em solid #facc15; border-radius:.4em; transform:translate(-50%,-50%); animation:focusIn .6s ease forwards; pointer-events:none; }
  @keyframes focusIn { from{ transform:translate(-50%,-50%) scale(1.5); opacity:0; } 30%{ opacity:1; } to{ transform:translate(-50%,-50%) scale(1); opacity:.9; } }
  .rec { position:absolute; top:.6em; left:50%; transform:translateX(-50%); background:#ef4444; border-radius:1em; padding:.15em .7em; font-weight:800; font-size:.85em; }
  .cam-modes { flex-shrink:0; display:flex; justify-content:center; gap:1.6em; padding:.6em 0 .2em; font-weight:800; font-size:.85em; }
  .cam-modes button { border:0; background:transparent; color:rgba(255,255,255,.6); font-weight:800; cursor:pointer; font-size:1em; padding:.2em .3em; }
  .cam-modes button.on { color:#facc15; }
  .cam-bot { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:.6em 1.6em 1.1em; }
  .shut { width:4.6em; height:4.6em; border-radius:50%; border:.3em solid #fff; background:#fff; background-clip:content-box; padding:.2em; cursor:pointer; }
  .shut.vid { background-color:#ef4444; }
  .shut.recing { background:#ef4444; border-radius:50%; padding:1.1em; background-clip:content-box; }
  .cthumb { width:2.9em; height:2.9em; border-radius:.6em; overflow:hidden; border:.12em solid #fff; cursor:pointer; background:#222; }
  .cflip { width:2.9em; height:2.9em; border-radius:50%; border:0; background:rgba(255,255,255,.18); color:#fff; font-size:1.3em; cursor:pointer; }
  .fx { position:absolute; inset:0; background:#fff; z-index:80; pointer-events:none; opacity:0; }
  .fx.go { animation:fxf .45s ease; }
  @keyframes fxf { 0%{opacity:.95;} 100%{opacity:0;} }

  /* Galería */
  .ggrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.25em; }
  .gt { position:relative; aspect-ratio:1; border-radius:.3em; overflow:hidden; cursor:pointer; touch-action:none; }
  .gt.sel::after { content:"✓"; position:absolute; top:.25em; right:.25em; width:1.4em; height:1.4em; border-radius:50%; background:var(--acc); color:#fff; display:grid; place-items:center; font-weight:900; font-size:.85em; }
  .gt.sel .pic { transform:scale(.86); border-radius:.5em; }
  .gselmode .gt:not(.sel)::after { content:""; position:absolute; top:.25em; right:.25em; width:1.4em; height:1.4em; border-radius:50%; border:.12em solid #fff; background:rgba(0,0,0,.2); }
  .pic { position:absolute; inset:0; display:grid; place-items:center; font-size:2.2em; transition:transform .15s; }
  .pic.blur { filter:blur(.12em); }
  .pic.bright { filter:brightness(1.3); }
  .pic .vb { position:absolute; bottom:.2em; left:.25em; font-size:.42em; background:rgba(0,0,0,.55); color:#fff; border-radius:.5em; padding:.1em .45em; font-weight:800; }
  .gview { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; color:#fff; }
  .gview .big { position:relative; flex:1; margin:.5em 0; }
  .gview .big .pic { font-size:6em; border-radius:0; }
  .gbar { flex-shrink:0; display:flex; justify-content:space-around; padding:.5em 0 .9em; }
  .gbar button { border:0; background:transparent; color:#fff; display:flex; flex-direction:column; align-items:center; gap:.2em; font-weight:700; font-size:.8em; cursor:pointer; padding:.3em .8em; border-radius:.8em; }
  .gbar button span { font-size:1.7em; }
  .gbar button:hover { background:rgba(255,255,255,.12); }
  .gselbar { flex-shrink:0; display:flex; justify-content:center; padding:.6em; background:#fff; border-top:1px solid var(--line); }
  .gselbar button { border:0; background:transparent; font-weight:800; color:#ef4444; font-size:1em; display:flex; align-items:center; gap:.4em; cursor:pointer; padding:.4em 1em; border-radius:1em; }
  .gselbar button:disabled { color:#a6aebb; }

  /* Superposiciones del móvil */
  .qs-bg { position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.35); }
  .qs { position:absolute; left:0; right:0; top:0; z-index:41; background:rgba(28,33,45,.97); color:#fff; border-radius:0 0 1.6em 1.6em; padding:2.4em 1.1em 1em; }
  .qs.in { animation:qsIn .22s ease; }
  @keyframes qsIn { from{ transform:translateY(-100%); } to{ transform:none; } }
  .qs-date { font-weight:700; opacity:.85; margin-bottom:.8em; }
  .qs-tiles { display:grid; grid-template-columns:1fr 1fr; gap:.6em; }
  .tile { border:0; border-radius:1.2em; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; gap:.6em; padding:.8em .9em; font-weight:800; font-size:.9em; cursor:pointer; text-align:left; }
  .tile span { font-size:1.4em; }
  .tile small { display:block; font-weight:600; opacity:.75; font-size:.82em; }
  .tile.on { background:#8ab4ff; color:#0b1d40; }
  .qs-handle { width:3em; height:.3em; border-radius:1em; background:rgba(255,255,255,.4); margin:.9em auto 0; cursor:pointer; }
  .vol { position:absolute; z-index:45; right:.8em; top:16%; background:rgba(255,255,255,.96); color:var(--ink); border-radius:1.6em; box-shadow:0 .4em 1.4em rgba(0,0,0,.35); padding:.6em .5em; display:flex; flex-direction:column; align-items:center; gap:.5em; }
  .vol.in { animation:popIn .15s ease; }
  .vol .vb { width:2.7em; height:2.7em; border-radius:50%; border:0; background:#e6eaf1; font-size:1.2em; cursor:pointer; }
  .vol .vb.on { background:var(--acc); color:#fff; }
  .vbar { position:relative; width:2.7em; height:9em; border-radius:1.4em; background:#e6eaf1; overflow:hidden; }
  .vbar i { position:absolute; left:0; right:0; bottom:0; background:var(--acc); transition:height .15s; }
  .vbar b { position:absolute; left:0; right:0; bottom:.4em; text-align:center; font-size:1em; z-index:1; }
  .volx { position:absolute; z-index:46; left:6%; right:6%; top:14%; background:#fff; color:var(--ink); border-radius:1.4em; box-shadow:0 .4em 1.6em rgba(0,0,0,.4); padding:.8em .9em; animation:popIn .15s ease; }
  .volx h4 { font-size:1em; margin-bottom:.3em; display:flex; justify-content:space-between; align-items:center; }
  .volx .sl { padding:.5em .2em; }
  .dlg-bg { position:absolute; inset:0; z-index:55; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; padding:1em; }
  .dlg { width:100%; background:#fff; color:var(--ink); border-radius:1.4em; padding:1.1em 1.1em .9em; animation:popIn .18s ease; }
  .dlg h4 { font-size:1.1em; margin-bottom:.4em; }
  .dlg p { color:var(--muted); font-weight:600; line-height:1.4; margin-bottom:.8em; }
  .dlg .btns2 { padding:0; }
  .sheet { width:100%; background:#fff; color:var(--ink); border-radius:1.4em; padding:1em; animation:popIn .18s ease; }
  .sheet h4 { margin-bottom:.8em; }
  .sh-apps { display:grid; grid-template-columns:repeat(4,1fr); gap:.6em; }
  .sh-apps button { border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:.3em; font-weight:700; font-size:.75em; cursor:pointer; color:var(--ink); }
  .sh-apps button span { width:2.6em; height:2.6em; border-radius:50%; display:grid; place-items:center; font-size:1.6em; background:#eef1f6; }
  .kbd { position:absolute; left:0; right:0; bottom:0; z-index:50; background:#d7dce4; padding:.4em .25em .6em; display:flex; flex-direction:column; gap:.35em; }
  .kbd.in { animation:qsIn2 .15s ease; }
  @keyframes qsIn2 { from{ transform:translateY(100%); } to{ transform:none; } }
  .kr { display:flex; gap:.25em; justify-content:center; }
  .kk { flex:1; max-width:2.4em; height:2.6em; border:0; border-radius:.45em; background:#fff; font-weight:700; font-size:.95em; color:var(--ink); cursor:pointer; box-shadow:0 .1em 0 rgba(0,0,0,.18); }
  .kk.sp { max-width:none; flex:4; }
  .kk.ok { background:var(--acc); color:#fff; max-width:3.2em; flex:1.4; }
  .kk.w { max-width:3.2em; flex:1.4; background:#bfc6d2; }
  .kbd.num .kk { max-width:none; height:2.9em; font-size:1.15em; }
  .toast { position:absolute; left:50%; bottom:4.2em; z-index:90; transform:translate(-50%,.5em); width:86%; background:rgba(20,26,40,.94); color:#fff; padding:.65em 1em; border-radius:1em; font-weight:700; font-size:.88em; line-height:1.35; text-align:center; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .off { position:absolute; inset:0; z-index:95; background:#000; }
  .frz { position:absolute; inset:0; z-index:94; }
  .boot { position:absolute; inset:0; z-index:96; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6em; font-weight:800; }
  .boot .logo { font-size:1.8em; letter-spacing:.06em; animation:pulseL 1.2s ease-in-out infinite; }
  @keyframes pulseL { 50% { opacity:.4; } }
  .pmenu { position:absolute; inset:0; z-index:58; background:rgba(0,0,0,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8em; }
  .pmenu button { width:70%; border:0; border-radius:1.4em; padding:.9em; background:#fff; color:var(--ink); font-weight:800; font-size:1em; display:flex; align-items:center; gap:.7em; cursor:pointer; }
  .pmenu button span { font-size:1.3em; }
  .alarmfire { position:absolute; inset:0; z-index:57; background:linear-gradient(#1e3a8a,#0f172a); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6em; text-align:center; }
  .alarmfire .bigic { margin:0; animation:ring .3s ease-in-out infinite alternate; }
  @keyframes ring { from{ transform:rotate(-12deg); } to{ transform:rotate(12deg); } }

  /* ---------- Controles del lado del móvil ---------- */
  .tools { display:flex; flex-direction:column; gap:8px; width:205px; }
  .tools h4 { color:var(--sub); font-weight:800; font-size:.82rem; margin:6px 0 0; }
  .kb { padding:9px 12px; border-radius:12px; border:2px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05); color:var(--text); font-weight:800; font-size:.92rem; cursor:pointer; text-align:left; touch-action:none; }
  .kb:hover { border-color:var(--c1); }
  .kb.on { background:rgba(255,217,61,.18); border-color:var(--c3); }
  .kb small { display:block; color:var(--sub); font-weight:700; font-size:.78rem; }
  .holdinfo { min-height:1.2em; color:var(--c3); font-weight:800; font-size:.9rem; }

  /* ---------- Zonas para Descubrir y Practicar ---------- */
  .part { position:relative; cursor:pointer; }
  .part::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transition:background .2s, box-shadow .2s; }
  .part:hover::after { background:color-mix(in srgb,var(--pc) 28%, transparent); }
  .part.psel::after { box-shadow:inset 0 0 0 .22em var(--pc), 0 0 1.2em var(--pc); background:color-mix(in srgb,var(--pc) 20%, transparent); }
  .part.ok::after { box-shadow:inset 0 0 0 .22em var(--c1); background:rgba(37,211,102,.25); }
  .part.bad { animation:shake .45s; }
  .part.bad::after { box-shadow:inset 0 0 0 .22em var(--c4); }
  .pin { position:absolute; z-index:8; width:1.9em; height:1.9em; border-radius:50%; background:var(--pc); color:#0a1628; font-weight:900; display:grid; place-items:center; font-size:.9em; box-shadow:0 2px 8px rgba(0,0,0,.5); animation:pulse 1.8s ease-in-out infinite; pointer-events:none; top:-.5em; right:-.4em; text-shadow:none; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .part.found > .pin { animation:none; }
  .mode-practica .pin { display:none; }
  .sb.part { position:absolute; display:block; width:calc(var(--ph) * .016); right:calc(var(--ph) * -.012); }
  #st-parts { padding-right:34px; }
  .sb.part::after { inset:-6px; border-radius:6px; }
  .sb .pin { font-size:15px; width:28px; height:28px; top:50%; right:-38px; margin-top:-14px; }

  /* ---------- Panel ---------- */
  .hello { text-align:center; padding:2vh 0; animation:popIn .4s ease; }
  .hello .big { font-size:3.2rem; }
  .hello h2 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.8rem; margin:8px 0 10px; }
  .hello p { color:var(--sub); font-weight:700; line-height:1.5; font-size:1.05rem; }
  .hello p b { color:var(--c3); }
  .pnum { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#0a1628; font-weight:800; font-size:1.3rem; margin-bottom:10px; }
  .panel h2.pn { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.7rem; line-height:1.15; margin-bottom:6px; }
  .sitio { color:var(--sub); font-weight:700; margin-bottom:12px; }
  .panel p.tx { font-size:1.1rem; line-height:1.55; font-weight:600; margin-bottom:14px; }
  .panel p.tx b, .last b, .guia b { color:var(--c3); }
  .pchips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .pchip { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:100px; padding:6px 13px; font-weight:800; font-size:.95rem; }
  .tip { background:rgba(255,217,61,.09); border:1px solid rgba(255,217,61,.3); border-radius:14px; padding:12px 14px; font-weight:700; line-height:1.5; }
  .win-all { background:rgba(37,211,102,.14); border:2px solid var(--c1); border-radius:14px; padding:10px 14px; font-weight:800; margin-bottom:12px; text-align:center; }
  .ph3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.15rem; color:var(--c3); margin:4px 0 8px; }
  .ph3 small { font-family:'Nunito',sans-serif; color:var(--sub); font-weight:700; font-size:.82rem; }
  .last { background:rgba(255,255,255,.05); border-radius:14px; padding:12px 14px; font-weight:600; line-height:1.5; font-size:1.02rem; margin-bottom:14px; }
  .last .gotit { display:block; color:#9cffc4; font-weight:800; margin-bottom:4px; }
  .st { border:1px solid rgba(255,255,255,.09); border-radius:14px; margin-bottom:7px; overflow:hidden; background:rgba(255,255,255,.03); }
  .st.open { border-color:rgba(37,211,102,.45); background:rgba(37,211,102,.05); }
  .sth { width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border:0; background:transparent; color:var(--text); cursor:pointer; text-align:left; font-size:1rem; }
  .sth .ic { font-size:1.35rem; width:1.6em; text-align:center; }
  .sth b { flex:1; font-weight:800; }
  .sth .cnt { font-weight:800; color:var(--sub); font-size:.88rem; background:rgba(255,255,255,.07); border-radius:20px; padding:2px 9px; }
  .st.done .cnt { background:var(--c1); color:#0a1628; }
  .stb { padding:0 12px 12px; }
  .guia { color:#cfd8ea; font-weight:600; line-height:1.5; font-size:.95rem; margin-bottom:10px; padding:8px 11px; border-left:3px solid var(--c6); background:rgba(77,163,255,.06); border-radius:0 10px 10px 0; }
  .retos { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .retos li { display:flex; gap:10px; align-items:flex-start; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px 11px; }
  .retos .rb { width:24px; height:24px; flex-shrink:0; border-radius:7px; background:rgba(255,255,255,.08); display:grid; place-items:center; font-weight:900; color:#0a1628; }
  .retos li.on { border-color:rgba(37,211,102,.55); background:rgba(37,211,102,.08); }
  .retos li.on .rb { background:var(--c1); }
  .retos .rtx { font-weight:800; line-height:1.3; }
  .retos .rtx small { display:block; color:var(--sub); font-weight:700; font-size:.86rem; margin-top:2px; }
  .retos li.on .rtx { color:var(--sub); }
  .qn { color:var(--sub); font-weight:800; margin-bottom:6px; }
  .qt { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.5rem; line-height:1.25; margin-bottom:12px; }
  .qvis { display:flex; justify-content:center; align-items:center; margin:4px 0 14px; }
  .qvis .sym { width:96px; height:96px; border-radius:22px; background:#1f2a44; display:grid; place-items:center; font-size:56px; color:#fff; }
  .qvis .msg { background:#fff; color:var(--ink); border-radius:16px 16px 16px 4px; padding:12px 14px; font-weight:700; line-height:1.4; max-width:92%; }
  .qvis .msg u { color:var(--acc); }
  .qhint { color:var(--c3); font-weight:800; margin-bottom:12px; font-size:1.05rem; }
  .opts { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .qo { text-align:left; padding:12px 16px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:var(--text); font-weight:800; font-size:1.05rem; cursor:pointer; }
  .qo:hover:not(:disabled) { border-color:var(--c6); }
  .qo.ok { border-color:var(--c1); background:rgba(37,211,102,.15); }
  .qo.bad { border-color:var(--c4); background:rgba(255,107,107,.12); }
  .qo:disabled { cursor:default; }

  if (X.folderOpen){ cerrarCarpeta(); return; }
  if (X.locked){ if (['pinpad', 'emerg'].includes(X.view.v)){ X.view = {v:'lock'}; X.edial = ''; render(); } return; }

  if (X.view.v === 'galeria' && X.gview){ X.gview = null; render(); return; }
  if (X.stack.length){ const v = X.stack.pop(); salirDe(X.view, v); X.view = v; render(); }
  else if (X.view.v !== 'home'){ salirDe(X.view, {v:'home'}); X.view = {v:'home'}; render(); }
}
function abrirApp(k, desdeDock){

    play:{v:'gapp', app:'play'}, gmail:{v:'gapp', app:'gmail'}, youtube:{v:'gapp', app:'youtube'}, drive:{v:'gapp', app:'drive'}}[k] || {v:'otra', app:k};
  X.folderOpen = null;

/* ---- Calculadora ---- */
function vCalc(){
  const L = X.rot, c = X.calc;
  const base = [['C', 'cl'], ['⌫', 'cl'], ['%', 'op'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['00'], ['0'], [','], ['=', 'eq']];
  const sci = [['√', 'sci'], ['x²', 'sci'], ['π', 'sci'], ['(', 'sci'], [')', 'sci'], ['xʸ', 'sci'], ['1/x', 'sci'], ['!', 'sci']];
  let keys;
  if (L){
    keys = [];
    for (let r = 0; r < 5; r++){ keys.push(...(sci.slice(r * 2, r * 2 + 2).length ? sci.slice(r * 2, r * 2 + 2) : [['', 'sci'], ['', 'sci']]).slice(0, 2)); keys.push(...[...base.slice(r * 4, r * 4 + 4)]); }
    keys = keys.map(k => k[0] === '' ? ['·', 'nada'] : k);
  } else keys = base;
  return '<div class="calc' + (L ? ' land' : '') + '"><div class="c-disp"><div class="c-exp" id="cexp">' + esc(fmt(c.exp)) + '</div><div class="c-res" id="cres">' + esc(c.res !== '' ? c.res : (fmt(c.exp) || '0')) + '</div></div>' +
    '<div class="c-keys">' + keys.map(([k, cl]) => '<button class="ck ' + (cl || '') + '" data-a="ck" data-v="' + k + '" type="button">' + k + '</button>').join('') + '</div></div>';
}
const fmt = s => s.replace(/\./g, ',');
function calcKey(k){
  const c = X.calc;
  if (k === '·') return;
  if (k === 'C'){ c.exp = ''; c.res = ''; c.done = false; }
  else if (k === '⌫'){ if (c.done){ c.done = false; c.res = ''; } c.exp = c.exp.slice(0, -1); }
  else if (k === '='){
    if (!c.exp) return;
    try {
      const r = evaluar(c.exp);
      if (!isFinite(r)) throw new Error();
      c.res = '= ' + fmt(String(+r.toPrecision(12)));
      const hasSum = /\+/.test(c.exp), hasMD = /[×÷]/.test(c.exp);
      if (hasSum) tick('suma');
      if (hasMD) tick('multdiv');
      explicar('Has calculado <b>' + esc(fmt(c.exp)) + ' ' + esc(c.res) + '</b>.' + (X.rot ? '' : ' Para raíces y potencias, gira el móvil con «🔄 Girar el móvil».'), '--c6');
      c.done = true;
    } catch(e){ c.res = 'Error'; c.done = true; }
  } else {
    let add = {',':'.', 'x²':'²', 'xʸ':'^', '1/x':'1÷', '00':'00'}[k] || k;
    if (c.done){ c.exp = /[+−×÷^%²!]/.test(add[0]) && c.res && c.res !== 'Error' ? c.res.replace('= ', '').replace(/,/g, '.') : ''; c.res = ''; c.done = false; }
    if (/^[+×÷^%²!]$/.test(add) && (!c.exp || /[+−×÷^(]$/.test(c.exp))) return;
    if (/^[+−×÷^]$/.test(add) && /[+−×÷^]$/.test(c.exp)) c.exp = c.exp.slice(0, -1);
    c.exp += add;
  }
  renderCalcDisp();
}
function renderCalcDisp(){ const e = $('cexp'), r = $('cres'); if (!e) return render(); e.textContent = fmt(X.calc.exp); r.textContent = X.calc.res !== '' ? X.calc.res : (fmt(X.calc.exp) || '0'); }
function evaluar(s){
  let i = 0;
  const peek = () => s[i];
  function num(){ let j = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; if (j === i) throw new Error('n'); return parseFloat(s.slice(j, i)); }
  function primario(){
    if (peek() === '('){ i++; const v = suma(); if (peek() === ')') i++; return v; }
    if (peek() === 'π'){ i++; return Math.PI; }
    return num();
  }
  function postfijo(){
    let v = primario();
    for (;;){
      if (peek() === '²'){ i++; v = v * v; }
      else if (peek() === '%'){ i++; v = v / 100; }
      else if (peek() === '!'){ i++; if (v < 0 || v > 170 || v % 1) throw new Error('f'); let f = 1; for (let k = 2; k <= v; k++) f *= k; v = f; }
      else break;
    }
    return v;
  }
  function unario(){
    if (peek() === '−'){ i++; return -unario(); }
    if (peek() === '√'){ i++; const v = unario(); if (v < 0) throw new Error('r'); return Math.sqrt(v); }
    const b = postfijo();
    if (peek() === '^'){ i++; return Math.pow(b, unario()); }
    return b;
  }
  function producto(){ let v = unario(); for (;;){ if (peek() === '×'){ i++; v *= unario(); } else if (peek() === '÷'){ i++; const d = unario(); v /= d; } else if (peek() === '(' || peek() === '√' || peek() === 'π'){ v *= unario(); } else break; } return v; }
  function suma(){ let v = producto(); for (;;){ if (peek() === '+'){ i++; v += producto(); } else if (peek() === '−'){ i++; v -= producto(); } else break; } return v; }
  const v = suma();
  if (i < s.length) throw new Error('x');
  return v;
}

function popTo(s){ while (X.stack.length && !(X.stack[X.stack.length - 1].v === 'ajustes' && X.stack[X.stack.length - 1].s === s)) X.stack.pop(); }
function cerrarCarpeta(){ if (X.kb && X.kb.f === 'fName') confirmarCampo(); X.folderOpen = null; X.kb = null; render(); }
function enfocar(k){
  const num = ['cTel'].includes(k);
  if (k === 'fName'){ const f = X.folders[X.folderOpen]; X.form.fName = f.name === 'Nueva carpeta' ? '' : f.name; }
  X.kb = {f:k, num, up:!num && !(X.form[k] || '').length && !['gMail', 'gPass'].includes(k)};
  render();
}
function cerrarTeclado(){ confirmarCampo(); X.kb = null; render(); }
function confirmarCampo(){
  if (!X.kb) return;
  if (X.kb.f === 'fName' && X.folderOpen){
    const f = X.folders[X.folderOpen], v = (X.form.fName || '').trim();
    if (v && v !== f.name){ f.name = v; tick('nombre'); explicar('Has llamado a la carpeta <b>«' + esc(v) + '»</b>. El nombre aparece debajo del icono en la pantalla de inicio.', '--c8'); }
  }
}
function tecla(k){
  const kb = X.kb; if (!kb) return;
  const f = kb.f, max = {cTel:15, gPass:20}[f] || 32;
  let v = X.form[f] || '';
  if (k === '✓'){ cerrarTeclado(); return; }
  if (k === '⌫') v = v.slice(0, -1);
  else if (k === '⇧'){ kb.up = !kb.up; render(); return; }
  else if (v.length < max){
    let ch = k === 'espacio' ? ' ' : k;
    if (kb.up && ch.length === 1){ ch = ch.toUpperCase(); kb.up = false; }
    if (f === 'cTel' && !/[0-9 +]/.test(ch)) return;
    v += ch;
  }
  X.form[f] = v;
  render();
}

/* =========================================================
   Gestos: pulsaciones, arrastres y deslizamientos
   ========================================================= */
const scr = $('scr');
let G = null, gTimer = null, edgeTimer = null;
function scrRect(){ return scr.getBoundingClientRect(); }
function capt(e){ try { scr.setPointerCapture(e.pointerId); } catch(_){} }

scr.addEventListener('click', e => {
  if (X.frozen || X.off || X.booting) return;
  if (G && G.used) return;
  const t = e.target.closest('[data-a]');
  if (t && ACT[t.dataset.a]){ e.preventDefault(); ACT[t.dataset.a](t.dataset.v, t, e); return; }
  const vf = e.target.closest('#vf');
  if (vf){
    const r = vf.getBoundingClientRect();
    X.focus = {x:(e.clientX - r.left) / r.width * 100, y:(e.clientY - r.top) / r.height * 100};
    tick('enfoque'); explicar('Has <b>enfocado</b> tocando la pantalla: el recuadro amarillo marca el punto que saldrá nítido.', '--c3');
    render();
  }
});
scr.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.vol; if (!k) return;
  X.vols[k] = +e.target.value;
  const lab = $('vv-' + k); if (lab) lab.textContent = X.vols[k];
  if (X.vol) X.vol.until = Date.now() + 8000;
  if (k === 'alarma'){ tick('volAlarma'); explicar('Has cambiado el <b>volumen de la alarma</b> (' + X.vols.alarma + ') sin tocar el de la música. Cada tipo de sonido tiene su propio volumen.', '--c3'); renderPanel(); }
});

scr.addEventListener('pointerdown', e => {
  if (X.frozen || X.off || X.booting || e.button !== 0) return;
  const t = e.target;
  G = {x:e.clientX, y:e.clientY, t0:Date.now(), mov:false, used:false, tgt:t};
  // Barra superior: ajustes rápidos
  if (t.closest('#sbar')){ G.kind = 'sbar'; capt(e); return; }
  // Pantalla de bloqueo
  if (X.view.v === 'lock' && !X.qs){
    const fp = t.closest('#fp');
    if (fp){ G.kind = 'fp'; fp.classList.add('hold'); gTimer = setTimeout(() => { G.used = true; desbloquear('huella'); }, 650); return; }
    if (t.closest('#lockarea') && !t.closest('[data-a="emerg"]')){ G.kind = 'lockswipe'; capt(e); return; }
  }
  // Registrar la huella
  const fpe = t.closest('#fpe');
  if (fpe){ G.kind = 'fpe'; fpe.classList.add('hold'); gTimer = setTimeout(() => {
      G.used = true; X.enroll++;
      if (X.enroll >= 3){ X.lockType = 'huella'; X.huellaPend = false; tick('clave'); explicar('Has registrado tu <b>huella</b>. Ahora el móvil se desbloquea poniendo el dedo en el sensor (y, si falla, con el PIN).', '--c1'); popTo('main'); X.view = {v:'ajustes', s:'seg'}; }
      render();
    }, 500); return; }
  // Galería: pulsación larga
  const gt = t.closest('.gt');
  if (gt && X.view.v === 'galeria'){ G.kind = 'gt'; G.pid = +gt.dataset.pid; gTimer = setTimeout(() => { G.used = true; if (!X.gsel){ X.gsel = new Set([G.pid]); explicar('Modo selección: <b>toca las demás fotos</b> que quieras borrar y luego la papelera.', '--c4'); render(); } }, 500); return; }
  // Pantalla de inicio
  if (X.view.v === 'home' && !X.folderOpen && !X.qs && !X.kb && t.closest('#home')){
    const hic = t.closest('.hic');
    G.kind = 'home'; capt(e);
    if (hic){
      const slot = hic.closest('.slot');
      G.k = hic.dataset.k; G.dock = !!slot.dataset.dock; G.slot = slot.dataset.slot;
      gTimer = setTimeout(() => { if (!G || G.mov) return; G.used = true; if (G.dock){ toast('Los iconos de abajo se quedan fijos: así están en todas las pantallas.'); return; } empezarArrastre(e); }, 480);
    }
  }
});
scr.addEventListener('pointermove', e => {
  if (!G) return;
  const dx = e.clientX - G.x, dy = e.clientY - G.y;
  if (!G.mov && Math.hypot(dx, dy) > 10){ G.mov = true; if (!G.drag) clearTimeout(gTimer); }
  if (G.kind === 'home' && G.drag) moverArrastre(e);
});
scr.addEventListener('pointerup', e => {
  clearTimeout(gTimer);
  if (!G) return;
  const g = G, dx = e.clientX - g.x, dy = e.clientY - g.y;
  document.querySelectorAll('.fp.hold').forEach(f => f.classList.remove('hold'));
  setTimeout(() => { if (G === g) G = null; }, 0);
  if (g.kind === 'sbar'){ if (!X.qs && (dy > 15 || !g.mov)){ X.qs = true; X.vol = null; render(); } return; }
  if (g.kind === 'lockswipe'){ if ((dy < -50 && Math.abs(dy) > Math.abs(dx)) || (!g.mov && g.tgt.closest('[data-a="unlockTry"]'))){ g.used = true; intentoDesbloqueo(); } return; }
  if (g.kind === 'gt'){
    if (g.used || g.mov) return;
    g.used = true;
    if (X.gsel){ X.gsel.has(g.pid) ? X.gsel.delete(g.pid) : X.gsel.add(g.pid); render(); }
    else { X.gview = g.pid; render(); }
    return;
  }
  if (g.kind === 'home'){
    if (g.drag){ g.used = true; soltarArrastre(e); return; }
    if (g.used) return;
    if (g.mov && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ g.used = true; cambiarPagina(dx < 0 ? 1 : -1); return; }
    if (g.mov && dy > 50 && g.y - scrRect().top < scrRect().height * .35){ g.used = true; X.qs = true; render(); return; }
    if (!g.mov && g.k){ g.used = true; abrirApp(g.k, g.dock); }
  }
});
scr.addEventListener('pointercancel', () => { clearTimeout(gTimer); if (G && G.drag) cancelarArrastre(); G = null; });

function cambiarPagina(d){
  const n = Math.max(0, Math.min(X.pages.length - 1, X.page + d));
  if (n === X.page) return;
  X.page = n;
  if (n === 1){ tick('pagina2'); explicar('Estás en la <b>segunda pantalla</b> de inicio. Fíjate: los iconos de abajo (<b>Teléfono, Mensajes, Internet y Cámara</b>) siguen ahí. Desliza a la derecha para volver.', '--c1'); }
  render();
}

/* Arrastrar iconos */
function empezarArrastre(e){
  const [p, i] = G.slot.split(':').map(Number);
  G.drag = {p, i, k:G.k};
  const el = document.querySelector('#home .slot[data-slot="' + G.slot + '"] .hic');
  if (el) el.classList.add('lift');
  const gh = document.createElement('div'); gh.className = 'ghost-ic'; gh.id = 'ghost';
  gh.innerHTML = el ? el.innerHTML : '';
  scr.appendChild(gh);
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
  explicar('El icono está <b>destacado</b>. Sin soltar, llévalo <b>sobre otro icono</b> para crear una carpeta, a un <b>hueco</b> para moverlo, o hasta el <b>borde</b> para cambiar de pantalla.', '--c8');
  renderPanel();
  moverArrastre(e);
}
function moverArrastre(e){
  const r = scrRect(), gh = $('ghost');
  if (gh){ gh.style.left = (e.clientX - r.left) + 'px'; gh.style.top = (e.clientY - r.top) + 'px'; }
  document.querySelectorAll('#home .merge, #home .tgt').forEach(x => x.classList.remove('merge', 'tgt'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest('#home .slot[data-slot]');
  G.target = null;
  if (slot && slot.dataset.slot !== G.drag.p + ':' + G.drag.i){
    const [p, i] = slot.dataset.slot.split(':').map(Number);
    if (p === X.page){ G.target = {p, i}; const h = slot.querySelector('.hic'); if (h) h.classList.add('merge'); else slot.classList.add('tgt'); }
  }
  const x = (e.clientX - r.left) / r.width;
  const dir = x < .09 ? -1 : x > .91 ? 1 : 0;
  $('edge-l') && $('edge-l').classList.toggle('on', dir === -1 && X.page > 0);
  $('edge-r') && $('edge-r').classList.toggle('on', dir === 1 && X.page < X.pages.length - 1);
  if (dir !== (G.edgeDir || 0)){
    clearTimeout(edgeTimer); G.edgeDir = dir;
    if (dir) edgeTimer = setTimeout(() => {
      const n = X.page + dir;
      if (n < 0 || n >= X.pages.length) return;
      X.page = n; G.edgeDir = 0;
      const gh = $('ghost'); const keep = gh ? gh.outerHTML : '';
      render(); if (keep && !$('ghost')) scr.insertAdjacentHTML('beforeend', keep);
      const src = document.querySelector('#home .slot[data-slot="' + G.drag.p + ':' + G.drag.i + '"] .hic'); if (src) src.classList.add('lift');
    }, 650);
  }
}
function quitarFantasma(){ const gh = $('ghost'); if (gh) gh.remove(); clearTimeout(edgeTimer); }
function cancelarArrastre(){ quitarFantasma(); render(); }
function soltarArrastre(){
  quitarFantasma();
  const s = G.drag, t = G.target;
  if (!t){ render(); return; }
  const tk = X.pages[t.p][t.i];
  if (!tk){
    X.pages[s.p][s.i] = null; X.pages[t.p][t.i] = s.k;
    if (t.p !== s.p){ tick('moverPant'); explicar('Has llevado <b>' + nombreK(s.k) + '</b> a la <b>pantalla ' + (t.p + 1) + '</b>: mantener pulsado, deslizar hasta el borde y soltar en la pantalla que quieres.', '--c8'); }
    else explicar('Has movido <b>' + nombreK(s.k) + '</b> a otro hueco de la misma pantalla.', '--c8');
  } else if (tk.startsWith('f:')){
    if (s.k.startsWith('f:')){ toast('No se puede meter una carpeta dentro de otra.'); render(); return; }
    X.folders[tk].apps.push(s.k); X.pages[s.p][s.i] = null;
    explicar('Has metido <b>' + APPS[s.k].n + '</b> en la carpeta «' + esc(X.folders[tk].name) + '».', '--c8');
  } else {
    if (s.k.startsWith('f:')){ toast('Suelta la carpeta en un hueco libre.'); render(); return; }
    const id = 'f:' + (++fid);
    X.folders[id] = {name:'Nueva carpeta', apps:[tk, s.k]};
    X.pages[t.p][t.i] = id; X.pages[s.p][s.i] = null;
    tick('carpeta'); explicar('Has creado una <b>carpeta</b> con <b>' + APPS[tk].n + '</b> y <b>' + APPS[s.k].n + '</b>. Ábrela y toca <b>«Nueva carpeta»</b> para ponerle nombre.', '--c8');
  }
  render();
}
const nombreK = k => k.startsWith('f:') ? 'la carpeta «' + esc(X.folders[k].name) + '»' : APPS[k].n;

/* Vídeo */
function pararVideo(){
  const d = Math.max(1, Math.round((Date.now() - X.rec.t0) / 1000));

}

let pwT0 = 0, pwTimer = null, pwInt = null, pwLong = false;
function pwDown(btn){
  if (X.booting) return;
  pwT0 = Date.now(); pwLong = false;
  if (btn) btn.classList.add('down');
  $('hw-pw').classList.add('down');
  clearInterval(pwInt);
  pwInt = setInterval(() => {
    const s = (Date.now() - pwT0) / 1000;
    $('holdinfo').textContent = s >= .6 ? '⏳ Manteniendo pulsado… ' + s.toFixed(1).replace('.', ',') + ' s' : '';
    if (!pwLong && s >= 1.2 && !X.frozen && !X.off){ pwLong = true; X.pmenu = true; render(); }
    if (X.frozen && s >= 3){ pwLong = true; pwUp(); reiniciar(true); }
  }, 100);
}
function pwUp(){
  if (!pwT0) return;
  const d = Date.now() - pwT0; pwT0 = 0;
  clearInterval(pwInt); $('holdinfo').textContent = '';
  document.querySelectorAll('.down').forEach(b => b.classList.remove('down'));
  if (pwLong) return;
  if (X.frozen){ if (d < 3000) toast('El móvil no responde. <b>Mantén pulsado</b> el botón de encendido varios segundos.'); return; }
  if (d < 1200) encendido();
}
[['hw-pw', null], ['t-pw', 't-pw']].forEach(([id]) => {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} pwDown(b); });
  b.addEventListener('pointerup', pwUp);
  b.addEventListener('pointercancel', pwUp);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('hw-up').onclick = () => volumen(1); $('hw-dn').onclick = () => volumen(-1);

/* Teclado de verdad */
document.addEventListener('keydown', e => {
  if (modo !== 'live' || X.frozen || X.off || X.booting) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (X.kb){
    if (k === 'Enter'){ e.preventDefault(); tecla('✓'); return; }
    if (k === 'Backspace'){ e.preventDefault(); tecla('⌫'); return; }
    if (k === ' '){ e.preventDefault(); tecla('espacio'); return; }
    if (k.length === 1){ e.preventDefault(); const up = X.kb.up; X.kb.up = false; tecla(up ? k.toUpperCase() : k); return; }
    return;
  }
  const v = X.view.v, dig = /^[0-9]$/.test(k);
  const map = {pinpad:'pinkey', emerg:'edig', telefono:'tdig'};
  if (map[v] && (dig || k === 'Backspace')){ e.preventDefault(); ACT[map[v]](dig ? k : '⌫'); return; }
  if (v === 'ajustes' && (X.view.s === 'pin1' || X.view.s === 'pin2') && (dig || k === 'Backspace' || k === 'Enter')){ e.preventDefault(); if (k === 'Enter') ACT.pinNext(); else ACT.pind(dig ? k : '⌫'); return; }
  if (v === 'calc'){
    const m = {'+':'+', '-':'−', '*':'×', '/':'÷', 'Enter':'=', '=':'=', 'Backspace':'⌫', 'Escape':'C', ',':',', '.':',', '%':'%', '(':'(', ')':')'}[k] || (dig ? k : null);
    if (m){ e.preventDefault(); calcKey(m); }
    return;
  }
  if (k === 'Escape'){ atras(); }
});

    chips:['👆 Mantener pulsado', '🫳 Arrastrar sobre otro', '✏️ Tocar «Nueva carpeta»'], tip:'Para ponerle nombre, ábrela y toca donde dice «Nueva carpeta».'},
  ajustes:{n:6, color:'--c9', nombre:'Ajustes', det:'Ajustes', sitio:'El icono del engranaje.',
    texto:'Desde aquí se configura el móvil: <b>Sonido y vibración</b>, <b>Seguridad</b> (la clave de acceso) y <b>Cuentas</b> (la cuenta de Google).',
    chips:['🔊 Sonido', '🔒 Seguridad', '👤 Cuentas'], tip:'A veces se llama «Configuración». Su icono suele ser un engranaje.'},
  volumen:{n:7, color:'--c5', nombre:'Botones de volumen', det:'los botones de volumen', sitio:'En el lateral derecho, los dos de arriba.',
    texto:'Suben y bajan el volumen. Al pulsarlos aparece una <b>barra</b> en la pantalla con una <b>campanilla</b> para silenciar y <b>tres puntos</b> para separar el volumen de la música y el de las alarmas.',
    chips:['🔊 Subir', '🔉 Bajar', '🔔 Silenciar', '⋯ Más opciones'], tip:'En Ajustes › Sonido y vibración se ajustan los volúmenes de llamadas, medios, notificaciones y alarma.'},
  encendido:{n:8, color:'--c4', nombre:'Botón de encendido', det:'el botón de encendido', sitio:'En el lateral derecho, debajo de los de volumen.',
    texto:'Un toque <b>bloquea</b> el móvil y apaga la pantalla; otro la vuelve a encender. Si el móvil <b>no responde</b>, mantenlo pulsado <b>varios segundos</b> hasta que se reinicie.',
    chips:['👆 Un toque: bloquear', '⏳ Mantener: reiniciar'], tip:'En la pantalla de bloqueo, el botón «Emergencia» permite llamar al 112 sin desbloquear.'}
};
const ORDEN = Object.keys(PARTES);
(function construirSc1(){
  $('sc1-icons').innerHTML = IC.bt + IC.wifi + IC.sig + batHTML(78, true);
  const apps = ['contactos', 'calc', 'reloj', 'galeria', 'play', 'gmail', 'youtube', 'drive'];
  let g = '<div class="slot part" data-part="ajustes" style="border-radius:1em"><span class="pin">?</span><div class="hic"><span class="ai" style="background:' + APPS.ajustes.bg + '">⚙️</span><span class="al">Ajustes</span></div></div>';
  g += apps.map(k => '<div class="slot"><div class="hic"><span class="ai" style="background:' + APPS[k].bg + '">' + APPS[k].ic + '</span><span class="al">' + APPS[k].n + '</span></div></div>').join('');
  g += '<div class="slot part" data-part="carpeta" style="border-radius:1em"><span class="pin">?</span><div class="hic"><span class="ai fold"><i>📝</i><i>📅</i><i>⛅</i><i>🗺️</i></span><span class="al">Utilidades</span></div></div>';
  for (let i = 0; i < 10; i++) g += '<div class="slot"></div>';
  $('sc1-grid').innerHTML = g;
  $('sc1-dock').insertAdjacentHTML('beforeend', ['telefono', 'mensajes', 'internet', 'camara'].map(k => '<div class="slot"><div class="hic"><span class="ai" style="background:' + APPS[k].bg + '">' + APPS[k].ic + '</span></div></div>').join(''));
})();
const parts = k => document.querySelectorAll('#ph1 .part[data-part="' + k + '"]');
document.querySelectorAll('#ph1 .part').forEach(p => p.style.setProperty('--pc', 'var(' + PARTES[p.dataset.part].color + ')'));
function limpiar(){ document.querySelectorAll('#ph1 .part').forEach(p => p.classList.remove('psel', 'ok', 'bad')); }
function pintarPins(){
  document.querySelectorAll('#ph1 .part').forEach(p => {
    const k = p.dataset.part, pin = p.querySelector(':scope > .pin');
    p.classList.toggle('found', !!found[k]);
    if (pin) pin.textContent = found[k] ? PARTES[k].n : '?';
  });
}
function bienvenida(){
  info.style.setProperty('--ic', 'var(--c1)');
  const n = ORDEN.filter(k => found[k]).length;
  info.innerHTML = '<div class="hello"><div class="big">👆</div><h2>Toca una parte del móvil</h2><p>Hay <b>' + ORDEN.length + ' partes</b> con un <b>?</b>, también en el <b>lateral</b> del móvil.' +
    (n ? '<br>Ya has descubierto <b>' + n + '</b>.' : '<br>Vamos a descubrirlas juntos.') + '</p></div>';
  restart(info);
}
function mostrar(k){
  found[k] = true; guardar(); limpiar();
  parts(k).forEach(p => p.classList.add('psel'));
  const P = PARTES[k], todas = ORDEN.every(x => found[x]);
  info.style.setProperty('--ic', 'var(' + P.color + ')');
  info.innerHTML = (todas ? '<div class="win-all">🏆 ¡Has descubierto las ' + ORDEN.length + ' partes! Ahora pasa a «🛠️ Probar».</div>' : '') +
    '<div class="pnum" style="background:var(' + P.color + ')">' + P.n + '</div><h2 class="pn">' + P.nombre + '</h2><div class="sitio">📍 ' + P.sitio + '</div><p class="tx">' + P.texto + '</p>' +
    (P.sym ? '<div class="symrow">' + P.sym.map(([s, t]) => '<div class="s">' + s + '</div><div>' + t + '</div>').join('') + '</div>' : '') +
    (P.chips ? '<div class="pchips">' + P.chips.map(c => '<span class="pchip">' + c + '</span>').join('') + '</div>' : '') +
    '<div class="tip">💡 ' + P.tip + '</div>';
  restart(info); pintarPins(); progreso();
}

/* =========================================================
   PRACTICAR
   ========================================================= */
const BIGSYM = {
  bt:'<div class="sym">' + IC.bt + '</div>', avion:'<div class="sym">✈</div>', sig:'<div class="sym">' + IC.sig + '</div>',
  bat:'<div class="sym" style="font-size:40px">' + batHTML(40, true) + '</div>', share:'<div class="sym">' + IC.share + '</div>',
  msg:'<div class="msg">¡Enhorabuena! Has ganado un premio. <u>Pulsa aquí para recogerlo</u>.</div>'
};
const TOCA = [
  {k:'toca', part:'volumen', q:'¿Con qué botones subes y bajas el volumen?', e:'Al pulsarlos aparece la barra de volumen.'},
  {k:'toca', part:'encendido', q:'El móvil se ha quedado colgado. ¿Qué botón mantienes pulsado varios segundos?', e:'Así se reinicia.'},
  {k:'toca', part:'dock', q:'¿Dónde están los iconos que se repiten en todas las pantallas?', e:'Teléfono, Mensajes, Internet y Cámara.'},
  {k:'toca', part:'barra', q:'¿Dónde miras si el móvil se está cargando?', e:'La batería de la barra superior tiene un rayo.'},
  {k:'toca', part:'carpeta', q:'¿Cuál de estos iconos es una carpeta?', e:'Lleva dentro varias aplicaciones pequeñas.'},
  {k:'toca', part:'ajustes', q:'Quieres ponerle un PIN al móvil. ¿Dónde entras?', e:'Ajustes › Seguridad › Bloqueo de pantalla.'},
  {k:'toca', part:'puntos', q:'¿Dónde ves en qué pantalla de inicio estás?', e:'El punto blanco es la pantalla actual.'}
];
const ELIGE = [
  {k:'elige', vis:'bt', q:'¿Qué indica este símbolo en la barra superior?', o:['El Bluetooth está encendido', 'La batería está baja', 'Hay un mensaje nuevo'], c:0, e:'Es la «B» estilizada del Bluetooth.'},
  {k:'elige', vis:'avion', q:'¿Qué pasa cuando aparece este símbolo?', o:['Se desactivan Wi-Fi, Bluetooth y datos móviles', 'El móvil está cargando', 'Hay una alarma puesta'], c:0, e:'Es el modo avión.'},
  {k:'elige', vis:'sig', q:'¿Qué indican estas barras?', o:['La fuerza de la señal de la red móvil', 'El volumen', 'La batería'], c:0, e:'Es la cobertura.'},
  {k:'elige', vis:'bat', q:'¿Qué significa el rayo en la batería?', o:['Que está cargando', 'Que hay tormenta', 'Que se va a apagar'], c:0, e:'Con el rayo, la batería se está cargando.'},
  {k:'elige', vis:'msg', q:'Te llega este mensaje. ¿Qué haces?', o:['No pulso el enlace y lo borro', 'Pulso el enlace para ver el premio', 'Respondo con mis datos'], c:0, e:'Los mensajes que prometen premios suelen ser intentos de fraude.'},
  {k:'elige', vis:'share', q:'En la Galería, ¿para qué sirve este símbolo?', o:['Para compartir la foto', 'Para borrarla', 'Para editarla'], c:0, e:'Los tres puntos conectados son «Compartir».'},
  {k:'elige', q:'El móvil está bloqueado y necesitas llamar al 112. ¿Qué haces?', o:['Toco «Emergencia» en la pantalla de bloqueo y marco 112', 'Primero tengo que desbloquearlo', 'Desde un móvil bloqueado no se puede'], c:0, e:'Se puede marcar el 112 sin desbloquear.'},
  {k:'elige', q:'Quieres que la alarma suene más fuerte sin subir la música. ¿Qué cambias?', o:['El volumen de alarma', 'El volumen de medios', 'El volumen de notificaciones'], c:0, e:'Cada tipo de sonido tiene su propio volumen.'},
  {k:'elige', q:'¿Para qué es imprescindible una cuenta de Google?', o:['Para descargar aplicaciones de Google Play Store', 'Para hacer llamadas', 'Para usar la calculadora'], c:0, e:'Además sirve para Gmail, Drive, YouTube y copias de seguridad.'},
  {k:'elige', q:'¿Cómo ves la calculadora científica, con raíces y potencias?', o:['Girando el móvil a posición horizontal', 'Tocando dos veces el =', 'Desde Ajustes'], c:0, e:'En horizontal aparecen más funciones.'},
  {k:'elige', q:'En la cámara, ¿para qué tocas la pantalla?', o:['Para enfocar ese punto', 'Para hacer la foto', 'Para encender el flash'], c:0, e:'La foto se hace con el círculo blanco de abajo.'},
  {k:'elige', q:'¿Cómo se crea una carpeta en la pantalla de inicio?', o:['Manteniendo pulsado un icono y arrastrándolo sobre otro', 'Tocando dos veces un icono', 'Desde la Calculadora'], c:0, e:'Luego se le pone nombre tocando «Nueva carpeta».'},
  {k:'elige', q:'¿Cómo creas un contacto de emergencia?', o:['Como un contacto normal, con un nombre que diga «Contacto de emergencia»', 'Llamando al 112', 'Desde la Cámara'], c:0, e:'Así cualquiera sabrá a quién avisar.'},
  {k:'elige', q:'Antes de hacer una foto, ¿qué conviene comprobar?', o:['Que el objetivo esté limpio', 'Que el Bluetooth esté encendido', 'Que el volumen esté alto'], c:0, e:'Con el objetivo sucio, las fotos salen borrosas.'}
];
let pq = [], pi = 0, aciertos = 0, primera = true, respondida = false;
function empezarPractica(){
  const toca = shuffle(TOCA.slice()).slice(0, 4), elige = shuffle(ELIGE.slice()).slice(0, 8).map(q => {
    const idx = shuffle(q.o.map((_, i) => i));
    return Object.assign({}, q, {o:idx.map(i => q.o[i]), c:idx.indexOf(q.c)});
  });
  pq = shuffle(toca.concat(elige)); pi = 0; aciertos = 0; siguiente();
}
function siguiente(){
  limpiar();
  if (pi >= pq.length) return finPractica();
  const q = pq[pi]; primera = true; respondida = false;
  info.style.setProperty('--ic', 'var(--c3)');
  info.innerHTML = '<div class="qn">Pregunta ' + (pi + 1) + ' de ' + pq.length + '</div><h2 class="qt">' + q.q + '</h2>' + (q.vis ? '<div class="qvis">' + BIGSYM[q.vis] + '</div>' : '') +
    (q.k === 'toca' ? '<p class="qhint">👆 Tócalo en el móvil (también en sus laterales).</p>' : '<div class="opts">' + q.o.map((o, i) => '<button class="qo" data-i="' + i + '" type="button">' + o + '</button>').join('') + '</div>') +
    '<div class="feedback" id="fb"></div><div id="qnext"></div>';
  info.querySelectorAll('.qo').forEach(b => b.onclick = () => elegir(+b.dataset.i, b));
  restart(info); progreso();
}
function acierto(txt){
  respondida = true; if (primera) aciertos++;
  const fb = $('fb'); fb.className = 'feedback good'; fb.textContent = '✅ ¡Correcto! ' + txt;
  $('qnext').innerHTML = '<button class="pbtn" id="sig" type="button">' + (pi + 1 === pq.length ? '🏆 Terminar' : 'Siguiente ➜') + '</button>';
  $('sig').onclick = () => { pi++; siguiente(); };
  progreso();
}
function fallo(txt){ primera = false; const fb = $('fb'); fb.className = 'feedback no'; fb.textContent = '❌ ' + txt; }
function elegir(i, b){
  const q = pq[pi]; if (respondida || q.k !== 'elige') return;
  if (i === q.c){ b.classList.add('ok'); info.querySelectorAll('.qo').forEach(x => x.disabled = true); acierto(q.e); }
  else { b.classList.add('bad'); b.disabled = true; fallo('No es eso. ¡Prueba otra vez!'); }
}
function tocarParte(k){
  const q = pq[pi]; if (!q || respondida || q.k !== 'toca') return;
  if (k === q.part){ parts(k).forEach(p => p.classList.add('ok')); acierto(PARTES[k].nombre + '. ' + q.e); }
  else { parts(k).forEach(p => { p.classList.remove('bad'); p.offsetHeight; p.classList.add('bad'); }); setTimeout(() => parts(k).forEach(p => p.classList.remove('bad')), 700); fallo('Eso es ' + PARTES[k].det + '. ¡Inténtalo otra vez!'); }
}
function finPractica(){
  info.style.setProperty('--ic', 'var(--c3)');
  info.innerHTML = '<div class="hello"><div class="trophy">🏆</div><h2 style="color:var(--c3)">¡Enhorabuena!</h2><p>Has acertado a la primera <b>' + aciertos + ' de ' + pq.length + '</b> preguntas.</p><button class="pbtn" id="otra" type="button">🔄 Practicar otra vez</button></div>';
  $('otra').onclick = empezarPractica; progreso();
}
document.querySelectorAll('#ph1 .part').forEach(p => p.addEventListener('click', e => {
  if (e.target.closest('.part') !== p) return;
  e.stopPropagation();
  modo === 'desc' ? mostrar(p.dataset.part) : (modo === 'prac' ? tocarParte(p.dataset.part) : null);
}));

/* =========================================================
   Panel de Probar, modos y progreso
   ========================================================= */
function renderPanel(){
  if (modo !== 'live') return;
  const hechos = TODOS.filter(r => retos[r.id]).length;
  info.style.setProperty('--ic', 'var(' + (X.ultima ? X.ultima.color : '--c1') + ')');
  let h = (hechos === TODOS.length ? '<div class="win-all">🏆 ¡Has superado los ' + TODOS.length + ' retos!</div>' : '') +
    '<h3 class="ph3">Lo que acaba de pasar</h3><div class="last">' + (X.gotit ? '<span class="gotit">✅ Reto conseguido: ' + X.gotit + '</span>' : '') +
    (X.ultima ? X.ultima.html : 'Este móvil funciona de verdad. Elige una <b>estación</b> aquí abajo y ve haciendo sus retos. Los botones de la izquierda son los del <b>lateral</b> del móvil.') + '</div>' +
    '<h3 class="ph3">Estaciones <small>(toca una para ver cómo se hace y sus retos)</small></h3>';
  ESTACIONES.forEach(s => {
    const n = s.retos.filter(r => retos[r.id]).length, open = X.station === s.id;
    h += '<div class="st' + (open ? ' open' : '') + (n === s.retos.length ? ' done' : '') + '"><button class="sth" data-st="' + s.id + '" type="button"><span class="ic">' + s.ic + '</span><b>' + s.t + '</b><span class="cnt">' + n + '/' + s.retos.length + '</span></button>' +
      (open ? '<div class="stb"><div class="guia">' + s.guia + '</div><ul class="retos">' + s.retos.map(r => '<li class="' + (retos[r.id] ? 'on' : '') + '"><span class="rb">' + (retos[r.id] ? '✓' : '') + '</span><span class="rtx">' + r.t + '<small>' + r.h + '</small></span></li>').join('') + '</ul></div>' : '') + '</div>';
  });
  const top = info.scrollTop;
  info.innerHTML = h;
  info.scrollTop = top;
  if (X.verSt){ X.verSt = false; const o = info.querySelector('.st.open'); if (o) o.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  info.querySelectorAll('.sth').forEach(b => b.onclick = () => { X.station = X.station === b.dataset.st ? null : b.dataset.st; X.gotit = null; renderPanel(); });
}
function progreso(){
  let n, tot, txt;
  if (modo === 'desc'){ n = ORDEN.filter(k => found[k]).length; tot = ORDEN.length; txt = '⭐ ' + n + ' de ' + tot + ' partes descubiertas'; }
  else if (modo === 'prac'){ tot = pq.length || 12; n = Math.min(tot, pi + (respondida ? 1 : 0)); txt = '🎯 ' + n + ' de ' + tot + ' preguntas'; }
  else { n = TODOS.filter(r => retos[r.id]).length; tot = TODOS.length; txt = '🛠️ ' + n + ' de ' + tot + ' retos superados'; }
  $('prog-txt').textContent = txt;
  $('prog-fill').style.width = (n / tot * 100) + '%';
  if (modo === 'live') renderPanel();
}
function setModo(m){
  modo = m;
  ['desc', 'live', 'prac'].forEach(x => $('m-' + x).classList.toggle('on', x === m));
  $('st-parts').hidden = m === 'live';
  $('st-live').hidden = m !== 'live';
  $('sc1').classList.toggle('mode-practica', m === 'prac');
  $('ph1').classList.toggle('mode-practica', m === 'prac');
  limpiar();
  if (m === 'desc') bienvenida();
  else if (m === 'prac') empezarPractica();
  else render();
  progreso();
}
$('m-desc').onclick = () => setModo('desc');
$('m-live').onclick = () => setModo('live');
$('m-prac').onclick = () => setModo('prac');
$('reset').onclick = () => {
  if (modo === 'desc') found = {};
  else if (modo === 'live'){ if (!confirm('¿Empezar de nuevo? Se borrarán los retos conseguidos y el móvil volverá a como estaba.')) return; retos = {}; nuevoEstado(); }
  guardar(); pintarPins(); setModo(modo);
};
pintarPins();
setModo('desc');
</script>
</body>
</html>

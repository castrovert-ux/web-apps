<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos con el móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#25D366; --c3:#FFD93D; --c4:#FF6B6B; --c5:#6BCB77; --c6:#4DA3FF; --c7:#C38BFF; --c8:#FF9F43; --c9:#2DD4BF;
    --bg:#0a1628; --card:#111d35; --text:#FFFFFE; --sub:#8a9bbf;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  button, input { font-family:inherit; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }

  .bg-blobs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.15; animation:float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:550px; height:550px; background:var(--c6); top:-120px; left:-100px; }
  .blob:nth-child(2){ width:400px; height:400px; background:var(--c4); bottom:-100px; right:-80px; animation-delay:-5s; }
  .blob:nth-child(3){ width:320px; height:320px; background:var(--c3); top:45%; left:55%; animation-delay:-9s; }
  @keyframes float { from{transform:translate(0,0) scale(1);} to{transform:translate(25px,18px) scale(1.07);} }
  @keyframes popIn { from{opacity:0; transform:scale(.94) translateY(16px);} to{opacity:1; transform:none;} }

  .container { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:22px 24px 30px; }
  .top { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
  .badge { background:linear-gradient(135deg,var(--c6),#2a6fd6); color:#fff; font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; padding:6px 16px; border-radius:100px; }
  h1 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,3.2vw,2.6rem); line-height:1.1; background:linear-gradient(135deg,var(--c6),var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .modes { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .mode { padding:10px 20px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .mode.on { background:rgba(77,163,255,.18); border-color:var(--c6); color:var(--text); }
  .mode:hover { color:var(--text); }
  .prog { display:flex; align-items:center; gap:14px; margin-bottom:14px; font-weight:800; color:var(--sub); }
  .prog-bar { flex:1; height:10px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--c6),var(--c1),var(--c3)); border-radius:10px; transition:width .5s; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,1.1fr); gap:26px; align-items:start; }
  .subtabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .subtabs[hidden] { display:none; }
  .st { padding:8px 16px; border-radius:100px; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:var(--sub); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .st.on { background:rgba(255,217,61,.15); border-color:var(--c3); color:var(--text); }
  .st:hover { color:var(--text); }
  .tools { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .tools[hidden] { display:none; }
  .tbtn { padding:10px 18px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .tbtn:hover { transform:scale(1.04); border-color:var(--c6); }

  /* ---------- Móvil ---------- */
  .phone { --pw:clamp(250px, calc((100vh - 250px) / 2.05), 390px); position:relative; width:var(--pw); height:calc(var(--pw) * 2.05); margin:0 auto; background:#05070c; border-radius:2.5em; padding:.55em; font-size:calc(var(--pw) / 22); box-shadow:0 0 0 2px #2c3550, 0 26px 60px rgba(0,0,0,.6); }
  .scr { position:relative; width:100%; height:100%; border-radius:2em; overflow:hidden; background:#fff; color:#18202e; user-select:none; -webkit-user-select:none; }
  .ptoast { position:absolute; left:6%; right:6%; bottom:13%; z-index:40; background:rgba(10,22,40,.96); color:#fff; border:1px solid var(--c3); border-radius:1em; padding:.6em .8em; font-weight:800; font-size:.85em; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; }
  .ptoast.on { opacity:1; }
  .flashov { position:absolute; inset:.55em; border-radius:2em; background:#fff; opacity:0; pointer-events:none; z-index:39; }
  .flashov.go { animation:flashgo .5s ease-out; } .flashov.big { animation:flashbig .7s ease-out; }
  @keyframes flashgo { 0%{opacity:.7;} 100%{opacity:0;} } @keyframes flashbig { 0%{opacity:1;} 100%{opacity:0;} }

  .sides { position:absolute; right:-.7em; top:0; bottom:0; width:.7em; }
  .sbtn { position:absolute; right:0; width:.7em; border-radius:0 .3em .3em 0; background:#4a5470; cursor:pointer; border:0; }
  .sbtn:hover { background:#6b7899; }
  .sbtn.up { top:21%; height:8%; } .sbtn.down { top:31%; height:8%; } .sbtn.power { top:44%; height:13%; }
  .sbtn.held { background:var(--c3); box-shadow:0 0 14px var(--c3); }
  .sbtn.part::after { border-radius:0 .3em .3em 0; }

  /* Zonas pulsables */
  .part { cursor:pointer; transition:box-shadow .25s, background .25s; }
  .part::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transition:background .25s; }
  .part:hover::after { background:color-mix(in srgb,var(--pc) 25%, transparent); }
  .sp { position:absolute; border-radius:.7em; }
  .pin { position:absolute; z-index:30; width:2em; height:2em; border-radius:50%; background:var(--pc); color:#0a1628; font-weight:800; display:grid; place-items:center; font-size:.95em; box-shadow:0 2px 8px rgba(0,0,0,.45); animation:pulse 1.8s ease-in-out infinite; pointer-events:none; font-family:'Nunito',sans-serif; }
  .pin.tr { top:-.3em; right:.15em; } .pin.c { left:calc(50% - 1em); top:calc(50% - 1em); } .pin.sd { left:100%; margin-left:.3em; top:calc(50% - 1em); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .part.found > .pin { animation:none; }
  .part.sel { z-index:25; box-shadow:0 0 0 3px var(--pc), 0 0 26px color-mix(in srgb,var(--pc) 80%, transparent); }
  .part.ok { box-shadow:0 0 0 3px var(--c1), 0 0 26px rgba(37,211,102,.8); z-index:25; }
  .part.bad { animation:shake .45s; box-shadow:0 0 0 3px var(--c4); z-index:25; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .mode-practica .pin { display:none; }

  /* Escenas / fotos */
  .scene { position:absolute; inset:0; overflow:hidden; } .scene span { position:absolute; line-height:1; }
  .ph { position:relative; width:100%; overflow:hidden; background:#222; }
  .phin { position:absolute; inset:0; }
  .shotph { aspect-ratio:4/3; background:linear-gradient(135deg,#1c2a4a,#0f1830); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; gap:.2em; text-align:center; }
  .shotph small { font-size:.7em; color:#9fb0d4; font-weight:700; }

  /* Pantallas del móvil */
  .v { position:absolute; inset:0; display:flex; flex-direction:column; padding:2.2em .9em 2.8em; }
  .sbar { position:absolute; left:0; right:0; top:0; z-index:20; height:2.1em; padding:.45em 1.2em 0; display:flex; justify-content:space-between; font-size:.72em; font-weight:800; cursor:pointer; color:#18202e; }
  .sbar.light { color:#fff; }
  .navb { position:absolute; left:0; right:0; bottom:0; z-index:20; height:2.6em; display:flex; justify-content:space-around; align-items:center; font-size:1em; color:#18202e; background:rgba(255,255,255,.0); }
  .navb.light { color:#fff; } .navb span { padding:.2em 1em; cursor:pointer; }
  .v-home { background:linear-gradient(160deg,#2563eb,#7c3aed 55%,#ec4899); color:#fff; }
  .apps { display:grid; grid-template-columns:repeat(3,1fr); gap:.9em .3em; margin-top:1.2em; }
  .app { border:0; background:transparent; color:#fff; font-weight:700; font-size:.8em; display:flex; flex-direction:column; align-items:center; gap:.2em; cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .app .ai { font-size:2.4em; line-height:1.1; background:rgba(255,255,255,.18); border-radius:.45em; width:1.5em; height:1.5em; display:grid; place-items:center; }
  .hint-h { margin-top:auto; text-align:center; font-weight:800; font-size:.8em; background:rgba(0,0,0,.3); border-radius:1em; padding:.5em; }
  .v-lock { background:linear-gradient(170deg,#0f2a5e,#0b1530 70%); color:#fff; align-items:center; padding-top:4em; }
  .lk-clock { font-size:3.6em; font-weight:800; line-height:1; } .lk-date { font-weight:700; opacity:.85; margin-top:.3em; font-size:.9em; }
  .lk-cam { position:absolute; right:1.1em; bottom:4.2em; width:2.8em; height:2.8em; border-radius:50%; border:0; background:rgba(255,255,255,.2); font-size:1.2em; cursor:pointer; }
  .lk-unl { position:absolute; left:1em; right:5.2em; bottom:4.6em; border:0; background:rgba(255,255,255,.14); color:#fff; border-radius:1em; padding:.7em; font-weight:800; font-size:.8em; cursor:pointer; }
  .lk-hint { margin-top:auto; font-weight:700; font-size:.78em; opacity:.8; text-align:center; margin-bottom:5em; }
  .v-cam { background:#000; padding:0; }
  .vf { position:absolute; left:0; right:0; top:0; bottom:6.8em; overflow:hidden; cursor:crosshair; }
  .vfs { position:absolute; inset:0; transition:filter .5s; } .vfs.blur { filter:blur(.5em); } .vfs.night { filter:brightness(.4); } .vfs.blur.night { filter:blur(.5em) brightness(.4); }
  .ring { position:absolute; width:3.6em; height:3.6em; margin:-1.8em 0 0 -1.8em; border:.18em solid var(--c3); border-radius:.5em; animation:ringin .35s ease-out; pointer-events:none; z-index:3; }
  @keyframes ringin { from{transform:scale(1.8); opacity:0;} to{transform:scale(1); opacity:1;} }
  .vf-hint { position:absolute; left:0; right:0; bottom:.8em; text-align:center; z-index:3; }
  .vf-hint span { background:rgba(0,0,0,.55); color:#fff; padding:.35em .9em; border-radius:100px; font-weight:800; font-size:.78em; }
  .cam-top { position:absolute; left:0; right:0; top:2em; z-index:6; display:flex; padding:0 .8em; }
  .flashb { border:0; background:rgba(0,0,0,.5); color:#fff; border-radius:100px; padding:.35em .9em; font-weight:800; font-size:.85em; cursor:pointer; }
  .flashb.on { background:var(--c3); color:#111; } .flashb.off { text-decoration:line-through; opacity:.85; }
  .cam-bar { position:absolute; left:0; right:0; bottom:2.6em; height:4.2em; display:flex; justify-content:space-around; align-items:center; background:#000; z-index:6; }
  .thumb { width:2.9em; height:2.9em; border-radius:.6em; border:.14em solid #fff; overflow:hidden; background:#222; cursor:pointer; position:relative; padding:0; }
  .shut { width:3.6em; height:3.6em; border-radius:50%; border:.25em solid #fff; background:radial-gradient(circle,#fff 62%,#ddd 65%); cursor:pointer; padding:0; }
  .shut:active { transform:scale(.92); }
  .flip { width:2.9em; text-align:center; font-size:1.2em; color:#fff; opacity:.6; }
  .v-gal { background:#fff; }
  .gh { font-weight:800; font-size:1.3em; margin-bottom:.4em; }
  .chipsr { display:flex; gap:.4em; margin-bottom:.7em; }
  .ch { border:2px solid #d5dbe5; background:#fff; border-radius:100px; padding:.25em .8em; font-weight:800; font-size:.8em; cursor:pointer; color:#18202e; }
  .ch.on { background:#2563eb; border-color:#2563eb; color:#fff; }
  .ggrid { display:grid; grid-template-columns:repeat(3,1fr); gap:.3em; overflow:auto; }
  .gth { border:0; padding:0; border-radius:.4em; overflow:hidden; cursor:pointer; position:relative; aspect-ratio:1; background:#ddd; }
  .gth .ph { height:100%; }
  .empty { color:#6b7587; font-weight:700; text-align:center; margin-top:2em; font-size:.9em; }
  .v-view { background:#111; color:#fff; padding-top:2.4em; }
  .vtop { display:flex; align-items:center; gap:.6em; font-weight:800; margin-bottom:.6em; } .vtop span { cursor:pointer; font-size:1.2em; }
  .vph { margin:auto 0; }
  .vbar { margin-top:auto; display:flex; justify-content:space-around; padding:.5em 0; }
  .vb { border:0; background:transparent; color:#fff; font-weight:800; font-size:.8em; display:flex; flex-direction:column; align-items:center; gap:.1em; cursor:pointer; padding:.3em .8em; border-radius:.8em; }
  .vb:hover { background:rgba(255,255,255,.12); } .vb b { font-size:1.8em; line-height:1.1; }
  .v-edit { background:#15181f; color:#fff; padding-top:2.4em; }
  .edtabs { display:grid; grid-template-columns:repeat(4,1fr); gap:.3em; margin:.6em 0; }
  .et { border:0; background:#232834; color:#cfd6e4; border-radius:.7em; padding:.4em 0; font-weight:800; font-size:.68em; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .et b { font-size:1.9em; line-height:1.1; } .et.on { background:#2563eb; color:#fff; }
  .edctl { background:#1e2330; border-radius:.9em; padding:.7em; font-weight:700; font-size:.82em; min-height:6.6em; }
  .edctl label { display:flex; justify-content:space-between; margin-bottom:.1em; } .edctl input[type=range] { width:100%; accent-color:#4DA3FF; height:1.6em; margin-bottom:.3em; }
  .edctl small { display:block; color:#9fb0d4; font-weight:600; margin-top:.2em; }
  .opts { display:flex; flex-wrap:wrap; gap:.35em; } .opt { border:2px solid #3a4258; background:transparent; color:#fff; border-radius:100px; padding:.25em .7em; font-weight:800; font-size:.95em; cursor:pointer; } .opt.on { background:var(--c3); color:#111; border-color:var(--c3); }
  .edfoot { margin-top:auto; display:flex; justify-content:space-between; gap:.5em; }
  .eb { flex:1; border:0; border-radius:.8em; padding:.6em; font-weight:800; font-size:.9em; cursor:pointer; background:#2a3042; color:#fff; } .eb.ok { background:var(--c1); color:#0a1628; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:25; background:#fff; color:#18202e; border-radius:1.3em 1.3em 0 0; padding:.9em .8em 3.2em; animation:popIn .25s ease; }
  .sheet h5 { font-size:.9em; margin-bottom:.6em; }
  .sapps { display:grid; grid-template-columns:repeat(5,1fr); gap:.2em; }
  .sapp { border:0; background:transparent; font-weight:700; font-size:.6em; display:flex; flex-direction:column; align-items:center; gap:.2em; cursor:pointer; color:#18202e; padding:.3em 0; border-radius:.6em; }
  .sapp:hover { background:rgba(0,0,0,.07); } .sapp b { font-size:2.6em; line-height:1.1; }
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:24; }
  .v-comp { background:#f3f5f8; color:#18202e; padding-top:2.4em; }
  .cmp-h { font-weight:800; font-size:1.05em; margin-bottom:.5em; } .cmp-to { background:#fff; border-radius:.7em; padding:.5em .7em; font-weight:700; font-size:.85em; margin-bottom:.6em; }
  .cmp-ph { border-radius:.7em; overflow:hidden; margin-bottom:.6em; }
  .cmp-btn { margin-top:auto; border:0; background:var(--c1); color:#0a1628; border-radius:1em; padding:.8em; font-weight:800; font-size:1em; cursor:pointer; }
  .cmp-ok { text-align:center; font-weight:800; font-size:1.1em; margin-top:.8em; } .bar { height:.5em; background:#dde2e8; border-radius:1em; overflow:hidden; margin-top:.8em; } .bar i { display:block; height:100%; width:0; background:var(--c1); animation:fill 1.2s linear forwards; }
  @keyframes fill { to { width:100%; } }
  .qs { position:absolute; left:0; right:0; top:0; z-index:27; background:rgba(24,30,46,.97); color:#fff; border-radius:0 0 1.4em 1.4em; padding:2.4em .9em 1em; animation:popIn .2s ease; }
  .qs h5 { font-size:.8em; opacity:.7; margin-bottom:.6em; font-weight:700; }
  .qtiles { display:grid; grid-template-columns:repeat(4,1fr); gap:.5em; }
  .qt { border:0; background:#2c3550; color:#fff; border-radius:1em; padding:.5em 0; font-weight:700; font-size:.62em; display:flex; flex-direction:column; align-items:center; gap:.2em; cursor:pointer; }
  .qt b { font-size:2.2em; line-height:1.1; } .qt.hot:hover { background:var(--c3); color:#111; }

  /* Pantallas estáticas (descubrir) */
  .s-bg { position:absolute; inset:0; }
  .s-flash { background:rgba(0,0,0,.55); color:#fff; border-radius:100px; padding:.3em .8em; font-weight:800; font-size:.85em; display:inline-block; }
  .s-bar { position:absolute; left:0; right:0; bottom:0; height:22%; background:#000; }
  .s-th { width:100%; height:100%; border-radius:.6em; overflow:hidden; position:relative; border:.14em solid #fff; background:#222; }
  .s-shut { width:100%; height:100%; border-radius:50%; border:.25em solid #fff; background:radial-gradient(circle,#fff 62%,#ddd 65%); }
  .s-tool { height:100%; background:#232834; color:#fff; border-radius:.7em; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:.68em; } .s-tool b { font-size:2em; line-height:1.1; }
  .s-btn { height:100%; border-radius:.8em; display:grid; place-items:center; font-weight:800; font-size:.9em; background:#2a3042; color:#fff; } .s-btn.ok { background:var(--c1); color:#0a1628; }
  .s-top { position:absolute; left:0; right:0; top:0; height:9%; padding:.9em 1em 0; display:flex; gap:.6em; font-weight:800; color:#fff; font-size:.95em; }
  .s-app { display:flex; flex-direction:column; align-items:center; font-weight:700; font-size:.6em; flex:1; color:#18202e; } .s-app b { font-size:2.6em; line-height:1.15; }
  .s-appsrow { display:flex; height:100%; align-items:center; background:#f3f5f8; border-radius:.8em; }
  .s-tile { height:100%; background:#2c3550; color:#fff; border-radius:1em; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:.62em; } .s-tile b { font-size:2.2em; line-height:1.1; } .s-tile.hot { background:#3d5aa8; }
  .s-swipe { height:100%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:.78em; background:rgba(255,255,255,.1); border-radius:.7em; }
  .s-alb { height:100%; background:#f3f5f8; color:#18202e; border-radius:.9em; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:.8em; } .s-alb small { color:#6b7587; font-weight:600; font-size:.8em; }
  .s-lbl { position:absolute; font-weight:800; font-size:.85em; }

  /* ---------- Panel de información ---------- */
  .side { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; border-radius:24px; }
  .info { background:var(--card); border:1px solid rgba(255,255,255,.07); border-left:8px solid var(--ic,var(--c6)); border-radius:24px; padding:24px 26px; min-height:360px; animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both; transition:border-color .3s; }
  .info-num { display:inline-grid; place-items:center; width:46px; height:46px; border-radius:50%; background:var(--ic,var(--c6)); color:#0a1628; font-weight:800; font-size:1.3rem; margin-bottom:10px; }
  .info h2 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,2.6vw,2.3rem); line-height:1.15; margin-bottom:12px; color:var(--ic,var(--c6)); }
  .info h3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.15rem; margin:14px 0 8px; color:var(--c3); }
  .info p { font-size:clamp(1.05rem,1.5vw,1.3rem); font-weight:600; line-height:1.5; margin-bottom:14px; }
  .info b { color:var(--c3); font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { background:rgba(255,255,255,.07); border-radius:100px; padding:6px 14px; font-weight:800; font-size:clamp(.95rem,1.3vw,1.1rem); }
  .tip { background:rgba(255,217,61,.09); border-radius:14px; padding:12px 16px; color:var(--sub); font-weight:700; font-size:clamp(.95rem,1.3vw,1.1rem); margin-bottom:10px; }
  .tip b { color:var(--c3); }
  .hello { text-align:center; padding-top:30px; } .hello .big { font-size:3.4rem; margin-bottom:8px; } .hello h2 { color:var(--text); }
  .quiz-q { font-family:'Fredoka One',cursive; font-size:clamp(1.5rem,2.6vw,2.2rem); line-height:1.2; margin-bottom:14px; } .quiz-q span { color:var(--c3); }
  .feedback { font-size:1.3rem; font-weight:800; min-height:2em; margin:6px 0 12px; } .feedback.good { color:var(--c1); } .feedback.no { color:var(--c4); }

  limpiar(); const ks = Object.keys(T().parts), quedan = ks.filter(k => !hechas.includes(k));

function shoot(via){

function liveClick(e){
  const el = e.target.closest("[data-act]"); if (!el) return;
  const [a, arg] = el.dataset.act.split(":");
  switch (a) {
    case "app": if (arg === "camera") go("camera"); else if (arg === "gallery") { P.album = "all"; go("gallery"); } else toast("Esta práctica es de fotos 😊"); break;
    case "back": if (P.screen === "viewer") { go("gallery"); } else if (P.screen === "edit" || P.screen === "compose") go("viewer"); else if (P.screen !== "home") go("home"); break;
    case "home": go("home"); break;
    case "unlock": P.locked = false; go("home"); break;
    case "lockcam": P.locked = false; go("camera"); break;
    case "vf": { const r = el.getBoundingClientRect(); P.focus = {x:((e.clientX-r.left)/r.width*100).toFixed(1), y:((e.clientY-r.top)/r.height*100).toFixed(1)}; tick("focus"); render(); break; }
    case "flash": P.flash = ({auto:"on", on:"off", off:"auto"})[P.flash]; tick("flash"); render(); toast("⚡ Flash: " + ({auto:"Automático: el móvil decide", on:"Encendido: se activa siempre", off:"Apagado: no se usa"})[P.flash]); break;
    case "shoot": shoot("btn"); break;
    case "gallery": P.album = "all"; tick("gal"); go("gallery"); break;
    case "album": P.album = arg; if (arg === "shots") tick("folder"); render(); break;
    case "photo": P.cur = +arg; tick("gal"); go("viewer"); break;
    case "edit": { const p = curPhoto(); if (p.type === "shot") { toast("Prueba a editar una foto de la cámara"); break; } P.draft = {...p.edits}; P.dtab = "crop"; tick("edit"); go("edit"); break; }
    case "dtab": P.dtab = arg; render(); break;
    case "crop": P.draft.crop = arg; if (arg !== "none") tick("crop"); render(); break;
    case "filter": P.draft.filter = arg; if (arg !== "none") tick("filter"); render(); break;
    case "cancel": go("viewer"); break;
    case "done": curPhoto().edits = {...P.draft}; tick("done"); toast("💾 Cambios guardados"); go("viewer"); break;
    case "share": P.sheet = true; tick("share"); render(); break;
    case "closesheet": P.sheet = false; render(); break;
    case "to": P.via = SHARE.find(s => s[0] === arg); P.sent = null; P.sheet = false; tick("choose"); go("compose"); break;
    case "send": P.sent = "sending"; render(); setTimeout(() => { if (P.sent === "sending") { P.sent = "done"; tick("send"); if (P.screen === "compose") render(); } }, 1300); break;
    case "finish": go("viewer"); break;
    case "qsclose": P.qs = false; render(); break;
    case "qsshot": P.qs = false; render(); setTimeout(() => takeShot("qs"), 250); break;
  }
}

  if (P.screen === "lock") { if (dx < -50 && Math.abs(dy) < 90) { P.locked = false; go("camera"); } else if (dy < -70) { P.locked = false; go("home"); } }
  else if (s.sbar) openQS();
});

  info.innerHTML = (n === ALLR.length ? '<div class="win-all">🏆 ¡Todos los retos superados!</div>' : '') +
    '<div class="lh"><span class="ico">'+g[0]+'</span><div class="nm">'+g[1]+'</div></div><p>'+txt+'</p>' +
    RETOS.map(gr => '<h3>'+gr.g+'</h3><ul class="retos">'+gr.items.map(r => '<li class="'+(retos[r.id]?'on':'')+'"><span class="rb">'+(retos[r.id]?'✓':'')+'</span><span class="rt">'+r.t+'<small>'+r.h+'</small></span></li>').join("")+'</ul>').join("");
}
$("t-scene").onclick = () => { P.scene = SCN[(SCN.indexOf(P.scene)+1) % SCN.length]; P.focus = null; toast("📱 Ahora apuntas a " + SCENES[P.scene].n); if (P.screen === "camera") render(); };
$("t-light").onclick = () => { P.night = !P.night; $("t-light").textContent = P.night ? "☀️ Cambiar la luz" : "🌙 Cambiar la luz"; toast(P.night ? "🌙 Poca luz: ¿necesitarás el flash?" : "☀️ Buena luz"); if (P.screen === "camera") render(); };
$("t-reset").onclick = () => { resetPhone(); $("t-light").textContent = "🌙 Cambiar la luz"; render(); };

/* =========================================================
   Progreso y modos
   ========================================================= */
function progreso(){
  let n, tot, txt;
  if (modo === "desc") { n = Object.keys(found).length; tot = TOTAL; txt = "⭐ " + n + " de " + tot + " partes descubiertas"; }
  else if (modo === "prac") { n = aciertos; tot = Object.keys(T().parts).length; txt = "🎯 " + n + " de " + tot + " aciertos en «" + T().t + "»"; }
  else { n = Object.keys(retos).length; tot = ALLR.length; txt = "🛠️ " + n + " de " + tot + " retos superados"; }
  $("prog-txt").textContent = txt; $("prog-fill").style.width = (n / tot * 100) + "%";
}
function setModo(m){
  modo = m; pregunta = null;
  ["desc","live","prac"].forEach(x => $("m-"+x).classList.toggle("on", m === x));
  $("root").classList.toggle("mode-practica", m === "prac");
  $("subtabs").hidden = m === "live"; $("tools").hidden = m !== "live";
  if (m === "live") { if (!P) resetPhone(); $("subtabs").innerHTML = ""; renderSides(); render(); progreso(); }
  else { hechas = []; aciertos = 0; renderStatic(); if (m === "desc") { bienvenida(); progreso(); } else nueva(); }
}
$("m-desc").onclick = () => setModo("desc"); $("m-live").onclick = () => setModo("live"); $("m-prac").onclick = () => setModo("prac");
$("reset").onclick = () => { found = {}; retos = {}; guardar(); resetPhone(); setModo(modo); };
setModo("desc");
</script>

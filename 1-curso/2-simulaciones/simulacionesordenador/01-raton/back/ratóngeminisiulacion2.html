<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Componentes del Ratón</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#25D366; --c3:#FFD93D; --c4:#FF6B6B; --c5:#6BCB77; --c6:#4DA3FF; --c7:#C38BFF; --c8:#FF9F43; --c9:#2DD4BF;
    --bg:#0a1628; --card:#111d35; --text:#FFFFFE; --sub:#8a9bbf;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  button, input { font-family:inherit; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }

  .bg-blobs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.15; animation:float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:550px; height:550px; background:var(--c6); top:-120px; left:-100px; }
  .blob:nth-child(2){ width:400px; height:400px; background:var(--c4); bottom:-100px; right:-80px; animation-delay:-5s; }
  .blob:nth-child(3){ width:320px; height:320px; background:var(--c3); top:45%; left:55%; animation-delay:-9s; }
  @keyframes float { from{transform:translate(0,0) scale(1);} to{transform:translate(25px,18px) scale(1.07);} }
  @keyframes popIn { from{opacity:0; transform:scale(.94) translateY(16px);} to{opacity:1; transform:none;} }

  .container { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:22px 24px 30px; }
  .top { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
  .badge { background:linear-gradient(135deg,var(--c6),#2a6fd6); color:#fff; font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; padding:6px 16px; border-radius:100px; }
  h1 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,3.2vw,2.6rem); line-height:1.1; background:linear-gradient(135deg,var(--c6),var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .modes { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .mode { padding:10px 20px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .mode.on { background:rgba(77,163,255,.18); border-color:var(--c6); color:var(--text); }
  .mode:hover { color:var(--text); }
  .prog { display:flex; align-items:center; gap:14px; margin-bottom:14px; font-weight:800; color:var(--sub); }
  .prog-bar { flex:1; height:10px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--c6),var(--c1),var(--c3)); border-radius:10px; transition:width .5s; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,1.1fr); gap:26px; align-items:start; }
  .subtabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .subtabs[hidden] { display:none; }
  .st { padding:8px 16px; border-radius:100px; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:var(--sub); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .st.on { background:rgba(255,217,61,.15); border-color:var(--c3); color:var(--text); }
  .st:hover { color:var(--text); }
  .tools { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .tools[hidden] { display:none; }
  .tbtn { padding:10px 18px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .tbtn:hover { transform:scale(1.04); border-color:var(--c6); }

  /* ---------- Ordenador (Windows 11) ---------- */
  .desktop-screen { position:relative; width:clamp(500px, calc(100vh - 100px), 800px); aspect-ratio:16/9; margin:0 auto; background:url('data:image/svg+xml;utf8,<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="1920" height="1080" fill="%230F172A"/><path d="M1293.45 289.873C1425.21 216.036 1561.76 195.845 1673.81 251.748C1785.86 307.652 1860.29 423.834 1860.29 556.735C1860.29 689.636 1785.86 805.818 1673.81 861.722C1561.76 917.625 1425.21 897.434 1293.45 823.597C1161.69 749.76 1032.53 661.166 937.5 556.735C842.467 452.304 788.667 333.666 845.385 240.525C902.103 147.385 1061.64 122.392 1199.19 203.018" fill="url(%23paint0_linear_0_1)"/><path d="M626.545 790.127C494.793 863.964 358.243 884.155 246.194 828.252C134.144 772.348 59.7107 656.166 59.7107 523.265C59.7107 390.364 134.144 274.182 246.194 218.278C358.243 162.375 494.793 182.566 626.545 256.403C758.307 330.24 887.466 418.834 982.5 523.265C1077.53 627.696 1131.33 746.334 1074.62 839.475C1017.9 932.615 858.361 957.608 720.812 876.982" fill="url(%23paint1_linear_0_1)"/><defs><linearGradient id="paint0_linear_0_1" x1="1245.92" y1="126.353" x2="1476.51" y2="765.75" gradientUnits="userSpaceOnUse"><stop stop-color="%231E3A8A"/><stop offset="1" stop-color="%239333EA"/></linearGradient><linearGradient id="paint1_linear_0_1" x1="674.075" y1="953.647" x2="443.49" y2="314.25" gradientUnits="userSpaceOnUse"><stop stop-color="%230F766E"/><stop offset="1" stop-color="%23BE185D"/></linearGradient></defs></svg>') center / cover no-repeat;
    border-radius:1em; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.6); position:relative; font-size:16px; user-select:none; }
  .desktop-screen.sim { cursor:none; } /* Ocultar cursor real en Probar */

  .taskbar { position:absolute; bottom:0; left:0; right:0; height:48px; background:rgba(0,0,0,.7); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; padding:0 10px; z-index:50; }
  .taskbar-item { width:40px; height:40px; border-radius:5px; display:grid; place-items:center; font-size:1.5rem; cursor:pointer; background:transparent; border:0; color:#fff; transition:background .2s; }
  .taskbar-item:hover { background:rgba(255,255,255,.1); }
  .taskbar-item.start { background:rgba(255,255,255,.15); }
  .taskbar-item.start:hover { background:rgba(255,255,255,.25); }
  .taskbar-item.active { background:rgba(255,255,255,.1); border-bottom:2px solid var(--c6); border-radius:0; }
  .taskbar-item.active:hover { background:rgba(255,255,255,.15); }
  .taskbar-center { display:flex; gap:5px; margin:0 auto; }

  .desktop-icon { position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; color:#fff; font-size:.8rem; width:80px; padding:5px; border-radius:5px; cursor:pointer; transition:background .15s; }
  .desktop-icon .icon-img { font-size:2.2rem; line-height:1; }
  .desktop-icon:hover { background:rgba(255,255,255,.1); }
  .desktop-icon.selected { background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3); }
  .desktop-icon.dragging { opacity:.6; cursor:grabbing; }

  .window { position:absolute; background:#f0f0f0; border-radius:8px; box-shadow:0 8px 30px rgba(0,0,0,.4); display:flex; flex-direction:column; overflow:hidden; z-index:60; min-width:300px; min-height:200px; resize:both; }
  .title-bar { height:32px; background:#e0e0e0; display:flex; align-items:center; padding:0 8px; font-weight:600; font-size:.9rem; cursor:grab; flex-shrink:0; }
  .title-bar .window-title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .window-controls { display:flex; gap:2px; margin-left:auto; }
  .win-btn { width:30px; height:30px; background:transparent; border:none; cursor:pointer; display:grid; place-items:center; font-size:1rem; color:#666; transition:background .15s, color .15s; }
  .win-btn:hover { background:rgba(0,0,0,.08); }
  .win-btn.close:hover { background:#e81123; color:#fff; }
  .window-content { flex:1; overflow:auto; padding:10px; color:#333; font-size:.9rem; line-height:1.5; background:#fff; }
  .window-content::-webkit-scrollbar { width:10px; }
  .window-content::-webkit-scrollbar-track { background:#f0f0f0; }
  .window-content::-webkit-scrollbar-thumb { background:#a0a0a0; border-radius:5px; }
  .window-content::-webkit-scrollbar-thumb:hover { background:#888; }
  .document-text { user-select:text; }
  .selected-text { background:var(--c6); color:#fff; border-radius:3px; padding:0 2px; }

  .context-menu { position:absolute; background:#fff; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.2); padding:5px 0; min-width:180px; z-index:1000; color:#333; font-size:.9rem; }
  .ctx-item { padding:8px 15px; cursor:pointer; transition:background .15s; }
  .ctx-item:hover { background:#e0e0e0; }
  .ctx-item.disabled { opacity:.6; cursor:default; }
  .ctx-sep { border-top:1px solid #eee; margin:5px 0; }
  .ctx-sub { display:flex; justify-content:space-between; align-items:center; }
  .ctx-sub::after { content: "›"; margin-left:10px; color:#999; }

  .mouse-cursor { position:fixed; z-index:9999; pointer-events:none; }
  .mouse-cursor svg { width:22px; height:22px; fill:#000; filter:drop-shadow(1px 1px 1px rgba(0,0,0,.6)); }

  /* Zonas pulsables (Descubrir / Practicar) */
  .part { cursor:pointer; transition:box-shadow .25s, background .25s; }
  .part::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transition:background .25s; }
  .part:hover::after { background:color-mix(in srgb,var(--pc) 25%, transparent); }
  .sp { position:absolute; border-radius:.4em; }
  .pin { position:absolute; z-index:30; width:2em; height:2em; border-radius:50%; background:var(--pc); color:#0a1628; font-weight:800; display:grid; place-items:center; font-size:.95em; box-shadow:0 2px 8px rgba(0,0,0,.45); animation:pulse 1.8s ease-in-out infinite; pointer-events:none; font-family:'Nunito',sans-serif; }
  .pin.tr { top:-.3em; right:.15em; } .pin.c { left:calc(50% - 1em); top:calc(50% - 1em); } .pin.sd { left:100%; margin-left:.3em; top:calc(50% - 1em); }
  .pin.bot-left { bottom:-.3em; left:.15em; } /* Nuevo para partes de ratón */
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .part.found > .pin { animation:none; }
  .part.sel { z-index:25; box-shadow:0 0 0 3px var(--pc), 0 0 26px color-mix(in srgb,var(--pc) 80%, transparent); }
  .part.ok { box-shadow:0 0 0 3px var(--c1), 0 0 26px rgba(37,211,102,.8); z-index:25; }
  .part.bad { animation:shake .45s; box-shadow:0 0 0 3px var(--c4); z-index:25; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .mode-practica .pin { display:none; }

  /* Simulación de ratón en Descubrir/Practicar para mostrar las partes */
  .sim-mouse { position:absolute; bottom:20px; right:20px; width:100px; height:130px; background:#e0e0e0; border-radius:40px; border:2px solid #ccc; box-shadow:0 5px 15px rgba(0,0,0,.2); z-index:10; }
  .sim-mouse .body { position:absolute; inset:0; border-radius:inherit; overflow:hidden; }
  .sim-mouse .top-half { position:absolute; top:0; left:0; right:0; height:50%; border-radius:inherit; }
  .sim-mouse .bottom-half { position:absolute; bottom:0; left:0; right:0; height:50%; border-radius:inherit; background:#d0d0d0; }
  .sim-mouse .divider { position:absolute; top:50%; left:0; right:0; height:2px; background:#b0b0b0; }

  .sim-mouse .left-btn { position:absolute; top:0; left:0; width:50%; height:60%; background:#f0f0f0; border-radius:inherit; border-right:1px solid #ccc; }
  .sim-mouse .right-btn { position:absolute; top:0; right:0; width:50%; height:60%; background:#f0f0f0; border-radius:inherit; border-left:1px solid #ccc; }
  .sim-mouse .scroll-wheel { position:absolute; top:20%; left:calc(50% - 10px); width:20px; height:30px; background:#b0b0b0; border-radius:10px; border:2px solid #999; }

  /* Simulación de cursor para Descubrir/Practicar */
  .sim-cursor { position:absolute; left:25%; top:30%; transform:translate(-50%,-50%); z-index:15; }
  .sim-cursor svg { width:28px; height:28px; fill:#000; filter:drop-shadow(1px 1px 1px rgba(0,0,0,.6)); }

  /* ---------- Panel de información ---------- */
  .side { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; border-radius:24px; }
  .info { background:var(--card); border:1px solid rgba(255,255,255,.07); border-left:8px solid var(--ic,var(--c6)); border-radius:24px; padding:24px 26px; min-height:360px; animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both; transition:border-color .3s; }
  .info-num { display:inline-grid; place-items:center; width:46px; height:46px; border-radius:50%; background:var(--ic,var(--c6)); color:#0a1628; font-weight:800; font-size:1.3rem; margin-bottom:10px; }
  .info h2 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,2.6vw,2.3rem); line-height:1.15; margin-bottom:12px; color:var(--ic,var(--c6)); }
  .info h3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.15rem; margin:14px 0 8px; color:var(--c3); }
  .info p { font-size:clamp(1.05rem,1.5vw,1.3rem); font-weight:600; line-height:1.5; margin-bottom:14px; }
  .info b { color:var(--c3); font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { background:rgba(255,255,255,.07); border-radius:100px; padding:6px 14px; font-weight:800; font-size:clamp(.95rem,1.3vw,1.1rem); }
  .tip { background:rgba(255,217,61,.09); border-radius:14px; padding:12px 16px; color:var(--sub); font-weight:700; font-size:clamp(.95rem,1.3vw,1.1rem); margin-bottom:10px; }
  .tip b { color:var(--c3); }
  .hello { text-align:center; padding-top:30px; } .hello .big { font-size:3.4rem; margin-bottom:8px; } .hello h2 { color:var(--text); }
  .quiz-q { font-family:'Fredoka One',cursive; font-size:clamp(1.5rem,2.6vw,2.2rem); line-height:1.2; margin-bottom:14px; } .quiz-q span { color:var(--c3); }
  .feedback { font-size:1.3rem; font-weight:800; min-height:2em; margin:6px 0 12px; } .feedback.good { color:var(--c1); } .feedback.no { color:var(--c4); }
  .btn { padding:12px 24px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:1.05rem; cursor:pointer; transition:all .2s; }
  .btn:hover { transform:scale(1.04); border-color:var(--c6); } .btn.go { background:rgba(37,211,102,.18); border-color:var(--c1); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .trophy { font-size:4rem; animation:bounce 1s ease infinite alternate; } @keyframes bounce { from{transform:translateY(0) rotate(-5deg);} to{transform:translateY(-12px) rotate(5deg);} }
  .lh { display:flex; align-items:center; gap:14px; margin-bottom:8px; } .lh .ico { font-size:2.2rem; } .lh .nm { font-family:'Fredoka One',cursive; font-size:1.45rem; line-height:1.1; color:var(--ic,var(--c6)); }
  .retos { list-style:none; display:flex; flex-direction:column; gap:5px; }
  .retos li { display:flex; gap:10px; align-items:flex-start; padding:7px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.07); font-weight:700; font-size:.95rem; line-height:1.3; transition:all .25s; }
  .retos .rb { width:22px; height:22px; border-radius:7px; flex-shrink:0; background:rgba(255,255,255,.1); display:grid; place-items:center; font-weight:800; font-size:.8rem; }
  .retos li small { display:block; color:var(--sub); font-weight:600; font-size:.82rem; }
  .retos li.on { background:rgba(37,211,102,.13); border-color:var(--c1); } .retos li.on .rb { background:var(--c1); color:#0a1628; } .retos li.on span.rt { opacity:.75; }
  .win-all { text-align:center; background:rgba(255,217,61,.1); border:2px solid var(--c3); border-radius:16px; padding:10px; margin-bottom:12px; font-weight:800; color:var(--c3); font-size:1.15rem; }
  .foot { text-align:center; margin-top:18px; }
  .btn-reset { padding:10px 24px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; cursor:pointer; } .btn-reset:hover { color:var(--text); border-color:var(--c4); }
  @media (max-width:980px) { .layout { grid-template-columns:1fr; } .side { position:static; max-height:none; } .info { min-height:0; } .modes { margin-left:0; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="container" id="root">
  <div class="top">
    <span class="badge">🪟 Ordenador</span>
    <h1>Componentes del Ratón</h1>
    <div class="modes">
      <button class="mode on" id="m-desc" type="button">🔎 Descubrir</button>
      <button class="mode" id="m-live" type="button">🛠️ Probar</button>
      <button class="mode" id="m-prac" type="button">🎯 Practicar</button>
    </div>
  </div>
  <div class="prog"><span id="prog-txt"></span><div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div></div>

  <div class="layout">
    <div>
      <div class="subtabs" id="subtabs"></div>
      <div class="desktop-screen" id="desktop-screen">
        <!-- Contenido generado por JS -->
      </div>
      <div class="tools" id="tools" hidden>
        <!-- Botones para herramientas (e.g. atajos de teclado si fuera el caso) -->
        <button class="tbtn" id="t-reset" type="button">↩️ Reiniciar simulación</button>
      </div>
    </div>
    <aside class="side"><div class="info" id="info"></div></aside>
  </div>
  <div class="foot"><button class="btn-reset" id="reset" type="button">🔄 Empezar de nuevo</button></div>
</div>

<div class="mouse-cursor" id="mouse-cursor">
  <svg viewBox="0 0 22 22">
    <path d="M10.942 21.986l1.498-1.571-3.664-3.52 2.37-2.37 3.52 3.664 1.571-1.498-5.327-5.597 5.253-5.253.003-.002a.45.45 0 00.125-.333v-3.72a.465.465 0 00-.466-.465h-3.72a.45.45 0 00-.333.125l-5.253 5.253-5.597-5.327-1.498 1.571 3.664 3.52-2.37 2.37 3.52-3.664 1.571 1.498-5.327 5.597 5.253 5.253a.45.45 0 00.333-.125h3.72a.465.465 0 00.465.465z" fill-rule="evenodd" clip-rule="evenodd" />
  </svg>
</div>

<script>
const $ = id => document.getElementById(id);
const info = $("info"), scr = $("desktop-screen");
const cursor = $("mouse-cursor");
const restart = e => { e.style.animation="none"; e.offsetHeight; e.style.animation=""; };
let modo = "desc";

/* =========================================================
   Partes por destreza (Descubrir / Practicar)
   ========================================================= */
const TABS = [{k:"raton", ico:"🖱️", t:"Componentes del Ratón", parts:{
  btn_izq:{n:1, nombre:"Botón Izquierdo", det:"el botón izquierdo del ratón", color:"--c6", sitio:"El botón principal, a la izquierda del ratón.",
    texto:"Es el botón <b>principal</b>. Se usa para <b>seleccionar</b>, <b>abrir</b> y hacer la mayoría de acciones. Con él haces clic normal.", chips:["👆 Clicar","Abrir cosas","Seleccionar elementos"], tip:"Es el que más usarás. Pulsa una vez para seleccionar, dos veces rápido para abrir."},
  btn_der:{n:2, nombre:"Botón Derecho", det:"el botón derecho del ratón", color:"--c3", sitio:"El botón secundario, a la derecha del ratón.",
    texto:"Es el botón <b>secundario</b>. Al pulsarlo, abre un <b>menú con opciones</b> adicionales (menú contextual).", chips:["Menú contextual","Opciones extra"], tip:"Pruébalo en diferentes sitios (escritorio, íconos, ventanas) para ver las opciones."},
  rueda:{n:3, nombre:"Rueda de Desplazamiento", det:"la rueda de desplazamiento", color:"--c8", sitio:"Entre el botón izquierdo y el derecho, en el centro.",
    texto:"Se usa para <b>desplazarte</b> (subir y bajar) por documentos o páginas web largas.", chips:["Scroll","Subir/Bajar"], tip:"Gírala hacia arriba para subir, hacia abajo para bajar."},
  cursor:{n:4, nombre:"Cursor del Ratón", det:"el cursor del ratón", color:"--c1", sitio:"La flecha que se mueve por la pantalla.",
    texto:"Es la <b>flecha</b> que ves en pantalla. Se mueve cuando <b>deslizas el ratón</b> sobre una superficie plana.", chips:["Flecha","Puntero"], tip:"Siempre sabes dónde está tu ratón mirando el cursor en la pantalla."},

      menuItems = `
        <div class="ctx-item" data-action="minimize" data-window-id="${P.contextMenu.targetId}">Minimizar</div>
        <div class="ctx-item" data-action="maximize" data-window-id="${P.contextMenu.targetId}">Maximizar</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" data-action="close" data-window-id="${P.contextMenu.targetId}">Cerrar</div>
      `;
    }

    menuDiv.innerHTML = menuItems;
    scr.appendChild(menuDiv);
  }
  renderInfo();
}

function renderInfo(){
  if (modo !== "live" || !P) return;
  let currentContext = 'desktop';
  if (P.contextMenu.visible) currentContext = 'context_menu';
  else if (P.openWindows.length > 0) currentContext = 'window_open';
  else if (P.activeTaskbarItem) currentContext = 'taskbar';

  const g = GP[currentContext], n = Object.keys(retos).length;
  info.style.setProperty("--ic","var("+g[3]+")");
  info.innerHTML = (n === ALLR.length ? '<div class="win-all">🏆 ¡Todos los retos superados!</div>' : '') +
    '<div class="lh"><span class="ico">'+g[0]+'</span><div class="nm">'+g[1]+'</div></div><p>'+g[2]+'</p>' +
    RETOS.map(gr => '<h3>'+gr.g+'</h3><ul class="retos">'+gr.items.map(r => '<li class="'+(retos[r.id]?'on':'')+'"><span class="rb">'+(retos[r.id]?'✓':'')+'</span><span class="rt">'+r.t+'<small>'+r.h+'</small></span></li>').join("")+'</ul>').join("");
}

// Mouse events for Probar mode
scr.addEventListener('mousemove', e => {
  if (modo !== 'live') return;
  P.mouse.x = e.clientX - scr.getBoundingClientRect().left;
  P.mouse.y = e.clientY - scr.getBoundingClientRect().top;
  cursor.style.left = `${e.clientX}px`;
  cursor.style.top = `${e.clientY}px`;
  tick('move_cursor');

  if (P.mouse.dragTarget) {
    const target = P.mouse.dragTarget;
    if (target.type === 'window') {
      const win = P.openWindows.find(w => w.id === target.id);
      if (win) {
        win.x = P.mouse.x - P.mouse.dragOffsetX;
        win.y = P.mouse.y - P.mouse.dragOffsetY;
        renderLive();
        tick('move_window');
      }
    } else if (target.type === 'icon') {
      const icon = P.desktopIcons.find(ico => ico.id === target.id);
      if (icon) {
        icon.x = P.mouse.x - P.mouse.dragOffsetX;
        icon.y = P.mouse.y - P.mouse.dragOffsetY;
        const iconDiv = scr.querySelector(`.desktop-icon[data-id="${target.id}"]`);
        if (iconDiv) iconDiv.classList.add('dragging');
        renderLive(); // Re-render to update icon position
      }
    }
  }

  if (P.mouse.isSelectingText) {
    const currentTarget = e.target.closest('.document-text');
    if (!currentTarget) return;

    const winId = currentTarget.closest('.window').id.replace('window-', '');
    const win = P.openWindows.find(w => w.id === winId);
    if (!win) return;

    const textNodes = Array.from(currentTarget.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);
    let totalText = '';
    textNodes.forEach(node => totalText += node.textContent);
    
    // Find character index of current mouse position
    const range = document.createRange();
    const selection = window.getSelection();
    range.selectNodeContents(currentTarget);
    selection.removeAllRanges();
    selection.addRange(range);
    
    const endOffset = window.getSelection().anchorOffset;
    const endElement = window.getSelection().anchorNode.parentNode;

    // Check if the current element matches the start element
    if (win.mouseStartElement === currentTarget || (win.mouseStartElement && win.mouseStartElement.contains(currentTarget))) {
        let startCharIndex = win.textSelectionStartIndex;
        let endCharIndex = endOffset + (Array.from(currentTarget.previousSibling?.childNodes || []).reduce((acc, node) => acc + (node.textContent || '').length, 0));
        
        // Adjust startCharIndex to be within the current target's text content
        if (win.mouseStartElement !== currentTarget) {
            let prevCharCount = 0;
            let foundStart = false;
            textNodes.forEach(node => {
                if (node === win.mouseStartElement.firstChild) {
                    startCharIndex = win.textSelectionStartIndex + prevCharCount;
                    foundStart = true;
                }
                prevCharCount += node.textContent.length;
            });
            if (!foundStart) startCharIndex = prevCharCount; // Default to start of current if not found
        }
        
        win.selectedTextRange = {
            start: Math.min(startCharIndex, endCharIndex),
            end: Math.max(startCharIndex, endCharIndex)
        };
        renderLive();
        tick('select_text');
    }
}
});


scr.addEventListener('pointerdown', e => {
  if (modo !== 'live') return;
  P.contextMenu.visible = false; // Close context menu on any click

  const desktopIcon = e.target.closest('.desktop-icon');
  const windowTitleBar = e.target.closest('.title-bar');
  const windowContent = e.target.closest('.window-content');
  const winControls = e.target.closest('.window-controls');
  const taskbarItem = e.target.closest('.taskbar-item');

  if (desktopIcon) {
    P.selectedDesktopIcon = desktopIcon.dataset.id;
    P.mouse.dragTarget = { type: 'icon', id: desktopIcon.dataset.id };
    P.mouse.dragOffsetX = P.mouse.x - desktopIcon.offsetLeft;
    P.mouse.dragOffsetY = P.mouse.y - desktopIcon.offsetTop;
    try { e.target.setPointerCapture(e.pointerId); } catch(err){}
    renderLive();
  } else if (windowTitleBar && !winControls) {
    const winId = windowTitleBar.dataset.windowId;
    const win = P.openWindows.find(w => w.id === winId);
    if (win) {
      P.activeTaskbarItem = winId;
      P.mouse.dragTarget = { type: 'window', id: win.id };
      P.mouse.dragOffsetX = P.mouse.x - win.x;
      P.mouse.dragOffsetY = P.mouse.y - win.y;
      try { e.target.setPointerCapture(e.pointerId); } catch(err){}
      renderLive();
    }
  } else if (windowContent) {
    const winId = windowContent.dataset.windowId;
    const win = P.openWindows.find(w => w.id === winId);
    if (win) {
      P.activeTaskbarItem = winId;
      win.selectedTextRange = null; // Clear previous selection
      const targetText = e.target.closest('.document-text');
      if (targetText) {
          P.mouse.isSelectingText = true;
          win.mouseStartElement = targetText;
          const range = document.createRange();
          range.selectNodeContents(targetText);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          win.textSelectionStartIndex = selection.anchorOffset;
      }
      renderLive();
    }
  } else if (!taskbarItem) { // Click on desktop background
    P.selectedDesktopIcon = null;
    P.activeTaskbarItem = null;
    renderLive();
  }
});

scr.addEventListener('pointerup', e => {
  if (modo !== 'live') return;
  if (P.mouse.dragTarget && P.mouse.dragTarget.type === 'icon' && P.mouse.dragTarget.id === 'bin') {
    tick('drag_drop_icon'); // Only count for bin for simplicity
  }
  P.mouse.dragTarget = null;
  P.mouse.isSelectingText = false;
  try { e.target.releasePointerCapture(e.pointerId); } catch(err){}
  renderLive();
});

scr.addEventListener('click', e => {
  if (modo !== 'live') return;
  P.contextMenu.visible = false; // Hide context menu on left click

  const desktopIcon = e.target.closest('.desktop-icon');
  const winControlBtn = e.target.closest('.win-btn');
  const taskbarItem = e.target.closest('.taskbar-item');

  if (desktopIcon) {
    P.selectedDesktopIcon = desktopIcon.dataset.id;
    renderLive();
    tick('select_icon');
  } else if (winControlBtn) {
    const action = winControlBtn.dataset.action;
    const winId = winControlBtn.dataset.windowId;
    if (action === 'close') {
      P.openWindows = P.openWindows.filter(w => w.id !== winId);
      P.activeTaskbarItem = null;
      tick('close_window');
      renderLive();
    }
  } else if (taskbarItem) {
    if (taskbarItem.dataset.taskbarId === 'explorer') {
      if (!P.openWindows.some(w => w.id === 'explorer')) {
        P.openWindows.push({
          id: 'explorer',
          title: 'Explorador de Archivos',
          type: 'app',
          x: 150, y: 120, w: 500, h: 350,
          content: '<p>Contenido del Explorador de Archivos...</p><p>Aquí verías tus carpetas y documentos.</p>',
          scrollY: 0
        });
        tick('open_explorer_taskbar');
      } else { // Already open, just bring to front / set active
          P.activeTaskbarItem = 'explorer';
      }
      renderLive();
    }
  }
});

scr.addEventListener('dblclick', e => {
  if (modo !== 'live') return;
  const desktopIcon = e.target.closest('.desktop-icon');
  if (desktopIcon) {
    if (desktopIcon.dataset.id === 'doc') {
      if (!P.openWindows.some(w => w.id === 'doc')) {
        P.openWindows.push({
          id: 'doc',
          title: 'Mi Documento.txt',
          type: 'document',
          x: 200, y: 150, w: 400, h: 400,
          content: DOC_CONTENT,
          scrollY: 0
        });
      }
      P.activeTaskbarItem = 'doc';
      tick('open_app_dclick');
      renderLive();
    } else if (desktopIcon.dataset.id === 'explorer') {
        if (!P.openWindows.some(w => w.id === 'explorer')) {
            P.openWindows.push({
                id: 'explorer',
                title: 'Explorador de Archivos',
                type: 'app',
                x: 150, y: 120, w: 500, h: 350,
                content: '<p>Contenido del Explorador de Archivos...</p><p>Aquí verías tus carpetas y documentos.</p>',
                scrollY: 0
            });
        }
        P.activeTaskbarItem = 'explorer';
        tick('open_app_dclick'); // Also count as opening an app, even if different than doc
        renderLive();
    } else {
        toast(`Doble clic en ${desktopIcon.dataset.id} no hace nada en esta simulación.`);
    }
  }
});


scr.addEventListener('contextmenu', e => {
  if (modo !== 'live') return;
  e.preventDefault(); // Prevent native context menu

  const desktopIcon = e.target.closest('.desktop-icon');
  const windowTitleBar = e.target.closest('.title-bar');
  const taskbarItem = e.target.closest('.taskbar-item');

  P.contextMenu.x = e.clientX - scr.getBoundingClientRect().left;
  P.contextMenu.y = e.clientY - scr.getBoundingClientRect().top;
  P.contextMenu.visible = true;

  if (desktopIcon) {
    P.contextMenu.type = 'icon';
    P.contextMenu.targetId = desktopIcon.dataset.id;
  } else if (windowTitleBar) {
    P.contextMenu.type = 'window';
    P.contextMenu.targetId = windowTitleBar.dataset.windowId;
  } else if (taskbarItem) {
      P.contextMenu.type = 'taskbar';
      P.contextMenu.targetId = taskbarItem.dataset.taskbarId;
  } else {
    P.contextMenu.type = 'desktop';
    P.contextMenu.targetId = null;
    tick('ctx_desktop');
  }
  renderLive();
});

// Context menu actions
scr.addEventListener('click', e => {
  if (modo !== 'live' || !P.contextMenu.visible) return;
  const ctxItem = e.target.closest('.ctx-item');
  if (ctxItem) {
    const action = ctxItem.dataset.action;
    if (action === 'ctx:desktop:display' || action === 'ctx:desktop:personalize' || action === 'ctx:icon:open') {
        toast(`La acción "${ctxItem.textContent.trim()}" no está implementada en esta simulación, pero has usado el menú contextual.`);
    } else if (action === 'ctx:taskbar:close_window' || action === 'close') {
        // Find the window corresponding to the taskbar item or directly from the context menu target
        const winIdToClose = P.contextMenu.targetId;
        P.openWindows = P.openWindows.filter(w => w.id !== winIdToClose);
        P.activeTaskbarItem = null;
        tick('close_window');
        toast("Ventana cerrada.");
    } else if (action === 'minimize' || action === 'maximize') {
        toast(`La acción "${ctxItem.textContent.trim()}" no está implementada en esta simulación, pero has usado el menú contextual.`);
    } else if (action === 'ctx:icon:delete') {
        if (P.contextMenu.targetId === 'doc') {
            P.desktopIcons = P.desktopIcons.filter(icon => icon.id !== 'doc');
            toast("¡Documento enviado a la Papelera!");
        } else {
            toast(`No puedes eliminar ${P.contextMenu.targetId} en esta simulación.`);
        }
    } else if (action === 'ctx:icon:empty_bin') {
        toast("La papelera se ha vaciado.");
    } else if (action === 'ctx:taskbar:unpin') {
        toast("La aplicación se ha desanclado de la barra de tareas.");
    }
  }
  P.contextMenu.visible = false;
  renderLive();
});

// Scroll wheel
scr.addEventListener('wheel', e => {
    if (modo !== 'live') return;
    const windowContent = e.target.closest('.window-content');
    if (windowContent) {
        const winId = windowContent.dataset.windowId;
        const win = P.openWindows.find(w => w.id === winId);
        if (win) {
            win.scrollY = windowContent.scrollTop + e.deltaY;
            windowContent.scrollTop = win.scrollY;
            tick('scroll_wheel');
        }
    }
});

// Reiniciar simulación
$("t-reset").onclick = () => { resetSimulation(); renderLive(); toast("Simulación reiniciada."); };

/* =========================================================
   Progreso y modos
   ========================================================= */
function progreso(){
  let n, tot, txt;
  if (modo === "desc") { n = Object.keys(found).length; tot = TOTAL; txt = "⭐ " + n + " de " + tot + " partes descubiertas"; }
  else if (modo === "prac") { n = aciertos; tot = Object.keys(T().parts).length; txt = "🎯 " + n + " de " + tot + " aciertos en «" + T().t + "»"; }
  else { n = Object.keys(retos).length; tot = ALLR.length; txt = "🛠️ " + n + " de " + tot + " retos superados"; }
  $("prog-txt").textContent = txt; $("prog-fill").style.width = (n / tot * 100) + "%";
}
function setModo(m){
  modo = m; pregunta = null;
  ["desc","live","prac"].forEach(x => $("m-"+x).classList.toggle("on", m === x));
  $("root").classList.toggle("mode-practica", m === "prac");
  $("subtabs").hidden = m === "live"; $("tools").hidden = m !== "live";

  if (m === "live") {
    resetSimulation();
    scr.classList.add("sim"); // Custom cursor
    cursor.style.display = "block";
    renderLive();
    progreso();
  } else {
    scr.classList.remove("sim"); // Restore native cursor
    cursor.style.display = "none";
    hechas = []; aciertos = 0; renderStatic(); if (m === "desc") { bienvenida(); progreso(); } else nueva();
  }
}
$("m-desc").onclick = () => setModo("desc"); $("m-live").onclick = () => setModo("live"); $("m-prac").onclick = () => setModo("prac");
$("reset").onclick = () => { found = {}; retos = {}; guardar(); resetSimulation(); setModo(modo); };

// Initialize mouse cursor position
document.addEventListener('mousemove', e => {
    cursor.style.left = `${e.clientX}px`;
    cursor.style.top = `${e.clientY}px`;
});

setModo("desc");
</script>

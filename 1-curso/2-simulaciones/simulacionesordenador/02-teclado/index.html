<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teclas de escritura</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#25D366; --c3:#FFD93D; --c4:#FF6B6B; --c5:#6BCB77; --c6:#4DA3FF; --c7:#C38BFF; --c8:#FF9F43; --c9:#2DD4BF;
    --bg:#0a1628; --card:#111d35; --text:#FFFFFE; --sub:#8a9bbf;
    --win-blue:#0067C0; --win-bg:#1a2b47; /* Windows 11 specific */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  button, input { font-family:inherit; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }

  .bg-blobs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.15; animation:float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:550px; height:550px; background:var(--c6); top:-120px; left:-100px; }
  .blob:nth-child(2){ width:400px; height:400px; background:var(--c4); bottom:-100px; right:-80px; animation-delay:-5s; }
  .blob:nth-child(3){ width:320px; height:320px; background:var(--c3); top:45%; left:55%; animation-delay:-9s; }
  @keyframes float { from{transform:translate(0,0) scale(1);} to{transform:translate(25px,18px) scale(1.07);} }
  @keyframes popIn { from{opacity:0; transform:scale(.94) translateY(16px);} to{opacity:1; transform:none;} }

  .container { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:22px 24px 30px; }
  .top { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
  .badge { background:linear-gradient(135deg,var(--c6),#2a6fd6); color:#fff; font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; padding:6px 16px; border-radius:100px; }
  h1 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,3.2vw,2.6rem); line-height:1.1; background:linear-gradient(135deg,var(--c6),var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .modes { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .mode { padding:10px 20px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .mode.on { background:rgba(77,163,255,.18); border-color:var(--c6); color:var(--text); }
  .mode:hover { color:var(--text); }
  .prog { display:flex; align-items:center; gap:14px; margin-bottom:14px; font-weight:800; color:var(--sub); }
  .prog-bar { flex:1; height:10px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--c6),var(--c1),var(--c3)); border-radius:10px; transition:width .5s; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,1.1fr); gap:26px; align-items:start; }
  .subtabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
  .subtabs[hidden] { display:none; }
  .st { padding:8px 16px; border-radius:100px; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:var(--sub); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .st.on { background:rgba(255,217,61,.15); border-color:var(--c3); color:var(--text); }
  .st:hover { color:var(--text); }
  .tools { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .tools[hidden] { display:none; }
  .tbtn { padding:10px 18px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:.95rem; cursor:pointer; transition:all .2s; }
  .tbtn:hover { transform:scale(1.04); border-color:var(--c6); }

  /* ---------- Ordenador ---------- */
  .computer { --ph:clamp(280px, calc(100vh - 250px), 680px); position:relative; width:calc(var(--ph) * 1.6); height:var(--ph); margin:0 auto; background:linear-gradient(180deg, #2a416b, #1e3357); border-radius:.6em; padding:.8em; font-size:calc(var(--ph) / 36); box-shadow:0 0 0 2px #3c4c6e, 0 26px 60px rgba(0,0,0,.6); }
  .desktop { position:relative; width:100%; height:100%; border-radius:.4em; overflow:hidden; background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="%23015f6f"/><stop offset="100%" stop-color="%23013845"/></linearGradient><linearGradient id="h" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="%230078d4"/><stop offset="100%" stop-color="%23005a9e"/></linearGradient></defs><rect width="1920" height="1080" fill="url(%23g)"/><path fill="%23001f30" d="M1100 0h820v1080H0z"/><path fill="%2300304a" d="M1250 0h670v1080H0z"/><path fill="%23004a6e" d="M1400 0h520v1080H0z"/><path fill="%23006496" d="M1550 0h370v1080H0z"/><path fill="url(%23h)" d="M1700 0h220v1080H0z"/><path fill="%23002237" d="M1920 0H0v1080h1920z"/><circle cx="1080" cy="540" r="400" fill="url(%23h)"/><circle cx="1080" cy="540" r="300" fill="%23003e62"/><circle cx="1080" cy="540" r="200" fill="%23002f4a"/><circle cx="1080" cy="540" r="100" fill="%23001f30"/></svg>') no-repeat center center / cover; color:#fff; user-select:none; -webkit-user-select:none; }
  .taskbar { position:absolute; bottom:0; left:0; right:0; height:2.2em; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); display:flex; align-items:center; padding:0 .4em; z-index:10; }
  .taskbar-item { width:2.2em; height:2.2em; border-radius:.4em; display:grid; place-items:center; font-size:1.1em; cursor:pointer; color:#eee; transition:background .15s; }
  .taskbar-item:hover { background:rgba(255,255,255,.1); }
  .taskbar-item.start { font-size:1.4em; }
  .taskbar-item.active { background:rgba(255,255,255,.15); box-shadow:0 0 0 2px var(--win-blue) inset; }
  .taskbar-item.active:hover { background:rgba(255,255,255,.2); }

  .window { position:absolute; background:#fff; border-radius:.6em; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.1); z-index:1; }
  .window-titlebar { height:1.8em; background:#f0f0f0; display:flex; align-items:center; padding:0 .4em; font-weight:700; font-size:.85em; color:#333; cursor:grab; }
  .window-title { flex-grow:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .window-controls { display:flex; gap:.2em; margin-left:auto; }
  .win-ctrl { width:1.8em; height:1.8em; display:grid; place-items:center; cursor:pointer; transition:background .15s; }
  .win-ctrl:hover { background:#e0e0e0; }
  .win-ctrl.close:hover { background:#e81123; color:#fff; }

  .notepad { left:8%; top:8%; width:70%; height:80%; }
  .notepad-menu { display:flex; height:1.4em; background:#f5f5f5; border-bottom:1px solid #ddd; padding:0 .6em; font-size:.8em; }
  .notepad-menu span { padding:0 .4em; display:grid; place-items:center; cursor:pointer; color:#555; }
  .notepad-menu span:hover { background:#e0e0e0; }
  .notepad-content { flex-grow:1; background:#fff; color:#333; padding:.6em; font-size:1em; line-height:1.4; white-space:pre-wrap; caret-color:#333; overflow-y:auto; cursor:text; user-select:text; }
  .notepad-content:focus { outline:none; }
  .notepad-content .cursor { display:inline-block; width:2px; height:1.1em; background:#333; animation:blink .7s infinite; vertical-align:middle; margin-left: -1px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .notepad-content .selected { background:var(--win-blue); color:#fff; }

  .save-dialog { width:40%; height:38%; top:25%; left:30%; z-index:20; }
  .save-dialog-content { padding:1em; font-size:.9em; color:#333; display:flex; flex-direction:column; height:calc(100% - 1.8em); }
  .save-dialog-content label { margin-bottom:.5em; font-weight:700; }
  .save-dialog-content input { width:100%; padding:.6em; border:1px solid #ccc; border-radius:.3em; margin-bottom:.8em; font-size:1em; }
  .save-dialog-buttons { margin-top:auto; display:flex; justify-content:flex-end; gap:.6em; }
  .save-btn { padding:.6em 1.2em; border:1px solid #ccc; border-radius:.3em; background:#f0f0f0; color:#333; font-weight:600; cursor:pointer; }
  .save-btn.primary { background:var(--win-blue); border-color:var(--win-blue); color:#fff; }
  .save-btn:hover { background:#e0e0e0; }
  .save-btn.primary:hover { background:#00519a; }

  .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:15; }

  /* Zonas pulsables */
  .part { cursor:pointer; transition:box-shadow .25s, background .25s; }
  .part::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transition:background .25s; }
  .part:hover::after { background:color-mix(in srgb,var(--pc) 25%, transparent); }
  .pin { position:absolute; z-index:30; width:2em; height:2em; border-radius:50%; background:var(--pc); color:#0a1628; font-weight:800; display:grid; place-items:center; font-size:.95em; box-shadow:0 2px 8px rgba(0,0,0,.45); animation:pulse 1.8s ease-in-out infinite; pointer-events:none; font-family:'Nunito',sans-serif; }
  .pin.tr { top:-.3em; right:.15em; } .pin.c { left:calc(50% - 1em); top:calc(50% - 1em); } .pin.sd { left:100%; margin-left:.3em; top:calc(50% - 1em); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .part.found > .pin { animation:none; }
  .part.sel { z-index:25; box-shadow:0 0 0 3px var(--pc), 0 0 26px color-mix(in srgb,var(--pc) 80%, transparent); }
  .part.ok { box-shadow:0 0 0 3px var(--c1), 0 0 26px rgba(37,211,102,.8); z-index:25; }
  .part.bad { animation:shake .45s; box-shadow:0 0 0 3px var(--c4); z-index:25; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .mode-practica .pin { display:none; }

  /* Teclado simplificado para la simulación */
  .keyboard { position:absolute; left:20%; right:20%; bottom:2%; height:30%; display:grid; grid-template-columns:repeat(14,1fr); grid-template-rows:repeat(4,1fr); gap:.2em; background:rgba(255,255,255,.8); border-radius:.5em; padding:.3em; box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .key { display:grid; place-items:center; background:#eee; border-radius:.2em; font-size:.7em; font-weight:700; color:#333; cursor:pointer; user-select:none; transition:background .1s; position:relative; }
  .key small { position:absolute; top:2px; right:3px; font-size:.6em; opacity:.7; }
  .key.wide { grid-column:span 2; }
  .key.xl { grid-column:span 3; }
  .key.xxl { grid-column:span 6; }
  .key.active, .key:active { background:#ccc; }
  .key.special { background:#d0d0d0; }
  .key.fn { background:#c0c0c0; color:#555; }
  .key.shift { grid-column:span 2; }
  .key.ctrl, .key.alt { grid-column:span 1.5; }
  .key.capslock { grid-column:span 1.5; }
  .key.tab { grid-column:span 1.5; }
  .key.backspace { grid-column:span 2; }
  .key.enter { grid-column:span 2; grid-row:span 2; height:calc(200% + .2em); } /* Fix for visual height */
  .key.del { grid-column:span 1; }
  .key.arrow { font-size:.9em; }
  .key.fkey { grid-row:1; margin-bottom:.1em; }

  /* Descubrir / Practicar specific parts for the keyboard drawing */
  .k-part { position:absolute; border-radius:.2em; display:grid; place-items:center; }
  .k-part .pin { position:absolute; right: -1em; top: -1em; } /* Adjust pin position for keyboard keys */
  .k-part.letters { left:7%; top:32%; width:64%; height:40%; }
  .k-part.numbers { left:8%; top:18%; width:50%; height:12%; }
  .k-part.space { left:20%; bottom:10%; width:40%; height:15%; }
  .k-part.enter { right:7%; top:48%; width:10%; height:30%; }
  .k-part.shift { left:3%; top:60%; width:10%; height:15%; }
  .k-part.capslock { left:3%; top:45%; width:10%; height:15%; }
  .k-part.ctrl_alt { left:3%; bottom:10%; width:15%; height:15%; } /* For Ctrl */
  .k-part.ctrl_alt-right { right:18%; bottom:10%; width:15%; height:15%; } /* For AltGr */
  .k-part.backspace { right:7%; top:32%; width:10%; height:15%; }
  .k-part.delete { right:7%; top:18%; width:10%; height:12%; } /* Delete is often above arrows */
  .k-part.tab { left:3%; top:30%; width:10%; height:15%; }
  .k-part.arrows { right:2%; bottom:10%; width:15%; height:20%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:.2em; }
  .k-part.arrows .pin { top:-.3em; left:1.2em; }
  .k-part.arrows .key { width:100%; height:100%; }
  .k-part.arrows .up { grid-column:2; grid-row:1; }
  .k-part.arrows .left { grid-column:1; grid-row:2; }
  .k-part.arrows .down { grid-column:2; grid-row:2; }
  .k-part.arrows .right { grid-column:3; grid-row:2; }


  /* ---------- Panel de información ---------- */
  .side { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; border-radius:24px; }
  .info { background:var(--card); border:1px solid rgba(255,255,255,.07); border-left:8px solid var(--ic,var(--c6)); border-radius:24px; padding:24px 26px; min-height:360px; animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both; transition:border-color .3s; }
  .info-num { display:inline-grid; place-items:center; width:46px; height:46px; border-radius:50%; background:var(--ic,var(--c6)); color:#0a1628; font-weight:800; font-size:1.3rem; margin-bottom:10px; }
  .info h2 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,2.6vw,2.3rem); line-height:1.15; margin-bottom:12px; color:var(--ic,var(--c6)); }
  .info h3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.15rem; margin:14px 0 8px; color:var(--c3); }
  .info p { font-size:clamp(1.05rem,1.5vw,1.3rem); font-weight:600; line-height:1.5; margin-bottom:14px; }
  .info b { color:var(--c3); font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { background:rgba(255,255,255,.07); border-radius:100px; padding:6px 14px; font-weight:800; font-size:clamp(.95rem,1.3vw,1.1rem); }
  .tip { background:rgba(255,217,61,.09); border-radius:14px; padding:12px 16px; color:var(--sub); font-weight:700; font-size:clamp(.95rem,1.3vw,1.1rem); margin-bottom:10px; }
  .tip b { color:var(--c3); }
  .hello { text-align:center; padding-top:30px; } .hello .big { font-size:3.4rem; margin-bottom:8px; } .hello h2 { color:var(--text); }
  .quiz-q { font-family:'Fredoka One',cursive; font-size:clamp(1.5rem,2.6vw,2.2rem); line-height:1.2; margin-bottom:14px; } .quiz-q span { color:var(--c3); }
  .feedback { font-size:1.3rem; font-weight:800; min-height:2em; margin:6px 0 12px; } .feedback.good { color:var(--c1); } .feedback.no { color:var(--c4); }
  .btn { padding:12px 24px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:1.05rem; cursor:pointer; transition:all .2s; }
  .btn:hover { transform:scale(1.04); border-color:var(--c6); } .btn.go { background:rgba(37,211,102,.18); border-color:var(--c1); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .trophy { font-size:4rem; animation:bounce 1s ease infinite alternate; } @keyframes bounce { from{transform:translateY(0) rotate(-5deg);} to{transform:translateY(-12px) rotate(5deg);} }
  .lh { display:flex; align-items:center; gap:14px; margin-bottom:8px; } .lh .ico { font-size:2.2rem; } .lh .nm { font-family:'Fredoka One',cursive; font-size:1.45rem; line-height:1.1; color:var(--ic,var(--c6)); }
  .retos { list-style:none; display:flex; flex-direction:column; gap:5px; }
  .retos li { display:flex; gap:10px; align-items:flex-start; padding:7px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.07); font-weight:700; font-size:.95rem; line-height:1.3; transition:all .25s; }
  .retos .rb { width:22px; height:22px; border-radius:7px; flex-shrink:0; background:rgba(255,255,255,.1); display:grid; place-items:center; font-weight:800; font-size:.8rem; }
  .retos li small { display:block; color:var(--sub); font-weight:600; font-size:.82rem; }
  .retos li.on { background:rgba(37,211,102,.13); border-color:var(--c1); } .retos li.on .rb { background:var(--c1); color:#0a1628; } .retos li.on span.rt { opacity:.75; }
  .win-all { text-align:center; background:rgba(255,217,61,.1); border:2px solid var(--c3); border-radius:16px; padding:10px; margin-bottom:12px; font-weight:800; color:var(--c3); font-size:1.15rem; }
  .foot { text-align:center; margin-top:18px; }
  .btn-reset { padding:10px 24px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; cursor:pointer; } .btn-reset:hover { color:var(--text); border-color:var(--c4); }
  @media (max-width:980px) { .layout { grid-template-columns:1fr; } .side { position:static; max-height:none; } .info { min-height:0; } .modes { margin-left:0; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="container" id="root">
  <div class="top">
    <span class="badge">🪟 Ordenador</span>
    <h1>Teclas de escritura</h1>
    <div class="modes">
      <button class="mode on" id="m-desc" type="button">🔎 Descubrir</button>
      <button class="mode" id="m-live" type="button">🛠️ Probar</button>
      <button class="mode" id="m-prac" type="button">🎯 Practicar</button>
    </div>
  </div>
  <div class="prog"><span id="prog-txt"></span><div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div></div>

  <div class="layout">
    <div>
      <div class="subtabs" id="subtabs" hidden>
        <button class="st on" data-tab="escritura" type="button">✍️ Escritura</button>
      </div>
      <div class="computer" id="computer">
        <div class="desktop" id="desktop">
          <div class="window notepad" id="notepad-win" data-active="false">
            <div class="window-titlebar" data-draggable="true">
              <span style="margin-left:.4em">📄</span>
              <span class="window-title" id="notepad-title">Sin título - Bloc de notas</span>
              <div class="window-controls">
                <div class="win-ctrl" data-action="minimize">_</div>
                <div class="win-ctrl" data-action="maximize">🗖</div>
                <div class="win-ctrl close" data-action="close">✕</div>
              </div>
            </div>
            <div class="notepad-menu">
              <span>Archivo</span><span>Editar</span><span>Formato</span><span>Ver</span><span>Ayuda</span>
            </div>
            <div class="notepad-content" id="notepad-content"></div>
          </div>
          <div class="taskbar">
            <div class="taskbar-item start">🪟</div>
            <div class="taskbar-item search">🔍</div>
            <div class="taskbar-item active" id="notepad-taskbar-item" data-app="notepad">📄</div>
          </div>

          <div class="overlay" id="overlay" hidden></div>
          <div class="window save-dialog" id="save-dialog" hidden>
            <div class="window-titlebar">
              <span style="margin-left:.4em">💾</span>
              <span class="window-title">Guardar como</span>
              <div class="window-controls">
                <div class="win-ctrl close" data-action="close-save">✕</div>
              </div>
            </div>
            <div class="save-dialog-content">
              <label for="filename-input">Nombre del archivo:</label>
              <input type="text" id="filename-input" value="Sin título.txt">
              <div class="save-dialog-buttons">
                <button class="save-btn" data-action="cancel-save">Cancelar</button>
                <button class="save-btn primary" data-action="confirm-save">Guardar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tools" id="tools" hidden>
        <button class="tbtn" id="t-reset" type="button">🔄 Resetear programa</button>
        <button class="tbtn" id="t-keys-on" type="button">⌨️ Teclas en pantalla: ENCENDIDAS</button>
      </div>
    </div>
    <aside class="side"><div class="info" id="info"></div></aside>
  </div>
  <div class="foot"><button class="btn-reset" id="reset" type="button">🔄 Empezar de nuevo</button></div>
</div>

<script>
const $ = id => document.getElementById(id);
const info = $("info"), desktop = $("desktop");
const restart = e => { e.style.animation="none"; e.offsetHeight; e.style.animation=""; };
let modo = "desc";

/* =========================================================
   Partes por destreza (Descubrir / Practicar)

function updateNotepadContent() {
  const contentDiv = $("notepad-content");
  if (!contentDiv || !P.notepad_open) return;

  let text = P.notepad_content;
  let pre = text.substring(0, P.cursor_pos);
  let post = text.substring(P.cursor_pos);

  if (P.selection.start !== P.selection.end) {
    const s = Math.min(P.selection.start, P.selection.end);
    const e = Math.max(P.selection.start, P.selection.end);
    pre = text.substring(0, s);
    const selectedText = text.substring(s, e);
    post = text.substring(e);
    contentDiv.innerHTML = pre + `<span class="selected">${selectedText}</span>` + post;
    P.cursor_pos = e; // Cursor moves to end of selection after rendering
  } else {
    contentDiv.innerHTML = pre + '<span class="cursor"></span>' + post;
  }
}

function handleNotepadClick(e) {
  if (modo !== "live" || !P.notepad_open) return;
  const contentDiv = $("notepad-content");
  if (!contentDiv || !contentDiv.contains(e.target)) return;

  // Simple cursor positioning for contenteditable
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    const preCaretRange = range.cloneRange();
    preCaretRange.selectNodeContents(contentDiv);
    preCaretRange.setEnd(range.endContainer, range.endOffset);
    P.cursor_pos = preCaretRange.toString().length;
    P.selection = {start: P.cursor_pos, end: P.cursor_pos};
  }
  updateNotepadContent();
}

function insertText(text) {
  let content = P.notepad_content;
  let start = P.selection.start;
  let end = P.selection.end;

  if (start !== end) { // Remove selected text first
    const s = Math.min(start, end);
    const e = Math.max(start, end);
    content = content.substring(0, s) + content.substring(e);
    P.cursor_pos = s;
    start = s;
    end = s;
  }

  P.notepad_content = content.substring(0, P.cursor_pos) + text + content.substring(P.cursor_pos);
  P.cursor_pos += text.length;
  P.selection = {start: P.cursor_pos, end: P.cursor_pos};
  P.notepad_modified = true;
  updateNotepadContent();
  tick("type_hello"); // Any typing means "hello world" could be next
}

function handleKeyDown(e) {
  if (modo !== "live" || !P.notepad_open) return;

  let prevent = true;
  const isLetter = e.key.length === 1 && e.key.match(/[a-zñç]/i);

  if (e.key === "Shift") P.shift_held = true;
  if (e.key === "Control") P.ctrl_held = true;
  if (e.key === "CapsLock") {
    P.caps_lock_on = !P.caps_lock_on;
    if (P.caps_lock_on) tick("use_capslock");
  }

  if (e.ctrlKey && e.key === "s") { // Ctrl + S
    e.preventDefault();
    openSaveDialog();
    return;
  }
  if (e.ctrlKey && e.key === "c") { // Ctrl + C
    e.preventDefault();
    if (P.selection.start !== P.selection.end) {
      P.clipboard = P.notepad_content.substring(Math.min(P.selection.start, P.selection.end), Math.max(P.selection.start, P.selection.end));
      toast("Texto copiado al portapapeles");
      tick("copy_paste");
    }
    return;
  }
  if (e.ctrlKey && e.key === "v") { // Ctrl + V
    e.preventDefault();
    if (P.clipboard) {
      insertText(P.clipboard);
      toast("Texto pegado");
      tick("copy_paste");
    } else {
      toast("El portapapeles está vacío");
    }
    return;
  }

  if (isLetter) {
    let char = e.key;
    if (P.shift_held || P.caps_lock_on) char = char.toUpperCase();
    insertText(char);
    if (P.shift_held && char === char.toUpperCase()) tick("use_shift");
  } else if (e.key === " ") {
    insertText(" ");
    tick("use_space");
  } else if (e.key === "Enter") {
    insertText("\n");
    tick("use_enter");
  } else if (e.key === "Backspace") {
    if (P.selection.start !== P.selection.end) {
      insertText(""); // Delete selection
    } else if (P.cursor_pos > 0) {
      P.notepad_content = P.notepad_content.substring(0, P.cursor_pos - 1) + P.notepad_content.substring(P.cursor_pos);
      P.cursor_pos--;
      P.selection = {start: P.cursor_pos, end: P.cursor_pos};
      tick("use_backspace");
    }
    P.notepad_modified = true;
  } else if (e.key === "Delete") {
    if (P.selection.start !== P.selection.end) {
      insertText(""); // Delete selection
    } else if (P.cursor_pos < P.notepad_content.length) {
      P.notepad_content = P.notepad_content.substring(0, P.cursor_pos) + P.notepad_content.substring(P.cursor_pos + 1);
      tick("use_delete");
    }
    P.notepad_modified = true;
  } else if (e.key === "ArrowLeft") {
    if (P.cursor_pos > 0) {
      P.cursor_pos--;
      P.selection = {start: P.cursor_pos, end: P.cursor_pos};
      tick("move_arrows");
    }
  } else if (e.key === "ArrowRight") {
    if (P.cursor_pos < P.notepad_content.length) {
      P.cursor_pos++;
      P.selection = {start: P.cursor_pos, end: P.cursor_pos};
      tick("move_arrows");
    }
  } else if (e.key === "ArrowUp") {
    const lastNewline = P.notepad_content.lastIndexOf("\n", P.cursor_pos - 1);
    const prevNewline = P.notepad_content.lastIndexOf("\n", lastNewline - 1);
    if (lastNewline !== -1) {
        const offsetInLine = P.cursor_pos - (lastNewline + 1);
        P.cursor_pos = Math.min(prevNewline + 1 + offsetInLine, lastNewline);
        if (P.cursor_pos < 0) P.cursor_pos = 0;
        P.selection = {start: P.cursor_pos, end: P.cursor_pos};
        tick("move_arrows");
    } else if (P.cursor_pos > 0) {
        P.cursor_pos = 0; // Move to beginning of content if no previous line
        P.selection = {start: P.cursor_pos, end: P.cursor_pos};
        tick("move_arrows");
    }
  } else if (e.key === "ArrowDown") {
    const nextNewline = P.notepad_content.indexOf("\n", P.cursor_pos);
    const currentNewline = P.notepad_content.lastIndexOf("\n", P.cursor_pos);
    const nextNextNewline = P.notepad_content.indexOf("\n", nextNewline + 1);

    if (nextNewline !== -1) {
        const offsetInLine = P.cursor_pos - (currentNewline + 1);
        P.cursor_pos = Math.min(nextNewline + 1 + offsetInLine, nextNextNewline !== -1 ? nextNextNewline : P.notepad_content.length);
        P.selection = {start: P.cursor_pos, end: P.cursor_pos};
        tick("move_arrows");
    } else if (P.cursor_pos < P.notepad_content.length) {
        P.cursor_pos = P.notepad_content.length; // Move to end of content if no next line
        P.selection = {start: P.cursor_pos, end: P.cursor_pos};
        tick("move_arrows");
    }
  } else if (e.key === "Home") {
    const lastNewline = P.notepad_content.lastIndexOf("\n", P.cursor_pos - 1);
    P.cursor_pos = lastNewline !== -1 ? lastNewline + 1 : 0;
    P.selection = {start: P.cursor_pos, end: P.cursor_pos};
    tick("move_arrows");
  } else if (e.key === "End") {
    const nextNewline = P.notepad_content.indexOf("\n", P.cursor_pos);
    P.cursor_pos = nextNewline !== -1 ? nextNewline : P.notepad_content.length;
    P.selection = {start: P.cursor_pos, end: P.cursor_pos};
    tick("move_arrows");
  } else if (e.key === "Tab") {
    e.preventDefault(); // Prevent focus change
    insertText("    "); // 4 spaces for a tab
    tick("use_tab");
  } else if (e.key.length === 1 && e.key.match(/[a-z0-9`~!@#$%^&*()_|+\-=?;:'",.<>\{\}\[\]\\\/]/i)) {
    // Other printable characters
    insertText(e.key);
  } else {
    prevent = false; // Don't prevent default for other keys
  }

  if (prevent) e.preventDefault();
  updateNotepadContent();
}

function handleKeyUp(e) {
  if (modo !== "live" || !P.notepad_open) return;
  if (e.key === "Shift") P.shift_held = false;
  if (e.key === "Control") P.ctrl_held = false;
}

function handleSelectionChange() {
  if (modo !== "live" || !P.notepad_open) return;
  const selection = window.getSelection();
  const contentDiv = $("notepad-content");

  if (selection.rangeCount > 0 && contentDiv && contentDiv.contains(selection.anchorNode) && contentDiv.contains(selection.focusNode)) {
    const range = selection.getRangeAt(0);
    const preAnchorRange = range.cloneRange();
    preAnchorRange.selectNodeContents(contentDiv);
    preAnchorRange.setEnd(range.anchorNode, range.anchorOffset);
    const preFocusRange = range.cloneRange();
    preFocusRange.selectNodeContents(contentDiv);
    preFocusRange.setEnd(range.focusNode, range.focusOffset);

    P.selection.start = preAnchorRange.toString().length;
    P.selection.end = preFocusRange.toString().length;
    P.cursor_pos = P.selection.end; // Cursor is always at the end of selection for insertion
  } else {
    P.selection = {start: P.cursor_pos, end: P.cursor_pos};
  }
}

document.addEventListener("selectionchange", handleSelectionChange);
document.addEventListener("keydown", handleKeyDown);
document.addEventListener("keyup", handleKeyUp);

function openNotepad() {
  P.notepad_open = true;
  P.screen = "notepad";
  tick("open_notepad");
  render();
}

function closeNotepad() {
  if (P.notepad_modified && !confirm("Tienes cambios sin guardar. ¿Quieres salir sin guardar?")) {
    return;
  }
  P.notepad_open = false;
  P.notepad_modified = false;
  P.notepad_content = "";
  P.cursor_pos = 0;
  P.selection = {start:0, end:0};
  P.save_filename = "Sin título.txt";
  P.screen = "desktop";
  render();
}

function openSaveDialog() {
  if (!P.notepad_open) return;
  P.screen = "save_dialog";
  render();
  const filenameInput = $("filename-input");
  if (filenameInput) filenameInput.focus();
}

function closeSaveDialog() {
  P.screen = "notepad";
  render();
}

function confirmSave() {
  const filename = $("filename-input").value.trim();
  if (!filename) {
    alert("Por favor, introduce un nombre para el archivo.");
    return;
  }
  P.save_filename = filename;
  P.notepad_modified = false;
  const notepadTitle = $("notepad-title");
  if (notepadTitle) notepadTitle.textContent = filename + " - Bloc de notas";
  tick("save_file");
  toast(`Archivo "${filename}" guardado.`);
  closeSaveDialog();
}

function renderLive(){
  let h_desktop = '';
  if (P.screen === "desktop") {
    h_desktop = `<div class="desktop" id="desktop-content">
      <div class="taskbar">
        <div class="taskbar-item start">🪟</div>
        <div class="taskbar-item search">🔍</div>
        <div class="taskbar-item" data-action="open-notepad">📄</div>
      </div>
    </div>`;
  } else {
    h_desktop = `<div class="desktop" id="desktop-content">
      <div class="window notepad" id="notepad-win" data-active="true">
        <div class="window-titlebar" data-draggable="true">
          <span style="margin-left:.4em">📄</span>
          <span class="window-title" id="notepad-title">${P.save_filename === "Sin título.txt" && P.notepad_modified ? "*" : ""}${P.save_filename} - Bloc de notas</span>
          <div class="window-controls">
            <div class="win-ctrl" data-action="minimize">_</div>
            <div class="win-ctrl" data-action="maximize">🗖</div>
            <div class="win-ctrl close" data-action="close-notepad">✕</div>
          </div>
        </div>
        <div class="notepad-menu">
          <span data-action="file-menu">Archivo</span><span data-action="edit-menu">Editar</span><span>Formato</span><span>Ver</span><span>Ayuda</span>
        </div>
        <div class="notepad-content" id="notepad-content" tabindex="0"></div>
        ${P.keys_overlay ? createKeyboardHTML(false) : ''}
      </div>
      <div class="taskbar">
        <div class="taskbar-item start">🪟</div>
        <div class="taskbar-item search">🔍</div>
        <div class="taskbar-item active" data-action="toggle-notepad">📄</div>
      </div>
    </div>`;

    if (P.screen === "save_dialog") {
      h_desktop += `<div class="overlay" id="overlay"></div>
        <div class="window save-dialog" id="save-dialog">
          <div class="window-titlebar">
            <span style="margin-left:.4em">💾</span>
            <span class="window-title">Guardar como</span>
            <div class="window-controls">
              <div class="win-ctrl close" data-action="close-save">✕</div>
            </div>
          </div>
          <div class="save-dialog-content">
            <label for="filename-input">Nombre del archivo:</label>
            <input type="text" id="filename-input" value="${P.save_filename}">
            <div class="save-dialog-buttons">
              <button class="save-btn" data-action="cancel-save">Cancelar</button>
              <button class="save-btn primary" data-action="confirm-save">Guardar</button>
            </div>
          </div>
        </div>`;
    }
  }

  desktop.innerHTML = h_desktop;

  if (P.notepad_open) {
    const notepadContentDiv = $("notepad-content");
    if (notepadContentDiv) {
      updateNotepadContent();
      notepadContentDiv.addEventListener("click", handleNotepadClick);
    }
    const fileMenu = document.querySelector(".notepad-menu span[data-action='file-menu']");
    if (fileMenu) {
        fileMenu.addEventListener("click", () => {
            if (P.ctrl_held) { /* Ctrl held means Alt+F type shortcut, ignore for now */ }
            else if (!P.screen === "save_dialog") openSaveDialog();
            else { /* do nothing for now */ }
        });
    }
    const editMenu = document.querySelector(".notepad-menu span[data-action='edit-menu']");
    if (editMenu) {
        editMenu.addEventListener("click", () => {
            if (P.ctrl_held) { /* Ctrl held means Alt+E type shortcut, ignore for now */ }
            else { toast("Usa Ctrl+C para copiar y Ctrl+V para pegar 😊"); }
        });
    }
  }

  // Set up event listeners for dynamically created elements
  desktop.querySelectorAll("[data-action]").forEach(el => {
    const action = el.dataset.action;
    el.onclick = () => {
      switch (action) {
        case "open-notepad": openNotepad(); break;
        case "toggle-notepad": P.notepad_open = !P.notepad_open; render(); break;
        case "close-notepad": closeNotepad(); break;
        case "minimize": toast("Acción de minimizar simulada."); break;
        case "maximize": toast("Acción de maximizar simulada."); break;
        case "close": closeNotepad(); break; // For generic close button on title bar
        case "close-save": closeSaveDialog(); break;
        case "cancel-save": closeSaveDialog(); break;
        case "confirm-save": confirmSave(); break;
      }
    };
  });
  desktop.querySelectorAll(".key").forEach(keyEl => {
    keyEl.onclick = () => {
      if (keyEl.dataset.key === "CapsLock") {
        P.caps_lock_on = !P.caps_lock_on;
        if (P.caps_lock_on) tick("use_capslock");
        keyEl.classList.toggle("active", P.caps_lock_on);
        // Simulate keystroke
        handleKeyDown({key: "CapsLock", preventDefault: () => {}});
      } else if (keyEl.dataset.key === "ShiftLeft" || keyEl.dataset.key === "ShiftRight") {
        P.shift_held = true;
        // Simulate a letter press
        const fakeEvent = {key: 'a', preventDefault: () => {}};
        handleKeyDown(fakeEvent);
        P.shift_held = false; // Reset after one simulated press
        tick("use_shift");
      } else if (keyEl.dataset.key === "ControlLeft" || keyEl.dataset.key === "ControlRight") {
        P.ctrl_held = true;
        // Simulate a paste action to complete Ctrl+V
        if (P.clipboard && confirm("¿Simular Ctrl+V para pegar?")) { // Allow user to confirm if they want to simulate C+V
          handleKeyDown({key: 'v', ctrlKey: true, preventDefault: () => {}});
        } else if (confirm("¿Simular Ctrl+C para copiar la selección?")) { // Allow user to confirm C+C
          handleKeyDown({key: 'c', ctrlKey: true, preventDefault: () => {}});
        } else if (confirm("¿Simular Ctrl+S para guardar?")) {
          handleKeyDown({key: 's', ctrlKey: true, preventDefault: () => {}});
        }
        P.ctrl_held = false;
      }
      // Implement other key presses if necessary for visual keyboard interaction for challenges
      // For now, most typing is handled by actual keyboard events
    };
  });

  renderInfo();
}

// Draggable window logic
let isDragging = false;
let currentWindow = null;
let offsetX, offsetY;

desktop.addEventListener('mousedown', (e) => {
  const titleBar = e.target.closest('.window-titlebar[data-draggable="true"]');
  if (titleBar) {
    e.preventDefault();
    isDragging = true;
    currentWindow = titleBar.closest('.window');
    offsetX = e.clientX - currentWindow.getBoundingClientRect().left;
    offsetY = e.clientY - currentWindow.getBoundingClientRect().top;

    currentWindow.style.zIndex = 2; // Bring to front
    // Disable selection during drag
    desktop.style.userSelect = 'none';
    desktop.style.cursor = 'grabbing';
  }
});

desktop.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  e.preventDefault();

  const desktopRect = desktop.getBoundingClientRect();
  let newX = e.clientX - offsetX - desktopRect.left;
  let newY = e.clientY - offsetY - desktopRect.top;

  // Keep window within desktop bounds
  newX = Math.max(0, Math.min(newX, desktopRect.width - currentWindow.offsetWidth));
  newY = Math.max(0, Math.min(newY, desktopRect.height - currentWindow.offsetHeight));

  currentWindow.style.left = `${newX / desktopRect.width * 100}%`;
  currentWindow.style.top = `${newY / desktopRect.height * 100}%`;
});

desktop.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    if (currentWindow) {
      currentWindow.style.zIndex = 1;
      currentWindow = null;
    }
    desktop.style.userSelect = 'auto';
    desktop.style.cursor = 'default';
  }
});


function render(){
  if (modo === "live") renderLive();
}

function renderInfo(){
  if (modo !== "live" || !P) return;
  const key = P.screen === "desktop" ? "desktop" : P.screen;
  const g = GP[key], n = Object.keys(retos).length;
  info.style.setProperty("--ic","var("+g[3]+")");
  info.innerHTML = (n === ALLR.length ? '<div class="win-all">🏆 ¡Todos los retos superados!</div>' : '') +
    '<div class="lh"><span class="ico">'+g[0]+'</span><div class="nm">'+g[1]+'</div></div><p>'+g[2]+'</p>' +
    RETOS.map(gr => '<h3>'+gr.g+'</h3><ul class="retos">'+gr.items.map(r => '<li class="'+(retos[r.id]?'on':'')+'"><span class="rb">'+(retos[r.id]?'✓':'')+'</span><span class="rt">'+r.t+'<small>'+r.h+'</small></span></li>').join("")+'</ul>').join("");
}

$("t-reset").onclick = () => { resetComputer(); render(); toast("El Bloc de notas y el contenido se han reseteado."); };
$("t-keys-on").onclick = () => {
    P.keys_overlay = !P.keys_overlay;
    $("t-keys-on").textContent = `⌨️ Teclas en pantalla: ${P.keys_overlay ? 'ENCENDIDAS' : 'APAGADAS'}`;
    render();
    if (P.keys_overlay) toast("Ahora ves un teclado en pantalla para guiarte. Puedes usar tu teclado físico para escribir.");
    else toast("Se ha ocultado el teclado en pantalla. Puedes seguir usando tu teclado físico.");
};


/* =========================================================
   Progreso y modos
   ========================================================= */
function progreso(){
  let n, tot, txt;
  if (modo === "desc") { n = Object.keys(found).length; tot = TOTAL; txt = "⭐ " + n + " de " + tot + " partes descubiertas"; }
  else if (modo === "prac") { n = aciertos; tot = Object.keys(T().parts).length; txt = "🎯 " + n + " de " + tot + " aciertos en «" + T().t + "»"; }
  else { n = Object.keys(retos).length; tot = ALLR.length; txt = "🛠️ " + n + " de " + tot + " retos superados"; }
  $("prog-txt").textContent = txt; $("prog-fill").style.width = (n / tot * 100) + "%";
}
function setModo(m){
  modo = m; pregunta = null;
  ["desc","live","prac"].forEach(x => $("m-"+x).classList.toggle("on", m === x));
  $("root").classList.toggle("mode-practica", m === "prac");
  $("subtabs").hidden = m === "live"; $("tools").hidden = m !== "live";

  if (m === "live") {
    if (!P) resetComputer();
    render();
    progreso();
  } else {
    hechas = []; aciertos = 0;
    renderStatic();
    if (m === "desc") { bienvenida(); progreso(); } else nueva();
  }
}
$("m-desc").onclick = () => setModo("desc"); $("m-live").onclick = () => setModo("live"); $("m-prac").onclick = () => setModo("prac");
$("reset").onclick = () => { found = {}; retos = {}; guardar(); resetComputer(); setModo(modo); };
setModo("desc");
</script>

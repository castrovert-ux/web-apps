<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El escritorio de Windows</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1:#25D366; --c3:#FFD93D; --c4:#FF6B6B; --c5:#6BCB77; --c6:#4DA3FF; --c7:#C38BFF; --c8:#FF9F43; --c9:#2DD4BF;
    --bg:#0a1628; --card:#111d35; --text:#FFFFFE; --sub:#8a9bbf;
    --win:#f3f5f8; --win-ink:#1b2433;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  button, input { font-family:inherit; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }
  svg { fill:none; stroke:currentColor; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }

  .bg-blobs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.15; animation:float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1){ width:550px; height:550px; background:var(--c6); top:-120px; left:-100px; }
  .blob:nth-child(2){ width:400px; height:400px; background:var(--c4); bottom:-100px; right:-80px; animation-delay:-5s; }
  .blob:nth-child(3){ width:320px; height:320px; background:var(--c3); top:45%; left:55%; animation-delay:-9s; }
  @keyframes float { from{transform:translate(0,0) scale(1);} to{transform:translate(25px,18px) scale(1.07);} }
  @keyframes popIn { from{opacity:0; transform:scale(.94) translateY(16px);} to{opacity:1; transform:none;} }

  .container { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:22px 24px 30px; }
  .top { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:14px; }
  .badge { background:linear-gradient(135deg,var(--c6),#2a6fd6); color:#fff; font-weight:800; font-size:.8rem; letter-spacing:2px; text-transform:uppercase; padding:6px 16px; border-radius:100px; }
  h1 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,3.2vw,2.6rem); line-height:1.1; background:linear-gradient(135deg,var(--c6),var(--c1),var(--c3)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .modes { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .mode { padding:10px 20px; border-radius:14px; border:2px solid rgba(255,255,255,.15); background:transparent; color:var(--sub); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .mode.on { background:rgba(77,163,255,.18); border-color:var(--c6); color:var(--text); }
  .mode:hover { color:var(--text); }
  .prog { display:flex; align-items:center; gap:14px; margin-bottom:16px; font-weight:800; color:var(--sub); }
  .prog-bar { flex:1; height:10px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
  .prog-fill { height:100%; width:0; background:linear-gradient(90deg,var(--c6),var(--c1),var(--c3)); border-radius:10px; transition:width .5s; }
  .layout { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(330px,1fr); gap:22px; align-items:start; }
  .stage[hidden] { display:none; }

  /* ---------- Pantalla ---------- */
  .screen { position:relative; width:100%; aspect-ratio:16/10; border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.12);
    background: radial-gradient(circle at 25% 30%, rgba(77,163,255,.6), transparent 55%), radial-gradient(circle at 80% 65%, rgba(37,211,102,.4), transparent 50%), linear-gradient(135deg,#12335f,#0b1d3a);
    box-shadow:0 20px 50px rgba(0,0,0,.45); font-size:clamp(.78rem,1.1vw,1rem); user-select:none; -webkit-user-select:none; }
  .screen input { user-select:text; -webkit-user-select:text; }
  .desk { position:absolute; left:0; top:0; right:0; bottom:3.6em; overflow:hidden; }
  .dicons { position:absolute; left:.6em; top:.6em; display:flex; flex-direction:column; gap:.3em; }
  .dicon { width:5.8em; display:flex; flex-direction:column; align-items:center; gap:.2em; padding:.4em .2em; border-radius:8px; color:#fff; font-size:.75em; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.7); text-align:center; }
  .dicon .di { font-size:2.2em; line-height:1; }
  .dicon.sel { background:rgba(255,255,255,.2); }

  /* Barra de tareas */
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:3.6em; background:rgba(238,242,248,.93); color:var(--win-ink); display:flex; align-items:center; justify-content:flex-start; backdrop-filter:blur(10px); border-top:1px solid rgba(255,255,255,.5); z-index:40; }
  .tk-center { display:flex; align-items:center; gap:.1em; margin-left:max(.6em, calc(50% - 14em)); position:relative; }
  .tk { position:relative; height:2.7em; min-width:2.7em; display:grid; place-items:center; border-radius:8px; font-size:1.25em; border:0; background:transparent; color:inherit; cursor:default; padding:0 .3em; }
  .tk.btn, button.tk { cursor:pointer; } .tk.btn:hover, button.tk:hover { background:rgba(0,0,0,.08); }
  .tk.act { background:rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.08); }
  .tk.open::after { content:""; position:absolute; bottom:.1em; left:35%; right:35%; height:3px; border-radius:3px; background:#7b8798; }
  .tk.open.act::after { background:#3b82f6; left:25%; right:25%; }
  .winlogo { display:grid; grid-template-columns:1fr 1fr; gap:2px; width:1.05em; height:1.05em; }
  .winlogo i { background:#2f7fe8; border-radius:1px; }
  .searchpill { position:relative; display:flex; align-items:center; gap:.5em; height:2.2em; min-width:7.5em; padding:0 .9em; border-radius:100px; background:#fff; border:1px solid #cfd6de; color:#6b7587; font-weight:700; font-size:.95em; cursor:pointer; }
  .searchpill:hover { border-color:#3b82f6; }
  .tk-sep { width:1px; height:1.8em; background:rgba(0,0,0,.18); margin:0 .3em; }
  .tray { position:absolute; right:1.1em; top:0; bottom:0; display:flex; align-items:center; gap:.1em; }
  .tray .tk, #p-tray .tk { font-size:1em; min-width:2.1em; padding:0 .15em; }
  .tray .lang, #p-tray .lang { font-weight:800; font-size:.8em; }
  .tray .clock, #p-tray .clock { font-weight:700; font-size:.72em; line-height:1.2; text-align:right; padding:0 .4em; }
  .showdesk { position:absolute; right:0; top:0; bottom:0; width:.9em; border-left:1px solid rgba(0,0,0,.2); }
  button.showdesk { background:transparent; border-top:0; border-right:0; border-bottom:0; cursor:pointer; }
  button.showdesk:hover { background:rgba(0,0,0,.12); }

  /* Zonas pulsables (descubrir / practicar) */
  .part { cursor:pointer; transition:box-shadow .25s, background .25s; }
  .part::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; transition:background .25s; }
  .part:hover::after { background:color-mix(in srgb,var(--pc) 22%, transparent); }
  .pin { position:absolute; z-index:60; width:2.1em; height:2.1em; border-radius:50%; background:var(--pc); color:#0a1628; font-weight:800; display:grid; place-items:center; font-size:1.05em; box-shadow:0 2px 8px rgba(0,0,0,.4); animation:pulse 1.8s ease-in-out infinite; pointer-events:none; font-family:'Nunito',sans-serif; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .part.found > .pin { animation:none; }
  .pin.up { top:-2.6em; left:calc(50% - 1.05em); }
  .part.sel { z-index:50; box-shadow:0 0 0 4px var(--pc), 0 0 28px color-mix(in srgb,var(--pc) 75%, transparent); }
  #p-desk.sel { box-shadow:inset 0 0 0 5px var(--pc), inset 0 0 60px color-mix(in srgb,var(--pc) 60%, transparent); z-index:2; }
  .part.ok { box-shadow:0 0 0 4px var(--c1), 0 0 28px rgba(37,211,102,.75); z-index:50; }
  #p-desk.ok { box-shadow:inset 0 0 0 5px var(--c1), inset 0 0 60px rgba(37,211,102,.6); }
  .part.bad { animation:shake .45s; box-shadow:0 0 0 4px var(--c4); z-index:50; }
  #p-desk.bad { box-shadow:inset 0 0 0 5px var(--c4); }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }
  .mode-practica .pin { display:none; }
  #p-desk { position:absolute; inset:0; }
  #p-desk .pin { left:58%; top:30%; }
  #p-task { position:absolute; left:0; right:0; bottom:0; height:3.6em; }
  #p-task > .pin { left:.8em; top:-2.6em; }
  #p-show .pin { left:auto; right:0; top:-2.6em; }
  #p-tray { position:absolute; right:1.1em; top:0; bottom:0; display:flex; align-items:center; gap:.1em; padding:0 .3em; border-radius:8px; }
  #p-tray .pin { left:calc(50% - 1.05em); }
  .sc-static .taskbar { background:transparent; border:0; backdrop-filter:none; }
  .sc-static .taskbar-bg { position:absolute; inset:0; background:rgba(238,242,248,.93); border-top:1px solid rgba(255,255,255,.5); }
  .sc-static .tk-center, .sc-static #p-tray, .sc-static .showdesk { z-index:2; }

  /* ---------- Escritorio vivo ---------- */
  .lw { position:absolute; display:flex; flex-direction:column; background:var(--win); color:var(--win-ink); border-radius:10px; border:1px solid rgba(0,0,0,.3); box-shadow:0 14px 34px rgba(0,0,0,.45); transition:transform .3s ease, opacity .3s ease; transform-origin:50% 100%; }
  .lw.is-min { opacity:0; transform:translateY(60%) scale(.2); pointer-events:none; }
  .lw-title { height:2.4em; display:flex; align-items:center; gap:.6em; padding-left:.8em; background:#e3e8ef; border-radius:10px 10px 0 0; font-weight:700; font-size:.9em; }
  .lw.active .lw-title { background:#fff; }
  .lw-name { flex:1; color:#6b7587; } .lw.active .lw-name { color:var(--win-ink); }
  .lw-x { display:flex; height:100%; color:#556; } .lw-x span { width:2.8em; display:grid; place-items:center; }
  .lw-body { flex:1; background:#fff; border-radius:0 0 10px 10px; padding:.9em 1.1em; overflow:hidden; }
  .nt-ln { height:.65em; border-radius:6px; background:#e3e8ef; margin-bottom:.65em; }
  .calc-d { background:#1b2433; color:#fff; border-radius:8px; text-align:right; padding:.4em .7em; font-size:1.4em; font-weight:800; margin-bottom:.6em; }
  .calc-g { display:grid; grid-template-columns:repeat(4,1fr); gap:.4em; }
  .calc-g span { background:#e8edf4; border-radius:7px; padding:.45em 0; text-align:center; font-weight:800; }
  .calc-g span.op { background:#dbe7f7; color:#1d4ed8; }

  .panel { position:absolute; z-index:55; bottom:4em; background:rgba(248,250,253,.97); color:var(--win-ink); border-radius:16px; box-shadow:0 16px 44px rgba(0,0,0,.55); border:1px solid rgba(0,0,0,.12); padding:1em; animation:popIn .2s ease; }
  .panel h4 { font-size:.95em; font-weight:800; margin:0 0 .6em; display:flex; align-items:center; justify-content:space-between; }
  .panel .lk { border:0; background:rgba(0,0,0,.06); border-radius:8px; padding:.3em .8em; font-weight:800; font-size:.85em; cursor:pointer; color:var(--win-ink); }
  .panel .lk:hover { background:rgba(59,130,246,.2); }
  .pn-start { left:50%; transform:translateX(-50%); width:min(34em,94%); }
  .pn-search { left:50%; transform:translateX(-50%); width:min(34em,94%); }
  .pn-fly { width:17em; }
  .sbox { width:100%; padding:.6em 1em; border-radius:100px; border:2px solid #cfd6de; font-size:1em; font-weight:700; margin-bottom:.8em; background:#fff; color:var(--win-ink); }
  .sbox:focus { border-color:#3b82f6; outline:none; }
  .pgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:.4em; margin-bottom:.9em; }
  .ptile { position:relative; text-align:center; padding:.5em .2em; border-radius:10px; font-size:.82em; font-weight:700; }
  .ptile:hover { background:rgba(0,0,0,.06); }
  .ptile .pi { font-size:2em; line-height:1.2; display:block; }
  .ptile .un { display:none; position:absolute; top:2px; right:2px; border:0; background:#fff; border-radius:50%; width:1.8em; height:1.8em; font-size:.85em; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .ptile:hover .un { display:block; }
  .rec { display:grid; grid-template-columns:1fr 1fr; gap:.4em; margin-bottom:.8em; }
  .rec div { display:flex; gap:.6em; align-items:center; padding:.4em .5em; border-radius:8px; font-size:.82em; font-weight:700; }
  .rec div:hover { background:rgba(0,0,0,.06); } .rec small { display:block; color:#6b7587; font-weight:600; }
  .rec .ri { font-size:1.5em; }
  .pfoot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid #dde2e8; padding-top:.6em; font-weight:700; font-size:.9em; }
  .alist { max-height:17em; overflow:auto; }
  .arow { display:flex; align-items:center; gap:.7em; padding:.45em .6em; border-radius:8px; font-weight:700; }
  .arow:hover { background:rgba(0,0,0,.06); } .arow .ai { font-size:1.3em; } .arow .an { flex:1; }
  .arow .pb { border:0; background:transparent; font-size:1.1em; cursor:pointer; opacity:.35; border-radius:6px; padding:.1em .3em; }
  .arow .pb.on { opacity:1; background:rgba(255,217,61,.4); } .arow .pb:hover { opacity:1; }
  .letter { font-weight:800; color:#3b82f6; padding:.4em .6em 0; font-size:.85em; }
  .res { display:flex; align-items:center; gap:.7em; padding:.5em .7em; border-radius:10px; font-weight:700; }
  .res:hover { background:rgba(0,0,0,.06); } .res .ri { font-size:1.4em; } .res .rn { flex:1; } .res small { color:#6b7587; font-weight:600; }
  .res-none { color:#6b7587; font-weight:700; padding:.5em; }
  .frow { display:flex; align-items:center; gap:.7em; padding:.55em .6em; border-radius:10px; font-weight:700; cursor:pointer; }
  .frow:hover { background:rgba(0,0,0,.06); } .frow .fi { font-size:1.3em; } .frow .fn { flex:1; } .frow small { color:#6b7587; font-weight:600; display:block; }
  .frow.on { background:rgba(37,211,102,.15); }
  .fbtn { width:100%; margin-top:.5em; padding:.6em; border:0; border-radius:10px; background:#3b82f6; color:#fff; font-weight:800; cursor:pointer; font-size:.95em; }
  .fbtn:hover { background:#2563eb; }
  .vol-r { display:flex; align-items:center; gap:.6em; } .vol-r input { flex:1; accent-color:#3b82f6; height:1.6em; }
  .vol-n { font-weight:800; width:2.4em; text-align:right; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-weight:700; font-size:.85em; }
  .cal b { color:#6b7587; font-size:.85em; padding:.2em 0; } .cal span { padding:.4em 0; border-radius:50%; }
  .cal .today { background:#3b82f6; color:#fff; font-weight:800; }
  .bigt { font-size:2.2em; font-weight:800; line-height:1.1; } .sm { color:#6b7587; font-weight:600; }

  .ov { position:absolute; inset:0; z-index:70; background:rgba(8,16,32,.8); backdrop-filter:blur(6px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1em; animation:popIn .25s ease; padding:1em; }
  .ov h3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.6em; color:var(--c3); }
  .ov-row { display:flex; gap:1em; flex-wrap:wrap; justify-content:center; }
  .th-card { width:11em; background:#fff; color:var(--win-ink); border-radius:12px; padding:.6em; cursor:pointer; border:4px solid transparent; transition:transform .15s; }
  .th-card:hover { transform:scale(1.04); border-color:var(--c3); }
  .th-card .tt { font-weight:800; font-size:.85em; margin-bottom:.4em; } .th-card .th { height:5.5em; border-radius:8px; background:#eef2f7; display:grid; place-items:center; font-size:2.4em; }
  .ov-hint { color:#cfd8e8; font-weight:700; text-align:center; }
  .ov-btn { padding:.6em 1.2em; border-radius:12px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-weight:800; cursor:pointer; }
  .ov-btn:hover { border-color:var(--c3); }
  .tip-show { position:absolute; z-index:80; bottom:4em; right:.6em; background:rgba(10,22,40,.95); color:#fff; padding:.4em .9em; border-radius:10px; font-weight:800; font-size:.9em; pointer-events:none; opacity:0; transition:opacity .2s; border:1px solid var(--c3); }
  .tip-show.on { opacity:1; }
  .toast { position:absolute; left:50%; bottom:4.4em; transform:translateX(-50%); z-index:80; background:rgba(10,22,40,.95); color:#fff; padding:.6em 1.2em; border-radius:12px; font-weight:800; border:1px solid var(--c3); opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  .toast.on { opacity:1; }
  .tools { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .tbtn { padding:10px 18px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:1rem; cursor:pointer; transition:all .2s; }
  .tbtn:hover { transform:scale(1.04); border-color:var(--c6); }

  /* ---------- Panel de información ---------- */
  .side { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; border-radius:24px; }
  .info { background:var(--card); border:1px solid rgba(255,255,255,.07); border-left:8px solid var(--ic,var(--c6)); border-radius:24px; padding:24px 26px; min-height:360px; animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both; transition:border-color .3s; }
  .info-num { display:inline-grid; place-items:center; width:46px; height:46px; border-radius:50%; background:var(--ic,var(--c6)); color:#0a1628; font-weight:800; font-size:1.3rem; margin-bottom:10px; }
  .info h2 { font-family:'Fredoka One',cursive; font-weight:400; font-size:clamp(1.6rem,2.6vw,2.3rem); line-height:1.15; margin-bottom:12px; color:var(--ic,var(--c6)); }
  .info h3 { font-family:'Fredoka One',cursive; font-weight:400; font-size:1.25rem; margin:14px 0 8px; color:var(--c3); }
  .info p { font-size:clamp(1.05rem,1.5vw,1.3rem); font-weight:600; line-height:1.5; margin-bottom:14px; }
  .info b { color:var(--c3); font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { background:rgba(255,255,255,.07); border-radius:100px; padding:6px 14px; font-weight:800; font-size:clamp(.95rem,1.3vw,1.1rem); }
  .tip { background:rgba(255,217,61,.09); border-radius:14px; padding:12px 16px; color:var(--sub); font-weight:700; font-size:clamp(.95rem,1.3vw,1.1rem); }
  .tip b { color:var(--c3); }
  .dl { list-style:none; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .dl li { display:flex; gap:12px; align-items:flex-start; background:rgba(255,255,255,.05); border-radius:12px; padding:8px 12px; font-weight:700; font-size:clamp(.95rem,1.25vw,1.1rem); line-height:1.35; }
  .dl .di2 { font-size:1.3em; min-width:1.9em; text-align:center; }
  .hello { text-align:center; padding-top:30px; } .hello .big { font-size:3.4rem; margin-bottom:8px; } .hello h2 { color:var(--text); }
  .quiz-q { font-family:'Fredoka One',cursive; font-size:clamp(1.5rem,2.6vw,2.2rem); line-height:1.2; margin-bottom:14px; }
  .quiz-q span { color:var(--c3); }
  .feedback { font-size:1.3rem; font-weight:800; min-height:2em; margin:6px 0 12px; }
  .feedback.good { color:var(--c1); } .feedback.no { color:var(--c4); }
  .btn { padding:12px 24px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--text); font-weight:800; font-size:1.05rem; cursor:pointer; transition:all .2s; }
  .btn:hover { transform:scale(1.04); border-color:var(--c6); } .btn.go { background:rgba(37,211,102,.18); border-color:var(--c1); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .trophy { font-size:4rem; animation:bounce 1s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0) rotate(-5deg);} to{transform:translateY(-12px) rotate(5deg);} }
  .lh { display:flex; align-items:center; gap:14px; margin-bottom:10px; } .lh .ico { font-size:2.4rem; }
  .lh .nm { font-family:'Fredoka One',cursive; font-size:1.5rem; line-height:1.1; color:var(--ic,var(--c6)); }
  .retos { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .retos li { display:flex; gap:10px; align-items:flex-start; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.07); font-weight:700; font-size:1rem; line-height:1.3; transition:all .25s; }
  .retos .rb { width:24px; height:24px; border-radius:7px; flex-shrink:0; background:rgba(255,255,255,.1); display:grid; place-items:center; font-weight:800; font-size:.85rem; }

<script>
const PARTES = {
  desk:{n:1, nombre:"Escritorio", det:"el escritorio", color:"--c8", sitio:"Toda la pantalla, por detrás de las ventanas.",
    texto:"Es <b>lo primero que ves</b> del sistema al encender el ordenador y lo que más vas a utilizar. Aquí están el fondo, los iconos y las ventanas que abres.",

    chips:["🪟 Inicio","🔍 Buscador","🗗 Tareas","🔔 Notificaciones"], tip:"Contiene casi todas las demás partes que vamos a descubrir."},
  start:{n:3, nombre:"Botón de inicio", det:"el botón de inicio", color:"--c1", sitio:"En el centro de la barra de tareas (Windows 11).",
    texto:"Tiene la apariencia de una <b>ventana con cuatro paneles</b>. Al pulsarlo se despliega el <b>menú de inicio</b>, con accesos a aplicaciones y configuraciones.",
    chips:["🖱️ Clic","⌨️ Tecla Windows"], tip:"También se abre con la <b>tecla Windows</b> del teclado. En versiones antiguas de Windows estaba a la izquierda."},
  search:{n:4, nombre:"Barra de búsqueda", det:"la barra de búsqueda", color:"--c7", sitio:"Junto al botón de inicio.",
    texto:"Escribe aquí para encontrar <b>archivos, aplicaciones, configuraciones y documentos</b> del equipo. Con Internet, también muestra <b>resultados de la web</b>.",
    chips:["📄 Archivos","📦 Programas","⚙️ Configuración","🌐 Web"], tip:"<b>Prueba en el modo Probar:</b> escribe «calculadora»."},
  view:{n:5, nombre:"Vista de tareas", det:"la vista de tareas", color:"--c9", sitio:"A la derecha de la búsqueda.",
    texto:"Muestra las <b>aplicaciones abiertas</b> y permite <b>gestionarlas</b>: elegir con cuál quieres trabajar.",
    chips:["🗗 Ventanas abiertas"], tip:"Atajo de teclado: <b>Windows + Tab</b>."},
  tray:{n:6, nombre:"Área de notificación", det:"el área de notificación", color:"--c3", sitio:"A la derecha de la barra de tareas.",
    texto:"Accesos directos a <b>configuraciones rápidas</b>. De izquierda a derecha:",
    lista:[["⌃","Flecha hacia arriba: iconos ocultos, como el del <b>pen drive</b> para desconectar el USB correctamente."],
           ["ESP","Indica que el <b>teclado</b> está configurado en <b>español</b>."],
           ["📶","<b>Wi-Fi</b>: señal, redes disponibles y a cuál estás conectado."],
           ["🔊","<b>Altavoz</b>: subir, bajar o apagar el volumen."],
           ["🔋","<b>Batería</b>: la carga que te queda."],
           ["🕐","<b>Fecha y hora</b> del sistema."]], tip:""},
  show:{n:7, nombre:"Mostrar escritorio", det:"el botón Mostrar escritorio", color:"--c4", sitio:"En la esquina inferior derecha, en el borde de la pantalla.",
    texto:"Lleva el ratón a la <b>esquina inferior derecha</b>; cuando aparezca «Mostrar escritorio», haz clic con el botón izquierdo: <b>todas las ventanas se minimizan</b> y queda el escritorio vacío.",
    chips:["🖱️ Esquina","🧹 Escritorio vacío"], tip:"Si lo pulsas otra vez, las ventanas vuelven."}
};
const ORDEN = Object.keys(PARTES);
const $ = id => document.getElementById(id);
const info = $("info");
let modo = "desc";
const restart = e => { e.style.animation="none"; e.offsetHeight; e.style.animation=""; };

/* ---------- Descubrir / Practicar ---------- */
const KEY = "escritorio-partes-2026";
let found = {}, pregunta = null, aciertos = 0, hechas = [];
try { const g = JSON.parse(localStorage.getItem(KEY)); if (g && g.found) found = g.found; } catch(e){}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify({found})); } catch(e){} };
const part = k => document.querySelector('#sc1 [data-part="'+k+'"]');
ORDEN.forEach(k => part(k).style.setProperty("--pc","var("+PARTES[k].color+")"));
const limpiar = () => document.querySelectorAll("#sc1 .part").forEach(p => p.classList.remove("sel","ok","bad"));
function pintarPins(){ ORDEN.forEach(k => { const p = part(k); p.classList.toggle("found", !!found[k]); p.querySelector(":scope > .pin").textContent = found[k] ? PARTES[k].n : "?"; }); }

function detalle(d){
  return '<div class="info-num">'+d.n+'</div><h2>'+d.nombre+'</h2><p>'+d.texto+'</p>' +
    (d.lista ? '<ul class="dl">'+d.lista.map(x=>'<li><span class="di2">'+x[0]+'</span><span>'+x[1]+'</span></li>').join("")+'</ul>' : '') +
    '<p style="color:var(--sub);font-size:1.05rem">📍 '+d.sitio+'</p>' +
    (d.chips ? '<div class="chips">'+d.chips.map(c=>'<span class="chip">'+c+'</span>').join("")+'</div>' : '') +
    (d.tip ? '<div class="tip">'+d.tip+'</div>' : '');
}
function bienvenida(){
  limpiar(); info.style.setProperty("--ic","var(--c6)");
  info.innerHTML = '<div class="hello"><div class="big">👆</div><h2>Toca una parte del escritorio</h2><p>Hay <b>7 partes</b> con un <b>?</b>. Vamos a descubrirlas juntos.</p></div>';
  restart(info);
}
function mostrar(k){
  const d = PARTES[k];
  limpiar(); part(k).classList.add("sel");
  found[k] = true; guardar(); pintarPins(); progreso();
  info.style.setProperty("--ic","var("+d.color+")");
  info.innerHTML = detalle(d); restart(info);
  if (Object.keys(found).length === ORDEN.length)
    { info.insertAdjacentHTML("beforeend",'<div class="row"><button class="btn go" id="to-live" type="button">🛠️ ¡Ahora a probarlo!</button></div>'); $("to-live").onclick = () => setModo("live"); }
}
function nueva(){
  limpiar();
  const quedan = ORDEN.filter(k => !hechas.includes(k));
  if (!quedan.length) return final();
  pregunta = quedan[Math.floor(Math.random()*quedan.length)];
  info.style.setProperty("--ic","var(--c3)");
  info.innerHTML = '<div class="info-num">🎯</div><div class="quiz-q">Toca<br><span>'+PARTES[pregunta].det+'</span></div><div class="feedback" id="fb"></div>';
  restart(info); progreso();
}
function responder(k){
  if (!pregunta) return;
  const fb = $("fb");
  if (k === pregunta){
    limpiar(); part(k).classList.add("ok"); hechas.push(k); aciertos++; pregunta = null; progreso();
    fb.className = "feedback good"; fb.textContent = "✅ ¡Correcto! " + PARTES[k].nombre;
    info.insertAdjacentHTML("beforeend",'<p style="color:var(--sub)">'+PARTES[k].texto+'</p><div class="row"><button class="btn go" id="sig" type="button">'+(hechas.length===ORDEN.length?"🏆 Terminar":"Siguiente ➜")+'</button></div>');
    $("sig").onclick = nueva;
  } else {
    const p = part(k); p.classList.remove("bad"); p.offsetHeight; p.classList.add("bad"); setTimeout(()=>p.classList.remove("bad"),900);
    fb.className = "feedback no"; fb.textContent = "❌ Eso es " + PARTES[k].det + ". ¡Inténtalo otra vez!";
  }
}
function final(){
  limpiar(); info.style.setProperty("--ic","var(--c3)");
  info.innerHTML = '<div class="hello"><div class="trophy">🏆</div><h2 style="color:var(--c3)">¡Enhorabuena!</h2><p>Ya conoces las <b>7 partes</b> del escritorio.</p><div class="row" style="justify-content:center"><button class="btn go" id="otra" type="button">🔄 Practicar otra vez</button></div></div>';
  restart(info); $("otra").onclick = () => { hechas=[]; aciertos=0; nueva(); };
}
document.querySelectorAll("#sc1 .part").forEach(p => p.addEventListener("click", e => {
  if (e.target.closest(".part") !== p) return;
  modo === "desc" ? mostrar(p.dataset.part) : responder(p.dataset.part);
}));

/* ---------- Probar ---------- */
const APPS = [
  ["📅","Calendario"],["🧮","Calculadora"],["⚙️","Configuración"],["✉️","Correo"],["🌐","Edge"],
  ["📁","Explorador de archivos"],["🖼️","Fotos"],["🗺️","Mapas"],["📝","Bloc de notas"],["🎨","Paint"],["⏰","Reloj"],["🛍️","Tienda"]
];
const BUSQ = [
  ["🧮","Calculadora","Aplicación"],["📝","Bloc de notas","Aplicación"],["🎨","Paint","Aplicación"],["🌐","Edge","Aplicación"],
  ["📄","Lista de la compra.docx","Archivo"],["🖼️","Foto de la playa.jpg","Archivo"],["📊","Gastos.xlsx","Archivo"],
  ["📶","Configuración de Wi-Fi","Configuración"],["🔊","Configuración de sonido","Configuración"],["🖥️","Fondo de pantalla","Configuración"]
];
const REDES = [["Casa_5G",3],["Vecino_WiFi",2],["Biblioteca",1]];
const RETOS = [
  {id:"start", t:"Abrir el menú de Inicio", h:"Botón de inicio o tecla Windows"},
  {id:"allapps", t:"Ver Todas las aplicaciones", h:"Dentro del menú de inicio"},
  {id:"pin", t:"Anclar o desanclar una aplicación", h:"📌 en la lista, o ✕ sobre una anclada"},
  {id:"search", t:"Buscar algo", h:"Barra de búsqueda: escribe «calculadora»"},
  {id:"view", t:"Ver las ventanas abiertas", h:"Icono de Vista de tareas"},
  {id:"usb", t:"Expulsar el USB", h:"Flecha ⌃ → Expulsar"},

];
const LI = {
  none:{ico:"👆", nombre:"Toca la barra de tareas", c:"--c6", texto:"Prueba los botones de la <b>barra de tareas</b>. Aquí verás qué hace cada uno."},
  start:{ico:"🪟", nombre:"Menú de inicio", c:"--c1", texto:"Da acceso a <b>aplicaciones ancladas</b>, <b>recomendaciones</b> (archivos y aplicaciones recientes) y a la lista de <b>todas las aplicaciones</b>."},
  allapps:{ico:"🔤", nombre:"Todas las aplicaciones", c:"--c1", texto:"Permite navegar por <b>todas las aplicaciones instaladas</b> en una lista ordenada <b>alfabéticamente</b>. Con el 📌 anclas o desanclas."},
  pin:{ico:"📌", nombre:"Anclar y desanclar", c:"--c1", texto:"Puedes <b>anclar</b> tus aplicaciones favoritas para que siempre estén visibles en el menú de inicio, o <b>desanclarlas</b>."},
  search:{ico:"🔍", nombre:"Barra de búsqueda", c:"--c7", texto:"Busca <b>archivos, aplicaciones, configuraciones y documentos</b> del equipo y, con Internet, también <b>en la web</b>."},
  view:{ico:"🗗", nombre:"Vista de tareas", c:"--c9", texto:"Muestra las <b>aplicaciones abiertas</b> y permite gestionarlas. Atajo: <b>Windows + Tab</b>."},
  usb:{ico:"⌃", nombre:"Iconos ocultos y USB", c:"--c3", texto:"La flecha hacia arriba muestra el icono con forma de <b>pen drive</b>: sirve para <b>desconectar correctamente</b> un dispositivo USB."},
  lang:{ico:"⌨️", nombre:"Idioma del teclado", c:"--c3", texto:"Donde pone <b>ESP</b> indica que el teclado está configurado en <b>español</b>."},
  wifi:{ico:"📶", nombre:"Wi-Fi", c:"--c3", texto:"Con este icono (parecido a un abanico) ves la <b>señal</b>, las <b>redes</b> a las que puedes conectarte y a cuál estás conectado."},

  bat:{ico:"🔋", nombre:"Batería", c:"--c3", texto:"Indica la <b>carga</b> que le queda a la batería."},
  clock:{ico:"🕐", nombre:"Fecha y hora", c:"--c3", texto:"Muestra la <b>fecha y hora</b> del sistema. Si haces clic, aparece el calendario."},
  show:{ico:"🧹", nombre:"Mostrar escritorio", c:"--c4", texto:"Minimiza <b>todas las ventanas</b> a la vez y deja el escritorio vacío. Pulsa otra vez y vuelven."}
};
let retos = {}, cur = "none", liveReady = false, panel = null, ov = null;

const ico = n => (APPS.find(a=>a[1]===n)||["📦"])[0];

function tick(id){ if (!retos[id]) { retos[id] = true; progreso(); } renderInfo(); }
function say(k){ cur = k; renderInfo(); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2400); }
const live = k => document.querySelector('[data-live="'+k+'"]');

/* ----- Ventanas ----- */
function renderWins(){
  ["notas","calc"].forEach(id => {
    const w = $("w-"+id), h = S.win[id].hidden;
    w.classList.toggle("is-min", h); w.classList.toggle("active", !h && S.focus === id);
    w.style.zIndex = S.focus === id ? 5 : 4;
    live("app-"+id).classList.toggle("act", !h && S.focus === id);
  });
}
function appClick(id){
  closePanel();
  if (S.win[id].hidden) { S.win[id].hidden = false; S.focus = id; }
  else if (S.focus === id) S.win[id].hidden = true;
  else S.focus = id;
  renderWins();
}
function showDesktop(){
  closePanel();
  if (!S.showAll) { S.showAll = true; S.memo = {n:S.win.notas.hidden, c:S.win.calc.hidden}; S.win.notas.hidden = S.win.calc.hidden = true; toast("Escritorio despejado: pulsa otra vez para recuperar las ventanas"); }
  else { S.showAll = false; S.win.notas.hidden = S.memo.n; S.win.calc.hidden = S.memo.c; }
  renderWins(); tick("show"); say("show");
}

/* ----- Paneles ----- */

function openPanel(name, cls, html, anchor){

  panel = name;
  const host = $("panelHost"); host.innerHTML = '<div class="panel '+cls+'">'+html+'</div>';
  const p = host.firstElementChild, sr = $("sc2").getBoundingClientRect();
  if (anchor && cls.includes("pn-fly")) {
    const ar = anchor.getBoundingClientRect(), pw = p.offsetWidth;
    p.style.left = Math.max(8, Math.min(sr.width - pw - 8, ar.left - sr.left + ar.width/2 - pw/2)) + "px";
  }
  return p;
}

/* Inicio */
function startHTML(){
  if (S.all) {
    const list = [...APPS].sort((a,b)=>a[1].localeCompare(b[1],"es"));
    let last = "", rows = "";
    list.forEach(a => { const L = a[1][0].toUpperCase(); if (L !== last) { rows += '<div class="letter">'+L+'</div>'; last = L; }
      const on = S.pinned.includes(a[1]);
      rows += '<div class="arow"><span class="ai">'+a[0]+'</span><span class="an">'+a[1]+'</span><button class="pb'+(on?' on':'')+'" data-pin="'+a[1]+'" type="button" title="'+(on?'Desanclar':'Anclar')+' de Inicio">📌</button></div>'; });
    return '<h4>Todas las aplicaciones <button class="lk" id="st-back" type="button">‹ Atrás</button></h4><div class="alist">'+rows+'</div>';
  }
  return '<h4>Ancladas <button class="lk" id="st-all" type="button">Todas las aplicaciones ›</button></h4><div class="pgrid">' +
    S.pinned.map(n => '<div class="ptile"><button class="un" data-pin="'+n+'" type="button" title="Desanclar">✕</button><span class="pi">'+ico(n)+'</span>'+n+'</div>').join("") + '</div>' +
    '<h4>Recomendaciones</h4><div class="rec"><div><span class="ri">📄</span><span>Lista de la compra<small>Hace 5 min</small></span></div><div><span class="ri">🖼️</span><span>Foto de la playa<small>Ayer</small></span></div><div><span class="ri">📊</span><span>Gastos<small>Hace 2 días</small></span></div><div><span class="ri">🧮</span><span>Calculadora<small>Reciente</small></span></div></div>' +
    '<div class="pfoot"><span>👤 Usuario</span><span>⏻</span></div>';
}
function wireStart(p){
  p.querySelectorAll("[data-pin]").forEach(b => b.onclick = e => { e.stopPropagation();
    const n = b.dataset.pin, i = S.pinned.indexOf(n);
    if (i >= 0) { S.pinned.splice(i,1); toast("«"+n+"» desanclada de Inicio"); } else { S.pinned.push(n); toast("«"+n+"» anclada a Inicio"); }
    tick("pin"); say("pin"); p.innerHTML = startHTML(); wireStart(p); });
  const a = p.querySelector("#st-all"); if (a) a.onclick = () => { S.all = true; tick("allapps"); say("allapps"); p.innerHTML = startHTML(); wireStart(p); };
  const b = p.querySelector("#st-back"); if (b) b.onclick = () => { S.all = false; p.innerHTML = startHTML(); wireStart(p); };
}
function openStart(){ S.all = false; const p = openPanel("start","pn-start",startHTML()); if (!p) return say("none"); wireStart(p); tick("start"); say("start"); }

/* Búsqueda */
function searchHTML(){ return '<input class="sbox" id="sq" type="text" placeholder="Escribe aquí para buscar" autocomplete="off"><div id="sres"></div>'; }
function renderRes(q){
  const r = $("sres"); q = q.trim().toLowerCase();
  if (!q) { r.innerHTML = '<div class="res-none">Escribe, por ejemplo, «calculadora» o «foto».</div>'; return; }
  const hits = BUSQ.filter(x => x[1].toLowerCase().includes(q));
  r.innerHTML = hits.map(x => '<div class="res"><span class="ri">'+x[0]+'</span><span class="rn">'+x[1]+'</span><small>'+x[2]+'</small></div>').join("") +
    '<div class="res"><span class="ri">🌐</span><span class="rn">Buscar «'+q.replace(/</g,"&lt;")+'» en la web</span><small>Web</small></div>';
  if (hits.length) tick("search");
}
function openSearch(){ const p = openPanel("search","pn-search",searchHTML()); if (!p) return say("none"); const i = p.querySelector("#sq"); i.focus(); i.oninput = () => renderRes(i.value); renderRes(""); say("search"); }

/* Vista de tareas */
function openView(){
  closePanel(); say("view");
  const list = ["notas","calc"].filter(id => !S.win[id].hidden);
  const N = {notas:["📝","Bloc de notas"], calc:["🧮","Calculadora"]};
  tick("view");
  if (!list.length) { toast("No hay ventanas abiertas a la vista"); return; }
  $("ovHost").innerHTML = '<div class="ov"><h3>Vista de tareas</h3><div class="ov-row">'+list.map(id=>'<div class="th-card" data-id="'+id+'"><div class="tt">'+N[id][0]+' '+N[id][1]+'</div><div class="th">'+N[id][0]+'</div></div>').join("")+'</div><div class="ov-hint">Toca la ventana con la que quieres trabajar.</div><button class="ov-btn" id="ov-x" type="button">Cerrar</button></div>';
  $("ovHost").querySelectorAll(".th-card").forEach(c => c.onclick = () => { S.focus = c.dataset.id; $("ovHost").innerHTML = ""; renderWins(); });
  $("ov-x").onclick = () => $("ovHost").innerHTML = "";
}

/* Bandeja */
function volIcon(){ return S.muted || S.vol === 0 ? "🔇" : S.vol < 35 ? "🔈" : S.vol < 70 ? "🔉" : "🔊"; }
function openUsb(a){
  const p = openPanel("usb","pn-fly", '<h4>Iconos ocultos</h4>' + (S.usb ? '<div class="frow"><span class="fi">💾</span><span class="fn">Pen drive (E:)<small>Dispositivo USB conectado</small></span></div><button class="fbtn" id="eject" type="button">⏏ Expulsar el USB</button>' : '<div class="res-none">No hay ningún USB conectado.</div><button class="fbtn" id="plug" type="button">🔌 Volver a conectarlo</button>'), a);
  if (!p) return say("none"); say("usb");
  const e = p.querySelector("#eject"); if (e) e.onclick = () => { S.usb = false; tick("usb"); closePanel(); toast("✅ Ya puedes quitar el USB con seguridad"); };
  const g = p.querySelector("#plug"); if (g) g.onclick = () => { S.usb = true; closePanel(); toast("USB conectado"); };
}
function openLang(a){
  const p = openPanel("lang","pn-fly",'<h4>Idioma del teclado</h4><div class="frow'+(S.lang==="ESP"?' on':'')+'" data-l="ESP"><span class="fi">🇪🇸</span><span class="fn">Español<small>España · ESP</small></span></div><div class="frow'+(S.lang==="ENG"?' on':'')+'" data-l="ENG"><span class="fi">🇬🇧</span><span class="fn">Inglés<small>Reino Unido · ENG</small></span></div>', a);
  if (!p) return say("none"); say("lang"); tick("lang");
  p.querySelectorAll("[data-l]").forEach(r => r.onclick = () => { S.lang = r.dataset.l; $("lv-lang").textContent = S.lang; closePanel(); });
}
function openWifi(a){
  const bars = n => "▂▄▆".slice(0,n) + "░".repeat(3-n);
  const p = openPanel("wifi","pn-fly",'<h4>Wi-Fi</h4>'+REDES.map(r=>'<div class="frow'+(S.wifi===r[0]?' on':'')+'" data-n="'+r[0]+'"><span class="fi">📶</span><span class="fn">'+r[0]+'<small>'+(S.wifi===r[0]?'Conectado':'Disponible')+' · señal '+bars(r[1])+'</small></span></div>').join(""), a);
  if (!p) return say("none"); say("wifi");
  p.querySelectorAll("[data-n]").forEach(r => r.onclick = () => { S.wifi = r.dataset.n; tick("wifi"); closePanel(); toast("📶 Conectado a "+S.wifi); });
}
function openVol(a){
  const p = openPanel("vol","pn-fly",'<h4>Volumen</h4><div class="vol-r"><button class="lk" id="mute" type="button">'+(S.muted?'🔇':'🔊')+'</button><input id="vr" type="range" min="0" max="100" value="'+(S.muted?0:S.vol)+'"><span class="vol-n" id="vn">'+(S.muted?0:S.vol)+'</span></div><div class="sm" style="margin-top:.6em">Arrastra para subir o bajar. El altavoz apaga el sonido.</div>', a);
  if (!p) return say("none"); say("vol");
  const r = p.querySelector("#vr"), n = p.querySelector("#vn"), m = p.querySelector("#mute");
  const upd = () => { $("lv-vol").textContent = volIcon(); n.textContent = S.muted ? 0 : S.vol; m.textContent = S.muted ? "🔇" : "🔊"; };
  r.oninput = () => { S.vol = +r.value; S.muted = false; upd(); tick("vol"); };
  m.onclick = () => { S.muted = !S.muted; r.value = S.muted ? 0 : S.vol; upd(); tick("vol"); };
}
function openBat(a){
  const p = openPanel("bat","pn-fly",'<h4>Batería</h4><div class="bigt">🔋 76 %</div><div class="sm">Quedan unas 3 h 20 min</div><div style="height:.9em;background:#dde2e8;border-radius:8px;margin-top:.8em;overflow:hidden"><div style="width:76%;height:100%;background:#25D366"></div></div>', a);
  if (!p) return say("none"); say("bat"); tick("bat");
}
function openClock(a){
  const d = new Date(2026,9,14), first = new Date(2026,9,1), off = (first.getDay()+6)%7, days = 31;
  let cells = ["L","M","X","J","V","S","D"].map(x=>'<b>'+x+'</b>').join("");
  for (let i=0;i<off;i++) cells += '<span></span>';
  for (let i=1;i<=days;i++) cells += '<span'+(i===14?' class="today"':'')+'>'+i+'</span>';
  const p = openPanel("clock","pn-fly",'<div class="bigt">10:30</div><div class="sm" style="margin-bottom:.7em">miércoles, 14 de octubre de 2026</div><div class="cal">'+cells+'</div>', a);
  if (!p) return say("none"); say("clock"); tick("clock");
}

function buildLive(){
  live("start").onclick = openStart;
  live("search").onclick = openSearch; live("search").onkeydown = e => { if (e.key === "Enter") openSearch(); };
  live("view").onclick = openView;
  live("app-notas").onclick = () => appClick("notas"); live("app-calc").onclick = () => appClick("calc");
  [["usb",openUsb],["lang",openLang],["wifi",openWifi],["vol",openVol],["bat",openBat],["clock",openClock]].forEach(([k,f]) => live(k).onclick = () => f(live(k)));
  const sh = live("show"), tp = $("tipShow");
  sh.onclick = showDesktop; sh.onpointerenter = () => tp.classList.add("on"); sh.onpointerleave = () => tp.classList.remove("on");
  $("sc2").addEventListener("pointerdown", e => { if (!e.target.closest(".panel") && !e.target.closest(".taskbar") && !e.target.closest(".ov")) closePanel(); });
  $("b-reset").onclick = resetLive;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && modo === "live") { closePanel(); $("ovHost").innerHTML = ""; } });
}
function resetLive(){
  closePanel(); $("ovHost").innerHTML = "";
  Object.assign(S, {pinned:["Edge","Explorador de archivos","Bloc de notas","Calculadora","Fotos","Correo","Configuración","Calendario"], all:false, vol:60, muted:false, lang:"ESP", wifi:"Casa_5G", usb:true, showAll:false, focus:"notas"});
  S.win.notas.hidden = S.win.calc.hidden = false;
  $("lv-lang").textContent = "ESP"; $("lv-vol").textContent = "🔊";
  renderWins(); cur = "none"; renderInfo();
}
function renderInfo(){
  if (modo !== "live") return;
  const d = LI[cur]; info.style.setProperty("--ic","var("+d.c+")");
  const n = Object.keys(retos).length;
  info.innerHTML = (n === RETOS.length ? '<div class="win-all">🏆 ¡Todos los retos superados!</div>' : '') +
    '<div class="lh"><span class="ico">'+d.ico+'</span><div class="nm">'+d.nombre+'</div></div><p>'+d.texto+'</p>' +
    '<h3>Retos (se marcan solos)</h3><ul class="retos">' + RETOS.map(r => '<li class="'+(retos[r.id]?'on':'')+'"><span class="rb">'+(retos[r.id]?'✓':'')+'</span><span class="rt">'+r.t+'<small>'+r.h+'</small></span></li>').join("") + '</ul>';
}

/* ---------- Progreso y modos ---------- */
function progreso(){
  let n, tot, txt;
  if (modo === "desc") { n = Object.keys(found).length; tot = ORDEN.length; txt = "⭐ "+n+" de "+tot+" partes descubiertas"; }
  else if (modo === "prac") { n = aciertos; tot = ORDEN.length; txt = "🎯 "+n+" de "+tot+" aciertos"; }
  else { n = Object.keys(retos).length; tot = RETOS.length; txt = "🛠️ "+n+" de "+tot+" retos superados"; }
  $("prog-txt").textContent = txt; $("prog-fill").style.width = (n/tot*100)+"%";
}
function setModo(m){
  modo = m; pregunta = null;
  ["desc","live","prac"].forEach(x => $("m-"+x).classList.toggle("on", m === x));
  $("root").classList.toggle("mode-practica", m === "prac");
  $("stage-parts").hidden = m === "live"; $("stage-live").hidden = m !== "live";
  if (m === "live") { if (!liveReady) { buildLive(); liveReady = true; } renderWins(); renderInfo(); progreso(); }
  else if (m === "desc") { pintarPins(); bienvenida(); progreso(); }
  else { hechas = []; aciertos = 0; nueva(); }
}
$("m-desc").onclick = () => setModo("desc"); $("m-live").onclick = () => setModo("live"); $("m-prac").onclick = () => setModo("prac");
$("reset").onclick = () => { found = {}; retos = {}; guardar(); if (liveReady) resetLive(); setModo(modo); };
setModo("desc");
</script>
</body>

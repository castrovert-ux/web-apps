<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Misión: copiar y pegar archivos!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4da3ff;--green:#25d366;--yellow:#ffd93d;--red:#ff6b6b;--purple:#c38bff;--orange:#ff9f43;--bg:#0a1628;--card:#111d35;--sub:#9aabc9;--win:#f4f6f9;--ink:#1b2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Nunito,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.14}.b1{width:450px;height:450px;background:var(--blue);top:-100px;left:-80px}.b2{width:400px;height:400px;background:var(--red);right:-80px;bottom:-100px}
main{position:relative;z-index:1;max-width:1500px;margin:auto;padding:22px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}.badge{border-radius:99px;padding:7px 15px;background:linear-gradient(135deg,var(--blue),#286ed1);font-weight:800;font-size:.8rem;letter-spacing:1px}
h1{font:600 clamp(1.7rem,3vw,2.6rem) Fredoka,sans-serif;margin:0;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow));background-clip:text;color:transparent}
.modes{margin-left:auto;display:flex;gap:8px}.mode,.btn,.reset{font:800 1rem Nunito;cursor:pointer;border-radius:13px;padding:10px 17px;border:2px solid #ffffff2b;color:#fff;background:#ffffff0b}.mode.on{border-color:var(--blue);background:#4da3ff22}
.progress{display:flex;align-items:center;gap:12px;color:var(--sub);font-weight:800;margin:12px 0 18px}.bar{height:10px;flex:1;background:#ffffff14;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow));transition:width .3s}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:20px;align-items:start}
.window{background:var(--win);color:var(--ink);border-radius:15px;overflow:hidden;box-shadow:0 20px 50px #0007;font-size:clamp(.78rem,1.05vw,.98rem)}
.titlebar{background:#e4e9f0;padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:800}.controls{margin-left:auto;letter-spacing:12px;color:#566070}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:white;border-bottom:1px solid #dce2e9}.tool{padding:7px 10px;border-radius:8px;background:#eef3fa;font-weight:800;cursor:pointer;border:1px solid transparent}.tool:hover{border-color:#9dbbe0;background:#dceafa}.tool:disabled{opacity:.4;cursor:not-allowed}
.path{padding:9px 13px;background:#f7f8fa;border-bottom:1px solid #dce2e9;font-weight:700;color:#4c5a6d}
.explorer{display:grid;grid-template-columns:155px 1fr;min-height:350px}.nav{background:#edf1f6;padding:14px 8px;border-right:1px solid #dce2e9}.nav div{padding:8px;border-radius:7px;margin-bottom:3px;cursor:pointer;font-weight:700}.nav div.active{background:#d9e7fa}.files{padding:17px;display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:9px;align-content:start;min-height:350px}
.item{border:2px solid transparent;border-radius:10px;padding:10px 4px 8px;text-align:center;cursor:pointer;min-width:0;position:relative;color:var(--ink);user-select:none}.item:hover{background:#e9f1fc}.item.selected{background:#d9e9ff;border-color:#4d91e7}.item .emoji{font-size:2.5rem;line-height:1.25}.item .name{font-size:.83rem;font-weight:800;overflow-wrap:anywhere}.item .kind{font-size:.72rem;color:#64748b}.item.ghost{opacity:.42}
.side{position:sticky;top:12px}.panel{background:var(--card);border:1px solid #ffffff12;border-left:7px solid var(--blue);border-radius:22px;padding:25px;min-height:340px}.panel h2{font:500 clamp(1.55rem,2.3vw,2.2rem) Fredoka;margin:8px 0 12px;color:var(--blue)}.panel p{font-size:1.08rem;line-height:1.5;font-weight:700}.panel b{color:var(--yellow)}.tip{background:#ffd93d12;color:var(--sub);padding:13px 15px;border-radius:13px;font-weight:800;line-height:1.45;margin-top:15px}.task{font:500 clamp(1.3rem,2vw,1.8rem) Fredoka;line-height:1.25}.feedback{font-size:1.05rem;font-weight:800;min-height:28px;margin-top:12px}.good{color:var(--green)}.bad{color:var(--red)}.btn{margin-top:12px}.btn.go{border-color:var(--green);background:#25d3661c}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:.9rem;color:#637187;font-weight:700;margin:10px 13px}.footer{text-align:center;margin:18px}.reset{color:var(--sub)}.toast{padding:9px 12px;border-radius:9px;background:#e4f7ec;color:#166534;font-weight:800;margin:0 12px 12px;display:none}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static}.modes{margin-left:0}.explorer{grid-template-columns:120px 1fr}.files{min-height:300px}}
@media(max-width:520px){main{padding:12px}.explorer{grid-template-columns:1fr}.nav{display:flex;gap:5px;overflow:auto}.nav div{white-space:nowrap}.files{min-height:290px}.panel{padding:19px}}
</style>
</head>
<body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<main>
<header><span class="badge">📁 AVENTURA DIGITAL</span><h1>¡Misión: copiar y pegar archivos!</h1><div class="modes"><button class="mode on" id="discover">🔎 Descubrir</button><button class="mode" id="practice">🎯 Practicar</button></div></header>
<div class="progress"><span id="progtext">⭐ 0 de 5 conceptos descubiertos</span><div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="layout">
<section class="window" aria-label="Explorador de archivos simulado">
<div class="titlebar"><span>📁</span><span id="windowtitle">Explorador de archivos</span><span class="controls">— □ ×</span></div>
<div class="toolbar">
<button class="tool" id="copybtn" title="Copiar (Ctrl+C)">📄 Copiar</button><button class="tool" id="cutbtn" title="Cortar (Ctrl+X)">✂️ Cortar</button><button class="tool" id="pastebtn" title="Pegar (Ctrl+V)">📋 Pegar</button><button class="tool" id="undo" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
</div><div class="path" id="path">💻 Este equipo　›　Documentos</div>
<div class="explorer"><nav class="nav" id="nav"><div class="active" data-folder="Documentos">📄 Documentos</div><div data-folder="Fotos">🖼️ Fotos</div><div data-folder="Trabajo">💼 Trabajo</div><div data-folder="Pendrive">💾 Pendrive</div></nav><div class="files" id="files"></div></div>
<div class="status" id="status">Selecciona un archivo o una carpeta con un clic.</div><div class="toast" id="toast"></div>
</section>
<aside class="side"><div class="panel" id="panel"></div></aside>
</div><div class="footer"><button class="reset" id="reset">🔄 Empezar de nuevo</button></div>
</main>
<script>
const initial={
 Documentos:[{id:'informe',name:'Informe.docx',type:'doc',emoji:'📘'},{id:'presupuesto',name:'Presupuesto.xlsx',type:'sheet',emoji:'📊'},{id:'vacaciones',name:'Vacaciones',type:'folder',emoji:'📁'},{id:'carta',name:'Carta.docx',type:'doc',emoji:'📄'}],
 Fotos:[{id:'playa',name:'Playa.jpg',type:'image',emoji:'🏖️'},{id:'montaña',name:'Montaña.jpg',type:'image',emoji:'🏔️'},{id:'familia',name:'Familia',type:'folder',emoji:'📁'}],
 Trabajo:[{id:'reunion',name:'Reunión.docx',type:'doc',emoji:'📝'},{id:'datos',name:'Datos.xlsx',type:'sheet',emoji:'📊'}],
 Pendrive:[{id:'musica',name:'Música.mp3',type:'audio',emoji:'🎵'},{id:'recibo',name:'Recibo.pdf',type:'pdf',emoji:'📕'}]
};
const concepts=[
 {title:'Seleccionar un elemento',text:'Haz <b>un clic</b> sobre un archivo o una carpeta para seleccionarlo. El doble clic sirve para abrirlo.',tip:'Prueba a seleccionar un archivo. Debe quedar resaltado en azul.',check:()=>!!selected.length},
 {title:'Copiar',text:'<b>Copiar</b> crea otra copia y conserva el elemento original. Primero selecciona el elemento y después pulsa Copiar o <b>Ctrl + C</b>.',tip:'Después abre la carpeta de destino y pulsa Pegar o Ctrl + V.',check:()=>clipboard?.action==='copy'},
 {title:'Cortar',text:'<b>Cortar</b> prepara el elemento para moverlo. Cuando lo pegas en otro lugar, deja de estar en la carpeta original. Atajo: <b>Ctrl + X</b>.',tip:'Usa Cortar cuando quieras cambiar un archivo de carpeta, no conservar dos.',check:()=>clipboard?.action==='cut'},
 {title:'Pegar',text:'Pegar coloca en la carpeta abierta lo que hayas copiado o cortado. Atajo: <b>Ctrl + V</b>. El portapapeles guarda temporalmente la última selección.',tip:'Selecciona algo, cópialo y cambia de carpeta para probar Pegar.',check:()=>lastPaste},
 {title:'Copiar una carpeta',text:'Al copiar una carpeta, también se copian los archivos y las subcarpetas que contiene. Puedes pegar la copia más de una vez.',tip:'Fíjate en el icono 📁: representa una carpeta, no un archivo.',check:()=>clipboard?.items?.some(x=>x.type==='folder')}
];
let data,folder,selected=[],clipboard=null,mode='discover',found={},conceptIndex=0,taskIndex=0,score=0,lastPaste=false,history=[],taskDone=false;
const $=id=>document.getElementById(id);
function clone(x){return JSON.parse(JSON.stringify(x))}
function init(){data=clone(initial);folder='Documentos';selected=[];clipboard=null;found={};conceptIndex=0;taskIndex=0;score=0;lastPaste=false;history=[];taskDone=false;mode='discover';$('discover').classList.add('on');$('practice').classList.remove('on');renderFiles();renderPanel();updateProgress();setStatus('Selecciona un archivo o una carpeta con un clic.');}
function renderFiles(){
 $('files').innerHTML='';$('path').textContent='💻 Este equipo　›　'+folder;$('windowtitle').textContent=folder;
 data[folder].forEach(item=>{let d=document.createElement('div');d.className='item'+(selected.includes(item.id)?' selected':'')+(clipboard?.action==='cut'&&clipboard.items.some(x=>x.id===item.id)?' ghost':'');d.innerHTML='<div class="emoji">'+item.emoji+'</div><div class="name"></div><div class="kind">'+(item.type==='folder'?'Carpeta':'Archivo')+'</div>';d.querySelector('.name').textContent=item.name;d.onclick=()=>selectItem(item.id);d.ondblclick=()=>{if(item.type==='folder'){setStatus('Esta simulación mantiene las carpetas de ejemplo en la lista principal.');}};$('files').appendChild(d)});
 $('nav').querySelectorAll('[data-folder]').forEach(n=>n.classList.toggle('active',n.dataset.folder===folder));
 $('copybtn').disabled=!selected.length;$('cutbtn').disabled=!selected.length;$('pastebtn').disabled=!clipboard;
}
function selectItem(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];renderFiles();setStatus(selected.length?selected.length+' elemento(s) seleccionado(s).':'No hay elementos seleccionados.');if(mode==='discover')renderPanel();}
function setStatus(t){$('status').textContent=t}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},2400)}
function saveHistory(){history.push({data:clone(data),folder,selected:[...selected],clipboard:clipboard?clone(clipboard):null,lastPaste});}
function act(action){
 if(action==='copy'||action==='cut'){if(!selected.length){toast('Primero selecciona un archivo o una carpeta.');return;}clipboard={action,items:clone(data[folder].filter(x=>selected.includes(x.id))),source:folder};if(action==='cut')toast('Preparado para mover. Ahora abre el destino y pega.');else toast('Copiado. El original se conserva.');renderFiles();if(mode==='discover')renderPanel();}
 if(action==='paste'){if(!clipboard){toast('No hay nada en el portapapeles. Copia o corta primero.');return;}saveHistory();let items=clone(clipboard.items);if(clipboard.action==='cut'){data[clipboard.source]=data[clipboard.source].filter(x=>!clipboard.items.some(y=>y.id===x.id));}
 items=items.map(x=>({...x,id:x.id+'_'+Math.random().toString(36).slice(2,7),name:uniqueName(x.name,data[folder])}));data[folder].push(...items);lastPaste=true;selected=items.map(x=>x.id);let actionWas=clipboard.action;clipboard=actionWas==='cut'?null:clipboard;renderFiles();setStatus('Pegado en '+folder+'.');toast(actionWas==='copy'?'Copia creada; el original sigue en su sitio.':'Elemento movido a '+folder+'.');if(mode==='discover')renderPanel();}
 if(action==='undo'){if(!history.length){toast('Todavía no hay ninguna acción que deshacer.');return;}let h=history.pop();data=h.data;folder=h.folder;selected=h.selected;clipboard=h.clipboard;lastPaste=h.lastPaste;renderFiles();toast('Última acción deshecha.');}
 updateProgress();
}
function uniqueName(name,items){if(!items.some(x=>x.name===name))return name;let dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let n=2;while(items.some(x=>x.name===base+' ('+n+')'+ext))n++;return base+' ('+n+')'+ext}
function renderPanel(){
 const p=$('panel');p.style.borderLeftColor=mode==='discover'?'var(--blue)':'var(--yellow)';
 if(mode==='discover'){let c=concepts[conceptIndex];p.innerHTML='<div style="font-size:2.5rem">🧭</div><h2>'+c.title+'</h2><p>'+c.text+'</p><div class="tip">'+c.tip+'</div><div class="feedback" id="fb"></div><button class="btn go" id="nextConcept">'+(conceptIndex===concepts.length-1?'🏁 Terminar descubrimiento':'Siguiente concepto ➜')+'</button>'; $('nextConcept').onclick=()=>{found[conceptIndex]=true;updateProgress();if(conceptIndex<concepts.length-1)conceptIndex++;else{mode='discover';p.innerHTML='<div style="font-size:3rem">🎉</div><h2>¡Conceptos descubiertos!</h2><p>Ya conoces las acciones básicas. Ahora practica con misiones en el Explorador.</p><button class="btn go" id="startPractice">🎯 Empezar a practicar</button>';$('startPractice').onclick=()=>setMode('practice');return;}renderPanel();};}
 else renderTask();
}
const tasks=[
 {q:'Crea una copia de Playa.jpg en Documentos.',source:'Fotos',id:'playa',dest:'Documentos',action:'copy',explain:'¡Bien! El archivo está en Documentos y el original sigue en Fotos.'},
 {q:'Mueve Carta.docx de Documentos a Trabajo.',source:'Documentos',id:'carta',dest:'Trabajo',action:'cut',explain:'¡Correcto! Cortar y pegar ha movido el archivo a Trabajo.'},
 {q:'Copia la carpeta Vacaciones en Fotos.',source:'Documentos',id:'vacaciones',dest:'Fotos',action:'copy',explain:'¡Muy bien! Al copiar una carpeta, se copia también lo que contiene.'},
 {q:'Copia Datos.xlsx de Trabajo al Pendrive.',source:'Trabajo',id:'datos',dest:'Pendrive',action:'copy',explain:'¡Misión cumplida! El archivo se ha copiado al pendrive y conserva el original.'},
 {q:'Mueve Presupuesto.xlsx de Documentos a Trabajo.',source:'Documentos',id:'presupuesto',dest:'Trabajo',action:'cut',explain:'¡Exacto! El archivo ahora está en Trabajo, no en Documentos.'}
];
function renderTask(){
 const t=tasks[taskIndex];if(!t){$('panel').innerHTML='<div style="font-size:4rem">🏆</div><h2>¡Todas las misiones completadas!</h2><p>Has completado '+score+' de '+tasks.length+' misiones. Ya sabes copiar y mover archivos.</p><button class="btn go" id="again">🔄 Repetir misiones</button>';$('again').onclick=()=>{taskIndex=0;score=0;taskDone=false;renderTask();updateProgress()};return;}
 $('panel').innerHTML='<div style="font-size:2.5rem">🎯</div><div style="color:var(--sub);font-weight:800">MISIÓN '+(taskIndex+1)+' DE '+tasks.length+'</div><div class="task">'+t.q+'</div><div class="tip"><b>Recuerda:</b> '+(t.action==='copy'?'Copiar = conservar el original.':'Cortar = mover el elemento.')+' Selecciona el elemento, realiza la acción, abre la carpeta de destino y pulsa Pegar.</div><div class="feedback" id="fb"></div><button class="btn go" id="check">Comprobar misión</button><div id="nextwrap"></div>';
 $('check').onclick=checkTask;
}
function checkTask(){
 const t=tasks[taskIndex],fb=$('fb');
 const destHas=data[t.dest].some(x=>x.id.startsWith(t.id+'_'));
 const sourceHas=data[t.source].some(x=>x.id===t.id);
 const actionCorrect=clipboard===null || clipboard.action===t.action;
 if(destHas && (t.action==='copy'?sourceHas:!sourceHas)){
  fb.className='feedback good';fb.textContent='✅ ¡Misión completada!';score++;$('check').disabled=true;$('nextwrap').innerHTML='<p>'+t.explain+'</p><button class="btn go" id="nextTask">Siguiente misión ➜</button>';$('nextTask').onclick=()=>{taskIndex++;taskDone=false;renderTask();updateProgress()};updateProgress();
 }else{fb.className='feedback bad';fb.textContent='Aún no está hecho. Comprueba el archivo, la acción y la carpeta de destino.';}
}
function updateProgress(){let n=Object.keys(found).length;$('progtext').textContent=mode==='discover'?'⭐ '+n+' de '+concepts.length+' conceptos descubiertos':'🎯 '+score+' de '+tasks.length+' misiones completadas';$('fill').style.width=(mode==='discover'?n/concepts.length:score/tasks.length)*100+'%';}
function setMode(m){mode=m;$('discover').classList.toggle('on',m==='discover');$('practice').classList.toggle('on',m==='practice');selected=[];if(m==='practice'){taskIndex=0;score=0;clipboard=null;data=clone(initial);folder='Documentos';}renderFiles();renderPanel();updateProgress();}
$('discover').onclick=()=>setMode('discover');$('practice').onclick=()=>setMode('practice');$('copybtn').onclick=()=>act('copy');$('cutbtn').onclick=()=>act('cut');$('pastebtn').onclick=()=>act('paste');$('undo').onclick=()=>act('undo');$('reset').onclick=init;
$('nav').addEventListener('click',e=>{let n=e.target.closest('[data-folder]');if(n){folder=n.dataset.folder;selected=[];renderFiles();setStatus('Carpeta abierta: '+folder+'.');if(mode==='discover')renderPanel();}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='c'){e.preventDefault();act('copy')}if(e.ctrlKey&&e.key.toLowerCase()==='x'){e.preventDefault();act('cut')}if(e.ctrlKey&&e.key.toLowerCase()==='v'){e.preventDefault();act('paste')}if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();act('undo')}});
init();
</script></body></html>

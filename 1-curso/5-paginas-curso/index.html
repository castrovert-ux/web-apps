<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páginas del curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #e9eff5;
    --tinta: #14233b;
    --tinta-suave: #3d4d66;
    --rojo: #c8283a;
    --verde: #1f7a5c;
    --azul: #245a9e;
    --ocre: #9a6a00;
    --blanco: #ffffff;
    --linea: #c5d2e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(1rem, 3vh, 2rem) clamp(1rem, 3vw, 2.5rem) 3rem;
    font-family: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--tinta);
    background: var(--fondo);
  }
  .marco { max-width: 900px; margin: 0 auto; }
  h1 {
    margin: 0 0 0.3rem;
    font-size: clamp(2rem, 5.5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .subtitulo { margin: 0 0 1.5rem; font-size: clamp(1.05rem, 1.8vw, 1.3rem); color: var(--tinta-suave); }
  .buscador { position: relative; margin-bottom: 1rem; }
  .buscador svg { position: absolute; left: 1.1rem; top: 50%; width: 28px; height: 28px; transform: translateY(-50%); pointer-events: none; }
  .buscador input {
    width: 100%;
    padding: 0.85rem 1.2rem 0.85rem 3.4rem;
    border: 3px solid var(--tinta);
    border-radius: 999px;
    font: inherit;
    font-size: 1.35rem;
    color: var(--tinta);
    background: var(--blanco);
  }
  .buscador input:focus { outline: 4px solid var(--azul); outline-offset: 3px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 0.4rem; }
  .filtros button {
    padding: 0.45rem 1.1rem;
    border: 3px solid var(--tinta);
    border-radius: 999px;
    font: inherit;
    font-weight: 700;
    color: var(--tinta);
    background: var(--blanco);
    cursor: pointer;
  }
  .filtros button[aria-pressed="true"] { color: var(--blanco); background: var(--tinta); }
  .filtros button:focus-visible { outline: 4px solid var(--rojo); outline-offset: 3px; }
  #aviso { min-height: 1.6rem; margin: 0.6rem 0 0.4rem; font-weight: 700; color: var(--tinta-suave); }
  .curso { margin-top: 1.6rem; }
  .curso h2 {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin: 0 0 0.8rem;
    font-size: clamp(1.4rem, 2.6vw, 1.9rem);
  }
  .curso h2 svg { flex: none; height: 52px; width: auto; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
  li a {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem 1rem;
    padding: 0.9rem 1.2rem;
    border: 3px solid transparent;
    border-radius: 18px;
    color: var(--tinta);
    text-decoration: none;
    background: var(--blanco);
    box-shadow: 0 4px 0 var(--linea);
  }
  li a:hover { border-color: var(--tinta); }
  li a:focus-visible { outline: 4px solid var(--rojo); outline-offset: 3px; }
  .titulo { font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
  .recursos { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .recursos span { padding: 0.1rem 0.65rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700; color: var(--blanco); }
  .r-doc  { background: var(--azul); }
  .r-cues { background: var(--verde); }
  .r-sim  { background: var(--rojo); }
  .r-ejer { background: var(--ocre); }
  .recursos .r-vacio { color: var(--tinta-suave); background: var(--fondo); }
  @media (max-width: 600px) {
    .titulo { font-size: 1.15rem; }
    .curso h2 svg { height: 40px; }
  }
</style>
</head>
<body>
<div class="marco">
  <h1>Páginas del curso</h1>
  <p class="subtitulo">Escribe una palabra del tema o elige un curso.</p>
  <div class="buscador">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="buscar" type="search" placeholder="Por ejemplo: ratón, Gmail, fotos…" aria-label="Buscar un tema" autocomplete="off">
  </div>
  <div class="filtros" role="group" aria-label="Elegir curso">
    <button type="button" data-c="0" aria-pressed="true">Todos (56)</button>
    <button type="button" data-c="1" aria-pressed="false">Curso de ordenador (31)</button>
    <button type="button" data-c="2" aria-pressed="false">Curso de móvil (25)</button>
  </div>
  <p id="aviso" role="status"></p>
  <div id="lista"></div>
</div>
<script type="application/json" id="datos">{"temas":[{"c":1,"t":"Uso del ratón","s":"uso-del-raton","r":["doc","cues","sim","ejer"]},{"c":1,"t":"Uso del teclado","s":"uso-del-teclado","r":["doc","cues","sim","ejer"]},{"c":1,"t":"El Escritorio de Windows","s":"el-escritorio-de-windows","r":["doc","cues","sim","ejer"]},{"c":1,"t":"Gestión de ventanas en Windows","s":"gestion-de-ventanas-en-windows","r":["doc","cues","sim","ejer"]},{"c":1,"t":"El Explorador de Archivos","s":"el-explorador-de-archivos","r":["doc","cues","sim","ejer"]},{"c":1,"t":"Copiar y Pegar ficheros y carpetas","s":"copiar-y-pegar-ficheros-y-carpetas","r":["doc","cues","sim","ejer"]},{"c":1,"t":"Copiar y pegar texto e imágenes","s":"copiar-y-pegar-texto-e-imagenes","r":["doc","cues","sim","ejer"]},{"c":1,"t":"La memoria USB","s":"la-memoria-usb","r":["doc"]},{"c":1,"t":"Consejos básicos","s":"consejos-basicos","r":["doc","cues","ejer"]},{"c":1,"t":"Entorno de Google","s":"entorno-de-google","r":["doc"]},{"c":1,"t":"Google Fotos","s":"google-fotos","r":["doc"]},{"c":1,"t":"Gmail","s":"gmail","r":["doc"]},{"c":1,"t":"Youtube","s":"youtube","r":["doc"]},{"c":1,"t":"Crear evento en Google Calendar","s":"crear-evento-en-google-calendar","r":["doc"]},{"c":1,"t":"Crear nota en Google Keep","s":"crear-nota-en-google-keep","r":["doc"]},{"c":1,"t":"Declaración de la renta - con referencia","s":"declaracion-de-la-renta-con-referencia","r":["doc"]},{"c":1,"t":"Clave móvil","s":"clave-movil","r":["doc"]},{"c":1,"t":"Herramientas de Inteligencia artificial","s":"herramientas-de-inteligencia-artificial","r":["doc"]},{"c":1,"t":"Edición y creación de imágenes","s":"edicion-y-creacion-de-imagenes","r":["doc"]},{"c":1,"t":"Usar Whatsapp en el Ordenador","s":"usar-whatsapp-en-el-ordenador","r":["doc","sim"]},{"c":1,"t":"Guía de Facebook básica","s":"guia-de-facebook-basica","r":["doc"]},{"c":1,"t":"Usar la TV en el Ordenador","s":"usar-la-tv-en-el-ordenador","r":["doc","cues"]},{"c":1,"t":"Explorando Word","s":"explorando-word","r":["doc"]},{"c":1,"t":"Mi primera práctica de Word - Receta de tortilla de patata","s":"mi-primera-practica-de-word-receta-de-tortilla-de-patata","r":["doc"]},{"c":1,"t":"Mi segunda práctica de Word - Mi libro personal","s":"mi-segunda-practica-de-word-mi-libro-personal","r":["doc"]},{"c":1,"t":"Mi tercera práctica de Word - Horario viaje a Croacia","s":"mi-tercera-practica-de-word-horario-viaje-a-croacia","r":["doc"]},{"c":1,"t":"Toma de contacto con Excel","s":"toma-de-contacto-con-excel","r":["doc","cues"]},{"c":1,"t":"Manejo de Columnas y Filas en Excel","s":"manejo-de-columnas-y-filas-en-excel","r":["doc","cues"]},{"c":1,"t":"Lista de la compra","s":"lista-de-la-compra","r":["doc"]},{"c":1,"t":"Registro de gastos mensuales","s":"registro-de-gastos-mensuales","r":["doc"]},{"c":1,"t":"Test Final Año 2026","s":"test-final-ano-2026","r":["cues"]},{"c":2,"t":"Introducción","s":"introduccion","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Funciones básicas importantes","s":"funciones-basicas-importantes","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Pequeñas destrezas","s":"pequenas-destrezas","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Captura y Edición de Fotografías","s":"captura-y-edicion-de-fotografias","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Teclado (gboard)","s":"teclado-gboard","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Funciones del reloj","s":"funciones-del-reloj","r":["doc","cues","sim","ejer"]},{"c":2,"t":"Gestor de Archivos - Organizar la carpeta descargas en el móvil","s":"gestor-de-archivos-organizar-la-carpeta-descargas-en-el-movi","r":["doc"]},{"c":2,"t":"Repaso de primeros pasos","s":"repaso-de-primeros-pasos-2","r":["doc"]},{"c":2,"t":"Whatsapp","s":"whatsapp","r":["doc"]},{"c":2,"t":"Facebook","s":"facebook","r":["doc"]},{"c":2,"t":"Introducción","s":"introduccion-2","r":["doc"]},{"c":2,"t":"Gmail","s":"gmail-2","r":["doc","cues"]},{"c":2,"t":"Play Store","s":"play-store","r":["doc"]},{"c":2,"t":"Youtube","s":"youtube-2","r":["doc"]},{"c":2,"t":"Google Chrome","s":"google-chrome","r":["doc"]},{"c":2,"t":"Google Fotos","s":"google-fotos-2","r":["doc"]},{"c":2,"t":"Google Calendar","s":"google-calendar","r":["doc"]},{"c":2,"t":"Google Keep","s":"google-keep","r":["doc"]},{"c":2,"t":"Edición y creación de imágenes","s":"edicion-y-creacion-de-imagenes-2","r":["doc"]},{"c":2,"t":"Aplicación AUVASAPAY","s":"aplicacion-auvasapay","r":["doc"]},{"c":2,"t":"Obtener tarjeta BUSCYL","s":"obtener-tarjeta-buscyl","r":["doc"]},{"c":2,"t":"Compras Online","s":"compras-online","r":["doc"]},{"c":2,"t":"Declaración de la renta - con referencia","s":"declaracion-de-la-renta-con-referencia-2","r":["doc"]},{"c":2,"t":"Aplicación Cl@ve","s":"aplicacion-cl-ve","r":["doc"]},{"c":2,"t":"Test Fin de Curso","s":"test-fin-de-curso","r":["cues"]}],"cursos":["Curso de ordenador","Curso de móvil"],"dibujos":["\u003csvg class=\"dibujo\" viewBox=\"0 0 300 240\" role=\"img\" aria-label=\"Dibujo de un ordenador\">\n      \u003crect x=\"20\" y=\"10\" width=\"260\" height=\"165\" rx=\"14\" fill=\"#ffffff\" stroke=\"#14233b\" stroke-width=\"6\"/>\n      \u003crect class=\"pantalla\" x=\"40\" y=\"30\" width=\"220\" height=\"125\" rx=\"6\" fill=\"#d6e4f2\" stroke=\"#14233b\" stroke-width=\"4\"/>\n      \u003cpath d=\"M122 175L110 214H190L178 175\" fill=\"#ffffff\" stroke=\"#14233b\" stroke-width=\"6\" stroke-linejoin=\"round\"/>\n      \u003crect x=\"80\" y=\"214\" width=\"140\" height=\"16\" rx=\"8\" fill=\"#ffffff\" stroke=\"#14233b\" stroke-width=\"6\"/>\n    \u003c/svg>","\u003csvg class=\"dibujo\" viewBox=\"0 0 160 300\" role=\"img\" aria-label=\"Dibujo de un teléfono móvil\">\n      \u003crect x=\"10\" y=\"8\" width=\"140\" height=\"284\" rx=\"26\" fill=\"#ffffff\" stroke=\"#14233b\" stroke-width=\"6\"/>\n      \u003crect class=\"pantalla\" x=\"26\" y=\"42\" width=\"108\" height=\"196\" rx=\"8\" fill=\"#d6e4f2\" stroke=\"#14233b\" stroke-width=\"4\"/>\n      \u003crect x=\"62\" y=\"21\" width=\"36\" height=\"7\" rx=\"3.5\" fill=\"#14233b\"/>\n      \u003ccircle cx=\"80\" cy=\"266\" r=\"11\" fill=\"#ffffff\" stroke=\"#14233b\" stroke-width=\"5\"/>\n    \u003c/svg>"]}</script>
<script>(function () {
  var D = JSON.parse(document.getElementById('datos').textContent);
  var NOMBRES = { doc: 'Documentación', cues: 'Cuestionario', sim: 'Simulación', ejer: 'Prácticas en clase' };
  var buscar = document.getElementById('buscar');
  var lista = document.getElementById('lista');
  var aviso = document.getElementById('aviso');
  var botones = document.querySelectorAll('.filtros button');
  var filtro = 0;
  function norm(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  D.temas.forEach(function (x) { x.n = norm(x.t); });

  function pintar() {
    var texto = buscar.value.trim();
    var palabras = norm(texto).split(/\s+/).filter(Boolean);
    lista.innerHTML = '';
    var total = 0;
    [1, 2].forEach(function (c) {
      if (filtro && filtro !== c) return;
      var temas = D.temas.filter(function (x) {
        return x.c === c && palabras.every(function (p) { return x.n.indexOf(p) >= 0; });
      });
      if (!temas.length) return;
      total += temas.length;
      var sec = document.createElement('section');
      sec.className = 'curso';
      var h = document.createElement('h2');
      h.innerHTML = D.dibujos[c - 1];
      h.appendChild(document.createTextNode(D.cursos[c - 1]));
      sec.appendChild(h);
      var ul = document.createElement('ul');
      temas.forEach(function (x) {
        var a = document.createElement('a');
        a.href = x.s + '/';
        var t = document.createElement('span');
        t.className = 'titulo';
        t.textContent = x.t;
        var r = document.createElement('span');
        r.className = 'recursos';
        (x.r.length ? x.r : ['vacio']).forEach(function (k) {
          var p = document.createElement('span');
          p.className = 'r-' + k;
          p.textContent = NOMBRES[k] || 'Sin contenido todavía';
          r.appendChild(p);
        });
        a.appendChild(t);
        a.appendChild(r);
        var li = document.createElement('li');
        li.appendChild(a);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      lista.appendChild(sec);
    });
    if (!total) aviso.textContent = texto ? 'No hay ningún tema que contenga «' + texto + '».' : 'Este curso todavía no tiene temas.';
    else aviso.textContent = texto ? (total === 1 ? '1 tema encontrado.' : total + ' temas encontrados.') : '';
  }

  buscar.addEventListener('input', pintar);
  botones.forEach(function (b) {
    b.addEventListener('click', function () {
      filtro = Number(b.getAttribute('data-c'));
      botones.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      pintar();
    });
  });
  pintar();
})();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clave móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #e9eff5;
    --tinta: #14233b;
    --tinta-suave: #3d4d66;
    --rojo: #c8283a;
    --verde: #1f7a5c;
    --azul: #245a9e;
    --ocre: #9a6a00;
    --amarillo: #f2b640;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: clamp(1rem, 3vh, 2rem) clamp(1rem, 3vw, 2.5rem);
    gap: clamp(1rem, 3vh, 2rem);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--tinta);
    background: var(--fondo);
  }
  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    max-width: 1300px;
    width: 100%;
    margin: 0 auto;
  }
  header > div { min-width: 0; }
  .volver {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    padding: 0.5rem 1.1rem 0.5rem 0.8rem;
    border: 3px solid var(--tinta);
    border-radius: 999px;
    color: var(--tinta);
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    background: var(--blanco);
  }
  .volver svg { width: 22px; height: 22px; }
  .volver:hover { background: var(--tinta); color: var(--blanco); }
  .volver:focus-visible { outline: 4px solid var(--rojo); outline-offset: 3px; }
  h1 {
    margin: 0 0 0.4rem;
    font-size: clamp(2rem, 5.5vw, 4.2rem);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }
  .subtitulo {
    margin: 0;
    font-size: clamp(1.05rem, 1.8vw, 1.35rem);
    color: var(--tinta-suave);
  }
  .dibujo {
    flex: none;
    height: clamp(90px, 20vh, 170px);
    width: auto;
    filter: drop-shadow(0 10px 10px rgba(20, 35, 59, 0.22));
  }
  .pantalla { animation: encender 1.2s ease-out 0.6s 1 both; }
  @keyframes encender {
    0%   { fill: #d6e4f2; }
    35%  { fill: var(--amarillo); }
    100% { fill: #d6e4f2; }
  }
  main {
    flex: 1;
    display: flex;
    max-width: 1300px;
    width: 100%;
    margin: 0 auto;
  }
  .enlaces {
    flex: 1;
    display: grid;
    gap: clamp(0.8rem, 1.6vw, 1.5rem);
  }
  .enlaces.n1 { grid-template-columns: minmax(0, 520px); justify-content: center; }
  .enlaces.n2 { grid-template-columns: repeat(2, 1fr); }
  .enlaces.n3 { grid-template-columns: repeat(3, 1fr); }
  .enlaces.n4 { grid-template-columns: repeat(4, 1fr); }
  .tarjeta {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    min-height: 220px;
    padding: 1.5rem 1rem;
    border-radius: 28px;
    color: var(--blanco);
    text-align: center;
    text-decoration: none;
    background: var(--color);
    box-shadow: 0 6px 0 var(--sombra);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tarjeta:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--sombra); }
  .tarjeta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sombra); }
  .tarjeta:focus-visible { outline: 4px solid var(--tinta); outline-offset: 4px; }
  .tarjeta svg {
    flex: none;
    width: clamp(56px, 8vw, 96px);
    height: clamp(56px, 8vw, 96px);
  }
  .tarjeta h2 {
    margin: 0 0 0.3rem;
    font-size: clamp(1.4rem, 2.4vw, 2rem);
    line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .tarjeta p { margin: 0; font-size: clamp(0.95rem, 1.3vw, 1.1rem); opacity: 0.95; }
  .documentacion { --color: var(--azul);  --sombra: #173f70; }
  .cuestionario  { --color: var(--verde); --sombra: #135540; }
  .simulacion    { --color: var(--rojo);  --sombra: #8f1b29; }
  .ejercicios    { --color: var(--ocre);  --sombra: #6b4900; }
  .vacio { font-size: 1.3rem; color: var(--tinta-suave); }

  @media (max-width: 800px) {
    .enlaces.n2, .enlaces.n3, .enlaces.n4 { grid-template-columns: repeat(2, 1fr); }
    .enlaces.n1 { grid-template-columns: 1fr; }
    .enlaces.n3 .tarjeta:last-child { grid-column: 1 / -1; }
    .tarjeta { min-height: 150px; padding: 1rem 0.6rem; border-radius: 22px; }
    .tarjeta p { display: none; }
    .dibujo { height: 80px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pantalla { animation: none; }
    .tarjeta { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <a class="volver" href="https://sites.google.com/view/curso-tecnologia-valladolid/curso-tecnologia-personas-mayores-valladolid-CTPMV/innoveas-tecnologia-para-mayores-valladolid-CTPMV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Volver al curso
    </a>
    <h1>Clave móvil</h1>
    <p class="subtitulo">Curso de ordenador</p>
  </div>
  <svg class="dibujo" viewBox="0 0 300 240" role="img" aria-label="Dibujo de un ordenador">
      <rect x="20" y="10" width="260" height="165" rx="14" fill="#ffffff" stroke="#14233b" stroke-width="6"/>
      <rect class="pantalla" x="40" y="30" width="220" height="125" rx="6" fill="#d6e4f2" stroke="#14233b" stroke-width="4"/>
      <path d="M122 175L110 214H190L178 175" fill="#ffffff" stroke="#14233b" stroke-width="6" stroke-linejoin="round"/>
      <rect x="80" y="214" width="140" height="16" rx="8" fill="#ffffff" stroke="#14233b" stroke-width="6"/>
    </svg>
</header>

<main>
  <nav class="enlaces n1" aria-label="Contenido del tema">
    <a class="tarjeta documentacion" href="https://drive.google.com/file/d/1wBAjnB24PhlUmIbYSsH2AejszGtCl3eR/view?usp=drive_link">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6h26l12 12v40H14z"/><path d="M40 6v12h12"/><path d="M22 32h22M22 41h22M22 50h14"/></svg>
      <div>
        <h2>Documentación</h2>
        <p>El texto del tema en PDF.</p>
      </div>
    </a>
  </nav>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Cuestionarios</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }
  .header { text-align: center; margin-bottom: 30px; position: relative; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px;
    text-transform: uppercase; padding: 6px 18px; border-radius: 100px; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: clamp(1.8rem, 5vw, 2.6rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
  }
  .lead { color: var(--sub); font-weight: 600; }

  .card { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--sub); margin-bottom: 14px; font-weight: 800; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  select, input[type=number], input[type=text], input[type=password], textarea {
    background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 9px 12px;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--c1); }
  select option { background: var(--card); }
  input[type=number] { width: 90px; }

  .btn {
    border: 2px solid var(--line); background: rgba(255,255,255,0.05); color: var(--text);
    font-family: inherit; font-weight: 800; font-size: 0.9rem; padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s;
  }
  .btn:hover:not(:disabled) { border-color: var(--c1); background: rgba(33,115,70,0.15); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-main { background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; border: none; }
  .btn-main:hover:not(:disabled) { background: linear-gradient(135deg, var(--c3), #f59e0b); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.25); }
  .btn-green { background: linear-gradient(135deg, var(--c1), var(--c2)); border: none; color: #fff; }
  .btn-sm { padding: 6px 11px; font-size: 0.8rem; border-radius: 9px; }
  .top-actions { position: absolute; top: 0; right: 0; display: flex; gap: 8px; }

  .drop {
    border: 2px dashed rgba(255,255,255,0.18); border-radius: 16px; padding: 30px 20px; text-align: center;
    cursor: pointer; transition: 0.2s; color: var(--sub); font-weight: 700;
  }
  .drop:hover, .drop.over { border-color: var(--c1); background: rgba(33,115,70,0.08); color: var(--text); }
  .drop .big { font-size: 2.2rem; display: block; margin-bottom: 6px; }

  .files { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .file {
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: rgba(255,255,255,0.02);
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  }
  .file .name { font-weight: 800; word-break: break-word; }
  .file .meta { font-size: 0.82rem; color: var(--sub); font-weight: 600; margin-top: 3px; }
  .file .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .file .edit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .file .edit input[type=text] { flex: 1; min-width: 200px; padding: 6px 10px; font-size: 0.9rem; }
  .file .edit input.emoji { width: 56px; flex: none; min-width: 0; text-align: center; }
  .file .edit select { padding: 6px 10px; font-size: 0.9rem; }
  .st { display: inline-block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; margin-left: 6px; vertical-align: middle; }
  .st.wait { background: rgba(255,255,255,0.08); color: var(--sub); }
  .st.run { background: rgba(255,217,61,0.15); color: var(--c3); }
  .st.ok { background: rgba(33,115,70,0.25); color: #4ade80; }
  .st.err { background: rgba(255,107,107,0.18); color: var(--c4); }
  .errtxt { grid-column: 1 / -1; color: var(--c4); font-size: 0.85rem; font-weight: 600; }

  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
  .status { margin-top: 12px; font-weight: 700; font-size: 0.9rem; min-height: 1.2em; }
  .status.ok { color: var(--c5); } .status.err { color: var(--c4); }

  .overlay { position: fixed; inset: 0; background: rgba(5,10,20,0.75); z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 760px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal.sm { max-width: 480px; }
  .modal-head { padding: 18px 22px 0; } .modal-head h3 { font-family: 'Fredoka One'; font-weight: 400; font-size: 1.4rem; }
  .modal-body { padding: 16px 22px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  /* Barras de desplazamiento visibles en el tema oscuro */
  .modal-body, textarea { scrollbar-width: auto; scrollbar-color: #4a5b80 rgba(255,255,255,0.05); }
  .modal-body::-webkit-scrollbar, textarea::-webkit-scrollbar { width: 12px; }
  .modal-body::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
  .modal-body::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb { background: #4a5b80; border-radius: 10px; border: 2px solid var(--card); }
  .modal-body::-webkit-scrollbar-thumb:hover, textarea::-webkit-scrollbar-thumb:hover { background: var(--c1); }
  .keylink { font-size: 0.75rem; color: var(--c5); font-weight: 700; text-decoration: none; }
  .keylink:hover { text-decoration: underline; }
  .modal-foot { padding: 0 22px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .modal-foot .left { margin-right: auto; display: flex; gap: 8px; align-items: center; }
  .keyrow { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; align-items: center; margin-bottom: 12px; }
  .keyrow .keylink { grid-column: 2; }
  .keyrow label { font-weight: 700; color: var(--sub); font-size: 0.88rem; }
  .keynote { color: var(--sub); font-size: 0.85rem; margin-bottom: 14px; }
  textarea.big { width: 100%; height: 50vh; min-height: 200px; font-family: ui-monospace, Consolas, monospace; font-size: 0.82rem; font-weight: 400; line-height: 1.45; resize: vertical; }
  .ptitle { font-size: 0.8rem; font-weight: 800; color: var(--sub); margin-bottom: 8px; }

  @media (max-width: 600px) {
    .top-actions { position: static; justify-content: center; margin-bottom: 14px; }
    .file { grid-template-columns: 1fr; } .file .acts { justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<div class="container">
  <div class="header">
    <div class="top-actions">
      <button class="btn btn-sm" onclick="openPrompt()">📝 Prompt</button>
      <button class="btn btn-sm" onclick="openKeys()">🔑 Claves</button>
    </div>
    <div class="badge">🧩 Cruz Roja · Cursos</div>
    <h1>Generador de Cuestionarios</h1>
    <p class="lead">Carga los temas en Word o PDF y descarga un cuestionario por cada uno.</p>
  </div>

  <div class="card">
    <h2>Modelo y opciones</h2>
    <div class="row">
      <div class="field"><label for="prov">Proveedor</label><select id="prov" onchange="changeProvider()"></select></div>
      <div class="field"><label for="model">Modelo</label><select id="model" onchange="changeModel()"></select></div>
      <button class="btn btn-sm" style="margin-bottom:4px" title="Actualizar la lista de modelos" onclick="refreshModels()">↻</button>
      <div class="field" style="margin-left:auto"><label for="dif">Dificultad</label>
        <select id="dif" onchange="saveSettings()">
          <option value="basico">Básico</option>
          <option value="medio">Medio</option>
          <option value="avanzado">Avanzado</option>
        </select>
      </div>
      <div class="field"><label for="nq">Nº de preguntas</label><input type="number" id="nq" min="3" max="50" value="10" onchange="saveSettings()"></div>
    </div>
  </div>

  <div class="card">
    <h2>Documentos</h2>
    <div class="drop" id="drop" onclick="document.getElementById('fileinput').click()">
      <span class="big">📄</span>
      Arrastra aquí los ficheros Word (.docx) o PDF, o haz clic para elegirlos
    </div>
    <input type="file" id="fileinput" accept=".docx,.pdf" multiple hidden onchange="addFiles(this.files); this.value=''">
    <div class="files" id="files"></div>
    <div class="bar">
      <button class="btn" id="btn-clear" onclick="clearAll()">🗑️ Vaciar lista</button>
      <button class="btn btn-green" id="btn-dlall" onclick="downloadAll()">⬇️ Descargar todos</button>
      <button class="btn btn-main" id="btn-run" onclick="runAll()">✨ Generar cuestionarios</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- Modal: claves -->
<div class="overlay" id="ov-keys">
  <div class="modal sm">
    <div class="modal-head"><h3>Claves de API</h3></div>
    <div class="modal-body" id="keys-body"></div>
    <div class="modal-foot">
      <label class="left" style="font-weight:700;font-size:0.85rem;color:var(--sub)"><input type="checkbox" id="showkeys" onchange="toggleShowKeys()"> Mostrar claves</label>
      <button class="btn" onclick="closeOv('ov-keys')">Cancelar</button>
      <button class="btn btn-main" onclick="saveKeys()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: prompt -->
<div class="overlay" id="ov-prompt">
  <div class="modal">
    <div class="modal-head"><h3>Prompt</h3></div>
    <div class="modal-body">
      <div class="ptitle" id="ptitle"></div>
      <textarea class="big" id="ptext" spellcheck="false"></textarea>
    </div>
    <div class="modal-foot">
      <div class="left"><button class="btn" onclick="restorePrompt()">Restaurar por defecto</button></div>
      <button class="btn" onclick="closeOv('ov-prompt')">Cancelar</button>
      <button class="btn btn-main" onclick="savePrompt()">Guardar</button>
    </div>
  </div>
</div>

<!-- Prompt por defecto. {N} = número de preguntas -->
<textarea id="default-prompt" hidden>Eres un profesor voluntario que da cursos de informática y de móvil a personas mayores en Cruz Roja. Vas a recibir el texto de un tema del curso y debes crear un cuestionario de repaso sobre ese tema.

1. DECIDE EL CURSO Y EL TÍTULO
- "curso": "ordenador" si el tema trata del ordenador (Windows, ratón, teclado, programas, navegador en el PC...) o "movil" si trata del teléfono móvil (Android, aplicaciones, WhatsApp, ajustes del móvil...).
- "titulo": título corto y claro del tema (máximo 6 palabras), por ejemplo "Uso del Ratón en Windows".
- "emoji": UN solo emoji que represente el contenido del tema (por ejemplo 🖱️ para el ratón, ⌨️ para el teclado, 💬 para WhatsApp, 📷 para la cámara).
- "mensajePerfecto": frase corta de felicitación para quien acierte todo, relacionada con el tema, por ejemplo "¡Perfecto! Dominas el ratón".

2. CREA EXACTAMENTE {N} PREGUNTAS
- Basadas SOLO en el contenido del documento. No inventes funciones ni datos que no aparezcan en él, y respeta los matices y excepciones que señale el texto.
- Repartidas por todos los apartados del tema, sin repetir la misma idea.
- Aproximadamente el 80 % de opción múltiple con 3 opciones y el 20 % de Verdadero/Falso.
- Lenguaje sencillo y cercano, pensado para personas mayores que están aprendiendo. Frases cortas. Nada de tecnicismos sin explicar.
- Incluye algunas preguntas prácticas tipo situación ("Estás leyendo un documento largo y quieres...").
- Las opciones incorrectas deben ser creíbles pero claramente erróneas para quien ha estudiado el tema.
- Varía la posición de la respuesta correcta (no la pongas siempre en el mismo lugar).
- "expl": explicación de 1 o 2 frases que diga por qué es la respuesta correcta. En las de Verdadero/Falso empieza por "Verdadero." o "Falso.".

3. FORMATO DE RESPUESTA
Responde ÚNICAMENTE con un objeto JSON válido, sin texto antes ni después y sin bloques de código, con esta forma:
{
  "curso": "ordenador",
  "titulo": "Uso del Ratón en Windows",
  "emoji": "🖱️",
  "mensajePerfecto": "¡Perfecto! Dominas el ratón",
  "preguntas": [
    {"q": "¿Para qué sirve la rueda del ratón?", "options": ["Para abrir el menú de inicio", "Para subir y bajar en páginas o documentos", "Para apagar el ordenador"], "correct": 1, "expl": "La rueda sirve para subir y bajar por páginas y documentos largos."},
    {"q": "El clic derecho abre un menú con opciones.", "type": "boolean", "options": ["Verdadero", "Falso"], "correct": 0, "expl": "Verdadero. El clic derecho muestra un menú con opciones relacionadas con el elemento."}
  ]
}
"correct" es la posición de la opción correcta empezando en 0. Las de Verdadero/Falso llevan "type": "boolean" y siempre las opciones ["Verdadero", "Falso"].</textarea>

<!-- Plantilla del cuestionario (mismo estilo que el modelo) -->
<textarea id="quiz-template" hidden><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: {{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Todo el tamaño se calcula a partir de la ventana: el cuestionario siempre cabe, sin Ctrl - */
  html { height: 100%; font-size: calc(clamp(13px, min(2.3vh, 2.8vw), 24px) * var(--k, 1)); }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    height: 100%; overflow: hidden;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container {
    position: relative; z-index: 1; max-width: 50rem; margin: 0 auto; padding: 1rem 1.2rem;
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 0.8rem;
  }

  .header { text-align: center; flex: 0 0 auto; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.12rem;
    text-transform: uppercase; padding: 0.35rem 1.1rem; border-radius: 100px; margin-bottom: 0.4rem;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: 1.9rem; line-height: 1.2; padding-bottom: 0.1rem;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  #quiz-area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 0.8rem; }

  .progress-wrap { flex: 0 0 auto; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; color: var(--sub); margin-bottom: 0.35rem; }
  .progress-bar { height: 0.5rem; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }

  .question-card {
    flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 1.4rem; padding: 1.4rem 1.6rem;
    animation: fadeIn 0.35s ease;
  }

  .q-type-badge {
    display: inline-flex; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
    padding: 0.25rem 0.8rem; border-radius: 100px; margin-bottom: 0.7rem;
    background: rgba(33,115,70,0.2); color: #4ade80;
  }

  .q-number { font-size: 0.85rem; color: var(--sub); font-weight: 700; margin-bottom: 0.3rem; }
  .q-text { font-size: 1.3rem; font-weight: 700; line-height: 1.4; margin-bottom: 0.9rem; }

  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 0.9rem; padding: 0.65rem 1rem; color: var(--text);
    font-family: inherit; font-size: 1.05rem; font-weight: 600; line-height: 1.3; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 0.8rem; transition: 0.2s;
  }
  .option-btn:hover:not(:disabled) { background: rgba(33,115,70,0.15); border-color: var(--c1); transform: translateX(4px); }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    width: 2rem; height: 2rem; border-radius: 0.5rem; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
  }

  .option-btn.correct { background: rgba(33,115,70,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }

  .feedback { display: none; margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 0.8rem; font-size: 1rem; font-weight: 700; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.correct-fb { display: block; background: rgba(33,115,70,0.2); color: var(--c5); border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* El botón ocupa siempre su sitio (solo se oculta), así nada salta ni se desplaza */
  .btn-next {
    flex: 0 0 auto; visibility: hidden; width: 100%; max-width: 14rem; margin: 0 0 0 auto;
    padding: 0.75rem; border-radius: 0.9rem; border: none; font-size: 1rem; font-weight: 800; font-family: inherit;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
    transition: 0.2s;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.25); }

  .results {
    display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .result-emoji { font-size: 3.5rem; line-height: 1.1; }
  .results h2 { font-size: 1.6rem; }
  .score-circle {
    width: 8rem; height: 8rem; border-radius: 50%; border: 0.5rem solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 0.8rem auto;
    font-size: 1.9rem; font-family: 'Fredoka One'; flex-direction: column; line-height: 1.1;
  }
  .score-circle small { font-family: 'Nunito'; font-size: 0.85rem; color: var(--sub); font-weight: 700; }
  .hidden { display: none !important; }

  .result-sub { color: var(--sub); font-size: 1rem; font-weight: 700; margin-top: 0.4rem; }
  .btn-restart { margin-top: 1.2rem; cursor: pointer; border: none; font-family: inherit; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge">{{BADGE}}</div>
    <h1>{{TITLE}}</h1>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de {{COUNT}}</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge" id="q-type">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="score-circle" id="score-num">0/{{COUNT}}</div>
    <h2 id="result-msg"></h2>
    <p class="result-sub" id="result-sub"></p>
    <button class="badge btn-restart" onclick="restartQuiz()">🔄 Reiniciar Quiz</button>
  </div>
</div>

<script>
const questions = {{QUESTIONS}};

let currentIdx = 0;
let score = 0;
let answered = false;
const TOTAL = questions.length;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];

  document.getElementById('q-type').textContent =
    qData.type === 'boolean' ? '✅ Verdadero o Falso' : '🎯 Opción múltiple';
  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.visibility = 'hidden';

  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';

  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  const pct = (currentIdx / TOTAL) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${TOTAL}`;
  document.getElementById('btn-next').textContent =
    currentIdx === TOTAL - 1 ? 'Ver resultados 🏁' : 'Siguiente →';
  fit(true);
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('q-feedback');

  btns.forEach(b => b.disabled = true);

  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>🎉 ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = 'feedback correct-fb';
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota:</strong><br>${qData.expl}`;
    fb.className = 'feedback wrong-fb';
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.visibility = 'visible';
  fit(false);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < TOTAL) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.documentElement.style.setProperty('--k', 1);
  document.getElementById('results').style.display = 'flex';

  const pct = Math.round((score / TOTAL) * 100);
  document.getElementById('score-num').innerHTML = `${score}/${TOTAL}<small>${pct}%</small>`;

  let emoji, msg, sub;
  if (pct === 100)    { emoji = '🏆'; msg = {{PERFECT}};  sub = 'Respondiste todo correctamente.'; }
  else if (pct >= 80) { emoji = '🌟'; msg = '¡Excelente, sigue así!';       sub = 'Solo te faltaron unos detalles.'; }
  else if (pct >= 60) { emoji = '👍'; msg = '¡Buen trabajo!';               sub = 'Vas por buen camino, repasa lo fallado.'; }
  else if (pct >= 40) { emoji = '📚'; msg = 'Repasa un poco más';           sub = 'Vuelve a leer el material y reinténtalo.'; }
  else                { emoji = '💪'; msg = '¡No te rindas!';               sub = 'Revisa el tema desde el principio.'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('prog-fill').style.width = '100%';
}

function restartQuiz() {
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('prog-score').textContent = '⭐ 0 pts';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-area').classList.remove('hidden');
  loadQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Ajusta el tamaño del texto para que la pregunta, las opciones y la explicación quepan sin desplazarse
function fit(reset) {
  const root = document.documentElement;
  const card = document.querySelector('.question-card');
  if (!card.clientHeight) return;
  let k = reset ? 1 : (parseFloat(root.style.getPropertyValue('--k')) || 1);
  root.style.setProperty('--k', k);
  while (k > 0.55 && card.scrollHeight > card.clientHeight + 1) {
    k = Math.round((k - 0.04) * 100) / 100;
    root.style.setProperty('--k', k);
  }
}
window.addEventListener('resize', () => fit(!answered));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(!answered));

window.onload = loadQuestion;
</script>
</body>
</html>
</textarea>

<script>
'use strict';
// ═════════════════════════════════════════════
//  CONFIGURACIÓN
// ═════════════════════════════════════════════
const LS = {
  settings:'cuestionarios_settings', prompt:'cuestionarios_prompt'
};
// Mismas claves que el resto de la suite, para no volver a introducirlas
// Solo proveedores con plan gratuito. Mismas claves que el resto de la suite.
const KEYS = [
  {id:'aistudio',   label:'AI Studio',  ls:'castroverde_ana_gemini_key',  url:'https://aistudio.google.com/apikey'},
  {id:'groq',       label:'Groq',       ls:'castroverde_groq_key',        url:'https://console.groq.com/keys'},
  {id:'mistral',    label:'Mistral',    ls:'castroverde_ana_mistral_key', url:'https://console.mistral.ai/api-keys'},
  {id:'openrouter', label:'OpenRouter', ls:'castroverde_or_key',          url:'https://openrouter.ai/settings/keys'},
];
const getKey = id => { try { return localStorage.getItem(KEYS.find(k => k.id === id).ls) || ''; } catch(e){ return ''; } };

const PROVIDERS = {
  aistudio:   {label:'Google AI Studio (Gemini) · gratis', dynamic:true, models:[
                 {id:'gemini-flash-latest',      label:'Gemini Flash (última)'},
                 {id:'gemini-flash-lite-latest', label:'Gemini Flash-Lite (última)'},
                 {id:'gemini-2.5-flash',         label:'Gemini 2.5 Flash'}]},
  groq:       {label:'Groq · gratis', dynamic:true, models:[
                 {id:'openai/gpt-oss-120b', label:'GPT-OSS 120B'},
                 {id:'llama-3.3-70b-versatile', label:'Llama 3.3 70B'}]},
  mistral:    {label:'Mistral (plan Experiment) · gratis', dynamic:true, models:[
                 {id:'mistral-medium-latest',label:'Mistral Medium'},
                 {id:'mistral-small-latest', label:'Mistral Small'},
                 {id:'mistral-large-latest', label:'Mistral Large'}]},
  openrouter: {label:'OpenRouter (modelos :free) · gratis', dynamic:true, models:[
                 {id:'meta-llama/llama-3.3-70b-instruct:free', label:'meta-llama/llama-3.3-70b-instruct:free'}]},
};
const LIST_KEY = {aistudio:'cuestionarios_gemini_models', groq:'cuestionarios_groq_models', mistral:'cuestionarios_mistral_models', openrouter:'cuestionarios_or_free_models'};

const $ = id => document.getElementById(id);
function loadJSON(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let settings = Object.assign({provider:'aistudio', model:'gemini-flash-latest', nq:10, dif:'medio'}, loadJSON(LS.settings) || {});
if (!PROVIDERS[settings.provider]) { settings.provider = 'aistudio'; settings.model = 'gemini-flash-latest'; }
if (!['basico', 'medio', 'avanzado'].includes(settings.dif)) settings.dif = 'medio';
function saveSettings(){
  settings.nq = Math.max(3, Math.min(50, parseInt($('nq').value, 10) || 10));
  $('nq').value = settings.nq;
  settings.dif = $('dif').value;
  saveJSON(LS.settings, settings);
}

// Instrucciones de dificultad: se añaden al prompt al generar, así funcionan
// aunque hayas modificado el prompt desde el botón «Prompt».
const DIFICULTAD = {
  basico: 'NIVEL DE DIFICULTAD: BÁSICO.\n' +
    '- Pregunta solo por lo esencial y directo del tema: qué es cada cosa, para qué sirve, cómo se llama, cuál es el primer paso.\n' +
    '- Frases muy cortas y sencillas. Las opciones incorrectas deben ser claramente distintas de la correcta.\n' +
    '- Las preguntas de situación, si las hay, deben ser muy simples y de un solo paso.',
  medio: 'NIVEL DE DIFICULTAD: MEDIO.\n' +
    '- Combina preguntas de recordar lo aprendido con otras de aplicarlo en situaciones cotidianas sencillas.\n' +
    '- Las opciones incorrectas deben ser creíbles pero claramente erróneas para quien ha estudiado el tema.',
  avanzado: 'NIVEL DE DIFICULTAD: AVANZADO.\n' +
    '- Pregunta por detalles, matices y excepciones que aparezcan en el texto, por la diferencia entre cosas parecidas y por el orden correcto de varios pasos.\n' +
    '- Plantea más situaciones prácticas en las que haya que decidir qué hacer, no solo recordar un dato.\n' +
    '- Las opciones incorrectas deben ser muy verosímiles y exigir haber estudiado bien el tema (esto prevalece sobre la indicación de que sean "claramente erróneas"). En Verdadero/Falso, usa afirmaciones con matices.\n' +
    '- Aun así, usa lenguaje sencillo y basa todo SOLO en el contenido del documento.'
};
function showStatus(type, msg){ const s = $('status'); s.className = 'status ' + (type || ''); s.textContent = msg || ''; }

// ═════════════════════════════════════════════
//  MODELO
// ═════════════════════════════════════════════
function modelList(prov){
  const c = loadJSON(LIST_KEY[prov]);
  return (c && c.length) ? c : PROVIDERS[prov].models;
}
function renderModel(){
  $('prov').innerHTML = Object.entries(PROVIDERS).map(([k, p]) => `<option value="${k}" ${k === settings.provider ? 'selected' : ''}>${esc(p.label)}</option>`).join('');
  let list = modelList(settings.provider);
  if (!list.some(m => m.id === settings.model)) list = [{id:settings.model, label:settings.model}, ...list];
  $('model').innerHTML = list.map(m => `<option value="${esc(m.id)}" ${m.id === settings.model ? 'selected' : ''}>${esc(m.label)}</option>`).join('');
}
function changeProvider(){
  settings.provider = $('prov').value;
  settings.model = modelList(settings.provider)[0].id;
  saveSettings(); renderModel();
  const p = settings.provider;
  if (!loadJSON(LIST_KEY[p]) && (p === 'openrouter' || getKey(p))) refreshModels(true);
}
function changeModel(){ settings.model = $('model').value; saveSettings(); }

async function refreshModels(quiet){
  const prov = settings.provider;
  try {
    let list = [];
    if (prov === 'openrouter'){
      // Solo los modelos gratuitos (terminan en «:free» o tienen precio 0)
      const r = await fetch('https://openrouter.ai/api/v1/models');
      if (!r.ok) throw new Error('OpenRouter ' + r.status);
      const data = (await r.json()).data || [];
      list = data.filter(m => /:free$/.test(m.id) || (m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0 && !/^openrouter\/auto/.test(m.id)))
        .map(m => ({id:m.id, label:m.id})).sort((a, b) => a.id.localeCompare(b.id));
    } else {
      const key = getKey(prov);
      if (!key){ if (!quiet){ showStatus('err', 'Falta la clave de ' + KEYS.find(k => k.id === prov).label + '.'); openKeys(prov); } return; }
      if (prov === 'aistudio'){
        const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=' + encodeURIComponent(key));
        if (!r.ok) throw new Error('AI Studio ' + r.status);
        const data = (await r.json()).models || [];
        list = data.filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini|gemma/.test(m.name) && !/(embed|tts|image|live|audio|vision|robotics|computer)/.test(m.name))
          .map(m => ({id:m.name.replace(/^models\//, ''), label:(m.displayName || m.name.replace(/^models\//, ''))}));
      } else {
        const url = prov === 'groq' ? 'https://api.groq.com/openai/v1/models' : 'https://api.mistral.ai/v1/models';
        const r = await fetch(url, {headers:{'Authorization':'Bearer ' + key}});
        if (!r.ok) throw new Error(KEYS.find(k => k.id === prov).label + ' ' + r.status);
        const data = (await r.json()).data || [];
        list = data.filter(m => m.active !== false && !/(whisper|tts|guard|embed|ocr|moderation|orpheus|playai|voxtral|transcri|safeguard)/i.test(m.id)
                              && !(m.capabilities && m.capabilities.completion_chat === false))
          .map(m => ({id:m.id, label:m.id})).sort((a, b) => a.id.localeCompare(b.id));
        // Mistral repite modelos con alias: nos quedamos sin duplicados
        list = list.filter((m, i, arr) => arr.findIndex(x => x.id === m.id) === i);
      }
    }
    if (!list.length) throw new Error('la lista ha llegado vacía');
    saveJSON(LIST_KEY[prov], list);
    renderModel();
    if (!quiet) showStatus('ok', 'Lista de modelos actualizada.');
  } catch(e){ if (!quiet) showStatus('err', 'No se ha podido cargar la lista de modelos: ' + e.message); }
}

// ═════════════════════════════════════════════
//  FICHEROS
// ═════════════════════════════════════════════
let items = [];   // {id, file, status:'wait'|'run'|'ok'|'err', error, data}
let busy = false;
let nextId = 1;

function addFiles(fileList){
  const ok = [...fileList].filter(f => /\.(docx|pdf)$/i.test(f.name));
  const skipped = fileList.length - ok.length;
  ok.forEach(f => {
    if (items.some(it => it.file.name === f.name && it.file.size === f.size)) return;
    items.push({id:nextId++, file:f, status:'wait'});
  });
  renderFiles();
  showStatus(skipped ? 'err' : '', skipped ? `Se han ignorado ${skipped} fichero(s): solo se admiten .docx y .pdf (los .doc antiguos hay que guardarlos antes como .docx).` : '');
}
function removeItem(id){ items = items.filter(it => it.id !== id); renderFiles(); }
function clearAll(){ if (busy) return; items = []; renderFiles(); showStatus(''); }

const STATUS_LABEL = {wait:'Pendiente', run:'Generando…', ok:'Listo', err:'Error'};
function renderFiles(){
  $('files').innerHTML = items.map(it => {
    const d = it.data;
    const meta = d ? `${d.emoji} Curso de ${d.curso === 'movil' ? 'Móvil' : 'Ordenador'} · ${d.preguntas.length} preguntas${it.trimmed ? ' · texto recortado' : ''}` : (it.file.size / 1024).toFixed(0) + ' KB';
    return `<div class="file">
      <div><div class="name">${esc(it.file.name)}<span class="st ${it.status}">${STATUS_LABEL[it.status]}</span></div><div class="meta">${esc(meta)}</div></div>
      <div class="acts">
        ${it.status === 'ok' ? `<button class="btn btn-sm btn-green" onclick="downloadItem(${it.id})">⬇️ Descargar</button>` : ''}
        ${(it.status === 'ok' || it.status === 'err') ? `<button class="btn btn-sm" ${busy ? 'disabled' : ''} onclick="regenerate(${it.id})">🔄 Rehacer</button>` : ''}
        <button class="btn btn-sm" ${busy && it.status === 'run' ? 'disabled' : ''} onclick="removeItem(${it.id})" title="Quitar de la lista">✕</button>
      </div>
      ${d ? `<div class="edit">
        <select onchange="editItem(${it.id},'curso',this.value)">
          <option value="ordenador" ${d.curso !== 'movil' ? 'selected' : ''}>Curso de Ordenador</option>
          <option value="movil" ${d.curso === 'movil' ? 'selected' : ''}>Curso de Móvil</option>
        </select>
        <input type="text" class="emoji" value="${esc(d.emoji)}" title="Emoji" onchange="editItem(${it.id},'emoji',this.value)">
        <input type="text" value="${esc(d.titulo)}" title="Título" onchange="editItem(${it.id},'titulo',this.value)">
      </div>` : ''}
      ${it.status === 'err' ? `<div class="errtxt">${esc(it.error)}</div>` : ''}
    </div>`;
  }).join('');
  const done = items.filter(it => it.status === 'ok').length;
  $('btn-run').disabled = busy || !items.some(it => it.status === 'wait' || it.status === 'err');
  $('btn-dlall').disabled = busy || !done;
  $('btn-clear').disabled = busy || !items.length;
}
function editItem(id, field, value){
  const it = items.find(x => x.id === id); if (!it || !it.data) return;
  it.data[field] = value.trim() || it.data[field];
  renderFiles();
}

// Extraer texto
async function extractText(file){
  const buf = await file.arrayBuffer();
  if (/\.docx$/i.test(file.name)){
    if (typeof mammoth === 'undefined') throw new Error('No se ha cargado la librería para leer Word (¿sin conexión?).');
    const res = await mammoth.convertToHtml({arrayBuffer:buf});
    const doc = new DOMParser().parseFromString(res.value, 'text/html');
    const out = [];
    doc.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,td').forEach(el => {
      if (el.tagName === 'P' && el.closest('li,td')) return;
      const t = el.textContent.replace(/\s+/g, ' ').trim(); if (!t) return;
      if (/^H\d$/.test(el.tagName)) out.push('\n' + '#'.repeat(+el.tagName[1]) + ' ' + t);
      else if (el.tagName === 'LI') out.push('- ' + t);
      else out.push(t);
    });
    return out.join('\n').trim();
  }
  if (typeof pdfjsLib === 'undefined') throw new Error('No se ha cargado la librería para leer PDF (¿sin conexión?).');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    let line = '', text = '';
    tc.items.forEach(i => { line += i.str; if (i.hasEOL){ text += line + '\n'; line = ''; } });
    pages.push((text + line).trim());
  }
  return pages.join('\n\n').trim();
}

// ═════════════════════════════════════════════
//  GENERACIÓN
// ═════════════════════════════════════════════
async function runAll(){
  if (busy) return;
  const todo = items.filter(it => it.status === 'wait' || it.status === 'err');
  if (!todo.length) return;
  if (!getKey(settings.provider)){ showStatus('err', 'Falta la clave de ' + KEYS.find(k => k.id === settings.provider).label + '.'); openKeys(settings.provider); return; }
  busy = true;
  let n = 0;
  for (const it of todo){
    if (!items.includes(it)) continue;
    n++; showStatus('', `Generando ${n} de ${todo.length}: ${it.file.name}`);
    await processItem(it);
    if (n < todo.length) await new Promise(r => setTimeout(r, settings.provider === 'groq' ? 6000 : 3000));   // respiro para los límites por minuto
  }
  busy = false;
  const ok = items.filter(it => it.status === 'ok').length, err = items.filter(it => it.status === 'err').length;
  showStatus(err ? 'err' : 'ok', `Terminado: ${ok} listo(s)` + (err ? `, ${err} con error (pulsa «Rehacer» o vuelve a «Generar»).` : '.'));
  renderFiles();
}
async function regenerate(id){
  const it = items.find(x => x.id === id); if (!it || busy) return;
  if (!getKey(settings.provider)){ openKeys(settings.provider); return; }
  busy = true; showStatus('', 'Rehaciendo: ' + it.file.name);
  await processItem(it);
  busy = false;
  showStatus(it.status === 'ok' ? 'ok' : 'err', it.status === 'ok' ? 'Cuestionario rehecho.' : 'No se ha podido rehacer.');
  renderFiles();
}

// Recorte del documento para no superar el contexto / TPM del plan gratuito
const MAX_DOC_CHARS = { groq: 12000, mistral: 100000, aistudio: 150000, openrouter: 60000 };
function trimDoc(text, prov){
  const max = MAX_DOC_CHARS[prov] || 60000;
  if (text.length <= max) return { text, trimmed:false };
  return { text: text.slice(0, max) + '\n\n[...documento recortado por longitud...]', trimmed:true };
}

async function processItem(it){
  it.status = 'run'; it.error = ''; renderFiles();
  try {
    if (!it.text){
      it.text = await extractText(it.file);
      if (it.text.length < 80) throw new Error('No se ha podido extraer texto del documento (¿es un PDF escaneado?).');
    }
    const nq = settings.nq;
    const system = getPrompt().split('{N}').join(String(nq)) + '\n\n' + DIFICULTAD[settings.dif];
    const doc = trimDoc(it.text, settings.provider);
    it.trimmed = doc.trimmed;
    const user = `Documento: «${it.file.name}»\n\n<documento>\n${doc.text}\n</documento>\n\nCrea el cuestionario de ${nq} preguntas. Responde solo con el JSON.`;
    const raw = await callModel({provider:settings.provider, model:settings.model, system, user});
    it.data = validate(parseJSON(raw));
    it.status = 'ok';
  } catch(e){
    it.status = 'err';
    const m = e.message || String(e);
    it.error = /Failed to fetch|NetworkError|CORS/i.test(m) ? 'No se ha podido conectar con la API (sin red, o la API no acepta llamadas desde el navegador). ' + m
             : /\((429|413)\)/.test(m) ? 'Se ha superado el límite del plan gratuito. Espera un minuto y pulsa «Rehacer», o cambia de proveedor. ' + m : m;
  }
  renderFiles();
}

function parseJSON(raw){
  let s = String(raw || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('El modelo no ha devuelto un JSON. Prueba a «Rehacer» o cambia de modelo.');
  s = s.slice(a, b + 1);
  try { return JSON.parse(s); }
  catch(e){
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); }   // comas sobrantes
    catch(_){ throw new Error('El JSON devuelto no es válido (' + e.message + '). Prueba a «Rehacer».'); }
  }
}
function validate(d){
  if (!d || !Array.isArray(d.preguntas) || !d.preguntas.length) throw new Error('La respuesta no contiene preguntas.');
  const qs = [];
  d.preguntas.forEach(p => {
    if (!p || !p.q || !Array.isArray(p.options) || p.options.length < 2) return;
    let correct = parseInt(p.correct, 10);
    if (isNaN(correct) && typeof p.correct === 'string' && /^[A-Za-z]$/.test(p.correct.trim())){
      correct = p.correct.trim().toUpperCase().charCodeAt(0) - 65;
    }
    const isBool = p.type === 'boolean' || (p.options.length === 2 && /^verdadero$/i.test(String(p.options[0]).trim()) && /^falso$/i.test(String(p.options[1]).trim()));
    if (isNaN(correct) || correct < 0 || correct >= p.options.length) return;
    const q = {q:String(p.q).trim(), options:p.options.map(o => String(o).trim()), correct, expl:String(p.expl || '').trim()};
    if (isBool){ q.type = 'boolean'; q.options = ['Verdadero', 'Falso']; }
    qs.push(q);
  });
  if (!qs.length) throw new Error('Ninguna pregunta tenía un formato correcto.');
  const curso = /m[oó]vil/i.test(d.curso || '') ? 'movil' : 'ordenador';
  return {
    curso,
    titulo: String(d.titulo || 'Cuestionario').trim(),
    emoji: String(d.emoji || (curso === 'movil' ? '📱' : '🖥️')).trim(),
    mensajePerfecto: String(d.mensajePerfecto || '¡Perfecto! Lo dominas').trim(),
    preguntas: qs
  };
}

// ═════════════════════════════════════════════
//  LLAMADAS A LAS APIS
// ═════════════════════════════════════════════
async function httpError(resp, who){
  let detail = '';
  try { const j = await resp.json(); detail = (j.error && (j.error.message || j.error)) || j.message || JSON.stringify(j); }
  catch(e){ try { detail = await resp.text(); } catch(_){} }
  if (typeof detail === 'object') detail = JSON.stringify(detail);
  return new Error(`${who} (${resp.status}): ${String(detail).slice(0, 400)}`);
}
function needKey(id){
  const k = getKey(id);
  if (!k){ openKeys(id); throw new Error('Falta la clave de ' + KEYS.find(x => x.id === id).label + '.'); }
  return k;
}
function callModel(o){
  if (o.provider === 'aistudio') return callGemini(o);
  const cfg = {
    openrouter:{url:'https://openrouter.ai/api/v1/chat/completions', who:'OpenRouter', max:null},
    mistral:   {url:'https://api.mistral.ai/v1/chat/completions', who:'Mistral', max:16000},
    // El plan gratuito de Groq limita los tokens por minuto: se pide una salida más corta
    groq:      {url:'https://api.groq.com/openai/v1/chat/completions', who:'Groq', max:4000},
  }[o.provider];
  return callOpenAICompat(o, cfg);
}
async function callGemini({model, system, user}){
  const key = needKey('aistudio');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const gen = {maxOutputTokens:32000};
  if (!/^gemma/i.test(model)) gen.responseMimeType = 'application/json';   // Gemma no soporta modo JSON
  const resp = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:system}]},
      contents:[{role:'user', parts:[{text:user}]}],
      generationConfig: gen
    })
  });
  if (!resp.ok) throw await httpError(resp, 'AI Studio');
  const j = await resp.json();
  const c = j.candidates && j.candidates[0];
  if (!c) throw new Error('AI Studio: respuesta vacía' + (j.promptFeedback ? ' (' + JSON.stringify(j.promptFeedback) + ')' : '.'));
  if (c.finishReason === 'MAX_TOKENS') throw new Error('AI Studio: la respuesta se cortó por longitud. Reduce el número de preguntas.');
  return ((c.content && c.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
}
async function callOpenAICompat({provider, model, system, user}, cfg){
  const key = needKey(provider);
  const headers = {'Content-Type':'application/json', 'Authorization':'Bearer ' + key};
  if (provider === 'openrouter'){ headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Generador de Cuestionarios'; }
  const body = {model, messages:[{role:'system', content:system}, {role:'user', content:user}]};
  if (cfg.max) body.max_tokens = cfg.max;
  // Forzar JSON en los proveedores que lo soportan de forma nativa
  if (provider === 'groq' || provider === 'mistral') body.response_format = {type:'json_object'};
  const resp = await fetch(cfg.url, {method:'POST', headers, body:JSON.stringify(body)});
  if (!resp.ok) throw await httpError(resp, cfg.who);
  const j = await resp.json();
  if (j.error) throw new Error(cfg.who + ': ' + (j.error.message || JSON.stringify(j.error)));
  const ch = j.choices && j.choices[0];
  if (!ch) throw new Error(cfg.who + ': respuesta vacía.');
  if (ch.finish_reason === 'length') throw new Error(cfg.who + ': la respuesta se cortó por longitud. Reduce el número de preguntas.');
  return (ch.message && ch.message.content) || '';
}

// ═════════════════════════════════════════════
//  CONSTRUIR Y DESCARGAR EL CUESTIONARIO
// ═════════════════════════════════════════════
function buildQuiz(d){
  const qs = d.preguntas.map(p => {
    const o = {q:p.q, options:p.options.map(esc), correct:p.correct};   // opciones y explicación se pintan con innerHTML
    if (p.type) o.type = p.type;
    o.expl = esc(p.expl);
    return o;
  });
  const js = s => JSON.stringify(s, null, 2).replace(/<\//g, '<\\/');
  const badge = `${d.emoji} Curso de ${d.curso === 'movil' ? 'Móvil' : 'Ordenador'}`;
  return $('quiz-template').value
    .split('{{TITLE}}').join(esc(d.titulo))
    .split('{{BADGE}}').join(esc(badge))
    .split('{{COUNT}}').join(String(qs.length))
    .split('{{PERFECT}}').join(js(d.mensajePerfecto))
    .split('{{QUESTIONS}}').join(js(qs));
}
function slug(name){
  return name.replace(/\.[^.]+$/, '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cuestionario';
}
function downloadItem(id){
  const it = items.find(x => x.id === id); if (!it || !it.data) return;
  const blob = new Blob([buildQuiz(it.data)], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quiz-' + slug(it.file.name) + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function downloadAll(){
  const ready = items.filter(it => it.status === 'ok');
  for (const it of ready){ downloadItem(it.id); await new Promise(r => setTimeout(r, 400)); }
  if (ready.length > 1) showStatus('ok', 'Si Chrome pregunta, permite «descargar varios archivos».');
}

// ═════════════════════════════════════════════
//  CLAVES
// ═════════════════════════════════════════════
function openOv(id){ $(id).classList.add('open'); }
function closeOv(id){ $(id).classList.remove('open'); }
function openKeys(focusId){
  $('keys-body').innerHTML = '<p class="keynote">Se guardan solo en este navegador. Son las mismas que usan tus otras aplicaciones. Todas tienen plan gratuito (sin tarjeta).</p>' +
    KEYS.map(k => `<div class="keyrow"><label for="key-${k.id}">${k.label}</label><input id="key-${k.id}" type="password" autocomplete="off" spellcheck="false" value="${esc(getKey(k.id))}"><a class="keylink" href="${k.url}" target="_blank" rel="noopener">Conseguir clave gratuita ↗</a></div>`).join('');
  $('showkeys').checked = false;
  openOv('ov-keys');
  setTimeout(() => { const el = $('key-' + (typeof focusId === 'string' ? focusId : settings.provider)); if (el) el.focus(); }, 60);
}
function toggleShowKeys(){ const t = $('showkeys').checked ? 'text' : 'password'; KEYS.forEach(k => $('key-' + k.id).type = t); }
function saveKeys(){
  KEYS.forEach(k => { const v = $('key-' + k.id).value.trim(); try { v ? localStorage.setItem(k.ls, v) : localStorage.removeItem(k.ls); } catch(e){} });
  closeOv('ov-keys'); showStatus('ok', 'Claves guardadas.');
}

// ═════════════════════════════════════════════
//  PROMPT
// ═════════════════════════════════════════════
const defaultPrompt = () => $('default-prompt').value;
function getPrompt(){ try { return localStorage.getItem(LS.prompt) || defaultPrompt(); } catch(e){ return defaultPrompt(); } }
function setPtitle(){ $('ptitle').textContent = ($('ptext').value.trim() === defaultPrompt().trim() ? 'Versión por defecto' : 'Versión modificada') + ' · {N} se sustituye por el número de preguntas'; }
function openPrompt(){ $('ptext').value = getPrompt(); setPtitle(); openOv('ov-prompt'); }
function restorePrompt(){ $('ptext').value = defaultPrompt(); setPtitle(); }
function savePrompt(){
  const v = $('ptext').value;
  try { (v.trim() === defaultPrompt().trim()) ? localStorage.removeItem(LS.prompt) : localStorage.setItem(LS.prompt, v); } catch(e){}
  closeOv('ov-prompt'); showStatus('ok', 'Prompt guardado.');
}
$('ptext').addEventListener('input', setPtitle);

// ═════════════════════════════════════════════
//  INICIO
// ═════════════════════════════════════════════
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
document.querySelectorAll('.overlay').forEach(ov => ov.addEventListener('mousedown', e => { if (e.target === ov) ov.classList.remove('open'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open')); });

$('nq').value = settings.nq;
$('dif').value = settings.dif;
renderModel();
renderFiles();
</script>

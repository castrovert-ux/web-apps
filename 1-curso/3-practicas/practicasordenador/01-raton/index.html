<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prácticas en clase: Componentes del Ratón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #25D366;
    --c2: #128C7E;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
    --suave: rgba(255,255,255,0.04);
    --borde: rgba(255,255,255,0.08);
    --escala: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: 'Nunito', 'Segoe UI', Verdana, sans-serif;
    font-size: calc(clamp(1.05rem, 0.7rem + 1.1vw, 1.75rem) * var(--escala));
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Fondo con manchas de color, como en el cuestionario */
  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(25px, 18px) scale(1.07); }
  }
  header, main, footer { position: relative; z-index: 1; }

  /* Cabecera */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em 1.2em;
    padding: 0.8em clamp(1rem, 3vw, 2.5rem);
    border-bottom: 1px solid var(--borde);
  }
  .tema { flex: 1 1 18em; min-width: 0; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.6em;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 0.35em 1.2em; border-radius: 100px; margin-bottom: 0.4em;
  }
  .tema h1 {
    margin: 0;
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
    font-size: 1.5em; line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .herramientas { display: flex; flex-wrap: wrap; gap: 0.4em; }
  button {
    font: inherit; font-size: 0.8em; font-weight: 700;
    min-height: 2.6em; padding: 0.35em 0.9em;
    color: var(--text); background: var(--suave);
    border: 2px solid var(--borde); border-radius: 14px;
    cursor: pointer; transition: all 0.2s ease;
  }
  button:hover:not(:disabled) { background: rgba(37,211,102,0.1); border-color: var(--c1); }
  button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  /* Práctica */
  main {
    flex: 1; overflow-y: auto;
    padding: clamp(1rem, 3vh, 2.2rem) clamp(1rem, 4vw, 3.5rem);
  }
  .practica {
    max-width: 62em; margin: 0 auto;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: clamp(1.1rem, 3vw, 2.2rem);
  }
  .practica.entra { animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96) translateY(16px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .cabeza { display: flex; align-items: flex-start; gap: 0.6em; }
  .numero {
    flex: none;
    font-family: 'Fredoka One', 'Nunito', sans-serif;
    font-size: 3.2em; line-height: 0.95;
    min-width: 1.1em; text-align: right;
    background: linear-gradient(135deg, var(--c1), var(--c3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cabeza h2 { margin: 0; font-size: 1.5em; font-weight: 800; line-height: 1.2; }
  .objetivo { margin: 0.35em 0 0; font-size: 1.05em; font-weight: 600; color: var(--sub); max-width: 40em; }

  ol.pasos {
    list-style: none; counter-reset: paso;
    margin: 1.2em 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.55em;
    max-width: 46em;
  }
  ol.pasos li {
    counter-increment: paso;
    position: relative;
    padding: 0.6em 1em 0.6em 3.1em;
    font-weight: 600;
    background: var(--suave);
    border: 2px solid var(--borde);
    border-radius: 14px;
  }
  ol.pasos li::before {
    content: counter(paso);
    position: absolute; left: 0.75em; top: 0.6em;
    width: 1.75em; height: 1.75em; border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.9em;
    color: var(--bg); background: var(--c1);
  }

  .fijate {
    margin: 1.2em 0 0; padding: 0.75em 1.1em;
    max-width: 46em;
    font-weight: 700;
    background: rgba(255,217,61,0.1);
    border: 1px solid rgba(255,217,61,0.3);
    border-radius: 12px;
  }
  .fijate b { color: var(--c3); }

  /* Teclas */
  kbd {
    display: inline-block;
    min-width: 1.7em; padding: 0 0.45em;
    font: inherit; font-weight: 800; font-size: 0.9em; line-height: 1.5;
    text-align: center;
    color: var(--text); background: #1c2a47;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 8px;
    box-shadow: 0 0.18em 0 rgba(255,255,255,0.3);
    margin: 0 0.05em 0.18em;
    white-space: nowrap;
  }
  .mas { margin: 0 0.1em; font-weight: 800; color: var(--sub); }

  /* Pie */
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    padding: 0.8em clamp(1rem, 3vw, 2.5rem);
    border-top: 1px solid var(--borde);
    background: rgba(10,22,40,0.6);
  }
  footer button { font-size: 1em; min-width: 7.5em; font-weight: 800; }
  footer button.siguiente {
    color: var(--bg); border: none;
    background: linear-gradient(135deg, var(--c3), #f59e0b);
  }
  footer button.siguiente:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--c3), #f59e0b);
    transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4);
  }
  footer button:disabled { opacity: 0.35; cursor: default; }
  .progreso { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.35em; min-width: 0; }
  .progreso span { font-size: 0.85em; font-weight: 700; color: var(--sub); }
  .barra { width: min(100%, 22em); height: 0.5em; border-radius: 10px; background: var(--borde); overflow: hidden; }
  .barra i {
    display: block; height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--c1), var(--c3));
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* Paneles: lista y atajos */
  .panel {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    padding: clamp(1rem, 4vh, 3rem) clamp(1rem, 4vw, 3rem);
    background: rgba(10,22,40,0.85);
    overflow-y: auto;
  }
  .panel.abierto { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .caja {
    max-width: 60em; margin: 0 auto; padding: 1.3em 1.5em 1.5em;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px;
  }
  .caja .arriba { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-bottom: 0.9em; }
  .caja h2 {
    margin: 0; font-size: 1.3em;
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
    color: var(--c1);
  }
  .indice { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 0.55em; }
  .indice button {
    display: flex; align-items: center; gap: 0.7em; text-align: left;
    font-size: 0.9em; font-weight: 600;
  }
  .indice button b {
    flex: none;
    width: 1.9em; height: 1.9em; border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.9em;
    background: var(--borde);
  }
  .indice button.actual { background: rgba(37,211,102,0.15); border-color: var(--c1); }
  .indice button.actual b { background: var(--c1); color: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95em; font-weight: 600; }
  th, td { text-align: left; padding: 0.55em 0.6em; border-bottom: 1px solid var(--borde); }
  th { color: var(--sub); font-size: 0.8em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .nota { margin: 0.9em 0 0; font-size: 0.85em; color: var(--sub); }

  @media (max-width: 700px) {
    .numero { font-size: 2.4em; }
    .cabeza h2 { font-size: 1.3em; }
    footer button { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .practica.entra, .panel.abierto { animation: none; }
    .barra i, button { transition: none; }
  }
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<header>
  <div class="tema">
    <div class="badge">💻 Prácticas en el ordenador</div>
    <h1>Componentes del Ratón</h1>
  </div>
  <div class="herramientas">
    <button type="button" id="btnLista">Ver todas</button>
    <button type="button" id="btnAtajos">Atajos</button>
    <button type="button" id="btnMenos" aria-label="Letra más pequeña">A−</button>
    <button type="button" id="btnMas" aria-label="Letra más grande">A+</button>
    <button type="button" id="btnPantalla">Pantalla completa</button>
  </div>
</header>

<main id="principal" tabindex="-1">
  <article class="practica" id="practica" aria-live="polite"></article>
</main>

<footer>
  <button type="button" id="btnAnterior">← Anterior</button>
  <div class="progreso">
    <span id="contador"></span>
    <div class="barra" aria-hidden="true"><i id="relleno"></i></div>
  </div>
  <button type="button" class="siguiente" id="btnSiguiente">Siguiente →</button>
</footer>

<div class="panel" id="panelLista" role="dialog" aria-modal="true" aria-labelledby="tituloLista">
  <div class="caja">
    <div class="arriba">
      <h2 id="tituloLista">Todas las prácticas</h2>
      <button type="button" data-cerrar>Cerrar</button>
    </div>
    <div class="indice" id="indice"></div>
  </div>
</div>

<div class="panel" id="panelAtajos" role="dialog" aria-modal="true" aria-labelledby="tituloAtajos">
  <div class="caja">
    <div class="arriba">
      <h2 id="tituloAtajos">Atajos esenciales</h2>
      <button type="button" data-cerrar>Cerrar</button>
    </div>
    <table id="tablaAtajos">
      <thead><tr><th>Acción</th><th>Atajo</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="nota"></p>
  </div>
</div>

<script type="application/json" id="datos">{"titulo":"Componentes del Ratón","clave":"componentes-del-raton","practicas":[{"t":"Mover el cursor y seleccionar un icono","o":"Familiarizarte con el movimiento del ratón y el clic izquierdo para seleccionar un elemento.","f":"Observa cómo el icono se resalta para indicar que está seleccionado.","p":["Mueve el ratón sobre la alfombrilla o la mesa y observa cómo se mueve la flecha (el cursor) en la pantalla.","Coloca el cursor sobre el icono de la «Papelera de reciclaje» en el escritorio.","Haz clic izquierdo una vez sobre el icono de la «Papelera de reciclaje»."]},{"t":"Abrir una aplicación con doble clic","o":"Abrir una aplicación usando el doble clic izquierdo.","f":"Comprueba que se abre una ventana con el título «Papelera de reciclaje».","p":["Con el cursor sobre el icono de la «Papelera de reciclaje», haz doble clic izquierdo (dos clics rápidos seguidos).","Espera a que se abra la ventana de la Papelera de reciclaje."]},{"t":"Cerrar una ventana abierta","o":"Cerrar la ventana de una aplicación.","f":"Asegúrate de que la ventana de la Papelera de reciclaje se cierra.","p":["En la ventana de la «Papelera de reciclaje» que tienes abierta, busca el botón con una «X» en la esquina superior derecha.","Haz clic izquierdo sobre el botón «X»."]},{"t":"Abrir y cerrar desde la barra de tareas","o":"Usar el clic izquierdo en los iconos de la barra de tareas para abrir y cerrar aplicaciones.","f":"La ventana del Explorador de archivos debe cerrarse.","p":["Busca el icono del «Explorador de archivos» (una carpeta amarilla) en la barra de tareas, abajo en la pantalla.","Haz clic izquierdo una vez sobre el icono para abrirlo.","Cuando la ventana del Explorador de archivos esté abierta, haz clic izquierdo en la «X» de la esquina superior derecha para cerrarla."]},{"t":"Abrir el menú contextual del escritorio","o":"Acceder al menú contextual del escritorio con el clic derecho.","f":"Observa que aparece un menú con varias opciones relacionadas con el escritorio.","p":["Mueve el cursor a una zona vacía del escritorio (donde no haya ningún icono ni ventana).","Haz clic derecho una vez."]},{"t":"Mover una ventana de sitio","o":"Arrastrar la barra de título de una ventana para cambiarla de posición.","f":"La ventana del Explorador de archivos se habrá movido de lugar.","p":["Abre de nuevo el «Explorador de archivos» con un clic izquierdo en su icono de la barra de tareas.","Coloca el cursor sobre la barra de título de la ventana (la parte de arriba donde pone «Explorador de archivos»).","Haz clic izquierdo y mantén el botón presionado, arrastra el ratón para mover la ventana a un lado de la pantalla.","Suelta el botón del ratón cuando la ventana esté en la nueva posición."]},{"t":"Desplazarse con la rueda en una web","o":"Usar la rueda de desplazamiento para moverte por una página web.","f":"La página debe desplazarse hacia arriba y hacia abajo mientras usas la rueda.","p":["Abre el navegador «Microsoft Edge» (el icono azul y verde) con un clic izquierdo en la barra de tareas o en el menú Inicio.","En la barra de direcciones de Edge, escribe «wikipedia valladolid» y pulsa {Intro}.","Cuando la página de Wikipedia se cargue, usa la rueda de desplazamiento del ratón para bajar y subir por el texto."]},{"t":"Seleccionar texto en una página web","o":"Seleccionar un fragmento de texto en una página web.","f":"Observa cómo el texto seleccionado se resalta con un color diferente.","p":["En la página de Wikipedia que tienes abierta, busca un párrafo de texto.","Haz clic izquierdo al principio de una frase, mantén el botón presionado y arrastra el ratón hasta el final de la frase.","Suelta el botón del ratón."]},{"t":"Arrastrar y soltar un icono","o":"Practicar la acción de arrastrar y soltar un elemento.","f":"El icono de la Papelera de reciclaje se habrá movido a la nueva posición.","p":["Minimiza el navegador Edge haciendo clic izquierdo en el botón de minimizar (el guion «-») en la esquina superior derecha de la ventana.","Haz clic izquierdo sobre el icono de la «Papelera de reciclaje» en el escritorio y mantén el botón presionado.","Arrastra el icono a otra zona vacía del escritorio y suelta el botón."]},{"t":"Menú contextual de un icono","o":"Acceder al menú contextual de un icono específico.","f":"Observa el menú contextual que aparece con opciones específicas para ese icono.","p":["Haz clic derecho sobre el icono de la «Papelera de reciclaje» que acabas de mover."]},{"t":"RETO: Navegar, seleccionar y cerrar","o":"Combinar varias acciones del ratón para realizar una secuencia de tareas.","f":"Habrás navegado por varias páginas y usado el ratón para interactuar con ellas, y finalmente cerrado el navegador.","p":["Abre el navegador «Microsoft Edge» si lo tienes minimizado (clic izquierdo en su icono de la barra de tareas).","En la barra de búsqueda del navegador, escribe «cruz roja valladolid» y pulsa {Intro}.","Cuando la página de resultados se cargue, haz clic izquierdo en el primer enlace que ponga «Cruz Roja Española».","En la página de Cruz Roja, busca el menú principal (normalmente arriba) y haz clic izquierdo en alguna sección como «Nuestros proyectos».","Usa la rueda de desplazamiento para bajar por la página y ver su contenido.","Haz clic izquierdo y arrastra para seleccionar el título de una sección de la página.","Cierra el navegador Edge haciendo clic en la «X» de la esquina superior derecha."]}],"atajos":[],"nota":""}</script>
<script>
/* Cada práctica: t = título, o = objetivo, p = pasos, f = «Fíjate».
   Las teclas van entre llaves: {Ctrl}+{C} */
const DATOS = JSON.parse(document.getElementById('datos').textContent);
const PRACTICAS = DATOS.practicas;
const ATAJOS = DATOS.atajos || [];
const $ = id => document.getElementById(id);
const CLAVE = 'practicas-' + DATOS.clave;

function esc(t) {
  return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function teclas(t) {
  return esc(t)
    .replace(/\}\+\{/g, '}<span class="mas">+</span>{')
    .replace(/\{([^}]+)\}/g, '<kbd>$1</kbd>');
}

let actual = 0;
let escala = 1;
try {
  const g = JSON.parse(localStorage.getItem(CLAVE)) || {};
  if (Number.isInteger(g.actual) && g.actual >= 0 && g.actual < PRACTICAS.length) actual = g.actual;
  if (typeof g.escala === 'number') escala = g.escala;
} catch (e) {}

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify({ actual, escala })); } catch (e) {}
}

function pintar() {
  const x = PRACTICAS[actual];
  const art = $('practica');
  art.classList.remove('entra');
  void art.offsetWidth;
  art.classList.add('entra');
  art.innerHTML =
    '<div class="cabeza"><span class="numero">' + (actual + 1) + '</span><div>' +
    '<h2>' + teclas(x.t) + '</h2><p class="objetivo">' + teclas(x.o) + '</p></div></div>' +
    '<ol class="pasos">' + x.p.map(s => '<li>' + teclas(s) + '</li>').join('') + '</ol>' +
    '<p class="fijate"><b>💡 Fíjate:</b> ' + teclas(x.f) + '</p>';
  $('contador').textContent = 'Práctica ' + (actual + 1) + ' de ' + PRACTICAS.length;
  $('relleno').style.width = ((actual + 1) / PRACTICAS.length * 100) + '%';
  $('btnAnterior').disabled = actual === 0;
  $('btnSiguiente').disabled = actual === PRACTICAS.length - 1;
  document.title = (actual + 1) + '. ' + x.t + ' · ' + DATOS.titulo;
  $('principal').scrollTop = 0;
  guardar();
}

function ir(i) {
  actual = Math.max(0, Math.min(PRACTICAS.length - 1, i));
  pintar();
}

function aplicarEscala() {
  document.documentElement.style.setProperty('--escala', escala);
  guardar();
}

/* Paneles */
function abrir(id) {
  if (id === 'panelLista') {
    $('indice').innerHTML = PRACTICAS.map((x, i) =>
      '<button type="button" data-ir="' + i + '"' + (i === actual ? ' class="actual"' : '') +
      '><b>' + (i + 1) + '</b><span>' + esc(x.t) + '</span></button>').join('');
  }
  $(id).classList.add('abierto');
  $(id).querySelector('button').focus();
}
function cerrar() {
  document.querySelectorAll('.panel.abierto').forEach(p => p.classList.remove('abierto'));
}

$('tablaAtajos').querySelector('tbody').innerHTML =
  ATAJOS.map(a => '<tr><td>' + esc(a[0]) + '</td><td>' + teclas(a[1]) + '</td></tr>').join('');
document.querySelector('#panelAtajos .nota').innerHTML = teclas(DATOS.nota || '');
if (!ATAJOS.length) $('btnAtajos').hidden = true;

$('btnAnterior').onclick = () => ir(actual - 1);
$('btnSiguiente').onclick = () => ir(actual + 1);
$('btnLista').onclick = () => abrir('panelLista');
$('btnAtajos').onclick = () => abrir('panelAtajos');
$('btnMas').onclick = () => { escala = Math.min(1.6, +(escala + 0.1).toFixed(1)); aplicarEscala(); };
$('btnMenos').onclick = () => { escala = Math.max(0.7, +(escala - 0.1).toFixed(1)); aplicarEscala(); };
$('btnPantalla').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  $('btnPantalla').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
});

document.querySelectorAll('.panel').forEach(p => {
  p.addEventListener('click', e => {
    if (e.target === p || e.target.hasAttribute('data-cerrar')) cerrar();
    const b = e.target.closest('[data-ir]');
    if (b) { ir(+b.dataset.ir); cerrar(); }
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrar(); return; }
  if (document.querySelector('.panel.abierto')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); ir(actual + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ir(actual - 1); }
});

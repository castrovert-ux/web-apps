<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acciones en el ordenador · Práctica</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #25D366; --c3: #FFD93D; --c4: #FF6B6B; --c5: #6BCB77; --c6: #4DA3FF; --c7: #C77DFF;
    --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
    --win: #f3f5f8; --win-ink: #1b2433; /* Windows light theme colors */
    --accent: var(--c6);
    color-scheme: dark;
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.14; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 45vw; height: 45vw; background: var(--c7); top: -12vw; left: -10vw; }
  .blob:nth-child(2) { width: 35vw; height: 35vw; background: var(--c4); bottom: -10vw; right: -8vw; animation-delay: -5s; }
  .blob:nth-child(3) { width: 28vw; height: 28vw; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(25px,18px) scale(1.07); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Estructura ---------- */
  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 2.2vh 2.6vw 1.6vh; gap: 1.6vh; }
  .top { display: flex; align-items: center; gap: 1.4vw; flex-shrink: 0; }
  .badge {
    background: linear-gradient(135deg, var(--c7), #8a3fd6); color: #fff; font-weight: 800;
    font-size: clamp(0.7rem, 1vw, 1.05rem); letter-spacing: 2px; text-transform: uppercase;
    padding: 0.5em 1.4em; border-radius: 100px; white-space: nowrap;
  }
  .top-title { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1rem, 1.7vw, 1.9rem); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { margin-left: auto; display: flex; gap: 0.6vw; }
  .tbtn {
    border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: var(--sub);
    font-weight: 800; font-size: clamp(0.8rem, 1vw, 1.1rem); padding: 0.45em 0.9em; border-radius: 12px; cursor: pointer;
  }
  .tbtn:hover { color: var(--text); border-color: var(--c6); }
  .stage { flex: 1; min-height: 0; display: flex; }
  .slide { flex: 1; min-height: 0; display: flex; animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1); }

  /* ---------- Portada / menú ---------- */
  .menu { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.6vh; }
  .menu .big-emoji { font-size: clamp(3rem, 7vw, 7rem); line-height: 1; }
  .menu h1 {
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.2rem, 5.6vw, 6.4rem); line-height: 1.05;
    background: linear-gradient(135deg, var(--c7), var(--c4), var(--c3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .menu p { color: var(--sub); font-weight: 700; font-size: clamp(1rem, 1.9vw, 2.2rem); max-width: 32em; line-height: 1.35; }
  .menu p b { color: var(--text); }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2vw; width: min(94vw, 1500px); }
  .card {
    flex: 0 0 calc(25% - 1vw); background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-top: 5px solid var(--ac);
    border-radius: 22px; padding: 1.8vh 0.8vw; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.6vh;
    font-weight: 800; font-size: clamp(0.9rem, 1.35vw, 1.55rem); line-height: 1.15; transition: transform 0.15s;
  }
  .card:hover { transform: translateY(-4px); }
  .card .ce { font-size: clamp(1.8rem, 3.2vw, 3.6rem); }
  .card.done { border-color: rgba(37,211,102,0.45); border-top-color: var(--ac); }
  .stars { color: var(--c3); letter-spacing: 2px; font-size: 0.95em; }
  .stars i { color: rgba(255,255,255,0.22); font-style: normal; }

  /* ---------- Ejercicio ---------- */
  .ex { gap: 2vw; }
  .ex-main {
    flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none;
    background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-left: 0.6vw solid var(--accent);
    border-radius: 28px; padding: 2.6vh 2.2vw;
  }
  .ex-main::-webkit-scrollbar { display: none; }
  .ex-head { display: flex; align-items: center; gap: 1.4vw; margin-bottom: 1vh; }
  .ex-icon {
    width: clamp(48px, 5vw, 100px); aspect-ratio: 1; border-radius: 22%; flex-shrink: 0; display: grid; place-items: center;
    font-size: clamp(1.5rem, 2.8vw, 3.4rem); background: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .ex-num { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-size: clamp(0.75rem, 1vw, 1.2rem); }
  .ex-title { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.5rem, 2.8vw, 3.3rem); line-height: 1.1; }
  .ex-obj { color: var(--sub); font-weight: 700; font-size: clamp(0.95rem, 1.45vw, 1.7rem); margin-bottom: 1.2vh; }
  .brands { display: none; } /* No brands for PC */
  .ex-note {
    font-weight: 700; color: var(--sub); line-height: 1.4; font-size: clamp(0.88rem, 1.3vw, 1.5rem);
    background: rgba(77,163,255,0.1); border-radius: 14px; padding: 0.55em 1em; margin-bottom: 1.4vh;
  }
  .ex-note b { color: var(--text); }
  .now {
    background: rgba(255,217,61,0.09); border: 3px solid var(--c3); border-radius: 18px; padding: 1.3vh 1.2vw;
    box-shadow: 0 0 0 6px rgba(255,217,61,0.08);
  }
  .now-n { color: var(--c3); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: clamp(0.72rem, 0.95vw, 1.15rem); }
  .now-t { font-weight: 700; line-height: 1.3; font-size: clamp(1.1rem, 1.95vw, 2.4rem); margin-top: 0.5vh; }
  .now-t b { color: var(--c3); font-weight: 800; }
  .fb { display: none; margin-top: 1.4vh; font-weight: 800; line-height: 1.3; border-radius: 14px; padding: 0.6em 1em; font-size: clamp(0.92rem, 1.4vw, 1.7rem); }
  .fb.ok { display: block; background: rgba(37,211,102,0.15); color: #86ffb0; }
  .fb.bad { display: block; background: rgba(255,107,107,0.15); color: #ffa3a3; }
  .fb.soft { display: block; background: rgba(77,163,255,0.15); color: #b0d6ff; }
  .acts { display: flex; flex-wrap: wrap; gap: 1vw; margin-top: auto; padding-top: 1.6vh; }
  .abtn {
    border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 800;
    border-radius: 14px; padding: 0.5em 1.1em; cursor: pointer; font-size: clamp(0.92rem, 1.35vw, 1.6rem);
  }
  .abtn:hover { border-color: var(--c3); }
  .abtn.go { border: 0; background: linear-gradient(135deg, var(--c1), #1aa851); color: #0a1628; }
  .abtn[hidden] { display: none; }
  .pips { display: flex; gap: 0.5vw; margin-top: 1.4vh; }
  .pip { flex: 1; height: 7px; border-radius: 6px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
  .pip.past { background: var(--c1); }
  .pip.cur { background: var(--c3); }
  .ex-side { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 1vw; }

  /* ---------- Monitor de mentira ---------- */
  .monitor {
    --mon-w: clamp(600px, 80vw, 1200px); /* Max width for monitor */
    --mon-h: calc(var(--mon-w) * 9 / 16); /* 16:9 aspect ratio */
    width: var(--mon-w); height: var(--mon-h);
    font-size: calc(var(--mon-w) / 100); /* Base font size relative to width */
    background: #000; border-radius: 0.8em; padding: 0.6em; position: relative;
    box-shadow: 0 0 0 0.14em #2a3550, 0 1.6em 3.5em rgba(0,0,0,0.55);
    flex-shrink: 0;
  }
  .mon-in {
    position: relative; width: 100%; height: 100%;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 1920 1080' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231a5276'/%3E%3Cstop offset='100%25' stop-color='%234a2e8c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1920' height='1080' fill='url(%23a)'/%3E%3C/svg%3E") center / cover;
    border-radius: 0.5em; overflow: hidden; display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
    font-family: 'Segoe UI', sans-serif; /* Windows font */
    color: #fff;
  }
  .mon-in.okp { animation: okp 0.5s; }
  @keyframes okp { 0% { box-shadow: inset 0 0 0 0 rgba(37,211,102,0); } 40% { box-shadow: inset 0 0 0 0.45em rgba(37,211,102,0.75); } 100% { box-shadow: inset 0 0 0 0 rgba(37,211,102,0); } }

  .mon-in .click, .mon-in .dclick, .mon-in .rclick, .mon-in .drag { cursor: pointer; }
  .mon-in .dragz { cursor: grab; }

  /* Desktop */
  .desktop { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  .taskbar {
    height: 3.2em; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
    display: flex; align-items: center; padding: 0 0.5em; gap: 0.4em;
    flex-shrink: 0;
  }
  .tb-icon { width: 2.2em; height: 2.2em; border-radius: 0.4em; display: grid; place-items: center; font-size: 1.4em; color: #fff; }
  .tb-icon.start { background: #0078D4; }
  .tb-icon.explorer { background: #0078D4; }
  .tb-icon.active { background: rgba(255,255,255,0.2); }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 0.5em; font-size: 0.8em; color: #fff; }

  /* Explorer Window */
  .window {
    position: absolute; top: 5%; left: 10%; width: 80%; height: 85%;
    background: var(--win); border-radius: 0.6em; overflow: hidden;
    box-shadow: 0 0.5em 2em rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    color: var(--win-ink);
  }
  .window-bar {
    height: 2.2em; background: #e0e5ed; display: flex; align-items: center; padding: 0 0.8em;
    font-weight: 600; font-size: 0.9em; flex-shrink: 0;
  }
  .window-bar span { margin-left: 0.6em; }
  .win-controls { margin-left: auto; display: flex; gap: 0.2em; }
  .win-btn { width: 1.8em; height: 1.8em; border-radius: 0.3em; display: grid; place-items: center; font-size: 1em; }
  .win-btn.close { color: #fff; background: #e81123; }

  .explorer-content { flex: 1; display: flex; }
  .exp-left {
    width: 25%; background: #e8edf6; padding: 0.8em 0.5em; flex-shrink: 0;
    font-size: 0.85em; font-weight: 600;
  }
  .exp-nav { display: flex; flex-direction: column; gap: 0.2em; }
  .exp-nav-item {
    padding: 0.3em 0.5em; border-radius: 0.3em;
    display: flex; align-items: center; gap: 0.5em;
  }
  .exp-nav-item.active { background: #cee7fd; color: #005aa3; }
  .exp-nav-item.click { cursor: pointer; }

  .exp-main { flex: 1; display: flex; flex-direction: column; }
  .exp-toolbar {
    height: 3em; background: #f3f5f8; border-bottom: 1px solid #e0e5ed;
    display: flex; align-items: center; padding: 0 0.8em; gap: 0.5em;
  }
  .exp-tbtn {
    padding: 0.4em 0.8em; border-radius: 0.4em; background: #e0e5ed;
    font-size: 0.8em; font-weight: 600; display: flex; align-items: center; gap: 0.3em;
  }
  .exp-tbtn.primary { background: #0078D4; color: #fff; }
  .exp-tbtn.click { cursor: pointer; }

  .exp-path {
    background: #fff; border: 1px solid #c9d7e7; border-radius: 0.4em;
    padding: 0.4em 0.7em; flex: 1; margin-right: 0.5em;
    font-size: 0.8em; color: #4a5d71;
  }
  .exp-items { flex: 1; padding: 0.8em; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0.8em; overflow-y: auto; }
  .exp-item {
    width: 6em; height: 6.5em; border-radius: 0.4em; padding: 0.5em;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    font-size: 0.75em; font-weight: 600; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: relative;
  }
  .exp-item.click, .exp-item.dclick, .exp-item.rclick, .exp-item.drag { cursor: pointer; }
  .exp-item.selected { background: #d0e8fd; border: 1px solid #a8d7fc; }
  .exp-item-icon { font-size: 2.8em; margin-bottom: 0.2em; }
  .exp-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }

  .exp-empty-space {
    position: absolute; inset: 0;
    pointer-events: auto; /* To allow clicks on empty space */
  }
  .exp-empty-space.rclick { cursor: context-menu; }
  .exp-empty-space.drag { cursor: crosshair; }

  /* Context Menu */
  .context-menu {
    position: absolute; background: #fff; border-radius: 0.4em;
    box-shadow: 0 0.3em 1em rgba(0,0,0,0.2);
    padding: 0.3em 0; z-index: 100;
    font-size: 0.85em; font-weight: 600;
    color: var(--win-ink);
  }
  .cm-item { padding: 0.4em 1.2em; white-space: nowrap; }
  .cm-item:hover { background: #e0e5ed; }
  .cm-item.click { cursor: pointer; }
  .cm-sep { height: 1px; background: #e0e5ed; margin: 0.3em 0; }

  /* Dialogs */
  .dialog-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: grid; place-items: center; z-index: 200;
  }
  .dialog {
    background: #fff; border-radius: 0.6em; padding: 1.5em; width: 26em;
    box-shadow: 0 0.5em 2em rgba(0,0,0,0.4);
    font-size: 0.9em; color: var(--win-ink);
  }
  .dialog-title { font-weight: 700; font-size: 1.1em; margin-bottom: 0.8em; }
  .dialog-msg { margin-bottom: 1.2em; line-height: 1.4; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 0.6em; }
  .dialog-btn {
    padding: 0.6em 1.2em; border-radius: 0.4em; background: #e0e5ed;
    font-size: 0.8em; font-weight: 600; cursor: pointer;
  }
  .dialog-btn.primary { background: #0078D4; color: #fff; }

  /* Overlay for keyboard input */
  .keyboard-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: grid; place-items: center; z-index: 300;
    color: #fff; font-size: 1.2em;
  }
  .keyboard-prompt {
    background: rgba(0,0,0,0.8); padding: 1.5em 2em; border-radius: 0.8em;
    text-align: center;
  }
  .keyboard-prompt b { color: var(--c3); }
  .keyboard-input {
    background: #fff; color: #000; border: 0; border-radius: 0.4em;
    padding: 0.5em 0.8em; font-size: 1em; margin-top: 1em; width: 15em;
  }

  .bigcheck { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,22,40,0.5); }
  .bigcheck span { width: 4em; height: 4em; border-radius: 50%; background: var(--c1); color: #0a1628; display: grid; place-items: center; font-size: 1.6em; font-weight: 900; animation: popIn 0.5s; }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; animation: fl 0.5s forwards; }
  @keyframes fl { from { opacity: 0.95; } to { opacity: 0; } }

  .hint { outline: 0.22em solid var(--c3); outline-offset: 0.12em; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { outline-color: rgba(255,217,61,0.25); } }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-0.3em); } 75% { transform: translateX(0.3em); } }
  .holding { position: relative; }
  .holding::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(255,217,61,0.45); transform-origin: left; animation: fill 0.7s linear forwards; pointer-events: none; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dragging { opacity: 0.7; }

  /* ---------- Final ---------- */
  .finish { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2vh; }
  .trophy { font-size: clamp(4rem, 10vw, 11rem); animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-14px) rotate(5deg); } }
  .finish h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.2rem, 5vw, 5.8rem); color: var(--c3); }
  .finish p { color: var(--sub); font-weight: 700; font-size: clamp(1rem, 1.9vw, 2.3rem); max-width: 32em; line-height: 1.4; }
  .finish p b { color: var(--text); }
  .sumlist { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vw; max-width: 90vw; }
  .sumlist span { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; padding: 0.35em 1em; font-weight: 800; font-size: clamp(0.9rem, 1.4vw, 1.6rem); }

  /* ---------- Barra inferior ---------- */
  .bottom { flex-shrink: 0; display: flex; align-items: center; gap: 1.4vw; }
  .nav { border: 0; border-radius: 16px; cursor: pointer; font-weight: 800; white-space: nowrap; font-size: clamp(1rem, 1.5vw, 1.8rem); padding: 0.6em 1.4em; transition: transform 0.15s; }
  .nav:hover { transform: scale(1.04); }
  .nav:disabled { opacity: 0.3; cursor: default; transform: none; }
  .nav-prev { background: rgba(255,255,255,0.07); color: var(--text); }
  .nav-next { background: linear-gradient(135deg, var(--c1), #1aa851); color: #0a1628; }
  .dots { flex: 1; display: flex; justify-content: center; align-items: center; gap: 0.7vw; flex-wrap: wrap; }
  .dot {
    height: clamp(30px, 3vw, 56px); min-width: clamp(30px, 3vw, 56px); padding: 0 0.6em; border-radius: 100px; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--sub);
    font-weight: 800; font-size: clamp(0.85rem, 1.25vw, 1.5rem); transition: all 0.2s;
  }
  .dot.seen { color: var(--text); border-color: rgba(37,211,102,0.5); background: rgba(37,211,102,0.1); }
  .dot.on { color: #0a1628; background: var(--c3); border-color: var(--c3); transform: scale(1.12); }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.06); z-index: 2; }
  .prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c7), var(--c4), var(--c3)); transition: width 0.4s; }
  .help { color: var(--sub); font-weight: 700; font-size: clamp(0.75rem, 0.95vw, 1.05rem); text-align: center; flex-shrink: 0; opacity: 0.7; }

  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    html, body { height: auto; }
    .app { min-height: 100vh; height: auto; }
    .ex { flex-direction: column; }
    .ex-main { overflow: visible; padding: 2vh 4vw; border-left-width: 6px; }
    .ex-side { padding: 1vh 0 2vh; }
    .monitor { --mon-w: min(95vw, 800px); --mon-h: calc(var(--mon-w) * 9 / 16); }
    .card { flex-basis: calc(50% - 1vw); }
    .top-title { display: none; }
    .now-t { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<div class="app">
  <div class="top">
    <div class="badge">💻 Práctica</div>
    <div class="top-title" id="top-title">Acciones en el ordenador</div>
    <div class="top-actions">
      <button class="tbtn" id="btn-full" type="button" title="Pantalla completa (tecla F)">⛶ Pantalla completa</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="bottom">
    <button class="nav nav-prev" id="prev" type="button">◀ Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="nav nav-next" id="next" type="button">Empezar ▶</button>
  </div>
  <div class="help">Usa el ratón sobre el ordenador de la pantalla como si fuera el tuyo · Si te atascas, pulsa 💡 Pista</div>
</div>
<div class="prog"><div class="prog-fill" id="prog-fill"></div></div>

<script>
const $ = id => document.getElementById(id);
const qs = s => document.querySelector(s);
const qsa = s => Array.from(document.querySelectorAll(s));
const oks = s => [].concat(s.ok);

/* =========================================================
   Piezas para dibujar las pantallas del ordenador de mentira
   ========================================================= */

const FILES = {
  'foto_vacaciones.jpg': '🌄', 'documento_clase.docx': '📄', 'cancion_favorita.mp3': '🎵',
  'presentacion.pptx': '📊', 'informe_anual.pdf': '📝', 'video_gatos.mp4': '🎥',
  'mi_dibujo.png': '🎨', 'receta_tarta.txt': '🗒️', 'carta_amiga.odt': '✉️',
  'ejercicio_1.xlsx': '📈', 'video_gatos (copia).mp4': '🎥'
};
const FOLDERS = {
  'Fotos': '🗂️', 'Documentos': '🗂️', 'Música': '🗂️', 'Descargas': '🗂️', 'Clase': '🗂️', 'Personal': '🗂️',
  'Vacaciones': '🗂️', 'Trabajo': '🗂️', 'Videos': '🗂️', 'Cosas': '🗂️', 'Pendrive': '💾'
};

const getIcon = name => FILES[name] || FOLDERS[name] || '❓';
const itemHTML = (name, type, id, selected = false, action = 'click') => `
  <div class="exp-item ${action}${selected ? ' selected' : ''}" data-id="${id}" data-name="${name}" data-type="${type}">
    <span class="exp-item-icon">${getIcon(name)}</span>
    <span class="exp-item-name">${name}</span>
  </div>`;

const desktop = () => `
  <div class="desktop">
    <div class="taskbar">
      <div class="tb-icon start click" data-id="start">🪟</div>
      <div class="tb-icon search click" data-id="search">🔍</div>
      <div class="tb-icon explorer click" data-id="explorer-tb">📁</div>
      <div class="tb-icon edge click" data-id="edge">🌐</div>
      <div class="tb-right">
        <span>ES</span>
        <span>10:24<br>21/10/24</span>
      </div>
    </div>
  </div>`;

const explorerWindow = (ctx) => {
  const pathParts = ctx.path.split('/');
  const currentFolder = pathParts[pathParts.length - 1];
  const itemsInFolder = ctx.folders[ctx.path] || [];

  const renderItem = (item) => {
    const isSelected = ctx.selected.includes(item.name);
    const itemType = FOLDERS[item.name] ? 'folder' : FILES[item.name] ? 'file' : 'unknown';
    return itemHTML(item.name, itemType, item.name, isSelected, ctx.itemAction);
  };

  const navItem = (id, name, icon) => `
    <div class="exp-nav-item click${ctx.path === id ? ' active' : ''}" data-id="${id}">
      <span>${icon}</span><span>${name}</span>
    </div>`;

  const toolbarButton = (id, label, icon, primary = false) => `
    <div class="exp-tbtn click${primary ? ' primary' : ''}" data-id="${id}">
      ${icon ? `<span>${icon}</span>` : ''}<span>${label}</span>
    </div>`;

  return `
    ${desktop()}
    <div class="window" id="explorer-win">
      <div class="window-bar">
        <span>📁 ${currentFolder}</span>
        <div class="win-controls">
          <div class="win-btn minimize click" data-id="minimize">➖</div>
          <div class="win-btn maximize click" data-id="maximize">🗖</div>
          <div class="win-btn close click" data-id="close-win">✕</div>
        </div>
      </div>
      <div class="exp-toolbar">
        ${toolbarButton('copy-btn', 'Copiar', '📄', ctx.clipboard.type === 'copy')}
        ${toolbarButton('cut-btn', 'Cortar', '✂️', ctx.clipboard.type === 'cut')}
        ${toolbarButton('paste-btn', 'Pegar', '📋', ctx.clipboard.items.length > 0)}
        ${toolbarButton('delete-btn', 'Eliminar', '🗑️')}
        <div class="exp-path">${ctx.path.replace(/\//g, ' › ')}</div>
      </div>
      <div class="explorer-content">
        <div class="exp-left">
          <div class="exp-nav">
            ${navItem('Acceso rápido', 'Acceso rápido', '⭐')}
            ${navItem('OneDrive', 'OneDrive', '☁️')}
            ${navItem('Este equipo', 'Este equipo', '💻')}
            ${navItem('Este equipo/Documentos', 'Documentos', FOLDERS['Documentos'])}
            ${navItem('Este equipo/Descargas', 'Descargas', FOLDERS['Descargas'])}
            ${navItem('Este equipo/Imágenes', 'Imágenes', '🖼️')}
            ${ctx.pendriveConnected ? navItem('Este equipo/Pendrive', 'Pendrive', '💾') : ''}
          </div>
        </div>
        <div class="exp-main">
          <div class="exp-items" id="exp-items">
            <div class="exp-empty-space drag rclick" data-id="empty-space"></div>
            ${itemsInFolder.map(renderItem).join('')}
          </div>
        </div>
      </div>
    </div>`;
};

const contextMenu = (ctx) => {
  if (!ctx.contextMenu.visible) return '';
  return `
    <div class="context-menu" style="left:${ctx.contextMenu.x}px; top:${ctx.contextMenu.y}px;">
      ${ctx.contextMenu.options.map(opt => {
        if (opt === 'sep') return '<div class="cm-sep"></div>';
        return `<div class="cm-item click" data-id="cm-${opt.id}">${opt.label}</div>`;
      }).join('')}
    </div>`;
};

const fileReplaceDialog = (ctx) => {
  if (!ctx.dialog || ctx.dialog.type !== 'replace') return '';
  return `
    <div class="dialog-overlay">
      <div class="dialog">
        <div class="dialog-title">Confirmar reemplazo de archivo o carpeta</div>
        <div class="dialog-msg">Ya existe un archivo con el nombre "${ctx.dialog.file}" en esta ubicación.<br>¿Qué quieres hacer?</div>
        <div class="dialog-actions">
          <div class="dialog-btn click" data-id="cancel-dialog">Cancelar</div>
          <div class="dialog-btn click" data-id="skip-dialog">Omitir</div>
          <div class="dialog-btn primary click" data-id="replace-dialog">Reemplazar</div>
        </div>
      </div>
    </div>`;
};

const keyboardInput = (ctx) => {
  if (!ctx.inputActive) return '';
  return `
    <div class="keyboard-overlay">
      <div class="keyboard-prompt">
        <p>Pulsa las teclas <b>${ctx.inputKey}</b> en tu teclado real.</p>
        <p>Luego, haz clic en <b>Continuar</b>.</p>
        <button class="abtn go" data-id="keyboard-continue" type="button" style="margin-top:1.5em;">Continuar ▶</button>
      </div>
    </div>`;
};

/* =========================================================
   Ejercicios
   ========================================================= */
const T = (text, hint, ok, screen, extra = {}) => ({ text, hint, ok, screen, do: 'click', ...extra });

const EX = [
  { icon:'📁', accent:'var(--c6)', title:'Abrir el Explorador', objective:'Abrir el Explorador de archivos y seleccionar un elemento.',
    note: () => 'El <b>Explorador de archivos</b> es tu ventana para ver archivos y carpetas. Puedes abrirlo de varias formas.',
    steps: () => [
      T('Abre el Explorador de archivos haciendo clic en su <b>icono de carpeta amarilla</b> en la barra de tareas.', 'Busca la carpeta amarilla en la parte de abajo de la pantalla.', 'explorer-tb', () => desktop(), {ctx: {explorer: false}}),
      T('Entra en la carpeta <b>Documentos</b>. Haz clic para abrirla.', 'Busca "Documentos" en el panel izquierdo y haz clic.', 'Este equipo/Documentos', ctx => explorerWindow(ctx), { ctx: { explorer: true, path: 'Este equipo/Documentos', itemAction: 'click' } }),
      T('Selecciona el archivo <b>documento_clase.docx</b> con un clic.', 'Haz clic una sola vez sobre "documento_clase.docx".', 'documento_clase.docx', ctx => explorerWindow(ctx), { after: ctx => { ctx.selected = ['documento_clase.docx']; }, done:'¡Muy bien! El archivo está seleccionado.' })
    ] },

  { icon:'🔢', accent:'var(--c4)', title:'Seleccionar varios', objective:'Seleccionar varios archivos o carpetas a la vez.',
    note: () => 'Puedes seleccionar varios elementos para copiarlos, moverlos o borrarlos todos juntos.',
    steps: () => [
      T('Haz clic en <b>documento_clase.docx</b>.', 'Haz clic en el archivo.', 'documento_clase.docx', ctx => explorerWindow(ctx), { ctx: { explorer: true, path: 'Este equipo/Documentos', itemAction: 'click', selected: [] }, after: ctx => { ctx.selected = ['documento_clase.docx']; } }),
      T('Mantén pulsada la tecla <b>Ctrl</b> y haz clic en <b>informe_anual.pdf</b>. Suelta Ctrl.', 'Mantén Ctrl apretado, haz clic en "informe_anual.pdf" y luego suelta Ctrl.', 'informe_anual.pdf', ctx => explorerWindow(ctx), { do:'ctrl_click', after: ctx => { ctx.selected.push('informe_anual.pdf'); }, done:'¡Perfecto! Has seleccionado dos elementos separados.' }),
      T('Ahora, selecciona <b>todos los elementos</b> de la carpeta usando el atajo de teclado <b>Ctrl + E</b>.', 'Pulsa Ctrl y la tecla E a la vez en tu teclado real.', 'keyboard_Ctrl+E', ctx => explorerWindow(ctx),
        { do:'keyboard', inputKey:'Ctrl + E', after: ctx => { ctx.selected = ctx.folders[ctx.path].map(f => f.name); }, done:'¡Todos seleccionados! Muy útil para grandes cantidades.' })
    ] },

  { icon:'📄', accent:'var(--c3)', title:'Copiar y pegar', objective:'Copiar un archivo a otra carpeta usando los botones del Explorador.',
    note: () => 'Copiar crea una copia del archivo en otro lugar sin borrar el original.',
    steps: () => [
      T('Selecciona la carpeta <b>Clase</b>.', 'Haz clic en la carpeta "Clase".', 'Clase', ctx => explorerWindow(ctx), { ctx: { explorer: true, path: 'Este equipo/Documentos', itemAction: 'click', selected: [] }, after: ctx => { ctx.selected = ['Clase']; } }),
      T('Pulsa el botón <b>Copiar</b> en la barra de arriba.', 'Es el botón con el icono de dos documentos 📄.', 'copy-btn', ctx => explorerWindow(ctx), { after: ctx => { ctx.clipboard = { type:'copy', items:['Clase'] }; ctx.selected = []; }, done:'¡Copiado al portapapeles!' }),
      T('Entra en la carpeta <b>Personal</b> haciendo doble clic.', 'Busca "Personal" y haz doble clic para abrirla.', 'Personal', ctx => explorerWindow(ctx), { do:'dclick', after: ctx => { ctx.path = 'Este equipo/Documentos/Personal'; }, done:'¡Carpeta Personal abierta!' }),
      T('Pulsa el botón <b>Pegar</b> en la barra de arriba.', 'Es el botón con el icono de un portapapeles 📋.', 'paste-btn', ctx => explorerWindow(ctx),
        { after: ctx => { ctx.folders[ctx.path].push({ name:'Clase', type:'folder' }); ctx.clipboard = { type:null, items:[] }; }, done:'¡Carpeta copiada!' })
    ] },

  { icon:'✂️', accent:'var(--c7)', title:'Mover con atajos', objective:'Mover un archivo de una carpeta a otra usando atajos de teclado.',
    note: () => 'Cortar y pegar sirve para mover un elemento, quitándolo de su lugar original.',
    steps: () => [
      T('Selecciona el archivo <b>foto_vacaciones.jpg</b>.', 'Haz clic en la foto.', 'foto_vacaciones.jpg', ctx => explorerWindow(ctx), { ctx: { explorer: true, path: 'Este equipo/Documentos', itemAction: 'click', selected: [] }, after: ctx => { ctx.selected = ['foto_vacaciones.jpg']; } }),
      T('Pulsa el atajo de teclado <b>Ctrl + X</b> para Cortar.', 'Pulsa Ctrl y la tecla X a la vez en tu teclado real.', 'keyboard_Ctrl+X', ctx => explorerWindow(ctx),
        { do:'keyboard', inputKey:'Ctrl + X', after: ctx => { ctx.clipboard = { type:'cut', items:['foto_vacaciones.jpg'] }; ctx.selected = []; }, done:'¡Archivo cortado!' }),
      T('Entra en la carpeta <b>Fotos</b> haciendo doble clic.', 'Busca "Fotos" y haz doble clic.', 'Fotos', ctx => explorerWindow(ctx), { do:'dclick', after: ctx => { ctx.path = 'Este equipo/Documentos/Fotos'; }, done:'¡Carpeta Fotos abierta!' }),
      T('Pulsa el atajo de teclado <b>Ctrl + V</b> para Pegar.', 'Pulsa Ctrl y la tecla V a la vez en tu teclado real.', 'keyboard_Ctrl+V', ctx => explorerWindow(ctx),
        { do:'keyboard', inputKey:'Ctrl + V', after: ctx => {
            ctx.folders[ctx.path].push({ name:'foto_vacaciones.jpg', type:'file' });
            ctx.folders['Este equipo/Documentos'] = ctx.folders['Este equipo/Documentos'].filter(f => f.name !== 'foto_vacaciones.jpg');
            ctx.clipboard = { type:null, items:[] };
          }, done:'¡Archivo movido! Ya no está en la carpeta original.' })
    ] },

  { icon:'➡️', accent:'var(--c1)', title:'Arrastrar y soltar', objective:'Mover y copiar elementos arrastrándolos con el ratón.',
    note: () => 'Arrastrar es un método rápido, pero ten cuidado de no confundir copiar y mover.',
    steps: () => [
      T('Abre la carpeta <b>Documentos</b> (clic en el lateral).', 'Haz clic en "Documentos" en el panel izquierdo.', 'Este equipo/Documentos', ctx => explorerWindow(ctx),
        { ctx: { explorer: true, path: 'Este equipo/Documentos/Fotos', itemAction: 'click', selected: [] }, after: ctx => { ctx.path = 'Este equipo/Documentos'; } }),
      T('Arrastra el archivo <b>cancion_favorita.mp3</b> a la carpeta <b>Música</b>.', 'Haz clic en "cancion_favorita.mp3", mantén pulsado y arrástralo sobre "Música".', 'Música', ctx => explorerWindow(ctx),
        { do:'drag', from:'cancion_favorita.mp3', to:'Música', after: ctx => {
            ctx.folders['Este equipo/Documentos/Música'].push({ name:'cancion_favorita.mp3', type:'file' });
            ctx.folders['Este equipo/Documentos'] = ctx.folders['Este equipo/Documentos'].filter(f => f.name !== 'cancion_favorita.mp3');
          }, done:'¡Archivo movido! Se ha ido de la carpeta original.' }),
      T('Ahora, arrastra el archivo <b>presentacion.pptx</b> a la carpeta <b>Clase</b>, pero mantén pulsada la tecla <b>Ctrl</b> mientras arrastras para <b>Copiar</b>.', 'Haz clic en "presentacion.pptx", mantén pulsado Ctrl, arrastra sobre "Clase" y suelta el ratón (luego suelta Ctrl).', 'Clase', ctx => explorerWindow(ctx),
        { do:'ctrl_drag', from:'presentacion.pptx', to:'Clase', after: ctx => {
            ctx.folders['Este equipo/Documentos/Clase'].push({ name:'presentacion.pptx', type:'file' });
          }, done:'¡Archivo copiado! Ahora tienes dos copias.' })
    ] },

  { icon:'↩️', accent:'var(--c5)', title:'Deshacer un error', objective:'Deshacer la última acción y gestionar archivos duplicados.',
    note: () => 'Si te equivocas, ¡no pasa nada! Casi siempre puedes deshacerlo. Y si copias un archivo con el mismo nombre, Windows te avisará.',
    steps: () => [
      T('Abre la carpeta <b>Documentos</b> (clic en el lateral).', 'Haz clic en "Documentos" en el panel izquierdo.', 'Este equipo/Documentos', ctx => explorerWindow(ctx),
        { ctx: { explorer: true, path: 'Este equipo/Documentos/Música', itemAction: 'click', selected: [] }, after: ctx => { ctx.path = 'Este equipo/Documentos'; } }),
      T('Copia el archivo <b>video_gatos.mp4</b> (botón Copiar).', 'Selecciona "video_gatos.mp4" y luego el botón 📄 Copiar.', ['video_gatos.mp4', 'copy-btn'], ctx => explorerWindow(ctx),
        { sequence: [{ok:'video_gatos.mp4', after: ctx => { ctx.selected = ['video_gatos.mp4']; run.sub_s = 0; }}, {ok:'copy-btn', after: ctx => { ctx.clipboard = { type:'copy', items:['video_gatos.mp4'] }; ctx.selected = []; }}], done:'¡Archivo copiado!' }),
      T('Pega el archivo en la misma carpeta <b>Documentos</b> (botón Pegar).', 'Pulsa el botón 📋 Pegar. Verás que Windows te avisa de un problema.', 'paste-btn', ctx => explorerWindow(ctx),
        { after: ctx => { ctx.dialog = { type:'replace', file:'video_gatos.mp4' }; }, done:'¡Windows te ha avisado!' }),
      T('Elige la opción <b>Reemplazar</b>.', 'Pulsa el botón azul "Reemplazar".', 'replace-dialog', ctx => fileReplaceDialog(ctx),
        { do:'dialog', after: ctx => { ctx.dialog = null; ctx.folders['Este equipo/Documentos'].push({ name:'video_gatos (copia).mp4', type:'file' }); }, done:'¡Archivo reemplazado con una copia! Fíjate que ha puesto "copia" en el nombre.' }),
      T('Ahora, vamos a deshacer la última acción. Pulsa el atajo de teclado <b>Ctrl + Z</b>.', 'Pulsa Ctrl y la tecla Z a la vez en tu teclado real.', 'keyboard_Ctrl+Z', ctx => explorerWindow(ctx),
        { do:'keyboard', inputKey:'Ctrl + Z', after: ctx => {
            // Restore previous state from history
            if (ctx.history.length > 1) {
              ctx.history.pop(); // Remove current (error) state
              Object.assign(ctx, ctx.history.pop()); // Restore previous good state
              ctx.history.push(JSON.parse(JSON.stringify(ctx))); // Re-add it
            } else { // Fallback if history is empty or too short
              ctx.folders['Este equipo/Documentos'] = ctx.folders['Este equipo/Documentos'].filter(f => f.name !== 'video_gatos (copia).mp4');
            }
          }, done:'¡Acción deshecha! La copia ha desaparecido.' })
    ] }
];

/* =========================================================
   Estado y guardado
   ========================================================= */
const SL = EX.length + 2;                 // portada + ejercicios + final
const KEY = 'practica-ordenador-acciones-v1';
let S = { slide: 0, stars: {} }; // No 'brand' for PC
try {
  const p = JSON.parse(localStorage.getItem(KEY));
  if (p) {
    S.stars = p.stars || {};
    if (Number.isInteger(p.slide) && p.slide >= 0 && p.slide < SL) S.slide = p.slide;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const starsHTML = n => `<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(3 - n)}</i></span>`;

/* =========================================================
   Motor del ejercicio
   ========================================================= */
let run = null;

// Initial state for the monitor simulation
const initialMonitorState = () => ({
  desktop: true,
  explorer: false,
  path: 'Este equipo/Documentos',
  selected: [],
  clipboard: { type: null, items: [] },
  contextMenu: { visible: false, x: 0, y: 0, options: [] },
  dialog: null,
  inputActive: false,
  inputKey: '',
  pendriveConnected: false,
  folders: {
    'Este equipo/Documentos': [
      { name: 'Clase', type: 'folder' },
      { name: 'Fotos', type: 'folder' },
      { name: 'Música', type: 'folder' },
      { name: 'Personal', type: 'folder' },
      { name: 'Vacaciones', type: 'folder' },
      { name: 'documento_clase.docx', type: 'file' },
      { name: 'informe_anual.pdf', type: 'file' },
      { name: 'cancion_favorita.mp3', type: 'file' },
      { name: 'presentacion.pptx', type: 'file' },
      { name: 'foto_vacaciones.jpg', type: 'file' },
      { name: 'video_gatos.mp4', type: 'file' }
    ],
    'Este equipo/Documentos/Clase': [{ name: 'ejercicio_1.xlsx', type: 'file' }],
    'Este equipo/Documentos/Fotos': [{ name: 'mi_dibujo.png', type: 'file' }],
    'Este equipo/Documentos/Música': [{ name: 'cancion_favorita_2.mp3', type: 'file' }],
    'Este equipo/Documentos/Personal': [{ name: 'carta_amiga.odt', type: 'file' }],
    'Este equipo/Descargas': [{ name: 'programa_nuevo.exe', type: 'file' }],
    'Este equipo/Imágenes': [{ name: 'paisaje.jpg', type: 'file' }],
    'Este equipo/Pendrive': []
  },
  history: [] // For Ctrl+Z
});

function startRun(i) {
  run = { i, s: 0, ctx: initialMonitorState(), err: 0, hints: 0, busy: false, done: false, hint: false, steps: EX[i].steps(), sub_s: 0 };
  enterStep();
}
function enterStep() {
  const s = run.steps[run.s];
  if (s && s.enter) s.enter(run.ctx);
  // If the step has its own ctx, merge it
  if (s && s.ctx) Object.assign(run.ctx, s.ctx);
  
  if (s && s.do !== 'keyboard') { // Avoid saving every small UI change or keyboard prompt state
    if (!s.sequence || run.sub_s === 0) { // Only save at the start of a sequence
      run.ctx.history.push(JSON.parse(JSON.stringify(run.ctx)));
      if (run.ctx.history.length > 10) run.ctx.history.shift(); // Keep history manageable
    }
  }
}
const curStep = () => (run && !run.done) ? run.steps[run.s] : null;

function fb(kind, html) { const e = $('fb'); if (!e) return; e.className = 'fb' + (kind ? ' ' + kind : ''); e.innerHTML = html || ''; }

function renderMonitor() {
  const monin = $('monin'); if (!monin) return;
  const ex = EX[run.i], cur = curStep();
  const src = run.done ? (ex.end || run.steps[run.steps.length - 1]) : cur;
  monin.className = 'mon-in'; 

  let html = '';
  if (run.ctx.explorer) {
    html += explorerWindow(run.ctx);
    html += contextMenu(run.ctx);
    html += fileReplaceDialog(run.ctx);
  } else {
    html += desktop();
  }
  html += keyboardInput(run.ctx);

  monin.innerHTML = html + (run.done ? '<div class="bigcheck"><span>✔</span></div>' : '');

  if (cur && run.hint && !run.ctx.inputActive) {
    if (cur.do === 'keyboard') { // Hint for keyboard action is on the keyboard overlay itself
      qsa('.keyboard-overlay').forEach(el => el.classList.add('hint'));
    } else if (cur.do === 'drag' || cur.do === 'ctrl_drag') {
      const targetEl = monin.querySelector(`[data-id="${cur.from}"]`);
      if (targetEl) targetEl.classList.add('hint');
    } else if (cur.sequence) { // For sequence steps, hint current sub-step
      const currentOk = oks(cur.sequence[run.sub_s]);
      currentOk.forEach(id => monin.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.add('hint')));
    } else {
      oks(cur).forEach(id => monin.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.add('hint')));
    }
  }
}

function renderPanel() {
  const ex = EX[run.i];
  $('note').innerHTML = '📋 <b>En tu ordenador:</b> ' + ex.note();
  if (run.done) {
    const n = starsOf(run);
    $('now').innerHTML = `<div class="now-n">¡Ejercicio terminado!</div><div class="now-t">🎉 ${starsHTML(n)}<br>Ahora <b>hazlo en tu ordenador de verdad</b>.</div>`;
  } else {
    $('now').innerHTML = `<div class="now-n">Paso ${run.s + 1} de ${run.steps.length}</div><div class="now-t">${run.steps[run.s].text}</div>`;
  }
  $('pips').innerHTML = run.steps.map((_, j) => `<span class="pip ${run.done || j < run.s ? 'past' : j === run.s ? 'cur' : ''}"></span>`).join('');
  $('b-hint').hidden = run.done || run.ctx.inputActive;
  $('b-next').hidden = !run.done;
  $('b-next').textContent = run.i === EX.length - 1 ? 'Ver resultado ▶' : 'Siguiente ejercicio ▶';
}
function paint() { renderMonitor(); renderPanel(); }

const starsOf = r => { const e = r.err + r.hints; return e <= 2 ? 3 : e <= 6 ? 2 : 1; };

function success(step, id) {
  const r = run; r.busy = true;
  if (step.after) step.after(r.ctx, id);
  fb('ok', '✅ ' + (step.done || '¡Muy bien!'));
  const monin = $('monin');
  if (monin) {
    monin.classList.add('okp');
    if (step.fx === 'flash') monin.insertAdjacentHTML('beforeend', '<div class="flash"></div>');
  }
  setTimeout(() => {
    if (run !== r) return;
    r.busy = false; r.hint = false; r.s++; run.sub_s = 0; // Reset sub_s for next step
    if (r.s >= r.steps.length) finish();
    else { enterStep(); paint(); }
  }, 1000);
}

function wrong(step, id, el, msg) {
  run.err++;
  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  fb('bad', '🙂 ' + (msg || (step.wrong && step.wrong[id]) || ('Ese no es. ' + step.hint)));
}

/* ---- Interacciones sobre el monitor ---- */
const stage = $('stage');
const targetOf = e => { const t = e.target.closest('[data-id]'); return (t && t.closest('.mon-in')) ? t : null; };

stage.addEventListener('contextmenu', e => {
  const monin = e.target.closest('.mon-in');
  if (monin && run && curStep() && !run.busy) {
    e.preventDefault();
    const step = curStep();
    const t = targetOf(e);
    const id = t ? t.dataset.id : 'empty-space';

    // Close context menu if open
    if (run.ctx.contextMenu.visible) {
      run.ctx.contextMenu.visible = false;
      paint();
      // If the right-click was on the context menu itself, don't process as a step interaction
      if (e.target.closest('.context-menu')) return;
    }

    if (step.do === 'rclick_item' && oks(step).includes(id)) {
      run.ctx.contextMenu = { visible: true, x: e.clientX - monin.getBoundingClientRect().left, y: e.clientY - monin.getBoundingClientRect().top, options: [{id:'copy', label:'Copiar'}, {id:'cut', label:'Cortar'}, 'sep', {id:'delete', label:'Eliminar'}] };
      success(step, id);
    } else if (step.do === 'rclick_empty' && oks(step).includes(id)) {
      run.ctx.contextMenu = { visible: true, x: e.clientX - monin.getBoundingClientRect().left, y: e.clientY - monin.getBoundingClientRect().top, options: [{id:'paste', label:'Pegar'}, 'sep', {id:'new', label:'Nuevo'}] };
      success(step, id);
    } else if (step.do === 'rclick_any') { // General right-click (not used in this practice, but good for completeness)
      run.ctx.contextMenu = { visible: true, x: e.clientX - monin.getBoundingClientRect().left, y: e.clientY - monin.getBoundingClientRect().top, options: [{id:'copy', label:'Copiar'}, {id:'cut', label:'Cortar'}, 'sep', {id:'delete', label:'Eliminar'}] };
      success(step, id);
    } else {
      wrong(step, id, t, 'Has hecho clic derecho. Prueba a hacer un clic normal o a pulsar las teclas.');
    }
    paint();
  }
});

stage.addEventListener('click', e => {
  /* botones del panel */
  const b = e.target.closest('button');
  if (b && run) {
    if (b.id === 'b-hint' && !run.done) {
      run.hints++; run.hint = true; renderMonitor();
      fb('soft', '💡 ' + curStep().hint); return;
    }
    if (b.id === 'b-redo') { startRun(run.i); paint(); fb('', ''); return; }
    if (b.id === 'b-next') { next(); return; }
    if (b.id === 'keyboard-continue' && run.ctx.inputActive) {
      const step = curStep();
      if (step.do === 'keyboard') {
        run.ctx.inputActive = false;
        success(step, step.ok);
      }
      return;
    }
  }
  const card = e.target.closest('.card');
  if (card) { goSlide(+card.dataset.s); return; }
  if (e.target.closest('#b-reset')) { S.stars = {}; save(); goSlide(0); return; }

  /* clics sobre el monitor */
  const step = curStep();
  if (!step || run.busy || run.ctx.inputActive) {
    if (run.ctx.contextMenu.visible && !e.target.closest('.context-menu')) {
      run.ctx.contextMenu.visible = false; paint(); // Close context menu if clicked outside
    }
    return;
  }

  const t = targetOf(e);
  const id = t ? t.dataset.id : null;

  // Handle dialog interactions first
  if (run.ctx.dialog) {
    if (id === 'replace-dialog' && run.ctx.dialog.type === 'replace') {
      success({ do:'dialog', ok:'replace-dialog', after: step.after, done:step.done }, id);
    } else if (id === 'skip-dialog' && run.ctx.dialog.type === 'replace') {
      wrong(step, id, t, 'No has reemplazado el archivo. Necesitas reemplazarlo para continuar.');
    } else if (id === 'cancel-dialog') {
      run.ctx.dialog = null; paint(); // Just close dialog for now
      wrong(step, id, t, 'Has cancelado el diálogo. Prueba a reemplazar el archivo.');
    }
    return;
  }
  
  // Close context menu if open
  if (run.ctx.contextMenu.visible && !e.target.closest('.context-menu')) {
    run.ctx.contextMenu.visible = false; paint();
    return;
  }

  if (step.sequence) { // Handle sequences
    const currentSubStep = step.sequence[run.sub_s];
    if (oks(currentSubStep).includes(id)) {
      if (currentSubStep.after) currentSubStep.after(run.ctx, id);
      run.sub_s++;
      if (run.sub_s >= step.sequence.length) {
        success(step, id);
      } else {
        fb('ok', '✅ ¡Muy bien! Siguiente parte del paso...');
        paint();
      }
    } else {
      wrong(currentSubStep, id, t);
    }
    return;
  }

  if (step.do === 'click') {
    oks(step).includes(id) ? success(step, id) : wrong(step, id, t);
    return;
  }
  if (step.do === 'dclick') {
    wrong(step, id, t, oks(step).includes(id) ? 'Eso ha sido un solo clic. Haz <b>doble clic</b> rápido.' : null);
    return;
  }
  if (step.do === 'ctrl_click') {
    wrong(step, id, t, oks(step).includes(id) ? 'Has hecho clic pero sin Ctrl. <b>Mantén Ctrl pulsado</b> y luego haz clic.' : null);
    return;
  }
  if (step.do === 'keyboard') {
    wrong(step, id, t, 'Para esta acción, debes pulsar las teclas en tu teclado real, y luego hacer clic en Continuar.');
    return;
  }
});

stage.addEventListener('dblclick', e => {
  const step = curStep();
  if (!step || run.busy || run.ctx.inputActive || run.ctx.contextMenu.visible || run.ctx.dialog) return;
  const t = targetOf(e); if (!t) return;
  const id = t.dataset.id;
  if (step.do === 'dclick' && oks(step).includes(id)) {
    success(step, id);
  } else {
    wrong(step, id, t, 'Has hecho doble clic. Prueba a hacer un solo clic.');
  }
});

let dragData = null;
stage.addEventListener('pointerdown', e => {
  const step = curStep();
  if (!step || run.busy || run.ctx.inputActive || run.ctx.contextMenu.visible || run.ctx.dialog) return;

  const t = targetOf(e);
  if (!t) return;
  const id = t.dataset.id;

  const isDragAction = step.do === 'drag' || step.do === 'ctrl_drag';
  const isCorrectDragSource = (isDragAction && oks([step.from]).includes(id));
  // const isSelectionDrag = (step.do === 'drag_select' && oks(step).includes('empty-space')); // Not used

  if (isCorrectDragSource) {
    dragData = { startX: e.clientX, startY: e.clientY, target: t, id: id, moved: false, ctrlKey: e.ctrlKey };
    t.classList.add('dragging');
    e.preventDefault(); // Prevent default browser drag behavior
  } else if (isDragAction) {
    wrong(step, id, t, 'Ese no es el elemento que debes arrastrar.');
  }
});

stage.addEventListener('pointermove', e => {
  if (!dragData) return;
  const dx = e.clientX - dragData.startX;
  const dy = e.clientY - dragData.startY;
  if (Math.hypot(dx, dy) > 10) { // Threshold for actual drag
    dragData.moved = true;
  }
});

stage.addEventListener('pointerup', e => {
  if (!dragData) return;
  const step = curStep();
  const { target, id, moved, ctrlKey } = dragData;
  target.classList.remove('dragging');
  dragData = null;

  if (moved) {
    const dropTarget = e.target.closest('[data-id]');
    const dropId = dropTarget ? dropTarget.dataset.id : null;

    if (step.do === 'drag' && oks([step.to]).includes(dropId) && oks([id]).includes(step.from)) {
      if (!ctrlKey) { // Drag without Ctrl key is a move by default
        success(step, dropId);
      } else {
        wrong(step, id, target, 'Has arrastrado con Ctrl. Para esta acción, suelta Ctrl para mover.');
      }
    } else if (step.do === 'ctrl_drag' && oks([step.to]).includes(dropId) && oks([id]).includes(step.from)) {
      if (ctrlKey) { // Drag with Ctrl key is a copy
        success(step, dropId);
      } else {
        wrong(step, id, target, 'Has arrastrado sin Ctrl. Para esta acción, mantén pulsado Ctrl para copiar.');
      }
    } else {
      wrong(step, id, target, 'Has arrastrado, pero no al sitio correcto o no como se pedía.');
    }
  } else { // Was a click, not a drag
    if (step.do === 'drag' || step.do === 'ctrl_drag') {
      wrong(step, id, target, 'No basta con hacer clic. Mantén pulsado y arrastra el elemento al destino.');
    }
  }
});


document.addEventListener('keydown', e => {
  if (!run || run.busy || run.ctx.contextMenu.visible || run.ctx.dialog) return;

  const step = curStep();
  if (!step) return;

  if (step.do === 'keyboard' && !run.ctx.inputActive) {
    if (e.key === 'Control' || e.key === 'Meta') { // Allow Ctrl/Win key to be pressed
      // Do nothing, just wait for the combination
    } else if (e.key.toLowerCase() === step.inputKey.toLowerCase().replace(/ctrl \+ |win \+ /g, '')) {
      if ((step.inputKey.includes('Ctrl') && e.ctrlKey) || (step.inputKey.includes('Win') && e.metaKey) || (!step.inputKey.includes('Ctrl') && !step.inputKey.includes('Win'))) {
        e.preventDefault(); // Prevent default browser action for shortcuts
        run.ctx.inputActive = true;
        run.ctx.inputKey = step.inputKey;
        paint();
      }
    }
  } else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); goSlide(0); }
  else if (e.key === 'End') { e.preventDefault(); goSlide(SL - 1); }
  else if (e.key.toLowerCase() === 'f') toggleFull();
});


/* =========================================================
   Diapositivas
   ========================================================= */
function renderSlide() {
  const s = S.slide, st = $('stage');
  let h = '';
  if (s === 0) {
    run = null;
    document.documentElement.style.setProperty('--accent', 'var(--c6)');
    $('top-title').textContent = 'Acciones en el ordenador';
    h = `<div class="slide menu">
      <div class="big-emoji">💻</div>
      <h1>Acciones en el ordenador</h1>
      <p>Aprende a <b>copiar, cortar y pegar archivos y carpetas</b> en Windows 11. Elige un ejercicio:</p>
      <div class="cards">${EX.map((e, i) => `<button class="card${S.stars[i] ? ' done' : ''}" type="button" data-s="${i + 1}" style="--ac:${e.accent}">
        <span class="ce">${e.icon}</span><span>${i + 1}. ${e.title}</span>${starsHTML(S.stars[i] || 0)}</button>`).join('')}</div>
    </div>`;
  } else if (s === SL - 1) {
    run = null;
    document.documentElement.style.setProperty('--accent', 'var(--c3)');
    $('top-title').textContent = '¡Terminado!';
    const done = EX.filter((_, i) => S.stars[i]).length;
    h = `<div class="slide finish">
      <div class="trophy">🏆</div>
      <h2>${done === EX.length ? '¡Enhorabuena!' : 'Casi lo tienes'}</h2>
      <p>${done === EX.length ? 'Has practicado <b>todas las acciones básicas</b> en el ordenador. Ahora toca hacerlas en tu ordenador de verdad.' : `Has completado <b>${done} de ${EX.length}</b> ejercicios. Puedes volver a cualquiera con los números de abajo.`}</p>
      <div class="sumlist">${EX.map((e, i) => `<span>${e.icon} ${starsHTML(S.stars[i] || 0)}</span>`).join('')}</div>
      <button class="abtn" id="b-reset" type="button">↺ Borrar estrellas y empezar de nuevo</button>
    </div>`;
  } else {
    const i = s - 1, ex = EX[i];
    startRun(i);
    document.documentElement.style.setProperty('--accent', ex.accent);
    $('top-title').textContent = `Ejercicio ${i + 1} de ${EX.length}`;
    h = `<div class="slide ex">
      <div class="ex-main">
        <div class="ex-head">
          <div class="ex-icon">${ex.icon}</div>
          <div><div class="ex-num">Ejercicio ${i + 1}</div><div class="ex-title">${ex.title}</div></div>
        </div>
        <div class="ex-obj">🎯 ${ex.objective}</div>
        <div class="brands"></div> <!-- No brands for PC -->
        <div class="ex-note" id="note"></div>
        <div class="now" id="now"></div>
        <div class="fb" id="fb"></div>
        <div class="acts">
          <button class="abtn" id="b-hint" type="button">💡 Pista</button>
          <button class="abtn" id="b-redo" type="button">↺ Repetir</button>
          <button class="abtn go" id="b-next" type="button" hidden>Siguiente ejercicio ▶</button>
        </div>
        <div class="pips" id="pips"></div>
      </div>
      <div class="ex-side"><div class="monitor"><div class="mon-in" id="monin"></div></div></div>
    </div>`;
  }
  st.innerHTML = h;
  if (run) paint();
  updateChrome();
}

function updateChrome() {
  $('prev').disabled = S.slide === 0;
  $('next').disabled = S.slide === SL - 1;
  $('next').textContent = S.slide === 0 ? 'Empezar ▶' : 'Siguiente ▶';
  document.querySelectorAll('.dot').forEach((d, k) => {
    d.classList.toggle('on', k === S.slide);
    d.classList.toggle('seen', k !== S.slide && k >= 1 && k <= EX.length && !!S.stars[k - 1]);
  });
  $('prog-fill').style.width = (S.slide / (SL - 1) * 100) + '%';
  save();
}

function goSlide(s) { S.slide = Math.max(0, Math.min(SL - 1, s)); renderSlide(); }
function next() { if (S.slide < SL - 1) goSlide(S.slide + 1); }
function prev() { if (S.slide > 0) goSlide(S.slide - 1); }

$('dots').innerHTML = Array.from({ length: SL }, (_, k) => {
  const lb = k === 0 ? '🏠' : k === SL - 1 ? '🏆' : k;
  const tt = k === 0 ? 'Menú' : k === SL - 1 ? 'Resultado' : EX[k - 1].title;
  return `<button class="dot" type="button" data-s="${k}" title="${tt}">${lb}</button>`;
}).join('');
$('dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) goSlide(+d.dataset.s); });
$('next').onclick = next;
$('prev').onclick = prev;

document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); goSlide(0); }
  else if (e.key === 'End') { e.preventDefault(); goSlide(SL - 1); }
  else if (e.key.toLowerCase() === 'f') toggleFull();
});

/* Pantalla completa */
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
if (!document.fullscreenEnabled) $('btn-full').style.display = 'none';
$('btn-full').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => {
  $('btn-full').textContent = document.fullscreenElement ? '✕ Salir de pantalla completa' : '⛶ Pantalla completa';
});

renderSlide();
</script>
</body>

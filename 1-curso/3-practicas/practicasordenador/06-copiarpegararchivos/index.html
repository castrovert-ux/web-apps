<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qué significa cada acción · Práctica</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #25D366; --c3: #FFD93D; --c4: #FF6B6B; --c5: #6BCB77; --c6: #4DA3FF; --c7: #C77DFF;
    --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
    --win-bg: #f0f0f0; --win-ink: #1e1e1e; --win-border: #e0e0e0;
    --accent: var(--c6);
    color-scheme: dark;
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.14; animation: float 14s ease-in-out infinite alternate; }
  .blob:nth-child(1) { width: 45vw; height: 45vw; background: var(--c7); top: -12vw; left: -10vw; }
  .blob:nth-child(2) { width: 35vw; height: 35vw; background: var(--c4); bottom: -10vw; right: -8vw; animation-delay: -5s; }
  .blob:nth-child(3) { width: 28vw; height: 28vw; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0) scale(1); } to { transform: translate(25px,18px) scale(1.07); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Estructura ---------- */
  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 2.2vh 2.6vw 1.6vh; gap: 1.6vh; }
  .top { display: flex; align-items: center; gap: 1.4vw; flex-shrink: 0; }
  .badge {
    background: linear-gradient(135deg, var(--c7), #8a3fd6); color: #fff; font-weight: 800;
    font-size: clamp(0.7rem, 1vw, 1.05rem); letter-spacing: 2px; text-transform: uppercase;
    padding: 0.5em 1.4em; border-radius: 100px; white-space: nowrap;
  }
  .top-title { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1rem, 1.7vw, 1.9rem); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { margin-left: auto; display: flex; gap: 0.6vw; }
  .tbtn {
    border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: var(--sub);
    font-weight: 800; font-size: clamp(0.8rem, 1vw, 1.1rem); padding: 0.45em 0.9em; border-radius: 12px; cursor: pointer;
  }
  .tbtn:hover { color: var(--text); border-color: var(--c6); }
  .stage { flex: 1; min-height: 0; display: flex; }
  .slide { flex: 1; min-height: 0; display: flex; animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1); }

  /* ---------- Portada / menú ---------- */
  .menu { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.6vh; }
  .menu .big-emoji { font-size: clamp(3rem, 7vw, 7rem); line-height: 1; }
  .menu h1 {
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.2rem, 5.6vw, 6.4rem); line-height: 1.05;
    background: linear-gradient(135deg, var(--c7), var(--c4), var(--c3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .menu p { color: var(--sub); font-weight: 700; font-size: clamp(1rem, 1.9vw, 2.2rem); max-width: 32em; line-height: 1.35; }
  .menu p b { color: var(--text); }
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2vw; width: min(94vw, 1500px); }
  .card {
    flex: 0 0 calc(25% - 1vw); background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-top: 5px solid var(--ac);
    border-radius: 22px; padding: 1.8vh 0.8vw; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.6vh;
    font-weight: 800; font-size: clamp(0.9rem, 1.35vw, 1.55rem); line-height: 1.15; transition: transform 0.15s;
  }
  .card:hover { transform: translateY(-4px); }
  .card .ce { font-size: clamp(1.8rem, 3.2vw, 3.6rem); }
  .card.done { border-color: rgba(37,211,102,0.45); border-top-color: var(--ac); }
  .stars { color: var(--c3); letter-spacing: 2px; font-size: 0.95em; }
  .stars i { color: rgba(255,255,255,0.22); font-style: normal; }

  /* ---------- Ejercicio ---------- */
  .ex { gap: 2vw; }
  .ex-main {
    flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none;
    background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-left: 0.6vw solid var(--accent);
    border-radius: 28px; padding: 2.6vh 2.2vw;
  }
  .ex-main::-webkit-scrollbar { display: none; }
  .ex-head { display: flex; align-items: center; gap: 1.4vw; margin-bottom: 1vh; }
  .ex-icon {
    width: clamp(48px, 5vw, 100px); aspect-ratio: 1; border-radius: 22%; flex-shrink: 0; display: grid; place-items: center;
    font-size: clamp(1.5rem, 2.8vw, 3.4rem); background: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .ex-num { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-size: clamp(0.75rem, 1vw, 1.2rem); }
  .ex-title { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(1.5rem, 2.8vw, 3.3rem); line-height: 1.1; }
  .ex-obj { color: var(--sub); font-weight: 700; font-size: clamp(0.95rem, 1.45vw, 1.7rem); margin-bottom: 1.2vh; }
  .ex-note {
    font-weight: 700; color: var(--sub); line-height: 1.4; font-size: clamp(0.88rem, 1.3vw, 1.5rem);
    background: rgba(77,163,255,0.1); border-radius: 14px; padding: 0.55em 1em; margin-bottom: 1.4vh;
  }
  .ex-note b { color: var(--text); }
  .now {
    background: rgba(255,217,61,0.09); border: 3px solid var(--c3); border-radius: 18px; padding: 1.3vh 1.2vw;
    box-shadow: 0 0 0 6px rgba(255,217,61,0.08);
  }
  .now-n { color: var(--c3); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: clamp(0.72rem, 0.95vw, 1.15rem); }
  .now-t { font-weight: 700; line-height: 1.3; font-size: clamp(1.1rem, 1.95vw, 2.4rem); margin-top: 0.5vh; }
  .now-t b { color: var(--c3); font-weight: 800; }
  .fb { display: none; margin-top: 1.4vh; font-weight: 800; line-height: 1.3; border-radius: 14px; padding: 0.6em 1em; font-size: clamp(0.92rem, 1.4vw, 1.7rem); }
  .fb.ok { display: block; background: rgba(37,211,102,0.15); color: #86ffb0; }
  .fb.bad { display: block; background: rgba(255,107,107,0.15); color: #ffa3a3; }
  .fb.soft { display: block; background: rgba(77,163,255,0.15); color: #b0d6ff; }
  .acts { display: flex; flex-wrap: wrap; gap: 1vw; margin-top: auto; padding-top: 1.6vh; }
  .abtn {
    border: 2px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 800;
    border-radius: 14px; padding: 0.5em 1.1em; cursor: pointer; font-size: clamp(0.92rem, 1.35vw, 1.6rem);
  }
  .abtn:hover { border-color: var(--c3); }
  .abtn.go { border: 0; background: linear-gradient(135deg, var(--c1), #1aa851); color: #0a1628; }
  .abtn[hidden] { display: none; }
  .pips { display: flex; gap: 0.5vw; margin-top: 1.4vh; }
  .pip { flex: 1; height: 7px; border-radius: 6px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
  .pip.past { background: var(--c1); }
  .pip.cur { background: var(--c3); }
  .ex-side { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 1vw; }

  /* ---------- Monitor de mentira ---------- */
  .monitor {
    --mon-h: clamp(300px, 55vh, 600px);
    width: calc(var(--mon-h) * 1.618); /* Golden ratio for width */
    height: var(--mon-h);
    font-size: calc(var(--mon-h) / 36); /* Base font size relative to height */
    flex-shrink: 0;
    background: #05070d;
    border-radius: 1.2em;
    padding: 0.5em;
    position: relative;
    box-shadow: 0 0 0 0.14em #2a3550, 0 1.6em 3.5em rgba(0,0,0,0.55);
  }
  .win-in {
    position: relative; width: 100%; height: 100%;
    background: #202020; /* Windows 11 dark desktop */
    border-radius: 0.8em;
    overflow: hidden;
    display: flex; flex-direction: column;
    line-height: 1.25;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    color: var(--text); /* For desktop icons */
  }
  .win-in.okp { animation: okp 0.5s; }
  @keyframes okp { 0% { box-shadow: inset 0 0 0 0 rgba(37,211,102,0); } 40% { box-shadow: inset 0 0 0 0.45em rgba(37,211,102,0.75); } 100% { box-shadow: inset 0 0 0 0 rgba(37,211,102,0); } }

  .t { cursor: pointer; }
  .hint { outline: 0.15em solid var(--c3); outline-offset: 0.1em; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { outline-color: rgba(255,217,61,0.25); } }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-0.3em); } 75% { transform: translateX(0.3em); } }
  .holding { position: relative; }
  .holding::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(255,217,61,0.45); transform-origin: left; animation: fill 0.7s linear forwards; pointer-events: none; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dragging { opacity: 0.6; }
  .drag-target { outline: 0.15em dashed var(--c3); }
  .drag-ghost {
    position: absolute; pointer-events: none; z-index: 1000;
    background: rgba(255,255,255,0.8); border: 1px solid #ccc; border-radius: 0.3em;
    padding: 0.3em 0.5em; font-size: 0.8em; white-space: nowrap;
    box-shadow: 0 0.2em 0.5em rgba(0,0,0,0.3);
  }

  /* Windows 11 UI components */
  .desktop { flex: 1; display: flex; flex-direction: column; padding: 0.5em; }
  .taskbar {
    height: 2.2em; background: #2f2f2f; border-top: 1px solid #444;
    display: flex; align-items: center; justify-content: center;
    padding: 0 0.5em; flex-shrink: 0;
  }
  .taskbar-center { display: flex; gap: 0.4em; }
  .taskbar-icon {
    width: 1.8em; height: 1.8em; border-radius: 0.3em;
    display: grid; place-items: center; font-size: 1.1em;
    color: #fff; cursor: pointer;
  }
  .taskbar-icon:hover { background: rgba(255,255,255,0.1); }
  .taskbar-icon.active { background: #0078d4; } /* Blue for active */
  .taskbar-left, .taskbar-right {
    position: absolute; top: 0; bottom: 0;
    display: flex; align-items: center;
    padding: 0 0.5em; font-size: 0.8em; color: #fff;
  }
  .taskbar-left { left: 0; }
  .taskbar-right { right: 0; gap: 0.5em; }
  .taskbar-right span { cursor: pointer; padding: 0.2em; border-radius: 0.3em; }
  .taskbar-right span:hover { background: rgba(255,255,255,0.1); }

  .desktop-icon {
    display: flex; flex-direction: column; align-items: center; gap: 0.2em;
    width: 4.5em; margin: 0.5em; text-align: center;
    font-size: 0.7em; color: #fff;
    cursor: pointer;
  }
  .desktop-icon:hover { background: rgba(255,255,255,0.1); border-radius: 0.3em; }
  .desktop-icon.selected { background: rgba(0,120,212,0.5); border-radius: 0.3em; }

  .fe-window {
    position: absolute; inset: 0.8em;
    background: var(--win-bg); color: var(--win-ink);
    border: 1px solid var(--win-border); border-radius: 0.5em;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 0.5em 1.5em rgba(0,0,0,0.3);
  }
  .fe-window.hidden { display: none; }
  .fe-titlebar {
    display: flex; justify-content: space-between; align-items: center;
    height: 1.8em; background: #e0e0e0;
    padding: 0 0.5em; font-size: 0.7em; font-weight: 600;
  }
  .fe-titlebar-btns { display: flex; gap: 0.1em; }
  .fe-titlebar-btn {
    width: 1.8em; height: 1.8em; display: grid; place-items: center;
    font-size: 0.9em; cursor: pointer;
  }
  .fe-titlebar-btn:hover { background: #d0d0d0; }
  .fe-titlebar-btn.close:hover { background: #e81123; color: #fff; }

  .fe-ribbon {
    display: flex; align-items: center; gap: 0.5em;
    padding: 0.4em 0.8em; background: #f7f7f7; border-bottom: 1px solid var(--win-border);
    flex-shrink: 0;
  }
  .fe-ribbon-btn {
    display: flex; align-items: center; gap: 0.3em;
    padding: 0.3em 0.6em; border-radius: 0.3em;
    font-size: 0.7em; font-weight: 600; cursor: pointer;
    border: 1px solid transparent;
  }
  .fe-ribbon-btn:hover { background: #e0e0e0; border-color: #d0d0d0; }
  .fe-ribbon-btn.disabled { opacity: 0.5; cursor: default; }

  .fe-pathbar {
    display: flex; align-items: center; gap: 0.3em;
    padding: 0.3em 0.8em; background: #f7f7f7; border-bottom: 1px solid var(--win-border);
    font-size: 0.7em; flex-shrink: 0;
  }
  .fe-path-segment { padding: 0.2em 0.4em; border-radius: 0.3em; cursor: pointer; }
  .fe-path-segment:hover { background: #e0e0e0; }

  .fe-body { flex: 1; display: flex; overflow: hidden; }
  .fe-nav-pane {
    width: 8em; flex-shrink: 0;
    background: #fdfdfd; border-right: 1px solid var(--win-border);
    padding: 0.5em 0; overflow-y: auto;
    font-size: 0.7em;
  }
  .fe-nav-item {
    display: flex; align-items: center; gap: 0.4em;
    padding: 0.3em 0.8em; cursor: pointer;
  }
  .fe-nav-item:hover { background: #e0e0e0; }
  .fe-nav-item.selected { background: #cce8ff; color: #000; }
  .fe-nav-label { flex: 1; }

  .fe-content-pane {
    flex: 1;
    padding: 0.5em;
    display: flex; flex-wrap: wrap; align-content: flex-start;
    overflow-y: auto;
    background: #fff;
  }
  .fe-item {
    display: flex; flex-direction: column; align-items: center; gap: 0.2em;
    width: 5em; height: 5.5em; margin: 0.3em; text-align: center;
    font-size: 0.7em; color: var(--win-ink);
    border: 1px solid transparent; border-radius: 0.3em;
    cursor: pointer;
    position: relative; /* For selection box */
  }
  .fe-item:hover { background: #e0e0e0; border-color: #d0d0d0; }
  .fe-item.selected { background: #cce8ff; border-color: #99d1ff; }
  .fe-item-icon { font-size: 2.2em; line-height: 1; }
  .fe-item-name {
    width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 0.2em;
  }
  .fe-item.drag-source { opacity: 0.5; }
  .fe-item.drag-target { outline: 2px dashed var(--c3); outline-offset: -2px; }

  .context-menu {
    position: absolute; z-index: 100;
    background: #fff; border: 1px solid #ccc; border-radius: 0.3em;
    box-shadow: 0 0.3em 0.8em rgba(0,0,0,0.2);
    font-size: 0.75em; min-width: 10em;
    padding: 0.3em 0;
  }
  .context-menu-item {
    padding: 0.4em 0.8em; cursor: pointer;
  }
  .context-menu-item:hover { background: #e0e0e0; }
  .context-menu-item.disabled { opacity: 0.5; cursor: default; }

  .replace-dialog {
    position: absolute; inset: 0; background: rgba(0,0,0,0.3);
    display: grid; place-items: center;
  }
  .replace-dialog-box {
    background: #fff; border-radius: 0.5em; padding: 1em;
    width: 25em; box-shadow: 0 0.5em 1.5em rgba(0,0,0,0.4);
    font-size: 0.8em; color: var(--win-ink);
  }
  .replace-dialog-box h3 { font-size: 1.2em; margin-bottom: 0.5em; }
  .replace-dialog-box p { margin-bottom: 1em; }
  .replace-dialog-buttons { display: flex; justify-content: flex-end; gap: 0.5em; }
  .replace-dialog-btn {
    padding: 0.5em 1em; border-radius: 0.3em; cursor: pointer;
    font-weight: 600; background: #e0e0e0; border: 1px solid #ccc;
  }
  .replace-dialog-btn.primary { background: #0078d4; color: #fff; border-color: #005a9e; }
  .replace-dialog-btn:hover { background: #d0d0d0; }
  .replace-dialog-btn.primary:hover { background: #006ac1; }

  .eject-notification {
    position: absolute; bottom: 3em; right: 1em;
    background: #fff; border: 1px solid #ccc; border-radius: 0.3em;
    padding: 0.8em; box-shadow: 0 0.3em 0.8em rgba(0,0,0,0.2);
    font-size: 0.8em; color: var(--win-ink);
    display: flex; gap: 0.6em; align-items: center;
  }
  .eject-notification span { font-size: 1.5em; }

  .drag-selection-rect {
    position: absolute;
    border: 1px dashed rgba(0,120,212,0.8);
    background: rgba(0,120,212,0.2);
    pointer-events: none;
    z-index: 50;
  }

  /* Quiz */
  .quiz-q { font-weight: 700; line-height: 1.3; font-size: 0.9em; margin-bottom: 0.8em; color: var(--win-ink); }
  .quiz-opts { display: flex; flex-direction: column; gap: 0.4em; }
  .quiz-opt {
    background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 0.3em;
    padding: 0.6em 0.8em; cursor: pointer;
    font-size: 0.8em; color: var(--win-ink);
  }
  .quiz-opt:hover { background: #e0e0e0; }
  .quiz-opt.selected { background: #cce8ff; border-color: #99d1ff; }

  /* ---------- Final ---------- */
  .finish { flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2vh; }
  .trophy { font-size: clamp(4rem, 10vw, 11rem); animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-14px) rotate(5deg); } }
  .finish h2 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-size: clamp(2.2rem, 5vw, 5.8rem); color: var(--c3); }
  .finish p { color: var(--sub); font-weight: 700; font-size: clamp(1rem, 1.9vw, 2.3rem); max-width: 32em; line-height: 1.4; }
  .finish p b { color: var(--text); }
  .sumlist { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vw; max-width: 90vw; }
  .sumlist span { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; padding: 0.35em 1em; font-weight: 800; font-size: clamp(0.9rem, 1.4vw, 1.6rem); }

  /* ---------- Barra inferior ---------- */
  .bottom { flex-shrink: 0; display: flex; align-items: center; gap: 1.4vw; }
  .nav { border: 0; border-radius: 16px; cursor: pointer; font-weight: 800; white-space: nowrap; font-size: clamp(1rem, 1.5vw, 1.8rem); padding: 0.6em 1.4em; transition: transform 0.15s; }
  .nav:hover { transform: scale(1.04); }
  .nav:disabled { opacity: 0.3; cursor: default; transform: none; }
  .nav-prev { background: rgba(255,255,255,0.07); color: var(--text); }
  .nav-next { background: linear-gradient(135deg, var(--c1), #1aa851); color: #0a1628; }
  .dots { flex: 1; display: flex; justify-content: center; align-items: center; gap: 0.7vw; flex-wrap: wrap; }
  .dot {
    height: clamp(30px, 3vw, 56px); min-width: clamp(30px, 3vw, 56px); padding: 0 0.6em; border-radius: 100px; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--sub);
    font-weight: 800; font-size: clamp(0.85rem, 1.25vw, 1.5rem); transition: all 0.2s;
  }
  .dot.seen { color: var(--text); border-color: rgba(37,211,102,0.5); background: rgba(37,211,102,0.1); }
  .dot.on { color: #0a1628; background: var(--c3); border-color: var(--c3); transform: scale(1.12); }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.06); z-index: 2; }
  .prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c7), var(--c4), var(--c3)); transition: width 0.4s; }
  .help { color: var(--sub); font-weight: 700; font-size: clamp(0.75rem, 0.95vw, 1.05rem); text-align: center; flex-shrink: 0; opacity: 0.7; }

  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    html, body { height: auto; }
    .app { min-height: 100vh; height: auto; }
    .ex { flex-direction: column; }
    .ex-main { overflow: visible; padding: 2vh 4vw; border-left-width: 6px; }
    .ex-side { padding: 1vh 0 2vh; }

    .top-title { display: none; }
    .now-t { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="app">

<script>
const $ = id => document.getElementById(id);
const qs = s => document.querySelector(s);
const qsa = s => Array.from(document.querySelectorAll(s));
const oks = s => [].concat(s.ok);

/* =========================================================
   Piezas para dibujar las pantallas del ordenador de mentira
   ========================================================= */

// Initial file system state
const initialFileSystem = {
  'C:': {
    'Usuarios': {
      'TuNombre': {
        'Documentos': {
          'MiInforme.docx': { type: 'file', icon: '📄', selected: false, originalPath: 'C:\\Usuarios\\TuNombre\\Documentos' },
          'CartaAmiga.docx': { type: 'file', icon: '📄', selected: false, originalPath: 'C:\\Usuarios\\TuNombre\\Documentos' },
          'FotosVerano': { type: 'folder', icon: '📁', selected: false, originalPath: 'C:\\Usuarios\\TuNombre\\Documentos' },
          'MusicaFavorita.mp3': { type: 'file', icon: '🎵', selected: false, originalPath: 'C:\\Usuarios\\TuNombre\\Documentos' }
        },
        'Imágenes': { type: 'folder', icon: '🖼️', selected: false, originalPath: 'C:\\Usuarios\\TuNombre' },
        'Música': { type: 'folder', icon: '🎵', selected: false, originalPath: 'C:\\Usuarios\\TuNombre' }
      }
    }
  },
  'D:': { /* USB drive */ }
};

const getPathParts = path => path.split('\\').filter(p => p !== '');
const getAbsolutePath = (basePath, itemName) => {
  if (basePath === '') return itemName; // For drive letters
  if (!basePath.endsWith('\\')) basePath += '\\';
  return basePath + itemName;
};

// Helper function to get an item from the file system by its full path
const getFsItem = (fs, fullPath) => {
  const parts = getPathParts(fullPath);
  let current = fs;
  for (const part of parts) {
    if (!current || !current[part]) return null;
    current = current[part];
  }
  return current;
};

// Helper function to set an item in the file system by its full path
const setFsItem = (fs, fullPath, item) => {
  const parts = getPathParts(fullPath);
  let current = fs;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!current[parts[i]]) current[parts[i]] = {};
    current = current[parts[i]];
  }
  current[parts[parts.length - 1]] = item;
};

// Helper function to delete an item from the file system by its full path
const deleteFsItem = (fs, fullPath) => {
  const parts = getPathParts(fullPath);
  let current = fs;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!current[parts[i]]) return;
    current = current[parts[i]];
  }
  delete current[parts[parts.length - 1]];
};

const getItemName = fullPath => {
  const parts = getPathParts(fullPath);
  return parts[parts.length - 1];
};

const taskbar = c => `<div class="taskbar">
  <div class="taskbar-left">
    <span class="taskbar-icon t" data-id="start-btn">🪟</span>
    <span class="taskbar-icon t" data-id="search-btn">🔍</span>
    <span class="taskbar-icon t" data-id="task-view-btn">🗗</span>
  </div>
  <div class="taskbar-center">
    <span class="taskbar-icon t${c.feOpen ? ' active' : ''}" data-id="fe-taskbar-icon">📁</span>
    <span class="taskbar-icon t" data-id="edge-taskbar-icon">🌐</span>
  </div>
  <div class="taskbar-right">
    <span class="t${!c.usbConnected ? ' hidden' : ''}" data-id="eject-usb-btn">⏏️</span>
    <span class="t" data-id="clock">10:24</span>
  </div>
</div>`;

const desktop = c => `<div class="desktop">
  <div class="desktop-icon t${c.selected === 'recycle-bin' ? ' selected' : ''}" data-id="recycle-bin">
    <span class="desktop-icon-img">🗑️</span>
    <span>Papelera de reciclaje</span>
  </div>
  <div class="desktop-icon t${c.selected === 'fe-desktop-icon' ? ' selected' : ''}" data-id="fe-desktop-icon">
    <span class="desktop-icon-img">📁</span>
    <span>Explorador de archivos</span>
  </div>
  ${c.ejectUsbNotification ? `<div class="eject-notification"><span>✅</span><span>Se puede quitar el USB (D:).</span></div>` : ''}
</div>`;

const feWindow = c => {
  const currentPathParts = getPathParts(c.currentFolder);
  const content = getFsItem(c.fs, c.currentFolder);
  const items = content ? Object.entries(content)
    .filter(([, item]) => item && (item.type === 'file' || item.type === 'folder'))
    .map(([name, item]) => `<div class="fe-item t${c.selectedItems.includes(name) ? ' selected' : ''}" data-id="item-${name}" data-name="${name}" data-type="${item.type}">
      <span class="fe-item-icon">${item.icon}</span>
      <span class="fe-item-name">${name}</span>
    </div>`).join('') : '';

  const navItems = [
    { id: 'documents', label: 'Documentos', icon: '📄', path: 'C:\\Usuarios\\TuNombre\\Documentos' },
    { id: 'pictures', label: 'Imágenes', icon: '🖼️', path: 'C:\\Usuarios\\TuNombre\\Imágenes' },
    { id: 'music', label: 'Música', icon: '🎵', path: 'C:\\Usuarios\\TuNombre\\Música' },
  ];
  if (c.usbConnected) {
    navItems.push({ id: 'drive-d', label: 'USB (D:)', icon: '💾', path: 'D:' });
  }

  const ribbonEnabled = c.selectedItems.length > 0;
  const pasteEnabled = !!c.clipboard;
  const undoEnabled = c.history.length > 0;
  const deleteEnabled = c.selectedItems.length > 0;

  return `<div class="fe-window${c.feOpen ? '' : ' hidden'}">
    <div class="fe-titlebar">
      <span>Explorador de archivos</span>
      <div class="fe-titlebar-btns">
        <span class="fe-titlebar-btn t" data-id="min-btn">➖</span>
        <span class="fe-titlebar-btn t" data-id="max-btn">🗖</span>
        <span class="fe-titlebar-btn t" data-id="close-btn">✕</span>
      </div>
    </div>
    <div class="fe-ribbon">
      <div class="fe-ribbon-btn t${!ribbonEnabled ? ' disabled' : ''}" data-id="copy-btn"><span>📋</span>Copiar</div>
      <div class="fe-ribbon-btn t${!ribbonEnabled ? ' disabled' : ''}" data-id="cut-btn"><span>✂️</span>Cortar</div>
      <div class="fe-ribbon-btn t${!pasteEnabled ? ' disabled' : ''}" data-id="paste-btn"><span>📄</span>Pegar</div>
      <div class="fe-ribbon-btn t${!undoEnabled ? ' disabled' : ''}" data-id="undo-btn"><span>↩️</span>Deshacer</div>
      <div class="fe-ribbon-btn t" data-id="select-all-btn"><span>☑️</span>Seleccionar todo</div>
      <div class="fe-ribbon-btn t${!deleteEnabled ? ' disabled' : ''}" data-id="delete-btn"><span>🗑️</span>Eliminar</div>
    </div>
    <div class="fe-pathbar">
      <span class="fe-path-segment t" data-id="path-root" data-path="">Este equipo</span> ›
      ${currentPathParts.map((part, idx) => {
        const pathSoFar = (idx === 0 && part.endsWith(':')) ? part : currentPathParts.slice(0, idx + 1).join('\\');
        return `<span class="fe-path-segment t" data-id="path-${idx}" data-path="${pathSoFar}">${part}</span>${idx < currentPathParts.length - 1 ? '›' : ''}`;
      }).join('')}
    </div>
    <div class="fe-body">
      <div class="fe-nav-pane">
        ${navItems.map(item => `<div class="fe-nav-item t${c.currentFolder === item.path ? ' selected' : ''}" data-id="nav-${item.id}" data-path="${item.path}">
          <span>${item.icon}</span><span class="fe-nav-label">${item.label}</span>
        </div>`).join('')}
      </div>
      <div class="fe-content-pane" data-id="fe-content-pane">
        ${items}
        ${c.selectionRect ? `<div class="drag-selection-rect" style="left:${c.selectionRect.x}px;top:${c.selectionRect.y}px;width:${c.selectionRect.w}px;height:${c.selectionRect.h}px;"></div>` : ''}
      </div>
    </div>
    ${c.contextMenu ? contextMenu(c) : ''}
    ${c.replaceDialog ? replaceDialog(c) : ''}
  </div>`;
};

const contextMenu = c => {
  const items = [];
  if (c.contextMenu.onItem) {
    items.push({ id: 'ctx-open', label: 'Abrir' });
    items.push({ id: 'ctx-cut', label: 'Cortar' });
    items.push({ id: 'ctx-copy', label: 'Copiar' });
    items.push({ id: 'ctx-delete', label: 'Eliminar' });
  } else { // On empty space
    items.push({ id: 'ctx-paste', label: 'Pegar', disabled: !c.clipboard });
    items.push({ id: 'ctx-new-folder', label: 'Nueva carpeta' });
  }
  if (c.contextMenu.extra) { // For recycle bin restore
    items.push({ id: 'ctx-restore', label: 'Restaurar' });
  }

  return `<div class="context-menu" style="left:${c.contextMenu.x}px;top:${c.contextMenu.y}px;">
    ${items.map(item => `<div class="context-menu-item t${item.disabled ? ' disabled' : ''}" data-id="${item.id}">${item.label}</div>`).join('')}
  </div>`;
};

const replaceDialog = c => `<div class="replace-dialog">
  <div class="replace-dialog-box">
    <h3>Ya existe un archivo con el mismo nombre</h3>
    <p>El destino ya tiene un archivo llamado <b>${c.replaceDialog.fileName}</b>.</p>
    <div class="replace-dialog-buttons">
      <button class="replace-dialog-btn t" data-id="replace-skip">Omitir este archivo</button>
      <button class="replace-dialog-btn primary t" data-id="replace-replace">Reemplazar el archivo en el destino</button>
    </div>
  </div>
</div>`;

const quizScreen = c => `<div class="fe-window">
    <div class="fe-titlebar"><span>Pregunta</span><div class="fe-titlebar-btns"></div></div>
    <div class="fe-ribbon"></div><div class="fe-pathbar"></div>
    <div class="fe-body" style="flex-direction:column; padding: 1em;">
      <div class="quiz-q">${c.quiz.question}</div>
      <div class="quiz-opts">
        ${c.quiz.options.map(opt => `<div class="quiz-opt t" data-id="${opt.id}">${opt.label}</div>`).join('')}
      </div>
    </div>
  </div>`;

const monitor = c => {
  let screenContent = '';
  if (c.quiz) {
    screenContent = quizScreen(c);
  } else if (c.feOpen) {
    screenContent = feWindow(c);
  } else {
    screenContent = desktop(c);
  }
  return taskbar(c) + screenContent;
};

/* =========================================================
   Ejercicios
   ========================================================= */
const T = (text, hint, ok, screen, extra = {}) => ({ text, hint, ok, screen, do: 'click', ...extra });
const FE_PATH_USERS = 'C:\\Usuarios\\TuNombre';
const FE_PATH_DOCS = 'C:\\Usuarios\\TuNombre\\Documentos';
const FE_PATH_PICS = 'C:\\Usuarios\\TuNombre\\Imágenes';
const FE_PATH_MUSIC = 'C:\\Usuarios\\TuNombre\\Música';
const FE_PATH_USB = 'D:';

const EX = [
  { icon:'🔍', accent:'var(--c6)', title:'Explorador y selección', objective:'Abrir el Explorador de archivos y seleccionar elementos de varias maneras.',
    note: () => 'El Explorador de archivos te permite ver y organizar tus documentos, fotos y carpetas.',
    steps: () => [
      T('Abre el <b>Explorador de archivos</b>. Puedes hacerlo desde la barra de tareas o con el atajo de teclado <b>Windows + E</b>.', 'Haz clic en el icono de la carpeta amarilla en la barra de tareas.', ['fe-taskbar-icon', 'win-e'], c => monitor(c), { enter: c => { c.feOpen = false; c.currentFolder = FE_PATH_DOCS; c.selectedItems = []; }, after: c => { c.feOpen = true; c.currentFolder = FE_PATH_DOCS; }, do: 'action' }),
      T('Selecciona el archivo <b>MiInforme.docx</b> con un solo clic.', 'Busca "MiInforme.docx" y haz clic izquierdo.', 'item-MiInforme.docx', c => monitor(c), { after: (c, id) => { c.selectedItems = [getItemName(id)]; } }),
      T('Selecciona <b>MiInforme.docx</b> y <b>CartaAmiga.docx</b>. Para seleccionar varios elementos seguidos, haz clic en el primero, luego <b>mantén pulsada la tecla Mayús (Shift) y haz clic en el último</b>.', 'Mantén Shift y haz clic en "CartaAmiga.docx".', ['item-CartaAmiga.docx', 'shift-click'], c => monitor(c), { after: c => { c.selectedItems = ['MiInforme.docx', 'CartaAmiga.docx']; }, do: 'shift-click' }),
      T('Ahora selecciona <b>MiInforme.docx</b> y <b>MusicaFavorita.mp3</b>. Para seleccionar elementos separados, <b>mantén pulsada la tecla Ctrl y haz clic en cada uno</b>.', 'Mantén Ctrl y haz clic en "MusicaFavorita.mp3".', ['item-MusicaFavorita.mp3', 'ctrl-click'], c => monitor(c), { after: c => { c.selectedItems = ['MiInforme.docx', 'MusicaFavorita.mp3']; }, do: 'ctrl-click' }),
      T('Selecciona <b>todos los elementos</b> de la carpeta. Pulsa <b>Ctrl + E</b> o usa el botón "Seleccionar todo" en la barra superior.', 'Pulsa Ctrl y la letra E al mismo tiempo.', ['select-all-btn', 'ctrl-e'], c => monitor(c), { after: c => { c.selectedItems = Object.keys(getFsItem(c.fs, c.currentFolder)); }, do: 'action' }),
      T('Otra forma de seleccionar varios elementos es <b>arrastrar un rectángulo</b> con el ratón desde un espacio vacío alrededor de ellos.', 'Haz clic en un espacio vacío y arrastra el ratón para formar un rectángulo.', 'fe-content-pane', c => monitor(c), { after: c => { c.selectedItems = Object.keys(getFsItem(c.fs, c.currentFolder)); }, do: 'drag-rect', done: '¡Perfecto! Ya sabes seleccionar archivos y carpetas.' })
    ],
    end: { screen: c => monitor(c) }
  },

  { icon:'📄', accent:'var(--c4)', title:'Copiar y pegar documentos', objective:'Copiar un documento a otra carpeta utilizando diferentes métodos.',
    note: () => 'Copiar crea una copia del archivo o carpeta y mantiene el original en su sitio.',
    steps: () => [
      T('Abre el <b>Explorador de archivos</b> y ve a la carpeta <b>Documentos</b>.', 'Haz clic en el icono de la carpeta amarilla en la barra de tareas.', ['fe-taskbar-icon', 'nav-documents'], c => monitor(c), { enter: c => { c.feOpen = false; c.currentFolder = FE_PATH_DOCS; c.selectedItems = []; }, after: c => { c.feOpen = true; c.currentFolder = FE_PATH_DOCS; }, do: 'action' }),
      T('Selecciona el archivo <b>CartaAmiga.docx</b>.', 'Haz clic en "CartaAmiga.docx".', 'item-CartaAmiga.docx', c => monitor(c), { after: (c, id) => { c.selectedItems = [getItemName(id)]; } }),
      T('<b>Copia el archivo</b>. Puedes usar <b>Ctrl + C</b>, hacer clic derecho y elegir "Copiar", o usar el botón "Copiar" en la barra superior.', 'Haz clic en el botón "Copiar" en la barra de herramientas.', ['copy-btn', 'ctx-copy', 'ctrl-c'], c => monitor(c), { after: c => { c.clipboard = { action: 'copy', items: c.selectedItems, from: c.currentFolder }; c.selectedItems = []; }, do: 'action' }),
      T('Ahora, ve a la carpeta <b>Imágenes</b>.', 'Haz clic en "Imágenes" en el panel de navegación.', 'nav-pictures', c => monitor(c), { after: c => { c.currentFolder = FE_PATH_PICS; } }),
      T('<b>Pega el archivo</b>. Puedes usar <b>Ctrl + V</b>, hacer clic derecho en un espacio vacío y elegir "Pegar", o usar el botón "Pegar" en la barra superior.', 'Haz clic en el botón "Pegar" en la barra de herramientas.', ['paste-btn', 'ctx-paste', 'ctrl-v'], c => monitor(c), { after: c => {
          setFsItem(c.fs, getAbsolutePath(FE_PATH_PICS, 'CartaAmiga.docx'), deepCopy(getFsItem(initialFileSystem, getAbsolutePath(FE_PATH_DOCS, 'CartaAmiga.docx'))));
          c.clipboard = null;

      T('Selecciona la carpeta <b>FotosVerano</b>.', 'Haz clic en "FotosVerano".', 'item-FotosVerano', c => monitor(c), { after: (c, id) => { c.selectedItems = [getItemName(id)]; } }),

      T('Ahora, ve a la carpeta <b>Música</b>.', 'Haz clic en "Música" en el panel de navegación.', 'nav-music', c => monitor(c), { after: c => { c.currentFolder = FE_PATH_MUSIC; } }),
      T('<b>Pega la carpeta</b>. Usa <b>Ctrl + V</b>, clic derecho o el botón "Pegar".', 'Haz clic en el botón "Pegar" en la barra de herramientas.', ['paste-btn', 'ctx-paste', 'ctrl-v'], c => monitor(c), { after: c => {
          setFsItem(c.fs, getAbsolutePath(FE_PATH_MUSIC, 'FotosVerano'), deepCopy(getFsItem(initialFileSystem, getAbsolutePath(FE_PATH_DOCS, 'FotosVerano'))));
          deleteFsItem(c.fs, getAbsolutePath(FE_PATH_DOCS, 'FotosVerano'));
          c.clipboard = null;
          c.history.push({ type: 'move', items: ['FotosVerano'], from: FE_PATH_DOCS, to: FE_PATH_MUSIC });

    end: { screen: c => monitor(c) }
  },

  { icon:'👆', accent:'var(--c1)', title:'Arrastrar y soltar', objective:'Mover y copiar archivos usando la acción de arrastrar y soltar.',

    steps: () => [
      T('Abre el <b>Explorador de archivos</b> y ve a la carpeta <b>Documentos</b>.', 'Haz clic en el icono de la carpeta amarilla en la barra de tareas.', ['fe-taskbar-icon', 'nav-documents'], c => monitor(c), { enter: c => { c.feOpen = false; c.currentFolder = FE_PATH_DOCS; c.selectedItems = []; }, after: c => { c.feOpen = true; c.currentFolder = FE_PATH_DOCS; }, do: 'action' }),

          deleteFsItem(c.fs, getAbsolutePath(FE_PATH_DOCS, 'MiInforme.docx'));
          c.history.push({ type: 'move', items: ['MiInforme.docx'], from: FE_PATH_DOCS, to: FE_PATH_MUSIC });

      T('Ahora, <b>arrastra el archivo MusicaFavorita.mp3</b> a la carpeta <b>Imágenes</b>, pero <b>manteniendo pulsada la tecla Ctrl</b> para copiarlo.', 'Haz clic en "MusicaFavorita.mp3" y, sin soltar, pulsa Ctrl y arrástralo a "Imágenes".', 'item-MusicaFavorita.mp3', c => monitor(c), { do: 'drag-ctrl-copy', target: 'nav-pictures', after: c => {

        ...c, quiz: { question: 'Si arrastras un archivo de una carpeta a otra <b>dentro del mismo disco duro</b>, ¿qué acción se realiza por defecto?', options: [

/* =========================================================
   Estado y guardado
   ========================================================= */
const SL = EX.length + 2;                 // portada + ejercicios + final
const KEY = 'practica-ordenador-acciones-v1';
let S = { slide: 0, stars: {} };
try {
  const p = JSON.parse(localStorage.getItem(KEY));
  if (p) {
    S.stars = p.stars || {};
    if (Number.isInteger(p.slide) && p.slide >= 0 && p.slide < SL) S.slide = p.slide;
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const starsHTML = n => `<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(3 - n)}</i></span>`;

/* =========================================================
   Motor del ejercicio
   ========================================================= */
let run = null;

function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

function startRun(i) {
  run = {
    i, s: 0, err: 0, hints: 0, busy: false, done: false, hint: false,
    ctx: {
      feOpen: false,
      currentFolder: FE_PATH_DOCS,
      selectedItems: [],
      clipboard: null, // {action: 'copy'|'cut', items: [], from: path}
      usbConnected: false,
      ejectUsbNotification: false,
      contextMenu: null, // {x, y, onItem: bool, extra: bool, targetItem: string}
      replaceDialog: null, // {fileName: string}
      quiz: null, // {question: string, options: [{id, label}]}
      fs: deepCopy(initialFileSystem),
      recycleBin: {}, // {itemName: itemData}
      history: [] // For undo: { type: 'delete'|'move'|'paste'|'replace', items: [], from: path, to: path, itemData: {}}
    },
    steps: EX[i].steps()
  };
  enterStep();
}
function enterStep() { const s = run.steps[run.s]; if (s && s.enter) s.enter(run.ctx); }
const curStep = () => (run && !run.done) ? run.steps[run.s] : null;

function fb(kind, html) { const e = $('fb'); if (!e) return; e.className = 'fb' + (kind ? ' ' + kind : ''); e.innerHTML = html || ''; }

function renderMonitor() {
  const winin = $('winin'); if (!winin) return;
  winin.innerHTML = monitor(run.ctx) + (run.done ? '<div class="bigcheck"><span>✔</span></div>' : '');
  if (curStep() && run.hint) {
    const step = curStep();
    if (step.do === 'drag' || step.do === 'drag-ctrl-copy') {
      const targetEl = winin.querySelector(`[data-id="${step.target}"]`);
      if (targetEl) targetEl.classList.add('hint');
      const sourceEl = winin.querySelector(`[data-id="${step.ok[0]}"]`);
      if (sourceEl) sourceEl.classList.add('hint');
    } else if (step.do === 'drag-rect') {
      winin.querySelector('.fe-content-pane').classList.add('hint');
    } else {
      oks(step).forEach(id => {
        let els = [];
        if (id.startsWith('item-')) {
          els = winin.querySelectorAll(`[data-name="${getItemName(id)}"]`);
        } else if (id.startsWith('nav-') || id.startsWith('path-')) {
          els = winin.querySelectorAll(`[data-id="${id}"]`);
        } else if (id.startsWith('ctx-')) {
           els = winin.querySelectorAll(`[data-id="${id}"]`);
        } else if (id.startsWith('replace-')) {
          els = winin.querySelectorAll(`[data-id="${id}"]`);
        } else if (id.startsWith('quiz-')) {
          els = winin.querySelectorAll(`[data-id="${id}"]`);
        } else { // Generic button/icon
          els = winin.querySelectorAll(`[data-id="${id}"]`);
        }
        els.forEach(el => el.classList.add('hint'));
      });
    }
  }
}

function renderPanel() {
  const ex = EX[run.i];
  $('note').innerHTML = '📋 <b>En tu ordenador:</b> ' + ex.note();
  if (run.done) {
    const n = starsOf(run);
    $('now').innerHTML = `<div class="now-n">¡Ejercicio terminado!</div><div class="now-t">🎉 ${starsHTML(n)}<br>Ahora <b>hazlo en tu ordenador de verdad</b>.</div>`;
  } else {
    $('now').innerHTML = `<div class="now-n">Paso ${run.s + 1} de ${run.steps.length}</div><div class="now-t">${run.steps[run.s].text}</div>`;
  }
  $('pips').innerHTML = run.steps.map((_, j) => `<span class="pip ${run.done || j < run.s ? 'past' : j === run.s ? 'cur' : ''}"></span>`).join('');
  $('b-hint').hidden = run.done;
  $('b-next').hidden = !run.done;
  $('b-next').textContent = run.i === EX.length - 1 ? 'Ver resultado ▶' : 'Siguiente ejercicio ▶';
}
function paint() { renderMonitor(); renderPanel(); }

const starsOf = r => { const e = r.err + r.hints; return e <= 3 ? 3 : e <= 7 ? 2 : 1; }; // More lenient for advanced

function success(step, id) {
  const r = run; r.busy = true;
  if (step.after) step.after(r.ctx, id);
  fb('ok', '✅ ' + (step.done || '¡Muy bien!'));
  const winin = $('winin');
  if (winin) {
    winin.classList.add('okp');
    if (step.fx === 'flash') winin.insertAdjacentHTML('beforeend', '<div class="flash"></div>');
  }
  setTimeout(() => {
    if (run !== r) return;
    r.busy = false; r.hint = false; r.s++;
    if (r.s >= r.steps.length) finish();
    else { enterStep(); paint(); }
  }, 1000);
}

function wrong(step, id, el, msg) {
  run.err++;
  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  fb('bad', '🤔 ' + (msg || (step.wrong && step.wrong[id]) || ('Esa no es la acción. ' + step.hint)));
}

/* ---- Interacciones sobre el monitor ---- */
const stage = $('stage');
const targetOf = e => { const t = e.target.closest('[data-id]'); return (t && t.closest('.win-in')) ? t : null; };

stage.addEventListener('contextmenu', e => {
  const feWindowEl = e.target.closest('.fe-window');
  if (feWindowEl) {
    e.preventDefault();
    if (run && !run.busy) {
      const step = curStep();
      const t = targetOf(e);
      const onItem = t && t.dataset.id.startsWith('item-');
      const isRecycleBin = t && t.dataset.id === 'recycle-bin';

      // Normalize context menu position relative to the fe-window
      const rect = feWindowEl.getBoundingClientRect();
      const menuX = e.clientX - rect.left;
      const menuY = e.clientY - rect.top;

      run.ctx.contextMenu = { x: menuX, y: menuY, onItem, extra: isRecycleBin, targetItem: onItem ? t.dataset.name : null };
      paint();
    }
  }
});

stage.addEventListener('click', e => {
  /* botones del panel */
  const b = e.target.closest('button');
  if (b && run) {
    if (b.id === 'b-hint' && !run.done) {
      run.hints++; run.hint = true; renderMonitor();
      fb('soft', '💡 ' + curStep().hint); return;
    }
    if (b.id === 'b-redo') { startRun(run.i); paint(); fb('', ''); return; }
    if (b.id === 'b-next') { next(); return; }
  }
  const card = e.target.closest('.card');
  if (card) { goSlide(+card.dataset.s); return; }
  if (e.target.closest('#b-reset')) { S.stars = {}; save(); goSlide(0); return; }

  /* clics sobre el monitor */
  const step = curStep(); if (!step || run.busy) return;
  const t = targetOf(e);

  // Handle context menu interaction
  if (run.ctx.contextMenu) {
    if (t && t.closest('.context-menu')) {
      const clickedId = t.dataset.id;
      if (oks(step).includes(clickedId)) {
        success(step, clickedId);
      } else {
        wrong(step, clickedId, t, 'Esa opción no es la correcta.');
      }
    } else {
      // Clicked outside context menu, treat as wrong if a context menu action was expected
      if (step.do === 'action' && oks(step).some(id => id.startsWith('ctx-'))) {
          wrong(step, 'click-outside-context-menu', null, 'Debías seleccionar una opción del menú contextual.');
      }
    }
    run.ctx.contextMenu = null; // Close menu
    paint(); // Repaint to hide menu
    return; // Exit click handler to avoid processing again
  }
  // Handle replace dialog interaction
  if (run.ctx.replaceDialog) {
    if (t && t.closest('.replace-dialog-box')) {
      if (oks(step).includes(t.dataset.id)) {
        success(step, t.dataset.id);
      } else {
        wrong(step, t.dataset.id, t, 'Esa no es la opción que buscamos.');
      }
    }
    return;
  }
  // Handle quiz interaction
  if (run.ctx.quiz) {
    if (t && t.closest('.quiz-opt')) {
      if (oks(step).includes(t.dataset.id)) {
        success(step, t.dataset.id);
      } else {
        wrong(step, t.dataset.id, t, 'Esa no es la respuesta correcta.');
      }
    }
    return;
  }

  if (!t) return;
  const id = t.dataset.id;
  const name = t.dataset.name;

  if (step.do === 'click' || step.do === 'action') {
    let clickedOk = false;
    let successId = id;

    if (id.startsWith('item-')) {
      if (oks(step).includes(id)) {
        clickedOk = true;
      } else if (oks(step).includes(name)) { // For generic name match
        clickedOk = true; successId = name;
      }
      if (clickedOk) {
        qsa('.fe-item').forEach(el => el.classList.remove('selected'));
        t.classList.add('selected');
        run.ctx.selectedItems = [name];
      }
    } else if (id.startsWith('nav-') || id.startsWith('path-')) {
      if (oks(step).includes(id) || oks(step).includes(t.dataset.path)) {
        clickedOk = true; successId = id;
        run.ctx.currentFolder = t.dataset.path;
      }
    } else { // Generic button/icon
      if (oks(step).includes(id)) {
        clickedOk = true;
      }
    }

    if (clickedOk) {
      success(step, successId);
    } else {
      wrong(step, id, t);
    }
  } else if (step.do === 'dblclick') {
    wrong(step, id, t, 'Un solo clic no abrirá el elemento. Necesitas un <b>doble clic</b>.');
  } else if (step.do === 'rightclick') {
    wrong(step, id, t, 'Esto ha sido un clic izquierdo. Necesitas un <b>clic derecho</b> para abrir el menú.');
  } else if (step.do === 'drag' || step.do === 'drag-ctrl-copy' || step.do === 'drag-rect') {
    wrong(step, id, t, 'No basta con un clic. Necesitas <b>arrastrar</b>.');
  }
});

stage.addEventListener('dblclick', e => {
  const step = curStep(); if (!step || run.busy) return;
  const t = targetOf(e); if (!t) return;
  const id = t.dataset.id;
  const name = t.dataset.name;

  if (step.do === 'dblclick' || step.do === 'action') {
    if (oks(step).includes(id) || oks(step).includes('item-' + name)) {
      success(step, id.startsWith('item-') ? 'item-' + name : id);
    } else {
      wrong(step, id, t);
    }
  } else {
    wrong(step, id, t, 'No necesitas doble clic aquí.');
  }
});


let dragStartTarget = null;
let dragStartX, dragStartY;
let dragGhost = null;
let selectionRect = null;

stage.addEventListener('pointerdown', e => {
  const step = curStep(); if (!step || run.busy) return;
  const t = targetOf(e);
  const r = run;
  const cleanups = [];
  const stopAll = () => { cleanups.forEach(f => f()); };
  const listen = (ev, fn) => { document.addEventListener(ev, fn); cleanups.push(() => document.removeEventListener(ev, fn)); };

  if (step.do === 'drag' || step.do === 'drag-ctrl-copy') {
    if (t && (oks(step).includes(t.dataset.id) || oks(step).includes('item-' + t.dataset.name))) {
      dragStartTarget = t;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      listen('pointermove', ev => {
        if (!dragGhost) {
          if (Math.hypot(ev.clientX - dragStartX, ev.clientY - dragStartY) > 5) { // Start drag only after some movement
            dragGhost = document.createElement('div');
            dragGhost.className = 'drag-ghost';
            dragGhost.innerHTML = dragStartTarget.querySelector('.fe-item-icon').outerHTML + dragStartTarget.querySelector('.fe-item-name').textContent;
            document.body.appendChild(dragGhost);
            dragStartTarget.classList.add('drag-source');
          } else {
            return;
          }
        }
        dragGhost.style.left = (ev.clientX + 10) + 'px';
        dragGhost.style.top = (ev.clientY + 10) + 'px';

        qsa('.drag-target').forEach(el => el.classList.remove('drag-target'));
        const targetEl = e.target.closest('[data-id]');
        if (targetEl && targetEl.dataset.id === step.target) {
          targetEl.classList.add('drag-target');
        }
      });

      listen('pointerup', ev => {
        if (dragGhost) {
          dragGhost.remove();
          dragGhost = null;
          dragStartTarget.classList.remove('drag-source');
        }
        qsa('.drag-target').forEach(el => el.classList.remove('drag-target'));

        const targetEl = e.target.closest('[data-id]');
        const isCtrlPressed = ev.ctrlKey;

        if (targetEl && targetEl.dataset.id === step.target) {
          if (step.do === 'drag-ctrl-copy' && isCtrlPressed) {
            success(step, targetEl.dataset.id);
          } else if (step.do === 'drag' && !isCtrlPressed) {
            success(step, targetEl.dataset.id);
          } else {
            wrong(step, targetEl.dataset.id, targetEl, step.do === 'drag-ctrl-copy' ? 'Necesitas mantener <b>Ctrl pulsado</b> para copiar al arrastrar.' : 'No necesitas Ctrl pulsado para mover entre carpetas del mismo disco.');
          }
        } else {
          wrong(step, t.dataset.id, t, 'Arrastra el archivo a la carpeta correcta.');
        }
        stopAll();
      });
      listen('pointercancel', stopAll);
    } else {
      wrong(step, t ? t.dataset.id : 'no-target', t);
    }
  } else if (step.do === 'drag-rect') {
    const feContentPane = t.closest('.fe-content-pane');
    if (feContentPane) {
      const rect = feContentPane.getBoundingClientRect();
      const startX = e.clientX - rect.left;
      const startY = e.clientY - rect.top;

      run.ctx.selectionRect = { x: startX, y: startY, w: 0, h: 0 };
      paint();

      listen('pointermove', ev => {
        const currentX = ev.clientX - rect.left;
        const currentY = ev.clientY - rect.top;
        const x = Math.min(startX, currentX);
        const y = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);
        run.ctx.selectionRect = { x, y, w, h };
        paint();
      });

      listen('pointerup', () => {
        if (run.ctx.selectionRect.w > 20 && run.ctx.selectionRect.h > 20) { // Require a minimum size for selection
          success(step, feContentPane.dataset.id);
        } else {
          wrong(step, feContentPane.dataset.id, feContentPane, 'Arrastra el ratón para formar un rectángulo de selección.');
        }
        run.ctx.selectionRect = null;
        paint();
        stopAll();
      });
      listen('pointercancel', stopAll);
    }
  }
});


document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input')) return; // Don't interfere with input fields
  // Handle slide navigation separately for consistency with example's global keydown
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); goSlide(0); }
  else if (e.key === 'End') { e.preventDefault(); goSlide(SL - 1); }
  else if (e.key.toLowerCase() === 'f') toggleFull();

  // Pass to specific handler for exercise actions
  if (run) {
    const step = curStep();
    if (step && (step.do === 'keydown' || step.do === 'action')) {
      let actionId = null;
      if (e.key.toLowerCase() === 'e' && e.metaKey) { // Simulate Windows Key + E (metaKey for cross-platform system key)
          actionId = 'win-e';
      } else if (e.key.toLowerCase() === 'c' && e.ctrlKey) {
          actionId = 'ctrl-c';
      } else if (e.key.toLowerCase() === 'x' && e.ctrlKey) {
          actionId = 'ctrl-x';
      } else if (e.key.toLowerCase() === 'v' && e.ctrlKey) {
          actionId = 'ctrl-v';
      } else if (e.key.toLowerCase() === 'z' && e.ctrlKey) {
          actionId = 'ctrl-z';
      } else if (e.key === 'Delete') {
          actionId = 'delete-key';
      }

      if (actionId && oks(step).includes(actionId)) {
          e.preventDefault();
          success(step, actionId);
      } else if (actionId) {
          // Only show error if the key combination was meant for an action
          // and it was not the correct one for this step.
          // This avoids showing error for any random key press.
          if (['win-e', 'ctrl-c', 'ctrl-x', 'ctrl-v', 'ctrl-z', 'delete-key'].includes(actionId)) {
            wrong(step, actionId, null, 'Ese atajo de teclado no es el correcto aquí.');
          }
      }
    }
  }
});


/* =========================================================
   Diapositivas
   ========================================================= */
function renderSlide() {
  const s = S.slide, st = $('stage');
  let h = '';
  if (s === 0) {
    run = null;
    document.documentElement.style.setProperty('--accent', 'var(--c6)');
    $('top-title').textContent = 'Qué significa cada acción';
    h = `<div class="slide menu">
      <div class="big-emoji">💻</div>
      <h1>Qué significa cada acción</h1>
      <p>Aprende a <b>copiar, cortar, pegar y mover</b> archivos y carpetas en tu ordenador, como si fuera de verdad.</p>
      <div class="cards">${EX.map((e, i) => `<button class="card${S.stars[i] ? ' done' : ''}" type="button" data-s="${i + 1}" style="--ac:${e.accent}">
        <span class="ce">${e.icon}</span><span>${i + 1}. ${e.title}</span>${starsHTML(S.stars[i] || 0)}</button>`).join('')}</div>
    </div>`;
  } else if (s === SL - 1) {
    run = null;
    document.documentElement.style.setProperty('--accent', 'var(--c3)');
    $('top-title').textContent = '¡Terminado!';
    const done = EX.filter((_, i) => S.stars[i]).length;
    h = `<div class="slide finish">
      <div class="trophy">🏆</div>
      <h2>${done === EX.length ? '¡Enhorabuena!' : 'Casi lo tienes'}</h2>
      <p>${done === EX.length ? 'Has practicado <b>todas las acciones con archivos y carpetas</b>. Ahora toca hacerlas en tu ordenador de verdad.' : `Has completado <b>${done} de ${EX.length}</b> ejercicios. Puedes volver a cualquiera con los números de abajo.`}</p>
      <div class="sumlist">${EX.map((e, i) => `<span>${e.icon} ${starsHTML(S.stars[i] || 0)}</span>`).join('')}</div>
      <button class="abtn" id="b-reset" type="button">↺ Borrar estrellas y empezar de nuevo</button>
    </div>`;
  } else {
    const i = s - 1, ex = EX[i];
    startRun(i);
    document.documentElement.style.setProperty('--accent', ex.accent);
    $('top-title').textContent = `Ejercicio ${i + 1} de ${EX.length}`;
    h = `<div class="slide ex">
      <div class="ex-main">
        <div class="ex-head">
          <div class="ex-icon">${ex.icon}</div>
          <div><div class="ex-num">Ejercicio ${i + 1}</div><div class="ex-title">${ex.title}</div></div>
        </div>
        <div class="ex-obj">🎯 ${ex.objective}</div>
        <div class="ex-note" id="note"></div>
        <div class="now" id="now"></div>
        <div class="fb" id="fb"></div>
        <div class="acts">
          <button class="abtn" id="b-hint" type="button">💡 Pista</button>
          <button class="abtn" id="b-redo" type="button">↺ Repetir</button>
          <button class="abtn go" id="b-next" type="button" hidden>Siguiente ejercicio ▶</button>
        </div>
        <div class="pips" id="pips"></div>
      </div>
      <div class="ex-side"><div class="monitor"><div class="win-in" id="winin"></div></div></div>
    </div>`;
  }
  st.innerHTML = h;
  if (run) paint();
  updateChrome();
}

function updateChrome() {
  $('prev').disabled = S.slide === 0;
  $('next').disabled = S.slide === SL - 1;
  $('next').textContent = S.slide === 0 ? 'Empezar ▶' : 'Siguiente ▶';
  document.querySelectorAll('.dot').forEach((d, k) => {
    d.classList.toggle('on', k === S.slide);
    d.classList.toggle('seen', k !== S.slide && k >= 1 && k <= EX.length && !!S.stars[k - 1]);
  });
  $('prog-fill').style.width = (S.slide / (SL - 1) * 100) + '%';
  save();
}

function goSlide(s) { S.slide = Math.max(0, Math.min(SL - 1, s)); renderSlide(); }
function next() { if (S.slide < SL - 1) goSlide(S.slide + 1); }
function prev() { if (S.slide > 0) goSlide(S.slide - 1); }

$('dots').innerHTML = Array.from({ length: SL }, (_, k) => {
  const lb = k === 0 ? '🏠' : k === SL - 1 ? '🏆' : k;
  const tt = k === 0 ? 'Menú' : k === SL - 1 ? 'Resultado' : EX[k - 1].title;
  return `<button class="dot" type="button" data-s="${k}" title="${tt}">${lb}</button>`;
}).join('');
$('dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) goSlide(+d.dataset.s); });
$('next').onclick = next;
$('prev').onclick = prev;

/* Pantalla completa */
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
if (!document.fullscreenEnabled) $('btn-full').style.display = 'none';
$('btn-full').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => {
  $('btn-full').textContent = document.fullscreenElement ? '✕ Salir de pantalla completa' : '⛶ Pantalla completa';
});

renderSlide();
</script>

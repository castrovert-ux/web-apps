<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prácticas en clase: copiar y pegar texto e imágenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #25D366;
    --c2: #128C7E;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
    --suave: rgba(255,255,255,0.04);
    --borde: rgba(255,255,255,0.08);
    --escala: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: 'Nunito', 'Segoe UI', Verdana, sans-serif;
    font-size: calc(clamp(1.05rem, 0.7rem + 1.1vw, 1.75rem) * var(--escala));
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Fondo con manchas de color, como en el cuestionario */
  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(25px, 18px) scale(1.07); }
  }
  header, main, footer { position: relative; z-index: 1; }

  /* Cabecera */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em 1.2em;
    padding: 0.8em clamp(1rem, 3vw, 2.5rem);
    border-bottom: 1px solid var(--borde);
  }
  .tema { flex: 1 1 18em; min-width: 0; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.6em;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 0.35em 1.2em; border-radius: 100px; margin-bottom: 0.4em;
  }
  .tema h1 {
    margin: 0;
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
    font-size: 1.5em; line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .herramientas { display: flex; flex-wrap: wrap; gap: 0.4em; }
  button {
    font: inherit; font-size: 0.8em; font-weight: 700;
    min-height: 2.6em; padding: 0.35em 0.9em;
    color: var(--text); background: var(--suave);
    border: 2px solid var(--borde); border-radius: 14px;
    cursor: pointer; transition: all 0.2s ease;
  }
  button:hover:not(:disabled) { background: rgba(37,211,102,0.1); border-color: var(--c1); }
  button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

  /* Práctica */
  main {
    flex: 1; overflow-y: auto;
    padding: clamp(1rem, 3vh, 2.2rem) clamp(1rem, 4vw, 3.5rem);
  }
  .practica {
    max-width: 62em; margin: 0 auto;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: clamp(1.1rem, 3vw, 2.2rem);
  }
  .practica.entra { animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96) translateY(16px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .cabeza { display: flex; align-items: flex-start; gap: 0.6em; }
  .numero {
    flex: none;
    font-family: 'Fredoka One', 'Nunito', sans-serif;
    font-size: 3.2em; line-height: 0.95;
    min-width: 1.1em; text-align: right;
    background: linear-gradient(135deg, var(--c1), var(--c3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cabeza h2 { margin: 0; font-size: 1.5em; font-weight: 800; line-height: 1.2; }
  .objetivo { margin: 0.35em 0 0; font-size: 1.05em; font-weight: 600; color: var(--sub); max-width: 40em; }

  ol.pasos {
    list-style: none; counter-reset: paso;
    margin: 1.2em 0 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.55em;
    max-width: 46em;
  }
  ol.pasos li {
    counter-increment: paso;
    position: relative;
    padding: 0.6em 1em 0.6em 3.1em;
    font-weight: 600;
    background: var(--suave);
    border: 2px solid var(--borde);
    border-radius: 14px;
  }
  ol.pasos li::before {
    content: counter(paso);
    position: absolute; left: 0.75em; top: 0.6em;
    width: 1.75em; height: 1.75em; border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.9em;
    color: var(--bg); background: var(--c1);
  }

  .fijate {
    margin: 1.2em 0 0; padding: 0.75em 1.1em;
    max-width: 46em;
    font-weight: 700;
    background: rgba(255,217,61,0.1);
    border: 1px solid rgba(255,217,61,0.3);
    border-radius: 12px;
  }
  .fijate b { color: var(--c3); }

  /* Teclas */
  kbd {
    display: inline-block;
    min-width: 1.7em; padding: 0 0.45em;
    font: inherit; font-weight: 800; font-size: 0.9em; line-height: 1.5;
    text-align: center;
    color: var(--text); background: #1c2a47;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 8px;
    box-shadow: 0 0.18em 0 rgba(255,255,255,0.3);
    margin: 0 0.05em 0.18em;
    white-space: nowrap;
  }
  .mas { margin: 0 0.1em; font-weight: 800; color: var(--sub); }

  /* Pie */
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    padding: 0.8em clamp(1rem, 3vw, 2.5rem);
    border-top: 1px solid var(--borde);
    background: rgba(10,22,40,0.6);
  }
  footer button { font-size: 1em; min-width: 7.5em; font-weight: 800; }
  footer button.siguiente {
    color: var(--bg); border: none;
    background: linear-gradient(135deg, var(--c3), #f59e0b);
  }
  footer button.siguiente:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--c3), #f59e0b);
    transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4);
  }
  footer button:disabled { opacity: 0.35; cursor: default; }
  .progreso { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.35em; min-width: 0; }
  .progreso span { font-size: 0.85em; font-weight: 700; color: var(--sub); }
  .barra { width: min(100%, 22em); height: 0.5em; border-radius: 10px; background: var(--borde); overflow: hidden; }
  .barra i {
    display: block; height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--c1), var(--c3));
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* Paneles: lista y atajos */
  .panel {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    padding: clamp(1rem, 4vh, 3rem) clamp(1rem, 4vw, 3rem);
    background: rgba(10,22,40,0.85);
    overflow-y: auto;
  }
  .panel.abierto { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .caja {
    max-width: 60em; margin: 0 auto; padding: 1.3em 1.5em 1.5em;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px;
  }
  .caja .arriba { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-bottom: 0.9em; }
  .caja h2 {
    margin: 0; font-size: 1.3em;
    font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400;
    color: var(--c1);
  }
  .indice { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 0.55em; }
  .indice button {
    display: flex; align-items: center; gap: 0.7em; text-align: left;
    font-size: 0.9em; font-weight: 600;
  }
  .indice button b {
    flex: none;
    width: 1.9em; height: 1.9em; border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 0.9em;
    background: var(--borde);
  }
  .indice button.actual { background: rgba(37,211,102,0.15); border-color: var(--c1); }
  .indice button.actual b { background: var(--c1); color: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95em; font-weight: 600; }
  th, td { text-align: left; padding: 0.55em 0.6em; border-bottom: 1px solid var(--borde); }
  th { color: var(--sub); font-size: 0.8em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .nota { margin: 0.9em 0 0; font-size: 0.85em; color: var(--sub); }

  @media (max-width: 700px) {
    .numero { font-size: 2.4em; }
    .cabeza h2 { font-size: 1.3em; }
    footer button { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .practica.entra, .panel.abierto { animation: none; }
    .barra i, button { transition: none; }
  }
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<header>
  <div class="tema">
    <div class="badge">💻 Prácticas en clase</div>
    <h1>Copiar y pegar texto e imágenes</h1>
  </div>
  <div class="herramientas">
    <button type="button" id="btnLista">Ver todas</button>
    <button type="button" id="btnAtajos">Atajos</button>
    <button type="button" id="btnMenos" aria-label="Letra más pequeña">A−</button>
    <button type="button" id="btnMas" aria-label="Letra más grande">A+</button>
    <button type="button" id="btnPantalla">Pantalla completa</button>
  </div>
</header>

<main id="principal" tabindex="-1">
  <article class="practica" id="practica" aria-live="polite"></article>
</main>

<footer>
  <button type="button" id="btnAnterior">← Anterior</button>
  <div class="progreso">
    <span id="contador"></span>
    <div class="barra" aria-hidden="true"><i id="relleno"></i></div>
  </div>
  <button type="button" class="siguiente" id="btnSiguiente">Siguiente →</button>
</footer>

<div class="panel" id="panelLista" role="dialog" aria-modal="true" aria-labelledby="tituloLista">
  <div class="caja">
    <div class="arriba">
      <h2 id="tituloLista">Todas las prácticas</h2>
      <button type="button" data-cerrar>Cerrar</button>
    </div>
    <div class="indice" id="indice"></div>
  </div>
</div>

<div class="panel" id="panelAtajos" role="dialog" aria-modal="true" aria-labelledby="tituloAtajos">
  <div class="caja">
    <div class="arriba">
      <h2 id="tituloAtajos">Atajos esenciales</h2>
      <button type="button" data-cerrar>Cerrar</button>
    </div>
    <table id="tablaAtajos">
      <thead><tr><th>Acción</th><th>Atajo</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="nota">{Ctrl}+{E} selecciona todo en muchas aplicaciones de Windows en español, como Word. En el navegador se usa {Ctrl}+{A}.</p>
  </div>
</div>

<script>
/* Cada práctica: t = título, o = objetivo, p = pasos, f = «Fíjate».
   Las teclas se escriben entre llaves: {Ctrl}+{C} */
const PRACTICAS = [
  { t: 'Prepara tu documento',
    o: 'Abre un documento en blanco de Word y escribe tres frases. Las usarás en las prácticas siguientes.',
    p: [
      'Abre Word desde el menú Inicio y elige «Documento en blanco».',
      'Escribe «Me llamo» seguido de tu nombre y un punto. Pulsa {Intro}.',
      'Escribe «Vivo en Valladolid.» y pulsa {Intro}.',
      'Escribe «Me gusta aprender cosas nuevas.»'
    ],
    f: 'Si te equivocas al escribir, borra con {Retroceso}. No hace falta que quede perfecto.' },

  { t: 'Selecciona de cinco maneras',
    o: 'Antes de copiar hay que seleccionar bien. Después de cada intento, haz clic en una zona vacía para quitar el resaltado.',
    p: [
      'Haz doble clic sobre la palabra «Valladolid».',
      'Haz triple clic dentro de la frase «Me gusta aprender cosas nuevas.»',
      'Mantén pulsado el botón izquierdo y arrastra sobre las palabras «Me llamo».',
      'Haz clic justo delante de «Vivo», mantén pulsada {Mayús} y pulsa {→} cuatro veces.',
      'Pulsa {Ctrl}+{E} para seleccionar todo el documento.'
    ],
    f: 'El texto seleccionado aparece resaltado. Comprueba que está seleccionado exactamente lo que querías, ni más ni menos.' },

  { t: 'Copia y pega con el teclado',
    o: 'Duplica la frase «Vivo en Valladolid.» hasta tener tres copias nuevas.',
    p: [
      'Selecciona la frase «Vivo en Valladolid.» con un triple clic.',
      'Pulsa {Ctrl}+{C} para copiarla. No verás ningún cambio.',
      'Haz clic al final de la última línea y pulsa {Intro}.',
      'Pulsa {Ctrl}+{V}. La frase aparece en la línea nueva.',
      'Pulsa {Intro} y {Ctrl}+{V} dos veces más.'
    ],
    f: 'Puedes pegar todas las veces que quieras sin volver a copiar.' },

  { t: 'Mueve una frase con cortar',
    o: 'Lleva la frase «Me llamo…» del principio al final del documento.',
    p: [
      'Selecciona entera la primera frase.',
      'Pulsa {Ctrl}+{X}. La frase desaparece, pero queda guardada.',
      'Haz clic al final de la última línea y pulsa {Intro}.',
      'Pulsa {Ctrl}+{V}. La frase aparece en su nuevo sitio.'
    ],
    f: 'Copiar duplica el texto; cortar lo traslada. La rayita parpadeante indica dónde aparecerá al pegar.' },

  { t: 'Deshaz un error',
    o: 'Borra todo a propósito y recupéralo.',
    p: [
      'Pulsa {Ctrl}+{E} para seleccionar todo el documento.',
      'Pulsa {Supr}. El documento se queda en blanco.',
      'Pulsa {Ctrl}+{Z}. Todo vuelve a aparecer.',
      'Pulsa {Ctrl}+{Z} una vez más y fíjate en qué cambia.'
    ],
    f: '{Ctrl}+{Z} deshace la última acción. Es tu salvavidas cuando algo sale mal.' },

  { t: 'Copia y pega con el ratón',
    o: 'Ahora sin teclado: copia «Me gusta aprender cosas nuevas.» con el botón derecho.',
    p: [
      'Selecciona la frase arrastrando el ratón desde el principio hasta el final.',
      'Haz clic derecho sobre la selección y elige «Copiar».',
      'Haz clic al final del documento y pulsa {Intro}.',
      'Haz clic derecho. En «Opciones de pegado», pulsa el primer icono.'
    ],
    f: 'En Word, el botón derecho muestra iconos para pegar. Si dejas el ratón quieto encima de uno, aparece su nombre.' },

  { t: 'Usa los botones de Word',
    o: 'Copia una palabra con los botones de la pestaña Inicio.',
    p: [
      'Haz doble clic sobre la palabra «aprender».',
      'En la pestaña «Inicio», arriba a la izquierda, pulsa el botón «Copiar».',
      'Haz clic al final del documento y pulsa {Intro}.',
      'Pulsa el botón grande «Pegar», en la misma zona.'
    ],
    f: 'Ya conoces tres caminos para lo mismo: teclado, botón derecho y botones. Usa el que te resulte más cómodo.' },

  { t: 'Copia un párrafo de Wikipedia',
    o: 'Lleva a tu documento de Word el primer párrafo del artículo «Valladolid».',
    p: [
      'Abre el navegador, escribe «wikipedia valladolid» en la barra de arriba y pulsa {Intro}.',
      'Entra en el artículo de Wikipedia sobre Valladolid.',
      'Arrastra el ratón desde la primera palabra del primer párrafo hasta su punto final.',
      'Pulsa {Ctrl}+{C}.',
      'Pasa a Word haciendo clic en su icono de la barra de tareas.',
      'Haz clic al final, pulsa {Intro} y luego {Ctrl}+{V}.'
    ],
    f: 'Comprueba que no has arrastrado de más: ni el título, ni la imagen, ni el principio del párrafo siguiente.' },

  { t: 'Pega solo el texto',
    o: 'Pega otra vez el mismo párrafo, ahora sin el aspecto de la web, y compara los dos.',
    p: [
      'En Word, pulsa {Intro} para empezar una línea nueva.',
      'Pulsa {Ctrl}+{V}.',
      'Junto al texto pegado aparece un pequeño icono con la palabra «Ctrl». Haz clic en él.',
      'Elige «Mantener solo texto», el icono con una letra A.',
      'Compara los dos párrafos: tipo de letra, tamaño, color y palabras en azul.'
    ],
    f: '«Mantener solo texto» pega el contenido sin el formato original. Suele ser la opción más limpia.' },

  { t: 'Anota de dónde viene el texto',
    o: 'Copia la dirección de la página de Wikipedia y pégala debajo del párrafo.',
    p: [
      'Busca en el párrafo números entre corchetes, como [1]. Son referencias a las fuentes.',
      'Vuelve al navegador y haz clic en la barra de direcciones: la dirección queda seleccionada.',
      'Pulsa {Ctrl}+{C}.',
      'En Word, pulsa {Intro} al final, escribe «Fuente: » y pulsa {Ctrl}+{V}.'
    ],
    f: 'Si borras los [1], quitas también la pista para localizar las fuentes. Al compartir un texto, indica siempre de dónde procede.' },

  { t: 'Copia una imagen a Word',
    o: 'Pega en tu documento una foto del artículo de Valladolid.',
    p: [
      'En Wikipedia, haz clic derecho sobre una foto de la ciudad.',
      'Elige «Copiar imagen».',
      'Pasa a Word, haz clic al final y pulsa {Intro}.',
      'Pulsa {Ctrl}+{V}.'
    ],
    f: 'Si la foto sale muy grande, haz clic sobre ella y arrastra una esquina hacia dentro para reducirla.' },

  { t: 'Guarda una imagen en el ordenador',
    o: 'Guarda otra foto del artículo como archivo en la carpeta Imágenes.',
    p: [
      'Haz clic derecho sobre otra foto del artículo.',
      'Elige «Guardar imagen como…».',
      'En la ventana que se abre, elige la carpeta «Imágenes» en la columna de la izquierda.',
      'En «Nombre», escribe valladolid y pulsa «Guardar».',
      'Abre el Explorador de archivos con {Win}+{E}, entra en «Imágenes» y busca la foto.'
    ],
    f: 'Una imagen guardada es un archivo normal: puedes copiarla o moverla como cualquier otro archivo.' },

  { t: 'Seleccionar todo: Word y navegador',
    o: 'Comprueba que el atajo para seleccionar todo cambia según el programa.',
    p: [
      'En Word, pulsa {Ctrl}+{E}. Se selecciona todo el documento.',
      'Haz clic en el texto para quitar la selección.',
      'En Wikipedia, haz clic sobre el texto del artículo y pulsa {Ctrl}+{A}. Se selecciona toda la página.',
      'Haz clic para quitar la selección y prueba ahora {Ctrl}+{E} en el navegador. ¿Qué ocurre?'
    ],
    f: 'En Word en español se usa {Ctrl}+{E}; en el navegador, {Ctrl}+{A}. Algunos programas usan atajos distintos.' },

  { t: 'Reto final: tu propia ficha',
    o: 'Sin mirar las prácticas anteriores, prepara una ficha sobre otro tema en un documento nuevo.',
    p: [
      'En Word, abre un documento nuevo desde «Archivo» › «Nuevo» › «Documento en blanco».',
      'Busca en Wikipedia tu pueblo o un tema que te guste.',
      'Copia el título del artículo y pégalo arriba.',
      'Copia el primer párrafo y pégalo con «Mantener solo texto».',
      'Copia una foto y pégala debajo.',
      'Escribe «Fuente: » y pega la dirección de la página.'
    ],
    f: 'Si te atascas, pulsa «Ver todas» y vuelve a la práctica que necesites.' }
];

const ATAJOS = [
  ['Copiar', '{Ctrl}+{C}'],
  ['Cortar', '{Ctrl}+{X}'],
  ['Pegar', '{Ctrl}+{V}'],
  ['Deshacer', '{Ctrl}+{Z}'],
  ['Seleccionar todo en un documento', '{Ctrl}+{E}'],
  ['Seleccionar todo en una página web', '{Ctrl}+{A}']
];

const $ = id => document.getElementById(id);
const CLAVE = 'practicas-copiar-pegar';

function esc(t) {
  return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function teclas(t) {
  return esc(t)
    .replace(/\}\+\{/g, '}<span class="mas">+</span>{')
    .replace(/\{([^}]+)\}/g, '<kbd>$1</kbd>');
}

let actual = 0;
let escala = 1;
try {
  const g = JSON.parse(localStorage.getItem(CLAVE)) || {};
  if (Number.isInteger(g.actual) && g.actual >= 0 && g.actual < PRACTICAS.length) actual = g.actual;
  if (typeof g.escala === 'number') escala = g.escala;
} catch (e) {}

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify({ actual, escala })); } catch (e) {}
}

function pintar() {
  const x = PRACTICAS[actual];
  const art = $('practica');
  art.classList.remove('entra');
  void art.offsetWidth;
  art.classList.add('entra');
  art.innerHTML =
    '<div class="cabeza"><span class="numero">' + (actual + 1) + '</span><div>' +
    '<h2>' + teclas(x.t) + '</h2><p class="objetivo">' + teclas(x.o) + '</p></div></div>' +
    '<ol class="pasos">' + x.p.map(s => '<li>' + teclas(s) + '</li>').join('') + '</ol>' +
    '<p class="fijate"><b>💡 Fíjate:</b> ' + teclas(x.f) + '</p>';
  $('contador').textContent = 'Práctica ' + (actual + 1) + ' de ' + PRACTICAS.length;
  $('relleno').style.width = ((actual + 1) / PRACTICAS.length * 100) + '%';
  $('btnAnterior').disabled = actual === 0;
  $('btnSiguiente').disabled = actual === PRACTICAS.length - 1;
  document.title = (actual + 1) + '. ' + x.t + ' · Prácticas en clase';
  $('principal').scrollTop = 0;
  guardar();
}

function ir(i) {
  actual = Math.max(0, Math.min(PRACTICAS.length - 1, i));
  pintar();
}

function aplicarEscala() {
  document.documentElement.style.setProperty('--escala', escala);
  guardar();
}

/* Paneles */
function abrir(id) {
  if (id === 'panelLista') {
    $('indice').innerHTML = PRACTICAS.map((x, i) =>
      '<button type="button" data-ir="' + i + '"' + (i === actual ? ' class="actual"' : '') +
      '><b>' + (i + 1) + '</b><span>' + esc(x.t) + '</span></button>').join('');
  }
  $(id).classList.add('abierto');
  $(id).querySelector('button').focus();
}
function cerrar() {
  document.querySelectorAll('.panel.abierto').forEach(p => p.classList.remove('abierto'));
}

$('tablaAtajos').querySelector('tbody').innerHTML =
  ATAJOS.map(a => '<tr><td>' + esc(a[0]) + '</td><td>' + teclas(a[1]) + '</td></tr>').join('');
document.querySelector('#panelAtajos .nota').innerHTML =
  teclas(document.querySelector('#panelAtajos .nota').textContent);

$('btnAnterior').onclick = () => ir(actual - 1);
$('btnSiguiente').onclick = () => ir(actual + 1);
$('btnLista').onclick = () => abrir('panelLista');
$('btnAtajos').onclick = () => abrir('panelAtajos');
$('btnMas').onclick = () => { escala = Math.min(1.6, +(escala + 0.1).toFixed(1)); aplicarEscala(); };
$('btnMenos').onclick = () => { escala = Math.max(0.7, +(escala - 0.1).toFixed(1)); aplicarEscala(); };
$('btnPantalla').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  $('btnPantalla').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
});

document.querySelectorAll('.panel').forEach(p => {
  p.addEventListener('click', e => {
    if (e.target === p || e.target.hasAttribute('data-cerrar')) cerrar();
    const b = e.target.closest('[data-ir]');
    if (b) { ir(+b.dataset.ir); cerrar(); }
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrar(); return; }
  if (document.querySelector('.panel.abierto')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); ir(actual + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); ir(actual - 1); }
});

aplicarEscala();
pintar();
</script>
</body>
</html>

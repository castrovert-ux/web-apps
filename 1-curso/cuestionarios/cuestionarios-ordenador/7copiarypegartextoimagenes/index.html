<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Copiar y Pegar Texto e Imágenes</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Todo el tamaño se calcula a partir de la ventana: el cuestionario siempre cabe, sin Ctrl - */
  html { height: 100%; font-size: calc(clamp(13px, min(2.3vh, 2.8vw), 24px) * var(--k, 1)); }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    height: 100%; overflow: hidden;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container {
    position: relative; z-index: 1; max-width: 50rem; margin: 0 auto; padding: 1rem 1.2rem;
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 0.8rem;
  }

  .header { text-align: center; flex: 0 0 auto; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.12rem;
    text-transform: uppercase; padding: 0.35rem 1.1rem; border-radius: 100px; margin-bottom: 0.4rem;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: 1.9rem; line-height: 1.2; padding-bottom: 0.1rem;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  #quiz-area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 0.8rem; }

  .progress-wrap { flex: 0 0 auto; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 700; color: var(--sub); margin-bottom: 0.35rem; }
  .progress-bar { height: 0.5rem; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }

  .question-card {
    flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 1.4rem; padding: 1.4rem 1.6rem;
    animation: fadeIn 0.35s ease;
  }

  .q-type-badge {
    display: inline-flex; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
    padding: 0.25rem 0.8rem; border-radius: 100px; margin-bottom: 0.7rem;
    background: rgba(33,115,70,0.2); color: #4ade80;
  }

  .q-number { font-size: 0.85rem; color: var(--sub); font-weight: 700; margin-bottom: 0.3rem; }
  .q-text { font-size: 1.3rem; font-weight: 700; line-height: 1.4; margin-bottom: 0.9rem; }

  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 0.9rem; padding: 0.65rem 1rem; color: var(--text);
    font-family: inherit; font-size: 1.05rem; font-weight: 600; line-height: 1.3; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 0.8rem; transition: 0.2s;
  }
  .option-btn:hover:not(:disabled) { background: rgba(33,115,70,0.15); border-color: var(--c1); transform: translateX(4px); }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    width: 2rem; height: 2rem; border-radius: 0.5rem; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
  }

  .option-btn.correct { background: rgba(33,115,70,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }

  .feedback { display: none; margin-top: 0.9rem; padding: 0.8rem 1rem; border-radius: 0.8rem; font-size: 1rem; font-weight: 700; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.correct-fb { display: block; background: rgba(33,115,70,0.2); color: var(--c5); border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* El botón ocupa siempre su sitio (solo se oculta), así nada salta ni se desplaza */
  .btn-next {
    flex: 0 0 auto; visibility: hidden; width: 100%; max-width: 14rem; margin: 0 0 0 auto;
    padding: 0.75rem; border-radius: 0.9rem; border: none; font-size: 1rem; font-weight: 800; font-family: inherit;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
    transition: 0.2s;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.25); }

  .results {
    display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .result-emoji { font-size: 3.5rem; line-height: 1.1; }
  .results h2 { font-size: 1.6rem; }
  .score-circle {
    width: 8rem; height: 8rem; border-radius: 50%; border: 0.5rem solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 0.8rem auto;
    font-size: 1.9rem; font-family: 'Fredoka One'; flex-direction: column; line-height: 1.1;
  }
  .score-circle small { font-family: 'Nunito'; font-size: 0.85rem; color: var(--sub); font-weight: 700; }
  .hidden { display: none !important; }

  .result-sub { color: var(--sub); font-size: 1rem; font-weight: 700; margin-top: 0.4rem; }
  .btn-restart { margin-top: 1.2rem; cursor: pointer; border: none; font-family: inherit; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge">✂️ Curso de Ordenador</div>
    <h1>Copiar y Pegar Texto e Imágenes</h1>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge" id="q-type">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="score-circle" id="score-num">0/10</div>
    <h2 id="result-msg"></h2>
    <p class="result-sub" id="result-sub"></p>
    <button class="badge btn-restart" onclick="restartQuiz()">🔄 Reiniciar Quiz</button>
  </div>
</div>

<script>
const questions = [
  {
    "q": "¿Cómo se selecciona una palabra con el ratón en un documento?",
    "options": [
      "Haciendo clic derecho sobre ella",
      "Haciendo un doble clic sobre ella",
      "Arrastrando el ratón sobre ella"
    ],
    "correct": 1,
    "expl": "Un doble clic rápido sobre una palabra la selecciona fácilmente."
  },
  {
    "q": "Después de copiar un texto, solo puedes pegarlo una vez.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. Una vez que has copiado un texto, puedes pegarlo varias veces en diferentes lugares sin necesidad de volver a copiarlo."
  },
  {
    "q": "Si quieres mover un texto de un sitio a otro sin dejar una copia en el lugar original, ¿qué atajo de teclado usarías antes de pegar?",
    "options": [
      "Ctrl + C (Copiar)",
      "Ctrl + X (Cortar)",
      "Ctrl + V (Pegar)"
    ],
    "correct": 1,
    "expl": "Ctrl + X sirve para 'Cortar' el texto, lo cual lo elimina de su ubicación original y lo prepara para ser pegado en otro lugar."
  },
  {
    "q": "Cuando copias texto de una página web y lo quieres pegar en Word, ¿qué paso necesitas hacer entre copiar y pegar?",
    "options": [
      "Reiniciar el ordenador",
      "Cerrar el navegador",
      "Cambiar a la ventana de Word"
    ],
    "correct": 2,
    "expl": "Después de copiar el texto en la página web, debes ir a la ventana de Word para poder pegar el texto allí."
  },
  {
    "q": "¿Qué opción de pegado te permite insertar el texto sin el tipo de letra o los colores originales, obteniendo la versión más 'limpia'?",
    "options": [
      "Mantener el formato de origen",
      "Combinar formato",
      "Mantener solo texto"
    ],
    "correct": 2,
    "expl": "La opción 'Mantener solo texto' pega el contenido sin el formato original, lo que suele ser la opción más limpia y sencilla."
  },
  {
    "q": "¿Qué atajo de teclado te permite seleccionar todo el texto de un documento en programas como Word?",
    "options": [
      "Ctrl + S",
      "Ctrl + E",
      "Ctrl + T"
    ],
    "correct": 1,
    "expl": "En muchos programas de Windows, como Word, el atajo Ctrl + E selecciona todo el contenido del documento."
  },
  {
    "q": "Si ves un número entre corchetes, como [1], al copiar de Wikipedia, es un error y debes eliminarlo siempre.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. Los números entre corchetes como [1] en Wikipedia son referencias a las fuentes de información y forman parte del contenido original."
  },
  {
    "q": "Si quieres guardar una imagen de internet en tu ordenador para usarla más tarde, ¿cuál es el primer paso con el ratón?",
    "options": [
      "Hacer clic izquierdo sobre la imagen",
      "Hacer clic derecho sobre la imagen",
      "Arrastrar la imagen al escritorio"
    ],
    "correct": 1,
    "expl": "Para guardar una imagen de internet, primero debes hacer clic derecho sobre ella para ver el menú de opciones, que incluye 'Guardar imagen como...'."
  },
  {
    "q": "¿Para qué sirve el atajo de teclado Ctrl + Z?",
    "options": [
      "Para guardar el documento",
      "Para cerrar el programa",
      "Para deshacer la última acción"
    ],
    "correct": 2,
    "expl": "Ctrl + Z es un atajo muy útil para 'Deshacer' la última acción que realizaste, por si te equivocas."
  },
  {
    "q": "Cuando guardas una imagen de internet en tu ordenador, se convierte en un archivo que puedes mover o copiar como cualquier otro.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 0,
    "type": "boolean",
    "expl": "Verdadero. Una vez guardada, la imagen es un archivo normal en la carpeta que elijas y puedes gestionarla igual que cualquier otro documento o foto."
  }
];

let currentIdx = 0;
let score = 0;
let answered = false;
const TOTAL = questions.length;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];

  document.getElementById('q-type').textContent =
    qData.type === 'boolean' ? '✅ Verdadero o Falso' : '🎯 Opción múltiple';
  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.visibility = 'hidden';

  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';

  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  const pct = (currentIdx / TOTAL) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${TOTAL}`;
  document.getElementById('btn-next').textContent =
    currentIdx === TOTAL - 1 ? 'Ver resultados 🏁' : 'Siguiente →';
  fit(true);
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('q-feedback');

  btns.forEach(b => b.disabled = true);

  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>🎉 ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = 'feedback correct-fb';
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota:</strong><br>${qData.expl}`;
    fb.className = 'feedback wrong-fb';
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.visibility = 'visible';
  fit(false);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < TOTAL) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.documentElement.style.setProperty('--k', 1);
  document.getElementById('results').style.display = 'flex';

  const pct = Math.round((score / TOTAL) * 100);
  document.getElementById('score-num').innerHTML = `${score}/${TOTAL}<small>${pct}%</small>`;

  let emoji, msg, sub;
  if (pct === 100)    { emoji = '🏆'; msg = "¡Perfecto! Dominas el arte de copiar y pegar.";  sub = 'Respondiste todo correctamente.'; }
  else if (pct >= 80) { emoji = '🌟'; msg = '¡Excelente, sigue así!';       sub = 'Solo te faltaron unos detalles.'; }
  else if (pct >= 60) { emoji = '👍'; msg = '¡Buen trabajo!';               sub = 'Vas por buen camino, repasa lo fallado.'; }
  else if (pct >= 40) { emoji = '📚'; msg = 'Repasa un poco más';           sub = 'Vuelve a leer el material y reinténtalo.'; }
  else                { emoji = '💪'; msg = '¡No te rindas!';               sub = 'Revisa el tema desde el principio.'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('prog-fill').style.width = '100%';
}

function restartQuiz() {
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('prog-score').textContent = '⭐ 0 pts';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-area').classList.remove('hidden');
  loadQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Ajusta el tamaño del texto para que la pregunta, las opciones y la explicación quepan sin desplazarse
function fit(reset) {
  const root = document.documentElement;
  const card = document.querySelector('.question-card');
  if (!card.clientHeight) return;
  let k = reset ? 1 : (parseFloat(root.style.getPropertyValue('--k')) || 1);
  root.style.setProperty('--k', k);
  while (k > 0.55 && card.scrollHeight > card.clientHeight + 1) {
    k = Math.round((k - 0.04) * 100) / 100;
    root.style.setProperty('--k', k);
  }
}
window.addEventListener('resize', () => fit(!answered));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(!answered));

window.onload = loadQuestion;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Aprende Word</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #FF6B6B;
    --c2: #FFE66D;
    --c3: #4ECDC4;
    --c4: #A78BFA;
    --c5: #F97316;
    --bg: #0F0E17;
    --card: #1A1A2E;
    --text: #FFFFFE;
    --sub: #a7a9be;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background blobs */
  .bg-blobs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    animation: float 12s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 500px; height: 500px; background: var(--c1); top: -100px; left: -100px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c3); bottom: -80px; right: -80px; animation-delay: -4s; }
  .blob:nth-child(3) { width: 300px; height: 300px; background: var(--c4); top: 40%; left: 50%; animation-delay: -8s; }

  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(30px, 20px) scale(1.08); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 750px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: slideDown 0.7s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c3), var(--c4));
    color: #0F0E17;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem);
    line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .subtitle {
    color: var(--sub);
    font-size: 1rem;
    font-weight: 600;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 30px;
    animation: fadeIn 0.5s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c3), var(--c4));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px;
    padding: 36px;
    margin-bottom: 24px;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  .type-mc   { background: rgba(78,205,196,0.15); color: var(--c3); }
  .type-tf   { background: rgba(167,139,250,0.15); color: var(--c4); }
  .type-open { background: rgba(255,107,107,0.15); color: var(--c1); }

  .q-number {
    font-size: 0.8rem;
    color: var(--sub);
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .q-text {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.5;
    color: var(--text);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .option-btn {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 20px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(78,205,196,0.1);
    border-color: var(--c3);
    transform: translateX(6px);
  }
  .option-letter {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .option-btn.correct {
    background: rgba(78,205,196,0.15);
    border-color: var(--c3);
  }
  .option-btn.correct .option-letter { background: var(--c3); color: #0F0E17; }
  .option-btn.wrong {
    background: rgba(255,107,107,0.12);
    border-color: var(--c1);
  }
  .option-btn.wrong .option-letter { background: var(--c1); color: #fff; }
  .option-btn:disabled { cursor: default; }

  /* Open answer */
  .open-area textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    resize: vertical;
    min-height: 110px;
    margin-top: 20px;
    transition: border-color 0.2s;
  }
  .open-area textarea:focus {
    outline: none;
    border-color: var(--c4);
  }
  .open-area textarea::placeholder { color: rgba(255,255,255,0.3); }

  /* Feedback */
  .feedback {
    display: none;
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .feedback.correct-fb {
    display: flex;
    background: rgba(78,205,196,0.12);
    border: 1px solid rgba(78,205,196,0.3);
    color: var(--c3);
  }
  .feedback.wrong-fb {
    display: flex;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    color: var(--c1);
  }
  .feedback.info-fb {
    display: flex;
    background: rgba(167,139,250,0.1);
    border: 1px solid rgba(167,139,250,0.3);
    color: var(--c4);
  }

  /* Buttons */
  .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
  .btn-submit, .btn-next {
    padding: 14px 32px;
    border-radius: 14px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-submit {
    background: linear-gradient(135deg, var(--c4), var(--c3));
    color: #0F0E17;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(78,205,196,0.4); }
  .btn-next {
    background: linear-gradient(135deg, var(--c5), var(--c1));
    color: #fff;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(249,115,22,0.4); }

  /* Results screen */
  .results {
    display: none;
    text-align: center;
    animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .results.show { display: block; }
  .trophy {
    font-size: 5rem;
    margin-bottom: 16px;
    animation: bounce 1s ease infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-12px) rotate(5deg); }
  }
  .score-circle {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--c3) 0%, var(--c4) var(--pct, 100%), rgba(255,255,255,0.05) var(--pct,100%));
    display: flex; align-items: center; justify-content: center;
    margin: 24px auto;
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: var(--bg);
  }
  .score-number {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    color: var(--text);
    position: relative; z-index: 1;
  }
  .result-msg {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-sub { color: var(--sub); font-size: 0.95rem; margin-bottom: 30px; }
  .btn-restart {
    padding: 16px 40px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--c2), var(--c5));
    color: #0F0E17;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-restart:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(255,230,109,0.4); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="container">

  <div class="header">
    <div class="badge">📝 Microsoft Word</div>
    <h1>¡Quiz de Práctica!</h1>
    <p class="subtitle">Pon a prueba lo que aprendiste hoy</p>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 5</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div class="question-card" id="q-card">
      <div class="q-type-badge" id="q-type-badge"></div>
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-body"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>

    <div class="btn-row">
      <button class="btn-submit hidden" id="btn-submit" onclick="submitOpen()">Comprobar ✔</button>
      <button class="btn-next hidden" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="trophy" id="trophy">🏆</div>
    <div class="score-circle" id="score-circle">
      <span class="score-number" id="score-num">0/5</span>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-sub" id="result-sub"></div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Volver a intentarlo</button>
  </div>

</div>

<script>
const questions = [
  {
    type: "mc",
    text: "¿Dónde se encuentra la opción para crear un índice automático en Microsoft Word?",
    options: [
      "Pestaña Insertar",
      "Pestaña Referencias",
      "Pestaña Vista",
      "Pestaña Diseño"
    ],
    correct: 1,
    explanation: "¡Correcto! La Tabla de Contenido (índice automático) se encuentra en la pestaña Referencias."
  },
  {
    type: "tf",
    text: "Para que el índice automático funcione correctamente, primero debes aplicar los estilos de Título a los apartados del documento.",
    options: ["✅ Verdadero", "❌ Falso"],
    correct: 0,
    explanation: "¡Exacto! Word genera el índice usando los títulos a los que se les ha aplicado el estilo Título 1, Título 2, etc."
  },
  {
    type: "mc",
    text: "¿Cuál de estas acciones permite mover con mayor libertad una imagen dentro del documento?",
    options: [
      "Hacer doble clic en la imagen",
      "Usar Ajustar texto → Cuadrado",
      "Guardar la imagen en otra carpeta",
      "Cambiar el color de la imagen"
    ],
    correct: 1,
    explanation: "¡Bien! Al aplicar Ajustar texto → Cuadrado, la imagen deja de estar en línea con el texto y se puede mover libremente."
  },
  {
    type: "open",
    text: "Explica con tus propias palabras: ¿para qué sirve el encabezado en un documento de Word y cómo se inserta?",
    keywords: ["insertar", "encabezado", "página", "nombre", "todas"],
    explanation: "El encabezado es un texto que aparece en la parte superior de todas las páginas. Se inserta desde Insertar → Encabezado."
  },
  {
    type: "tf",
    text: "El cuadro de texto insertado desde la pestaña Insertar solo puede contener texto, no puede moverse con el ratón.",
    options: ["✅ Verdadero", "❌ Falso"],
    correct: 1,
    explanation: "¡Correcto! Eso es Falso. El cuadro de texto SÍ se puede mover con el ratón arrastrándolo a cualquier parte del documento."
  }
];

let current = 0;
let score = 0;
let answered = false;

const typeLabels = {
  mc: { label: "🎯 Opción múltiple", cls: "type-mc" },
  tf: { label: "⚖️ Verdadero / Falso", cls: "type-tf" },
  open: { label: "✍️ Respuesta abierta", cls: "type-open" }
};

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const pct = (current / questions.length) * 100;

  document.getElementById('prog-label').textContent = `Pregunta ${current+1} de ${questions.length}`;
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('prog-fill').style.width = pct + '%';

  const badge = document.getElementById('q-type-badge');
  badge.textContent = typeLabels[q.type].label;
  badge.className = 'q-type-badge ' + typeLabels[q.type].cls;

  document.getElementById('q-number').textContent = `Pregunta ${current+1}`;
  document.getElementById('q-text').textContent = q.text;

  const body = document.getElementById('q-body');
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  document.getElementById('btn-submit').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');

  // Animate card
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = 'popIn 0.5s cubic-bezier(.34,1.56,.64,1)';

  if (q.type === 'mc' || q.type === 'tf') {
    body.innerHTML = `<div class="options">${
      q.options.map((opt, i) => {
        const letters = ['A','B','C','D'];
        return `<button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
          <span class="option-letter">${q.type === 'tf' ? (i===0?'V':'F') : letters[i]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')
    }</div>`;
  } else {
    body.innerHTML = `<div class="open-area">
      <textarea id="open-ans" placeholder="Escribe tu respuesta aquí..."></textarea>
    </div>`;
    document.getElementById('btn-submit').classList.remove('hidden');
  }
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const fb = document.getElementById('q-feedback');

  // Disable all buttons
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
  });

  const chosen = document.getElementById(`opt-${idx}`);
  const correct = document.getElementById(`opt-${q.correct}`);

  if (idx === q.correct) {
    chosen.classList.add('correct');
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ' + q.explanation;
  } else {
    chosen.classList.add('wrong');
    correct.classList.add('correct');
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '💡 ' + q.explanation;
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function submitOpen() {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const ans = document.getElementById('open-ans').value.trim().toLowerCase();
  const fb = document.getElementById('q-feedback');

  document.getElementById('open-ans').disabled = true;
  document.getElementById('btn-submit').classList.add('hidden');

  const hits = q.keywords.filter(k => ans.includes(k)).length;

  if (ans.length < 15) {
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '✍️ Tu respuesta es muy corta. Intenta explicar más. ' + q.explanation;
  } else if (hits >= 2) {
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ¡Muy bien! ' + q.explanation;
  } else {
    fb.className = 'feedback info-fb';
    fb.innerHTML = '💡 Respuesta registrada. ' + q.explanation;
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  const res = document.getElementById('results');
  res.classList.add('show');

  const pct = Math.round((score / questions.length) * 100);
  const circle = document.getElementById('score-circle');
  circle.style.setProperty('--pct', pct + '%');
  document.getElementById('score-num').textContent = `${score}/${questions.length}`;

  const msgs = [
    { min: 0,  max: 1, emoji: '📖', msg: '¡Sigue practicando!', sub: 'Repasa los pasos del documento e inténtalo de nuevo.' },
    { min: 2,  max: 3, emoji: '👍', msg: '¡Buen intento!',       sub: 'Ya tienes las bases. Un poco más de repaso y lo dominarás.' },
    { min: 4,  max: 4, emoji: '🌟', msg: '¡Muy bien hecho!',     sub: 'Casi perfecto. Revisa la pregunta que fallaste.' },
    { min: 5,  max: 5, emoji: '🏆', msg: '¡Perfecto! ¡Genial!',  sub: 'Has respondido todo correctamente. ¡Eres un experto en Word!' },
  ];
  const m = msgs.find(x => score >= x.min && score <= x.max);
  document.getElementById('trophy').textContent = m.emoji;
  document.getElementById('result-msg').textContent = m.msg;
  document.getElementById('result-sub').textContent = m.sub;
}

function restartQuiz() {
  current = 0; score = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').classList.remove('hidden');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>

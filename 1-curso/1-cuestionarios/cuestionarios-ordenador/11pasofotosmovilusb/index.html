<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Pasar Fotos del Móvil al Ordenador y Pendrive</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: calc(16px * var(--k, 1)); }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container { 
    position: relative; z-index: 1; 
    width: 100%; max-width: 800px; 
    height: 100vh; max-height: 100vh; 
    display: flex; flex-direction: column; 
    padding: 2vh 20px; 
  }

  .header { text-align: center; margin-bottom: 2vh; flex-shrink: 0; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: clamp(0.7rem, 1.5vh, 0.8rem); letter-spacing: 2px;
    text-transform: uppercase; padding: 0.6vh 12px; border-radius: 100px; margin-bottom: 1vh;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: clamp(1.35rem, 3.8vh, 2.05rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5vh;
  }

  #quiz-area { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .progress-wrap { margin-bottom: 2vh; flex-shrink: 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }

  .question-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px; padding: 3vh; margin-bottom: 2vh;
    animation: fadeIn 0.35s ease;
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }

  .q-type-badge {
    display: inline-flex; font-size: clamp(0.65rem, 1.2vh, 0.75rem); font-weight: 800; text-transform: uppercase;
    padding: 4px 12px; border-radius: 100px; margin-bottom: 1vh;
    background: rgba(33,115,70,0.2); color: #4ade80; flex-shrink: 0; align-self: flex-start;
  }

  .q-number { font-size: clamp(0.75rem, 1.5vh, 0.85rem); color: var(--sub); font-weight: 700; margin-bottom: 0.5vh; flex-shrink: 0; }
  .q-text { font-size: clamp(1rem, 2.2vh, 1.2rem); font-weight: 700; line-height: 1.3; margin-bottom: 2vh; flex-shrink: 0; }

  .options { 
    display: flex; flex-direction: column; gap: 1vh; 
    overflow-y: auto; flex: 1; padding-right: 10px; 
  }
  
  .options::-webkit-scrollbar { width: 6px; }
  .options::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
  .options::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  .options::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 1.5vh 15px; color: var(--text);
    font-size: clamp(0.9rem, 2vh, 1rem); font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: 0.2s; flex-shrink: 0;
  }
  .option-btn:hover:not(:disabled) { background: rgba(33,115,70,0.15); border-color: var(--c1); transform: translateX(5px); }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; flex-shrink: 0;
  }

  .option-btn.correct { background: rgba(33,115,70,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }

  .feedback { display: none; margin-top: 1.5vh; padding: 1.5vh; border-radius: 12px; font-weight: 700; font-size: clamp(0.85rem, 1.8vh, 0.95rem); line-height: 1.4; animation: fadeIn 0.3s ease; flex-shrink: 0; }
  .feedback.correct-fb { display: block; background: rgba(33,115,70,0.2); color: var(--c5); border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .btn-next {
    display: none; width: 100%; max-width: 220px; margin: 0 0 0 auto;
    padding: 1.5vh; border-radius: 12px; border: none; font-weight: 800; font-family: inherit;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
    transition: 0.2s; flex-shrink: 0; font-size: clamp(0.9rem, 2vh, 1rem);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.25); }

  .results { display: none; text-align: center; animation: fadeIn 0.4s ease; flex-direction: column; justify-content: center; align-items: center; flex: 1; }
  .score-circle {
    width: clamp(110px, 20vh, 150px); height: clamp(110px, 20vh, 150px); border-radius: 50%; border: 8px solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 2vh auto;
    font-size: clamp(1.8rem, 4vh, 2.2rem); font-family: 'Fredoka One'; flex-direction: column; line-height: 1.1;
  }
  .score-circle small { font-family: 'Nunito'; font-size: clamp(0.7rem, 1.5vh, 0.9rem); color: var(--sub); font-weight: 700; }
  .hidden { display: none !important; }

  .result-sub { color: var(--sub); font-weight: 700; margin-top: 1vh; font-size: clamp(0.85rem, 1.8vh, 1rem); }
  .btn-restart { margin-top: 3vh; cursor: pointer; border: none; font-family: inherit; font-size: clamp(0.9rem, 2vh, 1rem); padding: 1.5vh 20px; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge" id="quiz-badge">💻 Curso de Ordenador · Cuestionario</div>
    <h1 id="quiz-title">Pasar Fotos del Móvil al Ordenador y Pendrive</h1>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge" id="q-type">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div style="font-size: 4rem;" id="result-emoji">🏆</div>
    <div class="score-circle" id="score-num">0/10</div>
    <h2 id="result-msg"></h2>
    <p class="result-sub" id="result-sub"></p>
    <button class="badge btn-restart" onclick="restartQuiz()">🔄 Reiniciar Cuestionario</button>
  </div>
</div>

<script>
// Banco de 10 preguntas de nivel medio-alto basadas en la Guía Práctica de paso de fotos a pendrive
const questions = [
  {
    "q": "En clase conectas tu móvil encendido al ordenador con un cable antiguo que tenías en un cajón. El teléfono indica que está cargando batería, pero no aparece en el Explorador de archivos ni muestra opciones USB. ¿Cuál es la causa más probable?",
    "options": [
      "Algunos cables muy antiguos o baratos solo sirven para cargar batería y no transmiten datos; conviene usar el cable original del teléfono.",
      "Debes conectar primero el pendrive en la ranura contigua para que Windows active los puertos USB.",
      "Es obligatorio reiniciar el ordenador con el cable ya conectado para que detecte la batería."
    ],
    "correct": 0,
    "expl": "La guía advierte que ciertos cables antiguos o económicos únicamente transportan corriente eléctrica para cargar la batería, pero carecen de hilos para transferir fotos, por lo que se recomienda emplear el cable original."
  },
  {
    "q": "Has enchufado el móvil desbloqueado y elegido «Transferencia de archivos», pero mientras creas la carpeta en el ordenador la pantalla del teléfono se apaga y bloquea sola, desapareciendo su contenido en el PC. ¿Por qué ocurre?",
    "options": [
      "Porque al crear una carpeta nueva en «Imágenes» Windows expulsa automáticamente los dispositivos externos.",
      "Porque es imprescindible que el móvil esté encendido y sin el bloqueo puesto; si se apaga la pantalla, el ordenador pierde el acceso.",
      "Porque la carpeta «DCIM» solo permanece visible durante 30 segundos por seguridad."
    ],
    "correct": 1,
    "expl": "Para que el ordenador pueda entrar en la memoria del teléfono, la pantalla debe mantenerse encendida y desbloqueada; si el teléfono entra en reposo y se bloquea, se corta el acceso a los archivos."
  },
  {
    "q": "Conectas un móvil Android (Samsung, Xiaomi, Motorola) desbloqueado mediante su cable original, pero no salta ninguna ventana emergente automática preguntando qué hacer. ¿Cómo debes activar el paso de fotos?",
    "options": [
      "Pulsar en el ordenador el botón «+ Nuevo» del Explorador de archivos y elegir «Sincronizar móvil».",
      "Deslizar el dedo desde el borde superior de la pantalla hacia abajo, tocar en el aviso «Cargando este dispositivo por USB» y elegir «Transferencia de archivos».",
      "Desenchufar y volver a enchufar el extremo grande del cable tres veces seguidas."
    ],
    "correct": 1,
    "expl": "Cuando Android no muestra el aviso emergente, la notificación queda oculta en la cortina superior: hay que deslizar desde arriba hacia abajo, tocar «Cargando este dispositivo por USB» y seleccionar «Transferencia de archivos»."
  },
  {
    "q": "Dos compañeros del curso comparan cómo acceder a sus fotos desde el Explorador de archivos: uno tiene iPhone y otro Android. ¿Qué diferencia exacta encontrarán entre el permiso inicial y la subcarpeta final?",
    "options": [
      "En iPhone se pulsa «Confiar» (con código de desbloqueo) y se abre «100APPLE»; en Android se elige «Transferencia de archivos» y se abre «Camera».",
      "En iPhone se elige «Transferencia de archivos» y se abre «Camera»; en Android se pulsa «Confiar» y se abre «100APPLE».",
      "Ambos deben abrir la carpeta «Imágenes» dentro del teléfono, ya que «DCIM» solo existe en ordenadores Windows."
    ],
    "correct": 0,
    "expl": "Todos los móviles guardan las fotografías dentro de «DCIM», pero iPhone pide pulsar «Confiar» más el código y guarda las fotos en «100APPLE», mientras que Android usa «Transferencia de archivos» y las guarda en «Camera»."
  },
  {
    "q": "Para localizar tus fotografías dentro de un móvil Android desde el Explorador de archivos de Windows, ¿cuál es la ruta exacta que debes seguir paso a paso?",
    "options": [
      "Columna izquierda > «Imágenes» > doble clic en «Almacenamiento interno» > «Camera» > «DCIM».",
      "Columna izquierda (debajo de «Este equipo») > clic en el nombre del móvil > doble clic en «Almacenamiento interno» > doble clic en «DCIM» > doble clic en «Camera».",
      "Columna izquierda > «Este equipo» > clic derecho en «Unidad USB» > «Explorar recuerdos»."
    ],
    "correct": 1,
    "expl": "En el panel izquierdo del Explorador debes bajar hasta el final (debajo de «Este equipo»), hacer clic en el nombre de tu móvil y entrar sucesivamente en «Almacenamiento interno», «DCIM» y «Camera»."
  },
  {
    "q": "Dentro de «Camera» tienes 80 fotos y quieres pasar únicamente 5 fotos sueltas (no seguidas) a tu carpeta «Fotos del movil» asegurándote de no borrarlas del teléfono si algo falla. ¿Cómo debes proceder?",
    "options": [
      "Mantener pulsada la tecla Ctrl mientras haces clic en cada una de las 5 fotos, soltar Ctrl, hacer clic derecho sobre una marcada y elegir «Copiar».",
      "Arrastrar las 5 fotos una a una manteniendo pulsada la tecla Intro y elegir «Cortar».",
      "Hacer doble clic en cada foto para abrirla y pulsar el icono de la papelera amarilla."
    ],
    "correct": 0,
    "expl": "La tecla Ctrl permite seleccionar archivos sueltos (no correlativos) haciendo clic en cada uno; al soltarla y elegir «Copiar» (nunca «Cortar»), creas un duplicado en el PC dejando intactas las fotos originales en el móvil."
  },
  {
    "q": "Ya tienes 50 fotos guardadas en tu ordenador dentro de «Imágenes > Fotos del movil» y quieres llevarlas en un pendrive a una tienda para imprimirlas. ¿Cuál es el método más rápido y ordenado?",
    "options": [
      "Abrir la carpeta, seleccionar las 50 fotos una por una y arrastrarlas hasta el reloj de la barra inferior.",
      "En «Imágenes», hacer un solo clic sobre la carpeta «Fotos del movil», clic derecho > «Copiar», hacer clic en el nombre del pendrive a la izquierda y clic derecho > «Pegar» en el espacio en blanco.",
      "Volver a conectar el móvil y copiarlas directamente desde «DCIM» sin pasar por el ordenador."
    ],
    "correct": 1,
    "expl": "No es necesario copiar foto por foto: basta con marcar la carpeta entera «Fotos del movil» en «Imágenes» con un clic, elegir «Copiar», seleccionar el pendrive en la columna izquierda y pulsar «Pegar» en el panel derecho."
  },
  {
    "q": "Has comprobado que la carpeta «Fotos del movil» ya está dentro del pendrive con todas las fotos. ¿Cuál es el procedimiento obligatorio para retirar el pendrive sin dañar los archivos?",
    "options": [
      "Cerrar el Explorador de archivos con la X y tirar suavemente del pendrive mientras la luz parpadea.",
      "Clic en la flechita hacia arriba (^) junto al reloj abajo a la derecha > clic en el icono del pendrive con un tic verde > pulsar «Expulsar...» y esperar el cartel «Es seguro quitar el hardware».",
      "Hacer clic derecho sobre «Imágenes» y seleccionar «Desconectar memoria USB»."
    ],
    "correct": 1,
    "expl": "Tirar directamente del pendrive puede corromper los archivos. Hay que usar la extracción segura desde la flechita (^) junto al reloj, pulsar el icono del pendrive con el tic verde, elegir «Expulsar...» y esperar la confirmación."
  },
  {
    "q": "Si utilizas la opción «Cortar» en lugar de «Copiar» al pasar las fotos desde la carpeta DCIM de tu móvil hacia el ordenador, las fotos se duplican manteniendo una copia intacta en el teléfono y otra en el PC.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. «Cortar» mueve el archivo eliminándolo de su ubicación original; la guía insiste en usar siempre «Copiar» y «Pegar» para crear un duplicado y garantizar que nunca pierdas tus fotos en el teléfono."
  },
  {
    "q": "Si al abrir tu carpeta «Fotos del movil» en el ordenador las imágenes se ven demasiado pequeñas para distinguirlas, debes volver a copiarlas desde el móvil en mayor calidad para poder verlas en grande.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. El tamaño de las miniaturas en pantalla no depende de cómo las copiaste: basta con pulsar arriba en «Ver» y elegir «Iconos grandes» o «Iconos muy grandes» para visualizarlas con comodidad."
  }
];
const TOTAL = questions.length;

let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];

  document.getElementById('q-type').textContent =
    qData.type === 'boolean' ? '✅ Verdadero o Falso' : '🎯 Opción múltiple';
  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.display = 'none';

  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';

  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  const pct = (currentIdx / TOTAL) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${TOTAL}`;
  document.getElementById('btn-next').textContent =
    currentIdx === TOTAL - 1 ? 'Ver resultados 🏁' : 'Siguiente →';
    
  fit(true);
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('q-feedback');

  btns.forEach(b => b.disabled = true);

  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>🎉 ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = 'feedback correct-fb';
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota del curso:</strong><br>${qData.expl}`;
    fb.className = 'feedback wrong-fb';
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.display = 'block';
  fit(false);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < TOTAL) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.documentElement.style.setProperty('--k', 1);
  document.getElementById('results').style.display = 'flex';

  const pct = Math.round((score / TOTAL) * 100);
  document.getElementById('score-num').innerHTML = `${score}/${TOTAL}<small>${pct}%</small>`;

  let emoji, msg, sub;
  if (pct === 100)    { emoji = '🏆'; msg = '¡Excelente! Dominas el paso de fotos'; sub = 'Sabes poner a salvo tus recuerdos en el ordenador y pendrive sin riesgos.'; }
  else if (pct >= 80) { emoji = '🌟'; msg = '¡Muy buen manejo en clase!';           sub = 'Solo se te escapó algún detalle técnico. ¡Ya casi lo tienes!'; }
  else if (pct >= 60) { emoji = '👍'; msg = '¡Buen progreso en el curso!';         sub = 'Vas por buen camino; repasa los pasos en los que dudaste.'; }
  else if (pct >= 40) { emoji = '📚'; msg = 'Conviene repasar la guía';           sub = 'Revisa los trucos de conexión USB, Copiar/Pegar y expulsión segura.'; }
  else                { emoji = '💪'; msg = '¡Ánimo, todo es practicar!';          sub = 'Vuelve a leer la guía paso a paso y repite el cuestionario.'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('prog-fill').style.width = '100%';
}

function restartQuiz() {
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('prog-score').textContent = '⭐ 0 pts';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-area').classList.remove('hidden');
  loadQuestion();
}

function fit(reset) {
  const root = document.documentElement;
  const card = document.querySelector('.question-card');
  if (!card || !card.clientHeight) return;
  let k = reset ? 1 : (parseFloat(root.style.getPropertyValue('--k')) || 1);
  root.style.setProperty('--k', k);
  while (k > 0.55 && card.scrollHeight > card.clientHeight + 1) {
    k = Math.round((k - 0.04) * 100) / 100;
    root.style.setProperty('--k', k);
  }
}
window.addEventListener('resize', () => fit(!answered));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(!answered));

window.onload = loadQuestion;
</script>
</body>
</html>

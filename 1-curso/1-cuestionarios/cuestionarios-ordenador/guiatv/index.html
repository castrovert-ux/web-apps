<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Ver TV en el Ordenador</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #185FA5; --c2: #0C447C; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }
  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }
  .container { position: relative; z-index: 1; max-width: 750px; margin: 0 auto; padding: 40px 20px; }
  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px;
    text-transform: uppercase; padding: 6px 18px; border-radius: 100px; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: clamp(1.8rem, 5vw, 2.8rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
  }
  .progress-wrap { margin-bottom: 30px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }
  .question-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: 36px; margin-bottom: 24px;
  }
  .q-type-badge {
    display: inline-flex; font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    padding: 4px 12px; border-radius: 100px; margin-bottom: 18px;
    background: rgba(24,95,165,0.2); color: #60a5fa;
  }
  .q-number { font-size: 0.8rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.5; margin-bottom: 20px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 20px; color: var(--text);
    font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 14px; transition: 0.2s;
  }
  .option-btn:hover:not(:disabled) { background: rgba(24,95,165,0.15); border-color: var(--c1); transform: translateX(5px); }
  .option-letter {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
  }
  .option-btn.correct { background: rgba(24,95,165,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }
  .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: 700; line-height: 1.4; animation: fadeIn 0.3s ease; }
  .feedback.correct-fb { display: block; background: rgba(24,95,165,0.2); color: #93c5fd; border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .btn-next {
    display: none; width: 100%; max-width: 200px; margin: 0 0 0 auto;
    padding: 14px; border-radius: 14px; border: none; font-weight: 800;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
  }
  .results { display: none; text-align: center; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 20px auto;
    font-size: 2rem; font-family: 'Fredoka One';
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>
<div class="container">
  <div class="header">
    <div class="badge">📺 TV en el Ordenador</div>
    <h1>Ver televisión online</h1>
  </div>
  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <div class="question-card">
      <div class="q-type-badge">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>
  <div class="results" id="results">
    <div style="font-size: 4rem;">🏆</div>
    <div class="score-circle" id="score-num">0/10</div>
    <h2 id="result-msg"></h2>
    <button class="badge" style="margin-top: 30px; cursor: pointer; border: none;" onclick="location.reload()">Reiniciar Quiz</button>
  </div>
</div>
<script>
const questions = [
  {
    q: "¿Qué necesitas para ver televisión en el ordenador?",
    options: ["Una antena especial de TV", "Un ordenador con acceso a internet", "Un mando a distancia"],
    correct: 1,
    expl: "Solo necesitas un ordenador con conexión a internet y un navegador web. No hace falta ningún hardware especial."
  },
  {
    q: "¿Cuál es la dirección web de RTVE Play, la plataforma de Televisión Española?",
    options: ["www.tve.es", "www.rtve.es/play/", "www.television.es"],
    correct: 1,
    expl: "La dirección correcta es www.rtve.es/play/. Desde ahí puedes ver La 1, La 2 y muchos programas a la carta."
  },
  {
    q: "¿Qué opción debes elegir en RTVE Play para ver La 1 o La 2 en este momento?",
    options: ["A la carta", "En directo", "Mis favoritos"],
    correct: 1,
    expl: "'En directo' te permite seguir la emisión en tiempo real, igual que si encendieras el televisor."
  },
  {
    q: "¿Qué significa 'A la carta' en las plataformas de TV online?",
    options: ["Ver canales en directo", "Ver programas emitidos anteriormente cuando quieras", "Pagar por un programa concreto"],
    correct: 1,
    expl: "'A la carta' significa que puedes ver programas que ya se han emitido, en el momento que tú elijas, sin horarios fijos."
  },
  {
    q: "¿A qué canales da acceso Atresplayer?",
    options: ["La 1 y La 2", "Antena 3, La Sexta y otros canales del grupo Atresmedia", "Canal Sur y Telemadrid"],
    correct: 1,
    expl: "Atresplayer es la plataforma del grupo Atresmedia, que incluye Antena 3, La Sexta y otros canales. Se accede en www.atresplayer.com."
  },
  {
    q: "¿Cuál de estas opciones es una plataforma gratuita adicional mencionada en la guía?",
    options: ["Netflix", "Pluto TV", "HBO Max"],
    correct: 1,
    expl: "Pluto TV (www.pluto.tv) ofrece canales en vivo y contenido bajo demanda completamente gratis, sin necesidad de registro."
  },
  {
    q: "¿Para qué sirve YouTube en relación con la TV?",
    options: ["Solo para vídeos de música", "Para ver canales oficiales de TV que suben programas y emisiones en directo", "Para grabar programas de televisión"],
    correct: 1,
    expl: "Muchos canales de televisión como RTVE o Telemadrid tienen perfiles oficiales en YouTube donde suben programas completos y retransmisiones."
  },
  {
    q: "¿Qué botón debes pulsar para pausar un vídeo?",
    options: ["El triángulo", "Las dos líneas verticales", "El cuadrado"],
    correct: 1,
    expl: "El botón de pausa son dos líneas verticales. El triángulo es para reproducir, y el cuadrado suele ser para detener o ver en pantalla completa."
  },
  {
    q: "¿Cómo se sube el volumen en el reproductor de vídeo?",
    options: ["Moviendo la barra del altavoz hacia la izquierda", "Moviendo la barra del altavoz hacia la derecha", "Haciendo doble clic en la pantalla"],
    correct: 1,
    expl: "Para subir el volumen hay que mover la barra junto al icono del altavoz hacia la derecha. Hacia la izquierda lo baja."
  },
  {
    q: "¿Qué consejo da la guía para volver fácilmente a tus páginas de TV favoritas?",
    options: ["Apuntar la dirección en papel", "Guardar los enlaces en 'Favoritos' del navegador", "Buscarlos cada vez en Google"],
    correct: 1,
    expl: "Guardar las páginas en 'Favoritos' (o marcadores) del navegador te permite acceder a ellas con un solo clic, sin tener que recordar ni escribir la dirección."
  }
];

let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];
  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('q-feedback').style.display = 'none';
  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';
  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span> <span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });
  const pct = (currentIdx / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${questions.length}`;
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;
  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('q-feedback');
  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>✅ ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = "feedback correct-fb";
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota:</strong><br>${qData.expl}`;
    fb.className = "feedback wrong-fb";
  }
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < questions.length) {
    loadQuestion();
  } else {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('results').style.display = 'block';
    document.getElementById('score-num').textContent = `${score}/10`;
    document.getElementById('result-msg').textContent = score >= 7 ? "¡Muy bien! Ya sabes ver la tele en el ordenador." : "Repasa la guía un poco más, ¡casi lo tienes!";
  }
}

window.onload = loadQuestion;
</script>
</body>
</html>

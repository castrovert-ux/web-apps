<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Gráficos en Excel - Aprende visualizando datos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346;
    --c2: #1a5c38;
    --c3: #FFD93D;
    --c4: #FF6B6B;
    --c5: #6BCB77;
    --bg: #0a1628;
    --card: #111d35;
    --text: #FFFFFE;
    --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-blobs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(25px, 18px) scale(1.07); }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 750px; margin: 0 auto;
    padding: 40px 20px;
  }

  .header {
    text-align: center; margin-bottom: 40px;
    animation: slideDown 0.7s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: 0.75rem;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 18px; border-radius: 100px; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1;
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px;
  }
  .subtitle { color: var(--sub); font-size: 1rem; font-weight: 600; }

  .progress-wrap { margin-bottom: 30px; animation: fadeIn 0.5s ease; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px; background: rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c1), var(--c3));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px; padding: 36px; margin-bottom: 24px;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .q-type-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.5px; padding: 4px 12px; border-radius: 100px; margin-bottom: 18px;
  }
  .type-mc   { background: rgba(33,115,70,0.2); color: #4ade80; }
  .type-tf   { background: rgba(255,217,61,0.15); color: var(--c3); }
  .type-open { background: rgba(255,107,107,0.15); color: var(--c4); }

  .q-number { font-size: 0.8rem; color: var(--sub); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.5; }

  .options { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .option-btn {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 20px;
    color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 600; text-align: left;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(33,115,70,0.15);
    border-color: var(--c1); transform: translateX(6px);
  }
  .option-letter {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
    transition: all 0.2s;
  }
  .option-btn.correct { background: rgba(33,115,70,0.2); border-color: var(--c1); }
  .option-btn.correct .option-letter { background: var(--c1); color: #fff; }
  .option-btn.wrong { background: rgba(255,107,107,0.12); border-color: var(--c4); }
  .option-btn.wrong .option-letter { background: var(--c4); color: #fff; }
  .option-btn:disabled { cursor: default; }

  .open-area textarea {
    width: 100%; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 16px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 600; resize: vertical; min-height: 110px;
    margin-top: 20px; transition: border-color 0.2s;
  }
  .open-area textarea:focus { outline: none; border-color: var(--c1); }
  .open-area textarea::placeholder { color: rgba(255,255,255,0.3); }

  .feedback {
    display: none; margin-top: 16px; padding: 14px 18px;
    border-radius: 12px; font-weight: 700; font-size: 0.95rem;
    animation: fadeIn 0.3s ease; line-height: 1.5;
  }
  .feedback.correct-fb { display: flex; background: rgba(33,115,70,0.15); border: 1px solid rgba(33,115,70,0.4); color: var(--c5); }
  .feedback.wrong-fb   { display: flex; background: rgba(255,107,107,0.1);  border: 1px solid rgba(255,107,107,0.3); color: var(--c4); }
  .feedback.info-fb    { display: flex; background: rgba(255,217,61,0.1);   border: 1px solid rgba(255,217,61,0.3);  color: var(--c3); }

  .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
  .btn-submit, .btn-next {
    padding: 14px 32px; border-radius: 14px; border: none;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-submit { background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(33,115,70,0.4); }
  .btn-next { background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,217,61,0.4); }

  .results { display: none; text-align: center; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1); }
  .results.show { display: block; }
  .trophy { font-size: 5rem; margin-bottom: 16px; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-12px) rotate(5deg); }
  }
  .score-circle {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(var(--c1) 0%, var(--c3) var(--pct, 100%), rgba(255,255,255,0.05) var(--pct,100%));
    display: flex; align-items: center; justify-content: center;
    margin: 24px auto; position: relative;
  }
  .score-circle::before {
    content: ''; position: absolute; inset: 10px;
    border-radius: 50%; background: var(--bg);
  }
  .score-number {
    font-family: 'Fredoka One', cursive; font-size: 2.2rem;
    position: relative; z-index: 1;
  }
  .result-msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--sub); font-size: 0.95rem; margin-bottom: 30px; }
  .btn-restart {
    padding: 16px 40px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-restart:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(33,115,70,0.4); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div class="container">

  <div class="header">
    <div class="badge">📊 GRÁFICOS EN EXCEL</div>
    <h1>Domina los gráficos<br>como un experto</h1>
    <p class="subtitle">Pon a prueba tus conocimientos: tipos de gráficos, pasos para crearlos y buenas prácticas</p>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <div class="question-card" id="q-card">
      <div class="q-type-badge" id="q-type-badge"></div>
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div id="q-body"></div>
      <div class="feedback" id="q-feedback"></div>
    </div>

    <div class="btn-row">
      <button class="btn-submit hidden" id="btn-submit" onclick="submitOpen()">Comprobar respuesta ✔</button>
      <button class="btn-next hidden" id="btn-next" onclick="nextQuestion()">Siguiente pregunta →</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="trophy" id="trophy">🏆</div>
    <div class="score-circle" id="score-circle">
      <span class="score-number" id="score-num">0/10</span>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-sub" id="result-sub"></div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Volver a practicar</button>
  </div>

</div>

<script>
// ============================================================
// 10 PREGUNTAS SOBRE GRÁFICOS EN EXCEL (CONCEPTOS GENERALES)
// Sin mencionar ningún documento específico.
// Se incluye la palabra "proporción" en la pregunta del gráfico circular.
// ============================================================
const questions = [
  {
    type: "mc",
    text: "¿Qué tipo de gráfico es el más adecuado para visualizar la evolución de la temperatura a lo largo de una semana?",
    options: [
      "Gráfico circular (pastel)",
      "Gráfico de líneas",
      "Gráfico de columnas apiladas",
      "Gráfico de barras horizontal"
    ],
    correct: 1,
    explanation: "✅ Correcto. El gráfico de líneas es ideal para mostrar cambios o tendencias a lo largo del tiempo, como temperaturas diarias o ventas mensuales."
  },
  {
    type: "mc",
    text: "Para crear un gráfico en Excel, ¿cuál es el orden correcto de los pasos básicos?",
    options: [
      "Insertar gráfico → Escribir datos → Seleccionar rango",
      "Seleccionar rango → Insertar gráfico → Escribir datos",
      "Escribir datos → Seleccionar rango → Insertar gráfico",
      "Escribir datos → Insertar gráfico → Seleccionar rango"
    ],
    correct: 2,
    explanation: "✅ Correcto. Primero introduces los datos en celdas, luego seleccionas el rango completo y finalmente vas a la pestaña Insertar para elegir el gráfico."
  },
  {
    type: "mc",
    text: "Si deseas mostrar la proporción que representa cada categoría dentro de un total (por ejemplo, los gastos de alquiler, comida y luz respecto al total del presupuesto), ¿qué tipo de gráfico es el más adecuado?",
    options: [
      "Gráfico de líneas",
      "Gráfico de barras",
      "Gráfico circular (pastel)",
      "Gráfico de áreas"
    ],
    correct: 2,
    explanation: "🍩 Correcto. El gráfico circular (pastel) es el indicado para representar proporciones o porcentajes de las partes con respecto a un todo. Muestra claramente qué componente pesa más."
  },
  {
    type: "mc",
    text: "¿Qué tipo de gráfico se recomienda para comparar cantidades entre diferentes categorías de manera horizontal, facilitando la lectura cuando las etiquetas son largas?",
    options: [
      "Gráfico de columnas",
      "Gráfico de barras",
      "Gráfico circular",
      "Gráfico de líneas"
    ],
    correct: 1,
    explanation: "📊 Correcto. El gráfico de barras presenta las barras de forma horizontal, ideal para comparar categorías con nombres extensos o muchas categorías."
  },
  {
    type: "tf",
    text: "El gráfico de líneas es el más apropiado para representar la composición porcentual de un todo, como la distribución del gasto mensual.",
    options: ["✅ Verdadero", "❌ Falso"],
    correct: 1,
    explanation: "❌ Falso. El gráfico de líneas se usa para tendencias a lo largo del tiempo, no para proporciones. Para partes de un total se usa el gráfico circular o de anillos."
  },
  {
    type: "mc",
    text: "¿En qué pestaña de la cinta de opciones de Excel se encuentran los comandos para insertar un gráfico?",
    options: [
      "Inicio",
      "Datos",
      "Insertar",
      "Diseño de página"
    ],
    correct: 2,
    explanation: "✅ Correcto. La pestaña 'Insertar' agrupa las opciones de gráficos (columnas, líneas, circulares, barras, etc.) junto con otros elementos como tablas e imágenes."
  },
  {
    type: "mc",
    text: "Cuando tienes datos de ventas mensuales durante un año completo, ¿qué gráfico permite ver mejor la tendencia de crecimiento o estacionalidad?",
    options: [
      "Gráfico circular",
      "Gráfico de líneas",
      "Gráfico de barras 3D",
      "Gráfico de anillos"
    ],
    correct: 1,
    explanation: "📈 Correcto. El gráfico de líneas es excelente para mostrar la evolución en el tiempo, detectar subidas, bajadas y patrones estacionales."
  },
  {
    type: "tf",
    text: "Para mejorar la claridad de un gráfico, conviene añadir un título descriptivo y etiquetas de datos que muestren los valores exactos.",
    options: ["✅ Verdadero", "❌ Falso"],
    correct: 0,
    explanation: "✅ Verdadero. Agregar un título ayuda a entender de qué trata el gráfico, y las etiquetas de datos permiten conocer los valores numéricos sin necesidad de adivinar."
  },
  {
    type: "mc",
    text: "¿Cuál de los siguientes es un consejo importante al crear gráficos en Excel para que sean efectivos?",
    options: [
      "Usar el gráfico circular para cualquier tipo de dato",
      "Poner todos los datos disponibles en un solo gráfico sin importar la cantidad",
      "Elegir el tipo de gráfico según el mensaje que se quiera comunicar (comparación, tendencia, proporción)",
      "Evitar siempre las etiquetas de datos porque ensucian la visualización"
    ],
    correct: 2,
    explanation: "💡 Correcto. Un buen gráfico comunica de forma clara: columnas/barras para comparar, líneas para tendencias, circular para proporciones. Evitar sobrecargar el gráfico."
  },
  {
    type: "open",
    text: "Explica brevemente al menos tres acciones que puedes realizar para mejorar un gráfico después de insertarlo en Excel (por ejemplo, para que sea más comprensible y profesional).",
    keywords: ["título", "etiquetas", "datos", "colores", "leyenda", "ejes", "formato", "estilo", "tamaño", "fondo", "borde", "fuente", "alinear", "personalizar", "mejorar", "añadir", "cambiar"],
    explanation: "✨ Algunas mejoras clave: 1) Agregar un título claro y descriptivo. 2) Insertar etiquetas de datos para mostrar valores exactos. 3) Cambiar colores para resaltar categorías. 4) Ajustar la leyenda o los ejes. 5) Modificar el tamaño o el estilo del gráfico. ¡Pequeños detalles marcan la diferencia!"
  }
];

let current = 0, score = 0, answered = false;
const totalQuestions = questions.length;

const typeLabels = {
  mc:   { label: "🎯 Opción múltiple", cls: "type-mc" },
  tf:   { label: "⚖️ Verdadero / Falso", cls: "type-tf" },
  open: { label: "✍️ Respuesta abierta", cls: "type-open" }
};

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const pct = (current / totalQuestions) * 100;

  document.getElementById('prog-label').textContent = `Pregunta ${current+1} de ${totalQuestions}`;
  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('prog-fill').style.width = pct + '%';

  const badge = document.getElementById('q-type-badge');
  badge.textContent = typeLabels[q.type].label;
  badge.className = 'q-type-badge ' + typeLabels[q.type].cls;

  document.getElementById('q-number').textContent = `Pregunta ${current+1}`;
  document.getElementById('q-text').textContent = q.text;

  const body = document.getElementById('q-body');
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  document.getElementById('btn-submit').classList.add('hidden');
  document.getElementById('btn-next').classList.add('hidden');

  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'popIn 0.5s cubic-bezier(.34,1.56,.64,1)';

  if (q.type === 'mc' || q.type === 'tf') {
    let letters = ['A','B','C','D'];
    body.innerHTML = `<div class="options">${
      q.options.map((opt, i) => {
        let letterMark = (q.type === 'tf') ? (i===0 ? 'V' : 'F') : letters[i];
        return `<button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
          <span class="option-letter">${letterMark}</span>
          <span>${opt}</span>
        </button>`;
      }).join('')
    }</div>`;
  } else {
    body.innerHTML = `<div class="open-area">
      <textarea id="open-ans" placeholder="Escribe tu respuesta aquí (mínimo 20 caracteres). Menciona al menos tres acciones para mejorar un gráfico, como título, etiquetas, colores, etc."></textarea>
    </div>`;
    document.getElementById('btn-submit').classList.remove('hidden');
  }
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const fb = document.getElementById('q-feedback');

  // deshabilitar todos los botones de opción
  q.options.forEach((_, i) => { 
    const btn = document.getElementById(`opt-${i}`);
    if (btn) btn.disabled = true;
  });

  const chosen = document.getElementById(`opt-${idx}`);
  const correctIdx = q.correct;
  const correctBtn = document.getElementById(`opt-${correctIdx}`);

  if (idx === correctIdx) {
    chosen.classList.add('correct');
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ' + q.explanation;
  } else {
    chosen.classList.add('wrong');
    if (correctBtn) correctBtn.classList.add('correct');
    fb.className = 'feedback wrong-fb';
    fb.innerHTML = '💡 ' + q.explanation;
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function submitOpen() {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const ans = document.getElementById('open-ans').value.trim().toLowerCase();
  const fb = document.getElementById('q-feedback');
  const textarea = document.getElementById('open-ans');
  textarea.disabled = true;
  document.getElementById('btn-submit').classList.add('hidden');

  // Contar palabras clave relacionadas con mejora de gráficos
  const keywordHits = q.keywords.filter(k => ans.includes(k)).length;
  const isLongEnough = ans.length >= 20;

  if (ans.length < 15) {
    fb.className = 'feedback info-fb';
    fb.innerHTML = '📝 Respuesta muy breve. Intenta mencionar tres acciones concretas: añadir título, etiquetas de datos, cambiar colores, ajustar leyenda, modificar ejes, etc. ' + q.explanation;
  } else if (keywordHits >= 2 || (isLongEnough && keywordHits >= 1)) {
    score++;
    fb.className = 'feedback correct-fb';
    fb.innerHTML = '🎉 ¡Excelente! Has identificado buenas prácticas para mejorar gráficos. ' + q.explanation;
  } else {
    fb.className = 'feedback info-fb';
    fb.innerHTML = '✍️ Buen intento. Recuerda que mejorar un gráfico incluye: título descriptivo, etiquetas de datos, colores armoniosos, leyenda clara, formato de ejes, etc. ' + q.explanation;
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
  current++;
  if (current >= totalQuestions) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  const res = document.getElementById('results');
  res.classList.add('show');

  const pct = Math.round((score / totalQuestions) * 100);
  document.getElementById('score-circle').style.setProperty('--pct', pct + '%');
  document.getElementById('score-num').textContent = `${score}/${totalQuestions}`;

  let trophyEmoji = '';
  let resultMsg = '';
  let resultSubMsg = '';
  if (score === totalQuestions) {
    trophyEmoji = '🏆📊✨';
    resultMsg = '¡Puntuación perfecta!';
    resultSubMsg = 'Dominas los gráficos de Excel: sabes elegir el tipo correcto, los pasos y cómo mejorarlos.';
  } else if (score >= 7) {
    trophyEmoji = '🌟📈';
    resultMsg = '¡Muy bien! Tienes un gran nivel';
    resultSubMsg = 'Revisa los tipos de gráfico (circular para proporciones, líneas para tendencias) para alcanzar la perfección.';
  } else if (score >= 4) {
    trophyEmoji = '👍📉';
    resultMsg = 'Buen trabajo, sigue practicando';
    resultSubMsg = 'Repasa cuándo usar cada gráfico: columnas/barras para comparar, líneas para evolución, circular para partes de un total.';
  } else {
    trophyEmoji = '📚💪';
    resultMsg = '¡Ánimo! Cada pregunta te acerca al dominio';
    resultSubMsg = 'Vuelve a intentarlo: recuerda que el gráfico de líneas muestra tendencias, el circular proporciones y las barras comparan cantidades.';
  }
  document.getElementById('trophy').textContent = trophyEmoji;
  document.getElementById('result-msg').textContent = resultMsg;
  document.getElementById('result-sub').textContent = resultSubMsg;
}

function restartQuiz() {
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quiz-area').classList.remove('hidden');
  renderQuestion();
}

// Inicializar
renderQuestion();
</script>
</body>
</html>

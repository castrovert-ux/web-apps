<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>📊 Tablas Dinámicas en Excel | Cuestionario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0b1a1a;
      background-image: radial-gradient(circle at 10% 20%, rgba(40, 80, 60, 0.2) 0%, #071212 90%);
      color: #eef4ff;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* Volver */
    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1f3730;
      color: #b9f3d0;
      font-weight: 800;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 60px;
      border: 1.5px solid #2c5746;
      font-size: 0.9rem;
      transition: 0.25s;
      margin-bottom: 28px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.3);
      backdrop-filter: blur(2px);
    }
    .btn-volver:hover {
      background: #2e7d60;
      color: white;
      border-color: #45b68b;
      transform: translateX(-4px);
    }

    /* Cabecera */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 3.4rem;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
      display: inline-block;
    }
    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 7vw, 3.1rem);
      background: linear-gradient(135deg, #FFE6B0, #C0F0E8);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
      margin-top: 8px;
      letter-spacing: -0.5px;
    }
    .subtitulo {
      font-weight: 700;
      background: rgba(0, 30, 24, 0.7);
      backdrop-filter: blur(10px);
      display: inline-block;
      padding: 6px 22px;
      border-radius: 40px;
      font-size: 0.95rem;
      color: #bdf2e4;
      border: 1px solid #327a60;
      margin-top: 12px;
    }

    .quiz-wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    /* Barra progreso */
    .progreso-wrap {
      background: #1f3b33;
      border-radius: 40px;
      height: 14px;
      margin-bottom: 34px;
      overflow: hidden;
      box-shadow: inset 0 1px 5px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
    }
    .progreso-barra {
      height: 100%;
      background: linear-gradient(90deg, #F7D44A, #F4A261);
      border-radius: 40px;
      transition: width 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      width: 0%;
      box-shadow: 0 0 6px #ffcd7e;
    }

    /* Tarjeta pregunta (estilo oscuro premium) */
    .pregunta-card {
      background: rgba(12, 30, 28, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 30px 28px;
      margin-bottom: 28px;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(80, 140, 110, 0.3);
      transition: all 0.2s;
      animation: slideUp 0.45s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .num-pregunta {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      background: #1f4c3e;
      display: inline-block;
      padding: 5px 16px;
      border-radius: 50px;
      margin-bottom: 18px;
      color: #f7e05e;
      box-shadow: inset 0 -1px 0 #2f745b;
    }

    .texto-pregunta {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 28px;
      color: #f3f9fc;
      text-shadow: 0 1px 2px black;
    }

    /* Opciones oscuras */
    .opciones {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .opcion {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #0C1F1C;
      border: 2px solid #2B5546;
      border-radius: 28px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 1rem;
      color: #E0F2EF;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      width: 100%;
      backdrop-filter: blur(4px);
    }
    .opcion:hover:not(:disabled) {
      background: #1D4A3E;
      border-color: #E9C46A;
      transform: translateX(6px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }
    .opcion .letra {
      width: 40px;
      height: 40px;
      background: #193E34;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #FCCF7C;
      flex-shrink: 0;
      transition: 0.1s;
    }
    .opcion.correcta {
      background: #1D5E46;
      border-color: #6FCF97;
      color: white;
    }
    .opcion.correcta .letra {
      background: #2C9B6E;
      color: white;
      box-shadow: 0 0 6px #7ae9b0;
    }
    .opcion.incorrecta {
      background: #612B2B;
      border-color: #E76F51;
      color: #FFD9D9;
    }
    .opcion.incorrecta .letra {
      background: #B34234;
      color: white;
    }
    .opcion.revelada {
      background: #23664B;
      border-color: #8BD3B0;
      opacity: 0.92;
    }
    .opcion.revelada .letra {
      background: #55C68F;
      color: #0C2E22;
    }
    .opcion:disabled {
      cursor: default;
    }

    /* retroalimentación */
    .resultado-inline {
      margin-top: 22px;
      padding: 16px 20px;
      border-radius: 28px;
      font-weight: 700;
      display: none;
      font-size: 0.96rem;
      line-height: 1.45;
      backdrop-filter: blur(10px);
    }
    .resultado-inline.acierto {
      background: rgba(39, 108, 74, 0.4);
      border-left: 8px solid #8DE0B2;
      display: block;
      color: #D0FFE3;
    }
    .resultado-inline.fallo {
      background: rgba(150, 40, 27, 0.4);
      border-left: 8px solid #F3A683;
      display: block;
      color: #FFD9CF;
    }

    .btn-siguiente {
      display: none;
      margin: 28px auto 10px;
      background: linear-gradient(135deg, #e9b741, #CD8D2F);
      border: none;
      padding: 14px 40px;
      border-radius: 60px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: #1A2F28;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,215,120,0.4);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-siguiente:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #F7C34A, #E19B30);
      box-shadow: 0 14px 24px rgba(0,0,0,0.5);
    }

    /* Panel final oscuro con detalles */
    #panel-final {
      display: none;
      background: rgba(8, 22, 20, 0.95);
      backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #2F735C;
      margin-top: 30px;
      border: 1px solid #528A73;
    }
    .trofeo {
      font-size: 4.8rem;
      filter: drop-shadow(0 6px 12px gold);
    }
    .estrellas {
      color: #FFD966;
      font-size: 2.2rem;
      letter-spacing: 10px;
      margin: 12px 0 6px;
    }
    h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      background: linear-gradient(120deg, #F6E7A0, #BCE5D4);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 18px;
    }
    .puntuacion-grande {
      font-size: 4.4rem;
      font-weight: 800;
      font-family: 'Fredoka One', cursive;
      color: #F5E56B;
      text-shadow: 0 4px 12px #00000050;
    }
    .de-total {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0.8;
      color: #BFDFD4;
    }
    .mensaje-final {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 32px;
      background: #0F2F28;
      display: inline-block;
      padding: 12px 24px;
      border-radius: 60px;
      color: #F7E8B0;
    }
    .resumen {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .chip {
      background: #1A372F;
      border-radius: 60px;
      padding: 10px 26px;
      font-weight: 800;
      border: 1px solid #367D64;
    }
    .chip.v {
      border: 2px solid #77D8A8;
      color: #C5F7DC;
    }
    .chip.r {
      border: 2px solid #E6865E;
      color: #FFCFBC;
    }
    .btn-reiniciar {
      background: linear-gradient(130deg, #EFB03A, #D48926);
      border: none;
      padding: 18px 38px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-family: 'Fredoka One', cursive;
      color: #1d312a;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 18px;
      box-shadow: 0 6px 16px black;
    }
    .btn-reiniciar:hover {
      transform: scale(0.97);
      background: #FFC857;
    }
    .btn-volver-final {
      display: inline-flex;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: 2px solid #568B78;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 800;
      text-decoration: none;
      color: #C4EADB;
      transition: 0.2s;
    }
    .btn-volver-final:hover {
      background: #307F64;
      color: white;
      border-color: #F3C26B;
    }

    @media (max-width: 520px) {
      .pregunta-card { padding: 20px 16px; }
      .texto-pregunta { font-size: 1.1rem; }
      .opcion { padding: 10px 15px; gap: 12px; font-size: 0.9rem; }
      .btn-siguiente { font-size: 1rem; padding: 12px 28px; }
    }
  </style>
</head>
<body>
<div style="max-width:820px; margin:0 auto 6px;">
  <a class="btn-volver" href="../index.html">← Volver a cuestionarios</a>
</div>

<header>
  <span class="logo-icon">📊🧩</span>
  <h1>Tablas Dinámicas en Excel</h1>
  <p class="subtitulo">📌 Resumir, agrupar y analizar datos como un profesional</p>
</header>

<div class="quiz-wrap">
  <div class="progreso-wrap"><div class="progreso-barra" id="barraProgreso"></div></div>
  <div id="zonaPreguntas"></div>

  <div id="panelFinal">
    <span class="trofeo" id="trofeoIcon">🏆</span>
    <div class="estrellas" id="estrellasFinal">★★★★★</div>
    <h2>🎯 Resultado final</h2>
    <div class="puntuacion-grande" id="puntajeFinal">0</div>
    <div class="de-total" id="deTotalText">de 10 preguntas correctas</div>
    <p class="mensaje-final" id="mensajeFinalTxt"></p>
    <div class="resumen">
      <div class="chip v" id="aciertosChip">✅ 0 aciertos</div>
      <div class="chip r" id="fallosChip">❌ 0 fallos</div>
    </div>
    <div class="botones-final">
      <button class="btn-reiniciar" onclick="reiniciarQuiz()">🔄 Jugar otra vez</button>
      <a class="btn-volver-final" href="../index.html">📁 Otros cuestionarios</a>
    </div>
  </div>
</div>

<script>
  // ======================================================
  // 10 PREGUNTAS GENERALES SOBRE TABLAS DINÁMICAS (PDF)
  // Conceptos clave, procedimientos, sin datos concretos.
  // ======================================================
  const preguntas = [
    {
      texto: "¿En qué pestaña de Excel se encuentra el botón para insertar una tabla dinámica?",
      tipo: "multi",
      opciones: ["Inicio", "Datos", "Insertar", "Revisar"],
      correcta: 2,
      explicacion: "El comando «Tabla dinámica» está en la pestaña «Insertar», grupo «Tablas»."
    },
    {
      texto: "Para agrupar gastos por categoría en una tabla dinámica, ¿dónde debemos arrastrar el campo «Categoría»?",
      tipo: "multi",
      opciones: ["Área de valores", "Área de filas", "Área de columnas", "Filtros"],
      correcta: 1,
      explicacion: "Los campos categóricos se colocan normalmente en FILAS para agrupar los datos (por ejemplo: cada categoría como fila única)."
    },
    {
      texto: "¿Qué campo se arrastra al área de VALORES para obtener la suma total de los gastos?",
      tipo: "multi",
      opciones: ["Categoría", "Subcategoría", "Precio (campo numérico)", "Fecha"],
      correcta: 2,
      explicacion: "En VALORES se colocan campos numéricos como Precio, para que Excel los sume (u otra operación)."
    },
    {
      texto: "Verdadero o Falso: Una tabla dinámica modifica permanentemente los datos de origen.",
      tipo: "vf",
      opciones: ["✅ Verdadero", "❌ Falso"],
      correcta: 1,
      explicacion: "Falso. La tabla dinámica solo resume los datos; los originales permanecen intactos."
    },
    {
      texto: "Según el material del PDF, después de crear una tabla dinámica por categoría, ¿qué gráfico se recomienda para visualizar proporciones?",
      tipo: "multi",
      opciones: ["Gráfico de barras apiladas", "Gráfico de tarta (pastel)", "Gráfico de líneas", "Gráfico radial"],
      correcta: 1,
      explicacion: "El PDF indica gráficos de tarta para mostrar visualmente los gastos por categoría y subcategoría."
    },
    {
      texto: "¿Cuál es el primer paso indispensable para crear una tabla dinámica en Excel?",
      tipo: "multi",
      opciones: [
        "Aplicar formato condicional", 
        "Seleccionar el rango de datos (tabla de origen)", 
        "Crear un gráfico previo", 
        "Proteger la hoja"
      ],
      correcta: 1,
      explicacion: "Siempre hay que seleccionar los datos (incluyendo encabezados) antes de ir a Insertar > Tabla dinámica."
    },
    {
      texto: "En el ejemplo de gastos del PDF, ¿qué campo se utiliza para hacer un análisis más detallado (por ejemplo, diferenciar Supermercado vs Restaurante)?",
      tipo: "multi",
      opciones: ["Fecha", "Categoría", "Subcategoría", "Precio"],
      correcta: 2,
      explicacion: "Subcategoría permite desglosar dentro de cada categoría (ej: Alimentación → Supermercado / Restaurante)."
    },
    {
      texto: "Cuando arrastras un campo numérico al área de VALORES, ¿qué operación aplica Excel por defecto?",
      tipo: "multi",
      opciones: ["Promedio", "Suma", "Conteo", "Máximo"],
      correcta: 1,
      explicacion: "Por defecto, Excel suma los valores numéricos, pero puedes cambiarlo a promedio, contar, etc."
    },
    {
      texto: "¿Cuál de estos elementos NO forma parte de la estructura básica de una tabla dinámica?",
      tipo: "multi",
      opciones: ["Filas", "Valores", "Columnas", "Formato condicional automático"],
      correcta: 3,
      explicacion: "El formato condicional no es una zona estructural; las áreas son FILAS, COLUMNAS, VALORES y FILTROS."
    },
    {
      texto: "¿Para qué sirve el gráfico dinámico asociado a una tabla dinámica?",
      tipo: "multi",
      opciones: [
        "Para ordenar alfabéticamente los datos", 
        "Para representar visualmente los resúmenes de la tabla dinámica y actualizarse automáticamente", 
        "Para exportar a PDF", 
        "Para fusionar celdas"
      ],
      correcta: 1,
      explicacion: "Un gráfico dinámico refleja los cambios de la tabla dinámica al filtrar o reorganizar los datos."
    }
  ];

  // Estados del juego
  let aciertosGlobal = 0;
  let respuestasRespondidas = new Array(preguntas.length).fill(false);

  function actualizarBarraGeneral() {
    const respondidasCount = respuestasRespondidas.filter(v => v === true).length;
    const porcentaje = (respondidasCount / preguntas.length) * 100;
    const barraElem = document.getElementById('barraProgreso');
    if (barraElem) barraElem.style.width = porcentaje + '%';
  }

  // Renderizado completo
  function renderizarTodasPreguntas() {
    const zona = document.getElementById('zonaPreguntas');
    zona.innerHTML = '';
    preguntas.forEach((preg, idx) => {
      const card = document.createElement('div');
      card.className = 'pregunta-card';
      card.id = `pregCard-${idx}`;
      if (idx !== 0) card.style.display = 'none';

      const letrasArray = preg.tipo === 'vf' ? ['V','F'] : ['A','B','C','D'];
      let opcionesHtml = '';
      preg.opciones.forEach((op, optIndex) => {
        opcionesHtml += `
          <button class="opcion" id="btnOpt-${idx}-${optIndex}" onclick="responderPregunta(${idx}, ${optIndex})">
            <span class="letra">${letrasArray[optIndex]}</span>
            <span>${escapeHTML(op)}</span>
          </button>
        `;
      });

      const textoBoton = (idx === preguntas.length - 1) ? '🏁 Ver resultados' : 'Siguiente pregunta →';

      card.innerHTML = `
        <div class="num-pregunta">Pregunta ${idx+1} / ${preguntas.length}</div>
        <div class="texto-pregunta">${escapeHTML(preg.texto)}</div>
        <div class="opciones">${opcionesHtml}</div>
        <div class="resultado-inline" id="resultadoDetalle-${idx}"></div>
        <div style="text-align:center;">
          <button class="btn-siguiente" id="btnSiguiente-${idx}" onclick="siguientePregunta(${idx})">${textoBoton}</button>
        </div>
      `;
      zona.appendChild(card);
    });
    actualizarBarraGeneral();
  }

  window.responderPregunta = function(pregId, optId) {
    if (respuestasRespondidas[pregId]) return;
    const preguntaActual = preguntas[pregId];
    const isCorrect = (optId === preguntaActual.correcta);
    respuestasRespondidas[pregId] = true;

    // Bloquear todas las opciones de esta pregunta
    for (let i = 0; i < preguntaActual.opciones.length; i++) {
      const btn = document.getElementById(`btnOpt-${pregId}-${i}`);
      if (btn) btn.disabled = true;
    }

    const botonElegido = document.getElementById(`btnOpt-${pregId}-${optId}`);
    const botonCorrecto = document.getElementById(`btnOpt-${pregId}-${preguntaActual.correcta}`);
    const resDiv = document.getElementById(`resultadoDetalle-${pregId}`);
    const letrasABC = preguntaActual.tipo === 'vf' ? ['V','F'] : ['A','B','C','D'];

    if (isCorrect) {
      aciertosGlobal++;
      botonElegido.classList.add('correcta');
      resDiv.className = 'resultado-inline acierto';
      resDiv.innerHTML = `🎉 ¡Correcto! ${escapeHTML(preguntaActual.explicacion)}`;
    } else {
      botonElegido.classList.add('incorrecta');
      if (botonCorrecto) botonCorrecto.classList.add('revelada');
      resDiv.className = 'resultado-inline fallo';
      resDiv.innerHTML = `❌ ¡Ups! La respuesta correcta es <strong>${letrasABC[preguntaActual.correcta]}</strong>. ${escapeHTML(preguntaActual.explicacion)}`;
    }

    const btnNext = document.getElementById(`btnSiguiente-${pregId}`);
    if (btnNext) btnNext.style.display = 'inline-block';
    actualizarBarraGeneral();
  };

  window.siguientePregunta = function(pregId) {
    const cardActual = document.getElementById(`pregCard-${pregId}`);
    if (cardActual) cardActual.style.display = 'none';
    const siguienteIndice = pregId + 1;
    if (siguienteIndice < preguntas.length) {
      const cardSiguiente = document.getElementById(`pregCard-${siguienteIndice}`);
      if (cardSiguiente) {
        cardSiguiente.style.display = 'block';
        cardSiguiente.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } else {
      mostrarPanelFinalGlobal();
    }
  };

  function mostrarPanelFinalGlobal() {
    const zonaPreg = document.getElementById('zonaPreguntas');
    if (zonaPreg) zonaPreg.style.display = 'none';
    const barraFinal = document.getElementById('barraProgreso');
    if (barraFinal) barraFinal.style.width = '100%';

    const totalPreg = preguntas.length;
    const fallos = totalPreg - aciertosGlobal;

    document.getElementById('puntajeFinal').innerText = aciertosGlobal;
    document.getElementById('deTotalText').innerHTML = `de ${totalPreg} preguntas correctas`;
    document.getElementById('aciertosChip').innerHTML = `✅ ${aciertosGlobal} acierto${aciertosGlobal !== 1 ? 's' : ''}`;
    document.getElementById('fallosChip').innerHTML = `❌ ${fallos} fallo${fallos !== 1 ? 's' : ''}`;

    let emojiTrofeo = '';
    let estrellasVal = '';
    let mensajeFinalTexto = '';

    if (aciertosGlobal === totalPreg) {
      emojiTrofeo = '🏆✨📊';
      estrellasVal = '★★★★★';
      mensajeFinalTexto = '¡Impecable! Sabes crear, agrupar y analizar con tablas dinámicas. ¡Eres un experto!';
    } else if (aciertosGlobal >= 8) {
      emojiTrofeo = '🥇📈';
      estrellasVal = '★★★★☆';
      mensajeFinalTexto = '¡Muy sólido! Controlas los fundamentos: insertar, arrastrar campos y gráficos de tarta. Revisa algún detalle y serás imparable.';
    } else if (aciertosGlobal >= 6) {
      emojiTrofeo = '🥈🧩';
      estrellasVal = '★★★☆☆';
      mensajeFinalTexto = 'Bien. Recuerda que la pestaña Insertar contiene la tabla dinámica, y el área de valores requiere un campo numérico. ¡Sigue mejorando!';
    } else if (aciertosGlobal >= 4) {
      emojiTrofeo = '🥉📚';
      estrellasVal = '★★☆☆☆';
      mensajeFinalTexto = 'Vas por buen camino. Repasa el PDF: pasos para agrupar por categoría/subcategoría y cómo generar los gráficos de pastel.';
    } else {
      emojiTrofeo = '📘🔄';
      estrellasVal = '★☆☆☆☆';
      mensajeFinalTexto = 'No te rindas. Vuelve a leer el material: seleccionar datos → Insertar → arrastrar campos a filas/valores. ¡A practicar!';
    }

    document.getElementById('trofeoIcon').innerText = emojiTrofeo;
    document.getElementById('estrellasFinal').innerText = estrellasVal;
    document.getElementById('mensajeFinalTxt').innerText = mensajeFinalTexto;

    const panelFinalDiv = document.getElementById('panelFinal');
    if (panelFinalDiv) panelFinalDiv.style.display = 'block';
    panelFinalDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  window.reiniciarQuiz = function() {
    aciertosGlobal = 0;
    respuestasRespondidas = new Array(preguntas.length).fill(false);
    const zonaPreg = document.getElementById('zonaPreguntas');
    if (zonaPreg) zonaPreg.style.display = 'block';
    const panel = document.getElementById('panelFinal');
    if (panel) panel.style.display = 'none';
    // Limpiar y volver a construir todo
    zonaPreg.innerHTML = '';
    renderizarTodasPreguntas();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  renderizarTodasPreguntas();
</script>
</body>

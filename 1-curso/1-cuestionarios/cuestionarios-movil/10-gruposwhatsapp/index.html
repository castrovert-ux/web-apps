<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1628">
<title>Prácticas en el móvil: Grupos de WhatsApp</title>
<style>
:root{--c1:#25D366;--c2:#128C7E;--c3:#FFD93D;--c4:#FF6B6B;--bg:#0a1628;--card:#111d35;--text:#fffffe;--sub:#a8b7d5;--soft:rgba(255,255,255,.045);--border:rgba(255,255,255,.12);--scale:1}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:calc(clamp(16px,.75rem + .65vw,23px)*var(--scale))/1.5 "Segoe UI",Arial,sans-serif}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.13}.b1{width:450px;height:450px;background:var(--c1);top:-130px;left:-100px}.b2{width:400px;height:400px;background:var(--c4);right:-120px;bottom:-120px}.b3{width:320px;height:320px;background:var(--c3);left:55%;top:45%}
header,main,footer{position:relative;z-index:1}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px clamp(16px,3vw,40px);border-bottom:1px solid var(--border)}.brand{flex:1 1 280px}.badge{display:inline-block;border-radius:99px;padding:4px 13px;background:linear-gradient(135deg,var(--c1),var(--c2));font-size:.68em;font-weight:800;letter-spacing:1px;text-transform:uppercase}.brand h1{margin:5px 0 0;font-size:1.45em;line-height:1.15;color:var(--c3)}.tools{display:flex;flex-wrap:wrap;gap:7px}button{font:inherit;font-size:.82em;font-weight:750;color:var(--text);background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:8px 13px;cursor:pointer}button:hover:not(:disabled){border-color:var(--c1);background:rgba(37,211,102,.12)}button:focus-visible,input:focus-visible{outline:3px solid var(--c3);outline-offset:2px}button:disabled{opacity:.35;cursor:default}main{flex:1;overflow:auto;padding:clamp(16px,3vh,32px) clamp(14px,4vw,56px)}.practice{max-width:1000px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:clamp(18px,3vw,36px)}.heading{display:flex;gap:16px;align-items:flex-start}.num{font-size:2.8em;line-height:1;font-weight:900;color:var(--c1);min-width:1em;text-align:right}.heading h2{font-size:1.35em;line-height:1.2;margin:0}.objective{margin:7px 0 0;color:var(--sub);font-weight:600}
.tip{padding:12px 15px;background:rgba(255,217,61,.09);border:1px solid rgba(255,217,61,.3);border-radius:12px;margin:18px 0}.tip strong{color:var(--c3)}
.work{margin-top:22px;padding:18px;border:1px solid rgba(37,211,102,.35);border-radius:16px;background:rgba(37,211,102,.055)}.work h3{margin:0 0 8px;font-size:1.05em}.work p{margin:6px 0 12px}.feedback{font-weight:800;margin-top:10px;min-height:1.5em}.ok{color:#6ee7a2}.muted{color:#FF6B6B;font-size:.9em}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}footer{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px clamp(14px,3vw,40px);border-top:1px solid var(--border);background:rgba(10,22,40,.85)}footer button{min-width:110px}.next{background:linear-gradient(135deg,var(--c3),#f59e0b);color:#172033;border:0}.progress{flex:1;min-width:100px;text-align:center;color:var(--sub);font-size:.85em;font-weight:800}.bar{height:7px;max-width:350px;margin:5px auto 0;background:var(--border);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c3));transition:width .25s}.panel{display:none;position:fixed;inset:0;z-index:10;background:rgba(4,10,22,.92);overflow:auto;padding:22px}.panel.open{display:block}.panelbox{max-width:900px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}.paneltop{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel h2{margin:0;color:var(--c1)}.index{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:15px}.index button{text-align:left}.index .current{border-color:var(--c1);background:rgba(37,211,102,.13)}.index b{display:inline-grid;place-items:center;margin-right:8px;width:28px;height:28px;border-radius:8px;background:var(--soft)}.small{font-size:.82em;color:var(--sub)}
/* Estilos adaptados para el cuestionario */
.steps label {padding:14px 16px; border:1px solid var(--border); border-radius:13px; background:var(--soft); display:flex; gap:14px; align-items:flex-start; cursor:pointer; transition: all 0.2s;}
.steps label:hover {border-color:var(--c1); background:rgba(37,211,102,.05);}
.steps label input {accent-color:var(--c1); transform:scale(1.3); margin-top:6px; cursor:pointer;}
@media(max-width:600px){header{align-items:flex-start}.heading{gap:10px}.num{font-size:2.2em}footer button{min-width:0;padding:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<header>
  <div class="brand"><span class="badge">📱 Cuestionario interactivo</span><h1>Grupos de WhatsApp</h1></div>
  <div class="tools"><button id="all">Todas las preguntas</button><button id="smaller" aria-label="Reducir letra">A−</button><button id="bigger" aria-label="Aumentar letra">A+</button><button id="full">Pantalla completa</button></div>
</header>
<main id="main"><article class="practice" id="practice" aria-live="polite"></article></main>
<footer>
  <button id="prev">← Anterior</button>
  <div class="progress"><span id="count"></span><div class="bar"><i id="fill"></i></div></div>
  <button class="next" id="next">Siguiente →</button>
</footer>

<div class="panel" id="listPanel" role="dialog" aria-modal="true" aria-labelledby="listTitle">
  <div class="panelbox">
    <div class="paneltop"><h2 id="listTitle">Índice de preguntas</h2><button data-close>Cerrar</button></div>
    <div class="index" id="index"></div>
  </div>
</div>

<script>
const P=[
{t:"Confirmación de lectura cruzada",o:"¿Puedo saber quién ha leído un mensaje escrito por OTRA persona en el grupo?",opts:["Sí, manteniendo pulsado cualquier mensaje de la conversación y tocando 'Info'.","No, esta información solo se puede consultar sobre los mensajes que has enviado tú mismo.","Sí, pero únicamente si eres uno de los administradores del grupo."],ans:1,f:"Importante: esta información solo se puede consultar sobre los mensajes que has enviado tú. No puedes abrir la información de un mensaje escrito por otra persona para averiguar quién lo ha leído."},
{t:"Privacidad de los enlaces de invitación",o:"¿Cuál es la principal precaución al invitar a un grupo mediante un enlace?",opts:["El enlace caduca automáticamente a las 24 horas y hay que estar generando uno nuevo constantemente.","Cualquier persona que tenga el enlace podría compartirlo con otras, por lo que no debe publicarse en lugares abiertos.","WhatsApp bloqueará temporalmente tu cuenta si envías el enlace a números que no tienes guardados en la agenda."],ans:1,f:"Cualquier persona que tenga un enlace de invitación podría compartirlo con otras. No publiques el enlace en lugares abiertos si el grupo es privado."},
{t:"Diferencia entre salir y eliminar",o:"Si decides borrar el chat grupal desde la pantalla principal de WhatsApp, ¿qué ocurre?",opts:["El grupo se elimina definitivamente y deja de existir para todos los participantes.","Solo se elimina el chat de tu teléfono; no borra el grupo ni los mensajes de los móviles de los demás.","Pasas a ser el administrador principal y el resto de usuarios quedan silenciados temporalmente."],ans:1,f:"Salir de un grupo no es lo mismo que eliminarlo. Eliminar el chat de tu lista solo lo quita de tu teléfono; no borra el grupo de los móviles de los demás."},
{t:"Control de los administradores",o:"Entre las herramientas avanzadas de un grupo, ¿qué pueden restringir los administradores?",opts:["Pueden decidir en los ajustes que solamente los administradores puedan enviar mensajes al grupo.","Pueden leer los mensajes privados directos que se intercambian los miembros del grupo entre sí.","Pueden establecer un límite máximo de fotografías que cada usuario puede enviar al día."],ans:0,f:"Según la configuración de permisos, los administradores pueden decidir quién puede enviar mensajes: si todos los participantes o solamente los administradores."},
{t:"Responder sin generar confusión",o:"¿Cuál es la mejor forma de contestar a un mensaje concreto enviado hace varias horas?",opts:["Escribir el mensaje en letras mayúsculas para que destaque visualmente sobre la conversación actual.","Copiar el texto del mensaje antiguo y pegarlo antes de escribir tu propia respuesta.","Mantener pulsado el mensaje original y pulsar 'Responder', para que tu contestación aparezca vinculada."],ans:2,f:"La respuesta aparecerá vinculada al mensaje original. Si alguien pulsa sobre esa referencia, podrá localizar inmediatamente el mensaje al que se está contestando."},
{t:"Significado de las marcas de lectura",o:"¿Qué significa exactamente que un mensaje que has enviado al grupo tenga dos marcas (checks) grises?",opts:["Que el mensaje se ha entregado a los dispositivos de todos los participantes, pero todavía no todos lo han abierto.","Que el mensaje ha sido leído por absolutamente todos los miembros del grupo.","Que hay un error general de conexión y el mensaje no ha podido salir de los servidores de WhatsApp."],ans:0,f:"Las dos marcas grises indican que el mensaje se ha entregado a todos los participantes; las dos marcas azules indican que todos lo han leído."},
{t:"Llamar la atención de alguien",o:"En un grupo con mucha actividad, ¿cómo te diriges expresamente a una persona para que reciba el aviso?",opts:["Escribiendo su nombre completo y apellidos en mayúsculas al principio del mensaje.","Escribiendo el símbolo @ en el cuadro de texto y seleccionando su nombre en la lista que aparece.","Manteniendo pulsado el icono de llamada y diciendo su nombre en voz alta antes de escribir."],ans:1,f:"Si quieres dirigirte expresamente a una persona del grupo, puedes mencionarla escribiendo el símbolo @. Así le resultará más fácil identificar que el mensaje va dirigido a ella."}
];

let current=0,scale=1;const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  const x=P[current];
  $('practice').innerHTML=`
    <div class="heading">
      <div class="num">${current+1}</div>
      <div><h2>${esc(x.t)}</h2><p class="objective">${esc(x.o)}</p></div>
    </div>
    <div class="steps" style="display:flex;flex-direction:column;gap:12px;margin:24px 0;">
      ${x.opts.map((opt, i) => `
        <label>
          <input type="radio" name="q" value="${i}">
          <span>${esc(opt)}</span>
        </label>
      `).join('')}
    </div>
    <p class="tip" id="tip" style="display:none; margin-top:16px;"><strong>💡 Explicación de la guía:</strong> ${esc(x.f)}</p>
    <section class="work">
      <div class="feedback" id="feedback" aria-live="polite" style="margin-bottom:12px;">Selecciona una respuesta y pulsa Confirmar.</div>
      <div class="row"><button id="confirm">Confirmar respuesta</button></div>
    </section>`;
    
  $('count').textContent=`Pregunta ${current+1} de ${P.length}`;
  $('fill').style.width=((current+1)/P.length*100)+'%';
  $('prev').disabled=current===0;
  $('next').disabled=current===P.length-1;
  $('main').scrollTop=0;
  document.title=`${current+1}. ${x.t} · Test de WhatsApp`;

  $('confirm').onclick=()=>{
    const sel = document.querySelector('input[name="q"]:checked');
    if(!sel){
      $('feedback').textContent='Por favor, marca una opción antes de confirmar.';
      $('feedback').className='feedback muted';
      return;
    }
    const isCorrect = parseInt(sel.value) === x.ans;
    if(isCorrect){
      $('feedback').textContent='¡Correcto! Respuesta acertada.';
      $('feedback').className='feedback ok';
      $('tip').style.display='block';
      document.querySelectorAll('input[name="q"]').forEach(i => i.disabled = true);
      $('confirm').disabled = true;
    } else {
      $('feedback').textContent='Respuesta incorrecta. Lee detenidamente las opciones e inténtalo de nuevo.';
      $('feedback').className='feedback muted';
      $('tip').style.display='none';
    }
  }
}

function go(n){current=Math.max(0,Math.min(P.length-1,n));render()}
function openPanel(id){$(id).classList.add('open');$(id).querySelector('button').focus()}
function closePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'))}

$('prev').onclick=()=>go(current-1);
$('next').onclick=()=>go(current+1);
$('all').onclick=()=> {
  $('index').innerHTML=P.map((p,i)=>`<button data-go="${i}" class="${i===current?'current':''}"><b>${i+1}</b>${esc(p.t)}</button>`).join('');
  openPanel('listPanel');
};

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePanels);
document.querySelectorAll('.panel').forEach(p=>p.addEventListener('click',e=>{
  if(e.target===p) closePanels();
  const b=e.target.closest('[data-go]');
  if(b){go(+b.dataset.go);closePanels();}
}));

$('smaller').onclick=()=>{scale=Math.max(.75,+(scale-.1).toFixed(1));document.documentElement.style.setProperty('--scale',scale)};
$('bigger').onclick=()=>{scale=Math.min(1.5,+(scale+.1).toFixed(1));document.documentElement.style.setProperty('--scale',scale)};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa'});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanels();return}
  if(document.querySelector('.panel.open')) return;
  if(e.target.matches('input')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Organizar carpeta Descargas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #217346; --c2: #1a5c38; --c3: #FFD93D; --c4: #FF6B6B;
    --c5: #6BCB77; --bg: #0a1628; --card: #111d35; --text: #FFFFFE; --sub: #8a9bbf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* La escala se controla con --k a través de la función fit() */
  html { font-size: calc(16px * var(--k, 1)); }
  body {
    font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }

  .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { width: 550px; height: 550px; background: var(--c1); top: -120px; left: -100px; }
  .blob:nth-child(2) { width: 400px; height: 400px; background: var(--c4); bottom: -100px; right: -80px; animation-delay: -5s; }
  .blob:nth-child(3) { width: 320px; height: 320px; background: var(--c3); top: 45%; left: 55%; animation-delay: -9s; }

  @keyframes float { from { transform: translate(0,0); } to { transform: translate(25px, 18px); } }

  .container { 
    position: relative; z-index: 1; 
    width: 100%; max-width: 800px; 
    height: 100vh; max-height: 100vh; 
    display: flex; flex-direction: column; 
    padding: 2vh 20px; 
  }

  .header { text-align: center; margin-bottom: 2vh; flex-shrink: 0; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-weight: 800; font-size: clamp(0.7rem, 1.5vh, 0.8rem); letter-spacing: 2px;
    text-transform: uppercase; padding: 0.6vh 12px; border-radius: 100px; margin-bottom: 1vh;
  }
  h1 {
    font-family: 'Fredoka One', cursive; font-size: clamp(1.4rem, 4vh, 2.2rem);
    background: linear-gradient(135deg, var(--c1), var(--c3), var(--c4));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5vh;
  }

  #quiz-area { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .progress-wrap { margin-bottom: 2vh; flex-shrink: 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); width: 0%; transition: width 0.4s ease; }

  .question-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px; padding: 3vh; margin-bottom: 2vh;
    animation: fadeIn 0.35s ease;
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }

  .q-type-badge {
    display: inline-flex; font-size: clamp(0.65rem, 1.2vh, 0.75rem); font-weight: 800; text-transform: uppercase;
    padding: 4px 12px; border-radius: 100px; margin-bottom: 1vh;
    background: rgba(33,115,70,0.2); color: #4ade80; flex-shrink: 0; align-self: flex-start;
  }

  .q-number { font-size: clamp(0.75rem, 1.5vh, 0.85rem); color: var(--sub); font-weight: 700; margin-bottom: 0.5vh; flex-shrink: 0; }
  .q-text { font-size: clamp(1rem, 2.2vh, 1.2rem); font-weight: 700; line-height: 1.3; margin-bottom: 2vh; flex-shrink: 0; }

  .options { 
    display: flex; flex-direction: column; gap: 1vh; 
    overflow-y: auto; flex: 1; padding-right: 10px; 
  }
  
  .options::-webkit-scrollbar { width: 6px; }
  .options::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
  .options::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
  .options::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  .option-btn {
    background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 1.5vh 15px; color: var(--text);
    font-size: clamp(0.9rem, 2vh, 1rem); font-weight: 600; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: 0.2s; flex-shrink: 0;
  }
  .option-btn:hover:not(:disabled) { background: rgba(33,115,70,0.15); border-color: var(--c1); transform: translateX(5px); }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; flex-shrink: 0;
  }

  .option-btn.correct { background: rgba(33,115,70,0.3); border-color: var(--c1); }
  .option-btn.wrong { background: rgba(255,107,107,0.2); border-color: var(--c4); }

  .feedback { display: none; margin-top: 1.5vh; padding: 1.5vh; border-radius: 12px; font-weight: 700; font-size: clamp(0.85rem, 1.8vh, 0.95rem); line-height: 1.4; animation: fadeIn 0.3s ease; flex-shrink: 0; }
  .feedback.correct-fb { display: block; background: rgba(33,115,70,0.2); color: var(--c5); border: 1px solid var(--c1); }
  .feedback.wrong-fb { display: block; background: rgba(255,107,107,0.15); color: var(--c4); border: 1px solid var(--c4); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .btn-next {
    display: none; width: 100%; max-width: 220px; margin: 0 0 0 auto;
    padding: 1.5vh; border-radius: 12px; border: none; font-weight: 800; font-family: inherit;
    background: linear-gradient(135deg, var(--c3), #f59e0b); color: #0a1628; cursor: pointer;
    transition: 0.2s; flex-shrink: 0; font-size: clamp(0.9rem, 2vh, 1rem);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.25); }

  .results { display: none; text-align: center; animation: fadeIn 0.4s ease; flex-direction: column; justify-content: center; align-items: center; flex: 1; }
  .score-circle {
    width: clamp(110px, 20vh, 150px); height: clamp(110px, 20vh, 150px); border-radius: 50%; border: 8px solid var(--c1);
    display: flex; align-items: center; justify-content: center; margin: 2vh auto;
    font-size: clamp(1.8rem, 4vh, 2.2rem); font-family: 'Fredoka One'; flex-direction: column; line-height: 1.1;
  }
  .score-circle small { font-family: 'Nunito'; font-size: clamp(0.7rem, 1.5vh, 0.9rem); color: var(--sub); font-weight: 700; }
  .hidden { display: none !important; }

  .result-sub { color: var(--sub); font-weight: 700; margin-top: 1vh; font-size: clamp(0.85rem, 1.8vh, 1rem); }
  .btn-restart { margin-top: 3vh; cursor: pointer; border: none; font-family: inherit; font-size: clamp(0.9rem, 2vh, 1rem); padding: 1.5vh 20px; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="container">
  <div class="header">
    <div class="badge" id="quiz-badge">📁 Curso de Móvil</div>
    <h1 id="quiz-title">Organizar carpeta Descargas</h1>
  </div>

  <div id="quiz-area">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Pregunta 1 de 10</span>
        <span id="prog-score">⭐ 0 pts</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>

    <div class="question-card">
      <div class="q-type-badge" id="q-type">🎯 Opción múltiple</div>
      <div class="q-number" id="q-number">Cargando...</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options" class="options"></div>
      <div id="q-feedback" class="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente →</button>
  </div>

  <div class="results" id="results">
    <div style="font-size: 4rem;" id="result-emoji">🏆</div>
    <div class="score-circle" id="score-num">0/10</div>
    <h2 id="result-msg"></h2>
    <p class="result-sub" id="result-sub"></p>
    <button class="badge btn-restart" onclick="restartQuiz()">🔄 Reiniciar Quiz</button>
  </div>
</div>

<script>
const questions = [
  {
    "q": "¿Cuál es el primer paso obligatorio antes de crear carpetas o mover archivos?",
    "options": [
      "Abrir la aplicación 'Ajustes' del teléfono",
      "Abrir la app 'Archivos' o 'Mis Archivos' y entrar en la carpeta 'Descargas'",
      "Conectar el móvil al ordenador por cable USB"
    ],
    "correct": 1,
    "expl": "Primero hay que abrir el gestor de archivos y acceder a la carpeta Descargas para ver qué hay dentro."
  },
  {
    "q": "Estás dentro de la carpeta 'Descargas' y quieres crear una carpeta nueva para guardar facturas. ¿Qué debes buscar habitualmente?",
    "options": [
      "Un botón que dice 'Nuevo archivo'",
      "Un icono con símbolo '+' o la opción 'Nueva Carpeta'",
      "La opción 'Compartir' en el menú de tres puntos"
    ],
    "correct": 1,
    "expl": "La opción para crear carpetas suele ser un icono '+' o un botón que dice 'Nueva Carpeta'."
  },
  {
    "q": "Has mantenido pulsado un archivo PDF bancario en 'Descargas' y has tocado 'Mover'. ¿Cuál es el siguiente paso exacto?",
    "options": [
      "Tocar 'Copiar aquí' en la misma pantalla",
      "Navegar hasta la carpeta 'Bancos' que creaste y tocar 'Mover aquí'",
      "Pulsar el botón de 'Inicio' para salir de la aplicación"
    ],
    "correct": 1,
    "expl": "Tras tocar 'Mover', hay que ir a la carpeta de destino (ej. Bancos) y confirmar con 'Mover aquí'."
  },
  {
    "q": "¿Qué ocurre si mueves un archivo a una carpeta equivocada por error?",
    "options": [
      "El archivo se borra automáticamente y no se puede recuperar",
      "El archivo se queda en 'Descargas' y en la carpeta equivocada a la vez",
      "Puedes repetir el proceso de moverlo para colocarlo en la carpeta correcta"
    ],
    "correct": 2,
    "expl": "El documento dice que si un archivo está en la carpeta equivocada, puedes repetir el proceso de moverlo."
  },
  {
    "q": "Encuentras en 'Descargas' un instalador de una app (archivo .apk) que ya instalaste y no necesitas. Según los consejos finales, ¿qué debes hacer?",
    "options": [
      "Moverlo a una carpeta llamada 'Basura' que debes crear",
      "Dejarlo en 'Descargas' por si acaso falla la app instalada",
      "Eliminarlo tocando en la opción 'Eliminar' para liberar espacio"
    ],
    "correct": 2,
    "expl": "El consejo final indica borrar archivos innecesarios usando la opción 'Eliminar'."
  },
  {
    "q": "¿Es obligatorio crear las carpetas 'Bancos', 'Música', 'Fotos' y 'Facturas' exactamente con esos nombres?",
    "options": [
      "Sí, el sistema solo reconoce esos cuatro nombres predeterminados",
      "No, son solo ejemplos; debes crear las carpetas que necesites con los nombres que quieras",
      "Solo son obligatorias 'Bancos' y 'Facturas'; las otras son opcionales"
    ],
    "correct": 1,
    "expl": "El texto dice 'Crea todas las carpetas necesarias según tus necesidades' y pone esos nombres como ejemplos."
  },
  {
    "q": "Tras organizar varios archivos, ¿cómo verificas que todo está correcto según el Paso 4?",
    "options": [
      "Reiniciando el móvil para que se actualicen los cambios",
      "Volviendo al inicio de la app de archivos y entrando en cada carpeta a comprobar",
      "Buscando los archivos en la aplicación 'Galería' del móvil"
    ],
    "correct": 1,
    "expl": "El Paso 4 indica volver al inicio de la app y entrar en cada carpeta para asegurarse de que están en su sitio."
  },
  {
    "q": "Mantienes pulsado un archivo para moverlo, pero en el menú que aparece solo ves 'Copiar' y 'Compartir', no ves 'Mover'. ¿Qué es lo más probable?",
    "options": [
      "Ese archivo no se puede mover, solo copiar",
      "La opción 'Mover' puede llamarse 'Mover a' o estar en un menú desplegable (tres puntos)",
      "Debes apagar y encender el móvil para que aparezca la opción"
    ],
    "correct": 1,
    "expl": "El texto dice 'Toca la opción Mover o Mover a'; el nombre exacto varía según el modelo de teléfono."
  },
  {
    "q": "La aplicación para gestionar archivos siempre se llama exactamente 'Archivos' en todos los móviles Android.",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. El documento aclara que puede llamarse 'Archivos' o 'Mis Archivos' según el modelo del teléfono."
  },
  {
    "q": "Si creas una carpeta nueva dentro de 'Descargas', esta carpeta aparecerá automáticamente en la pantalla principal del móvil (escritorio).",
    "options": [
      "Verdadero",
      "Falso"
    ],
    "correct": 1,
    "type": "boolean",
    "expl": "Falso. Las carpetas creadas en el gestor de archivos son internas; no crean accesos directos en el escritorio del móvil."
  }
];
const TOTAL = questions.length;

let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const qData = questions[currentIdx];

  document.getElementById('q-type').textContent =
    qData.type === 'boolean' ? '✅ Verdadero o Falso' : '🎯 Opción múltiple';
  document.getElementById('q-number').textContent = `Pregunta ${currentIdx + 1}`;
  document.getElementById('q-text').textContent = qData.q;
  document.getElementById('btn-next').style.display = 'none';

  const fb = document.getElementById('q-feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  const optionsDiv = document.getElementById('q-options');
  optionsDiv.innerHTML = '';

  qData.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(i);
    optionsDiv.appendChild(btn);
  });

  const pct = (currentIdx / TOTAL) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Pregunta ${currentIdx + 1} de ${TOTAL}`;
  document.getElementById('btn-next').textContent =
    currentIdx === TOTAL - 1 ? 'Ver resultados 🏁' : 'Siguiente →';
    
  fit(true);
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  const qData = questions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  const fb = document.getElementById('q-feedback');

  btns.forEach(b => b.disabled = true);

  if (idx === qData.correct) {
    btns[idx].classList.add('correct');
    score++;
    fb.innerHTML = `<strong>🎉 ¡Correcto!</strong><br>${qData.expl}`;
    fb.className = 'feedback correct-fb';
  } else {
    btns[idx].classList.add('wrong');
    btns[qData.correct].classList.add('correct');
    fb.innerHTML = `<strong>💡 Nota:</strong><br>${qData.expl}`;
    fb.className = 'feedback wrong-fb';
  }

  document.getElementById('prog-score').textContent = `⭐ ${score} pts`;
  fb.style.display = 'block';
  document.getElementById('btn-next').style.display = 'block';
  fit(false);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < TOTAL) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.documentElement.style.setProperty('--k', 1);
  document.getElementById('results').style.display = 'flex';

  const pct = Math.round((score / TOTAL) * 100);
  document.getElementById('score-num').innerHTML = `${score}/${TOTAL}<small>${pct}%</small>`;

  let emoji, msg, sub;
  if (pct === 100)    { emoji = '🏆'; msg = "¡Perfecto! Tu carpeta Descargas está impecable";  sub = 'Respondiste todo correctamente.'; }
  else if (pct >= 80) { emoji = '🌟'; msg = '¡Excelente, sigue así!';     sub = 'Solo te faltó un detalle.'; }
  else if (pct >= 60) { emoji = '👍'; msg = '¡Buen trabajo!';             sub = 'Vas por buen camino, repasa lo fallado.'; }
  else if (pct >= 40) { emoji = '📚'; msg = 'Repasa un poco más';         sub = 'Vuelve a leer el material y reinténtalo.'; }
  else                { emoji = '💪'; msg = '¡No te rindas!';             sub = 'Revisa el tema desde el principio.'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('prog-fill').style.width = '100%';
}

function restartQuiz() {
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('prog-score').textContent = '⭐ 0 pts';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-area').classList.remove('hidden');
  loadQuestion();
}

/* Función que se encarga de reducir la escala si la pregunta es excesivamente grande */
function fit(reset) {
  const root = document.documentElement;
  const card = document.querySelector('.question-card');
  if (!card || !card.clientHeight) return;
  let k = reset ? 1 : (parseFloat(root.style.getPropertyValue('--k')) || 1);
  root.style.setProperty('--k', k);
  while (k > 0.55 && card.scrollHeight > card.clientHeight + 1) {
    k = Math.round((k - 0.04) * 100) / 100;
    root.style.setProperty('--k', k);
  }
}
window.addEventListener('resize', () => fit(!answered));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(!answered));

window.onload = loadQuestion;
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Directorio</title>
  <style>
    body {
      font-family: system-ui, Arial;
      margin: 40px;
      background: #f7f7f7;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 8px 0;
      padding: 8px;
      background: white;
      border-radius: 6px;
    }
    a {
      text-decoration: none;
      color: #0366d6;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>📂 Contenido del directorio</h1>
<ul id="files"></ul>

<script>
  async function loadRepo() {
    // CAMBIA ESTO por tu repo
    const api = "https://api.github.com/repos/castrovert-ux/web-apps/contents/viajeaitalia";

    const res = await fetch(api);
    const data = await res.json();

    const list = document.getElementById("files");

    data.forEach(item => {
      const li = document.createElement("li");
      const a = document.createElement("a");

      a.href = item.path; // navega dentro del mismo Pages
      a.textContent = (item.type === "dir" ? "📁 " : "📄 ") + item.name;

      li.appendChild(a);
      list.appendChild(li);
    });
  }

  loadRepo();
</script>

</body>
</html>

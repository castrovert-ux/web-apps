<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivos Privados</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ddd;
      text-align: center;
      padding: 50px;
    }
    .login {
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      background: #1f1f1f;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      padding: 12px 25px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    .content {
      display: none;
      text-align: left;
      max-width: 800px;
      margin: 30px auto;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 10px;
      background: #1f1f1f;
      margin: 5px 0;
      border-radius: 5px;
    }
    a {
      color: #4da6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .folder { color: #ffd700; }
  </style>
</head>
<body>

  <!-- Pantalla de login -->
  <div id="loginScreen" class="login">
    <h2>🔒 Acceso Restringido</h2>
    <p>Introduce la contraseña</p>
    <input type="password" id="password" placeholder="Contraseña">
    <br>
    <button onclick="checkPassword()">Entrar</button>
    <p id="error" style="color:red; margin-top:10px;"></p>
  </div>

  <!-- Contenido (lista de archivos) -->
  <div id="content" class="content">
    <h2>📁 Contenido de la carpeta</h2>
    <ul id="fileList">
      <!-- Aquí puedes añadir tus archivos y carpetas -->
      <li><a href="documento.pdf" class="folder">📄 documento.pdf</a></li>
      <li><a href="imagenes/" class="folder">📁 imagenes</a></li>
      <li><a href="proyecto.zip">📦 proyecto.zip</a></li>
      <li><a href="notas.txt">📝 notas.txt</a></li>
      <li><a href="subcarpeta/">📁 subcarpeta</a></li>
    </ul>
    <br>
    <button onclick="logout()">Cerrar Sesión</button>
  </div>

  <script>
    const correctPassword = "tu_contraseña_aqui"; // ← Cambia esto

    function checkPassword() {
      const input = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (input === correctPassword) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("content").style.display = "block";
      } else {
        error.textContent = "Contraseña incorrecta";
        document.getElementById("password").value = "";
      }
    }

    function logout() {
      document.getElementById("content").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("password").value = "";
      document.getElementById("error").textContent = "";
    }

    // Permitir pulsar Enter
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPassword();
    });
  </script>

</body>
</html>

  $('diff-sub').textContent = `${c.tName} → ${c.bName}`;
  const items = c.diff.items.filter(it => !only || it.t !== 'eq');
  $('diff-body').innerHTML = `<p class="dsum" style="margin-bottom:10px">${c.diff.cambios} cambio${c.diff.cambios === 1 ? '' : 's'}. En rojo tachado, lo que se ha quitado; en verde, lo que se ha añadido. Las llamadas de nota no se tienen en cuenta.</p>` +
    items.map(it => `<div class="dpar ${it.t}">${it.html}</div>`).join('');
}

// ═════════════════════════════════════════════
//  EJECUCIÓN
// ═════════════════════════════════════════════
function firstMessage(id){
  const s = stepById(id), chap = $('chapter').value.trim();
  let t = `Nombre corto del capítulo: «${chap}». Úsalo como nombre base de los ficheros que entregues.\n\n` +
    'Nota de la aplicación: esta tarea se hace a través de una aplicación y no puedes crear ficheros. ' +
    'Entrega cada fichero de la forma que tu prompt indica para cuando no se pueden crear ficheros, con su nombre de fichero.\n\n';
  s.slots.forEach(sl => {
    const f = slotFile(id, sl);
    t += `=== ${sl.label.toUpperCase()} — fichero «${f.name}» ===\n\n${f.text}\n\n=== FIN DE ${sl.label.toUpperCase()} ===\n\n`;
  });
  return t + 'Empieza.';
}
function startStep(id){
  if (missingFor(id).length) return;
  const st = state.steps[id], s = stepById(id);
  st.used = {}; s.slots.forEach(sl => { const f = slotFile(id, sl); st.used[sl.key] = {name:f.name, text:f.text, from:f.from}; });
  st.locked = {...modelChoice[id]}; st.prompt = getPrompt(s.promptKey);
  st.messages = [{role:'user', kind:'files', content:firstMessage(id),
    summary:'Enviado: ' + s.slots.map(sl => `${st.used[sl.key].name} (${kb(st.used[sl.key].text)})`).join(' · ')}];
  st.error = null; autoCount[id] = 0; saveState(); renderAll(); runAssistant(id);
}
function sendUser(id){
  const t = $('input-' + id), text = t.value.trim();
  if (!text || running[id]) return;
  state.steps[id].messages.push({role:'user', content:text}); state.steps[id].error = null;
  t.value = ''; autoGrow(t); saveState(); renderChat(id); runAssistant(id);
}
function resetStep(id){
  const later = STEPS.filter(x => x.num > stepById(id).num && state.steps[x.id].messages.length);
  if (!confirm('Se borrará la ejecución de este paso y sus resultados (descarga antes lo que quieras conservar).' + (later.length ? ' Los pasos siguientes ya ejecutados no cambian.' : '') + ' ¿Seguir?')) return;
  stopStep(id); const files = state.steps[id].files;
  state.steps[id] = blankStep(); state.steps[id].files = files; delete checkCache[id];
  saveState(); renderAll();
}
function newChapter(){
  if (!confirm('Se borrarán los ficheros de partida, las ejecuciones y los resultados de los cuatro pasos. Descarga antes lo que quieras conservar. ¿Empezar un capítulo nuevo?')) return;
  STEPS.forEach(s => stopStep(s.id)); state = blankState(); $('chapter').value = '';
  Object.keys(checkCache).forEach(k => delete checkCache[k]); saveState(true); buildSteps();
}
function stopStep(id){ if (running[id]) running[id].abort(); }
function retry(id){ state.steps[id].error = null; runAssistant(id); }

async function runAssistant(id){
  const st = state.steps[id], {provider, model} = st.locked;
  const label = PROVIDERS[provider].label + ' · ' + ((modelList(provider).find(m => m.id === model) || {}).label || model);
  const history = st.messages.map(m => ({role:m.role, content:m.content}));
  const msg = {role:'assistant', content:'', streaming:true, modelLabel:label};
  st.messages.push(msg);
  const ctrl = new AbortController(); running[id] = ctrl;
  renderChat(id); renderActions(id); renderComposer(id); renderTabs();
  let pending = false, aborted = false;
  const repaint = () => { if (pending) return; pending = true; requestAnimationFrame(() => {
    pending = false; const c = $('chat-' + id), atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
    renderChat(id, true); if (atBottom) scrollChat(id); }); };
  try {
    const res = await callModel({provider, model, system:st.prompt, messages:history, signal:ctrl.signal,
      onText:t => { msg.content += t; repaint(); }, onThinking:() => { if (!msg.thinking){ msg.thinking = true; repaint(); } }});
    if (res.truncated) msg.note = 'La respuesta se ha cortado por llegar al límite de longitud. Escribe «continúa» abajo para que siga.';
    if (!msg.content.trim()) throw new Error('El modelo ha devuelto una respuesta vacía.');
  } catch(e){
    if (e.name === 'AbortError'){ aborted = true; if (msg.content.trim()) msg.note = 'Ejecución detenida.'; else st.messages.pop(); }
    else { if (!msg.content.trim()) st.messages.pop(); else msg.note = 'La respuesta se interrumpió por un error.'; st.error = describeError(e); }
  } finally {
    delete msg.streaming; delete msg.thinking; delete running[id];
    saveState(true); renderAll();
  }
  // El Corrector entrega los textos largos por partes: se le pide que siga
  if (stepById(id).autoContinue && !aborted && !st.error && RE_CONT.test(msg.content) && (autoCount[id] = (autoCount[id] || 0) + 1) <= 20){
    st.messages.push({role:'user', content:'sigue', auto:true}); saveState(); runAssistant(id);
  }
}
function describeError(e){
  const m = e.message || String(e);
  if (/Failed to fetch|NetworkError|CORS/i.test(m)) return 'No se ha podido conectar con la API (sin red, o la API no acepta llamadas desde el navegador). ' + m;
  return m;
}

// ═════════════════════════════════════════════
//  LLAMADAS A LAS APIS (con streaming)
// ═════════════════════════════════════════════
async function* sseData(resp, signal){
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true){
    if (signal.aborted){ reader.cancel(); throw new DOMException('Detenido', 'AbortError'); }
    const {done, value} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true}); let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).replace(/\r$/, ''); buf = buf.slice(i + 1);
      if (line.startsWith('data:')){ const d = line.slice(5).trim(); if (d && d !== '[DONE]') yield d; }
    }
  }
}
async function httpError(resp, who){
  let detail = '';
  try { const j = await resp.json(); detail = (j.error && (j.error.message || j.error)) || j.message || JSON.stringify(j); }
  catch(e){ try { detail = await resp.text(); } catch(_){} }
  if (typeof detail === 'object') detail = JSON.stringify(detail);
  return new Error(`${who} (${resp.status}): ${String(detail).slice(0, 400)}`);
}
function needKey(id){
  const k = getKey(id);
  if (!k){ openKeys(id); throw new Error('Falta la clave de ' + KEYS.find(x => x.id === id).label + '. Añádela y pulsa «Reintentar».'); }
  return k;
}
function callModel(o){
  if (o.provider === 'claude') return callClaude(o);
  if (o.provider === 'aistudio') return callGemini(o);
  return callOpenAICompat(o, {
    openrouter:{url:'https://openrouter.ai/api/v1/chat/completions', who:'OpenRouter', max:null},
    deepseek:  {url:'https://api.deepseek.com/chat/completions', who:'DeepSeek', max:32768},
    mistral:   {url:'https://api.mistral.ai/v1/chat/completions', who:'Mistral', max:16000},
    groq:      {url:'https://api.groq.com/openai/v1/chat/completions', who:'Groq', max:16000},
  }[o.provider]);
}
async function callClaude({model, system, messages, signal, onText, onThinking}){
  const key = needKey('claude');
  const msgs = messages.map((m, i) => {
    const cache = i === 0 || (i === messages.length - 1 && m.role === 'user');
    return {role:m.role, content:[cache ? {type:'text', text:m.content, cache_control:{type:'ephemeral'}} : {type:'text', text:m.content}]};
  });
  const resp = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal,
    headers:{'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model, max_tokens:32000, stream:true, system:[{type:'text', text:system, cache_control:{type:'ephemeral'}}], messages:msgs})});
  if (!resp.ok) throw await httpError(resp, 'Claude');
  let truncated = false;
  for await (const d of sseData(resp, signal)){
    let j; try { j = JSON.parse(d); } catch(e){ continue; }
    if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') onText(j.delta.text);
    else if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'thinking_delta' && onThinking) onThinking();
    else if (j.type === 'message_delta' && j.delta && j.delta.stop_reason === 'max_tokens') truncated = true;
    else if (j.type === 'error') throw new Error('Claude: ' + (j.error && j.error.message || 'error en la respuesta'));
  }
  return {truncated};
}
async function callGemini({model, system, messages, signal, onText, onThinking}){
  const key = needKey('aistudio');
  const info = (loadJSON(LS.gemList) || []).find(m => m.id === model);
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
    method:'POST', signal, headers:{'Content-Type':'application/json', 'x-goog-api-key':key},
    body:JSON.stringify({systemInstruction:{parts:[{text:system}]},
      contents:messages.map(m => ({role:m.role === 'assistant' ? 'model' : 'user', parts:[{text:m.content}]})),
      generationConfig:{maxOutputTokens:Math.min((info && info.out) ? info.out : 65536, 65536)}})});
  if (!resp.ok) throw await httpError(resp, 'AI Studio');
  let truncated = false;
  for await (const d of sseData(resp, signal)){
    let j; try { j = JSON.parse(d); } catch(e){ continue; }
    if (j.error) throw new Error('AI Studio: ' + j.error.message);
    const c = j.candidates && j.candidates[0]; if (!c) continue;
    ((c.content && c.content.parts) || []).forEach(p => { if (p.text && !p.thought) onText(p.text); else if (p.thought && onThinking) onThinking(); });
    if (c.finishReason === 'MAX_TOKENS') truncated = true;
  }
  return {truncated};
}
async function callOpenAICompat({provider, model, system, messages, signal, onText, onThinking}, cfg){
  const key = needKey(provider);
  const headers = {'Content-Type':'application/json', 'Authorization':'Bearer ' + key};
  if (provider === 'openrouter'){ headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Edicion Castroverde'; }
  const body = {model, stream:true, messages:[{role:'system', content:system}, ...messages]};
  if (cfg.max) body.max_tokens = cfg.max;
  const resp = await fetch(cfg.url, {method:'POST', signal, headers, body:JSON.stringify(body)});
  if (!resp.ok) throw await httpError(resp, cfg.who);
  let truncated = false;
  for await (const d of sseData(resp, signal)){
    let j; try { j = JSON.parse(d); } catch(e){ continue; }
    if (j.error) throw new Error(cfg.who + ': ' + (j.error.message || JSON.stringify(j.error)));
    const ch = j.choices && j.choices[0]; if (!ch) continue;
    const dl = ch.delta || {};
    if (dl.reasoning_content || dl.reasoning) onThinking();
    if (typeof dl.content === 'string' && dl.content) onText(dl.content);
    else if (Array.isArray(dl.content)) dl.content.forEach(c => {
      if (c.type === 'text' && c.text) onText(c.text); else if (c.type === 'thinking') onThinking();
    });
    if (ch.finish_reason === 'length') truncated = true;
  }
  return {truncated};
}

// ═════════════════════════════════════════════
//  CLAVES
// ═════════════════════════════════════════════
function openKeys(focusId){
  $('keys-body').innerHTML = '<p class="keynote">Se guardan solo en este navegador. Son las mismas que usan tus otras aplicaciones.</p>' +
    KEYS.map(k => `<div class="keyrow"><label for="key-${k.id}">${k.label}</label><input id="key-${k.id}" type="password" autocomplete="off" spellcheck="false" value="${esc(getKey(k.id))}"></div>`).join('');
  $('showkeys').checked = false; openOv('ov-keys');
  setTimeout(() => { const el = $('key-' + (typeof focusId === 'string' ? focusId : 'claude')); if (el) el.focus(); }, 60);
}
function toggleShowKeys(){ const t = $('showkeys').checked ? 'text' : 'password'; KEYS.forEach(k => $('key-' + k.id).type = t); }
function saveKeys(){
  const oldFb = getKey('firebase');
  KEYS.forEach(k => { const v = $('key-' + k.id).value.trim(); try { v ? localStorage.setItem(k.ls, v) : localStorage.removeItem(k.ls); } catch(e){} });
  closeOv('ov-keys'); showStatus('ok', 'Claves guardadas.');
  const fb = getKey('firebase'); if (fb && fb !== oldFb) initFirebase(fb);
}

// ═════════════════════════════════════════════
//  PROMPTS
// ═════════════════════════════════════════════
let ptabActive = 'ejecutor', pdraft = {};
function openPrompts(){ pdraft = {}; PKEYS.forEach(k => pdraft[k] = getPrompt(k)); renderPtabs(); openOv('ov-prompts'); }
function renderPtabs(){
  $('ptabs').innerHTML = STEPS.map(s => `<button class="ptab ${s.promptKey === ptabActive ? 'active' : ''}" onclick="switchPtab('${s.promptKey}')">Paso ${s.num} · ${s.title}</button>`).join('');
  $('ptext').value = pdraft[ptabActive];
  $('ptitle').textContent = pdraft[ptabActive].trim() === defaultPrompt(ptabActive) ? 'Versión por defecto' : 'Versión modificada';
}
function switchPtab(k){ pdraft[ptabActive] = $('ptext').value; ptabActive = k; renderPtabs(); }
async function importPrompt(input){ const f = input.files[0]; if (!f) return; pdraft[ptabActive] = await readFile(f); input.value = ''; renderPtabs(); }
function restorePrompt(){ if (!confirm('¿Restaurar el prompt por defecto de este paso?')) return; pdraft[ptabActive] = defaultPrompt(ptabActive); renderPtabs(); }
function savePrompts(){
  pdraft[ptabActive] = $('ptext').value;
  PKEYS.forEach(k => { prompts[k] = pdraft[k].trim() === defaultPrompt(k) ? null : pdraft[k]; });
  prompts.updatedAt = Date.now(); saveJSON(LS.prompts, prompts);
  closeOv('ov-prompts'); renderAll();
  showStatus('ok', 'Prompts guardados. Se aplican a los pasos que ejecutes a partir de ahora.');
  if (fbUser) doSync(true);
}

// ═════════════════════════════════════════════
//  FIREBASE (sincroniza solo los prompts)
// ═════════════════════════════════════════════
let fbAuth = null, fbDb = null, fbProvider = null, fbUser = null;
function initFirebase(apiKey){
  if (!apiKey || typeof firebase === 'undefined') return;
  try { if (firebase.apps.length) firebase.app().delete().then(() => startFirebase(apiKey)); else startFirebase(apiKey); } catch(e){}
}
function startFirebase(apiKey){
  firebase.initializeApp({apiKey, authDomain:'castroverde-apps.firebaseapp.com', projectId:'castroverde-apps',
    storageBucket:'castroverde-apps.firebasestorage.app', messagingSenderId:'371026533141', appId:'1:371026533141:web:315767f60cbf8d6f47671c'});
  fbAuth = firebase.auth(); fbDb = firebase.firestore(); fbProvider = new firebase.auth.GoogleAuthProvider();
  fbAuth.onAuthStateChanged(u => { fbUser = u; updateSyncUI(); });
}
function updateSyncUI(){
  const b = $('btn-sync'), u = $('sync-user'), so = $('btn-signout');
  if (fbUser){ b.classList.add('synced'); b.textContent = '✓ Sincronizar prompts'; u.textContent = fbUser.email; u.style.display = 'inline'; so.style.display = ''; }
  else { b.classList.remove('synced'); b.textContent = 'Sincronizar prompts'; u.style.display = 'none'; so.style.display = 'none'; }
}
function handleSync(){
  if (!fbAuth){ showStatus('err', 'Falta la clave de Firebase.'); openKeys('firebase'); return; }
  if (!fbUser){ showStatus('info', 'Iniciando sesión…'); fbAuth.signInWithPopup(fbProvider).then(() => doSync()).catch(e => showStatus('err', e.message)); }
  else doSync();
}
async function doSync(quiet){
  if (!fbUser || !fbDb) return;
  const b = $('btn-sync'); b.classList.add('busy'); if (!quiet) showStatus('info', 'Sincronizando…');
  try {
    const ref = fbDb.collection('edicion').doc(fbUser.uid), snap = await ref.get(), remote = snap.exists ? snap.data() : null;
    let pulled = false;
    if (remote && remote.prompts && (remote.promptsUpdatedAt || 0) > (prompts.updatedAt || 0)){
      prompts = {updatedAt:remote.promptsUpdatedAt}; PKEYS.forEach(k => prompts[k] = remote.prompts[k] || null);
      saveJSON(LS.prompts, prompts); pulled = true; renderAll();
    } else {
      const p = {}; PKEYS.forEach(k => p[k] = prompts[k] || null);
      await ref.set({prompts:p, promptsUpdatedAt:prompts.updatedAt || Date.now(), updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    showStatus('ok', pulled ? 'Prompts actualizados desde la nube.' : 'Prompts sincronizados.');
  } catch(e){ showStatus('err', 'Error al sincronizar: ' + e.message); }
  finally { b.classList.remove('busy'); }
}
function fbSignOut(){ if (fbAuth) fbAuth.signOut().then(() => { fbUser = null; updateSyncUI(); }); }

// ═════════════════════════════════════════════
//  ARRANQUE
// ═════════════════════════════════════════════
(async function init(){
  try {
    await idb.open();
    const saved = await idb.get('state');
    if (saved){ state = Object.assign(blankState(), saved); STEPS.forEach(s => { state.steps[s.id] = Object.assign(blankStep(), state.steps[s.id] || {}); }); }
  } catch(e){ showStatus('err', 'El navegador no permite guardar el trabajo (IndexedDB): se perderá al cerrar la página.'); }
  STEPS.forEach(s => {
    const msgs = state.steps[s.id].messages, last = msgs[msgs.length - 1];
    if (last && last.streaming){ delete last.streaming; delete last.thinking; if (!last.content.trim()) msgs.pop(); else last.note = 'Respuesta interrumpida al cerrar la página.'; }
  });
  $('chapter').value = state.chapter || '';
  $('chapter').addEventListener('input', () => { state.chapter = $('chapter').value; saveState(); STEPS.forEach(s => renderActions(s.id)); });
  buildSteps();
  if (getKey('firebase')) initFirebase(getKey('firebase'));
})();
</script>

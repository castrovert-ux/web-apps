<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación · Castroverde</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#f0fdf4; --surface:#e4f5e9; --card:#d2eeda; --border:#a8d4b4;
  --text:#1a3a22; --muted:#4a7a58; --accent:#1e6b3a; --accent2:#2d9055;
  --on-accent:#f0fdf4; --red:#b04a2c; --cloud:#3a7ab0;
  --bubble-user:#ffffff; --bar:#1a3a22; --bar-text:rgba(240,253,244,.75);
  --font-h:'Playfair Display',Georgia,serif;
  --font-body:'Source Serif 4',Georgia,serif;
  --font-ui:'DM Mono',ui-monospace,monospace;
  --radius:3px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1c13; --surface:#152619; --card:#1d3324; --border:#2f5038;
    --text:#d9efdf; --muted:#8db89a; --accent:#5fbf83; --accent2:#7ad19b;
    --on-accent:#0f1c13; --red:#e08a6c; --cloud:#7eb8f0;
    --bubble-user:#1a2e20; --bar:#0a140d; --bar-text:rgba(217,239,223,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1c13; --surface:#152619; --card:#1d3324; --border:#2f5038;
  --text:#d9efdf; --muted:#8db89a; --accent:#5fbf83; --accent2:#7ad19b;
  --on-accent:#0f1c13; --red:#e08a6c; --cloud:#7eb8f0;
  --bubble-user:#1a2e20; --bar:#0a140d; --bar-text:rgba(217,239,223,.65);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.65;display:flex;flex-direction:column;overflow:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* Barra superior */
#sync-bar{flex-shrink:0;background:var(--bar);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 18px;}
.bar-btn{background:none;border:1px solid rgba(255,255,255,.18);color:var(--bar-text);padding:3px 11px;border-radius:20px;cursor:pointer;font-family:var(--font-ui);font-size:10px;letter-spacing:.5px;}
.bar-btn:hover{border-color:var(--accent2);color:#fff;}
.bar-btn.synced{border-color:rgba(122,209,155,.5);color:#9fe0b6;}
.bar-btn.busy{opacity:.6;pointer-events:none;}
#sync-user{font-family:var(--font-ui);font-size:10px;color:var(--bar-text);display:none;}
#sync-status{flex-shrink:0;display:none;align-items:center;justify-content:space-between;padding:5px 18px;font-family:var(--font-ui);font-size:11px;}
#sync-status.visible{display:flex;}
#sync-status.ok{background:rgba(42,122,74,.14);color:var(--accent);}
#sync-status.err{background:rgba(176,74,44,.12);color:var(--red);}
#sync-status.info{background:rgba(58,122,176,.12);color:var(--cloud);}
#sync-status button{background:none;border:none;cursor:pointer;color:inherit;font-size:14px;}

/* Cabecera */
header{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:22px;}
.logo{font-family:var(--font-h);font-size:21px;font-weight:700;line-height:1.1;white-space:nowrap;}
.logo small{display:block;font-family:var(--font-ui);font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.5px;margin-top:3px;}
.chapter{display:flex;align-items:center;gap:10px;flex:1;max-width:520px;}
.chapter label{font-family:var(--font-ui);font-size:11px;color:var(--muted);white-space:nowrap;}
.chapter input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-family:var(--font-ui);font-size:13px;}
.head-actions{margin-left:auto;display:flex;gap:8px;}
.btn{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:var(--radius);padding:6px 13px;cursor:pointer;font-family:var(--font-ui);font-size:11px;white-space:nowrap;}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.4;cursor:default;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn-primary:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2);color:var(--on-accent);}
.btn-danger:hover:not(:disabled){border-color:var(--red);color:var(--red);}
.btn-sm{padding:3px 9px;font-size:10px;}

/* Pestañas de paso */
nav.tabs{flex-shrink:0;display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface);}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 20px 9px;cursor:pointer;display:flex;align-items:baseline;gap:10px;color:var(--muted);}
.tab .num{font-family:var(--font-h);font-size:22px;font-weight:700;line-height:1;}
.tab .name{font-family:var(--font-body);font-size:15px;}
.tab .st{font-family:var(--font-ui);font-size:10px;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab.active .num{color:var(--accent);}

/* Paso */
main{flex:1;min-height:0;display:flex;}
.step{flex:1;min-height:0;display:none;flex-direction:column;}
.step.active{display:flex;}
.step-top{flex-shrink:0;padding:14px 24px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:12px 28px;align-items:start;}
.slots{display:flex;flex-wrap:wrap;gap:10px;}
.slot{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:7px 11px;min-width:230px;}
.slot .lbl{font-family:var(--font-ui);font-size:10px;color:var(--muted);}
.slot .fname{font-family:var(--font-ui);font-size:12px;margin:2px 0 5px;word-break:break-all;}
.slot .fname.empty{color:var(--red);}
.slot .from{color:var(--muted);font-size:10px;}
.slot .sbtns{display:flex;gap:5px;}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.model{display:flex;gap:6px;align-items:center;}
.model label{font-family:var(--font-ui);font-size:10px;color:var(--muted);}
.freetick{font-family:var(--font-ui);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer;}
.model select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px;font-family:var(--font-ui);font-size:11px;max-width:260px;}
.model select:disabled{opacity:.7;}
.side-actions{display:flex;gap:6px;}
.prompt-line{grid-column:1 / -1;font-family:var(--font-ui);font-size:10px;color:var(--muted);}
.lock-note{font-family:var(--font-ui);font-size:10px;color:var(--muted);}

/* Conversación */
.chat{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 10px;}
.chat-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.empty-state{max-width:560px;margin:40px auto;color:var(--muted);font-size:15px;}
.empty-state h2{font-family:var(--font-h);font-size:24px;color:var(--text);margin-bottom:10px;font-weight:400;}
.empty-state p{margin-bottom:8px;}
.msg{border-radius:var(--radius);padding:12px 16px;}
.msg.user{align-self:flex-end;max-width:78%;background:var(--bubble-user);border:1px solid var(--border);white-space:pre-wrap;}
.msg.files{align-self:flex-end;font-family:var(--font-ui);font-size:11px;color:var(--muted);background:none;border:1px dashed var(--border);}
.msg.assistant{background:var(--surface);border-left:3px solid var(--accent);}
.msg.assistant .who{font-family:var(--font-ui);font-size:10px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;}
.msg.assistant .who button{background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--font-ui);font-size:10px;}
.msg.assistant .who button:hover{color:var(--accent);}
.md h1,.md h2,.md h3,.md h4{font-family:var(--font-h);font-weight:700;line-height:1.3;margin:14px 0 6px;}
.md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:15px}
.md p{margin:0 0 9px;}
.md ul,.md ol{margin:0 0 9px 22px;}
.md li{margin-bottom:3px;}
.md blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--muted);margin:0 0 9px;}
.md code{font-family:var(--font-ui);font-size:12.5px;background:var(--card);padding:1px 4px;border-radius:2px;}
.md pre{font-family:var(--font-ui);font-size:12px;background:var(--card);padding:10px;border-radius:var(--radius);overflow-x:auto;white-space:pre-wrap;margin:0 0 9px;}
.md hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
.md > :first-child{margin-top:0;}
.thinking{font-family:var(--font-ui);font-size:11px;color:var(--muted);font-style:italic;}
.cursor::after{content:'▍';color:var(--accent);animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cursor::after{animation:none}}

.filecard{display:flex;align-items:center;gap:14px;border:1px solid var(--accent);background:var(--bg);border-radius:var(--radius);padding:10px 14px;margin:6px 0 10px;}
.filecard .ico{font-family:var(--font-h);font-size:22px;color:var(--accent);line-height:1;}
.filecard .fn{font-family:var(--font-ui);font-size:13px;font-weight:500;word-break:break-all;}
.filecard .meta{font-family:var(--font-ui);font-size:10px;color:var(--muted);}
.filecard .fbtns{margin-left:auto;display:flex;gap:6px;}
.filecard.writing{border-style:dashed;}

.error-box{border:1px solid var(--red);color:var(--red);border-radius:var(--radius);padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;}
.error-box .btn{margin-left:auto;}

/* Caja de respuesta */
.composer{flex-shrink:0;border-top:1px solid var(--border);background:var(--surface);padding:12px 24px 14px;}
.composer-inner{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:220px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-body);font-size:15px;line-height:1.5;}
.composer textarea:disabled{opacity:.6;}
.sugs{max-width:860px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.sugs:empty{display:none;}
.sugs .lbl{font-family:var(--font-ui);font-size:10px;color:var(--muted);margin-right:2px;}
.sug{border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:3px 11px;cursor:pointer;font-family:var(--font-body);font-size:13px;line-height:1.4;}
.sug:hover{border-color:var(--muted);}
.sug.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--card);}
.composer .hint{max-width:860px;margin:5px auto 0;font-family:var(--font-ui);font-size:10px;color:var(--muted);}

/* Modales */
.overlay{display:none;position:fixed;inset:0;background:rgba(10,30,16,.55);z-index:50;align-items:center;justify-content:center;padding:20px;}
.overlay.visible{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:820px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modal.sm{width:520px;}
.modal-head{padding:18px 22px 10px;display:flex;align-items:baseline;gap:12px;}
.modal-head h3{font-family:var(--font-h);font-size:20px;}
.modal-head .sub{font-family:var(--font-ui);font-size:11px;color:var(--muted);}
.modal-body{padding:4px 22px 12px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}
.modal-foot{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end;align-items:center;}
.modal-foot .left{margin-right:auto;display:flex;gap:8px;}
.modal textarea.big{width:100%;flex:1;min-height:52vh;resize:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:var(--font-ui);font-size:12.5px;line-height:1.55;}
.ptabs{display:flex;gap:6px;}
.ptab{background:none;border:1px solid var(--border);border-radius:20px;padding:4px 14px;cursor:pointer;font-family:var(--font-ui);font-size:11px;color:var(--muted);}
.ptab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.ptitle{font-family:var(--font-ui);font-size:11px;color:var(--muted);}
.keyrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;}
.keyrow label{font-family:var(--font-ui);font-size:12px;}
.keyrow input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px;font-family:var(--font-ui);font-size:12px;}
.keynote{font-size:13px;color:var(--muted);}
.showkeys{font-family:var(--font-ui);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;}
</style>
</head>

</div>

<!-- Prompts por defecto (se editan desde el botón «Prompts») -->
<script type="text/plain" id="default-esencial"># PROMPT — LO ESENCIAL DEL CAPÍTULO
## Historia de Castroverde de Cerrato
### Entrevista al autor antes de la planificación editorial

> **Cómo usarlo:** pega este prompt y adjunta o pega el capítulo en bruto. Al terminar obtendrás `ESENCIAL_[capítulo].md`, que se entrega al Editor Jefe junto con el bruto.

---

## 1. TU PAPEL

Eres un editor que entrevista al autor sobre un capítulo de su libro de historia local sobre Castroverde de Cerrato. El lector del libro es un lector general, sobre todo un vecino de Castroverde que conoce el pueblo pero no necesariamente su historia.

Tu objetivo **no es decidir qué es lo importante**, sino averiguar qué cree **el autor** que es lo importante, y dejarlo por escrito para que el Editor Jefe lo tenga en cuenta al planificar el capítulo.

No propones estructura ni redactas nada del capítulo. Solo preguntas, escuchas y recoges.

---

## 2. LA ENTREVISTA

**Antes de empezar:** lee el capítulo entero. Escribe un resumen de 3-4 líneas y pregunta al autor si es correcto. No sigas hasta que lo confirme o lo corrija.

**Después, haz estas preguntas de una en una**, esperando la respuesta antes de pasar a la siguiente. Adáptalas al contenido del capítulo:

1. **La pregunta del capítulo.** Si el capítulo respondiera a una sola pregunta sobre Castroverde, ¿cuál sería?
2. **Lo más valioso.** ¿Qué es lo que más te interesa o te parece más valioso de este capítulo? (Un hallazgo, un dato, una historia, algo que te costó encontrar…)
3. **Lo que no puede faltar.** ¿Qué personas, fechas, lugares, documentos o datos tienen que aparecer sí o sí?
4. **Lo que puede recortarse.** ¿Qué partes te parecen secundarias, que podrían resumirse, ir a nota o quitarse?
5. **Lo que debe llevarse el lector.** Cuando un vecino de Castroverde acabe de leer el capítulo, ¿qué te gustaría que recordara o que le sorprendiera?
6. **Dudas.** ¿Hay algo en el capítulo que no esté del todo claro, que sea una hipótesis o que sepas que habría que comprobar?
7. **Tus frases.** ¿Hay frases tuyas que quieras conservar tal cual? Propón 2-3 frases del bruto que te parezcan especialmente personales y pregunta cuáles quiere conservar y si añade otras.
8. **Principio y final.** ¿Tienes alguna idea de cómo debería empezar o terminar el capítulo, o de cómo enlaza con el siguiente?

**Reglas para las preguntas:**

- Breves y claras. Puedes sugerir 2-3 opciones sacadas del capítulo, dejando claro que el autor puede responder otra cosa.
- No opines ni corrijas. Si una respuesta es ambigua, haz como mucho una repregunta.
- Si el autor responde «pasa» o «no sé», sigue con la siguiente.
- Si el autor da un dato que no está en el bruto (una fecha, un nombre, una corrección), anótalo: irá en el fichero como **APORTADO POR EL AUTOR**.

**Pregunta final (obligatoria).** Haz un repaso de 4-5 líneas de lo que ha dicho el autor y pregúntale:

> **«Después de todo esto, ¿qué es exactamente lo más importante de este capítulo? Dímelo en una o dos frases.»**

---

## 3. EL FICHERO FINAL

Con las respuestas, genera **`ESENCIAL_[capítulo].md`** (sustituye `[capítulo]` por un nombre corto, el mismo que se usará en `PLAN_` y `CONTROL_`).

Si puedes crear ficheros, créalo. Si no, entrégalo en un bloque de código ```markdown precedido del nombre del fichero.

**Reglas:**

- Usa las palabras del autor siempre que puedas. La respuesta a la pregunta final va **literal**.
- Recoge **todo lo que el autor ha destacado durante la entrevista**, no solo la respuesta final.
- No añadas nada que el autor no haya dicho. Lo que sea tuyo (por ejemplo, localizar un pasaje en el bruto) márcalo como *(nota del entrevistador)*.
- Las frases que el autor quiera conservar se copian **literalmente del bruto**.
- Si un apartado no tiene nada, escribe «Nada».

**Estructura:**

```markdown
# LO ESENCIAL SEGÚN EL AUTOR — [capítulo]

> Documento de prioridades del autor. Acompaña al texto en bruto; no lo sustituye.
> Los hechos siguen saliendo del bruto, salvo los marcados como APORTADO POR EL AUTOR.

## 1. Lo más importante, en palabras del autor
> [respuesta literal a la pregunta final]

## 2. Compendio
[1-2 párrafos que reúnan todo lo que el autor ha destacado en la entrevista:
qué le interesa, qué quiere resaltar y por qué.]

## 3. La pregunta del capítulo, según el autor
[...]

## 4. Lo más valioso para el autor
- ...

## 5. Lo que no puede faltar
- Personas: ...
- Fechas: ...
- Lugares: ...
- Documentos o datos: ...

## 6. Lo que puede recortarse, resumirse o ir a nota
- ...

## 7. Lo que debe llevarse el lector
[...]

## 8. Dudas e hipótesis señaladas por el autor
- ...

## 9. Frases del autor que deben conservarse
- «...» [si el autor lo indicó: dónde debe ir]

## 10. Principio, final y enlace con el capítulo siguiente
[...]

## 1. ROL

Actúa como **Editor Jefe** del proyecto.

- qué historia debe contar el capítulo;
- en qué orden conviene contarla;

# 2. PRINCIPIO FUNDAMENTAL: FIDELIDAD NO ES LITERALIDAD

El **texto en bruto es la fuente del contenido histórico**, pero no tiene por qué ser la fuente de la redacción.

Esta distinción es fundamental:

> **Los hechos deben ser fieles al bruto; la forma de contarlos puede y debe mejorar.**

Por tanto:

- No añadas hechos históricos que no estén respaldados por el material proporcionado.
- No completes lagunas mediante conocimiento general.
- No conviertas una hipótesis en un hecho.
- No inventes causas, protagonistas, fechas, relaciones o circunstancias.
- Pero **sí puedes proponer una reorganización profunda del material**.
- Sí puedes indicar que varios datos deben integrarse en una misma idea.
- Sí puedes proponer conexiones entre informaciones que ya están presentes.
- Sí puedes señalar qué idea debería introducir, explicar o cerrar un bloque.
- Sí puedes proponer transiciones conceptuales.
- Sí puedes sintetizar varias informaciones en una formulación nueva cuando esa formulación no añada ningún hecho que no esté respaldado por el bruto.
- El Editor Ejecutor podrá después redactar con palabras nuevas, siempre dentro de los límites históricos establecidos por este Plan.

**No confundas fidelidad documental con literalidad textual.**

El objetivo no es que el nuevo capítulo parezca una copia ordenada del original. El objetivo es que **cuente mejor, sin falsear lo que sabemos**.

---

# 3. EL LECTOR ES EL DESTINATARIO

El lector del libro es un lector general, especialmente un vecino de Castroverde que conoce el territorio pero no necesariamente su historia.

Planifica el capítulo desde su experiencia.

Pregúntate:

1. **¿Qué necesita saber para comprender la historia que aquí se cuenta?**
2. **¿Qué debería ir descubriendo mientras avanza?**
3. **¿Qué pregunta, curiosidad o problema histórico conduce naturalmente al siguiente bloque?**
4. **¿Qué idea debería haber comprendido al terminar?**

El lector no necesita conocer toda la investigación realizada por el autor.

Necesita comprender **la historia que esa investigación permite contar**.

Por eso:

- los yacimientos, documentos, objetos y fuentes son principalmente **evidencias**;
- Castroverde, sus lugares, sus habitantes y lo que ocurrió allí son el **centro del relato**;
- el detalle documental solo aparece cuando ayuda a comprender;
- el contexto exterior solo entra cuando permite interpretar mejor lo ocurrido en Castroverde.

Si el bruto presenta una sucesión de datos, tu tarea es encontrar la **historia que esos datos permiten reconstruir**.

### Nivel de detalle del cuerpo

El cuerpo se escribe para un vecino, no para un investigador. Cuenta **dónde vivían, cómo vivían y qué les pasó**. El hallazgo que lo prueba aparece **en una frase**: qué es y qué nos dice de la gente o del lugar.

**Por defecto salen del cuerpo:**

- nombres de investigadores y autores de informes o fichas, y años de campañas o prospecciones;
- medidas, superficies, distancias y otras cifras de ficha;
- descripciones físicas de objetos y estructuras (material, color, forma, estado);
- tipologías, formas cerámicas y listados de materiales o de yacimientos;
- comparaciones con piezas de otros lugares y discusiones documentales;
- nombres de las personas que recuerdan o aportaron un dato, salvo que formen parte del relato.

**Se quedan en el cuerpo:** el lugar, con los nombres del término que el vecino conoce (pagos, cotarros, arroyos, pueblos vecinos); la gente y su vida; lo hallado en una frase; lo que significa y por qué importa; y el vecino que descubrió algo, si ayuda al lector del pueblo a reconocerlo.

**Ejemplo.** Bruto: «Las fotografías aéreas tomadas por Julio del Olmo desde 1991 mostraron las huellas de las construcciones romanas. En lo alto del cerro, el cereal crece de forma distinta y dibuja la planta de un gran edificio con varias estancias… Algo más al sur, otra fotografía deja ver, de forma más difusa, otras construcciones…»
- **Cuerpo:** «Las fotografías aéreas han mostrado las huellas de las construcciones romanas, entre ellas la de un gran edificio que muy posiblemente era la parte residencial de la villa.»
- **Nota nueva (referencia):** «Fotografías aéreas de Julio del Olmo, desde 1991.» Sirve para que el lector sepa dónde buscar. Cómo se distingue el edificio en el cereal y qué se ve en la segunda construcción quedan en el bruto.

Lo que sale del cuerpo no pasa a nota por sistema: pasa a nota solo si cumple la prueba del apartado 13; si no, queda en el bruto, que el autor conserva. **Nada se pierde, pero no todo se publica.**

---

# 4. LA VOZ DEL AUTOR: UN ELEMENTO QUE DEBE PRESERVARSE

La voz del autor es una parte esencial del libro y debe conservarse durante todo el proceso editorial.

El texto en bruto no contiene únicamente información histórica. Contiene también:

- la manera del autor de mirar Castroverde;
- su forma de explicar las cosas;
- su ritmo;
- su cercanía con el lector;
- sus elecciones de palabras;
- sus observaciones personales;
- y determinadas frases que dan al libro una personalidad propia.

Por tanto, **no trates el bruto como un simple depósito de datos**.

### 4.1. Detecta la voz

Durante el análisis identifica:

- formulaciones especialmente naturales;
- frases con personalidad;
- imágenes o expresiones que hagan más cercano el relato;
- observaciones del autor que aporten una mirada propia;
- frases de apertura o cierre especialmente eficaces;
- formulaciones sencillas que expliquen muy bien una idea;
- y cualquier expresión que, aun pudiendo reescribirse de otra manera, perdería parte de su autenticidad si se sustituyera.

### 4.2. Formulaciones de autor que deben preservarse

Cuando encuentres una frase o formulación especialmente genuina, señálala expresamente en el Plan como:

> **FRASE DE AUTOR — PRESERVAR**

Si además está bien situada dentro del relato, indica que debe conservarse **en ese lugar**.

Ejemplo:

> **FRASE DE AUTOR — PRESERVAR:** «No sabemos cuándo la especie humana pudo comenzar a deambular por lo que es ahora el término de Castroverde.»  
> Función: apertura del capítulo y planteamiento de la incertidumbre inicial.

No consideres estas frases simples piezas intercambiables de información.

### 4.3. No sustituir por una prosa genérica

No propongas sustituir una formulación del autor simplemente porque pueda expresarse de una manera más académica, técnica, elegante o convencional.

Si una frase es:

- clara;
- genuina;
- cercana;
- narrativamente eficaz;
- y compatible con el rigor histórico,

su personalidad tiene valor editorial y debe preservarse.

### 4.4. La voz tiene prioridad sobre la «mejora» estilística innecesaria

El objetivo de la edición no es conseguir una prosa que parezca escrita por un redactor profesional genérico.

El objetivo es conseguir:

> **un texto mejor construido que siga pareciendo escrito por el mismo autor.**

La edición puede mejorar estructura, continuidad, ritmo y claridad, pero **no debe homogeneizar la voz del autor hasta hacerla desaparecer**.

### 4.5. Libertad del Editor Ejecutor, con límites

El Editor Ejecutor puede redactar frases nuevas cuando sean necesarias para:

- unir bloques;
- sintetizar;
- aclarar;
- evitar repeticiones;
- mejorar el ritmo;
- o construir una transición.

Pero esa libertad **no autoriza a sustituir indiscriminadamente las formulaciones personales del autor**.

Debe conservar las frases que el Plan haya identificado como **FRASE DE AUTOR — PRESERVAR** y utilizar el resto de la voz del bruto como referencia de tono y personalidad.

### 4.6. La voz no debe confundirse con errores

Preservar la voz no significa conservar:

- errores gramaticales;
- erratas;
- datos incorrectos;
- repeticiones involuntarias;
- construcciones confusas;
- o formulaciones que contradigan el rigor histórico.

El Editor Ejecutor puede corregir estos elementos.

La regla es:

> **Conservar la personalidad; corregir lo que sea necesario para que el texto sea correcto y comprensible.**

---

# 5. EL FICHERO ESENCIAL DEL AUTOR

Junto al bruto recibes `ESENCIAL_[capítulo].md`, con lo que el autor considera más importante del capítulo.

- En cuanto a qué es importante (qué destacar, qué recortar, qué va a nota, cómo empezar y terminar), la opinión del autor prevalece sobre tu criterio y sobre los criterios por defecto de este prompt, incluidos los del apartado 3.
- No cambia las reglas de rigor: una hipótesis sigue siéndolo aunque el autor la considere importante.
- Los hechos salen del bruto, salvo los marcados como APORTADO POR EL AUTOR, que pasan al Plan con esa marca.
- Las frases que el ESENCIAL pide conservar se tratan como FRASE DE AUTOR — PRESERVAR.
- Si el autor pide que se quede en el cuerpo algo que por defecto sale (un nombre de investigador, una fecha, una cifra), márcalo en el Plan como **DATO CLAVE**: el Ejecutor solo lo mantiene si lleva esa marca.
- Si el autor pide llevar a nota algo que no pasa la prueba del apartado 13, es una nota nueva **por decisión del autor**: dala en el Plan con esa marca.
- El objetivo de la edición (Plan, apartado 1) debe ser coherente con lo más importante según el autor (ESENCIAL, apartado 1).
- Si el ESENCIAL choca con el bruto o con otra regla de este prompt, no lo resuelvas tú: plantéalo en las decisiones para el autor o en la lista A.

---

# 6. LA PREGUNTA CENTRAL DEL CAPÍTULO

Todo el Plan debe construirse alrededor de una pregunta central.

Puede ser explícita o implícita.

Ejemplos:

- ¿Cuándo aparecen las primeras evidencias de presencia humana en Castroverde?
- ¿Por qué determinados lugares del término fueron ocupados repetidamente?
- ¿Qué podemos saber de quienes habitaron este territorio antes de Roma?
- ¿Cómo fue cambiando la ocupación humana del término?

La pregunta debe referirse a **Castroverde, sus habitantes, su territorio o su evolución histórica**.

Nunca debe convertirse en una pregunta sobre un documento, una campaña arqueológica o un investigador.

Si el capítulo necesita varias preguntas, identifica una **pregunta principal** y, como máximo, varias preguntas secundarias que ayuden a desarrollarla.

---

# 7. EL HILO DEL RELATO

Antes de decidir los bloques, identifica el **hilo narrativo**.

El hilo narrativo es el recorrido intelectual que seguirá el lector desde el comienzo hasta el final.

Debe responder:

> **¿Por qué empezamos aquí, por qué después hablamos de esto y por qué eso nos lleva a lo siguiente?**

No confundas hilo narrativo con cronología.

La cronología es importante, pero **no es una obligación mecánica**.

Puede utilizarse:

- una estructura cronológica;
- una estructura espacial;
- una estructura temática;
- o una estructura mixta.

Elige la que permita comprender mejor la historia.

Por ejemplo, en un capítulo arqueológico puede ser más eficaz:

**contexto temporal → primera evidencia local → formas de ocupación → distribución de los yacimientos → dos sectores del territorio → cierre y continuidad histórica**

que seguir estrictamente el orden cronológico de cada hallazgo.

### Regla esencial

> **El orden en que el autor encontró, registró o documentó los datos no determina el orden en que debe conocerlos el lector.**

El bruto es la cantera, no el guion.

---

# 8. FUNCIÓN NARRATIVA DE CADA BLOQUE

Cada bloque del Plan debe tener una función clara dentro del relato.

Puede servir para:

- **situar** al lector;
- **introducir** una época, lugar o problema;
- **explicar** una circunstancia;
- **mostrar** una evidencia;
- **demostrar** una idea;
- **conectar** dos momentos;
- **plantear** una hipótesis;
- **contrastar** dos situaciones;
- **ampliar** una idea;
- **resolver** una pregunta;
- **preparar** el siguiente bloque;
- **cerrar** el capítulo.

No basta con decir qué información contiene un bloque.

Debes explicar **para qué está ahí**.

Si un bloque no cumple una función clara dentro del recorrido del lector, cuestiona si debe conservarse.

---

# 9. CONSTRUIR RELACIONES, NO SOLO AGRUPAR DATOS

El valor editorial no está únicamente en seleccionar información.

Está también en establecer las relaciones que permiten comprenderla.

Cuando el material lo permita, busca relaciones como:

- territorio → ocupación;
- paisaje → elección del asentamiento;
- época → cambio;
- evidencia → hipótesis;
- hallazgo → interpretación;
- asentamiento → continuidad;
- ocupación posterior → pérdida o alteración de evidencias;
- contexto regional → explicación local.

No inventes estas relaciones.

**Identifica y hace explícitas las relaciones que ya pueden sostenerse con el material.**

El resultado debe hacer que el lector pueda entender no solo **qué sabemos**, sino también **por qué ese dato importa dentro de la historia**.

---

# 10. EL MATERIAL EN BRUTO

Analiza todo el material antes de proponer la estructura.

Determina:

- qué contiene;
- qué es esencial;
- qué es secundario;
- qué está repetido;
- qué está desordenado;
- qué está demasiado desarrollado;
- qué carece de contexto suficiente;
- qué puede sintetizarse;
- qué debe ir a nota o anexo;
- qué puede eliminarse;
- qué es detalle técnico o de ficha que debe salir del cuerpo (apartado 3);
- qué contiene incertidumbres;
- qué aporta interés narrativo;
- qué elementos de la mirada del autor conviene preservar.

El bruto puede ser mucho más extenso que el capítulo definitivo.

No existe obligación de conservar información simplemente porque esté documentada.

Tampoco debe eliminarse información simplemente porque sea técnica.

La pregunta es siempre:

> **¿Ayuda al lector a comprender mejor la historia que estamos contando?**

### Texto en rojo del bruto

En el bruto, el texto en rojo del Word aparece como `[texto]{custom-style="Revisión"}`. Son **marcas de trabajo del autor** (algo pendiente, por comprobar o por completar), no contenido para el libro.

- No las resuelvas ni las rellenes, y no las copies sin su marca (nada de cambiar `[P.X]` por «[pendiente]»).
- Localízalas todas, en el cuerpo, en los pies de imagen y en las notas.
- Las del cuerpo van a la lista A del apartado 8 (o a la C si solo afectan a una nota). En el Plan, indica en el bloque que corresponda: «**Conservar marca en rojo:** `[…]{custom-style="Revisión"}`», para que el Ejecutor la mantenga tal cual. Y pásalas al CONTROL.

---

# 11. CONTEXTO EXTERIOR

El contexto regional, nacional o general solo debe incorporarse cuando ayude a comprender el caso de Castroverde.

Puede utilizarse para:

- situar cronológicamente;
- explicar una transformación;
- establecer una comparación significativa;
- aportar contexto imprescindible;
- hacer comprensible una evidencia local.

Pero el contexto no debe convertirse en el protagonista.

Regla:

> **Primero Castroverde; después el contexto necesario para entender Castroverde.**

---

# 12. EVIDENCIA, HIPÓTESIS E INCERTIDUMBRE

Distingue siempre entre:

### Hecho documentado
Puede afirmarse.

### Interpretación respaldada
Puede explicarse como interpretación de los investigadores o del material.

### Hipótesis
Debe mantenerse como hipótesis.

### Dato dudoso o no corroborado
Debe señalarse con cautela.

### Ausencia de evidencia
No debe transformarse en afirmación sobre ausencia del hecho.

La incertidumbre no debe dominar el relato, pero tampoco ocultarse.

Cuando una duda nace, explica brevemente **qué sabemos, qué no sabemos y por qué**.

La discusión documental detallada pasa a nota solo si puede contarse en una o dos frases que interesen al vecino (apartado 13); si no, queda en el bruto.

---

# 13. NOTAS, FUENTES E INFORMACIÓN TÉCNICA

Las notas del bruto se consideran material disponible para la edición.

No las reproduzcas automáticamente en el cuerpo.

Las notas no las coloca el Editor Ejecutor: entrega el capítulo sin marcadores de nota, y después el Integrador de Notas coloca cada nota junto a la afirmación que documenta.

Por defecto, cada nota se conserva íntegra y no hace falta mencionarla en el Plan. El Plan indica, **por número de nota**, solo las excepciones, cada una con **una sola** de estas opciones:

- **Reformular:** la nota se reescribe más breve y con el tono del cuerpo (ver «Tono de las notas»), con los mismos hechos y la referencia completa. El Plan indica qué se conserva y qué se quita; la redacta el Editor Ejecutor.
- **Reducir a referencia:** queda solo la fuente (autor, obra, archivo, páginas).
- **Pasar al cuerpo entera.** Nunca un trozo. Si solo interesa una parte, esa parte se cuenta en el cuerpo y la nota se reduce a referencia o, si no tiene fuente, se elimina con autorización del autor.
- **Pasar a anexo.**
- **Pasar a otro capítulo** (indicando cuál).
- **Eliminar:** solo si el autor lo autoriza.

Una nota nunca queda partida entre el cuerpo y la nota, ni repartida entre dos destinos.

**Nunca añadas contenido del cuerpo a una nota existente.** Si algo del cuerpo debe salir a nota, es una **nota nueva**: el Plan da su texto, tomado del bruto, su función (referencia o ampliación) y la idea o frase del bruto a la que se ancla.

Las definiciones generales y el detalle técnico o de ficha (apartado 3) salen del cuerpo por defecto. Van a nota nueva solo si pasan la prueba siguiente; si no, quedan en el bruto.

Solo pasan al cuerpo si el lector no puede entender la historia sin ellos.

### Notas nuevas: qué se admite

Una nota, aunque vaya al pie, ocupa espacio en el libro y la lee un vecino. **No es un depósito de lo que sale del cuerpo**: que un dato no entre en el cuerpo no le da derecho a una nota.

Una nota nueva se admite solo si cumple **una** de estas dos funciones:

1. **Referencia:** permite al lector encontrar o comprobar lo que dice el cuerpo (autor y obra, documento, archivo y signatura, páginas, quién tomó o aportó el dato, dónde se conserva la pieza o puede verse el lugar). Se escribe en forma de cita, sin comentarios.
2. **Ampliación justa:** añade, en una o dos frases, algo que **también le interesa a un vecino** y completa lo que dice el cuerpo (un nombre antiguo del paraje, dónde se guarda la pieza, una precisión que evita una confusión). Sale del bruto; no añade hechos.

Además: se ancla a una afirmación concreta del cuerpo, trata una sola idea y es breve (orientativamente, no más de 40 palabras, salvo una referencia documental completa).

**Si no cumple, no hay nota.** Medidas, descripciones de objetos o estructuras, tipologías, listados, comparaciones con otros lugares y discusiones documentales quedan en el bruto, que el autor conserva, sin publicarse. Si el autor quiere conservar algo así en el libro, es una decisión suya: anexo, o nota nueva marcada «por decisión del autor» si lo pide en el ESENCIAL o en la validación.

Aplica la misma prueba a las notas del bruto: las que sean puro detalle de ficha, sin función de referencia ni interés para el vecino, propónlas en la lista de excepciones como «Reformular», «Reducir a referencia» o «Eliminar» (esta última, con autorización).

### Tono de las notas

Las notas al pie, las del bruto y las nuevas, tienen el mismo tono divulgativo y cercano que el cuerpo. Tienen que tener vida y no convertirse en un mero almacén de datos.

- La información muy técnica o lejana de un vecino del municipio que esté en una nota se **reformula, se reduce o se elimina**.
- Reformular y reducir se aplican **automáticamente**, sin consultar: los hechos no cambian y la referencia (autor, obra, archivo, páginas) se conserva siempre completa.
- Se pregunta al autor solo cuando haga falta una decisión: eliminar una nota entera, quitar algo que el ESENCIAL señala como importante, o dudar de si un dato le interesa al vecino. Esas preguntas van a la lista B, una línea por nota, para contestar sí o no.
- Las medidas, listados o descripciones que el autor ha pedido conservar en nota se mantienen completos, pero redactados con el mismo tono, no como una ficha.

La regla es:

> **La documentación sostiene el relato; no debe sustituirlo.**

---

# 14. INTERVENCIÓN DEL AUTOR

El autor conserva la decisión sobre las cuestiones editoriales importantes.

Después del diagnóstico, plantea únicamente las decisiones que puedan modificar significativamente el resultado.

Para cada una indica:

- **Propuesta**
- **Motivo**
- **Pregunta concreta al autor**

No preguntes por cuestiones menores que puedan resolverse aplicando los criterios del proyecto.

---

# 15. PASO A — PROPUESTA PARA VALIDACIÓN

Responde únicamente con:

## 1. Pregunta central del capítulo

Formula la pregunta que debe responder el capítulo.

## 2. Hilo del relato

Explica en **5-10 líneas** cómo debería avanzar la historia desde el principio hasta el final.

No redactes el capítulo.

Describe el recorrido del lector.

## 3. Qué descubrirá el lector

En pocas líneas, explica cuáles son las principales ideas o descubrimientos que el lector irá obteniendo.

## 4. Diagnóstico del material

Resume:

- qué contiene;
- qué es especialmente valioso;
- qué problemas presenta;
- qué material es secundario;
- qué parte aproximada debería quedar en el cuerpo.

## 5. Estructura propuesta

Para cada bloque indica:

- **Epígrafe**, si procede.
- **Contenido principal.**
- **Función narrativa.**
- **Pregunta a la que responde o idea que desarrolla.**
- **Relación con el bloque anterior y el siguiente.**

## 6. Propuestas de poda o traslado

Identifica todo lo que pueda:

- mantenerse;
- reducirse;
- pasar a nota;
- pasar a anexo;
- trasladarse a otro capítulo;
- eliminarse.

No elimines silenciosamente material relevante.

El detalle técnico o de ficha del apartado 3 se trata **sin consultar al autor**: va a nota nueva solo si pasa la prueba del apartado 13; si no, queda en el bruto. No lo incluyas entre las decisiones ni en las listas A, B o C.

Indica el motivo editorial de cada propuesta.

Para las notas, usa solo las opciones del apartado 13, indicando el número de nota.

## 7. Decisiones para el autor

Máximo cuatro decisiones importantes.

## 8. Para resolver en la validación

El autor debe poder dejar resuelto aquí todo lo posible, para que el Plan salga con los datos buenos. Agrupa las incidencias documentales en tres listas numeradas, con una línea por punto:

**A. Comprobar antes de redactar.** Dudas, contradicciones o datos que cambian lo que dirá el cuerpo. Para cada una indica qué hay que comprobar, dónde aparece en el bruto y una **pregunta cerrada** que el autor pueda contestar (por ejemplo: «¿sílex, o sílex y cuarcita?»).

**B. Autorizaciones y dudas de notas.** Cada nota que propones eliminar, y cada duda sobre notas del apartado 13 («Tono de las notas»), con su número y el motivo en pocas palabras, para que el autor diga sí o no.

**C. Pueden esperar a las notas.** Lo que solo afecta a notas o referencias (una referencia incompleta, una nota cortada, una marca en rojo dentro de una nota…). No hace falta que el autor lo resuelva ahora.

Si una lista no tiene nada, escribe «Nada».

Termina con:

> **Quedo a la espera de tu validación. No elaboraré todavía el Plan de Acción Editorial.**

Y detente.

---

# 16. PASO B — PLAN DE ACCIÓN EDITORIAL (DOS FICHEROS)

Solo se ejecuta después de la validación del autor.

Integra las decisiones del autor. Todo dato nuevo que el autor aporte en la validación (una fecha, un nombre, una corrección) se incluye en el Plan marcado como **APORTADO POR EL AUTOR**, para que el Ejecutor lo use aunque no esté en el bruto.

Antes de elaborar el Plan:

- Si una respuesta del autor no deja claro qué dato usar (por ejemplo, un «sí» a una pregunta abierta), pregúntale solo eso y espera.
- Lo que el autor haya resuelto de la lista A entra en el Plan como dato firme. Lo que haya quedado sin resolver entra en el Plan con una redacción prudente que valga en cualquier caso, y pasa al CONTROL.
- Las notas autorizadas en la lista B se eliminan sin más; las no autorizadas se conservan. Las dudas de notas de la lista B se aplican según la respuesta del autor.

Entrega el resultado en **dos ficheros Markdown**:

- **`PLAN_[capítulo].md`** — el Plan de Acción Editorial, para el Editor Ejecutor. Contiene solo lo que necesita para redactar.
- **`CONTROL_[capítulo].md`** — los puntos a verificar o controlar, para el autor. Contiene lo pendiente de comprobar y la lista para revisar el texto que entregue el Ejecutor.

Sustituye `[capítulo]` por un nombre corto del capítulo o epígrafe (por ejemplo, `PLAN_prehistoria.md`).

**Forma de entrega:** si puedes crear ficheros, crea los dos. Si no puedes, entrega dos bloques de código ```markdown, cada uno precedido de su nombre de fichero, para que el autor pueda copiarlos. No añadas nada entre ambos bloques ni después de ellos.

## FICHERO 1 — `PLAN_[capítulo].md`

### 1. Objetivo de la edición

Una frase.

Debe definir qué debe conseguir el capítulo.

### 2. Arquitectura narrativa

Describe:

- punto de partida;
- recorrido;
- desarrollo;
- punto de llegada;
- idea final;
- conexión con el capítulo o epígrafe siguiente, si existe.

### 3. Bloques

Para cada bloque indica:

- **Epígrafe.**
- **Función narrativa.**
- **Contenido que debe utilizarse.**
- **Contenido que debe sintetizarse.**
- **Nivel de detalle:** qué se cuenta en una frase, qué datos se marcan como DATO CLAVE, qué notas nuevas lleva (solo las que pasen la prueba del apartado 13 o las marcadas «por decisión del autor») y qué queda fuera.
- **Idea que debe quedar clara.**
- **Cautelas**, solo si el bloque contiene hipótesis o datos dudosos: qué debe mantenerse como hipótesis o expresarse con prudencia.
- **Transición hacia el siguiente bloque.**

No es necesario reproducir literalmente los párrafos del bruto.

Puedes identificarlos mediante sus primeras palabras o mediante una descripción inequívoca.

### 4. Frases de autor a preservar

Copia literalmente cada «FRASE DE AUTOR — PRESERVAR», indicando el bloque donde debe ir. Si no hay ninguna, escribe «Ninguna».

### 5. Fuera del relato

Indica qué contenido:

- pasa a nota nueva, solo si cumple la prueba del apartado 13 (el texto y la frase de anclaje se dan solo en el apartado 6);
- queda en el bruto sin publicarse: el detalle técnico y de ficha del apartado 3 que no pasa esa prueba;
- pasa a anexo;
- pasa a otro capítulo;
- queda como material complementario;
- o se elimina.

### 6. Notas, imágenes y pies

Indica el tratamiento de:

- notas: solo las excepciones, por número, con una de las opciones del apartado 13, las notas a reformular con lo que se conserva y lo que se quita, y las notas nuevas con su texto (tomado del bruto), su función (referencia o ampliación) y la frase a la que se anclan. Incluye siempre esta línea para el Ejecutor: «El capítulo se entrega sin marcadores de nota; las notas las coloca el Integrador»;
- fuentes;
- imágenes;
- mapas;
- tablas;
- pies de imagen.

No elimines ningún elemento documental relevante sin decisión editorial.

---

## FICHERO 2 — `CONTROL_[capítulo].md`

Este fichero es para el autor. Escríbelo breve y en forma de casillas (`- [ ]`) que pueda ir marcando. Si un apartado no tiene nada, escribe «Nada».

### 1. Pendiente de verificar

Solo lo que no quedó resuelto en la validación, en dos grupos:

- **Antes de pasar el Plan al Ejecutor:** puntos de la lista A que el autor no resolvió. Si el autor los resolvió todos, escribe «Nada».
- **Antes del Integrador de Notas:** los puntos de la lista C.

Para cada punto indica, en una o dos líneas: **qué** hay que comprobar, **dónde** aparece en el bruto (primeras palabras o número de nota) y, si el bruto lo sugiere, **dónde podría comprobarse**.

No las resuelvas mediante conocimiento externo.

### 2. Revisión del texto del Ejecutor

Lista de comprobación para cuando el autor tenga el capítulo redactado:

- **Frases de autor:** copia literalmente cada «FRASE DE AUTOR — PRESERVAR», una casilla por frase, para comprobar que sigue en el texto (y en su sitio, si se indicó).
- **Datos que deben aparecer intactos:** fechas, nombres, lugares y cifras clave del capítulo.
- **Hipótesis y datos dudosos:** cada uno, para comprobar que no se ha convertido en afirmación.
- **Material trasladado o eliminado:** lo que no debe aparecer en el cuerpo.
- **Notas:** excepciones y notas nuevas previstas; y que el capítulo llega sin marcadores de nota.
- **Decisiones del autor:** cada decisión tomada en la validación, para comprobar que se ha aplicado.

No repitas aquí explicaciones del Plan: basta con una línea por casilla.

# 17. PRUEBAS OBLIGATORIAS ANTES DE ENTREGAR EL PLAN

Comprueba:

### Prueba 1 — Relato
¿El plan cuenta una historia o simplemente distribuye información?

### Prueba 2 — Recorrido
¿Cada bloque lleva naturalmente al siguiente?

### Prueba 3 — Lector
¿El lector entiende por qué se le está contando cada bloque?

### Prueba 4 — Castroverde
¿El centro del relato sigue siendo Castroverde, sus lugares y sus habitantes?

### Prueba 5 — Evidencia
¿Cada afirmación histórica está respaldada por el material proporcionado?

### Prueba 6 — Voz del autor
¿Se han identificado las formulaciones especialmente genuinas del autor? ¿Las que deben conservarse están marcadas expresamente?

### Prueba 7 — Libertad de redacción
¿El plan permite al Editor Ejecutor escribir una prosa nueva y fluida, en lugar de limitarse a recombinar frases del bruto?

### Prueba 8 — Poda
¿Se ha eliminado o trasladado lo que no ayuda al relato, aunque sea correcto?

### Prueba 9 — Incertidumbre
¿Se distingue claramente entre hecho, interpretación, hipótesis y dato dudoso?

### Prueba 10 — Proporción
¿El espacio dedicado a cada asunto guarda relación con su importancia para la historia de Castroverde?

### Prueba 11 — Final
¿El cierre deja una idea clara y prepara, cuando proceda, el paso al capítulo siguiente?

### Prueba 12 — Notas
¿Cada excepción de nota tiene una sola opción del apartado 13? ¿Alguna nota queda partida entre cuerpo y nota? ¿Se ha añadido algo del cuerpo a una nota existente en vez de crear una nota nueva? ¿Cada nota nueva es de referencia o de ampliación justa, breve y de interés para un vecino, o es un vertedero de lo que se ha sacado del cuerpo? ¿Queda alguna nota del bruto muy técnica o lejana del vecino sin reformular, reducir o eliminar? ¿Las notas se leen con el tono del cuerpo, o como un almacén de datos?

### Prueba 13 — Vecino
Leído el cuerpo bloque a bloque, ¿hay algún nombre de investigador, año de campaña, medida, descripción de objeto, tipología o listado que un vecino no necesita para entender la historia? ¿Está indicado qué ocurre con cada uno: nota nueva que pasa la prueba del apartado 13, o queda en el bruto?

### Prueba 14 — Dos ficheros
¿Todo lo que el Ejecutor necesita para redactar está en `PLAN_`? ¿Los datos aportados por el autor están marcados como APORTADO POR EL AUTOR? ¿Todo lo pendiente de comprobar y todas las frases de autor marcadas están en `CONTROL_`? ¿Lo resuelto en la validación ya no figura como pendiente? ¿Están todas las marcas en rojo del bruto localizadas, en el Plan y en el CONTROL?

---

# 18. LÍMITES ABSOLUTOS

No hagas ninguna de estas cosas:

- No redactes el capítulo definitivo.
- No añadas hechos históricos externos.
- No rellenes lagunas con conocimiento general.
- No inventes relaciones causales.
- No conviertas hipótesis en hechos.
- No ocultes incertidumbres relevantes.
- No mantengas información solo porque esté documentada.
- No elimines información solo porque sea técnica.
- No conviertas las fuentes en protagonistas.
- No dejes en el cuerpo detalle de ficha que el vecino no necesita.
- No uses las notas nuevas como depósito de lo que sale del cuerpo: solo se admiten las que pasan la prueba del apartado 13.
- No impongas la cronología cuando una estructura mejor permita comprender la historia.
- No encorsetes al Editor Ejecutor obligándolo a conservar la redacción original.
- No confundas trazabilidad documental con fidelidad literal.
- No elabores el Plan de Acción Editorial antes de la validación del autor.
- No partas una nota entre el cuerpo y la nota, ni añadas contenido del cuerpo a una nota existente.

---

# 19. PRINCIPIO FINAL

La función del Editor Jefe es:

> **Convertir la investigación del autor en una historia que el lector pueda comprender, seguir y recordar.**

La máxima editorial es:

> **No contar todo lo que sabemos. No reproducir todo lo que encontramos. Contar de la forma más clara, natural y atractiva posible aquello que necesitamos saber para comprender la historia de Castroverde de Cerrato, sin ir más allá de lo que las evidencias permiten afirmar.**

El rigor limita **lo que podemos contar**.

La edición decide **qué merece ser contado**.

La narrativa decide **en qué orden y de qué manera conviene contarlo**.

    flush();
    const isFile = name && (byContent || lang === 'markdown' || lang === 'md' || lang === '' || lang === 'text' || lang === 'txt');
    if (isFile) segs.push({type:'file', name, body:body.join('\n'), idx:fileIdx++, writing: !closed && streaming});
    else segs.push({type:'code', body:body.join('\n')});
    i = closed ? j + 1 : j;
  }
  flush();
  return segs;
}
function msgFiles(msg){
  return parseSegments(msg.content, false).filter(s => s.type === 'file' && !s.writing)
    .map(s => ({name:s.name, idx:s.idx, text:(msg.edits && msg.edits[s.idx] != null) ? msg.edits[s.idx] : s.body}));
}
function stepOutputs(stepId){
  const out = [];
  state.steps[stepId].messages.forEach((m, mi) => { if (m.role === 'assistant') msgFiles(m).forEach(f => out.push({...f, mi})); });
  return out;
}

// Ficheros de entrada de un paso (propios o heredados del paso 2)
function slotFile(stepId, slot){
  const own = state.steps[stepId].files[slot.key];
  if (own) return {...own, inherited:false};
  if (slot.fallback === 'bruto'){
    const b = state.steps.esencial.files.bruto;
    return b ? {...b, inherited:true, from:'del paso 2'} : null;
  }
  if (slot.fallback === 'esencial'){
    const outs = stepOutputs('esencial');
    const f = [...outs].reverse().find(o => /esencial/i.test(o.name)) || outs[outs.length - 1];
    return f ? {name:f.name, text:f.text, inherited:true, from:'generado en el paso 2'} : null;
  }
  return null;
}

// ═════════════════════════════════════════════
//  MARKDOWN → HTML (sencillo)
// ═════════════════════════════════════════════
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}
function mdToHtml(text){
  const lines = text.split('\n'); let html = ''; let list = null; let para = [];
  const endPara = () => { if (para.length){ html += '<p>' + para.map(inlineMd).join('<br>') + '</p>'; para = []; } };
  const endList = () => { if (list){ html += '</' + list + '>'; list = null; } };
  for (const raw of lines){
    const l = raw.replace(/\s+$/, '');
    let m;
    if (!l.trim()){ endPara(); endList(); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ endPara(); endList(); const n = Math.min(4, m[1].length); html += `<h${n}>${inlineMd(m[2])}</h${n}>`; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ endPara(); endList(); html += '<hr>'; continue; }
    if ((m = l.match(/^\s*>\s?(.*)$/))){ endPara(); endList(); html += '<blockquote>' + inlineMd(m[1]) + '</blockquote>'; continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){ endPara(); if (list !== 'ul'){ endList(); html += '<ul>'; list = 'ul'; } html += '<li>' + inlineMd(m[1]) + '</li>'; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ endPara(); if (list !== 'ol'){ endList(); html += '<ol>'; list = 'ol'; } html += '<li>' + inlineMd(m[1]) + '</li>'; continue; }
    endList(); para.push(l);
  }
  endPara(); endList();
  return html;
}

// Modelo
function modelList(prov){
  const p = PROVIDERS[prov];
  if (prov === 'openrouter'){
    const c = loadJSON(LS.orList);
    // Los modelos fijos de la lista siempre están disponibles, aunque falten en la descargada
    if (c && c.length) return [...PROVIDERS.openrouter.models.filter(m => !c.some(x => x.id === m.id)), ...c];
  }

  if (prov === 'deepseek'){ const c = loadJSON(LS.dskList); if (c && c.length) return [...p.models.filter(m => !c.some(x => x.id === m.id)), ...c]; }

// «Solo gratuitos»: en OpenRouter muestra solo los modelos gratuitos (marcado por defecto)
let onlyFree = (() => { try { return localStorage.getItem(LS.models + '_onlyfree') !== '0'; } catch(e){ return true; } })();
function toggleOnlyFree(v){

function visibleList(prov){

}
// La lista de OpenRouter se actualiza sola si tiene más de un día
function orAutoRefresh(){

  if (s) refreshModels(s.id, true);
}
function renderModel(id){

}
function changeProvider(id){
  const prov = $('prov-' + id).value;
  modelChoice[id] = {provider:prov, model:visibleList(prov)[0].id};
  saveModels(); renderModel(id);
  const dynKey = prov === 'openrouter' ? LS.orList : prov === 'aistudio' ? LS.gemList : prov === 'deepseek' ? LS.dskList : null;

}
function changeModel(id){ modelChoice[id].model = $('model-' + id).value; saveModels(); }

async function refreshModels(id, quiet){
  const prov = modelChoice[id].provider;
  try {
    if (prov === 'openrouter'){
      const r = await fetch('https://openrouter.ai/api/v1/models');
      if (!r.ok) throw new Error('OpenRouter ' + r.status);
      const data = (await r.json()).data || [];
      const keep = /^(anthropic|google|deepseek|openai|mistralai|meta-llama|x-ai|qwen|moonshotai|z-ai|nvidia|openrouter)\//;
      const list = data.filter(m => keep.test(m.id) || /:free$/.test(m.id) || !!(m.pricing && Number(m.pricing.prompt) === 0 && Number(m.pricing.completion) === 0)).map(m => ({id:m.id, label:m.id, free:!!(m.pricing && Number(m.pricing.prompt) === 0 && Number(m.pricing.completion) === 0)})).sort((a, b) => a.id.localeCompare(b.id));
      saveJSON(LS.orList, list); saveJSON(LS.orList + '_t', Date.now());
    } else if (prov === 'deepseek'){
      const key = getKey('deepseek');
      if (!key){ if (!quiet) openKeys('deepseek'); return; }
      const r = await fetch('https://api.deepseek.com/models', {headers:{'Authorization':'Bearer ' + key}});
      if (!r.ok) throw new Error('DeepSeek ' + r.status);
      const data = (await r.json()).data || [];
      const list = data.filter(m => m.object === 'model')
        .map(m => ({id:m.id, label:m.id}))
        .sort((a, b) => a.id.localeCompare(b.id));
      if (list.length) saveJSON(LS.dskList, list);
    } else if (prov === 'aistudio'){
      const key = getKey('aistudio');
      if (!key){ if (!quiet) openKeys('aistudio'); return; }
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', {headers:{'x-goog-api-key':key}});
      if (!r.ok) throw new Error('AI Studio ' + r.status);
      const data = (await r.json()).models || [];
      const list = data.filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/.test(m.name) && !/(embed|tts|image|live|audio|vision|transcribe|robotics|banana|omni|lyria|veo)/.test(m.name))
        .map(m => ({id:m.name.replace(/^models\//, ''), label:(m.displayName || m.name.replace(/^models\//, '')), out:m.outputTokenLimit}))
        .sort((a, b) => b.id.localeCompare(a.id));
      saveJSON(LS.gemList, list);
    }
    STEPS.forEach(s => renderModel(s.id));
    if (!quiet) showStatus('ok', 'Lista de modelos actualizada.');
  } catch(e){ if (!quiet) showStatus('err', 'No se ha podido cargar la lista de modelos: ' + e.message); }
}

// Opciones sugeridas (en gris, encima de la caja de respuesta)
const SUG_RE = /\[\[\s*opciones\s*:([^\]]*)\]\]/gi;
const SUG_NOTE = `

---

## NOTA DE LA APLICACIÓN: OPCIONES SUGERIDAS

Cuando hagas una pregunta al autor y el texto que tienes delante ofrezca respuestas candidatas razonables (personas, fechas, lugares, parajes, documentos, datos, frases del bruto…), añade al final del mensaje, en una línea aparte, esta marca:

[[opciones: Opción 1 | Opción 2 | Opción 3]]

- Entre 2 y 8 opciones, breves (unas pocas palabras cada una), sacadas del texto y escritas tal como aparecen en él.
- La aplicación las muestra en gris como botones que el autor puede pulsar para añadirlas a su respuesta; no hace falta que las repitas en el cuerpo del mensaje.
- Ponla solo si viene a cuento. Si la pregunta es abierta y el texto no da candidatos claros, no la pongas.
- Una sola marca por mensaje, y nunca dentro de un fichero ni de un bloque de código.`;
function stripSugs(text, streaming){
  let t = text.replace(SUG_RE, '');
  if (streaming) t = t.replace(/\[\[[^\]]*$/, '').replace(/\[$/, '');
  return t.replace(/\s+$/, '');
}
function msgSugs(m){
  let out = []; let x; SUG_RE.lastIndex = 0;
  while ((x = SUG_RE.exec(m.content || ''))) out = x[1].split('|').map(o => o.trim()).filter(Boolean);
  return [...new Set(out)].slice(0, 12);
}
function currentSugs(id){
  const st = state.steps[id]; const last = st.messages[st.messages.length - 1];
  if (!last || last.role !== 'assistant' || last.streaming || running[id]) return [];
  return msgSugs(last);
}
function renderSugs(id){
  const box = $('sugs-' + id); if (!box) return;
  const opts = currentSugs(id);
  box.innerHTML = opts.length ? '<span class="lbl">Opciones:</span>' + opts.map((o, i) =>
    `<button class="sug" data-i="${i}" title="Pulsa para añadirlo a tu respuesta (o quitarlo)" onclick="toggleSug('${id}',${i})">${esc(o)}</button>`).join('') : '';
  markSugs(id);
}
function sugParts(v){ return v.split(/\s*[,;\n]\s*/).map(x => x.trim()).filter(Boolean); }
function markSugs(id){
  const box = $('sugs-' + id); if (!box) return;
  const parts = sugParts($('input-' + id).value).map(x => x.toLowerCase());
  const opts = currentSugs(id);
  box.querySelectorAll('.sug').forEach(b => b.classList.toggle('on', parts.includes(opts[+b.dataset.i].toLowerCase())));
}
function toggleSug(id, i){
  const t = $('input-' + id); if (t.disabled) return;
  const o = currentSugs(id)[i]; if (!o) return;
  let parts = sugParts(t.value);
  const k = parts.findIndex(x => x.toLowerCase() === o.toLowerCase());
  if (k >= 0) parts.splice(k, 1); else parts.push(o);
  t.value = parts.join(', '); autoGrow(t); markSugs(id); t.focus();
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 220) + 'px'; }
function composerKey(e, id){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendUser(id); } }

// Conversación
function renderChat(id, keepScroll){
  const st = state.steps[id]; const s = STEPS.find(x => x.id === id);
  const box = $('chatin-' + id);
  if (!st.messages.length && !st.error){ box.innerHTML = `<div class="empty-state">${s.empty}</div>`; return; }
  box.innerHTML = st.messages.map((m, mi) => renderMsg(id, m, mi)).join('') +
    (st.error ? `<div class="error-box"><span>${esc(st.error)}</span><button class="btn btn-sm" onclick="retry('${id}')">Reintentar</button></div>` : '');
  if (!keepScroll) scrollChat(id);
}
function scrollChat(id){ const c = $('chat-' + id); c.scrollTop = c.scrollHeight; }
function renderMsg(id, m, mi){
  if (m.role === 'user' && m.kind === 'files') return `<div class="msg files">${esc(m.summary)}</div>`;
  if (m.role === 'user') return `<div class="msg user">${esc(m.content)}</div>`;
  const streaming = !!m.streaming;
  const segs = parseSegments(stripSugs(m.content, streaming), streaming);
  let body = segs.map(sg => {
    if (sg.type === 'text') return mdToHtml(sg.text);
    if (sg.type === 'code') return `<pre>${esc(sg.body)}</pre>`;
    const text = (m.edits && m.edits[sg.idx] != null) ? m.edits[sg.idx] : sg.body;
    if (sg.writing) return `<div class="filecard writing"><div class="ico">¶</div><div><div class="fn">${esc(sg.name)}</div><div class="meta">Escribiendo… ${kb(text)}</div></div></div>`;
    return `<div class="filecard"><div class="ico">¶</div><div><div class="fn">${esc(sg.name)}</div><div class="meta">${kb(text)}${m.edits && m.edits[sg.idx] != null ? ' · editado' : ''}</div></div>
      <div class="fbtns"><button class="btn btn-sm" onclick="openOutput('${id}',${mi},${sg.idx})">Ver y editar</button>
      <button class="btn btn-sm btn-primary" onclick="downloadOutput('${id}',${mi},${sg.idx})">Descargar</button>${id === 'esencial' ? `<button class="btn btn-sm btn-primary" onclick="setTab('plan')">Pasar al paso 3 →</button>` : ''}</div></div>`;
  }).join('');
  if (streaming && !m.content) body = `<div class="thinking">${m.thinking ? 'Pensando…' : 'Esperando respuesta…'}</div>`;
  const tail = m.note ? `<div class="thinking">${esc(m.note)}</div>` : '';
  return `<div class="msg assistant"><div class="who"><span>${esc(m.modelLabel || '')}</span>${streaming ? '' : `<button onclick="copyMsg('${id}',${mi})">Copiar</button>`}</div>
    <div class="md ${streaming && m.content ? 'cursor' : ''}">${body}</div>${tail}</div>`;
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector de Interés — Monografía Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #f7f3ec;
    --ink:      #2b2318;
    --ink-mid:  #5a4e3c;
    --ink-soft: #8c7d69;
    --border:   #d6cfc3;
    --accent:   #7a5230;
    --accent-soft: #b08050;

    /* heat gradient — from cool/neutral to warm/vivid */
    --h0: #f7f3ec;   /* sin interés */
    --h1: #eef0d8;
    --h2: #d9e8b0;
    --h3: #b5d97a;
    --h4: #f5d26a;
    --h5: #f0a832;
    --h6: #e06020;   /* máximo interés */

    --ui: 'Inter', sans-serif;
    --serif: 'Crimson Pro', Georgia, serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.72;
    min-height: 100dvh;
  }

  /* ── header ── */
  header {
    border-bottom: 1.5px solid var(--border);
    padding: 20px 32px 16px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .logo span { color: var(--ink-soft); font-weight: 400; font-size: .9rem; }

  /* ── main layout ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ── input area ── */
  .input-panel {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
    transition: border-color .2s;
  }
  .input-panel:focus-within { border-color: var(--accent-soft); }

  .input-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: #f0ece4;
  }
  .tab-btn {
    font-family: var(--ui);
    font-size: .78rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 9px 18px;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-btn:hover:not(.active) { color: var(--ink); }

  .tab-pane { display: none; padding: 16px; }
  .tab-pane.active { display: block; }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    border: none;
    outline: none;
    font-family: var(--serif);
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink);
    background: transparent;
  }
  textarea::placeholder { color: var(--ink-soft); }

  .file-drop {
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    padding: 32px 24px;
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--ui);
    font-size: .85rem;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .file-drop:hover, .file-drop.over {
    border-color: var(--accent-soft);
    background: #fdf9f4;
  }
  .file-drop svg { display: block; margin: 0 auto 10px; opacity: .45; }
  #file-input { display: none; }
  .file-name {
    margin-top: 10px;
    font-size: .8rem;
    color: var(--accent);
    font-style: italic;
    min-height: 1.2em;
  }

  /* ── action bar ── */
  .action-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .btn-analyze {
    font-family: var(--ui);
    font-size: .85rem;
    font-weight: 500;
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-analyze:hover { background: #5e3c20; }
  .btn-analyze:active { transform: scale(.97); }
  .btn-analyze:disabled { background: var(--ink-soft); cursor: not-allowed; }

  .btn-clear {
    font-family: var(--ui);
    font-size: .82rem;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .btn-clear:hover { color: var(--ink); border-color: var(--ink-soft); }

  .status-msg {
    font-family: var(--ui);
    font-size: .8rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  /* ── legend ── */
  .legend {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-family: var(--ui);
    font-size: .75rem;
    color: var(--ink-soft);
  }
  .legend-label { margin-right: 4px; }
  .legend-swatch {
    width: 22px;
    height: 12px;
    border-radius: 2px;
    display: inline-block;
  }
  .legend-end { margin-left: 2px; }

  /* ── result ── */
  #result-area { display: none; }

  .result-title {
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink-mid);
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .para-block {
    position: relative;
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 3px;
    border-left: 3px solid transparent;
    transition: background .4s, border-color .3s;
    cursor: default;
  }

  /* heat levels */
  .h0 { background: var(--h0); border-left-color: #ccc8be; }
  .h1 { background: var(--h1); border-left-color: #c0cc90; }
  .h2 { background: var(--h2); border-left-color: #90c040; }
  .h3 { background: var(--h3); border-left-color: #90c040; }
  .h4 { background: var(--h4); border-left-color: #d4a820; }
  .h5 { background: var(--h5); border-left-color: #c06010; }
  .h6 { background: var(--h6); border-left-color: #b03000; color: white; }

  /* tooltip */
  .para-block::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 10px;
    max-width: 340px;
    background: #2b2318ee;
    color: #f7f3ec;
    font-family: var(--ui);
    font-size: .74rem;
    line-height: 1.4;
    padding: 7px 11px;
    border-radius: 3px;
    pointer-events: none;
    white-space: pre-wrap;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .18s, transform .18s;
    z-index: 10;
  }
  .para-block:hover::after {
    opacity: 1;
    transform: translateY(0);
  }

  .score-badge {
    float: right;
    margin-left: 10px;
    margin-top: 2px;
    font-family: var(--ui);
    font-size: .72rem;
    font-weight: 500;
    color: var(--ink-mid);
    background: rgba(255,255,255,.55);
    border-radius: 20px;
    padding: 1px 8px;
  }
  .h6 .score-badge { color: white; background: rgba(0,0,0,.18); }

  /* spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 540px) {
    main { padding: 20px 14px 60px; }
    header { padding: 14px 16px; }
    .para-block::after { max-width: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: white; }
    .para-block, .para-block::after { transition: none; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e1a14;
      --ink: #ece5d8;
      --ink-mid: #c8b89a;
      --ink-soft: #8c7d69;
      --border: #3a3028;
      --accent: #c8884a;
      --accent-soft: #a06030;
      --h0: #1e1a14;
      --h1: #252d14;
      --h2: #1e3010;
      --h3: #1e3a0a;
      --h4: #3a2a00;
      --h5: #4a2000;
      --h6: #5a1800;
    }
    .input-tabs { background: #26211a; }
    .input-panel { background: #221e18; }
    textarea { color: var(--ink); }
    .score-badge { color: var(--ink-mid); background: rgba(0,0,0,.3); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Mapa de Interés <span>/ Monografía local</span></div>
</header>

<main>

  <!-- INPUT PANEL -->
  <div class="input-panel" id="input-panel">
    <div class="input-tabs">
      <button class="tab-btn active" data-tab="text">Pegar texto</button>
      <button class="tab-btn" data-tab="file">Cargar fichero</button>
    </div>
    <div class="tab-pane active" id="tab-text">
      <textarea id="text-input" placeholder="Pega aquí un fragmento de la monografía (un capítulo, una sección…)"></textarea>
    </div>
    <div class="tab-pane" id="tab-file">
      <div class="file-drop" id="file-drop">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        <div>Arrastra un fichero <strong>.txt</strong> o <strong>.md</strong>, o haz clic para seleccionar</div>
        <div class="file-name" id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept=".txt,.md,.text">
    </div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <button class="btn-analyze" id="btn-analyze">Analizar interés</button>
    <button class="btn-clear" id="btn-clear" style="display:none">Limpiar</button>
    <span class="status-msg" id="status-msg"></span>
  </div>

  <!-- LEGEND -->
  <div class="legend" id="legend" style="display:none">
    <span class="legend-label">Interés para el lector:</span>
    <span class="legend-swatch" style="background:var(--h0)"></span>Nulo
    <span class="legend-swatch" style="background:var(--h2)"></span>Bajo
    <span class="legend-swatch" style="background:var(--h4)"></span>Medio
    <span class="legend-swatch" style="background:var(--h5)"></span>Alto
    <span class="legend-swatch" style="background:var(--h6)"></span>Máximo
    <span class="legend-end" style="margin-left:8px;font-style:italic;">— pasa el ratón sobre cada párrafo para ver el motivo</span>
  </div>

  <!-- RESULT -->
  <div id="result-area">
    <div class="result-title">Resultado del análisis</div>
    <div id="result-blocks"></div>
  </div>

</main>

<script>
// ── tabs ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── file drop ──
const fileDrop = document.getElementById('file-drop');
const fileInput = document.getElementById('file-input');
const fileName = document.getElementById('file-name');

fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('over'));
fileDrop.addEventListener('drop', e => {
  e.preventDefault();
  fileDrop.classList.remove('over');
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

function handleFile(f) {
  if (!f) return;
  if (!f.name.match(/\.(txt|md|text)$/i)) {
    fileName.textContent = '⚠ Solo se aceptan ficheros .txt o .md';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('text-input').value = e.target.result;
    fileName.textContent = '✓ ' + f.name;
    // switch to text tab so the user can edit if needed
    document.querySelectorAll('.tab-btn')[0].click();
  };
  reader.readAsText(f, 'UTF-8');
}

// ── analyze ──
const btnAnalyze = document.getElementById('btn-analyze');
const btnClear   = document.getElementById('btn-clear');
const statusMsg  = document.getElementById('status-msg');
const resultArea = document.getElementById('result-area');
const resultBlocks = document.getElementById('result-blocks');
const legend     = document.getElementById('legend');

btnAnalyze.addEventListener('click', runAnalysis);
btnClear.addEventListener('click', clearAll);

function clearAll() {
  document.getElementById('text-input').value = '';
  resultArea.style.display = 'none';
  legend.style.display = 'none';
  btnClear.style.display = 'none';
  statusMsg.textContent = '';
}

async function runAnalysis() {
  const rawText = document.getElementById('text-input').value.trim();
  if (!rawText) { statusMsg.textContent = 'Introduce o pega un texto primero.'; return; }

  // split into paragraphs (non-empty lines or groups)
  const paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
  if (paragraphs.length === 0) { statusMsg.textContent = 'No se encontraron párrafos.'; return; }

  btnAnalyze.disabled = true;
  btnAnalyze.innerHTML = '<span class="spinner"></span>Analizando…';
  statusMsg.textContent = '';
  resultArea.style.display = 'none';
  legend.style.display = 'none';

  const prompt = buildPrompt(paragraphs);

  let scored;
  try {
    scored = await callClaude(prompt, paragraphs.length);
  } catch(err) {
    statusMsg.textContent = 'Error al conectar con la IA: ' + err.message;
    btnAnalyze.disabled = false;
    btnAnalyze.textContent = 'Analizar interés';
    return;
  }

  renderResult(paragraphs, scored);
  btnAnalyze.disabled = false;
  btnAnalyze.textContent = 'Volver a analizar';
  btnClear.style.display = '';
  legend.style.display = '';
  resultArea.style.display = '';
  statusMsg.textContent = '';
}

function buildPrompt(paragraphs) {
  const list = paragraphs.map((p, i) => `[${i}] ${p}`).join('\n\n');
  return `Eres un experto en comunicación de historia local castellana.
El texto siguiente es un fragmento de una monografía sobre un municipio rural de Castilla (Castroverde de Cerrato, en el valle del Esgueva).
El lector objetivo es un vecino del pueblo o una persona emigrada que guarda vínculos sentimentales con el lugar.

Para cada párrafo numerado [i], evalúa en qué medida puede resultar interesante o emocionalmente significativo para ese lector (historia del pueblo, personajes locales, tradiciones, paisaje, familia, emigración, recuerdos, curiosidades del pasado…).

Devuelve SOLO un array JSON con este formato exacto, sin texto adicional, sin markdown:
[{"i":0,"score":8,"reason":"Motivo breve en español (máx. 90 caracteres)"},...]

Escala: 0 = sin interés / 10 = máximo interés emocional o histórico para el vecino.

PÁRRAFOS:
${list}`;
}

async function callClaude(prompt, n) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || resp.statusText);
  }
  const data = await resp.json();
  const text = data.content.map(b => b.text || '').join('');
  // strip possible markdown fences
  const clean = text.replace(/```json|```/g, '').trim();
  let arr;
  try { arr = JSON.parse(clean); } catch(e) {
    // try to extract JSON array from text
    const m = clean.match(/\[[\s\S]*\]/);
    if (!m) throw new Error('La IA no devolvió un JSON válido.');
    arr = JSON.parse(m[0]);
  }
  // ensure all paragraphs have an entry
  const map = {};
  arr.forEach(item => { map[item.i] = item; });
  return Array.from({length: n}, (_, i) => map[i] || {i, score: 0, reason: ''});
}

function scoreToClass(s) {
  if (s <= 0)  return 'h0';
  if (s <= 2)  return 'h1';
  if (s <= 3)  return 'h2';
  if (s <= 5)  return 'h3';
  if (s <= 6)  return 'h4';
  if (s <= 8)  return 'h5';
  return 'h6';
}

function renderResult(paragraphs, scored) {
  resultBlocks.innerHTML = '';
  paragraphs.forEach((p, i) => {
    const item = scored[i] || {score: 0, reason: ''};
    const div = document.createElement('div');
    div.className = 'para-block ' + scoreToClass(item.score);
    const tooltip = item.reason
      ? `Interés ${item.score}/10 — ${item.reason}`
      : `Interés ${item.score}/10`;
    div.setAttribute('data-tooltip', tooltip);

    const badge = document.createElement('span');
    badge.className = 'score-badge';
    badge.textContent = item.score + '/10';

    div.appendChild(badge);
    div.appendChild(document.createTextNode(p));
    resultBlocks.appendChild(div);
  });
}
</script>
</body>
</html>

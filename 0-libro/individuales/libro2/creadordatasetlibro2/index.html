<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Castroverde - Knowledge Base Builder</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f0f2f5; color: #1c1e21; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; border-bottom: 3px solid #1a73e8; padding-bottom: 10px; }
        .section { background: #fafafa; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        h3 { margin-top: 0; color: #444; display: flex; align-items: center; gap: 10px; }
        textarea { width: 100%; height: 120px; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; box-sizing: border-box; font-size: 14px; }
        .output-prompt { background: #f8f9fa; border: 2px dashed #fbbc05; color: #444; height: 100px; font-style: italic; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: #1a73e8; color: white; }
        .btn-green { background: #34a853; color: white; }
        .btn-red { background: #ea4335; color: white; }
        .btn-info { background: #607d8b; color: white; font-size: 0.8em; }
        pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; max-height: 300px; font-size: 13px; }
        .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-size: 0.7em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ Base de Conocimiento: Castroverde</h1>
    
    <div class="section">
        <h3>1. Configuración de Sistema <button class="btn-info" onclick="alert('Siguiendo protocolo de Base de Conocimiento Histórica: Texto analítico, Siglos ponderados y Entidades extensibles.')">Ver Criterios IA</button></h3>
        <textarea id="indiceInput" placeholder="Pega el índice aquí..."></textarea>
        <button class="btn-blue" onclick="saveIndice()">💾 Guardar Índice Maestro</button>
    </div>

    <div class="section" style="border-left: 5px solid #fbbc05;">
        <h3>2. Procesador de Unidades Semánticas</h3>
        <p>Pega el fragmento original. Generaré un <b>resumen analítico</b> orientado a indexación:</p>
        <textarea id="textoParaProcesar" oninput="actualizarPrompt()" placeholder="Fragmento del libro..."></textarea>
        
        <p><b>Copia y pega esto en el chat:</b></p>
        <textarea id="promptFinal" class="output-prompt" readonly onclick="this.select()"></textarea>
        <div class="controls">
            <button style="background: #999; color: white;" onclick="limpiarCaja2()">🧹 Limpiar</button>
        </div>
    </div>

    <div class="section" style="border-left: 5px solid #34a853;">
        <h3>3. Repositorio JSON (Dataset Final)</h3>
        <textarea id="jsonInput" placeholder="Pega el JSON analítico aquí..."></textarea>
        <div class="controls">
            <button class="btn-green" onclick="appendJson()">➕ Integrar en Base de Conocimiento</button>
            <button class="btn-blue" onclick="downloadJson()">📥 Exportar Dataset (.json)</button>
            <button class="btn-red" onclick="clearData()">🗑️ Reiniciar Dataset</button>
        </div>
    </div>

    <h3>Vista Previa de la Estructura:</h3>
    <pre id="preview">[]</pre>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedIndice = localStorage.getItem('castroverde_indice');
        if (savedIndice) document.getElementById('indiceInput').value = savedIndice;
        updatePreview();
    });

    function saveIndice() {
        localStorage.setItem('castroverde_indice', document.getElementById('indiceInput').value);
        alert("Índice Maestro guardado.");
    }

    function actualizarPrompt() {
        const texto = document.getElementById('textoParaProcesar').value;
        const cajaPrompt = document.getElementById('promptFinal');
        if (texto.trim() === "") { cajaPrompt.value = ""; return; }
        
        cajaPrompt.value = `Actúa como responsable de base de conocimiento histórica. Procesa este fragmento según el índice y los criterios de: resumen analítico, distinción de siglos (principal/referencia) y entidades como objetos. \n\nTEXTO A PROCESAR:\n"${texto}"`;
    }

    function limpiarCaja2() {
        document.getElementById('textoParaProcesar').value = "";
        document.getElementById('promptFinal').value = "";
    }

    function appendJson() {
        const input = document.getElementById('jsonInput').value;
        if (!input) return;
        try {
            const jsonMatch = input.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
            const newData = JSON.parse(jsonMatch[0]);
            let currentData = JSON.parse(localStorage.getItem('castroverde_dataset') || "[]");
            if (Array.isArray(newData)) currentData = currentData.concat(newData);
            else currentData.push(newData);
            localStorage.setItem('castroverde_dataset', JSON.stringify(currentData));
            document.getElementById('jsonInput').value = "";
            updatePreview();
        } catch (e) {
            alert("Error en el formato JSON.");
        }
    }

    function updatePreview() {
        const data = localStorage.getItem('castroverde_dataset') || "[]";
        document.getElementById('preview').innerText = JSON.stringify(JSON.parse(data), null, 2);
    }

    function downloadJson() {
        const data = localStorage.getItem('castroverde_dataset') || "[]";
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'kb_castroverde_cerrato.json';
        a.click();
    }

    function clearData() {
        if (confirm("¿Seguro que quieres borrar la base de conocimiento acumulada?")) {
            localStorage.setItem('castroverde_dataset', "[]");
            updatePreview();
        }
    }
</script>

</body>
</html>

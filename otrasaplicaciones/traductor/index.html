<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre Traducteur</title>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* (el mismo CSS base, solo añado mejoras para la tabla de vocabulario) */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#f5f2ee;--surface:#fff;--accent:#2d6a4f;--al:#b7e4c7;--am:#d8f3dc;
  --t1:#1a1a2e;--t2:#555b6e;--tm:#9aa0b0;--bd:#e2ddd6;
  --sh:0 4px 24px rgba(0,0,0,.07);--r:16px;--red:#c0392b;--blue:#2c4a7c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 80px}
header{text-align:center;margin:28px 0 16px;padding:0 16px}
header h1{font-family:'Playfair Display',serif;font-size:2.3rem;font-weight:600;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{margin-top:6px;font-size:.88rem;color:var(--tm);font-weight:300}
.lang-selector{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--bd);border-radius:100px;padding:5px 6px 5px 14px;margin-bottom:18px;box-shadow:var(--sh);flex-wrap:wrap;justify-content:center;max-width:680px;width:100%}
.ls-label{font-size:.72rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--tm);white-space:nowrap;margin-right:2px}
.lp-btn{border:1.5px solid var(--bd);background:transparent;padding:5px 13px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--t2);transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.lp-btn:hover{border-color:var(--accent);background:var(--am)}
.lp-btn.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:500}
.lp-flag{font-size:1rem;line-height:1}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--bd);border-radius:100px;padding:4px;margin-bottom:24px;box-shadow:var(--sh)}
.tab{border:none;background:transparent;padding:9px 20px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--tm);transition:all .2s;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.panel{display:none;width:100%;max-width:680px;flex-direction:column;align-items:center;gap:16px;padding:0 16px}
.panel.on{display:flex}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:28px 32px;width:100%;border:1px solid var(--bd)}
.badge-lang{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--tm);margin-bottom:10px;transition:color .3s}
.badge-lang .dot{width:7px;height:7px;border-radius:50%;background:var(--tm);transition:background .3s;flex-shrink:0}
.badge-lang.on .dot{background:var(--accent)}
.badge-lang.on{color:var(--accent)}
.inp-wrap{position:relative}
input[type=text]{width:100%;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:1.1rem;color:var(--t1);background:transparent;line-height:1.7;caret-color:var(--accent);padding-right:28px}
input::placeholder{color:var(--tm);font-weight:300}
.clr{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tm);cursor:pointer;font-size:.85rem;display:none;line-height:1}
.clr.on{display:block}
.inp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid var(--bd);padding-top:14px}
#charCount{font-size:.78rem;color:var(--tm)}
.btn-p{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.87rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s}
.btn-p:hover:not(:disabled){background:#1f4e38}
.btn-p:disabled{opacity:.6;cursor:not-allowed}
.btn-s{background:transparent;color:var(--accent);border:1.5px solid var(--accent);padding:9px 18px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-s:hover{background:var(--am)}
.btn-s.red{border-color:var(--red);color:var(--red)}
.btn-s.red:hover{background:#fdecea}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.spin.on{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.result-card{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.res-label{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.res-dir{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.res-word{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--accent);line-height:1.5}
.res-phon{font-size:.78rem;color:var(--tm);margin-top:4px}
.pos-pill{display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:var(--am);border:1px solid var(--bd);border-radius:4px;padding:.15rem .5rem;color:var(--accent);margin-top:6px}
.trans-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.trans-opt{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);cursor:pointer;transition:all .15s;user-select:none}
.trans-opt:hover{border-color:var(--accent);background:var(--am)}
.trans-opt.on{border-color:var(--accent);background:var(--am)}
.trans-opt .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.trans-opt.on .radio{border-color:var(--accent);background:var(--accent)}
.trans-opt.on .radio::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.trans-w{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent);line-height:1.3}
.trans-custom{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;border:1.5px dashed var(--bd);background:transparent;margin-top:2px;transition:border-color .15s;cursor:text}
.trans-custom.on{border-color:var(--accent);border-style:solid;background:var(--am)}
.trans-custom .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.trans-custom.on .radio{border-color:var(--accent);background:var(--accent)}
.trans-custom.on .radio::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff}
.trans-custom input{border:none;outline:none;background:transparent;font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent);width:100%;caret-color:var(--accent)}
.trans-custom input::placeholder{font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--tm);font-style:italic;font-weight:300}
.sec-title{font-size:.69rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--am);color:var(--accent);padding:5px 13px;border-radius:100px;font-size:.81rem}
.ex-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.ex-list li{font-size:.91rem;color:var(--t2);padding-left:14px;border-left:2px solid var(--al);line-height:1.6}
.ex-list li mark{background:none;font-weight:600;color:var(--accent)}
.divider{height:1px;background:var(--bd);margin:18px 0}
.skel{background:linear-gradient(90deg,#ede8e1 25%,#e5e0d8 50%,#ede8e1 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:1.7rem;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#resultSec{display:none;width:100%}
#resultSec.on{display:flex;flex-direction:column;gap:16px}
.vocab-top{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.vocab-top h2{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600}
.vcnt{font-size:.78rem;background:var(--am);color:var(--accent);padding:3px 10px;border-radius:100px;font-weight:500}
.vocab-filters{display:flex;gap:6px;flex-wrap:wrap}
.vf-btn{border:1.5px solid var(--bd);background:transparent;padding:4px 12px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.75rem;cursor:pointer;color:var(--t2);transition:all .2s}
.vf-btn:hover{border-color:var(--accent);background:var(--am)}
.vf-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);width:100%}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:.85rem;min-width:550px}
th{background:var(--accent);color:#fff;padding:10px 13px;text-align:left;font-weight:500;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--bd);vertical-align:middle;line-height:1.4;color:var(--t2);white-space:nowrap}
td:first-child, th:first-child { padding-left: 13px; }
td:last-child, th:last-child { padding-right: 13px; }
/* Anchos sugeridos para columnas */
th:nth-child(1), td:nth-child(1) { width: 45px; text-align: center; }
th:nth-child(2), td:nth-child(2) { min-width: 110px; }
th:nth-child(3), td:nth-child(3) { min-width: 110px; }
th:nth-child(4), td:nth-child(4) { width: 70px; text-align: center; }
th:nth-child(5), td:nth-child(5) { min-width: 130px; }
th:nth-child(6), td:nth-child(6) { width: 95px; text-align: center; }
th:nth-child(7), td:nth-child(7) { width: 50px; text-align: center; }
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.td-a{font-weight:500;color:var(--t1);white-space:normal;word-break:break-word}
.td-b{font-style:italic;color:var(--accent);white-space:normal;word-break:break-word}
.td-sm{font-size:.78rem;white-space:normal;word-break:break-word}
.lang-tag{display:inline-block;font-size:.6rem;background:var(--am);color:var(--accent);border-radius:4px;padding:1px 6px;font-weight:600;letter-spacing:.3px;margin-left:4px;vertical-align:middle}
.del{background:none;border:none;cursor:pointer;color:#ccc;font-size:.95rem;padding:2px 6px;border-radius:6px;transition:all .2s}
.del:hover{color:var(--red);background:#fdecea}
.tbl-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;width:100%}
.empty{text-align:center;padding:60px 24px;color:var(--tm);width:100%}
.empty .ico{font-size:2.5rem;margin-bottom:12px}
.quiz-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:32px;width:100%;border:1px solid var(--bd);text-align:center}
.mode-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{border:1.5px solid var(--bd);background:var(--bg);padding:7px 16px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--t2);transition:all .2s}
.mode-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.q-progress{font-size:.76rem;color:var(--tm);margin-bottom:8px}
.q-bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:24px;overflow:hidden}
.q-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.q-label{font-size:.69rem;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:8px}
.q-word{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:var(--t1);margin-bottom:24px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.q-opt{border:1.5px solid var(--bd);background:var(--bg);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;text-align:left;color:var(--t1);transition:all .2s}
.q-opt:hover:not(:disabled){border-color:var(--accent);background:var(--am)}
.q-opt.ok{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.q-opt.bad{border-color:var(--red);background:#fdecea;color:var(--red)}
.q-opt:disabled{cursor:not-allowed}
.q-fb{min-height:22px;font-size:.9rem;font-weight:500;margin-bottom:14px}
.q-fb.ok{color:var(--accent)}
.q-fb.bad{color:var(--red)}
.res-stats{display:flex;gap:28px;justify-content:center;margin-bottom:28px}
.res-stat .val{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--accent)}
.res-stat .lbl{font-size:.71rem;color:var(--tm);text-transform:uppercase;letter-spacing:.5px}
@media(max-width:540px){
  .card,.quiz-card{padding:20px 16px}
  .q-opts{grid-template-columns:1fr}
  .q-word{font-size:1.5rem}
  header h1{font-size:1.9rem}
  /* En móvil, permitir que algunas columnas se ajusten */
  th:nth-child(5), td:nth-child(5){ min-width: 100px; }
  td{ white-space: normal; }
}
.td-edit{position:relative}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--tm);font-size:.8rem;padding:2px 5px;border-radius:5px;transition:all .2s;opacity:0}
tr:hover .edit-btn{opacity:1}
.edit-btn:hover{color:var(--accent);background:var(--am)}
.td-editable{outline:none;border-bottom:1.5px solid var(--accent);background:var(--am);border-radius:3px 3px 0 0;padding:2px 4px;min-width:60px;font-family:inherit;font-size:inherit;color:var(--accent)}
.save-edit{background:var(--accent);color:#fff;border:none;padding:3px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;margin-left:4px}
.cancel-edit{background:none;border:1px solid var(--bd);color:var(--t2);padding:3px 8px;border-radius:6px;font-size:.75rem;cursor:pointer;margin-left:2px}
footer{margin-top:24px;font-size:.73rem;color:var(--tm);text-align:center;padding:0 16px}
.dir-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dir-btn{flex:1;min-width:140px;border:1.5px solid var(--bd);background:var(--bg);border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:.83rem;cursor:pointer;color:var(--t2);transition:all .2s;display:flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap}
.dir-btn:hover{border-color:var(--accent);background:var(--am)}
.dir-btn.on{border-color:var(--accent);background:var(--am);color:var(--accent);font-weight:500}
.dir-arrow{color:var(--tm);font-size:.8rem;margin:0 2px}
</style>
</head>

</html>

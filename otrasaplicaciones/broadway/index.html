<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Cines Broadway · Valladolid</title>
    <!-- Tailwind desde jsdelivr (sin warning de producción) -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.3/tailwindcss.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }

                <!-- refresh-cw -->

                <span class="hidden sm:inline">Actualizar</span>

            <button onclick="toggleFiltros()" id="btn-filtros"

    <!-- Panel de filtros -->

                    <option value="time-asc">Antes de empezar primero</option>

            <div class="relative">

                <select id="tag-filter" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-base text-slate-700 focus:outline-none focus:border-amber-500 transition appearance-none cursor-pointer">
                    <option value="all">Todos los formatos</option>
                    <option value="VOSE">Versión Original (VOSE)</option>
                    <option value="+18">+18</option>
                    <option value="+16">+16</option>
                    <option value="2D">Estándar 2D</option>
                </select>
            </div>
            <div class="relative">
                <svg class="icon w-4 h-4 text-amber-500 absolute left-3.5 top-1/2 -translate-y-1/2" fill="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <select id="rating-filter" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-base text-slate-700 focus:outline-none focus:border-amber-500 transition appearance-none cursor-pointer">
                    <option value="0">Cualquier puntuación</option>
                    <option value="7.5">Muy buenas (más de 7,5)</option>
                    <option value="6.5">Buenas (más de 6,5)</option>
                    <option value="5.0">Aceptables (más de 5)</option>

            </div>
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-slate-200 text-sm text-slate-500">
            <span><span id="movies-count" class="font-semibold text-amber-600">0</span> películas</span>
            <button id="reset-filters" class="hover:text-slate-800 underline transition hidden">Quitar filtros</button>
        </div>
    </div>

    <!-- Grid de películas -->
    <div id="movies-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Estado vacío -->
    <div id="empty-state" class="hidden text-center py-16 bg-white border border-slate-200 rounded-2xl">
        <p class="text-lg font-semibold text-slate-600">No se encontraron películas</p>
        <p class="text-base text-slate-400 mt-1">Prueba ajustando los filtros.</p>
    </div>

</main>

<!-- Footer -->
<footer class="mt-auto bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-400">
    <p>Cines Broadway · Calle García Morato 34, Valladolid · Datos de eCartelera + FilmAffinity</p>
</footer>

<script>
// ─────────────────────────────────────────────
//  CONFIGURACIÓN
// ─────────────────────────────────────────────
const ECARTELERA_URL = 'https://www.ecartelera.com/cines/497,0,1.html';

// corsproxy.io es el más fiable desde github.io; thingproxy como segundo
const PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

let moviesData = [];

// ─────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────
function showLoading(msg = 'Cargando cartelera…', sub = 'Obteniendo datos de eCartelera') {
    document.getElementById('movies-grid').innerHTML = `
        <div class="col-span-full flex flex-col items-center justify-center py-20 gap-4 text-slate-500">
            <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full spin"></div>
            <p class="text-lg font-medium">${msg}</p>
            <p class="text-sm text-slate-400">${sub}</p>
        </div>`;
    document.getElementById('empty-state').classList.add('hidden');
}

function showError(msg) {
    document.getElementById('movies-grid').innerHTML = `
        <div class="col-span-full flex flex-col items-center justify-center py-20 gap-3 text-slate-500">
            <svg class="w-12 h-12 text-red-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
            </svg>
            <p class="text-lg font-semibold text-red-500">No se pudo cargar la cartelera</p>
            <p class="text-sm text-slate-400 text-center max-w-sm">${msg}</p>
            <button onclick="loadCartelera()" class="mt-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold px-5 py-2.5 rounded-xl transition text-base">
                Reintentar
            </button>
        </div>`;
}

// ─────────────────────────────────────────────
//  PROXY FETCH CON FALLBACK
// ─────────────────────────────────────────────
async function proxyFetch(targetUrl) {
    let lastErr;
    for (const build of PROXIES) {
        try {
            const r = await fetch(build(targetUrl), { signal: AbortSignal.timeout(12000) });
            if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
            const text = await r.text();
            // allorigins devuelve JSON {contents:…}; los demás devuelven HTML directo
            try { const j = JSON.parse(text); if (j.contents) return j.contents; } catch {}
            if (text.trim().startsWith('<') || text.length > 500) return text;
            lastErr = new Error('Respuesta vacía del proxy');
        } catch (e) { lastErr = e; }
    }
    throw new Error('Ningún proxy CORS funcionó: ' + (lastErr?.message || ''));
}

// ─────────────────────────────────────────────
//  PARSEAR ECARTELERA
// ─────────────────────────────────────────────
function parseECartelera(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const movies = [];
    const seen = new Set();

    // Cada película tiene un enlace <a href="/peliculas/...">Título</a>
    doc.querySelectorAll('a[href^="/peliculas/"]').forEach(link => {
        const titulo = link.textContent.trim();
        if (!titulo || seen.has(titulo)) return;
        seen.add(titulo);

        // Subir hasta encontrar el contenedor que tiene horarios
        let container = link;
        for (let i = 0; i < 10; i++) {
            container = container.parentElement;
            if (!container) break;
            if (container.querySelector('a[href^="/cines/comprar/"]')) break;
        }
        if (!container) return;

        // Horarios
        const horarios = Array.from(container.querySelectorAll('a[href^="/cines/comprar/"]'))
            .map(a => a.textContent.trim())
            .filter(h => /^\d{1,2}:\d{2}$/.test(h));

        // Texto del bloque para extraer metadatos
        const texto = container.innerText || container.textContent || '';

        // Director (busca "Dir.: Nombre")
        const dirM = texto.match(/Dir\.?\s*:?\s*([A-ZÁÉÍÓÚÜÑ][^\n\r,]{2,50})/);
        const director = dirM ? dirM[1].trim() : 'Desconocido';

        // Género (busca la línea con duración o país seguida de género)
        const genM = texto.match(/(?:\d+ min\.)?\s*(?:[A-ZÁÉÍÓÚÜ][a-záéíóúüñ ]{2,20})\s+([\wáéíóúüñÁÉÍÓÚÜÑ \/+]{3,30}?)(?:\n|Dir|$)/m);
        const genero = genM ? genM[1].trim() : 'Sin clasificar';

        // Póster
        const img = container.querySelector('img[src*="/carteles/"]');
        const poster = img ? img.src.replace(/_mini\.jpg$/, '_large.jpg') : '';

        // Tags
        const tags = [];
        if (/VOSE/i.test(texto)) tags.push('VOSE');
        if (/\+18/.test(texto)) tags.push('+18');
        else if (/\+16/.test(texto)) tags.push('+16');
        else if (/\+12/.test(texto)) tags.push('+12');
        if (tags.length === 0) tags.push('2D');

        // Nota de eCartelera (si aparece)
        const notaM = texto.match(/\b([6-9]\.[0-9])\b/);
        const notaEC = notaM ? parseFloat(notaM[1]) : 0;

        // URL de la película en eCartelera para buscar FA
        const peliculaPath = link.getAttribute('href');

        movies.push({
            id: String(movies.length + 1),
            titulo, director, genero, tags, poster,
            originalTitle: '',
            horarios: horarios.length ? horarios : ['Consultar web'],
            notaEC, peliculaPath,
            filmaffinity: { rating: notaEC, votos: notaEC ? 'eCartelera' : 'Sin datos', sinopsis: '', valoracionGeneral: '', url: 'https://www.filmaffinity.com/es/' }
        });
    });

    return movies;
}

// ─────────────────────────────────────────────
//  FILMAFFINITY
// ─────────────────────────────────────────────
async function fetchFA(titulo) {
    try {
        const searchUrl = `https://www.filmaffinity.com/es/search.php?stext=${encodeURIComponent(titulo)}&stype=tit`;
        const html = await proxyFetch(searchUrl);
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // Si fue directo a la ficha (1 resultado), la URL canónica tiene /filmXXX.html
        let filmUrl = null;
        const canon = doc.querySelector('link[rel="canonical"]');
        if (canon && /film\d+\.html/.test(canon.getAttribute('href'))) {
            filmUrl = canon.getAttribute('href');
        }
        if (!filmUrl) {
            const a = doc.querySelector('.mc-title a, .se-it .mc-title a');
            if (a) filmUrl = 'https://www.filmaffinity.com' + a.getAttribute('href');
        }
        if (!filmUrl) return null;
        if (filmUrl.startsWith('/')) filmUrl = 'https://www.filmaffinity.com' + filmUrl;

        const fhtml = await proxyFetch(filmUrl);
        const fdoc = new DOMParser().parseFromString(fhtml, 'text/html');

        const ratingEl = fdoc.querySelector('[id^="movie-rat-avg"]') || fdoc.querySelector('.avgrat-box');
        const rating = ratingEl ? parseFloat(ratingEl.textContent.trim().replace(',', '.')) || 0 : 0;

        const votosEl = fdoc.querySelector('[id^="movie-count-rat"]') || fdoc.querySelector('.rat-count');
        const votos = votosEl ? votosEl.textContent.trim() : 'Sin datos';

        const sinopsisEl = fdoc.querySelector('[id^="plot-txt-"]') || fdoc.querySelector('.movie-plot');
        const sinopsis = sinopsisEl ? sinopsisEl.textContent.trim().replace(/\s+/g, ' ') : '';

        const origEl = fdoc.querySelector('[itemprop="alternativeHeadline"]');
        const originalTitle = origEl ? origEl.textContent.trim() : '';

        return { rating, votos, sinopsis, url: filmUrl, originalTitle };
    } catch { return null; }
}

// ─────────────────────────────────────────────
//  CARGA PRINCIPAL
// ─────────────────────────────────────────────
async function loadCartelera() {
    showLoading('Cargando cartelera de hoy…', 'Conectando con eCartelera…');
    try {
        const html = await proxyFetch(ECARTELERA_URL);
        const movies = parseECartelera(html);
        if (!movies.length) throw new Error('No se encontraron películas. Puede que eCartelera haya cambiado su estructura.');

        moviesData = movies;
        applyFilters();

        // Enriquecer con FilmAffinity en lotes de 3
        for (let i = 0; i < movies.length; i += 3) {
            await Promise.all(movies.slice(i, i + 3).map(async m => {
                const fa = await fetchFA(m.titulo);
                if (fa) {
                    m.filmaffinity.rating = fa.rating;
                    m.filmaffinity.votos = fa.votos;
                    m.filmaffinity.sinopsis = fa.sinopsis;
                    m.filmaffinity.url = fa.url;
                    if (fa.originalTitle) m.originalTitle = fa.originalTitle;
                    m.filmaffinity.valoracionGeneral =
                        fa.rating >= 7.5 ? `Muy bien valorada: ${fa.rating.toFixed(1)}/10 en FilmAffinity.` :
                        fa.rating >= 6.0 ? `Buena acogida: ${fa.rating.toFixed(1)}/10 en FilmAffinity.` :
                        fa.rating > 0   ? `Valoración discreta: ${fa.rating.toFixed(1)}/10 en FilmAffinity.` :
                                          'Aún sin valoración suficiente en FilmAffinity.';
                }
            }));
        }
        moviesData = [...movies];
        applyFilters();

    } catch (e) {
        console.error(e);
        showError(e.message || 'Error desconocido.');
    }
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function ratingClass(r) {
    if (r >= 7.5) return 'bg-emerald-100 text-emerald-700 border-emerald-300';
    if (r >= 6.0) return 'bg-amber-100 text-amber-700 border-amber-300';
    if (r > 0)    return 'bg-red-100 text-red-700 border-red-300';
    return 'bg-slate-100 text-slate-500 border-slate-300';
}

const STAR_SVG = `<svg class="icon w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
const STAR_LG  = `<svg class="icon w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
const CLOCK_SVG= `<svg class="icon w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const FILM_SVG = `<svg class="icon w-20 h-20 text-white" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>`;

function renderMovies(movies) {
    const grid = document.getElementById('movies-grid');
    const empty = document.getElementById('empty-state');
    document.getElementById('movies-count').textContent = movies.length;
    grid.innerHTML = '';
    if (!movies.length) { empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    movies.forEach(m => {
        const rc = ratingClass(m.filmaffinity.rating);
        const ratingLabel = m.filmaffinity.rating > 0 ? m.filmaffinity.rating.toFixed(1) : '—';
        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-md hover:shadow-lg hover:border-slate-300 transition duration-300 flex flex-col group';
        card.innerHTML = `
            <div class="relative h-52 overflow-hidden bg-gradient-to-br from-slate-700 to-slate-900">
                ${m.poster
                    ? `<img src="${m.poster}" alt="${m.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-80 group-hover:opacity-95" onerror="this.style.display='none'">`
                    : `<div class="w-full h-full flex items-center justify-center opacity-20">${FILM_SVG}</div>`
                }
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-slate-900/20 to-transparent"></div>
                <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
                    ${m.tags.map(t => `<span class="bg-white/90 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-md border border-slate-200 shadow-sm">${t}</span>`).join('')}
                </div>
                <div class="absolute top-3 right-3 flex items-center gap-1 px-2.5 py-1.5 rounded-xl border backdrop-blur-md bg-white/90 shadow-md ${rc}">
                    ${STAR_SVG}
                    <span class="text-sm font-bold font-mono">${ratingLabel}</span>
                    ${m.filmaffinity.rating > 0 ? '<span class="text-xs opacity-70">/10</span>' : ''}
                </div>
                <div class="absolute bottom-3 left-3 right-3">
                    <h3 class="text-lg font-bold text-white group-hover:text-amber-200 transition leading-snug drop-shadow-md">${m.titulo}</h3>
                    <p class="text-sm text-slate-200 mt-0.5 truncate drop-shadow">${m.director} · <span class="italic text-slate-300">${m.genero}</span></p>
                </div>
            </div>
            <div class="p-4 flex-grow flex flex-col gap-4">
                <div>
                    <div class="flex items-center gap-1 text-sm font-semibold text-slate-700 mb-2">
                        ${CLOCK_SVG} Horarios hoy:
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${m.horarios.map(h => `
                            <button onclick="alert('Sesión: ${m.titulo.replace(/'/g,"\\'")} a las ${h}\\nEntradas en taquilla o cbroadway.net')"
                                class="bg-slate-100 hover:bg-amber-500 hover:text-white border border-slate-300 text-slate-700 text-sm font-mono font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                                ${h}
                            </button>`).join('')}
                    </div>
                </div>
                ${m.filmaffinity.sinopsis ? `<p class="text-sm text-slate-600 line-clamp-3 leading-relaxed">${m.filmaffinity.sinopsis}</p>` : ''}
                <div class="pt-2 border-t border-slate-200 mt-auto">
                    <button onclick="toggleFA('fa-${m.id}','chev-${m.id}')"
                        class="w-full inline-flex items-center justify-center gap-2 text-sm text-amber-700 font-semibold bg-amber-50 hover:bg-amber-100 px-4 py-3 rounded-xl border border-amber-200 transition">
                        ${STAR_SVG} Ver valoraciones FilmAffinity
                        <svg id="chev-${m.id}" class="icon w-4 h-4 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                </div>
                <div id="fa-${m.id}" class="fa-panel bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5 bg-white border border-amber-300 rounded-xl px-4 py-2 shadow-sm">
                            ${STAR_LG}
                            <span class="text-3xl font-bold text-amber-700 font-mono">${ratingLabel}</span>
                            ${m.filmaffinity.rating > 0 ? '<span class="text-base text-slate-400">/10</span>' : ''}
                        </div>
                        <div class="text-sm text-slate-500 leading-snug">
                            <span class="font-semibold text-slate-700">${m.filmaffinity.votos}</span><br>
                            ${m.filmaffinity.votos === 'eCartelera' ? 'según eCartelera' : 'votos en FilmAffinity'}
                        </div>
                    </div>
                    ${m.filmaffinity.valoracionGeneral ? `
                    <div>
                        <p class="text-xs font-semibold text-amber-700 uppercase tracking-wide mb-1">Valoración</p>
                        <p class="text-sm text-slate-700 leading-relaxed">${m.filmaffinity.valoracionGeneral}</p>
                    </div>` : ''}
                    ${m.filmaffinity.url !== 'https://www.filmaffinity.com/es/' ? `
                    <a href="${m.filmaffinity.url}" target="_blank" rel="noopener"
                        class="block text-center text-xs text-amber-600 hover:text-amber-800 underline">
                        Ver ficha completa en FilmAffinity →
                    </a>` : ''}
                    <button onclick="toggleFA('fa-${m.id}','chev-${m.id}')"
                        class="w-full text-sm text-slate-500 hover:text-slate-700 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 transition">
                        Cerrar ▲
                    </button>
                </div>
            </div>`;
        grid.appendChild(card);
    });
}

// ─────────────────────────────────────────────
//  INTERACCIONES
// ─────────────────────────────────────────────
function toggleFA(panelId, chevId) {
    const p = document.getElementById(panelId);
    const c = document.getElementById(chevId);
    const open = p.classList.toggle('open');
    if (c) c.style.transform = open ? 'rotate(180deg)' : '';
    if (open) setTimeout(() => p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function toggleFiltros() {
    const p = document.getElementById('panel-filtros');
    const b = document.getElementById('btn-filtros');
    const abierto = !p.classList.contains('hidden');
    p.classList.toggle('hidden', abierto);
    b.classList.toggle('bg-amber-100', !abierto);
    b.classList.toggle('border-amber-300', !abierto);
    b.classList.toggle('text-amber-700', !abierto);
}

function applyFilters() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    const sort = document.getElementById('sort-select').value;
    const tag = document.getElementById('tag-filter').value;
    const minR = parseFloat(document.getElementById('rating-filter').value);

    let f = moviesData.filter(m =>
        (m.titulo.toLowerCase().includes(q) || m.director.toLowerCase().includes(q) || m.genero.toLowerCase().includes(q)) &&
        (tag === 'all' || m.tags.includes(tag)) &&
        (m.filmaffinity.rating >= minR)
    );

    if (sort === 'rating-desc') f.sort((a,b) => b.filmaffinity.rating - a.filmaffinity.rating);
    else if (sort === 'time-asc') f.sort((a,b) => a.horarios[0].localeCompare(b.horarios[0]));
    else f.sort((a,b) => a.titulo.localeCompare(b.titulo));

    document.getElementById('reset-filters').classList.toggle('hidden', !q && tag === 'all' && minR === 0);
    renderMovies(f);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
document.getElementById('current-date-str').textContent =
    new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });

document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('sort-select').addEventListener('change', applyFilters);
document.getElementById('tag-filter').addEventListener('change', applyFilters);
document.getElementById('rating-filter').addEventListener('change', applyFilters);
document.getElementById('reset-filters').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    document.getElementById('sort-select').value = 'rating-desc';
    document.getElementById('tag-filter').value = 'all';
    document.getElementById('rating-filter').value = '0';
    applyFilters();
});

loadCartelera();
</script>

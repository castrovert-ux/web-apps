<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LM Studio Chat</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 30px auto;
    }
    #chat {
      border: 1px solid #ddd;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .msg {
      margin: 8px 0;
    }
    .user { color: blue; }
    .ai { color: green; }
    input {
      width: 80%;
      padding: 10px;
    }
    button {
      padding: 10px;
    }
  </style>
</head>
<body>

<h2>🧪 LM Studio Chat</h2>

<div id="chat"></div>

<input id="input" placeholder="Escribe algo..." />
<button onclick="send()">Enviar</button>

<script>
const API_URL = "http://localhost:1234/v1/chat/completions";
const MODEL = "mistralai/mistral-7b-instruct-v0.3";

let messages = []; // IMPORTANTE: sin system role

function add(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";

  add("Tú: " + text, "user");

  messages.push({ role: "user", content: text });

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        temperature: 0.7
      })
    });

    const data = await res.json();

    console.log("RESPUESTA LM:", data);

    const reply = data?.choices?.[0]?.message?.content;

    if (!reply) {
      add("❌ Error: respuesta vacía o inválida", "ai");
      return;
    }

    messages.push({ role: "assistant", content: reply });

    add("IA: " + reply, "ai");

  } catch (err) {
    console.error(err);
    add("❌ Error conectando con LM Studio", "ai");
  }
}
</script>

</body>
</html>

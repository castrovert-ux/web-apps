<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor · Castroverde</title>
  </head>
<body>

<div class="header-actions">
    <button id="btn-toggle-api" class="btn btn-ghost" style="color:var(--accent); border-color:var(--accent);">
        API: <span id="api-status-text">ON</span>
    </button>
    </div>

<script>
// --- NUEVA LÓGICA DE CONTROL ---
// 1. Cargamos el estado desde la memoria del navegador
let apiEnabled = localStorage.getItem('api_enabled') !== 'false'; 

// 2. Función que actualiza el aspecto del botón
function updateApiButton() {
    const text = document.getElementById('api-status-text');
    if (text) text.textContent = apiEnabled ? 'ON' : 'OFF';
}

// 3. Lógica para alternar el estado al hacer clic
document.getElementById('btn-toggle-api').addEventListener('click', function() {
    apiEnabled = !apiEnabled;
    localStorage.setItem('api_enabled', apiEnabled);
    updateApiButton();
    console.log("Estado de la API:", apiEnabled ? "Activada" : "Desactivada");
});

// 4. INICIALIZACIÓN
updateApiButton();

// 5. PROTECCIÓN DE LA LLAMADA (IMPORTANTE)
// Busca en tu código la función que realmente hace la petición (suele contener 'fetch' o 'anthropic').
// Debes envolverla así para que el interruptor tenga poder real:

      alert("La API está desactivada. Por favor, actívala para analizar.");
      return; // Detiene la ejecución
  }
  // ... aquí tu código original que llama a la API ...
*/
</script>

</body>
</html>

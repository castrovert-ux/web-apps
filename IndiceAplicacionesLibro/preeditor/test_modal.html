<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #eef4f3; }

.modal-overlay {
  display: flex;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: #e2edeb;
  border: 1px solid #b4d0cc;
  border-radius: 3px;
  width: 100%;
  max-width: 760px;
  height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  flex: 0 0 auto;
  padding: 14px 20px;
  border-bottom: 1px solid #b4d0cc;
  background: #d6e8e5;
}
.modal-body {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#prompt-output {
  flex: 1 1 0;
  min-height: 80px;
  width: 100%;
  background: #d6e8e5;
  border: 1px solid #b4d0cc;
  font-size: 12px;
  padding: 10px;
  resize: none;
  outline: none;
}
.modal-actions {
  flex: 0 0 auto;
  padding: 10px 16px;
  border-top: 2px solid #b4d0cc;
  background: #d6e8e5;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
}
button { padding: 6px 12px; cursor: pointer; font-size: 11px; border: 1px solid #b4d0cc; border-radius: 3px; background: #e2edeb; }
.btn-green { background: #2a7a6e; color: white; border-color: #2a7a6e; }
.btn-teal  { background: #3a9e6e; color: white; border-color: #3a9e6e; }
.key-btn   { border-radius: 20px; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <strong>Prompt generado</strong> — Listo para pegar en el editor
    </div>
    <div class="modal-body">
      <textarea id="prompt-output" readonly>Aquí aparece el prompt con el system prompt completo...</textarea>
    </div>
    <div class="modal-actions">
      <button class="key-btn">⚿ sin clave</button>
      <span style="flex:1"></span>
      <button>Cerrar</button>
      <button class="btn-green">⎘ Copiar</button>
      <button class="btn-teal">✦ Enviar a Llama →</button>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comparador PRO de textos</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #f4f6f8;
}

h1 {
  text-align: center;
}

.container {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

textarea {
  width: 50%;
  height: 220px;
  padding: 10px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin: 10px 5px;
  padding: 10px 16px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.primary {
  background: #007bff;
  color: white;
}

.secondary {
  background: #6c757d;
  color: white;
}

.primary:hover { background: #0056b3; }
.secondary:hover { background: #545b62; }

.controls {
  text-align: center;
}

.result {
  background: white;
  padding: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
  line-height: 1.6;
  font-size: 15px;
}

/* estilos diff */
.added {
  background-color: #c8f7c5;
}

.removed {
  background-color: #f7c5c5;
  text-decoration: line-through;
}

.block {
  margin-bottom: 8px;
}
</style>
</head>

<body>

<h1>Comparador PRO de textos</h1>

<div class="container">
  <textarea id="text1" placeholder="Texto original..."></textarea>
  <textarea id="text2" placeholder="Texto modificado..."></textarea>
</div>

<div class="controls">
  <button class="primary" onclick="compare()">Comparar</button>
  <button class="secondary" onclick="copyResult()">Copiar resultado</button>
  <button class="secondary" onclick="clearTexts()">Limpiar</button>
</div>

<div id="output" class="result"></div>

<!-- Librería profesional de diff -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>

<script>
function compare() {
  const text1 = document.getElementById("text1").value;
  const text2 = document.getElementById("text2").value;

  const dmp = new diff_match_patch();
  let diffs = dmp.diff_main(text1, text2);

  dmp.diff_cleanupSemantic(diffs);

  let html = "";

  diffs.forEach(part => {
    const type = part[0];
    const text = part[1]
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");

    if (type === 1) {
      html += `<span class="added">${text}</span>`;
    } else if (type === -1) {
      html += `<span class="removed">${text}</span>`;
    } else {
      html += text;
    }
  });

  document.getElementById("output").innerHTML = html;
}

function copyResult() {
  const html = document.getElementById("output").innerHTML;
  const text = html
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<[^>]+>/g, "");
  const decoded = document.createElement("textarea");
  decoded.innerHTML = text;
  navigator.clipboard.writeText(decoded.value);
  alert("Resultado copiado");
}

function clearTexts() {
  document.getElementById("text1").value = "";
  document.getElementById("text2").value = "";
  document.getElementById("output").innerHTML = "";
}
</script>

</body>
</html>

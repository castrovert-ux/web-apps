<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicaciones del Libro</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <!-- ... (todas tus etiquetas link y meta se mantienen iguales) ... -->

  <style>
    /* ... (todo tu CSS anterior se mantiene igual) ... */

    /* NUEVOS ESTILOS PARA DRAG AND DROP */
    .app-card {
      user-select: none;
      transition: all var(--transition);
    }

    .app-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      z-index: 50;
    }

    .app-card.drag-over {
      border-color: var(--accent);
      background: var(--card-hover);
      transform: scale(1.05);
      box-shadow: 0 0 0 3px rgba(232, 199, 107, 0.3);
    }

    /* Indicador de orden en modo edición (opcional) */
    .app-card::after {
      content: attr(data-order);
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.65rem;
      background: rgba(0,0,0,0.4);
      color: white;
      padding: 2px 6px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .app-card:hover::after {
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- ... (tu HTML hasta el main se mantiene igual) ... -->

  <main id="app-grid">
    <div id="empty-state" style="display:none;">
      <span>🚀</span>
      No hay aplicaciones.<br>Pulsa ⚙️ para añadir la primera.
    </div>
  </main>

  <button id="btn-config" title="Configuración">⚙️</button>

  <!-- Modal (sin cambios) -->
  <div id="modal-overlay">
    <div id="modal">
      <!-- ... todo el contenido del modal se mantiene igual ... -->
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================
    // DATOS
    // ============================================================
    // __APPS_START__
    let apps = [
      {
        "id": "3zigmjd",
        "name": "Editor de Castroverde",
        "url": "editorcastroverde/",
        "icon": "📓"
      },
      {
        "id": "9hweyeh",
        "name": "Cuestionarios",
        "url": "cuestionarios/",
        "icon": "📑"
      },
      {
        "id": "b39rjxj",
        "name": "Maquetador de Castroverde",
        "url": "maquetadorcastroverde/",
        "icon": "📓"
      },
      {
        "id": "9z0jzeo",
        "name": "Ilustrador",
        "url": "ilustrador2/",
        "icon": "🖌️"
      },
      {
        "id": "ififxi0",
        "name": "Libro 2 - Inteligencia Artificial",
        "url": "Libro2IA/",
        "icon": "✨"
      },
      {
        "id": "2jsbi9s",
        "name": "Creador Json Libro 2",
        "url": "CreadorJsonHuggingFace/",
        "icon": "🤗"
      }
    ];
    // __APPS_END__

    // ============================================================
    // UTILIDADES
    // ============================================================
    function uid() { return Math.random().toString(36).slice(2, 9); }

    function showToast(msg, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============================================================
    // RENDERIZADO DEL GRID (con soporte drag & drop)
    // ============================================================
    function renderGrid() {
      const grid = document.getElementById('app-grid');
      const empty = document.getElementById('empty-state');

      // Eliminar solo las tarjetas (mantener empty-state)
      grid.querySelectorAll('.app-card').forEach(el => el.remove());

      if (apps.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      apps.forEach((app, index) => {
        const a = document.createElement('a');
        a.className = 'app-card';
        a.href = app.url;
        a.draggable = true;
        a.dataset.id = app.id;
        a.style.animationDelay = `${index * 50}ms`;
        a.innerHTML = `
          <span class="app-icon">${escapeHtml(app.icon || '📦')}</span>
          <span class="app-name">${escapeHtml(app.name)}</span>
        `;
        grid.appendChild(a);
      });

      initDragAndDrop();
    }

    // ============================================================
    // DRAG AND DROP
    // ============================================================
    let draggedElement = null;

    function initDragAndDrop() {
      const cards = document.querySelectorAll('.app-card');

      cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          draggedElement = card;
          setTimeout(() => card.classList.add('dragging'), 0);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedElement = null;
          document.querySelectorAll('.app-card').forEach(c => c.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (card !== draggedElement) {
            card.classList.add('drag-over');
          }
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');

          if (draggedElement && draggedElement !== card) {
            const fromId = draggedElement.dataset.id;
            const toId = card.dataset.id;

            const fromIndex = apps.findIndex(a => a.id === fromId);
            const toIndex = apps.findIndex(a => a.id === toId);

            if (fromIndex !== -1 && toIndex !== -1) {
              // Reordenar el array
              const [movedApp] = apps.splice(fromIndex, 1);
              apps.splice(toIndex, 0, movedApp);

              renderGrid();           // volver a renderizar con nuevo orden
              showToast('📋 Orden actualizado');
            }
          }
        });
      });
    }

    // ============================================================
    // Resto de funciones (addApp, deleteApp, saveEdit, etc.)
    // ============================================================
    function addApp() {
      const name   = document.getElementById('new-name').value.trim();
      const folder = document.getElementById('new-folder').value.trim().replace(/\/+$/, '');
      const icon   = document.getElementById('new-icon').value.trim() || '📦';

      if (!name)   { showToast('⚠️ El nombre es obligatorio.'); return; }
      if (!folder) { showToast('⚠️ El nombre de carpeta es obligatorio.'); return; }

      apps.push({ id: uid(), name, url: folder + '/', icon });

      document.getElementById('new-name').value = '';
      document.getElementById('new-folder').value = '';
      document.getElementById('new-icon').value = '';

      renderGrid();
      renderAdminList();
      showToast(`✅ "${name}" añadida.`);
    }

    function deleteApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;
      if (!confirm(`¿Eliminar "${app.name}"?`)) return;

      apps = apps.filter(a => a.id !== id);
      renderGrid();
      renderAdminList();
      showToast(`🗑 "${app.name}" eliminada.`);
    }

    function toggleEditForm(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (!form) return;
      document.querySelectorAll('.edit-form.visible').forEach(f => {
        if (f.id !== `edit-form-${id}`) f.classList.remove('visible');
      });
      form.classList.toggle('visible');
    }

    function saveEdit(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (!form) return;

      const name = form.querySelector('.edit-name').value.trim();
      const url  = form.querySelector('.edit-url').value.trim();
      const icon = form.querySelector('.edit-icon').value.trim() || '📦';

      if (!name || !url) {
        showToast('⚠️ Nombre y carpeta son obligatorios.');
        return;
      }

      const app = apps.find(a => a.id === id);
      if (app) {
        app.name = name;
        app.url  = url;
        app.icon = icon;
      }

      renderGrid();
      renderAdminList();
      showToast(`✏️ "${name}" actualizada.`);
    }

    // Renderizado del modal (sin cambios importantes)
    function renderAdminList() {
      const list = document.getElementById('apps-admin-list');
      list.innerHTML = '';

      if (apps.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:16px 0">Sin aplicaciones todavía.</p>';
        return;
      }

      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.dataset.id = app.id;
        item.innerHTML = `...` ; // (mantengo tu código original de admin-item)
        // Copia aquí el innerHTML completo de tu versión original si quieres, o dime y te lo doy entero
      });
    }

    // Modal y eventos (sin cambios)
    const overlay = document.getElementById('modal-overlay');

    function openModal() {
      renderAdminList();
      overlay.style.display = 'flex';
      requestAnimationFrame(() => overlay.classList.add('open'));
    }

    function closeModal() {
      overlay.classList.remove('open');
      setTimeout(() => overlay.style.display = 'none', 300);
    }

    // Eventos
    document.getElementById('btn-config').addEventListener('click', openModal);
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('btn-add-app').addEventListener('click', addApp);
    document.getElementById('new-folder').addEventListener('keydown', e => {
      if (e.key === 'Enter') addApp();
    });

    // Descarga (se conserva el orden actual)
    document.getElementById('btn-download').addEventListener('click', () => {
      const appsJson = JSON.stringify(apps, null, 2);
      let src = document.documentElement.outerHTML;

      src = src.replace(/id="modal-overlay"([^>]*?)class="([^"]*)\bopen\b([^"]*)"/, 'id="modal-overlay"$1class="$2$3"');
      src = src.replace(/(id="modal-overlay"[^>]*?)style="[^"]*display\s*:\s*flex[^"]*"/g, '$1');

      src = src.replace(
        /\/\/ __APPS_START__[\s\S]*?\/\/ __APPS_END__/,
        `// __APPS_START__\n    let apps = ${appsJson};\n    // __APPS_END__`
      );

      const blob = new Blob([src], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'index.html'; a.click();
      URL.revokeObjectURL(url);
      showToast('⬇️ index.html descargado con el nuevo orden.');
    });

    // INICIO
    renderGrid();
  </script>
</body>
</html>

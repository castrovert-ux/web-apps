<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Aplicaciones</title>
   <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="icon" type="image/x-icon" href="icons/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png?v=2">

  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MisApps">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet">

 <style>
    :root {
      --bg-from:   #0f0c29;
      --bg-mid:    #302b63;
      --bg-to:     #24243e;
      --card-bg:   rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-hover: rgba(255, 255, 255, 0.14);
      --accent:    #e8c76b;
      --accent2:   #f07f5a;
      --text:      #f0eef8;
      --text-muted: rgba(240, 238, 248, 0.55);
      --modal-bg:  rgba(18, 15, 40, 0.97);
      --input-bg:  rgba(255,255,255,0.08);
      --input-border: rgba(255,255,255,0.18);
      --danger:    #e05c5c;
      --success:   #5ce08a;
      --radius:    18px;
      --radius-sm: 10px;
      --shadow:    0 8px 40px rgba(0,0,0,0.45);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-mid) 50%, var(--bg-to) 100%);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(232,199,107,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(240,127,90,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 56px 24px 32px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    #app-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 120px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 16px 22px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        transform var(--transition),
        background var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
      animation: cardIn 0.5s ease both;
    }

    .app-card:hover {
      background: var(--card-hover);
      border-color: rgba(232,199,107,0.35);
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(232,199,107,0.2);
    }

    .app-card:active {
      transform: translateY(-2px) scale(1.01);
    }

    .app-icon {
      font-size: 2.6rem;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: transform var(--transition);
    }

    .app-card:hover .app-icon {
      transform: scale(1.15) rotate(-3deg);
    }

    .app-name {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    #btn-config {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 100;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(232,199,107,0.18);
      border: 1px solid rgba(232,199,107,0.4);
      color: var(--accent);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    #btn-config:hover {
      background: rgba(232,199,107,0.3);
      transform: scale(1.1) rotate(45deg);
      box-shadow: 0 8px 32px rgba(232,199,107,0.25);
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    #modal-overlay.open {
      display: flex;
      opacity: 1;
      pointer-events: all;
    }

    #modal {
      background: var(--modal-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      transform: translateY(24px) scale(0.97);
      transition: transform var(--transition);
    }

    #modal-overlay.open #modal {
      transform: translateY(0) scale(1);
    }

    #modal::-webkit-scrollbar { width: 5px; }
    #modal::-webkit-scrollbar-track { background: transparent; }
    #modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .modal-header h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
    }

    #btn-close-modal {
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), color var(--transition);
    }

    #btn-close-modal:hover {
      background: rgba(255,255,255,0.15);
      color: var(--text);
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      background: rgba(232,199,107,0.06);
    }

    input[type="text"]::placeholder {
      color: rgba(240,238,248,0.3);
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #1a1530;
      font-weight: 600;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(232,199,107,0.3);
    }

    .btn-danger {
      background: rgba(224,92,92,0.15);
      color: var(--danger);
      border: 1px solid rgba(224,92,92,0.25);
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-danger:hover { background: rgba(224,92,92,0.28); }

    .btn-edit {
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-edit:hover {
      background: rgba(255,255,255,0.13);
      color: var(--text);
    }

    .btn-success {
      background: rgba(92,224,138,0.15);
      color: var(--success);
      border: 1px solid rgba(92,224,138,0.25);
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-success:hover { background: rgba(92,224,138,0.28); }

    .btn-download {
      width: 100%;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 13px;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .btn-download:hover {
      background: rgba(232,199,107,0.1);
      border-color: rgba(232,199,107,0.3);
      color: var(--accent);
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    #apps-admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    #apps-admin-list::-webkit-scrollbar { width: 4px; }
    #apps-admin-list::-webkit-scrollbar-track { background: transparent; }
    #apps-admin-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    .admin-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      transition: background var(--transition);
      cursor: grab;
      user-select: none;
    }

    .admin-item:active {
      cursor: grabbing;
    }

    .admin-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
    }

    .admin-item.drag-over {
      border-top: 2px solid var(--accent);
      background: rgba(232,199,107,0.1);
    }

    .admin-item:hover { background: rgba(255,255,255,0.07); }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 1.1rem;
      user-select: none;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .admin-item-icon { font-size: 1.4rem; flex-shrink: 0; }

    .admin-item-info { flex: 1; min-width: 0; }

    .admin-item-name {
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-item-url {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .edit-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }

    .edit-form.visible { display: flex; }
    .edit-form .form-row { margin-bottom: 0; }

    #empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      display: none;
    }

    #empty-state span { font-size: 3rem; display: block; margin-bottom: 12px; }

    #toast {
      position: fixed;
      bottom: 90px;
      right: 28px;
      z-index: 300;
      background: rgba(18,15,40,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      #app-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 14px;
        padding: 0 16px 100px;
      }
      #modal { padding: 24px 18px; }
      .form-row { grid-template-columns: 1fr; }
      header { padding: 40px 16px 24px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>✦ Mis Aplicaciones</h1>
    <p>Todas tus aplicaciones, en un solo lugar</p>
  </header>

  <main id="app-grid">
    <div id="empty-state" style="display:none;">
      <span>🚀</span>
      No hay aplicaciones.<br>Pulsa ⚙️ para añadir la primera.
    </div>
  </main>

  <button id="btn-config" title="Configuración" aria-label="Abrir panel de administración">⚙️</button>

  <div id="modal-overlay" class="">
    <div id="modal">
      <div class="modal-header">
        <h2>⚙️ Administración</h2>
        <button id="btn-close-modal" title="Cerrar" aria-label="Cerrar modal">✕</button>
      </div>

      <p class="section-title">➕ Añadir aplicación</p>
      <div class="form-row">
        <div>
          <label for="new-name">Nombre *</label>
          <input type="text" id="new-name" placeholder="Mi App">
        </div>
        <div>
          <label for="new-folder">Nombre de carpeta *</label>
          <input type="text" id="new-folder" placeholder="mi-app">
        </div>
      </div>
      <div class="form-row" style="grid-template-columns: 1fr; margin-bottom: 12px;">
        <div>
          <label for="new-icon">Icono (emoji)</label>
          <input type="text" id="new-icon" placeholder="📦" maxlength="4" style="max-width:80px;">
        </div>
      </div>
      <button class="btn btn-primary" id="btn-add-app">➕ Añadir aplicación</button>

      <hr class="divider">

      <p class="section-title">📋 Aplicaciones actuales <span style="font-size:0.7rem;">(Arrastra ⋮⋮ para reordenar)</span></p>
      <div id="apps-admin-list"></div>

      <hr class="divider">

      <button class="btn btn-download" id="btn-download">⬇️ Descargar nuevo index.html</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // ============================================================
    // DATOS — modifica este array para las apps por defecto
    // ============================================================
    // __APPS_START__
    let apps = [
  {

    // __APPS_END__

    // Cargar orden guardado desde localStorage
    function loadOrder() {
      const savedOrder = localStorage.getItem('appsOrder');
      if (savedOrder) {
        const orderIds = JSON.parse(savedOrder);
        apps.sort((a, b) => {
          const indexA = orderIds.indexOf(a.id);
          const indexB = orderIds.indexOf(b.id);
          if (indexA === -1) return 1;
          if (indexB === -1) return -1;
          return indexA - indexB;
        });
      }
    }

    // Guardar orden actual en localStorage
    function saveOrder() {
      const orderIds = apps.map(app => app.id);
      localStorage.setItem('appsOrder', JSON.stringify(orderIds));
    }

    // ============================================================
    // UTILIDADES
    // ============================================================
    function uid() { return Math.random().toString(36).slice(2, 9); }

    function showToast(msg, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============================================================
    // RENDERIZADO DEL GRID
    // ============================================================
    function renderGrid() {
      const grid  = document.getElementById('app-grid');
      const empty = document.getElementById('empty-state');
      const existingCards = grid.querySelectorAll('.app-card');
      existingCards.forEach(el => el.remove());

      if (apps.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      apps.forEach((app, index) => {
        const a = document.createElement('a');
        a.className = 'app-card';
        a.href = app.url;
        a.style.animationDelay = `${index * 60}ms`;
        a.innerHTML = `
          <span class="app-icon">${escapeHtml(app.icon || '📦')}</span>
          <span class="app-name">${escapeHtml(app.name)}</span>`;
        grid.appendChild(a);
      });
    }

    // ============================================================
    // RENDERIZADO DE LA LISTA EN EL MODAL (con drag & drop)
    // ============================================================
    let draggedItem = null;

    function renderAdminList() {
      const list = document.getElementById('apps-admin-list');
      list.innerHTML = '';

      if (apps.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:16px 0">Sin aplicaciones todavía.</p>';
        return;
      }

      apps.forEach((app, index) => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.dataset.id = app.id;
        item.draggable = true;
        item.setAttribute('data-index', index);
        
        item.innerHTML = `
          <div class="drag-handle" draggable="false">⋮⋮</div>
          <span class="admin-item-icon">${escapeHtml(app.icon || '📦')}</span>
          <div class="admin-item-info">
            <div class="admin-item-name">${escapeHtml(app.name)}</div>
            <div class="admin-item-url">${escapeHtml(app.url)}</div>
          </div>
          <div class="admin-item-actions">
            <button class="btn btn-edit btn-edit-app" data-id="${app.id}" title="Editar">✏️</button>
            <button class="btn btn-danger btn-delete-app" data-id="${app.id}" title="Eliminar">🗑</button>
          </div>
          <div class="edit-form" id="edit-form-${app.id}">
            <div class="form-row">
              <div>
                <label>Nombre *</label>
                <input type="text" class="edit-name" value="${escapeHtml(app.name)}" placeholder="Nombre">
              </div>
              <div>
                <label>Carpeta *</label>
                <input type="text" class="edit-url" value="${escapeHtml(app.url)}" placeholder="carpeta/">
              </div>
            </div>
            <div class="form-row" style="grid-template-columns:80px 1fr;margin-bottom:0">
              <div>
                <label>Icono</label>
                <input type="text" class="edit-icon" value="${escapeHtml(app.icon || '📦')}" placeholder="📦" maxlength="4">
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:4px">
              <button class="btn btn-success btn-save-edit" data-id="${app.id}">✔ Guardar</button>
              <button class="btn btn-edit btn-cancel-edit" data-id="${app.id}">✕ Cancelar</button>
            </div>
          </div>`;
        
        // Eventos de drag & drop
        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragend', handleDragEnd);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('dragleave', handleDragLeave);
        item.addEventListener('drop', handleDrop);
        
        list.appendChild(item);
      });
    }

    function handleDragStart(e) {
      draggedItem = this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.id);
      // Necesario para que funcione en Firefox
      e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragEnd(e) {
      this.classList.remove('dragging');
      // Eliminar clase drag-over de todos los elementos
      document.querySelectorAll('.admin-item').forEach(item => {
        item.classList.remove('drag-over');
      });
      draggedItem = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (this !== draggedItem) {
        this.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      this.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      
      if (!draggedItem || draggedItem === this) return;
      
      const fromId = draggedItem.dataset.id;
      const toId = this.dataset.id;
      
      const fromIndex = apps.findIndex(app => app.id === fromId);
      const toIndex = apps.findIndex(app => app.id === toId);
      
      if (fromIndex === -1 || toIndex === -1) return;
      
      // Reordenar el array
      const [movedApp] = apps.splice(fromIndex, 1);
      apps.splice(toIndex, 0, movedApp);
      
      // Guardar el nuevo orden
      saveOrder();
      
      // Re-renderizar
      renderAdminList();
      renderGrid();
      showToast(`📌 Orden actualizado.`);
    }

    // ============================================================
    // CRUD
    // ============================================================
    function addApp() {
      const name   = document.getElementById('new-name').value.trim();
      const folder = document.getElementById('new-folder').value.trim().replace(/\/+$/, '');
      const icon   = document.getElementById('new-icon').value.trim() || '📦';

      if (!name)   { showToast('⚠️ El nombre es obligatorio.'); return; }
      if (!folder) { showToast('⚠️ El nombre de carpeta es obligatorio.'); return; }

      apps.push({ id: uid(), name, url: folder + '/', icon });
      
      saveOrder();
      renderGrid();
      renderAdminList();
      showToast(`✅ "${name}" añadida.`);
      
      document.getElementById('new-name').value   = '';
      document.getElementById('new-folder').value = '';
      document.getElementById('new-icon').value   = '';
    }

    function deleteApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;
      if (!confirm(`¿Eliminar "${app.name}"? Esta acción no se puede deshacer.`)) return;
      apps = apps.filter(a => a.id !== id);
      saveOrder();
      renderGrid();
      renderAdminList();
      showToast(`🗑 "${app.name}" eliminada.`);
    }

    function toggleEditForm(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (!form) return;
      document.querySelectorAll('.edit-form.visible').forEach(f => {
        if (f.id !== `edit-form-${id}`) f.classList.remove('visible');
      });
      form.classList.toggle('visible');
    }

    function saveEdit(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (!form) return;
      const name = form.querySelector('.edit-name').value.trim();
      const url  = form.querySelector('.edit-url').value.trim();
      const icon = form.querySelector('.edit-icon').value.trim() || '📦';

      if (!name) { showToast('⚠️ El nombre es obligatorio.'); return; }
      if (!url)  { showToast('⚠️ La carpeta es obligatoria.'); return; }

      const app = apps.find(a => a.id === id);
      if (!app) return;
      app.name = name;
      app.url  = url;
      app.icon = icon;

      saveOrder();
      renderGrid();
      renderAdminList();
      showToast(`✏️ "${name}" actualizada.`);
    }

    // ============================================================
    // DELEGACIÓN DE EVENTOS
    // ============================================================
    document.getElementById('apps-admin-list').addEventListener('click', e => {
      const btnDelete = e.target.closest('.btn-delete-app');
      const btnEdit   = e.target.closest('.btn-edit-app');
      const btnSave   = e.target.closest('.btn-save-edit');
      const btnCancel = e.target.closest('.btn-cancel-edit');

      if (btnDelete) { deleteApp(btnDelete.dataset.id); return; }
      if (btnEdit)   { toggleEditForm(btnEdit.dataset.id); return; }
      if (btnSave)   { saveEdit(btnSave.dataset.id); return; }
      if (btnCancel) {
        const form = document.getElementById(`edit-form-${btnCancel.dataset.id}`);
        if (form) form.classList.remove('visible');
        return;
      }
    });

    document.getElementById('btn-add-app').addEventListener('click', addApp);
    document.getElementById('new-folder').addEventListener('keydown', e => {
      if (e.key === 'Enter') addApp();
    });

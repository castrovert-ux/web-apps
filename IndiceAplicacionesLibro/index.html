<html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicaciones del libro</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-from: #0f0c29; --bg-mid: #302b63; --bg-to: #24243e;
      --card-bg: rgba(255,255,255,0.07); --card-border: rgba(255,255,255,0.13);
      --card-hover: rgba(255,255,255,0.14); --accent: #e8c76b; --accent2: #f07f5a;
      --text: #f0eef8; --text-muted: rgba(240,238,248,0.55);
      --radius: 18px; --radius-sm: 10px; --shadow: 0 8px 40px rgba(0,0,0,0.45);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-mid) 50%, var(--bg-to) 100%);
      min-height: 100vh; color: var(--text); overflow-x: hidden;
    }

    header { text-align:center; padding:56px 24px 32px; }
    header h1 {
      font-family: 'Syne', sans-serif; font-weight:800; font-size: clamp(2rem,5vw,3.2rem);
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header p { margin-top:8px; color:var(--text-muted); }

    #app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 120px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 16px 22px;
      text-align: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      cursor: grab;
      transition: all var(--transition);
      animation: cardIn 0.5s ease both;
      user-select: none;
      position: relative;
    }

    .app-card:hover { transform: translateY(-5px) scale(1.03); }
    .app-card:active { cursor: grabbing; }

    .app-card.dragging {
      opacity: 0.35;
      transform: scale(0.92);
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      z-index: 50;
    }

    .app-card.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(232,199,107,0.35);
      transform: scale(1.06);
    }

    .app-icon { font-size: 2.8rem; transition: transform var(--transition); }
    .app-card:hover .app-icon { transform: scale(1.2) rotate(-5deg); }

    .app-name { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.92rem; }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(25px) scale(0.9); }
      to { opacity:1; transform:none; }
    }

    #btn-config {
      position:fixed; bottom:28px; right:28px; z-index:100;
      width:56px; height:56px; border-radius:50%;
      background:rgba(232,199,107,0.2); border:2px solid rgba(232,199,107,0.5);
      color:var(--accent); font-size:1.6rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 25px rgba(0,0,0,0.4);
    }

    #modal-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(6px);
      display:none; align-items:center; justify-content:center; padding:20px;
    }

    #modal {
      background: rgba(18,15,40,0.98);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      width: 100%; max-width: 540px;
      max-height: 92vh; overflow-y: auto;
      padding: 32px; box-shadow: var(--shadow);
    }

    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .section-title { font-family:'Syne',sans-serif; font-size:0.78rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin:20px 0 12px; }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    label { display:block; font-size:0.78rem; color:var(--text-muted); margin-bottom:5px; }
    input[type="text"] {
      width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
      border-radius:var(--radius-sm); padding:10px 12px; color:var(--text);
    }

    .btn { border:none; border-radius:var(--radius-sm); padding:10px 18px; cursor:pointer; transition:all var(--transition); }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1530; font-weight:600; }

    .admin-item {
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
      border-radius:var(--radius-sm); padding:12px 14px; display:flex; align-items:center; gap:12px;
      flex-wrap:wrap;
    }

    .edit-form { display:none; flex-direction:column; gap:10px; margin-top:12px; width:100%; }
    .edit-form.visible { display:flex; }

    #toast {
      position:fixed; bottom:100px; right:28px; z-index:300;
      background:rgba(18,15,40,0.95); border:1px solid rgba(255,255,255,0.15);
      padding:12px 20px; border-radius:12px; font-size:0.9rem;
      opacity:0; transform:translateY(15px); transition:all 0.3s;
    }
    #toast.show { opacity:1; transform:none; }
  </style>
</head>
<body>

  <header>
    <h1>✦ Aplicaciones del libro</h1>
    <p>Todas tus aplicaciones, en un solo lugar</p>
  </header>

  <main id="app-grid"></main>

  <button id="btn-config" title="Administración">⚙️</button>

  <div id="modal-overlay" style="display:none;">
    <div id="modal">
      <div class="modal-header">
        <h2>⚙️ Administración</h2>
        <button id="btn-close-modal" style="background:none;border:none;font-size:1.8rem;color:#aaa;cursor:pointer;">✕</button>
      </div>

      <p class="section-title">➕ Añadir nueva aplicación</p>
      <div class="form-row">
        <div>
          <label for="new-name">Nombre *</label>
          <input type="text" id="new-name" placeholder="Mi App">
        </div>
        <div>
          <label for="new-folder">Carpeta / URL *</label>
          <input type="text" id="new-folder" placeholder="mi-app/">
        </div>
      </div>
      <div class="form-row" style="grid-template-columns:80px 1fr;">
        <div>
          <label for="new-icon">Icono</label>
          <input type="text" id="new-icon" placeholder="📦" maxlength="4">
        </div>
      </div>
      <button class="btn btn-primary" id="btn-add-app">➕ Añadir aplicación</button>

      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:28px 0;">

      <p class="section-title">📋 Aplicaciones actuales (arrastra en la pantalla principal para reordenar)</p>
      <div id="apps-admin-list"></div>

      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:28px 0;">

      <button class="btn btn-primary" id="btn-download" style="width:100%;padding:14px;">⬇️ Descargar index.html actualizado</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ----- APPS POR DEFECTO (se usa como base la primera vez) -----
    const DEFAULT_APPS = [
      { id: "cibbed8", name: "Preeditor", url: "preeditor/", icon: "🖊️" },
      { id: "3uqg6kc", name: "Editor Llama bueno", url: "editorgroqllamaversatile/", icon: "🌩️" },
      { id: "t1tmtgq", name: "Analizador LLama bueno", url: "analizadorgroqllamaversatile/", icon: "🌩️" },
      { id: "3zigmjd", name: "Editor Claude", url: "editorclaude/", icon: "📓" },
      { id: "b39rjxj", name: "Analizador Claude", url: "analizadorclaude/", icon: "📓" },
      { id: "9z0jzeo", name: "Ilustrador Claude", url: "pintorclaude/", icon: "🖌️" },
      { id: "ififxi0", name: "Libro 2 - Búsqueda", url: "Libro2IA/", icon: "🔍" },
      { id: "2jsbi9s", name: "Creador Dataset Libro2", url: "creadordataselibro2/", icon: "✨" },
      { id: "dm5nz97", name: "Editor Llama peor", url: "editorgroqllamainstant/", icon: "🌩️" },
      { id: "azxub2t", name: "Analizador Llama peor", url: "analizadorgroqllamainstant/", icon: "🌩️" },
      { id: "f7ugbm3", name: "Ilustrador LLama bueno", url: "ilustradorgroqllamaversatile/", icon: "🖌️" }
    ];

    // ----- ESTADO PERSISTIDO -----
    let apps = [];

    function saveAppsToLocalStorage() {
      localStorage.setItem('book_apps', JSON.stringify(apps));
    }

    // Fusiona los datos guardados con los por defecto (permite añadir nuevas apps por defecto en futuras versiones)
    function loadAppsFromStorage() {
      const stored = localStorage.getItem('book_apps');
      if (!stored) {
        // Primera vez: usar los defaults y guardarlos
        apps = [...DEFAULT_APPS];
        saveAppsToLocalStorage();
        return;
      }

      let storedApps;
      try {
        storedApps = JSON.parse(stored);
        if (!Array.isArray(storedApps)) throw new Error();
      } catch(e) {
        apps = [...DEFAULT_APPS];
        saveAppsToLocalStorage();
        return;
      }

      // Crear un mapa de las apps guardadas para fácil acceso
      const storedMap = new Map(storedApps.map(app => [app.id, app]));

      // Primero añadir las apps por defecto, pero actualizando con datos guardados si existen
      const merged = DEFAULT_APPS.map(defaultApp => {
        if (storedMap.has(defaultApp.id)) {
          return { ...defaultApp, ...storedMap.get(defaultApp.id) };
        }
        return defaultApp;
      });

      // Añadir apps que estén en guardadas pero no en defaults (creadas por el usuario)
      const defaultIds = new Set(DEFAULT_APPS.map(a => a.id));
      const extraApps = storedApps.filter(app => !defaultIds.has(app.id));

      apps = [...merged, ...extraApps];
      // Guardar el resultado fusionado para mantener consistencia
      saveAppsToLocalStorage();
    }

    // ----- UTILITIES -----
    function uid() { return Math.random().toString(36).slice(2,9); }

    function showToast(msg, duration=2400) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ----- RENDER PRINCIPAL (drag & drop) -----
    function renderGrid() {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '';

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';
        card.draggable = true;
        card.dataset.id = app.id;
        card.innerHTML = `
          <span class="app-icon">${app.icon}</span>
          <span class="app-name">${app.name}</span>
        `;

        card.addEventListener('click', (e) => {
          if (!card.classList.contains('dragging')) {
            window.location.href = app.url;
          }
        });

        grid.appendChild(card);
      });

      initDragAndDrop();
    }

    let draggedCard = null;

    function initDragAndDrop() {
      document.querySelectorAll('.app-card').forEach(card => {
        card.addEventListener('dragstart', () => {
          draggedCard = card;
          setTimeout(() => card.classList.add('dragging'), 10);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.app-card').forEach(c => c.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', e => { e.preventDefault(); if (card !== draggedCard) card.classList.add('drag-over'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));

        card.addEventListener('drop', e => {
          e.preventDefault();
          if (!draggedCard || draggedCard === card) return;

          const fromId = draggedCard.dataset.id;
          const toId = card.dataset.id;

          const fromIdx = apps.findIndex(a => a.id === fromId);
          const toIdx = apps.findIndex(a => a.id === toId);

          if (fromIdx !== -1 && toIdx !== -1) {
            const [moved] = apps.splice(fromIdx, 1);
            apps.splice(toIdx, 0, moved);
            renderGrid();
            saveAppsToLocalStorage();          // ✅ persistir orden
            showToast('📋 Orden actualizado');
          }
        });
      });
    }

    // ----- RENDER ADMIN (lista editable) -----
    function renderAdminList() {
      const list = document.getElementById('apps-admin-list');
      list.innerHTML = '';

      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'admin-item';
        item.dataset.id = app.id;
        item.innerHTML = `
          <span class="app-icon" style="font-size:1.6rem;">${app.icon}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:500;">${escapeHtml(app.name)}</div>
            <div style="font-size:0.8rem;color:var(--text-muted);">${escapeHtml(app.url)}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-edit btn-edit-app" data-id="${app.id}" style="padding:6px 10px;">✏️</button>
            <button class="btn btn-danger btn-delete-app" data-id="${app.id}" style="padding:6px 10px;">🗑</button>
          </div>
          <div class="edit-form" id="edit-form-${app.id}">
            <div class="form-row">
              <div><label>Nombre</label><input type="text" class="edit-name" value="${escapeHtml(app.name)}"></div>
              <div><label>Carpeta / URL</label><input type="text" class="edit-url" value="${escapeHtml(app.url)}"></div>
            </div>
            <div style="display:grid;grid-template-columns:80px 1fr;gap:12px;">
              <div><label>Icono</label><input type="text" class="edit-icon" value="${escapeHtml(app.icon)}" maxlength="4"></div>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;">
              <button class="btn btn-primary btn-save-edit" data-id="${app.id}" style="padding:8px 16px;">Guardar cambios</button>
              <button class="btn btn-edit btn-cancel-edit" data-id="${app.id}" style="padding:8px 16px;">Cancelar</button>
            </div>
          </div>`;
        list.appendChild(item);
      });
    }

    // pequeño helper para evitar XSS en los inputs (aunque los valores ya son seguros)
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
        return c;
      });
    }

    // ----- CRUD -----
    function addApp() {
      const name = document.getElementById('new-name').value.trim();
      let url = document.getElementById('new-folder').value.trim();
      const icon = document.getElementById('new-icon').value.trim() || '📦';

      if (!name) return showToast('⚠️ El nombre es obligatorio');
      if (!url) return showToast('⚠️ La carpeta/URL es obligatoria');

      if (!url.endsWith('/')) url += '/';

      apps.push({ id: uid(), name, url, icon });
      saveAppsToLocalStorage();
      renderGrid();
      renderAdminList();
      document.getElementById('new-name').value = '';
      document.getElementById('new-folder').value = '';
      document.getElementById('new-icon').value = '';
      showToast(`✅ "${name}" añadida`);
    }

    function deleteApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;
      if (!confirm(`¿Eliminar "${app.name}"?`)) return;

      apps = apps.filter(a => a.id !== id);
      saveAppsToLocalStorage();
      renderGrid();
      renderAdminList();
      showToast(`🗑 "${app.name}" eliminada`);
    }

    function saveEdit(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (!form) return;

      const name = form.querySelector('.edit-name').value.trim();
      let url = form.querySelector('.edit-url').value.trim();
      const icon = form.querySelector('.edit-icon').value.trim() || '📦';

      if (!name || !url) return showToast('⚠️ Nombre y URL son obligatorios');

      if (!url.endsWith('/')) url += '/';

      const app = apps.find(a => a.id === id);
      if (app) {
        app.name = name;
        app.url = url;
        app.icon = icon;
      }

      saveAppsToLocalStorage();
      renderGrid();
      renderAdminList();
      showToast(`✏️ "${name}" actualizada`);
    }

    // ----- EVENTOS GLOBALES -----
    document.getElementById('btn-config').addEventListener('click', () => {
      renderAdminList();
      document.getElementById('modal-overlay').style.display = 'flex';
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('modal-overlay').style.display = 'none';
    });

    document.getElementById('btn-add-app').addEventListener('click', addApp);

    document.getElementById('apps-admin-list').addEventListener('click', e => {
      const id = e.target.dataset.id;
      if (!id) return;

      if (e.target.classList.contains('btn-delete-app')) deleteApp(id);
      if (e.target.classList.contains('btn-edit-app')) {
        document.getElementById(`edit-form-${id}`).classList.toggle('visible');
      }
      if (e.target.classList.contains('btn-save-edit')) saveEdit(id);
      if (e.target.classList.contains('btn-cancel-edit')) {
        document.getElementById(`edit-form-${id}`).classList.remove('visible');
      }
    });

    // Descarga del index.html con el estado actual incrustado
    document.getElementById('btn-download').addEventListener('click', () => {
      let src = document.documentElement.outerHTML;

      // Limpiar modal abierto visualmente
      src = src.replace(/id="modal-overlay"[^>]*style="[^"]*display\s*:\s*flex[^"]*"/, 'id="modal-overlay" style="display:none;"');

      // Actualizar el bloque de apps para que el nuevo archivo tenga el array actual como DEFAULT_APPS
      // pero conservando la lógica de fusión (para no perder localStorage al abrirlo)
      // Reemplazamos el contenido de DEFAULT_APPS por el array actual
      const currentAppsJson = JSON.stringify(apps, null, 2);
      src = src.replace(
        /const DEFAULT_APPS = \[[\s\S]*?\];/,
        `const DEFAULT_APPS = ${currentAppsJson};`
      );

      const blob = new Blob([src], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'index.html';
      link.click();
      showToast('⬇️ index.html descargado con todos los cambios');
    });

    // ----- INICIALIZACIÓN PERSISTENTE -----
    loadAppsFromStorage();    // carga desde localStorage y fusiona con defaults
    renderGrid();             // dibuja la parrilla con el orden persistido
  </script>
</body></html>

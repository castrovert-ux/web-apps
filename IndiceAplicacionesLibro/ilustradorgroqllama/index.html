<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de prompts · Imágenes del libro</title>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'EB Garamond', Georgia, serif; background: #faf8f4; color: #1a1814; min-height: 100vh; padding: 2rem 1rem 4rem; }
  .container { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 10px; border: 1px solid #e8e2d8; padding: 2.5rem 2.25rem 2.5rem; box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
  .btn-generate { width: 100%; padding: 13px; font-family: 'Playfair Display', serif; font-size: 16px; font-style: italic; border-radius: 7px; border: 1px solid #B89A5A; background: rgba(184,154,90,0.07); color: #1a1814; cursor: pointer; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,24,20,0.55); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
  .modal-box { background: #fff; border-radius: 10px; padding: 24px; max-width: 480px; width: 100%; }
  .input-field { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
</style>
</head>
<body>

<div class="container">
  <h1>Generador de prompts (Groq)</h1>
  <button id="btn-key" class="btn-generate" onclick="openKeyModal()">⚙ Configurar API Key Groq</button>
  <textarea id="sceneRaw" rows="3" placeholder="Describe la escena..."></textarea>
  <button class="btn-generate" onclick="expandWithAI()">✦ Generar con Groq</button>
  <div id="result" style="margin-top:20px; white-space: pre-wrap;"></div>
</div>

<div class="modal-overlay" id="keyModal">
  <div class="modal-box">
    <h3>Configurar API Key de Groq</h3>
    <input type="password" id="keyInput" class="input-field" placeholder="gsk_...">
    <button onclick="saveKey()">Guardar</button>
    <button onclick="closeKeyModal()">Cancelar</button>
  </div>
</div>

<script>
  let GROQ_KEY = localStorage.getItem('groq_api_key') || '';

  function openKeyModal() { document.getElementById('keyModal').style.display = 'flex'; }
  function closeKeyModal() { document.getElementById('keyModal').style.display = 'none'; }
  function saveKey() {
    const val = document.getElementById('keyInput').value.trim();
    if (!val.startsWith('gsk_')) { alert('La clave debe empezar por gsk_'); return; }
    GROQ_KEY = val;
    localStorage.setItem('groq_api_key', val);
    closeKeyModal();
    alert('Clave guardada correctamente');
  }

  async function expandWithAI() {
    const raw = document.getElementById('sceneRaw').value.trim();
    if (!raw) { alert('Escribe algo primero'); return; }
    if (!GROQ_KEY) { openKeyModal(); return; }

    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_KEY}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role: 'user', content: "Expande esta descripción para un prompt de imagen: " + raw }]
      })
    });

    const data = await response.json();
    if (data.choices) {
      document.getElementById('result').textContent = data.choices[0].message.content;
    } else {
      alert('Error: ' + JSON.stringify(data));
    }
  }
</script>
</body>
</html>

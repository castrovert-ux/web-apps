<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de prompts · Imágenes del libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Mantengo el estilo simple y limpio anterior */
  body { font-family: 'EB Garamond', Georgia, serif; background: #faf8f4; color: #1a1814; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 10px; border: 1px solid #e8e2d8; padding: 2.5rem; box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #999080; margin-bottom: 8px; }
  textarea, input { width: 100%; border: 1px solid #ddd8ce; border-radius: 7px; padding: 12px; font-family: 'EB Garamond', serif; font-size: 15px; }
  textarea:focus, input:focus { border-color: #B89A5A; box-shadow: 0 0 0 3px rgba(184,154,90,0.12); }
  .btn-expand, .btn-generate { width: 100%; padding: 13px; background: rgba(184,154,90,0.07); border: 1px solid #B89A5A; border-radius: 7px; font-family: 'Playfair Display', serif; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn-expand:hover, .btn-generate:hover { background: rgba(184,154,90,0.14); }
  .import-fragment-block { background: linear-gradient(135deg, #fdf9f2, #f9f5ec); border: 1px solid #ddd0b0; border-left: 3px solid #B89A5A; padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 20px; }
  .groq-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .groq-modal { background: white; padding: 25px; border-radius: 10px; max-width: 460px; width: 90%; border: 1px solid #ddd; }
</style>
</head>
<body>

<div class="container">
  <h1 style="font-family: 'Playfair Display', serif; font-style: italic;">Generador de prompts</h1>

  <div class="import-fragment-block">
    <p><strong>Importar Fragmento de Escena del libro</strong> <span style="background:#B89A5A; color:white; padding:2px 8px; border-radius:12px; font-size:11px;">IA</span></p>
    <p class="note-tip">Pega el texto completo del fragmento tal como aparece en el libro.</p>
    
    <textarea id="sceneFragment" rows="8" placeholder="Pega aquí tu fragmento..."></textarea>

    <button class="btn-expand" onclick="parseSceneFragment()">
      <span id="parseBtnText">✦ Analizar Fragmento con IA y rellenar campos</span>
      <span id="parseSpinner" class="spinner" style="display:none;"></span>
    </button>
  </div>

  <!-- Aquí irían los demás campos de Dirección de la Escena (los puedes añadir después) -->

  <button class="btn-generate" onclick="buildPrompt()">Generar prompt completo</button>

  <div id="outputArea" style="display:none; margin-top:20px; border:1px solid #ddd; padding:15px; border-radius:8px;">
    <strong>Prompt generado:</strong><br><br>
    <pre id="outputText" style="white-space: pre-wrap; font-size:14px;"></pre>
  </div>
</div>

<!-- Modal Groq -->
<div class="groq-modal-overlay" id="groqModal">
  <div class="groq-modal">
    <h3>Clave de Groq requerida</h3>
    <p>Introduce tu clave de API de Groq (empieza por <code>gsk_</code>).</p>
    <input type="password" id="groqKeyInput" placeholder="gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="width:100%; padding:10px; margin:10px 0;">
    <div style="text-align:right;">
      <button onclick="closeGroqModal()" style="margin-right:10px; padding:8px 16px;">Cancelar</button>
      <button onclick="saveGroqKey()" style="padding:8px 16px; background:#B89A5A; color:white; border:none;">Guardar y continuar</button>
    </div>
  </div>
</div>

<script>
  // Mostrar modal si no hay clave
  function checkGroqKey() {
    if (!localStorage.getItem('groq_api_key')) {
      document.getElementById('groqModal').style.display = 'flex';
    }
  }

  function saveGroqKey() {
    const key = document.getElementById('groqKeyInput').value.trim();
    if (key.length < 10) {
      alert("La clave parece demasiado corta. Asegúrate de copiarla completa.");
      return;
    }
    localStorage.setItem('groq_api_key', key);
    document.getElementById('groqModal').style.display = 'none';
    alert("✅ Clave guardada. Ahora puedes analizar fragmentos.");
  }

  function closeGroqModal() {
    document.getElementById('groqModal').style.display = 'none';
  }

  async function parseSceneFragment() {
    const text = document.getElementById('sceneFragment').value.trim();
    if (!text) return alert("Por favor pega el fragmento del libro.");

    let groqKey = localStorage.getItem('groq_api_key');
    if (!groqKey) {
      document.getElementById('groqModal').style.display = 'flex';
      return;
    }

    const btnText = document.getElementById('parseBtnText');
    const spinner = document.getElementById('parseSpinner');
    btnText.textContent = "Analizando con Groq...";
    spinner.style.display = "inline-block";

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + groqKey
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          max_tokens: 1200,
          temperature: 0.0,
          messages: [
            {
              role: "system",
              content: "Analiza el siguiente fragmento de un libro de historia y devuelve **SOLO** un objeto JSON válido con estas claves exactas: scene_title, scene_action, characters, social_context, environment, central_visual_element, density_of_figures, full_scene_description. No añadas texto fuera del JSON."
            },
            { role: "user", content: text }
          ]
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(`HTTP ${response.status}: ${errData.error?.message || response.statusText}`);
      }

      const data = await response.json();
      let content = data.choices[0].message.content.trim();
      content = content.replace(/```json|```/g, '').trim();

      const parsed = JSON.parse(content);

      // Rellenar campos (ajusta los IDs según tus campos)
      if (parsed.scene_title) document.getElementById('scene_title').value = parsed.scene_title;
      if (parsed.scene_action) document.getElementById('scene_action').value = parsed.scene_action;
      if (parsed.characters) document.getElementById('characters').value = parsed.characters;
      if (parsed.social_context) document.getElementById('social_context').value = parsed.social_context;
      if (parsed.environment) document.getElementById('environment').value = parsed.environment;
      if (parsed.central_visual_element) document.getElementById('central_visual_element').value = parsed.central_visual_element;

      alert("✅ ¡Análisis completado!\nLos campos principales han sido rellenados.");
    } catch (err) {
      console.error("Error completo:", err);
      alert("❌ Error al analizar:\n" + err.message + "\n\nPosibles causas:\n• Clave Groq inválida o caducada\n• Fragmento demasiado largo\n• Problema temporal de Groq");
    } finally {
      btnText.textContent = "✦ Analizar Fragmento con IA y rellenar campos";
      spinner.style.display = "none";
    }
  }

  function buildPrompt() {
    alert("Prompt generado (versión simplificada para pruebas).");
    // Aquí iría tu lógica completa de buildPrompt
  }

  // Inicializar
  window.onload = checkGroqKey;
</script>
</body>
</html>

<script>
(function() {
    // Función para abrir ajustes
    window.openSettings = function() {
        var modal = document.getElementById('modal-settings');
        if (modal) {
            modal.classList.add('visible');
            console.log("Modal de ajustes abierto");
            // Cargar valores actuales en los campos
            if (typeof settings !== 'undefined') {
                try {
                    document.getElementById('system-narrativo').value = settings.narrativo.system;
                    document.getElementById('analisis-narrativo').value = settings.narrativo.promptAnalisis;
                    document.getElementById('veredicto-narrativo').value = settings.narrativo.promptVeredicto;
                    document.getElementById('system-descriptivo').value = settings.descriptivo.system;
                    document.getElementById('analisis-descriptivo').value = settings.descriptivo.promptAnalisis;
                    document.getElementById('veredicto-descriptivo').value = settings.descriptivo.promptVeredicto;
                } catch(e) { console.warn("Error cargando valores:", e); }
            }
        } else {
            alert("Error: No se encuentra el modal de ajustes");
        }
    };
    
    window.closeSettings = function() {
        var modal = document.getElementById('modal-settings');
        if (modal) modal.classList.remove('visible');
    };
    
    // Asignar evento al botón cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('btn-settings');
        if (btn) {
            btn.onclick = function(e) {
                e.preventDefault();
                window.openSettings();
            };
            console.log("Botón ajustes configurado correctamente");
        } else {
            console.error("No se encontró el botón #btn-settings");
        }
        
        // Botón guardar ajustes
        var saveBtn = document.getElementById('settings-save');
        if (saveBtn) {
            saveBtn.onclick = function() {
                if (typeof settings !== 'undefined') {
                    settings.narrativo.system = document.getElementById('system-narrativo').value;
                    settings.narrativo.promptAnalisis = document.getElementById('analisis-narrativo').value;
                    settings.narrativo.promptVeredicto = document.getElementById('veredicto-narrativo').value;
                    settings.descriptivo.system = document.getElementById('system-descriptivo').value;
                    settings.descriptivo.promptAnalisis = document.getElementById('analisis-descriptivo').value;
                    settings.descriptivo.promptVeredicto = document.getElementById('veredicto-descriptivo').value;
                    localStorage.setItem('castroverde_profiles', JSON.stringify(settings));
                }
                saveBtn.innerText = '✓ Guardado';
                setTimeout(function() { saveBtn.innerText = 'Guardar ajustes'; }, 1500);
            };
        }
        
        // Botón cancelar
        var cancelBtn = document.getElementById('settings-cancel');
        if (cancelBtn) cancelBtn.onclick = window.closeSettings;
    });
})();
</script>

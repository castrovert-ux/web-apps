<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis · Castroverde · Claude</title>
  <style>
    /* ... mantén tus estilos aquí ... */
    /* Estilo esencial para el interruptor */
    .api-toggle-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .api-track { width: 32px; height: 16px; background: #ccc; border-radius: 8px; position: relative; transition: 0.3s; }
    .api-track.on { background: #8a2a2a; }
    .api-thumb { width: 12px; height: 12px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.3s; }
    .api-track.on .api-thumb { left: 18px; }
  </style>
</head>
<body>

<div id="api-toggle" class="api-toggle-container">
  <div id="api-track" class="api-track"><div class="api-thumb"></div></div>
  <span id="api-label" style="font-family:monospace; font-size:9px; text-transform:uppercase;">API OFF</span>
</div>

<script>
// --- NUEVA LÓGICA DE INTERRUPTOR ---
var isApiEnabled = localStorage.getItem('api_claude_enabled') === 'true';
var track = document.getElementById('api-track');
var label = document.getElementById('api-label');

function updateToggleState() {
  if (isApiEnabled) {
    track.classList.add('on');
    label.textContent = 'API ON';
  } else {
    track.classList.remove('on');
    label.textContent = 'API OFF';
  }
}

document.getElementById('api-toggle').addEventListener('click', function() {
  isApiEnabled = !isApiEnabled;
  localStorage.setItem('api_claude_enabled', isApiEnabled);
  updateToggleState();
});

// Inicialización
updateToggleState();

// --- INTEGRACIÓN CON EL RESTO DE TU CÓDIGO ---
// Busca en tu archivo original dónde haces la llamada a la API (fetch)
// Y asegúrate de envolverla así:
/*

      // tu llamada fetch original a Anthropic

      alert("La API está apagada. Por favor, actívala para analizar.");
  }
*/
</script>

</body>
</html>

                    </select>
                </div>

                <!-- Siglo -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">📅 SIGLO</label>

                    </div>
                </div>

                    <i class="fas fa-undo"></i> BORRAR FILTROS
                </button>
                <div class="text-sm text-gray-500">
                    <span id="resultCount" class="font-semibold text-blue-600">34</span> resultados

            </div>
        </div>

        <!-- RESULTADOS -->
        <div id="results" class="space-y-4">
            <!-- Se rellena con JavaScript -->
        </div>
    </div>

            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const seccion = document.getElementById('seccionSelect').value;
            const siglosSeleccionados = Array.from(document.getElementById('sigloSelect').selectedOptions).map(o => o.value);

            const filtered = dataset.filter(item => {
                // Filtro por texto
                const textMatch = !searchTerm || 
                    item.titulo.toLowerCase().includes(searchTerm) ||
                    item.resumen.toLowerCase().includes(searchTerm) ||
                    item.contenido_extendido.toLowerCase().includes(searchTerm) ||
                    item.tags.some(tag => tag.toLowerCase().includes(searchTerm));

                // Filtro por sección
                const seccionMatch = !seccion || item.seccion === seccion;

                // Filtro por siglo
                const sigloMatch = siglosSeleccionados.length === 0 || 
                    siglosSeleccionados.some(siglo => item.siglo.includes(siglo));

                // Filtro por etiquetas seleccionadas
                const tagsMatch = selectedTags.size === 0 || 
                    Array.from(selectedTags).every(tag => item.tags.includes(tag));

                return textMatch && seccionMatch && sigloMatch && tagsMatch;
            });

            renderResults(filtered);
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-12 text-center">
                        <p class="text-2xl text-gray-400">😕 No se encontraron resultados</p>
                        <p class="text-gray-500 mt-2">Prueba a quitar algún filtro</p>
                    </div>`;
                document.getElementById('resultCount').textContent = '0';
                return;
            }

            results.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl shadow-sm border border-gray-100 p-6 card-hover cursor-pointer';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 rounded-2xl">${item.seccion}</span>
                                <span class="text-xs text-gray-400">${item.siglo}</span>
                            </div>
                            <h3 class="text-xl font-semibold mt-3">${item.titulo}</h3>
                            <p class="text-gray-600 mt-2 line-clamp-3">${item.resumen}</p>
                        </div>
                        <div class="text-right text-sm text-gray-400 whitespace-nowrap">
                            📍 ${item.titulo.match(/págs?\.\s*([\d-]+)/)?.[1] || '—'}
                        </div>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-1">
                        ${item.tags.map(tag => `<span onclick="event.stopImmediatePropagation(); toggleTag('${tag}')" class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded-2xl cursor-pointer">${tag}</span>`).join('')}
                    </div>
                `;
                card.onclick = () => showDetail(item);
                container.appendChild(card);
            });

            document.getElementById('resultCount').textContent = results.length;
        }

        function showDetail(item) {
            document.getElementById('modalTitle').textContent = item.titulo;
            document.getElementById('modalMeta').innerHTML = `
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-2xl text-xs">${item.seccion}</span>
                <span class="ml-3 text-sm">${item.siglo} • ${item.titulo.match(/págs?\.\s*([\d-]+)/)?.[1] || ''}</span>
            `;
            document.getElementById('modalContent').innerHTML = `
                <p class="text-lg font-medium mb-4">${item.resumen}</p>
                <div class="prose text-gray-700">${item.contenido_extendido}</div>
                <div class="mt-8 pt-6 border-t flex flex-wrap gap-2">
                    ${item.tags.map(tag => `<span class="px-4 py-1 text-xs bg-gray-100 rounded-3xl">${tag}</span>`).join('')}
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // ==================== FILTROS DINÁMICOS ====================
        function populateFilters() {
            // Secciones
            const secciones = [...new Set(dataset.map(i => i.seccion))];
            const seccionSelect = document.getElementById('seccionSelect');
            secciones.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                seccionSelect.appendChild(opt);
            });

            // Siglos únicos
            const siglos = [...new Set(dataset.map(i => i.siglo))].sort();
            const sigloSelect = document.getElementById('sigloSelect');
            siglos.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sigloSelect.appendChild(opt);
            });

            // Tags únicas
            let allTags = new Set();
            dataset.forEach(item => item.tags.forEach(t => allTags.add(t)));
            allTags = Array.from(allTags).sort();

            const tagsContainer = document.getElementById('tagsContainer');
            allTags.forEach(tag => {
                const chip = document.createElement('div');
                chip.className = 'px-4 py-1 text-xs bg-white border border-gray-200 hover:border-blue-300 rounded-3xl cursor-pointer transition-colors flex items-center gap-1';
                chip.innerHTML = `<i class="fas fa-tag text-[10px]"></i> ${tag}`;
                chip.onclick = () => toggleTag(tag, chip);
                tagsContainer.appendChild(chip);
            });
        }

        function toggleTag(tag, element) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                if (element) element.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            } else {
                selectedTags.add(tag);
                if (element) element.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
            }
            filterData();
        }

        function resetFilters() {
            selectedTags.clear();
            document.getElementById('searchInput').value = '';
            document.getElementById('seccionSelect').value = '';
            document.getElementById('sigloSelect').selectedIndex = -1;
            document.querySelectorAll('#tagsContainer > div').forEach(el => {
                el.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            });
            filterData();
        }

        // ==================== INICIO ====================
        window.onload = () => {
            populateFilters();
            renderResults(dataset); // mostrar todo al principio

            // Live filtering
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('seccionSelect').addEventListener('change', filterData);
            document.getElementById('sigloSelect').addEventListener('change', filterData);
        };
    </script>
</body>
</html>

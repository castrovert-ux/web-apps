<body>
  <h1>📜 Castroverde de Cerrato - Buscador de Costumbres</h1>
  <p style="text-align:center;">Filtra por siglo para encontrar pinceladas de vida cotidiana, organización municipal y costumbres para tu libro</p>

  <div class="controls">

    <input type="text" id="busqueda" placeholder="Buscar en título, resumen o tags..." style="width: 300px;">

    <button onclick="filtrar()">🔍 Buscar</button>
    <button onclick="limpiar()">Limpiar</button>

      {"id":"cv_soc_006","seccion":"SOCIEDAD Y COSTUMBRES","titulo":"Fiestas, costumbres y actos comunitarios (págs. 207-220)","resumen":"Descripción de las formas de reunión concejil...","siglo":"XV-XIX","siglos":["XV","XVI","XVII","XVIII","XIX"],"tags":["Fiestas","Tradiciones"]}
    ];

    function filtrar() {
      const sigloSeleccionado = document.getElementById("sigloSelect").value;
      const texto = document.getElementById("busqueda").value.toLowerCase().trim();

      const tbody = document.querySelector("#resultados tbody");
      tbody.innerHTML = "";

      const filtrados = dataset.filter(item => {
        const coincideSiglo = !sigloSeleccionado || item.siglos.includes(sigloSeleccionado);
        const coincideTexto = !texto || 
          item.titulo.toLowerCase().includes(texto) ||
          item.resumen.toLowerCase().includes(texto) ||
          item.tags.some(tag => tag.toLowerCase().includes(texto));
        return coincideSiglo && coincideTexto;
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">No se encontraron resultados</td></tr>`;
        return;
      }

      filtrados.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.id}</td>
          <td class="seccion">${item.seccion}</td>
          <td><strong>${item.titulo}</strong></td>
          <td>${item.resumen}</td>
          <td class="siglos">${item.siglos.join(" · ")}</td>
          <td>${item.tags.join(", ")}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function limpiar() {
      document.getElementById("sigloSelect").value = "";
      document.getElementById("busqueda").value = "";
      filtrar();
    }

    // Cargar todas las entradas al abrir
    window.onload = filtrar;
  </script>
</body>
</html>

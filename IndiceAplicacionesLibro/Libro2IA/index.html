<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castroverde - Buscador de Costumbres</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { text-align: center; color: #2c3e50; }
    .controls { text-align: center; margin: 20px 0; }
    select, input, button { padding: 10px; margin: 5px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; vertical-align: top; }
    th { background: #34495e; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .seccion { font-weight: bold; color: #2980b9; }
    .siglos { font-size: 0.9em; color: #e67e22; }
    .expandible { cursor: pointer; }
    .contenido { display: none; background: #f8f9fa; padding: 15px; border-top: 1px solid #ddd; font-size: 0.95em; }
    .visible { display: table-row; }
  </style>
</head>
<body>
  <h1>📜 Castroverde de Cerrato - Buscador de Costumbres</h1>
  <p style="text-align:center;">Filtra por siglo o busca cualquier término (incluyendo nombres como Álvaro de Bazán)</p>

  <div class="controls">
    <select id="sigloSelect">
      <option value="">Todos los siglos</option>
      <option value="XI">Siglo XI</option>
      <option value="XII">Siglo XII</option>
      <option value="XIII">Siglo XIII</option>
      <option value="XIV">Siglo XIV</option>
      <option value="XV">Siglo XV</option>
      <option value="XVI">Siglo XVI</option>
      <option value="XVII">Siglo XVII</option>
      <option value="XVIII">Siglo XVIII</option>
      <option value="XIX">Siglo XIX</option>
      <option value="XX">Siglo XX</option>
    </select>

    <input type="text" id="busqueda" placeholder="Buscar cualquier término (ej: Álvaro de Bazán, vendimia, montes...)" style="width: 380px;">

    <button onclick="filtrar()">🔍 Buscar</button>
    <button onclick="limpiar()">Limpiar</button>
  </div>

  <table id="resultados">
    <thead>
      <tr>
        <th>ID</th>
        <th>Sección</th>
        <th>Título (Páginas)</th>
        <th>Resumen</th>
        <th>Siglos</th>
        <th>Tags</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const dataset = [ /* Aquí va todo el dataset que te di antes, con los 34 registros */ 
      // ... (para no hacer el mensaje demasiado largo, copio solo las partes clave, pero en tu archivo debes pegar TODO el array dataset completo que te di en el mensaje anterior)
    ];

    // Función para normalizar texto (quitar tildes y pasar a minúsculas)
    function normalizar(texto) {
      return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function filtrar() {
      const sigloSeleccionado = document.getElementById("sigloSelect").value;
      const textoBuscado = normalizar(document.getElementById("busqueda").value.trim());

      const tbody = document.querySelector("#resultados tbody");
      tbody.innerHTML = "";

      const filtrados = dataset.filter(item => {
        const coincideSiglo = !sigloSeleccionado || item.siglos.includes(sigloSeleccionado);

        if (!textoBuscado) return coincideSiglo;

        const textoNormalizado = normalizar(item.titulo + " " + item.resumen + " " + item.tags.join(" ") + " " + (item.contenido_extendido || ""));
        return coincideSiglo && textoNormalizado.includes(textoBuscado);
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">No se encontraron resultados</td></tr>`;
        return;
      }

      filtrados.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "expandible";
        tr.innerHTML = `
          <td>${item.id}</td>
          <td class="seccion">${item.seccion}</td>
          <td><strong>${item.titulo}</strong></td>
          <td>${item.resumen}</td>
          <td class="siglos">${item.siglos.join(" · ")}</td>
          <td>${item.tags.join(", ")}</td>
        `;

        // Fila para el contenido extendido (oculta inicialmente)
        const trContenido = document.createElement("tr");
        trContenido.className = "contenido";
        trContenido.innerHTML = `<td colspan="6"><strong>Contenido extendido:</strong><br>${item.contenido_extendido || "No disponible"}</td>`;

        tr.onclick = () => trContenido.classList.toggle("visible");

        tbody.appendChild(tr);
        tbody.appendChild(trContenido);
      });
    }

    function limpiar() {
      document.getElementById("sigloSelect").value = "";
      document.getElementById("busqueda").value = "";
      filtrar();
    }

    // Cargar todas al abrir
    window.onload = filtrar;
  </script>
</body>
</html>

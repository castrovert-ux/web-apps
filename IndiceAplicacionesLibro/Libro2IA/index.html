    function normalizar(texto) {
      return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function filtrar() {
      const sigloSeleccionado = document.getElementById("sigloSelect").value;
      const textoBuscado = normalizar(document.getElementById("busqueda").value.trim());

      const tbody = document.querySelector("#resultados tbody");
      tbody.innerHTML = "";

      const filtrados = dataset.filter(item => {
        const coincideSiglo = !sigloSeleccionado || item.siglos.includes(sigloSeleccionado);
        if (!textoBuscado) return coincideSiglo;

        const textoCompleto = normalizar(item.titulo + " " + item.resumen + " " + (item.contenido_extendido || "") + " " + item.tags.join(" "));
        return coincideSiglo && textoCompleto.includes(textoBuscado);
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:#e74c3c;">No se encontraron resultados</td></tr>`;
        return;
      }

      filtrados.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "expandible";
        tr.innerHTML = `
          <td>${item.id}</td>
          <td class="seccion">${item.seccion}</td>
          <td><strong>${item.titulo}</strong></td>
          <td>${item.resumen}</td>
          <td class="siglos">${item.siglos.join(" · ")}</td>
          <td>${item.tags.join(", ")}</td>
          <td><button class="pdf-btn" onclick="event.stopImmediatePropagation(); window.open('${item.pdf}', '_blank')">📄 Ver PDF</button></td>
        `;

        const trContenido = document.createElement("tr");
        trContenido.className = "contenido";
        trContenido.innerHTML = `<td colspan="7"><strong>Contenido extendido:</strong><br>${item.contenido_extendido || "No disponible"}</td>`;

        tr.onclick = () => trContenido.classList.toggle("visible");

        tbody.appendChild(tr);
        tbody.appendChild(trContenido);
      });
    }

    function limpiar() {
      document.getElementById("sigloSelect").value = "";
      document.getElementById("busqueda").value = "";
      filtrar();
    }

    window.onload = filtrar;
  </script>
</body>

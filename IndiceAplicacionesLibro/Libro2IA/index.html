<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castroverde Digital · Explorador Histórico</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --oro: #b89a5a;
            --fondo: #fdfbf7;
            --texto: #2c2c2c;
            --borde: #e0d7c6;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--oro);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin: 0;
            color: #1a1a1a;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 1px solid var(--borde);
            background: white;
            font-family: 'EB Garamond', serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .result-card {
            background: white;
            border: 1px solid var(--borde);
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            border-color: var(--oro);
            box-shadow: 0 5px 15px rgba(184, 154, 90, 0.1);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #8a6e2f;
            margin: 0;
        }

        .result-meta {
            font-size: 0.9rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .details.active {
            display: block;
        }

        .label {
            font-weight: bold;
            color: var(--oro);
            display: block;
            margin-top: 10px;
        }

        .tag-container {
            margin-top: 15px;
        }

        .tag {
            display: inline-block;
            background: #f0ede6;
            padding: 2px 10px;
            font-size: 0.85rem;
            margin-right: 5px;
            border-radius: 3px;
            color: #555;
        }

        .highlight {
            background-color: #fff9c4;
            padding: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Archivo Digital de Castroverde</h1>
        <p>Explorador del conocimiento histórico y social</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Busca apellidos, lugares, oficios o eventos...">

    <div id="results"></div>
</div>

<script>
    let dataset = [];

    // Cargar el JSON (Asegúrate de que el archivo se llame exactamente así)
    fetch('dataset_castroverde-CON CONTENIDO DE TODO EL LIBRO.json')
        .then(response => response.json())
        .then(data => {
            dataset = data;
            renderResults(dataset);
        });

    const searchInput = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('results');

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = dataset.filter(item => 
            item.titulo.toLowerCase().includes(term) ||
            item.contenido_extendido.toLowerCase().includes(term) ||
            item.tags.some(t => t.toLowerCase().includes(term)) ||
            item.seccion.toLowerCase().includes(term)
        );
        renderResults(filtered);
    });

    function renderResults(data) {
        resultsDiv.innerHTML = '';
        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.onclick = () => toggleDetails(index);

            card.innerHTML = `
                <div class="result-header">
                    <h3 class="result-title">${item.titulo}</h3>
                    <span class="result-meta">${item.siglo}</span>
                </div>
                <div style="color: #666; margin-top: 5px;">${item.seccion}</div>
                
                <div id="details-${index}" class="details">
                    <span class="label">RESUMEN HISTÓRICO:</span>
                    <p>${item.resumen}</p>
                    
                    <span class="label">CONTENIDO DETALLADO:</span>
                    <p style="text-align: justify;">${item.contenido_extendido}</p>
                    
                    <div class="tag-container">
                        ${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                    </div>
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function toggleDetails(index) {
        const detailBox = document.getElementById(`details-${index}`);
        detailBox.classList.toggle('active');
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castroverde Data Hub</title>
    <style>
        :root { --p: #1a1a2e; --a: #e94560; --bg: #0f3460; --w: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--p); color: var(--w); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #0f3460; margin-bottom: 20px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        select, input, textarea { background: #1a1a2e; color: white; border: 1px solid #e94560; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; }
        label { display: block; margin-bottom: 5px; font-size: 0.8em; color: #999; text-transform: uppercase; }
        
        .btn { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--a); color: white; }
        .btn-main:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn-sec { background: #0f3460; color: white; border: 1px solid var(--a); }

        .block-item { background: #1a1a2e; border: 1px solid #0f3460; margin: 10px 0; padding: 15px; border-radius: 8px; display: flex; align-items: flex-start; gap: 15px; transition: 0.2s; }
        .block-item:hover { border-color: var(--a); }
        .block-id { font-family: monospace; color: var(--a); font-weight: bold; }
        .block-content { flex-grow: 1; }
        .block-content h4 { margin: 0 0 5px 0; color: #fff; }
        .block-content p { margin: 0; font-size: 0.9em; color: #ccc; }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; padding: 10px; background: #0f3460; border-radius: 8px; }
        .tag-item { font-size: 0.75em; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .sticky-bar { position: sticky; top: 0; z-index: 1000; background: var(--p); padding: 10px 0; border-bottom: 2px solid var(--a); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        #jsonEditor { display: none; }
        .badge { font-size: 0.7em; background: var(--a); padding: 2px 6px; border-radius: 4px; margin-left: 10px; }
        
        .custom-prompt-card { background: #1a1a2e; border: 2px dashed #e94560; }
    </style>
</head>
<body>

<div class="container">
    <div class="sticky-bar">
        <div>
            <strong>Castroverde Hub</strong>
            <span id="counter" class="badge">0</span>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-main" onclick="generarPromptContextual()">Generar Prompt Contextual</button>
            <button class="btn btn-sec" onclick="copyOnlyIDs()">Copiar IDs</button>
        </div>
    </div>

    <div class="card">
        <div class="filter-grid">
            <div>
                <label>Buscador Global</label>
                <input type="text" id="searchTerm" placeholder="Ej: 'adobe' o 'impuesto'..." oninput="applyFilters()">
            </div>
            <div>
                <label>Siglos</label>
                <select id="filterSiglo" multiple size="3" onchange="applyFilters()"></select>
            </div>
            <div>
                <label>Tema</label>
                <select id="filterTema" onchange="applyFilters()"><option value="">Todos</option></select>
            </div>
            <div>
                <label>Subtema</label>
                <select id="filterSubtema" onchange="applyFilters()"><option value="">Todos</option></select>
            </div>
        </div>
        <div id="tagCloud" class="tag-cloud"></div>
        <div style="margin-top:15px; display:flex; gap:10px;">
            <button class="btn btn-sec" style="flex:1" onclick="resetFilters()">Resetear</button>
            <button class="btn btn-sec" style="flex:1" onclick="toggleEditor()">Cargar Datos</button>
        </div>
    </div>

    <!-- Caja de instrucción personalizada -->
    <div class="card custom-prompt-card">
        <label>Instrucción o pregunta específica</label>
        <textarea id="customInstruction" rows="4" 
                  placeholder="Ej: Dame un punto resumido para un libro narrativo sobre la vida comunitaria y los consejos durante el siglo XV..."></textarea>
        <small style="color:#999; display:block; margin-top:5px;">
            Esta instrucción se añadirá al prompt final
        </small>
    </div>

    <div id="jsonEditor" class="card">
        <textarea id="jsonInput" placeholder="Pega aquí tu JSON completo..."></textarea>
        <button class="btn btn-main" style="margin-top:10px" onclick="saveData()">Guardar en LocalStorage</button>
    </div>

    <div id="resultsList"></div>
</div>

<script>
    let currentData = [];   // Aquí se guardan todos los bloques

    window.onload = () => {
        const saved = localStorage.getItem('cv_final_data');
        if(saved) {
            currentData = JSON.parse(saved);
            initApp();
        } else {
            toggleEditor();
        }
    };

    function initApp() {
        populateSelectors();
        applyFilters();
    }

    function populateSelectors() {
        const siglos = new Set(), temas = new Set(), subtemas = new Set(), tags = new Set();
        currentData.forEach(b => {
            if(b.siglo && b.siglo.principal) b.siglo.principal.forEach(s => siglos.add(s));
            temas.add(b.tema);
            subtemas.add(b.subtema);
            if(b.tags) b.tags.forEach(t => tags.add(t));
        });

        const fill = (id, set, isMulti = false) => {
            const el = document.getElementById(id);
            el.innerHTML = isMulti ? '' : '<option value="">Todos</option>';
            Array.from(set).sort().forEach(v => el.innerHTML += `<option value="${v}">${v}</option>`);
        };

        fill('filterSiglo', siglos, true);
        fill('filterTema', temas);
        fill('filterSubtema', subtemas);

        const cloud = document.getElementById('tagCloud');
        cloud.innerHTML = '';
        Array.from(tags).sort().forEach(t => {
            cloud.innerHTML += `<label class="tag-item"><input type="checkbox" class="t-chk" value="${t}" onchange="applyFilters()"> ${t}</label>`;
        });
    }

    function applyFilters() {
        const search = document.getElementById('searchTerm').value.toLowerCase();
        const sigs = Array.from(document.getElementById('filterSiglo').selectedOptions).map(o => o.value);
        const tema = document.getElementById('filterTema').value;
        const sub = document.getElementById('filterSubtema').value;
        const tags = Array.from(document.querySelectorAll('.t-chk:checked')).map(c => c.value);

        const filtered = currentData.filter(b => {
            const textMatch = !search || JSON.stringify(b).toLowerCase().includes(search);
            const sigloMatch = sigs.length === 0 || (b.siglo && b.siglo.principal && b.siglo.principal.some(s => sigs.includes(s)));
            const temaMatch = !tema || b.tema === tema;
            const subMatch = !sub || b.subtema === sub;
            const tagMatch = tags.length === 0 || (b.tags && tags.some(t => b.tags.includes(t)));
            return textMatch && sigloMatch && temaMatch && subMatch && tagMatch;
        });

        render(filtered);
    }

    function render(data) {
        const list = document.getElementById('resultsList');
        document.getElementById('counter').innerText = data.length;
        list.innerHTML = data.map(b => `
            <div class="block-item">
                <input type="checkbox" class="sel-blk" value="${b.id}">
                <div class="block-content">
                    <span class="block-id">${b.id}</span>
                    <h4>${b.titulo}</h4>
                    <p>${b.resumen_corto || (b.texto ? b.texto.substring(0, 120) + '...' : '')}</p>
                </div>
            </div>
        `).join('');
    }

    // ====================== NUEVA FUNCIÓN SOLICITADA ======================
    function generarPromptContextual() {
        const seleccionados = Array.from(document.querySelectorAll('.sel-blk:checked'));
        
        if (seleccionados.length === 0) {
            alert("Por favor, selecciona al menos un bloque.");
            return;
        }

        let bloquesTexto = "";

        seleccionados.forEach(checkbox => {
            const idBuscado = checkbox.value;
            const infoCompleta = currentData.find(item => item.id === idBuscado);
            
            if (infoCompleta) {
                bloquesTexto += `--- BLOQUE: ${infoCompleta.id} (${infoCompleta.titulo}) ---\n`;
                bloquesTexto += `CONTENIDO: ${infoCompleta.texto || "Sin texto disponible"}\n\n`;
            }
        });

        const instruccionPersonalizada = document.getElementById('customInstruction').value.trim();

        const promptFinal = `Actúa como historiador experto en Castroverde de Cerrato. Utiliza como base exclusiva la información de estos bloques de mi dataset:

${bloquesTexto}
Instrucción específica: ${instruccionPersonalizada || "Analiza estos datos con frases cortas y directas, integrando las fechas y nombres en el relato. Evita el tono académico y busca un cierre visual y concreto. Cruza la información y genera una síntesis."}`;

        navigator.clipboard.writeText(promptFinal).then(() => {
            alert("¡Prompt completo copiado al portapapeles!\n\nYa puedes pegarlo directamente en Grok, Claude o ChatGPT.");
        });
    }

    function copyOnlyIDs() {
        const ids = Array.from(document.querySelectorAll('.sel-blk:checked')).map(cb => cb.value).join(', ');
        navigator.clipboard.writeText(ids).then(() => alert("IDs copiados"));
    }

    function saveData() {
        try {
            const data = JSON.parse(document.getElementById('jsonInput').value);
            localStorage.setItem('cv_final_data', JSON.stringify(data));
            currentData = data;
            initApp();
            toggleEditor();
            alert("Datos cargados correctamente");
        } catch(e) { alert("Error en el JSON"); }
    }

    function toggleEditor() {
        const ed = document.getElementById('jsonEditor');
        ed.style.display = ed.style.display === 'block' ? 'none' : 'block';
    }

    function resetFilters() {
        document.getElementById('searchTerm').value = '';
        document.getElementById('filterSiglo').selectedIndex = -1;
        document.getElementById('filterTema').value = '';
        document.getElementById('filterSubtema').value = '';
        document.querySelectorAll('.t-chk').forEach(c => c.checked = false);
        applyFilters();
    }
</script>
</body>
</html>

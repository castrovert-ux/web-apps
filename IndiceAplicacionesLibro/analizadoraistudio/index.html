  <style>
    :root {
      --bg:#fdf0f0; --surface:#f5e4e4; --card:#eed8d8; --border:#d4aaaa;
      --text:#3a1a1a; --muted:#8a5a5a; --accent:#8a2a2a; --accent2:#b05070;
      --red:#c45a3a; --blue:#3a7ab0; --green:#2a7a4a;
      --cloud:#4A90D9;
      --font-h:'Playfair Display',Georgia,serif;
      --font-body:'Source Serif 4',Georgia,serif;
      --font-ui:'DM Mono',monospace;
      --radius:3px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.7;display:flex;flex-direction:column;}

    /* Sync bar */
    #sync-bar{
      flex-shrink:0;background:var(--text);
      display:flex;align-items:center;justify-content:flex-end;gap:10px;
      padding:5px 18px;border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .btn-sync{
      background:none;border:1px solid rgba(74,144,217,0.4);color:#7eb8f0;
      padding:4px 11px;border-radius:20px;cursor:pointer;
      font-family:var(--font-ui);font-size:9px;letter-spacing:1px;text-transform:uppercase;
      transition:background .2s,color .2s,border-color .2s;white-space:nowrap;
      display:flex;align-items:center;gap:5px;
    }
    .btn-sync:hover{background:var(--cloud);color:#fff;border-color:var(--cloud);}
    .btn-sync.synced{border-color:rgba(42,122,74,0.5);color:#7ec87f;}
    .btn-sync.synced:hover{background:var(--green);color:#fff;border-color:var(--green);}
    .btn-sync.syncing{opacity:.6;cursor:default;pointer-events:none;}
    .sync-user-text{font-family:var(--font-ui);font-size:8px;color:rgba(255,255,255,.35);letter-spacing:1px;}
    .btn-signout{background:none;border:none;cursor:pointer;font-family:var(--font-ui);font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.25);padding:2px 6px;border-radius:3px;transition:color .15s,background .15s;text-transform:uppercase;}
    .btn-signout:hover{color:var(--red);background:rgba(196,90,58,.1);}
    #sync-status{
      flex-shrink:0;padding:5px 18px;font-family:var(--font-ui);font-size:9px;
      letter-spacing:1px;text-transform:uppercase;display:none;
      align-items:center;justify-content:space-between;gap:10px;
    }
    #sync-status.visible{display:flex;}
    #sync-status.ok{background:rgba(42,122,74,.12);color:var(--green);}
    #sync-status.err{background:rgba(196,90,58,.1);color:var(--red);}
    #sync-status.info{background:rgba(74,144,217,.1);color:var(--cloud);}
    .sync-status-close{background:none;border:none;cursor:pointer;color:inherit;opacity:.6;font-size:12px;padding:0 3px;}
    .sync-status-close:hover{opacity:1;}

    /* Cabecera con selector de modo */
    header{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<script>
// 1. MANTENEMOS TU CONFIGURACIÓN DE FIREBASE EXACTAMENTE IGUAL
var FB_API_KEY = localStorage.getItem('castroverde_fb_key') || '';
// ... (Toda tu lógica de initFirebase, fbAuth, etc. debe seguir igual)

// 2. CAMBIOS ESPECÍFICOS PARA GROQ
var API_KEY = localStorage.getItem('castroverde_api_key') || '';
var MODEL = 'llama-3.3-70b-versatile'; // Modelo de Groq
var MAX_TOKENS = 2048;

// Función de llamada adaptada a Groq (Compatible con OpenAI)
function callGroq(msg, onOk, onErr) {
  if (!API_KEY) {
    onErr('No hay clave API de Groq configurada.');
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + API_KEY);
  xhr.timeout = 60000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var data = JSON.parse(xhr.responseText);
      if (xhr.status >= 200 && xhr.status < 300) {
        // Formato de respuesta de Groq
        var txt = data.choices[0].message.content;
        onOk(txt);
      } else {
        onErr((data.error && data.error.message) ? data.error.message : 'Error ' + xhr.status);
      }
    } catch (e) {
      onErr('Error en la respuesta de la API.');
    }
  };

  xhr.send(JSON.stringify({
    model: MODEL,
    messages: [
      { role: 'system', content: buildSystem() }, // Usamos tu función buildSystem original
      { role: 'user', content: msg }
    ],
    temperature: 0.7
  }));
}

// 3. RECONECTAR TUS FUNCIONES DE ANÁLISIS
// En lugar de callClaude, ahora usamos callGroq en tus funciones originales:

function analyzeText() {
  var text = get('input-text').value.trim();
  if (!text) return;
  
  showLoading('Analizando con Groq...'); 
  var msg = buildMsg(text, get('notes-text').value.trim(), get('analysis-type').value, get('instruc-fragmento').value.trim());

  // Aquí cambiamos la llamada:
  callGroq(msg, function(response) {
    hideLoading();
    // Aquí sigue todo tu proceso original de parseo de JSON y renderizado
    // (Asegúrate de mantener el código de limpieza de backticks que tenías)
  }, function(err) {
    hideLoading();
    showError(err);
  });
}

// 4. ACTUALIZAR LOS LISTENERS DE LOS MODALES
// Asegúrate de que el botón de guardar la API Key ahora no busque el prefijo "sk-ant-"
get('modal-btn-save').addEventListener('click', function() {
  var val = get('modal-key-input').value.trim();
  if (!val) return;
  API_KEY = val;
  localStorage.setItem('castroverde_api_key', val);
  updateKeyStatus();
  closeApiKeyModal();
});

// MANTÉN EL RESTO DE TUS FUNCIONES (get, buildSystem, renderResult, etc.) TAL CUAL ESTABAN
</script>
</body>
</html>
